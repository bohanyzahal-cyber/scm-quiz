{t:"חיזוי עונתי",s:"ניצן",q:"מקדמי העונתיות של מוצר בחמש עונות הם 0.98, 1.176, 1.667, 0.392 ו-0.784. מה משמעות המקדם של עונה 2?",o:["הביקוש בעונה 2 גבוה ב-1.176% מהביקוש בעונה 1","הביקוש בעונה 2 מהווה 17.6% מסך הביקוש במחזור","הביקוש בעונה 2 נמוך ב-17.6% מהממוצע הבין-עונתי","הביקוש בעונה 2 גבוה ב-17.6% מהממוצע הבין-עונתי"],c:3,e:"מקדם עונתיות הוא יחס הביקוש בעונה לממוצע הבין-עונתי: <bdi dir='ltr'>Cj = Dj / D̄</bdi>. מקדם 1.176 פירושו ביקוש גבוה ב-17.6% מהממוצע; מקדם 0.98 (עונה 1) — ביקוש נמוך ב-2% מהממוצע. (מצגת 3, שקף 7)"},
{t:"חיזוי עונתי",s:"ניצן",q:"מה נכון לגבי סכום מקדמי העונתיות במחזור של <bdi dir='ltr'>N</bdi> עונות?",o:["הסכום שווה ל-<bdi dir='ltr'>N</bdi> — מספר העונות במחזור","הסכום שווה לממוצע הביקוש הבין-עונתי","הסכום שווה ל-1, כמו סכום של הסתברויות","הסכום משתנה לפי עוצמת העונתיות"],c:0,e:"המקדמים מוגדרים כך שבמחזור של <bdi dir='ltr'>N</bdi> עונות מתקיים <bdi dir='ltr'>ΣCj = N</bdi> (בדוגמה עם 5 עונות: 0.98 + 1.176 + 1.667 + 0.392 + 0.784 = 5). לכן הממוצע שלהם הוא 1 — עונה ״ממוצעת״. (מצגת 3, שקף 8)"},
{t:"חיזוי עונתי",s:"ניצן",q:"לפי כלל האצבע של מבחן העונתיות, מתי מגדירים את התנהגות הצריכה כעונתית?",o:["כשלפחות אחד ממקדמי העונתיות הממוצעים גבוה מ-1.5 ו/או נמוך מ-0.5","כשלפחות אחד ממקדמי העונתיות הממוצעים גבוה מ-1.2 ו/או נמוך מ-0.8","כשכל מקדמי העונתיות הממוצעים גבוהים מ-1.2 או נמוכים מ-0.8","כשסכום מקדמי העונתיות הממוצעים גבוה ממספר העונות במחזור"],c:1,e:"שקף 10: מחשבים מקדם עונתיות לכל עונה בכל שנה, ממצעים עונות מקבילות, ואם לפחות אחד מהמקדמים הממוצעים גבוה מ-1.2 ו/או נמוך מ-0.8 — ההתנהגות עונתית. בדוגמת הפיתות התקבלו 1.43, 0.97, 0.67, 0.93 — ולכן ״פיתות״ עונתי מובהק. (מצגת 3, שקפים 9–10)"},
{t:"חיזוי עונתי",s:"ניצן",q:"ככל שמקדם עונתיות רחוק יותר מ-1 (לשני הכיוונים), מה ניתן לומר?",o:["הביקוש באותה עונה אינו צפוי ולכן אין לחזות אותו","עוצמת העונתיות חזקה ומובהקת יותר","יש לטעות בחישוב, כי המקדם צריך להיות קרוב ל-1","המגמה בין המחזורים חזקה יותר"],c:1,e:"שקף 8: מקדמים גבוהים מ-1 — ביקוש גבוה מהממוצע הבין-עונתי; נמוכים מ-1 — ביקוש נמוך ממנו; ככל שהמרחק מ-1 גדול יותר, עוצמת העונתיות חזקה ומובהקת יותר. (מצגת 3, שקף 8)"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"מהי הנחת היסוד של שיטת הדה-קומפוזיציה (פירוק) לחיזוי עונתי?",o:["העונתיות משתנה בין המחזורים, ולכן מחשבים מקדם נפרד לכל מחזור","אין מגמה בין המחזורים, ולכן מספיק לחשב ממוצע פשוט של כל הנתונים","הגידול או הקיטון קיים רק בין המחזורים, ובתוך המחזור העונתיות קבועה בזמן","הגידול קיים גם בתוך המחזור, ולכן מקדמי העונתיות משתנים מעונה לעונה בכל שנה"],c:2,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>שקף 12: הנחת היסוד — הגידול/קיטון קיים רק בין המחזורים, כשבתוך המחזור העונתיות קבועה בזמן. מוצאים את קו המגמה של המחזורים, ולתחזית לתקופה בתוך מחזור מכפילים במקדם העונתיות הקבוע. (מצגת 3, שקף 12)"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"מהו הרעיון המרכזי בדה-קומפוזיציה?",o:["לחשב את קו המגמה ישירות מהנתונים הגולמיים, ואחר כך להוסיף לו את מקדמי העונתיות בפעולת חיבור","להשמיט את העונות החריגות ולחשב רגרסיה ליניארית רק על העונות הקרובות לממוצע","לחלק את הנתונים לשני חלקים שווים ולחזות כל חלק בנפרד בשיטת ממוצע נע משוקלל","לנטרל גורם אחד מהנתונים כדי לחשב את השני: לנטרל עונתיות לחישוב המגמה, ומגמה לחישוב העונתיות"],c:3,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>שקף 13: הרעיון — לנטרל גורם אחד ולחשב את השני ולהיפך: (1) נטרול העונתיות לצורך חישוב קו המגמה; (2) נטרול קו המגמה לצורך חישוב העונתיות. תהליך העבודה: ממוצע לכל מחזור ← חלוקת כל נתון בממוצע המחזור שלו (מקדמי עונתיות) ← חלוקת כל נתון במקדם העונתיות (נרמול). (מצגת 3, שקף 13)"},
{t:"חיזוי עונתי",s:"ניצן",q:"כשהביקוש גדל משנה לשנה, כיצד מחשבים את מקדמי העונתיות (למשל לצורך מבחן העונתיות)?",o:["מחסירים מכל נתון את ממוצע המחזור שלו, ומסכמים את ההפרשים של כל עונה","מחלקים כל נתון בממוצע הכללי של כל הנתונים, בלי להתייחס למחזורים","מחלקים כל נתון בממוצע המחזור שלו, וממצעים את המקדמים של עונות מקבילות","מחלקים כל נתון במקדם העונתיות שלו, וממצעים את הערכים המנורמלים בכל מחזור"],c:2,e:"שלב 2 בתהליך: ניטרול תופעת הגדילה ממחזור למחזור וחישוב מקדמי העונתיות — חלוקת כל נתון בממוצע המחזור המתאים לו, וחישוב ממוצע. חלוקה במקדם העונתיות (המסיח הראשון) היא שלב 3 — הנרמול, שבא אחרי שיש מקדמים. (מצגת 3, שקפים 13, 15–16)"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"בדה-קומפוזיציה, מהם <bdi dir='ltr'>X</bdi> ו-<bdi dir='ltr'>Y</bdi> ברגרסיה שמחשבת את קו המגמה?",o:["<bdi dir='ltr'>X</bdi> — מספר המחזור; <bdi dir='ltr'>Y</bdi> — ממוצע המחזור של הביקוש הגולמי","<bdi dir='ltr'>X</bdi> — מספר התקופה (1 עד <bdi dir='ltr'>n</bdi>); <bdi dir='ltr'>Y</bdi> — הביקוש הגולמי בכל תקופה","<bdi dir='ltr'>X</bdi> — מקדם העונתיות; <bdi dir='ltr'>Y</bdi> — הביקוש המנורמל בכל עונה","<bdi dir='ltr'>X</bdi> — מספר המחזור; <bdi dir='ltr'>Y</bdi> — ממוצע המחזור המנורמל"],c:3,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>שקף 18: ״נחשב את קו המגמה בין המחזורים באמצעות רגרסיה ליניארית כאשר מספר המחזור ייצג את <bdi dir='ltr'>X</bdi> וממוצע המחזור המנורמל ייצג את <bdi dir='ltr'>Y</bdi>״. רגרסיה על ממוצעי המחזורים הגולמיים (המסיח השני) היא ״השיטה הפשוטה״. (מצגת 3, שקפים 18, 20)"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"מה ההבדל העיקרי בין ״השיטה הפשוטה״ לחיזוי עונתי לבין הדה-קומפוזיציה?",o:["בשיטה הפשוטה משתמשים בממוצע נע משוקלל של המחזורים במקום ברגרסיה ליניארית","בשיטה הפשוטה לא מכפילים במקדמי העונתיות בסוף, ולכן אין צורך לחשב אותם כלל","בשיטה הפשוטה מחשבים רגרסיה על כל התקופות, עם <bdi dir='ltr'>X = 1</bdi> עד <bdi dir='ltr'>n</bdi>, בלי לחלק למחזורים","בשיטה הפשוטה הרגרסיה מחושבת על ממוצעי המחזורים הגולמיים, בלי לנרמל את הנתונים"],c:3,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>שקף 20 — השיטה הפשוטה: ממוצע ביקושים בכל מחזור (״נציג המחזור״) ← רגרסיה ליניארית על הנציגים ← תחזית לכל מחזור ← הכפלה במקדמי העונתיות הממוצעים. בדה-קומפוזיציה, לעומת זאת, מנרמלים קודם (מחלקים במקדמי העונתיות) ומחשבים רגרסיה על ממוצעי המחזורים המנורמלים. (מצגת 3, שקפים 17–20)"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"בנוסחת הדה-קומפוזיציה <bdi dir='ltr'>F_t = [a + b·⌈t/L⌉]·C_i</bdi> מופיע הביטוי <bdi dir='ltr'>⌈t/L⌉</bdi> (עיגול כלפי מעלה). מה הוא מייצג?",o:["את מספר המחזורים השלמים שחלפו לפני תקופה <bdi dir='ltr'>t</bdi>","את מספר העונה בתוך המחזור שאליה שייכת תקופה <bdi dir='ltr'>t</bdi>","את מספר המחזור שאליו שייכת תקופה <bdi dir='ltr'>t</bdi>","את מקדם העונתיות הממוצע של תקופה <bdi dir='ltr'>t</bdi>"],c:2,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br><bdi dir='ltr'>L</bdi> הוא מספר העונות במחזור (בדוגמה <bdi dir='ltr'>L=5</bdi> ימים בשבוע). <bdi dir='ltr'>⌈26/5⌉ = ⌈5.2⌉ = 6</bdi> — תקופה 26 שייכת למחזור השישי. את העונה בתוך המחזור (לבחירת <bdi dir='ltr'>C_i</bdi>) קובעים בנפרד: תקופה 26 היא העונה הראשונה במחזור 6. (מצגת 3, שקף 19)"},
{t:"חיזוי עונתי",s:"ניצן",q:"הביקוש הרבעוני למוצר בשנה מסוימת:<br><table><tr><th>רבעון</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>ביקוש</th><td>150</td><td>90</td><td>60</td><td>100</td></tr></table>מהו מקדם העונתיות של רבעון 3?",o:["0.40","0.15","0.60","1.67"],c:2,e:"הממוצע הבין-רבעוני: <bdi dir='ltr'>D̄ = (150 + 90 + 60 + 100) / 4 = 100</bdi>. מקדם העונתיות: <bdi dir='ltr'>C3 = 60 / 100 = 0.60</bdi> — ביקוש נמוך ב-40% מהממוצע.<br>טעויות: היחס ההפוך (1.67), חלוקה בסך הביקוש השנתי (0.15), או ״40%״ (0.40) שהוא הפער ולא המקדם. (מצגת 3, שקף 7)",k:"calc"},
{t:"חיזוי עונתי",s:"ניצן",q:"מקדמי העונתיות של שלושה רבעונים הם <bdi dir='ltr'>C1 = 1.25</bdi>, <bdi dir='ltr'>C2 = 0.90</bdi> ו-<bdi dir='ltr'>C3 = 0.70</bdi>. מהו מקדם העונתיות של רבעון 4?",o:["0.95","1.15","1.00","0.15"],c:1,e:"סכום המקדמים במחזור שווה למספר העונות: <bdi dir='ltr'>ΣCj = N = 4</bdi>, ולכן <bdi dir='ltr'>C4 = 4 − (1.25 + 0.90 + 0.70) = 4 − 2.85 = 1.15</bdi>.<br>0.95 — ממוצע שלושת המקדמים; 1.00 — הנחה שעונה חסרה היא ״ממוצעת״; 0.15 — שימוש ב-<bdi dir='ltr'>N−1</bdi>. (מצגת 3, שקף 8)",k:"calc"},
{t:"חיזוי עונתי",s:"ניצן",q:"ביקוש רבעוני בשתי שנים:<br><table><tr><th>שנה \\ רבעון</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>שנה 1</th><td>130</td><td>90</td><td>70</td><td>110</td></tr><tr><th>שנה 2</th><td>150</td><td>100</td><td>90</td><td>140</td></tr></table>מהו מקדם העונתיות הממוצע של רבעון 3, והאם לפי כלל האצבע הביקוש עונתי?",o:["0.725 — הביקוש עונתי, כי המקדם נמוך מ-0.8","1.379 — הביקוש עונתי, כי המקדם גבוה מ-1.2","0.800 — הביקוש אינו עונתי, כי המקדם אינו נמוך מ-0.8","0.725 — הביקוש אינו עונתי, כי המקדם גבוה מ-0.5"],c:0,e:"ממוצע בין-רבעוני: שנה 1 — <bdi dir='ltr'>(130+90+70+110)/4 = 100</bdi>; שנה 2 — <bdi dir='ltr'>(150+100+90+140)/4 = 120</bdi>.<br>מקדמי רבעון 3: <bdi dir='ltr'>70/100 = 0.70</bdi> ו-<bdi dir='ltr'>90/120 = 0.75</bdi>; ממוצע: <bdi dir='ltr'>(0.70 + 0.75)/2 = 0.725</bdi>.<br>0.725 נמוך מ-0.8 ← לפי כלל האצבע הביקוש עונתי (די שמקדם ממוצע אחד יחרוג). (מצגת 3, שקפים 9–10)",k:"calc"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"ביום הראשון של השבוע הראשון נמכרו 8 יחידות, ומקדם העונתיות הממוצע של ״יום 1״ הוא 1.198. מהו הביקוש המנורמל של אותו יום, לצורך חישוב קו המגמה?",o:["6.68","0.15","9.58","6.80"],c:0,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>נרמול = חלוקת הנתון במקדם העונתיות של העונה שלו: <bdi dir='ltr'>8 / 1.198 = 6.68</bdi>. כך מנטרלים את השפעת העונתיות, ואת הממוצעים המנורמלים של המחזורים מכניסים לרגרסיה. בשקף מופיע <bdi dir='ltr'>8/1.2 = 6.68</bdi>. (מצגת 3, שקף 17)",k:"calc"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"בדוגמת הדה-קומפוזיציה בשקפים התקבל קו המגמה <bdi dir='ltr'>â = 5.4, b̂ = 1.25</bdi>, יש 5 עונות במחזור <bdi dir='ltr'>(L=5)</bdi>, ומקדם העונתיות של העונה הרביעית הוא 0.91. מהי התחזית לתקופה 29 (העונה הרביעית במחזור השישי)?",o:["10.60","11.74","12.90","37.90"],c:1,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br><bdi dir='ltr'>⌈29/5⌉ = ⌈5.8⌉ = 6</bdi> ← <bdi dir='ltr'>F29 = (5.4 + 1.25·6) · 0.91 = 12.9 · 0.91 = 11.74</bdi>.<br>טעויות: עיגול כלפי מטה (מחזור 5 ← 10.60); שכחת ההכפלה במקדם (12.90); הצבת <bdi dir='ltr'>t=29</bdi> במקום מספר המחזור (37.90). (בשקף 19 התחזית לתקופה 29 נשארה ריקה — זה בדיוק התרגיל.) (מצגת 3, שקף 19)",k:"calc"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"מודל עונתי רבעוני <bdi dir='ltr'>(L=4)</bdi> עם קו מגמה בין המחזורים <bdi dir='ltr'>a = 100, b = 8</bdi> (<bdi dir='ltr'>X</bdi> = מספר המחזור) ומקדמי עונתיות:<br><table><tr><th>רבעון</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>מקדם</th><td>1.30</td><td>0.80</td><td>0.70</td><td>1.20</td></tr></table>מהי התחזית לתקופה 18 בשיטת הדה-קומפוזיציה?",o:["195.20","112.00","182.00","105.60"],c:1,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>תקופה 18 שייכת למחזור <bdi dir='ltr'>⌈18/4⌉ = ⌈4.5⌉ = 5</bdi>, והיא הרבעון השני בו (17 = רבעון 1 של מחזור 5). <bdi dir='ltr'>F18 = (100 + 8·5) · 0.8 = 140 · 0.8 = 112</bdi>.<br>טעויות: מקדם של רבעון 1 (182); עיגול כלפי מטה למחזור 4 (105.60); הצבת <bdi dir='ltr'>t=18</bdi> בנוסחה (195.20). (מצגת 3, שקף 19)",k:"calc"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"בשיטה הפשוטה לחיזוי עונתי חושבו ממוצעי המחזורים (״נציגי המחזור״) 7, 8, 9, 10 לארבעה מחזורים, ומקדם העונתיות הממוצע של העונה החמישית הוא 1.877. מהי התחזית לעונה החמישית במחזור 5?",o:["20.65","18.77","5.86","15.95"],c:0,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>רגרסיה על הנציגים <bdi dir='ltr'>(X = 1..4, Y = 7, 8, 9, 10)</bdi> נותנת <bdi dir='ltr'>b = 1, a = 6</bdi>, ולכן נציג מחזור 5: <bdi dir='ltr'>6 + 1·5 = 11</bdi>. התחזית: <bdi dir='ltr'>11 · 1.877 = 20.65</bdi> (בשקף 23: 20.64).<br>טעויות: ממוצע כל הנציגים (8.5 ← 15.95); נציג המחזור האחרון (10 ← 18.77); חלוקה במקדם (5.86). (מצגת 3, שקפים 20–23)",k:"calc"},
{t:"חיזוי עונתי — העשרה (לא במבחן)",s:"ניצן",q:"בדה-קומפוזיציה של ביקוש רבעוני התקבלו ממוצעי מחזורים מנורמלים 20, 23, 25, 28 (מחזורים 1–4). מקדם העונתיות של רבעון 3 הוא 0.84. מהי התחזית לרבעון 3 במחזור 5?",o:["30.50","23.52","25.62","36.31"],c:2,e:"<b>לא במבחן:</b> לפי המרצה (הרצאה 11.8), דה-קומפוזיציה והשיטה הפשוטה לא יהיו במבחן — השאלה להעשרה בלבד. במבחן: בדיקה אם מוצר עונתי לפי כלל האצבע.<br>רגרסיה (<bdi dir='ltr'>X</bdi> = מחזור, <bdi dir='ltr'>Y</bdi> = ממוצע מנורמל): <bdi dir='ltr'>Σx = 10, Σy = 96, Σx² = 30</bdi>, <bdi dir='ltr'>Σxy = 20 + 46 + 75 + 112 = 253</bdi>, ולכן <bdi dir='ltr'>b = (4·253 − 10·96) / (4·30 − 10²) = 52 / 20 = 2.6</bdi>, <bdi dir='ltr'>a = 96/4 − 2.6·2.5 = 24 − 6.5 = 17.5</bdi>.<br>ממוצע מחזור 5: <bdi dir='ltr'>17.5 + 2.6·5 = 30.5</bdi>; התחזית לרבעון 3: <bdi dir='ltr'>30.5 · 0.84 = 25.62</bdi>.<br>טעויות: שכחת המקדם (30.50); הכפלת הממוצע האחרון (23.52); חלוקה במקדם (36.31). (מצגת 3, שקפים 18–19)",k:"calc"},
{t:"חיזוי עונתי",s:"הקלטות",q:"לפי המרצה בהרצאה על חיזוי עונתי (11.8), מה מתוך הנושא עשוי להופיע במבחן?",o:["בדיקה אם מוצר עונתי — לפי כלל האצבע של המקדמים הממוצעים","חישוב תחזית בשיטה הפשוטה, לפי נציגי המחזורים","קביעת אורך המחזור (שבוע או רבעון) בניתוח שונות","חישוב תחזית בשיטת הדה-קומפוזיציה, כולל נרמול הנתונים"],c:0,e:"״במבחן שלכם... האם יש עונתיות במוצר הזה או לא? זה כלל אצבע״ — מקדם ממוצע אחד לפחות מעל 1.2 ו/או מתחת ל-0.8. ועל השאר: ״אני מלמד דה-קומפוזיציה — לא אתן לכם במבחן דה-קומפוזיציה... המחשבים עושים את הדברים האלה״; גם השיטה הפשוטה לא תהיה במבחן, וגם את אורך המחזור ״אני לא אתן לכם במבחן לבדוק״. (הרצאה 11.8)"}
]);

BANK.push.apply(BANK,[
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"מהו ״קונפליקט המלאי״ שהוצג בפתיחת נושא ניהול רמות המלאי?",o:["טווח קצר מול ארוך — תחזיות רחוקות פחות מדויקות","ספקים מול לקוחות — כל צד רוצה שהשני יחזיק את המלאי אצלו","זמינות מול עלות — מלאי גדול מבטיח זמינות, אך יוצר עלויות","איכות מול כמות — מלאי גדול פוגע לאורך זמן באיכות הפריטים"],c:2,e:"שקף 3: בדומה לתופעות כלכליות אחרות — זמינות מול עלות. השאלה המנהלית: באילו פריטים חשיבות הזמינות עולה על שיקולי העלות, ובאילו להיפך. (מצגת 4, שקף 3)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"לפי המפה התפיסתית של הקונפליקט בארגון, מה היעד של מנהל השיווק ומה היעד של מנהל הכספים לגבי המלאי?",o:["שיווק — מלאי נמוך ככל האפשר; כספים — מלאי גבוה ככל האפשר","שיווק — אספקה רציפה לייצור; כספים — עמידה במחויבויות בעלות מינימלית","שניהם — מלאי אפס, כדי לחסוך בעלויות האחזקה","שיווק — מלאי גבוה ככל האפשר; כספים — מלאי נמוך ככל האפשר"],c:3,e:"שקף 7: מנהל כספים — מלאי נמוך ככל האפשר; מנהל שיווק — מלאי גבוה ככל האפשר; מנהל ייצור — אספקה רציפה; מנכ״ל — עמידה במחויבות בעלויות מינימליות. מטרת ניהול המלאי — איזון אופטימלי בין הכוחות (שקף 8). (מצגת 4, שקפים 7–8)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"איזו מהעלויות הבאות היא עלות עריכת הזמנה <bdi dir='ltr'>(K)</bdi>, ולא עלות אחזקת מלאי?",o:["עמילות מכס, והובלה עם ביטוח הובלה","ביטוח הסחורה והמבנה של המחסן","ריבית על ההון המושקע במלאי","פחת מלגזות ומידוף במחסן"],c:0,e:"עלויות עריכת הזמנה (שקף 13) — עלויות קבועות לכל הזמנה: התכתבות עם ספקים והצעות מחיר, פתיחת אשראי וטיפול בבנקים, מעקב אחרי ההזמנה, טיפול בחשבונות ספקים, עמילות מכס, הובלות וביטוח הובלה, תקשורת. ביטוח המחסן, פחת ציוד המחסן ומימון המלאי הם עלויות אחזקה (שקף 12). (מצגת 4, שקפים 12–13)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"איזה מהרכיבים הבאים אינו חלק מעלויות אחזקת המלאי, לפי המצגת?",o:["התכתבות עם ספקים ובקשת הצעות מחיר","התיישנות ופג תוקף של פריטים במלאי","קלקולים של פריטים במשך הזמן במלאי","הוצאות מימון — ריבית על ההון במלאי"],c:0,e:"הוצאות אחזקת המלאי (שקף 12): עלות תפעול מחסן (ארנונה, שכירות, ציוד שינוע, שכר עובדי מחסן, קירור במקרים מיוחדים), קלקולים, התיישנות (פג תוקף) והוצאות מימון. התכתבות עם ספקים שייכת לעלויות עריכת הזמנה. (מצגת 4, שקפים 12–13)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"מה משמעות מקדם אחזקת מלאי <bdi dir='ltr'>i = 22%</bdi>?",o:["22% מהפריטים במחסן מוחזקים במלאי יותר משנה","עלות אחזקת המלאי השנתית היא 22% מערך המלאי הממוצע","המלאי הממוצע הוא 22% מהצריכה השנתית","עלות עריכת הזמנה בודדת היא 22% מערך הסחורה שהוזמנה בה"],c:1,e:"<bdi dir='ltr'>i = עלויות אחזקת המלאי לשנה / ערך המלאי הממוצע</bdi>. בדוגמה בשקפים: <bdi dir='ltr'>711,000 / 3,200,000 = 22%</bdi> — ״עלות אחזקת המלאי באחוזים היא 22% מערכו של המלאי בממוצע״. (מצגת 4, שקפים 11, 18)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"במודל המסור, משפחת כהן קונה 7 יחידות פעם בשבוע ומשפחת לוי קונה יחידה אחת בכל יום (הצריכה זהה). מה נכון?",o:["אצל כהן גם עלות ההתעסקות וגם רמת המלאי הממוצעת נמוכות יותר מאשר אצל לוי","אצל שתי המשפחות רמת המלאי הממוצעת זהה, כי הצריכה היומית שלהן זהה","אצל לוי עלות ההתעסקות נמוכה יותר, אך רמת המלאי הממוצעת גבוהה יותר","אצל כהן עלות ״ההתעסקות״ (ההזמנות) נמוכה יותר, אך רמת המלאי הממוצעת גבוהה יותר"],c:3,e:"זה הקונפליקט שמודל <bdi dir='ltr'>EOQ</bdi> פותר: הזמנה גדולה ונדירה (כהן) — מעט ״התעסקות״ אך מלאי ממוצע גבוה <bdi dir='ltr'>(Q/2 = 3.5)</bdi>; הזמנות קטנות ותכופות (לוי) — מלאי נמוך <bdi dir='ltr'>(Q/2 = 0.5)</bdi> אך הרבה התעסקות. (מצגת 4, שקפים 22–23)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"מהי הכמות הממוצעת במלאי במודל המסור, כשמזמינים <bdi dir='ltr'>Q</bdi> יחידות ומחזיקים מלאי ביטחון <bdi dir='ltr'>B</bdi>?",o:["<bdi dir='ltr'>B + Q/2</bdi>","(<bdi dir='ltr'>B + Q)/2</bdi>","<bdi dir='ltr'>B + Q</bdi>","<bdi dir='ltr'>Q/2</bdi>"],c:0,e:"המלאי יורד באופן אחיד מ-<bdi dir='ltr'>B + Q</bdi> (רגע קבלת ההזמנה) ל-<bdi dir='ltr'>B</bdi> (רגע לפני ההזמנה הבאה), ולכן הממוצע <bdi dir='ltr'>B + Q/2</bdi>. בלי מלאי ביטחון — <bdi dir='ltr'>Q/2</bdi>. ערך המלאי הממוצע: <bdi dir='ltr'>(B + Q/2)·C</bdi>, ועלות אחזקתו: <bdi dir='ltr'>(B + Q/2)·C·i</bdi>. (מצגת 4, שקף 26)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"איזו מהבאות אינה אחת מהנחות מודל ה-<bdi dir='ltr'>EOQ</bdi> (מודל המסור)?",o:["ההזמנה מתקבלת בבת אחת במועד האספקה","מחיר הפריט יורד ככל שהכמות המוזמנת גדלה (הנחות כמות)","אין חוסר במלאי לאורך כל התקופה","קצב הצריכה השנתי מתחלק באופן שווה לאורך התקופה"],c:1,e:"הנחות המודל (שקף 24): צריכה אחידה; מחיר פריט <bdi dir='ltr'>C</bdi> קבוע; עלות הזמנה <bdi dir='ltr'>K</bdi> קבועה ואינה תלויה בכמות; ההזמנה מתקבלת בבת אחת; מקדם אחזקה <bdi dir='ltr'>i</bdi> קבוע; אין חוסר. מחיר שיורד עם הכמות הוא בדיוק אחת ״המציאויות״ שסותרות את ההנחות (שקף 25). (מצגת 4, שקפים 24–25)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"לפי טבלת ״מגבלות השימוש במודל״, מה עלול לקרות במציאות בניגוד להנחה שההזמנה מתקבלת בבת אחת במועד האספקה?",o:["ההזמנה מתקבלת במלואה, אך מחיר הפריט נקבע לפי הכמות","ההזמנה מתקבלת במלואה, אך עלותה משתנה עם שער המט״ח","ההזמנה מתקבלת בזמן, אך רק חלק מהכמות שהוזמנה","ההזמנה מתקבלת במלואה, אך הצריכה עולה בגלל דרישה בשוק"],c:2,e:"שקף 25 משייך לכל הנחה את המציאות שסותרת אותה: צריכה קבועה ← הצריכה עולה/יורדת עם הדרישה בשוק; מחיר קבוע ← המחיר נקבע לפי הכמות; עלות הזמנה קבועה ← תנודות במט״ח; קבלה בבת אחת ← ״ייתכן שנקבל את ההזמנה בזמן, אולם לא את כל הכמות״. (מצגת 4, שקף 25)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"בכמות האופטימלית <bdi dir='ltr'>Q*</bdi> (בלי מלאי ביטחון), מה היחס בין עלות אחזקת המלאי השנתית לעלות ביצוע ההזמנות השנתית?",o:["עלות ההזמנות כפולה מעלות האחזקה","עלות האחזקה כפולה מעלות ההזמנות","עלות האחזקה גדולה פי <bdi dir='ltr'>√2</bdi>","הן שוות — זו נקודת החיתוך בגרף"],c:3,e:"בנקודת המינימום של <bdi dir='ltr'>G</bdi> שתי העלויות שוות: <bdi dir='ltr'>(Q*/2)·C·i = (λ/Q*)·K</bdi>. בדוגמה בשקפים: <bdi dir='ltr'>9,196 ≈ 9,187</bdi> (ההפרש נובע מעיגול <bdi dir='ltr'>Q*</bdi> ל-418). בגרף — נקודת החיתוך של קו האחזקה העולה עם עקומת ההזמנות היורדת. (מצגת 4, שקפים 27, 31)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"הספק מוכן לספק רק בחבילות סגורות של 100 יחידות, וה-<bdi dir='ltr'>EOQ</bdi> יצא 418. כיצד קובעים את הכמות להזמנה?",o:["מעגלים לכפולה הקרובה ביותר, בלי לחשב עלויות","מחשבים את <bdi dir='ltr'>G</bdi> עבור 400 ועבור 500 ובוחרים בזולה","מזמינים 418 ומבקשים מהספק לפרק חבילה","מעגלים תמיד כלפי מעלה ל-500, כדי לא ליצור חוסר"],c:1,e:"שקפים 32–33: מחשבים את שתי האפשרויות שסביב הפתרון האופטימלי: <bdi dir='ltr'>G(400) = 18,400</bdi>, <bdi dir='ltr'>G(500) = 18,680</bdi> — ולכן 400. שימו לב: הכוכבית ״יורדת״ (<bdi dir='ltr'>Q</bdi> ולא <bdi dir='ltr'>Q*</bdi>), כי הפתרון כבר אינו אופטימלי. פונקציית העלות אינה סימטרית, ולכן לא מסתפקים ב״קרובה ביותר״. (מצגת 4, שקפים 32–33)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"למוצר פג תוקף של 10 ימים, וזמן המחזור לפי ה-<bdi dir='ltr'>EOQ</bdi> יוצא 12.72 ימים. מה עושים?",o:["משאירים את ה-<bdi dir='ltr'>EOQ</bdi>, כי הוא מביא את העלות למינימום","מקטינים את ההזמנה לצריכה של 10 ימים, גם אם <bdi dir='ltr'>G</bdi> עולה","מזמינים את הכפולה של 100 הקרובה ביותר ל-<bdi dir='ltr'>EOQ</bdi>","מגדילים את מלאי הביטחון כדי לפצות על הפריטים שיפוגו"],c:1,e:"שקפים 34–35: זמן המחזור הוא בעצם זמן הצריכה — אם הוא ארוך מזמן התוקף, מוצרים יפוגו. לכן <bdi dir='ltr'>Q = λ/365 · 10 = 12,000/365 · 10 = 329</bdi> (לא לפי <bdi dir='ltr'>EOQ</bdi>), ו-<bdi dir='ltr'>G = 18,910 > 18,383</bdi>. (מצגת 4, שקפים 34–35)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"שלושה אילוצים חלים יחד: כפולות של 100, פג תוקף שמגביל ל-329 יחידות, ונפח אחסון של 305 יחידות. מהי הכמות להזמנה?",o:["329","305","400","300"],c:3,e:"הכמות צריכה לעמוד בכל האילוצים: לא יותר מ-305 (נפח), לא יותר מ-329 (תוקף), ובכפולות של 100 ← 300. <bdi dir='ltr'>G(300) = 19,400</bdi>, <bdi dir='ltr'>N = 12,000/300 = 40</bdi>, <bdi dir='ltr'>T = 365/40 = 9.1</bdi> ימים. (מצגת 4, שקפים 37–38)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"מה קורה ל-<bdi dir='ltr'>Q*</bdi> אם הצריכה השנתית גדלה פי 4 (ושאר הנתונים קבועים)?",o:["<bdi dir='ltr'>Q*</bdi> גדל פי 4","<bdi dir='ltr'>Q*</bdi> קטן פי 2","<bdi dir='ltr'>Q*</bdi> גדל פי 16","<bdi dir='ltr'>Q*</bdi> גדל פי 2"],c:3,e:"<bdi dir='ltr'>Q* = √(2λK / (C·i))</bdi> — <bdi dir='ltr'>λ</bdi> נמצא מתחת לשורש, ולכן הכפלת <bdi dir='ltr'>λ</bdi> פי 4 מגדילה את <bdi dir='ltr'>Q*</bdi> פי <bdi dir='ltr'>√4 = 2</bdi>. מכאן שמספר ההזמנות <bdi dir='ltr'>N = λ/Q*</bdi> גדל גם הוא פי 2. (מצגת 4, שקף 28)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"לפי המצגת, אילו מהבאות הן ״סיבות שיווקיות״ להחזקת מלאי (להבדיל מ״הזדמנויות עסקיות״)?",o:["הגנה בפני עליית מחירים, ודרישה בלתי צפויה","הנחות על כמות, והגנה בפני עליית מחירים","הגנה בפני עונתיות, והיענות ללקוחות","דרישה בלתי צפויה, והנחות על כמות"],c:2,e:"שקף 10: הזדמנויות עסקיות — דרישה בלתי צפויה, הנחות על כמות, הגנה בפני עליית מחירים; סיבות שיווקיות — הגנה בפני עונתיות, היענות ללקוחות. (מצגת 4, שקף 10)"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"במחסן של ארגון נאספו הנתונים הבאים:<br>• ארנונה ושכירות: 20,000 ₪ לחודש לכל המבנה; המחסן תופס 40% משטח המבנה<br>• 2 עובדי מחסן, 9,000 ₪ לחודש לעובד<br>• פחת מלגזות ומידוף: 30,000 ₪ בשנה<br>• קלקולים: 40,000 ₪ בשנה; התיישנות: 25,000 ₪ בשנה<br>• עלות המימון: 3% מערך המלאי הממוצע<br>ערך המלאי נבדק ב-4 נקודות זמן (במיליוני ₪): 2.0, 2.4, 2.2, 2.6.<br>מהו מקדם אחזקת המלאי <bdi dir='ltr'>i</bdi>?",o:["17.70%","18.31%","20.70%","26.96%"],c:2,e:"ערך מלאי ממוצע: <bdi dir='ltr'>(2.0 + 2.4 + 2.2 + 2.6)/4 = 2.3M</bdi>.<br>ארנונה ושכירות (רק חלק המחסן): <bdi dir='ltr'>20,000·12·0.4 = 96,000</bdi>; שכר: <bdi dir='ltr'>9,000·12·2 = 216,000</bdi>; פחת 30,000; קלקולים 40,000; התיישנות 25,000; מימון: <bdi dir='ltr'>0.03·2,300,000 = 69,000</bdi>.<br>סה״כ <bdi dir='ltr'>476,000</bdi> ← <bdi dir='ltr'>i = 476,000 / 2,300,000 = 20.70%</bdi>.<br>טעויות: כל השכירות בלי 40% (26.96%); בלי המימון (17.70%); חלוקה בערך המרבי <bdi dir='ltr'>2.6M (18.31%)</bdi>. (כמו הדוגמה במצגת 4, שקפים 15–18)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתוני מחלקת הרכש של ארגון לשנה:<br>• 3 עובדים במעקב ובקרת הזמנות, 8,000 ₪ לחודש לעובד<br>• 2 עובדי מחסן, 9,000 ₪ לחודש לעובד<br>• הובלה: 90,000 ₪; עמילות מכס: 70,000 ₪; תקשורת: 20,000 ₪ בשנה<br>• בשנה בוצעו 1,200 הזמנות<br>מהי עלות הטיפול בהזמנה בודדת <bdi dir='ltr'>K</bdi>?",o:["4,680 ₪","570 ₪","390 ₪","170 ₪"],c:2,e:"<bdi dir='ltr'>K = עלויות הטיפול בהזמנות בשנה / מספר ההזמנות בשנה</bdi>.<br>שכר מעקב ובקרה: <bdi dir='ltr'>8,000·3·12 = 288,000</bdi>; הובלה 90,000; מכס 70,000; תקשורת 20,000 ← סה״כ <bdi dir='ltr'>468,000</bdi>.<br><bdi dir='ltr'>K = 468,000 / 1,200 = 390</bdi> ₪ להזמנה.<br>עובדי המחסן אינם בעלות ההזמנה — הם עלות אחזקה (570 ₪ אם כוללים אותם). 170 ₪ — שכר חודשי שלא הוכפל ב-12; 4,680 ₪ — חלוקה במספר ההזמנות לחודש. (מצגת 4, שקפים 19–21)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"צריכה חודשית של 500 יחידות, מחיר יחידה 150 ₪, מקדם אחזקת מלאי 20% ועלות הזמנה 250 ₪. מהי הכמות האופטימלית להזמנה <bdi dir='ltr'>(EOQ)</bdi>?",o:["91.29","316.23","223.61","141.42"],c:1,e:"הצריכה במודל שנתית: <bdi dir='ltr'>λ = 500·12 = 6,000</bdi>.<br><bdi dir='ltr'>Q* = √(2·6,000·250 / (150·0.2)) = √(3,000,000 / 30) = √100,000 = 316.23</bdi>.<br>טעויות: צריכה חודשית (91.29); שכחת ה-2 (223.61); שכחת <bdi dir='ltr'>i</bdi> במכנה (141.42). (מצגת 4, שקף 28)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(λ = 6,000, Q* = 316.23)</bdi>: מהו זמן המחזור <bdi dir='ltr'>T</bdi> בימים — הזמן שעובר בין שתי הזמנות עוקבות?",o:["1.15","19.24","18.97","38.47"],c:1,e:"<bdi dir='ltr'>N = λ / Q* = 6,000 / 316.23 = 18.97</bdi> הזמנות בשנה; <bdi dir='ltr'>T = 365 / N = 365 / 18.97 = 19.24</bdi> ימים.<br>18.97 הוא מספר ההזמנות ולא זמן המחזור. (מצגת 4, שקף 29)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(λ = 6,000, C = 150, i = 20%, K = 250, Q* = 316.23, B = 0)</bdi>: מהי עלות האחזקה וניהול המלאי השנתית <bdi dir='ltr'>G</bdi> (בלי עלות הרכישה)?",o:["9,486.83 ₪","4,743.42 ₪","14,230.25 ₪","909,486.83 ₪"],c:0,e:"<bdi dir='ltr'>G = (Q/2)·C·i + (λ/Q)·K = 158.11·30 + 18.97·250 = 4,743.42 + 4,743.42 = 9,486.83</bdi> ₪.<br>שתי העלויות יוצאות שוות — כך תמיד ב-<bdi dir='ltr'>Q*</bdi>. טעויות: <bdi dir='ltr'>Q</bdi> במקום <bdi dir='ltr'>Q/2 (14,230.25)</bdi>; הוספת עלות הרכישה <bdi dir='ltr'>λ·C (909,486.83)</bdi>; רק עלות האחזקה (4,743.42). (מצגת 4, שקפים 26–31)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(λ = 6,000, C = 150, i = 20%, K = 250, Q* = 316.23)</bdi>: הספק מספק רק בחבילות של 100 יחידות. כמה יוזמנו, ומה תהיה <bdi dir='ltr'>G</bdi>?",o:["300 יחידות, <bdi dir='ltr'>G = 9,500</bdi> ₪","400 יחידות, <bdi dir='ltr'>G = 9,750</bdi> ₪","400 יחידות, <bdi dir='ltr'>G = 9,500</bdi> ₪","316 יחידות, <bdi dir='ltr'>G = 9,487</bdi> ₪"],c:0,e:"משווים את שתי הכפולות שסביב <bdi dir='ltr'>Q*</bdi>:<br><bdi dir='ltr'>G(300) = 150·30 + 20·250 = 4,500 + 5,000 = 9,500</bdi><br><bdi dir='ltr'>G(400) = 200·30 + 15·250 = 6,000 + 3,750 = 9,750</bdi><br>300 זולה יותר. 316 אינה אפשרית — אינה כפולה של 100. (מצגת 4, שקפים 32–33)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(λ = 6,000 בשנה, Q* = 316.23)</bdi>: למוצר פג תוקף של 12 ימים. מהי הכמות המרבית שכדאי להזמין בכל פעם?",o:["316","500","164","197"],c:3,e:"זמן המחזור לפי <bdi dir='ltr'>EOQ</bdi> הוא 19.24 ימים — יותר מזמן התוקף, ולכן חלק מהמלאי יפוג. מגבילים את ההזמנה לצריכה של 12 ימים: <bdi dir='ltr'>Q = λ/365 · 12 = 6,000/365 · 12 = 197</bdi> (שקף 35: <bdi dir='ltr'>12,000/365 · 10 = 329</bdi>).<br>500 = צריכה חודשית; 164 = צריכה של 10 ימים. (מצגת 4, שקפים 34–35)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(λ = 6,000, C = 150, i = 20%, K = 250, Q* = 316.23)</bdi>: קיבולת האחסון המיוחד למוצר היא 250 יחידות. מהי <bdi dir='ltr'>G</bdi> בכמות שתוזמן?",o:["9,750 ₪","6,000 ₪","7,500 ₪","9,487 ₪"],c:0,e:"<bdi dir='ltr'>Q*</bdi> גדול מהקיבולת, ולכן מזמינים 250 (המרבי האפשרי): <bdi dir='ltr'>G(250) = 125·30 + 24·250 = 3,750 + 6,000 = 9,750</bdi> ₪ — יותר מ-<bdi dir='ltr'>G(Q*) = 9,487</bdi>, כי הפתרון אינו אופטימלי. (מצגת 4, שקף 36)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"נתונים <bdi dir='ltr'>(Q* = 316.23)</bdi>: עלות הטיפול בהזמנה בודדת <bdi dir='ltr'>K</bdi> הוכפלה. מהו ה-<bdi dir='ltr'>Q*</bdi> החדש?",o:["632.46","400.00","223.61","447.21"],c:3,e:"<bdi dir='ltr'>Q* = √(2λK / (C·i))</bdi> — הכפלת <bdi dir='ltr'>K</bdi> מגדילה את <bdi dir='ltr'>Q*</bdi> פי <bdi dir='ltr'>√2</bdi>: <bdi dir='ltr'>316.23 · 1.4142 = 447.21</bdi>. כשכל הזמנה יקרה יותר, כדאי להזמין פחות פעמים ובכמות גדולה יותר. (מצגת 4, שקף 28)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"ערך המלאי הממוצע בארגון הוא 2.5 מיליון ₪; ערך הצריכה השנתי 15 מיליון ₪, וערך הצריכה השבועי 300,000 ₪. מהו מספר סבבי המלאי בשנה, ומהו ערך המלאי בשבועות?",o:["6 סבבים; 8.33 שבועות","0.17 סבבים; 0.12 שבועות","6 סבבים; 0.12 שבועות","0.17 סבבים; 8.33 שבועות"],c:0,e:"<bdi dir='ltr'>סבבי מלאי = ערך צריכה שנתי / ערך מלאי ממוצע = 15 / 2.5 = 6</bdi> — המלאי ״מתחלף״ 6 פעמים בשנה.<br><bdi dir='ltr'>ערך המלאי בשבועות = ערך מלאי ממוצע / ערך צריכה שבועי = 2,500,000 / 300,000 = 8.33</bdi> — המלאי מספיק לכ-8 שבועות צריכה.<br>שימו לב: בשקף 9 השברים כתובים הפוך (״ערך צריכה שבועי/ערך מלאי ממוצע״) — היפוך נותן 0.12 שבועות ו-0.17 סבבים, תוצאות חסרות משמעות. בדיקת שפיות: סבבים רבים = מלאי קטן יחסית לצריכה. (מצגת 4, שקף 9)",k:"calc"},
{t:"ניהול מלאי ו-EOQ",s:"ניצן",q:"בדוגמה מהמצגת <bdi dir='ltr'>(λ = 12,000, C = 200 ₪, i = 22%, K = 320 ₪, Q* = 418, G(Q*) = 18,383 ₪)</bdi> הספק מספק בחבילות של 100. מהי <bdi dir='ltr'>G</bdi> אם מזמינים 400 יחידות?",o:["18,680 ₪","9,600 ₪","18,400 ₪","18,383 ₪"],c:2,e:"<bdi dir='ltr'>G(400) = (400/2)·200·0.22 + (12,000/400)·320 = 8,800 + 9,600 = 18,400</bdi> ₪ — רק 17 ₪ יותר מהאופטימום: פונקציית העלות שטוחה ליד <bdi dir='ltr'>Q*</bdi>. <bdi dir='ltr'>G(500) = 18,680</bdi>, ולכן בוחרים 400; <bdi dir='ltr'>N = 30</bdi>, <bdi dir='ltr'>T = 365/30 = 12.17</bdi> ימים. (מצגת 4, שקף 33)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"אילו שני סוגי חוסר ודאות קובעים את גודל מלאי הביטחון, ומהו המשתנה המשותף שמבטא את שניהם?",o:["שינויים במחיר הפריט ובעלות ההזמנה הבודדת; המשותף — מקדם אחזקת המלאי השנתי <bdi dir='ltr'>i</bdi>","שינויים בקצב הצריכה ובזמני האספקה; המשותף — סטיית התקן של הצריכה בזמן האספקה","שינויים בקצב הצריכה ובאיכות המוצרים של הספק; המשותף — רמת השירות הנדרשת <bdi dir='ltr'>K</bdi>","שינויים בזמני האספקה ובנפח האחסון; המשותף — זמן המחזור <bdi dir='ltr'>T</bdi> בין הזמנות"],c:1,e:"שקף 2: חוסר ודאות מצד הלקוח — שינויים בקצב הצריכה (סטיית התקן של קצב הצריכה); מצד הספק — שינויים בזמני האספקה (סטיית התקן של זמני האספקה). המשתנה המשותף: סטיית התקן של הצריכה בזמן האספקה. (מצגת 5, שקפים 2–4)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"ספק א׳ הבטיח אספקה תוך 7 ימים וסיפק בפועל תוך 7, 9, 12, 14, 20, 2 ימים. ספק ב׳ הבטיח 10 ימים וסיפק תוך 10, 11, 11, 9, 11, 11, 10. עם מי עדיף לעבוד?",o:["ספק ב׳ — זמני האספקה שלו יציבים, ולכן נדרש פחות מלאי ביטחון","ספק א׳ — הוא הבטיח זמן אספקה קצר יותר, ולכן נדרש פחות מלאי ביטחון","אין הבדל — אצל שניהם הממוצע קרוב להבטחה, ולכן מלאי הביטחון זהה","ספק א׳ — יש לו גם אספקות מהירות מאוד שמפצות על האיחורים"],c:0,e:"מלאי הביטחון נועד לספוג את חוסר הוודאות, ולכן מה שקובע הוא הפיזור (סטיית התקן) ולא ההבטחה. אצל ספק א׳ זמני האספקה נעים בין 2 ל-20 ימים (ממוצע 10.7 — יותר מההבטחה!), אצל ספק ב׳ בין 9 ל-11. אספקה מוקדמת (2 ימים) אינה ״מפצה״ — היא רק מגדילה את הפיזור. (מצגת 5, שקפים 5–6)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"מוצר א׳ — צריכה חודשית 7, 9, 22, 14, 45, 18; מוצר ב׳ — 19, 21, 22, 20, 21, 21, 20. באיזה מוצר נחזיק יותר מלאי ביטחון?",o:["מוצר ב׳ — יש לו יותר חודשים של נתוני צריכה","מוצר א׳ — הצריכה שלו תנודתית (סטיית תקן גדולה)","מוצר ב׳ — הצריכה החודשית הממוצעת שלו גבוהה יותר","באותה כמות — הצריכה הממוצעת של שניהם קרובה"],c:1,e:"מלאי הביטחון <bdi dir='ltr'>B = K·S·√t</bdi> תלוי בסטיית התקן <bdi dir='ltr'>S</bdi>, לא בממוצע. במוצר ב׳ הממוצע אמנם מעט גבוה יותר (20.6 מול 19.2), אך הצריכה כמעט קבועה; במוצר א׳ היא נעה בין 7 ל-45. (מצגת 5, שקף 6)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"מהן שלוש הגישות לחישוב מלאי ביטחון שהוצגו במצגת?",o:["לפי ניסיון המחסנאי; לפי הנחיית הספק; לפי מספר ההזמנות בשנה ולפי זמן המחזור","כנגזרת מקצב הצריכה; לפי ערך המלאי הממוצע; לפי מקדם אחזקת המלאי <bdi dir='ltr'>i</bdi> של הארגון","סטטיסטית; לפי <bdi dir='ltr'>EOQ</bdi> (חצי מהכמות המוזמנת); לפי פארטו (מלאי ביטחון רק לפריטי <bdi dir='ltr'>A</bdi>)","סטטיסטית; כנגזרת מקצב הצריכה (חודש צריכה); כנגזרת מהצריכה בזמן האספקה (50%)"],c:3,e:"שקף 7: (1) גישה סטטיסטית (התפלגות נורמלית); (2) כנגזרת מקצב הצריכה — ״שפה של אנשי לוגיסטיקה״, למשל חודש צריכה; (3) כנגזרת מקצב הצריכה בזמן האספקה — למשל 50% מהצריכה בזמן האספקה. (מצגת 5, שקף 7)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"בנוסחה <bdi dir='ltr'>B = K·S·√t</bdi>, מה חייב להתקיים לגבי היחידות של <bdi dir='ltr'>S</bdi> ושל <bdi dir='ltr'>t</bdi>?",o:["אין חשיבות ליחידות, כי השורש מנטרל את ההבדלים","<bdi dir='ltr'>t</bdi> נמדד תמיד בימים, ו-<bdi dir='ltr'>S</bdi> תמיד ביחידות לשנה","<bdi dir='ltr'>t</bdi> נמדד תמיד בשנים, כמו הצריכה השנתית <bdi dir='ltr'>λ</bdi>","<bdi dir='ltr'>t</bdi> נמדד באותה יחידת זמן שבה נמדדה סטיית התקן של הצריכה"],c:3,e:"בכל הדוגמאות: <bdi dir='ltr'>S</bdi> לצריכה שבועית ← זמן אספקה של 4 ימים נרשם כ-<bdi dir='ltr'>4/7 = 0.57</bdi> שבועות; <bdi dir='ltr'>S</bdi> חודשית ← שבועיים נרשמים כ-<bdi dir='ltr'>2/4.3</bdi> חודשים; <bdi dir='ltr'>S</bdi> יומית ← שבוע וחצי = 10.5 ימים. (מצגת 5, שקפים 9–16)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"לפי טבלת רמות השירות במצגת, מהו מקדם <bdi dir='ltr'>K</bdi> לרמת שירות של 90%?",o:["1.65","1.96","1.44","1.28"],c:0,e:"הטבלה בשקף 12: 85% ← 1.44; 88% ← 1.56; 90% ← 1.65; 92% ← 1.75; 95% ← 1.96. הערכים מתאימים להסתברות להימצא ״בין שני גבולות״ (סביב הממוצע), ולכן ההסתברות לחוסר היא חצי מהמשלים. 1.28 הוא הערך החד-צדדי של 90% מטבלאות סטטיסטיקה — לא זה שבשימוש בקורס. (מצגת 5, שקף 12)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"מהי ״נקודת ההזמנה״ <bdi dir='ltr'>(O.L)</bdi>?",o:["רמת המלאי שבה פונים לספק להזמנה — כמות במלאי, לא מועד","רמת המלאי שמתחתיה נוצר חוסר — מלאי הביטחון <bdi dir='ltr'>B</bdi>","הכמות שמזמינים בכל פעם מהספק, כלומר <bdi dir='ltr'>Q*</bdi>","המועד שבו הסחורה מגיעה בפועל למחסן — מועד ולא כמות"],c:0,e:"שקף 18: נקודת הזמנה — רמת המלאי שבה מתבצעת ההזמנה. ״רמת מלאי״ = הכמות במלאי ולא נקודת זמן; ״ביצוע ההזמנה״ = להתקשר לספק, לא אספקת ההזמנה בפועל. היא ״אזעקה״: כשהמלאי יורד אליה — מזמינים. (מצגת 5, שקפים 18, 21)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"כש-<bdi dir='ltr'>t < T</bdi> (זמן האספקה קצר מזמן המחזור), בין אילו ערכים יכולה לנוע נקודת ההזמנה?",o:["בין <bdi dir='ltr'>Q/2</bdi> ל-<bdi dir='ltr'>Q</bdi>","בין <bdi dir='ltr'>B</bdi> ל-<bdi dir='ltr'>Q/2</bdi>","בין 0 ל-<bdi dir='ltr'>B</bdi>","בין <bdi dir='ltr'>B</bdi> ל-<bdi dir='ltr'>B+Q</bdi>"],c:3,e:"המלאי נע בין <bdi dir='ltr'>B+Q</bdi> (כשההזמנה מגיעה) ל-<bdi dir='ltr'>B</bdi> (רגע לפני ההזמנה הבאה). <bdi dir='ltr'>O.L = B + Q·t/T</bdi>, ו-<bdi dir='ltr'>0 < t/T < 1</bdi> — ולכן <bdi dir='ltr'>O.L</bdi> בין <bdi dir='ltr'>B</bdi> ל-<bdi dir='ltr'>B+Q</bdi>. בדוגמה: <bdi dir='ltr'>B = 30, Q = 100</bdi> ← טווח 30 עד 130. (מצגת 5, שקפים 19–21)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"ברמת זמינות של 95%, מהי ההסתברות לחוסר לפי השיטה שהוצגה במצגת?",o:["1.96% — כמו מקדם <bdi dir='ltr'>K</bdi> של רמת שירות 95%","5% — כל המשלים של רמת הזמינות","2.5% — חצי מהמשלים ל-100%","95% — ההסתברות שהפריט יימצא במלאי"],c:2,e:"שקף 27: ״ההסתברות לחוסר = המשלים של רמת הזמינות לחלק לשניים״ — ב-95%: 2.5% הסתברות לעודף ו-2.5% הסתברות לחוסר. ימי מחסור = מספר הזמנות בשנה · זמן אספקה · ההסתברות לחוסר. (מצגת 5, שקפים 27–28)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"ארגון מוריד את רמת הזמינות הנדרשת מ-95% ל-90%. מה יקרה?",o:["מלאי הביטחון יגדל כדי לפצות, וימי המחסור בשנה יקטנו","מלאי הביטחון יקטן, וגם מספר ימי המחסור בשנה יקטן בהתאם","מלאי הביטחון לא ישתנה — רק עלות ההזמנות השנתית תשתנה","מלאי הביטחון יקטן, אך ימי המחסור ועלות החוסר יגדלו"],c:3,e:"<bdi dir='ltr'>K</bdi> יורד מ-1.96 ל-1.65 ← <bdi dir='ltr'>B</bdi> קטן ← עלות האחזקה <bdi dir='ltr'>TC</bdi> קטנה. ההסתברות לחוסר עולה מ-2.5% ל-5% ← ימי המחסור מוכפלים ועלות החוסר עולה. זה שיעורי הבית בשקף 30: להשוות את סך העלויות (אחזקה + חוסר) בכל רמת זמינות. (מצגת 5, שקף 30)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"לפי המצגת, ממה מורכבת עלות יום חוסר במלאי?",o:["שכירות וביטוח של המחסן","עלויות מימון והתיישנות המלאי","עלויות הובלה ועמילות מכס","הפסדי עסקאות והפסדי מוניטין"],c:3,e:"שקף 28: לכל יום חוסר אפשרי יש עלות שמבטאת את הנזק שנובע מהחוסר — הפסדי עסקאות והפסדי מוניטין. בדוגמה: 1,000 ₪ ליום ← <bdi dir='ltr'>21.5 · 1,000 = 21,500</bdi> ₪ בשנה. (מצגת 5, שקף 28)"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"נתוני הצריכה השבועית של פריט:<br><table><tr><th>שבוע</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>צריכה</th><td>200</td><td>230</td><td>180</td><td>250</td><td>210</td><td>190</td></tr></table>מהי סטיית התקן של הצריכה השבועית, כפי שמחשבים אותה בקורס?",o:["26.08","680.00","23.80","20.00"],c:0,e:"ממוצע: <bdi dir='ltr'>1,260 / 6 = 210</bdi>. סטיות: −10, 20, −30, 40, 0, −20; ריבועים: <bdi dir='ltr'>100 + 400 + 900 + 1,600 + 0 + 400 = 3,400</bdi>.<br>סטיית תקן מדגמית (חלוקה ב-<bdi dir='ltr'>n−1</bdi>, כמו בשקפים): <bdi dir='ltr'>S = √(3,400 / 5) = √680 = 26.08</bdi>.<br>23.80 — חלוקה ב-<bdi dir='ltr'>n=6</bdi>; 680 — השונות (בלי שורש); 20 — ממוצע הסטיות המוחלטות. (מצגת 5, שקף 9: <bdi dir='ltr'>S = 24.22</bdi> לנתונים 120…110)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"סטיית התקן של הצריכה השבועית היא 26.08 יחידות, זמן האספקה 3 ימים, ונדרשת רמת שירות של 95%. מהו מלאי הביטחון?",o:["21.90","33.46","28.17","88.53"],c:1,e:"<bdi dir='ltr'>S</bdi> שבועית ← זמן האספקה בשבועות: <bdi dir='ltr'>t = 3/7 = 0.4286</bdi>; <bdi dir='ltr'>K(95%) = 1.96</bdi>.<br><bdi dir='ltr'>B = 1.96 · 26.08 · √0.4286 = 1.96 · 26.08 · 0.6547 = 33.46</bdi>.<br>טעויות: בלי השורש (21.90); <bdi dir='ltr'>t = 3</bdi> בלי המרה (88.53); <bdi dir='ltr'>K</bdi> של 90% (28.17). (בשקף 10 של המצגת כתוב <bdi dir='ltr'>B = 24</bdi> — זה מתקבל בלי השורש; עם השורש <bdi dir='ltr'>1.75·24.22·√(4/7) = 32.04</bdi>.) (מצגת 5, שקפים 8–10)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"סטיית התקן של הצריכה החודשית היא 40 יחידות, זמן האספקה שבועיים, ונדרשת רמת שירות של 90% (בחודש 4.3 שבועות). מהו מלאי הביטחון?",o:["45.01","46.67","30.70","93.34"],c:0,e:"<bdi dir='ltr'>S</bdi> חודשית ← <bdi dir='ltr'>t</bdi> בחודשים: <bdi dir='ltr'>t = 2/4.3 = 0.4651</bdi>; <bdi dir='ltr'>K(90%) = 1.65</bdi>.<br><bdi dir='ltr'>B = 1.65 · 40 · √0.4651 = 66 · 0.6820 = 45.01</bdi>.<br>טעויות: <bdi dir='ltr'>t = 2 (93.34)</bdi>; בלי שורש (30.70); חודש = 4 שבועות (46.67). (מצגת 5, שקפים 11, 15 — מוצר א׳)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"סטיית התקן של הצריכה היומית היא 12 יחידות, זמן האספקה שבוע וחצי, ונדרשת רמת שירות של 88%. מהו מלאי הביטחון?",o:["22.93","64.16","60.66","196.56"],c:2,e:"<bdi dir='ltr'>S</bdi> יומית ← <bdi dir='ltr'>t</bdi> בימים: שבוע וחצי = <bdi dir='ltr'>10.5</bdi> ימים; <bdi dir='ltr'>K(88%) = 1.56</bdi>.<br><bdi dir='ltr'>B = 1.56 · 12 · √10.5 = 18.72 · 3.2404 = 60.66</bdi>.<br>טעויות: <bdi dir='ltr'>t = 1.5 (22.93)</bdi>; בלי שורש (196.56); <bdi dir='ltr'>K</bdi> של 90% (64.16). (מצגת 5, שקף 16 — מוצר ג׳: <bdi dir='ltr'>1.56·14.01·√10.5 = 70.82</bdi>)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"צריכה חודשית של 1,290 יחידות (4.3 שבועות בחודש). מניחים שסטיית התקן השבועית של הצריכה שווה ל-50% מהצריכה השבועית. זמן האספקה חודש, ורמת השירות 95%. מהו מלאי הביטחון?",o:["294.00","2,621.50","609.65","1,264.20"],c:2,e:"צריכה שבועית: <bdi dir='ltr'>1,290 / 4.3 = 300</bdi> ← <bdi dir='ltr'>S = 0.5 · 300 = 150</bdi> (שבועית), ולכן <bdi dir='ltr'>t</bdi> בשבועות: <bdi dir='ltr'>t = 4.3</bdi>.<br><bdi dir='ltr'>B = 1.96 · 150 · √4.3 = 294 · 2.0736 = 609.65</bdi>.<br>טעויות: 50% מהצריכה החודשית (2,621.50); בלי שורש (1,264.20); <bdi dir='ltr'>t = 1</bdi> בלי המרה ליחידות שבועיות (294). (כמו שקף 29: <bdi dir='ltr'>S = 1000/4.3 · 0.5 = 116</bdi>, <bdi dir='ltr'>B = 1.96·116·√4.3 = 471</bdi>.) (מצגת 5, שקף 29)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"נתון: מלאי ביטחון 40 יחידות, כמות הזמנה 240, זמן מחזור 30 ימים וזמן אספקה 10 ימים. מהי נקודת ההזמנה?",o:["760","80","280","120"],c:3,e:"<bdi dir='ltr'>t = 10 < T = 30</bdi> ← <bdi dir='ltr'>O.L = B + Q·t/T = 40 + 240·10/30 = 40 + 80 = 120</bdi>.<br>כשהמלאי יורד ל-120 מזמינים; ב-10 ימי האספקה נצרכות 80 יחידות, וההזמנה מגיעה בדיוק כשנשארים 40 (מלאי הביטחון). 80 — שכחת <bdi dir='ltr'>B</bdi>; 280 — <bdi dir='ltr'>B+Q</bdi>; 760 — היפוך היחס. (מצגת 5, שקפים 20–21: <bdi dir='ltr'>30 + 100·18/24 = 105</bdi>)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"צריכה שנתית 12,000 יחידות, כמות הזמנה 500, מלאי ביטחון 600 יחידות וזמן אספקה 73 ימים. מהי נקודת ההזמנה?",o:["3,000","1,000","600","500"],c:1,e:"<bdi dir='ltr'>N = 12,000/500 = 24</bdi>, <bdi dir='ltr'>T = 365/24 = 15.21</bdi> ימים. <bdi dir='ltr'>t = 73 > T</bdi> ← הנוסחה למצב ב׳:<br><bdi dir='ltr'>t̂ = 73/365 = 0.2</bdi> שנה; <bdi dir='ltr'>⌊t/T⌋ = ⌊4.8⌋ = 4</bdi> (השלם הנמוך).<br><bdi dir='ltr'>O.L = B + λ·t̂ − Q·⌊t/T⌋ = 600 + 2,400 − 500·4 = 1,000</bdi>.<br>עיגול כלפי מעלה (5) נותן 500; בלי עיגול (4.8) יוצא בדיוק <bdi dir='ltr'>B = 600</bdi>; הנוסחה של <bdi dir='ltr'>t < T</bdi> נותנת 3,000. (מצגת 5, שקפים 20, 22–25)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"ארגון מבצע 24 הזמנות בשנה, זמן האספקה 10 ימים, ורמת הזמינות 90%. כמה ימי מחסור צפויים בשנה?",o:["6.00","24.00","12.00","1.20"],c:2,e:"הסתברות לחוסר = <bdi dir='ltr'>(1 − 0.90)/2 = 5%</bdi>.<br><bdi dir='ltr'>ימי מחסור = 24 · 10 · 0.05 = 12</bdi> ימים בשנה.<br>24 — כל המשלים (10%); 6 — ההסתברות של 95%; 1.2 — בלי זמן האספקה. (מצגת 5, שקפים 27–28: <bdi dir='ltr'>28.71·30·0.025 = 21.5</bdi>)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"מלאי ביטחון 200 יחידות, כמות הזמנה 400, מחיר יחידה 50 ₪, מקדם אחזקה 20%, צריכה שנתית 8,000 ועלות הזמנה 100 ₪. מהי עלות האחזקה וניהול המלאי השנתית (בלי עלות רכישה)?",o:["8,000 ₪","5,000 ₪","6,000 ₪","4,000 ₪"],c:2,e:"<bdi dir='ltr'>TC = (B + Q/2)·C·i + (λ/Q)·K = (200 + 200)·50·0.2 + (8,000/400)·100 = 4,000 + 2,000 = 6,000</bdi> ₪.<br>מלאי הביטחון נמצא במלאי כל הזמן, ולכן נוסף במלואו למלאי הממוצע. 4,000 — בלי <bdi dir='ltr'>B</bdi>; 5,000 — <bdi dir='ltr'>B/2</bdi>; 8,000 — <bdi dir='ltr'>B+Q</bdi> בלי חלוקה. (מצגת 5, שקף 29)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"בדוגמת המצגת <bdi dir='ltr'>(N = 28.71 הזמנות בשנה, זמן אספקה 30 ימים)</bdi> מורידים את רמת הזמינות ל-92%. כמה ימי מחסור צפויים בשנה?",o:["21.53","34.45","68.90","1.15"],c:1,e:"הסתברות לחוסר: <bdi dir='ltr'>(1 − 0.92)/2 = 4%</bdi> ← <bdi dir='ltr'>28.71 · 30 · 0.04 = 34.45</bdi> ימים (לעומת 21.5 ב-95%). בעלות 1,000 ₪ ליום — כ-34,450 ₪ בשנה. זה חלק משיעורי הבית בשקף 30. (מצגת 5, שקפים 27–30)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"בדוגמת המצגת <bdi dir='ltr'>(S = 116 שבועית, זמן אספקה חודש = 4.3 שבועות)</bdi>: מהו מלאי הביטחון ברמת זמינות של 92%?",o:["396.90","471.46","420.95","872.90"],c:2,e:"<bdi dir='ltr'>B = 1.75 · 116 · √4.3 = 203 · 2.0736 = 420.95</bdi> (לעומת 471 ב-95% ו-396.90 ב-90%).<br>מלאי קטן יותר ← עלות אחזקה נמוכה יותר, אך ימי מחסור רבים יותר — זה ה-<bdi dir='ltr'>trade-off</bdi> של שקף 30. (מצגת 5, שקפים 29–30)",k:"calc"},
{t:"מלאי ביטחון ונקודת הזמנה",s:"ניצן",q:"במבחן השתתפו 1,000 סטודנטים; הממוצע 76 וסטיית התקן 7. כמה סטודנטים צפויים לקבל ציון בין 62 ל-90?",o:["כ-670","כ-950","כ-998","כ-500"],c:1,e:"62 עד 90 = <bdi dir='ltr'>76 ± 14 = 76 ± 2S</bdi> — שתי סטיות תקן לכל צד, ובהן כ-95% מהתצפיות ← כ-950 סטודנטים. סטיית תקן אחת לכל צד (69–83) — כ-67% (670); שלוש (55–97) — 99.8%. (מצגת 5, שקף 13)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"פארטו ופילוחים",s:"ניצן",q:"מה מצא וילפרדו פארטו, הכלכלן האיטלקי, ומה המליץ לאגף הגבייה?",o:["כ-80% מהמשפחות מעלימות מס — ולכן להגדיל את מספר המפקחים בכל אזורי הארץ","כ-80% מההון נמצא בידי כ-20% מהמשפחות — ולכן להשקיע את רוב מאמצי הגבייה בהן","כ-20% מההון נמצא בידי כ-80% מהמשפחות — ולכן לפזר את מאמצי הגבייה באופן שווה","כ-50% מההון נמצא בידי כ-50% מהמשפחות — ולכן להנהיג מס אחיד לכל משקי הבית"],c:1,e:"שקף 3: פארטו ייעץ לאגף הגבייה של מס הכנסה ומצא ש-80% מההון של משקי הבית באיטליה נמצא בידי 20% מהמשפחות — המשפחות העשירות שמגלגלות מחזור כספים גדול — ולכן המליץ להשקיע את רוב מאמצי הגבייה באותן משפחות. (מצגת 6, שקף 3)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"האם עיקרון 80:20 פירושו גם ש-90% מההון נמצא בידי 10% מהמשפחות (״השלמה ל-100%״)?",o:["כן — שני האחוזים תמיד משלימים זה את זה ל-100%, בכל חלוקה","כן — אבל רק כשמדובר בהון, ולא בפריטי מלאי או בתלונות","לא — האחוזים מתייחסים לבסיסים שונים, ואין חובה שיסתכמו ל-100%","לא — הכלל תקף רק לחלוקה של 80:20 בדיוק, ולא לשום חלוקה אחרת"],c:2,e:"80% הוא חלק מההון ו-20% הוא חלק מהאוכלוסייה — שני בסיסים שונים, ולכן אין ״השלמה״ ל-100%. הדוגמה מישראל בשקף 4 ממחישה: כ-45% מההון והנכסים נמצאים בידי כ-0.25% מהאוכלוסייה. (מצגת 6, שקפים 3–4)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"לפי המצגת, איזה חלק מההון והנכסים בישראל נמצא בידי כ-0.25% מהאוכלוסייה (אילי ההון)?",o:["כ-45%","כ-20%","כ-80%","כ-10%"],c:0,e:"שקף 4: בישראל כ-45% מההון והנכסים נמצאים בידי 0.25% מהאוכלוסייה — אילי ההון. ״מתברר שפארטו קיים בכל נקודה בחיינו״. (מצגת 6, שקף 4)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"ברשת של 100 סניפי קופת חולים, שיעור גבוה מאוד מהתלונות מתרכז ב-10–15 סניפים. מה ההמלצה הניהולית ברוח פארטו?",o:["להתעלם מהתלונות, כי רוב הסניפים (85–90) פועלים כראוי ואין בעיה מערכתית","לחלק את תקציב השיפור באופן שווה בין כל 100 הסניפים, כדי לשמור על הוגנות","למקד את מאמצי השיפור והבקרה בסניפים המעטים שמרכזים את רוב התלונות","לסגור מיד את כל הסניפים שיש בהם תלונות ולהעביר את המבוטחים לסניפים אחרים"],c:2,e:"זה לב הגישה: מעט גורמים אחראים לחלק הארי של התוצאה, ולכן משקיעים את רוב המאמץ בהם — כמו פארטו שהמליץ למקד את הגבייה במשפחות העשירות. באותו אופן: כבישים ״אדומים״ שבהם רוב התאונות הקטלניות, ומתלוננים סדרתיים. (מצגת 6, שקפים 4–6)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"מהם שלבי העבודה בניתוח פארטו, לפי הסדר?",o:["דירוג מהנמוך לגבוה ← חישוב ממוצע ← חישוב סטיית תקן ← גרף ומסקנות","הצגת הפריטים וערכיהם ← אחוז יחסי ומצטבר ← גרף ומסקנות ← דירוג מהגבוה לנמוך","הצגת הפריטים וערכיהם ← דירוג מהגבוה לנמוך ← אחוז יחסי ומצטבר ← גרף ומסקנות","חישוב אחוז מצטבר ← הצגת הפריטים וערכיהם ← דירוג מהנמוך לגבוה ← גרף ומסקנות"],c:2,e:"שקף 8: (1) הצגת פריטי המידע כולל ערכים כמותיים; (2) דירוג מהגבוה לנמוך בחתך הנבחר; (3) חישוב אחוז יחסי ואחוז מצטבר; (4) שרטוט גרף ומסקנות ניהוליות. את האחוז המצטבר אפשר לחשב רק אחרי הדירוג. (מצגת 6, שקף 8)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"מהו היתרון הגדול של פילוחים עסקיים בשיטת פארטו, לפי המצגת?",o:["מתאים לניהול מלאי בלבד, ולא לתחומים אחרים","אין צורך בנתונים כמותיים כלל","חישוב פשוט שמוביל למסקנות משמעותיות","דיוק סטטיסטי גבוה גם במדגם קטן מאוד"],c:2,e:"שקף 7: ניתן למצוא פילוחים שיהוו בסיס לקבלת החלטות עסקיות בכל תחום עסקי ובכל נושא. יתרון גדול מאוד — חישוב פשוט, מסקנות משמעותיות. (מצגת 6, שקף 7)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"ברשת מרפאות, סניף חרות קיבל הכי הרבה תלונות (85 בשנה), אבל יש בו גם כ-5,200 מבקרים בחודש. מדוע פילוח לפי מספר התלונות המוחלט ״אינו איכותי״?",o:["כי תלונות אינן נתון כמותי, ולכן אי אפשר לפלח לפיהן","כי מספר התלונות קטן מדי כדי לחשב אחוז יחסי ואחוז מצטבר","כי בפארטו צריך לדרג מהנמוך לגבוה, ולא מהגבוה לנמוך","כי אינו מנרמל לגודל הסניף — צריך תלונות ביחס למבקרים"],c:3,e:"סניף גדול יקבל יותר תלונות גם אם השירות בו טוב. בפילוח תלונות למבקרים (שקף 15) מתהפכת התמונה: גלעד — <bdi dir='ltr'>39 / 497 ≈ 7.8%</bdi> מהמבקרים מתלוננים (בעייתי), ואילו חרות, חופית וירמוך ״מצטיינים״. זה הפילוח הרב-ממדי: מספר פילוחים בחתכים שונים. (מצגת 6, שקפים 13–15)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"בדוגמת רשת המרפאות נבדק אם ריבוי התלונות בסניף גלעד נובע מעומס (מבקרים לעובד). ירמוך — הסניף העמוס ביותר — כמעט בלי תלונות ביחס למבקריו. מה המסקנה?",o:["אין מתאם בין העומס לתלונות — הבעיה בגלעד נובעת כנראה משירות לא איכותי","ירמוך כנראה מסתיר תלונות — יש לבדוק שוב את נתוני הסניף ואת שיטת הדיווח","פילוח לפי עומס אינו רלוונטי כאן, כי כל הסניפים באותו גודל בערך","העומס הוא הגורם לתלונות — יש להוסיף מיד עובדים ותקנים לסניף גלעד"],c:0,e:"שקף 16: ״מתקבל שאין מתאם בין עומס העובדים לעוצמת בעיית התלונות. סניף ירמוך למרות העומס הגבוה... מספר התלונות יחסית למספר המבקרים קטן מאוד... מכאן שכנראה בעיית התלונות נובעת משירות לא איכותי״. (מצגת 6, שקף 16)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"מה בודק פילוח לפי נתח שוק (מבוטחים מתוך כלל האוכלוסייה באזור) בדוגמת רשת המרפאות, ומה התגלה?",o:["האם יש מספיק רופאים — והתגלה שכל הסניפים מאוישים כנדרש","האם הלקוחות ״מצביעים ברגליים״ — ואכן הם עוזבים סניפים עם בעיית תלונות חמורה","האם העומס על העובדים גבוה — והתגלה שהסניפים העמוסים מאבדים לקוחות","האם המחירים אחידים — והתגלה שהסניפים הזולים מושכים יותר מבוטחים"],c:1,e:"שקף 17: ״ניתן לראות שאכן הלקוחות עוזבים סניפים להם בעיית תלונות חמורה (גלעד), ולעומת זאת מצטרפים לסניפים שנותנים רמת שירות גבוהה (חופית וירמוך)״. (מצגת 6, שקף 17)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"מה מבטא פילוח פארטו לפי ערך צריכה שנתית (צריכה × מחיר)?",o:["את הקריטיות של הפריט לתפעול השוטף","את המשקל הכלכלי של הפריט","את מספר היחידות שנצרכות מהפריט בשנה","את הנפח שהפריט תופס במחסן"],c:1,e:"שקף 20: ״פילוח המבטא את משקלו הכלכלי של הפריט, או מהו שיעור התרומה של הפריט למחזור הכספים״. מחלקים לקבוצות <bdi dir='ltr'>(A, B, C)</bdi> לצורך מדיניות מלאי דיפרנציאלית. קריטיות, צריכה ונפח הם פילוחים נוספים ונפרדים (שקף 26). (מצגת 6, שקפים 20, 26)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"במחסן של 1,000 מק״טים, מהי חלוקת <bdi dir='ltr'>ABC</bdi> ״סבירה״ לפי המצגת?",o:["<bdi dir='ltr'>A</bdi> — כ-50 מק״טים וכ-80% מהערך; <bdi dir='ltr'>B</bdi> — כ-150 וכ-15%; <bdi dir='ltr'>C</bdi> — כ-800 וכ-5%","<bdi dir='ltr'>A</bdi> — כ-50 מק״טים וכ-5% מהערך; <bdi dir='ltr'>B</bdi> — כ-150 וכ-15%; <bdi dir='ltr'>C</bdi> — כ-800 וכ-80%","<bdi dir='ltr'>A</bdi> — כ-800 מק״טים וכ-80% מהערך; <bdi dir='ltr'>B</bdi> — כ-150 וכ-15%; <bdi dir='ltr'>C</bdi> — כ-50 וכ-5%","<bdi dir='ltr'>A</bdi> — כ-200 מק״טים וכ-80% מהערך; <bdi dir='ltr'>B</bdi> — כ-300 וכ-15%; <bdi dir='ltr'>C</bdi> — כ-500 וכ-5%"],c:0,e:"שקף 24: <bdi dir='ltr'>A</bdi> כוללת כ-50 מק״טים (5%) אך מהווה כ-80% מערך הצריכה השנתית; <bdi dir='ltr'>B</bdi> — 150 מק״טים (15%) וכ-15%; <bdi dir='ltr'>C</bdi> — 800 מק״טים (80%) אך רק כ-5% מהערך. בדוגמת המוסך (שקף 23): 2 פריטים = 79%, 3 פריטים = 20%, 6 פריטים = פחות מ-1%. (מצגת 6, שקפים 23–24)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"מהי מדיניות המלאי המומלצת לפריטי <bdi dir='ltr'>A</bdi> ולפריטי <bdi dir='ltr'>C</bdi>?",o:["<bdi dir='ltr'>A</bdi> ו-<bdi dir='ltr'>C</bdi> — אותה מדיניות בדיוק, כדי לשמור על אחידות בניהול המחסן ולפשט את עבודת המעתדים","<bdi dir='ltr'>A</bdi> — כמויות קטנות ומדודות בלי בקרה מיוחדת; <bdi dir='ltr'>C</bdi> — ספירות מלאי תכופות וקשב ניהולי צמוד","<bdi dir='ltr'>A</bdi> — כמויות גדולות כדי לא להסתכן בחוסר; <bdi dir='ltr'>C</bdi> — כמויות קטנות ומדודות עם בקרה קפדנית וספירות תכופות","<bdi dir='ltr'>A</bdi> — כמויות קטנות ומדודות עם ״קשב ניהולי״; <bdi dir='ltr'>C</bdi> — כמויות גדולות וזמינות גבוהה (״שקט ניהולי״)"],c:3,e:"שקף 25: פריטי <bdi dir='ltr'>A</bdi> — כמויות קטנות ומדודות; בעיית הזמינות נפתרת ב״קשב ניהולי״ — בקרה קפדנית וספירות מלאי תכופות; חיסכון משמעותי בגלל משקלם הכלכלי. פריטי <bdi dir='ltr'>C</bdi> — הזמנה בכמויות גדולות כדי לספק זמינות גבוהה ברוב הפריטים (80%), ״שקט ניהולי״ שמפנה את המעתדים לפריטי <bdi dir='ltr'>A</bdi>. (מצגת 6, שקף 25)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"בניתוח <bdi dir='ltr'>ABC</bdi>, מהי מדיניות המלאי המומלצת לפריטי <bdi dir='ltr'>B</bdi>?",o:["בלי מלאי ביטחון כלל, כי ערך הצריכה שלהם בינוני בלבד","הזמנות כמו בקבוצה <bdi dir='ltr'>A</bdi>, אך עם מלאי ביטחון גדול יותר","הזמנה רק לפי דרישה, בלי להחזיק מלאי","הזמנות כמו בקבוצה <bdi dir='ltr'>C</bdi> — בכמויות גדולות מאוד ובתדירות נמוכה"],c:1,e:"שקף 25: ״פריטים מקבוצה <bdi dir='ltr'>B</bdi>, בדרך כלל נבצע הזמנות כמו בקבוצה <bdi dir='ltr'>A</bdi>, אך עם מלאי ביטחון גדול יותר״. (מצגת 6, שקף 25)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"לפי ״פילוחים נוספים חשובים״, באילו פריטים נשאף להחזיק פחות מלאי?",o:["פריטים בעלי צריכה גבוהה, ופריטים עם אספקה מורכבת","פריטים עם זמני אספקה ארוכים, ופריטים בעלי נפח גבוה","פריטים קריטיים, ופריטים עם זמני אספקה ארוכים","פריטים רגישים לפג תוקף, ופריטים בעלי נפח גבוה"],c:3,e:"שקף 26: קריטיות גבוהה — יותר; צריכה גבוהה — יותר; רגישות לפג תוקף — פחות; זמני אספקה ארוכים — יותר; מורכבות אספקה גבוהה — יותר; נפח גבוה — פחות. כשפילוחים סותרים (פריט <bdi dir='ltr'>A</bdi> קריטי, פריט <bdi dir='ltr'>C</bdi> רגיש לתפוגה) — נדרש שיקול דעת (שקף 27). (מצגת 6, שקפים 26–27)"},
{t:"פארטו ופילוחים",s:"ניצן",q:"פניות לשירות <bdi dir='ltr'>Take Away</bdi> בתקופת הקורונה:<br><table><tr><th>סוג הפנייה</th><th>מספר פניות</th></tr><tr><th>זמן משלוח ארוך</th><td>35</td></tr><tr><th>אוכל קר</th><td>20</td></tr><tr><th>הזמנה לא מדויקת</th><td>13</td></tr><tr><th>אריזת המשלוח</th><td>6</td></tr><tr><th>שליח לא אדיב</th><td>2</td></tr></table>מהו האחוז המצטבר של שני סוגי הפניות המובילים?",o:["55.00%","26.32%","46.05%","72.37%"],c:3,e:"סה״כ <bdi dir='ltr'>35 + 20 + 13 + 6 + 2 = 76</bdi> פניות. אחוז יחסי: <bdi dir='ltr'>35/76 = 46.05%</bdi>, <bdi dir='ltr'>20/76 = 26.32%</bdi>. אחוז מצטבר של השניים: <bdi dir='ltr'>55/76 = 72.37%</bdi> (בשקף מעוגל: 46%, 72%).<br>המסקנה בשקף 11: ״זמן משלוח ארוך״ הוא המניע העיקרי (46%) — יש להשקיע בקיצור זמני המשלוח ובאוכל חם. 55 הוא מספר הפניות, לא אחוז. (מצגת 6, שקפים 9–11)",k:"calc"},
{t:"פארטו ופילוחים",s:"ניצן",q:"נתוני פריטים במוסך:<br><table><tr><th>פריט</th><th>צריכה שנתית</th><th>מחיר ליחידה (₪)</th></tr><tr><th>משאבה</th><td>400</td><td>250</td></tr><tr><th>מדחס</th><td>50</td><td>1,200</td></tr><tr><th>מסנן</th><td>2,000</td><td>10</td></tr><tr><th>צמיג</th><td>300</td><td>30</td></tr><tr><th>בורג</th><td>5,000</td><td>1.20</td></tr><tr><th>אטם</th><td>1,000</td><td>5</td></tr></table>איזה פריט מדורג ראשון בפילוח פארטו לפי ערך צריכה שנתית?",o:["בורג","משאבה","מסנן","מדחס"],c:1,e:"ערך צריכה = צריכה × מחיר: משאבה <bdi dir='ltr'>400·250 = 100,000</bdi>; מדחס <bdi dir='ltr'>50·1,200 = 60,000</bdi>; מסנן <bdi dir='ltr'>2,000·10 = 20,000</bdi>; צמיג <bdi dir='ltr'>300·30 = 9,000</bdi>; בורג <bdi dir='ltr'>5,000·1.2 = 6,000</bdi>; אטם <bdi dir='ltr'>1,000·5 = 5,000</bdi>.<br>הבורג נצרך בכמות הגדולה ביותר והמדחס הוא היקר ביותר — אבל הדירוג הוא לפי המכפלה. (מצגת 6, שקפים 21–22)",k:"calc"},
{t:"פארטו ופילוחים",s:"ניצן",q:"ערכי הצריכה השנתית של פריטים במוסך: משאבה 100,000 ₪, מדחס 60,000, מסנן 20,000, צמיג 9,000, בורג 6,000, אטם 5,000. מהו האחוז המצטבר של שני הפריטים המובילים?",o:["80.00%","50.00%","13.00%","90.00%"],c:0,e:"סה״כ <bdi dir='ltr'>200,000</bdi> ₪. משאבה <bdi dir='ltr'>50%</bdi>, מדחס <bdi dir='ltr'>30%</bdi> ← מצטבר <bdi dir='ltr'>80%</bdi> — שני פריטים (33% מהמק״טים) מרכזים 80% מערך הצריכה: קבוצה <bdi dir='ltr'>A</bdi>. מסנן (10%) מביא את המצטבר ל-90%. 13% — שני הפריטים עם הצריכה הגבוהה ביותר (בורג ומסנן). (מצגת 6, שקפים 22–23)",k:"calc"},
{t:"פארטו ופילוחים",s:"ניצן",q:"נתוני תלונות ומבקרים בארבעה סניפים:<br><table><tr><th>סניף</th><th>תלונות בשנה</th><th>מבקרים בחודש</th></tr><tr><th>א׳</th><td>60</td><td>3,000</td></tr><tr><th>ב׳</th><td>45</td><td>900</td></tr><tr><th>ג׳</th><td>30</td><td>2,000</td></tr><tr><th>ד׳</th><td>20</td><td>800</td></tr></table>איזה סניף בעייתי ביותר לאחר נרמול התלונות למספר המבקרים?",o:["סניף ג׳ — כ-1.5% מהמבקרים מתלוננים","סניף א׳ — הכי הרבה תלונות (60 בשנה)","סניף ד׳ — כ-2.5% מהמבקרים מתלוננים","סניף ב׳ — כ-5.0% מהמבקרים מתלוננים"],c:3,e:"תלונות / מבקרים: א׳ <bdi dir='ltr'>60/3,000 = 2.0%</bdi>; ב׳ <bdi dir='ltr'>45/900 = 5.0%</bdi>; ג׳ <bdi dir='ltr'>30/2,000 = 1.5%</bdi>; ד׳ <bdi dir='ltr'>20/800 = 2.5%</bdi>.<br>הדירוג מתהפך: א׳ מוביל במספר המוחלט, אך ב׳ בעייתי פי 2.5 ממנו ביחס לגודלו — כמו גלעד בדוגמת המצגת. (מצגת 6, שקפים 14–15)",k:"calc"}
]);
