<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — ניהול שרשרת ההספקה</title>
<style>
:root{
  --bg:#f5f7f6; --surface:#ffffff; --surface2:#eef2f1; --text:#1c2321; --muted:#66706d;
  --border:#dfe5e3; --borderS:#c8d1ce; --accent:#1f6f8b; --accentSoft:#e3f0f5;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#0f6e56; --clsBg:#e1f5ee;
  --chipBg:#eaefee;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#181c1b; --surface:#212625; --surface2:#2b3130; --text:#e9ecea; --muted:#9ea7a4;
    --border:#333b39; --borderS:#48524f; --accent:#6fb7d3; --accentSoft:#1c3441;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9fe1cb; --clsBg:#0d4438;
    --chipBg:#2b3130;
  }
}
html.dark{
  --bg:#181c1b; --surface:#212625; --surface2:#2b3130; --text:#e9ecea; --muted:#9ea7a4;
  --border:#333b39; --borderS:#48524f; --accent:#6fb7d3; --accentSoft:#1c3441;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9fe1cb; --clsBg:#0d4438;
  --chipBg:#2b3130;
}
html.light{
  --bg:#f5f7f6; --surface:#ffffff; --surface2:#eef2f1; --text:#1c2321; --muted:#66706d;
  --border:#dfe5e3; --borderS:#c8d1ce; --accent:#1f6f8b; --accentSoft:#e3f0f5;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#0f6e56; --clsBg:#e1f5ee;
  --chipBg:#eaefee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
/* קישורים לחומרי עזר */
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
/* שם נושא (למשל ״ניהול מלאי ו-EOQ״) מבודד — כדי שהמספר שאחריו לא יידבק ל-EOQ */
.iso{unicode-bidi:isolate;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
/* טבלאות נתונים בתוך שאלות חישוב */
.qtext table,.expl table,.rev table,.pq table{border-collapse:collapse;font-size:14px;margin:8px 0;
  font-weight:500;font-variant-numeric:tabular-nums;}
.qtext td,.qtext th,.expl td,.expl th,.rev td,.rev th,.pq td,.pq th{border:1px solid var(--borderS);
  padding:3px 11px;text-align:center;}
.qtext th,.expl th,.rev th,.pq th{background:var(--surface2);font-weight:650;}
/* טבלה רחבה (למשל 11 עמודות) נגללת בתוך הכרטיס, ולא מרחיבה את כל העמוד */
.qtext table,.expl table,.rev table{display:block;max-width:100%;overflow-x:auto;}
/* נוסחאות בתוך טקסט עברי: יחידה אחת משמאל לימין, שאינה נשברת באמצע בין שורות
   מימין לשמאל. אם הנוסחה ארוכה משורה — היא נשברת בתוך עצמה, עדיין משמאל לימין. */
.qtext bdi,.expl bdi,.rev bdi,.pq bdi{display:inline-block;direction:ltr;unicode-bidi:isolate;max-width:100%;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בצבע נייטרלי,
   באותה שפה חזותית של "נענתה" במפת השאלות. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
/* דף נפרד מהאפליקציה: הכל נפרש ברצף, בלי אינטראקציה, ובצפיפות
   שמתאימה לנייר — לתרגול על דף, עם מחשבון, כמו במבחן עצמו. */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#1a4f8a;--muted:#444;--okTx:#0a5c22;--border:#bbb;--borderS:#999;--surface2:#eee;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
  .pq table{font-size:8.6pt;margin:1mm 0;}
  .pq td,.pq th{padding:.4mm 2mm;}
}
</style>
</head>

<script>
var BANK=[];

BANK.push.apply(BANK,[
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מנהל מחסן בבסיס לוגיסטי מזהה שיעור גבוה של טעויות ליקוט. הוא מנסח תוכנית שיפור, מיישם אותה במחסן אחד כפיילוט, בודק את התוצאות ולפיהן מחליט אם להטמיע את השינוי בכל המחסנים. איזה מודל מהמצגת מתאר את מחזור הפעולה הזה?",o:["מעגל <bdi dir='ltr'>PDCA (Plan</bdi>–<bdi dir='ltr'>Do</bdi>–<bdi dir='ltr'>Check</bdi>–<bdi dir='ltr'>Act</bdi>) המוצג כתהליך","מודל הכדורגל, שבו המערך משתנה לפי השלב במחזור החיים","שרשרת פיתוח המוצר, מדרישה עסקית ועד לקוח מרוצה","עץ ה-<bdi dir='ltr'>KPI</bdi> של שרשרת האספקה, שבו כל מדד נגזר מקול הלקוח"],c:0,e:"תכנון <bdi dir='ltr'>(Plan)</bdi>, ביצוע <bdi dir='ltr'>(Do)</bdi>, בדיקה <bdi dir='ltr'>(Check)</bdi> ופעולה/הטמעה <bdi dir='ltr'>(Act)</bdi> הם ארבעת שלבי מעגל <bdi dir='ltr'>PDCA</bdi>, שבשקף 3 מוצג כ'תהליך' שבין הקלט לפלט במודל קלט–תהליך–פלט. מודל הכדורגל עוסק במבנה הארגון ולא במחזור שיפור, ועץ ה-<bdi dir='ltr'>KPI</bdi> הוא מערכת מדדים ולא מתודולוגיית פעולה. (שא-1, שקף 3)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"אילו שלושה תהליכי אב מרכזיים מזהה המצגת בארגון?",o:["פיתוח, ייצור ומכירות","פיתוח, אספקה ושירות","רכש, ייצור ולוגיסטיקה","תכנון, ביצוע ובקרה"],c:1,e:"שלושת תהליכי האב הם פיתוח (מצורך שוק למוצר בר-מכירה), אספקה (מדרישת לקוח ללקוח משתמש) ושירות (מפניית לקוח ללקוח מרוצה). רכש, ייצור ולוגיסטיקה הם בלוקים בתוך שרשרת האספקה הפנים-ארגונית, ולא תהליכי אב של הארגון כולו. (שא-1, שקף 4)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"יחידת אספקה בחיל הלוגיסטיקה מקבלת מגדוד דרישה לציוד, ורואה את עצמה אחראית עד שהציוד מגיע לידי החיילים ונעשה בו שימוש בפועל. באיזה תהליך אב מדובר, ומהם גבולותיו לפי המצגת?",o:["אספקה — מהזמנת רכש ועד יציאת המשלוח מהמחסן","שירות — מפניית לקוח ועד ללקוח מרוצה","אספקה — מדרישת לקוח ללקוח משתמש","פיתוח — מצורך שוק למוצר בר-מכירה"],c:2,e:"תהליך האספקה מוגדר במצגת 'מדרישת לקוח ללקוח משתמש' — הוא אינו מסתיים ביציאת המשלוח מהמחסן אלא רק כשהלקוח משתמש במוצר. הגדרת גבולות התהליך עד למשלוח בלבד מצמצמת את האחריות ואינה תואמת את המצגת; שירות ופיתוח הם תהליכי אב אחרים. (שא-1, שקף 4)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"לקוח של חברת מכשור רפואי פונה למוקד התמיכה בתלונה על מכשיר שאינו מכויל. הצוות מטפל בפנייה עד שהלקוח מביע שביעות רצון מהפתרון. לאיזה תהליך אב שייכת הפעילות, ומהו הפלט המוגדר שלו במצגת?",o:["שירות — מכשיר תקין ומכויל","אספקה — לקוח משתמש במוצר","פיתוח — מוצר בר-מכירה","שירות — לקוח מרוצה"],c:3,e:"תהליך האב 'שירות' מוגדר 'מפניית לקוח ללקוח מרוצה' — הפלט שלו הוא הלקוח המרוצה, ולא המכשיר המתוקן כשלעצמו. 'לקוח משתמש' הוא פלט תהליך האספקה, ו'מוצר בר-מכירה' הוא פלט תהליך הפיתוח. (שא-1, שקף 4)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מנכ״ל של חברת סטארט-אפ שעברה משלב הפיתוח לשלב הצמיחה מעביר משאבים מהפיתוח למכירות ולתפעול, ומסביר לדירקטוריון שעם המעבר לשלב חדש חייבת להשתנות גם החלוקה בין הפונקציות. איזה מודל מהמצגת עומד מאחורי ההסבר הזה?",o:["מעגל <bdi dir='ltr'>PDCA</bdi> — תכנון, ביצוע, בדיקה ופעולה מתקנת בכל תהליך","מודל הכדורגל — המערך משתנה לפי השלב במחזור החיים","עיקרון היחידות הייעודיות לתהליכים ייעודיים","שרשרת פיתוח המוצר בשבעה שלבים עוקבים"],c:1,e:"מודל הכדורגל ממשיל את מבנה הארגון למערך של קבוצת כדורגל (4:3:3, 3:2:5, 2:3:5), והמערך — כלומר חלוקת המשאבים בין הפונקציות — משתנה בהתאם לשלב במחזור החיים של הארגון או המוצר. מעגל <bdi dir='ltr'>PDCA</bdi> הוא מחזור שיפור ולא מודל של מבנה ארגוני. (שא-1, שקף 6)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בעקרונות היסוד לבניית מבנה ארגוני מופיע המושג 'שבירת התהליך'. מה משמעותו בהקשר של המצגת?",o:["כשל בתהליך שנובע ממעברים בין יחידות ארגוניות — תופעה שיש למנוע","ביטול תהליכים שאינם נכללים ב-80% התהליכים המרכזיים","חלוקת תהליך האב לתחומי אחריות ברורים ומוגדרים — צעד רצוי במבנה","פירוק הארגון ליחידות רווח עצמאיות המתחרות זו בזו"],c:2,e:"אצל שלמה ארליך 'שבירת' התהליך היא מושג חיובי: חלוקת תהליך האב לתחומי אחריות ברורים, כך שהמבנה הארגוני תומך בתהליך. זו אינה תקלה במעברים בין יחידות אלא עיקרון תכנוני מכוון, ואין לה קשר לביטול תהליכים. (שא-1, שקף 8)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"איזה מההיגדים הבאים אינו נמנה עם עקרונות היסוד לבניית מבנה ארגוני שבמצגת?",o:["המבנה הארגוני נבנה כך שיתמוך ב-80% מהתהליכים","מבנה פנים היחידה הארגונית נקבע על פי מבנה הלקוחות שהיא משרתת","יחידות ייעודיות מוקמות לתהליכים ייעודיים","יחידה אחת מרכזת את כל התהליכים כדי לחסוך בכוח אדם"],c:3,e:"העקרונות בשקף 8 הם: מבנה ארגוני תומך תהליך האב, 'שבירת' התהליך, 80% מהתהליכים, יחידות ייעודיות לתהליכים ייעודיים, ומבנה פנים היחידה לפי מבנה לקוחותיה. ריכוז כל התהליכים ביחידה אחת כדי לחסוך בכוח אדם סותר את עיקרון היחידות הייעודיות ואינו מופיע במצגת. (שא-1, שקף 8)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מחלקת שרשרת האספקה בחברת תרופות מארגנת מחדש את צוותיה: צוות לבתי חולים, צוות לרשתות בתי מרקחת וצוות למכרזים ממשלתיים, במקום חלוקה לפי סוגי מוצר. איזה עיקרון יסוד מהמצגת מיושם כאן?",o:["מבנה פנים היחידה הארגונית על פי מבנה לקוחותיה","יחידות ייעודיות המוקמות לתהליכים ייעודיים בארגון","מבנה ארגוני התומך בתהליכי האב המרכזיים של הארגון","'שבירת' התהליך לתחומי אחריות ברורים ומוגדרים"],c:0,e:"חלוקה פנימית לפי סוגי הלקוחות (בתי חולים, רשתות, ממשלה) היא יישום ישיר של העיקרון 'מבנה פנים היחידה הארגונית על פי מבנה לקוחותיה'. עיקרון היחידות הייעודיות עוסק בהתאמת יחידות לתהליכים, לא ללקוחות. (שא-1, שקף 8)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מהו הסדר הנכון של שלבי שרשרת פיתוח המוצר כפי שמוצג במצגת?",o:["מחקר ופיתוח ← פיתוח עסקי ← הנדסה ← שיווק יוצא ← תפעול ← מכירות ← שירות","פיתוח עסקי ← הנדסה ← מחקר ופיתוח ← תפעול ← מכירות ← שיווק יוצא ← שירות","פיתוח עסקי ← מחקר ופיתוח ← הנדסה ← תפעול ← שיווק יוצא ← מכירות ← שירות","שיווק יוצא ← פיתוח עסקי ← מחקר ופיתוח ← הנדסה ← תפעול ← מכירות ← שירות"],c:2,e:"השרשרת מתחילה בפיתוח עסקי (דרישה), עוברת למחקר ופיתוח (אב טיפוס), להנדסה (תיק מוצר, תיק ייצור, <bdi dir='ltr'>DFx</bdi>), לתפעול (מוצרים/שירותים), לשיווק יוצא (יצירת צורך/ביקוש), למכירות (רכישה) ומסתיימת בשירות (לקוח מרוצה). השיווק היוצא בא אחרי התפעול, ולא לפני הפיתוח העסקי. (שא-1, שקף 9)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברת מכשור אלקטרוני, צוות מסוים מקבל אב טיפוס עובד ומכין ממנו תיק מוצר ותיק ייצור, ומבצע התאמות לייצור ולתחזוקה <bdi dir='ltr'>(DFx)</bdi>. לאיזה שלב בשרשרת פיתוח המוצר שייכת הפעילות?",o:["שלב התפעול","שלב המחקר והפיתוח","שלב הפיתוח העסקי","שלב ההנדסה"],c:3,e:"תיק מוצר, תיק ייצור ו-<bdi dir='ltr'>DFx</bdi> הם התוצרים המוגדרים של שלב ההנדסה, שמקבל את אב הטיפוס ממחקר ופיתוח ומכין אותו לייצור. מחקר ופיתוח מפיק את אב הטיפוס, תפעול מייצר את המוצרים/השירותים, ופיתוח עסקי מגדיר את הדרישה. (שא-1, שקף 9)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"חברת מזון משיקה חטיף חדש. יחידה אחת מריצה קמפיין שמטרתו לגרום לצרכנים לרצות את המוצר, ויחידה אחרת סוגרת עסקאות עם רשתות השיווק. לפי שרשרת פיתוח המוצר, כיצד מוגדרים שני התפקידים?",o:["שיווק יוצא — יצירת צורך/ביקוש; מכירות — רכישה","מכירות — יצירת צורך/ביקוש; שיווק יוצא — רכישה בפועל","פיתוח עסקי — יצירת צורך/ביקוש; מכירות — רכישה","שיווק יוצא — יצירת צורך/ביקוש; שירות — רכישה"],c:0,e:"בשרשרת פיתוח המוצר, השיווק היוצא אחראי ליצירת הצורך/הביקוש, ואילו המכירות אחראיות לרכישה בפועל. פיתוח עסקי ממוקם בתחילת השרשרת ומגדיר את הדרישה, ושירות מסיים אותה בלקוח מרוצה. (שא-1, שקף 9)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"לפי שקף 'המערך התפעולי בארגון', איזו מהיחידות הבאות אינה מופיעה תחת תפעול?",o:["אדמיניסטרציה","מכירות","רכש","הנדסה"],c:1,e:"המערך התפעולי כולל הנדסה, שרשרת אספקה, שירות, רכש ואדמיניסטרציה. מכירות שייכות לאגף השיווק והמכירות — אחד משלושת האגפים הכפופים למנכ״ל לצד מחקר ופיתוח ותפעול (שקף 5) — ולא לתפעול. (שא-1, שקף 10)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברה תעשייתית מתנהל ויכוח: סמנכ״ל הכספים טוען שיחידת הרכש צריכה להיות כפופה לו, וסמנכ״ל התפעול טוען שהיא שייכת אליו. כיצד המצגת מציגה את חלופות המיקום של הרכש?",o:["רכש בשיווק או בתפעול, עם הבחנה בין רכש מקומי לגלובלי","רכש בפיתוח או בתפעול, עם הבחנה בין חומרים לשירותים","רכש בכספים בלבד, שכן מדובר בתהליך פיננסי במהותו","רכש בכספים או בתפעול, עם הבחנה בין רכש טקטי לרכש אסטרטגי"],c:3,e:"בשקף 10 מוצגות חלופות המיקום של הרכש: בכספים או בתפעול, תוך הבחנה בין רכש טקטי לרכש אסטרטגי. החלופות של הנדסה הן פיתוח או תפעול (הנדסת ייצור), ושל שירות — שיווק או תפעול. (שא-1, שקף 10)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"איזה מהצירופים הבאים של יחידה וחלופות המיקום שלה תואם את המצגת?",o:["הנדסה — בפיתוח או בתפעול (הנדסת ייצור)","שירות — בכספים או בתפעול (שירות טכני ללקוח)","רכש — בפיתוח או בשיווק (רכש אסטרטגי בלבד)","אדמיניסטרציה — בכספים או במחקר ופיתוח"],c:0,e:"חלופות המיקום בשקף 10: הנדסה — בפיתוח או בתפעול (כהנדסת ייצור); שירות — בשיווק או בתפעול; רכש — בכספים או בתפעול (טקטי/אסטרטגי). לאדמיניסטרציה לא מוצגות חלופות מיקום. (שא-1, שקף 10)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"איזה מהבאים אינו אחד מחמשת הבלוקים של מבנה שרשרת האספקה הפנים-ארגונית?",o:["רכש","שירות","ייצור","לוגיסטיקה"],c:1,e:"חמשת הבלוקים בשקף 11 הם ניהול חומר, רכש, ייצור, ניהול הזמנות ולוגיסטיקה. שירות הוא יחידה במערך התפעולי (שקף 10) ותהליך אב (שקף 4), אך אינו בלוק בשרשרת האספקה הפנים-ארגונית. (שא-1, שקף 11)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברת רכיבי אלקטרוניקה, צוות אחד מכין תחזיות ביקוש, מריץ <bdi dir='ltr'>MRP</bdi> לתכנון הצרכים ומנהל את רמות המלאי. לאיזה בלוק בשרשרת האספקה הפנים-ארגונית שייכת פעילות הצוות?",o:["רכש","ניהול הזמנות","ניהול חומר","לוגיסטיקה"],c:2,e:"תחזיות, <bdi dir='ltr'>MRP</bdi> ומלאי הם שלושת תתי-הסעיפים של בלוק ניהול החומר. רכש עוסק במיקור, ברכש ובקידום רכש; לוגיסטיקה במחסנים ובשילוח והפצה; ניהול הזמנות בקידום משלוחים. (שא-1, שקף 11)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"ביחידת הרכש של חברה ביטחונית עובדים שני אנשים: הראשון סורק את השוק, מאתר ספקים חדשים ומאשר אותם; השנייה מוציאה הזמנות רכש לספקים המאושרים ועוקבת אחר אישורן. כיצד מכנה המצגת את שני התפקידים?",o:["הראשון — רכש <bdi dir='ltr'>(Purchasing)</bdi>; השנייה — מיקור <bdi dir='ltr'>(Sourcing)</bdi>","הראשון — מיקור <bdi dir='ltr'>(Sourcing)</bdi>; השנייה — רכש <bdi dir='ltr'>(Purchasing)</bdi>","הראשון — קידום רכש; השנייה — מיקור <bdi dir='ltr'>(Sourcing)</bdi>","הראשון — מיקור <bdi dir='ltr'>(Sourcing)</bdi>; השנייה — קידום משלוחים"],c:1,e:"בלוק הרכש כולל מיקור <bdi dir='ltr'>(Sourcing)</bdi> — איתור ספקים ובחירתם, רכש <bdi dir='ltr'>(Purchasing)</bdi> — ביצוע הרכישה בפועל, וקידום רכש. הוצאת הזמנות רכש היא <bdi dir='ltr'>Purchasing</bdi> ולא <bdi dir='ltr'>Sourcing</bdi>; קידום משלוחים שייך לבלוק ניהול ההזמנות ולא לרכש. (שא-1, שקף 11)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברת ציוד רפואי, עובדת מסוימת עוקבת אחר הזמנות הלקוחות הפתוחות, מזרזת את השלמתן ומוודאת שכל הזמנה תצא ללקוח במועד. לאיזה בלוק בשרשרת האספקה הפנים-ארגונית שייך תפקידה, ומהו תת-הסעיף הרלוונטי?",o:["לוגיסטיקה — שילוח והפצה ללקוחות","ניהול הזמנות — קידום משלוחים","רכש — קידום רכש ומעקב אחר ספקים","ניהול חומר — מלאי"],c:1,e:"מעקב אחר הזמנות הלקוחות וזירוז השלמתן הוא 'קידום משלוחים', תת-הסעיף של בלוק ניהול ההזמנות. הלוגיסטיקה אחראית לביצוע השילוח וההפצה הפיזיים, וקידום רכש עוסק בזירוז אספקות מספקים ולא בהזמנות לקוחות. (שא-1, שקף 11)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מפעל תרופות מייצר חלק מהמוצרים בקווי הייצור שלו, ומעביר מוצרים אחרים לייצור אצל יצרן חיצוני מאושר. לאיזה בלוק בשרשרת האספקה הפנים-ארגונית שייכים שני המסלולים, וכיצד הם מכונים במצגת?",o:["רכש — מיקור <bdi dir='ltr'>(Sourcing)</bdi> וקבלני משנה","לוגיסטיקה — ייצור עצמי ושילוח והפצה","ייצור — ייצור עצמי וקבלני משנה","ניהול חומר — <bdi dir='ltr'>MRP</bdi> וקבלני משנה"],c:2,e:"בלוק הייצור כולל שני תתי-סעיפים: ייצור עצמי וקבלני משנה — ייצור אצל יצרן חיצוני הוא קבלנות משנה ונשאר בבלוק הייצור. מיקור <bdi dir='ltr'>(Sourcing)</bdi> שייך לבלוק הרכש ועוסק בבחירת ספקים, לא בביצוע הייצור עצמו. (שא-1, שקף 11)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"ב-<bdi dir='ltr'>Mission</bdi> של שרשרת האספקה — <bdi dir='ltr'>Deliver to Customers</bdi> — מוגדרים ארבעה מרכיבים. איזה מהבאים אינו אחד מהם?",o:["<bdi dir='ltr'>On Time</bdi>","<bdi dir='ltr'>Best Cost</bdi>","<bdi dir='ltr'>Agility</bdi> – <bdi dir='ltr'>Flexible</bdi> & <bdi dir='ltr'>Scalable</bdi>","<bdi dir='ltr'>Low Inventory</bdi>"],c:3,e:"ארבעת מרכיבי ה-<bdi dir='ltr'>Mission</bdi> הם <bdi dir='ltr'>On Time, High Quality, Best Cost</bdi> ו-<bdi dir='ltr'>Agility (Flexible</bdi> & <bdi dir='ltr'>Scalable</bdi>). רמת מלאי נמוכה <bdi dir='ltr'>(Low Inventory)</bdi> מופיעה באתגר העיקרי של שרשרת האספקה (שקף 17) ובעץ ה-<bdi dir='ltr'>KPI</bdi>, אך אינה חלק מהגדרת ה-<bdi dir='ltr'>Mission</bdi>. (שא-1, שקף 16)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"חברת רכב חשמלי עומדת להשיק דגם חדש, ושרשרת האספקה נדרשת להיערך מבעוד מועד: ספקים לרכיבים חדשים, מלאי ראשוני ותהליכי ייצור. איזו יכולת ליבה <bdi dir='ltr'>(Core Competency)</bdi> מרשימת המצגת מתארת זאת?",o:["<bdi dir='ltr'>Sourcing of unique / customized items</bdi>","<bdi dir='ltr'>Process Improvement</bdi> & <bdi dir='ltr'>Operations Performance Control</bdi>","<bdi dir='ltr'>Material Management</bdi> – <bdi dir='ltr'>Forecasting</bdi>","<bdi dir='ltr'>NPI</bdi> – <bdi dir='ltr'>Ops support of New Products</bdi>"],c:3,e:"<bdi dir='ltr'>NPI (New Product Introduction)</bdi> — תמיכת התפעול במוצרים חדשים — היא יכולת הליבה העוסקת בהיערכות שרשרת האספקה להשקת מוצר חדש. <bdi dir='ltr'>Sourcing of unique items</bdi> עוסק במיקור פריטים ייחודיים באופן כללי, ולא בהשקה, ו-<bdi dir='ltr'>Forecasting</bdi> הוא חלק מניהול החומר השוטף. (שא-1, שקף 16)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"סמנכ״ל תפעול מציג לדירקטוריון: 'אנחנו עומדים בכל האספקות, אבל המחסנים מלאים והמלאי גדל, ובמקביל אנחנו מתקשים להגיב מהר לשינויים בביקוש'. איזה ניסוח מהמצגת מתאר את האתגר שהוא מתמודד איתו?",o:["הגדלת המכירות תוך צמצום מספר הספקים והפחתת עלויות","קיצור <bdi dir='ltr'>Lead Time</bdi> תוך שיפור דיוק התחזית","הבטחת אספקות תוך שמירה על זמישות תפעולית ורמת מלאי נמוכה","יצירת ביקוש בשוק תוך תמיכה במוצרים חדשים"],c:2,e:"האתגר העיקרי בשקף 17: <bdi dir='ltr'>Assure deliveries while keeping the Operational Agility and Low inventory</bdi> — לעמוד באספקות ובו-זמנית לשמור על זמישות תפעולית ועל מלאי נמוך, שלושה יעדים המושכים לכיוונים מנוגדים. יתר האפשרויות הן מדדים או יכולות נקודתיות ולא ניסוח האתגר. (שא-1, שקף 17)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מהו הצומת העליון (השורש) בעץ ה-<bdi dir='ltr'>KPI</bdi> של שרשרת האספקה, שממנו נגזרים כל הענפים?",o:["<bdi dir='ltr'>On Time Delivery</bdi> – <bdi dir='ltr'>Average day Delay</bdi>","<bdi dir='ltr'>Operational Cost</bdi> – <bdi dir='ltr'>COGS and Freight</bdi>","<bdi dir='ltr'>Revenue Shortages</bdi> – <bdi dir='ltr'>Lost Orders</bdi>","<bdi dir='ltr'>Customer Voice</bdi> – <bdi dir='ltr'>Deliver to Customers</bdi>"],c:3,e:"בראש עץ ה-<bdi dir='ltr'>KPI</bdi> עומד <bdi dir='ltr'>Customer Voice</bdi> – <bdi dir='ltr'>Deliver to Customers</bdi>, וממנו נגזרים הענפים: <bdi dir='ltr'>Quality, Inventory, Forecast Accuracy, Lead Time, On Time Delivery, Revenue Shortages, Operational Cost, Cost Reduction</bdi> ו-<bdi dir='ltr'>Logistics Cost Per COGS. On Time Delivery, Operational Cost</bdi> ו-<bdi dir='ltr'>Revenue Shortages</bdi> הם ענפים בלבד. (שא-1, שקף 18)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברת ציוד רפואי עלה בחודש האחרון מספר המכשירים שהגיעו ללקוחות כשהם אינם פועלים <bdi dir='ltr'>(DOA)</bdi>, ובמקביל גדל מספר ההחזרות <bdi dir='ltr'>(RMA)</bdi>. איזה ענף בעץ ה-<bdi dir='ltr'>KPI</bdi> יושפע ישירות, ואילו מדדים נוספים נמצאים באותו ענף?",o:["<bdi dir='ltr'>Quality</bdi> — לצד <bdi dir='ltr'>Customer Complaints</bdi> ו-<bdi dir='ltr'>Shipment Quality</bdi>","<bdi dir='ltr'>On Time Delivery</bdi> — לצד <bdi dir='ltr'>Average day Delay</bdi> ו-<bdi dir='ltr'>Number of delays</bdi>","<bdi dir='ltr'>Revenue Shortages</bdi> — לצד <bdi dir='ltr'>Delayed orders</bdi> ו-<bdi dir='ltr'>Lost Orders</bdi>","<bdi dir='ltr'>Inventory</bdi> — לצד <bdi dir='ltr'>Inventory level</bdi> ו-<bdi dir='ltr'>Dead/Slow</bdi>"],c:0,e:"<bdi dir='ltr'>DOA (Dead On Arrival</bdi> — מוצר שהגיע ללקוח כשאינו פועל) ו-<bdi dir='ltr'>RMA</bdi> (החזרות מלקוחות) הם מדדי ענף ה-<bdi dir='ltr'>Quality</bdi>, יחד עם <bdi dir='ltr'>Customer Complaints</bdi> ו-<bdi dir='ltr'>Shipment Quality. On Time Delivery</bdi> מודד עיכובים באספקה ולא את איכות המוצר שהתקבל. (שא-1, שקף 18)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מנהלת ניהול החומר מדווחת שהתחזית שהכינה הייתה נמוכה בהרבה מהביקוש בפועל בכמה מק״טים, וגבוהה ממנו בהרבה במק״טים אחרים. באיזה ענף בעץ ה-<bdi dir='ltr'>KPI</bdi> יבואו הפערים לידי ביטוי, ובאילו מדדים?",o:["<bdi dir='ltr'>Forecast Accuracy</bdi> — <bdi dir='ltr'>Coverage</bdi> ו-<bdi dir='ltr'>Inventory Turns</bdi>","<bdi dir='ltr'>Inventory</bdi> — <bdi dir='ltr'>Inventory level</bdi> ו-<bdi dir='ltr'>Dead/Slow</bdi>","<bdi dir='ltr'>Forecast Accuracy</bdi> — <bdi dir='ltr'>Undershoot</bdi> ו-<bdi dir='ltr'>Overshoot</bdi>","<bdi dir='ltr'>Revenue Shortages</bdi> — <bdi dir='ltr'>Delayed orders</bdi> ו-<bdi dir='ltr'>Lost Orders</bdi>"],c:2,e:"ענף <bdi dir='ltr'>Forecast Accuracy</bdi> כולל את <bdi dir='ltr'>Coverage, Undershoot</bdi> (תחזית נמוכה מהביקוש בפועל) ו-<bdi dir='ltr'>Overshoot</bdi> (תחזית גבוהה מהביקוש בפועל). <bdi dir='ltr'>Inventory Turns</bdi> ו-<bdi dir='ltr'>Dead/Slow</bdi> שייכים לענף <bdi dir='ltr'>Inventory</bdi>, המודד את תוצאות המלאי עצמן ולא את דיוק התחזית שגרמה להן. (שא-1, שקף 18)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בעץ ה-<bdi dir='ltr'>KPI</bdi>, איזה ענף כולל את המדדים <bdi dir='ltr'>Inventory Turns</bdi> ו-<bdi dir='ltr'>Dead/Slow</bdi>, ומה מודד <bdi dir='ltr'>Inventory Turns</bdi>?",o:["ענף <bdi dir='ltr'>Inventory</bdi> — <bdi dir='ltr'>Turns</bdi> מודד כמה פעמים בתקופה מתחלף המלאי","ענף <bdi dir='ltr'>Operational Cost</bdi> — <bdi dir='ltr'>Turns</bdi> מודד את עלות החזקת המלאי","ענף <bdi dir='ltr'>Forecast Accuracy</bdi> — <bdi dir='ltr'>Turns</bdi> מודד את סטיית התחזית","ענף <bdi dir='ltr'>Logistics Cost Per COGS</bdi> — <bdi dir='ltr'>Turns</bdi> מודד עלות הובלה"],c:0,e:"ענף <bdi dir='ltr'>Inventory</bdi> כולל <bdi dir='ltr'>Inventory level, Inventory Turns</bdi> ו-<bdi dir='ltr'>Dead/Slow. Inventory Turns</bdi> (מחזורי מלאי) מודד כמה פעמים בתקופה המלאי 'מתחלף' — ככל שהערך גבוה יותר, המלאי נמוך יחסית להיקף הפעילות. <bdi dir='ltr'>Dead/Slow</bdi> מזהה מלאי מת או איטי. <bdi dir='ltr'>Operational Cost</bdi> מודד <bdi dir='ltr'>COGS, Freight</bdi> ו-<bdi dir='ltr'>Overhead</bdi>. (שא-1, שקף 18)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"בחברת לוגיסטיקה נמדדים שני דברים שונים: (1) כמה ימים בממוצע אחרו ההזמנות שסופקו באיחור, ו-(2) כמה זמן עובר מקבלת הזמנת לקוח ועד אספקתה. לאילו ענפים בעץ ה-<bdi dir='ltr'>KPI</bdi> שייכים שני המדדים, בהתאמה?",o:["(1) <bdi dir='ltr'>Lead Time</bdi>; (2) <bdi dir='ltr'>On Time Delivery</bdi>","(1) <bdi dir='ltr'>On Time Delivery</bdi>; (2) <bdi dir='ltr'>Lead Time</bdi>","(1) <bdi dir='ltr'>Revenue Shortages</bdi>; (2) <bdi dir='ltr'>Lead Time</bdi>","(1) <bdi dir='ltr'>On Time Delivery</bdi>; (2) <bdi dir='ltr'>Forecast Accuracy</bdi>"],c:1,e:"<bdi dir='ltr'>Average day Delay</bdi> ו-<bdi dir='ltr'>Number of delays</bdi> הם מדדי ענף <bdi dir='ltr'>On Time Delivery</bdi>, המודד עמידה במועדי האספקה. משך הזמן מהזמנת הלקוח ועד האספקה הוא <bdi dir='ltr'>Customer Order Lead Time</bdi>, בענף <bdi dir='ltr'>Lead Time</bdi> (לצד <bdi dir='ltr'>Product Lead Time). Revenue Shortages</bdi> מודד הזמנות שאבדו או התעכבו במונחי הכנסה. (שא-1, שקף 18)"},
{t:"מבוא ומבנה שרשרת האספקה",s:"שלמה",q:"מנהל שרשרת אספקה מציג שני נתונים: הזמנות שאבדו לחלוטין בגלל חוסר במלאי <bdi dir='ltr'>(Lost Orders)</bdi>, וירידה במספר הספקים הפעילים (# <bdi dir='ltr'>of vendors</bdi>) בעקבות איחוד ספקים. לאילו ענפים בעץ ה-<bdi dir='ltr'>KPI</bdi> שייכים שני הנתונים, בהתאמה?",o:["<bdi dir='ltr'>Revenue Shortages</bdi>; <bdi dir='ltr'>Cost Reduction</bdi>","<bdi dir='ltr'>Revenue Shortages</bdi>; <bdi dir='ltr'>Operational Cost</bdi>","<bdi dir='ltr'>On Time Delivery</bdi>; <bdi dir='ltr'>Operational Cost</bdi>","<bdi dir='ltr'>Inventory</bdi>; <bdi dir='ltr'>Logistics Cost Per COGS</bdi>"],c:0,e:"<bdi dir='ltr'>Lost Orders</bdi> ו-<bdi dir='ltr'>Delayed orders</bdi> הם מדדי ענף <bdi dir='ltr'>Revenue Shortages</bdi> (הכנסה שנפגעה). מספר הספקים (# <bdi dir='ltr'>of vendors</bdi>) מופיע בענף <bdi dir='ltr'>Cost Reduction</bdi> לצד <bdi dir='ltr'>COGS</bdi> ו-<bdi dir='ltr'>Expenses</bdi>; ענף <bdi dir='ltr'>Operational Cost</bdi> כולל <bdi dir='ltr'>COGS, Freight</bdi> ו-<bdi dir='ltr'>Overhead</bdi> — עלויות שוטפות, לא יעדי הפחתה. (שא-1, שקף 18)"}
]);

BANK.push.apply(BANK,[
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"חברה לייצור ציוד רפואי ממפה את שרשרת האספקה שלה. במפה מופיעים: מקור <bdi dir='ltr'>(Source)</bdi>, ספק <bdi dir='ltr'>(Vendor)</bdi>, הארגון עצמו, הלקוח והמשתמש הסופי <bdi dir='ltr'>(End User)</bdi>. איזה סוג של שרשרת אספקה מתואר כאן?",o:["שרשרת האספקה החוץ-ארגונית <bdi dir='ltr'>(Multi Organization Supply Chain)</bdi>","שרשרת האספקה הפנים-ארגונית <bdi dir='ltr'>(Single Organization Supply Chain)</bdi>","עץ ה-<bdi dir='ltr'>KPI</bdi> של שרשרת האספקה <bdi dir='ltr'>(Supply Chain KPI Tree)</bdi>","תהליך ה-<bdi dir='ltr'>MRP</bdi> — מהזמנות ותחזיות ועד הזמנות רכש"],c:0,e:"המפה מתארת גורמים מארגונים שונים — מקור, ספק, הארגון, לקוח ומשתמש סופי — ולכן זו השרשרת החוץ-ארגונית <bdi dir='ltr'>(Multi Organization)</bdi>. השרשרת הפנים-ארגונית מתארת את הפונקציות בתוך הארגון בלבד: ניהול חומר, רכש, ייצור, ניהול הזמנות ולוגיסטיקה. (שא-2, שקף 4)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"על פי המצגת, מהו האתגר העיקרי של שרשרת האספקה?",o:["הורדת עלויות הרכש באמצעות צמצום מספר הספקים והגדלת גודלי ההזמנה","הבטחת אספקות תוך שמירה על זמישות תפעולית ורמת מלאי נמוכה","קיצור זמן הפיתוח של מוצרים חדשים והעברתם לייצור סדרתי <bdi dir='ltr'>(NPI)</bdi>","הגדלת המלאי בכל שלבי השרשרת כדי למנוע חוסרים"],c:1,e:"האתגר העיקרי מוגדר כהבטחת האספקות ללקוחות תוך שמירה על זמישות תפעולית ורמת מלאי נמוכה — שילוב של שני יעדים מנוגדים לכאורה. הגדלת המלאי אינה הפתרון, כפי שמודגש בפרק התכנון הרזה, והורדת עלויות או <bdi dir='ltr'>NPI</bdi> הם עיסוקי ליבה ולא האתגר המרכזי. (שא-2, שקפים 6, 24)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מהו הסדר הנכון של שלבי תהליך ה-<bdi dir='ltr'>MRP</bdi> כפי שהוצג במצגת?",o:["הזמנות ותחזיות ← פיצוץ <bdi dir='ltr'>BOM</bdi> → <bdi dir='ltr'>MPS</bdi> ← דרישות נטו ← קיזוז מלאי והזמנות פתוחות ← דרישות ברוטו ← <bdi dir='ltr'>PO</bdi> וקפ״ע","<bdi dir='ltr'>MPS</bdi> ← הזמנות ותחזיות ← דרישות נטו ← פיצוץ <bdi dir='ltr'>BOM</bdi> ← קיזוז מלאי והזמנות פתוחות ← דרישות ברוטו ← <bdi dir='ltr'>PO</bdi> וקפ״ע","פיצוץ <bdi dir='ltr'>BOM</bdi> ← הזמנות ותחזיות ← <bdi dir='ltr'>MPS</bdi> ← דרישות ברוטו ← <bdi dir='ltr'>PO</bdi> וקפ״ע ← קיזוז מלאי והזמנות פתוחות ← דרישות נטו","הזמנות ותחזיות ← <bdi dir='ltr'>MPS</bdi> ← פיצוץ <bdi dir='ltr'>BOM</bdi> ← דרישות ברוטו ← קיזוז מלאי והזמנות פתוחות ← דרישות נטו ← <bdi dir='ltr'>PO</bdi> וקפ״ע"],c:3,e:"התהליך מתחיל מהזמנות ותחזיות שמהן נבנית תוכנית ייצור אב <bdi dir='ltr'>(MPS)</bdi>; פיצוץ עץ המוצר <bdi dir='ltr'>(BOM)</bdi> מניב דרישות ברוטו, שמהן מקזזים את המלאי הקיים וההזמנות הפתוחות כדי לקבל דרישות נטו — ורק אז מונפקות הזמנות רכש <bdi dir='ltr'>(PO)</bdi> ופקודות עבודה (קפ״ע). <bdi dir='ltr'>BOM</bdi> אינו קודם ל-<bdi dir='ltr'>MPS</bdi>, ודרישות נטו נגזרות מדרישות ברוטו ולא להפך. (שא-2, שקף 9)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מתכננת חומר מריצה <bdi dir='ltr'>MRP</bdi>. לאחר פיצוץ ה-<bdi dir='ltr'>BOM</bdi> התקבלה דרישת ברוטו של 1,000 יחידות לרכיב מסוים. במחסן יש 300 יחידות, ובנוסף קיימת הזמנת רכש פתוחה של 200 יחידות שטרם התקבלה. מהי דרישת הנטו לרכיב ומה ייצא מהמערכת בעקבותיה?",o:["700 יחידות — הזמנת רכש חדשה, כי הזמנות פתוחות אינן מקוזזות מדרישות הברוטו","500 יחידות — המלצה להזמנת רכש <bdi dir='ltr'>(PO)</bdi> או לפקודת עבודה (קפ״ע)","1,000 יחידות — ה-<bdi dir='ltr'>MPS</bdi> מוציא הזמנה על מלוא הדרישה בלי קשר למלאי","300 יחידות — דרישת הנטו שווה למלאי הזמין במחסן בלבד"],c:1,e:"דרישות הנטו מתקבלות מקיזוז המלאי הקיים וההזמנות הפתוחות מדרישות הברוטו: 1,000 − 300 − 200 = 500 יחידות. על דרישת הנטו מונפקות הזמנות רכש <bdi dir='ltr'>(PO)</bdi> או פקודות עבודה (קפ״ע). הזמנה פתוחה היא אספקה עתידית מובטחת ולכן מקוזזת גם היא — הזמנה על 700 תיצור מלאי עודף. (שא-2, שקף 9)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"בתהליך ה-<bdi dir='ltr'>MRP</bdi>, מהו התפקיד של ה-<bdi dir='ltr'>MPS (Master Production Schedule)</bdi>?",o:["רשימת הרכיבים, החומרים והכמויות הנדרשים לייצור יחידה אחת של המוצר המוגמר","רשימת ההזמנות הפתוחות אצל הספקים שטרם התקבלו במחסן","תוכנית ייצור אב הנבנית מההזמנות והתחזיות, ומהווה את הבסיס לפיצוץ ה-<bdi dir='ltr'>BOM</bdi>","פקודות העבודה שמונפקות לרצפת הייצור בעקבות דרישות הנטו"],c:2,e:"ה-<bdi dir='ltr'>MPS</bdi> (תוכנית ייצור אב) נבנה מההזמנות והתחזיות וקובע מה ומתי לייצר; ממנו מפוצצים את ה-<bdi dir='ltr'>BOM</bdi> לקבלת דרישות ברוטו. רשימת הרכיבים לייצור יחידת מוצר היא ה-<bdi dir='ltr'>BOM</bdi> עצמו, ופקודות העבודה (קפ״ע) הן תוצר סופי של התהליך ולא נקודת המוצא שלו. (שא-2, שקף 9)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"יצרן מערכות תקשורת מגלה שאחד הרכיבים האלקטרוניים במוצר מגיע מספק בזמן אספקה של 40 שבועות, בעוד שאופק התחזית של הלקוחות הוא רבעון בלבד. איזה דגש מהמצגת בתחום התחזיות נוגע ישירות למצב הזה?",o:["צמצום מספר הפריטים הייחודיים במוצר לטובת שיתופיות ומודולריות","התייחסות נפרדת לזמני אספקה ארוכים — <bdi dir='ltr'>LLI (Long Lead Items)</bdi>","הגדרת <bdi dir='ltr'>SLA</bdi> (רמת שירות מוסכמת) לאספקות ללקוח","העברת ניהול המלאי לספק במסגרת הסכם <bdi dir='ltr'>VMI</bdi>"],c:1,e:"רכיב שזמן האספקה שלו ארוך בהרבה מאופק התחזית הוא <bdi dir='ltr'>LLI</bdi> — פריט בעל זמן אספקה ארוך שדורש התייחסות מיוחדת בתחזית והתחייבות מעבר לאופק הרגיל (במטריצת הגמישות: מעל 3 חודשים). מודולריות ו-<bdi dir='ltr'>VMI</bdi> הם דגשים אחרים בתחזית ואינם עונים ישירות על פער אופק התכנון. (שא-2, שקפים 10, 15)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מה ההבדל המהותי בין מלאי <bdi dir='ltr'>VMI</bdi> (מלאי מנוהל ספק) לבין מלאי קונסיגנציה, כפי שמוצג בשקף סוגי המלאי?",o:["<bdi dir='ltr'>VMI</bdi> הוא מלאי בתהליך ייצור, ואילו קונסיגנציה היא מלאי של תוצרת גמורה הממתינה לאספקה ללקוח","<bdi dir='ltr'>VMI</bdi> הוא מלאי זמין לשימוש שקיימת עליו מחויבות, ואילו קונסיגנציה היא מלאי אצל הלקוח שהלקוח אינו מחויב עליו","<bdi dir='ltr'>VMI</bdi> הוא מלאי של מוצרים שחזרו מהלקוחות לבדיקה, ואילו קונסיגנציה היא מלאי של מוצרים שהועברו לתיקון אצל הספק","<bdi dir='ltr'>VMI</bdi> הוא מלאי אצל הלקוח שהלקוח אינו מחויב עליו, ואילו קונסיגנציה היא מלאי במחסן הארגון שקיימת עליו מחויבות מלאה"],c:1,e:"לפי השקף, <bdi dir='ltr'>VMI</bdi> — מלאי מנוהל ספק — הוא מלאי זמין לשימוש שקיימת עליו מחויבות של הארגון; קונסיגנציה היא מלאי שירות אצל הלקוח, שהלקוח אינו מחויב עליו. מוצרים שחזרו מלקוחות הם מלאי תקולים <bdi dir='ltr'>(MRB)</bdi>, ומוצרים שהועברו לתיקון הם <bdi dir='ltr'>RTV</bdi>. (שא-2, שקף 12)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"במחסן חברה למכשור אלקטרוני מוגדרים שני אזורים נפרדים: באזור הראשון מרוכזים מכשירים שהוחזרו על ידי לקוחות בטענה לתקלה וממתינים להחלטה; באזור השני מכשירים שכבר נשלחו לתיקון. כיצד יסווגו שני המלאים לפי המצגת?",o:["הראשון — מלאי שירות; השני — מלאי קונסיגנציה","הראשון — מלאי <bdi dir='ltr'>RTV</bdi> (מלאי בתהליך תיקון); השני — מלאי <bdi dir='ltr'>MRB</bdi> (תקולים)","הראשון — מלאי <bdi dir='ltr'>MRB</bdi> (תקולים); השני — מלאי <bdi dir='ltr'>RTV</bdi> (בתהליך תיקון)","הראשון — מלאי לא תפעולי (מת); השני — מלאי מתוקן <bdi dir='ltr'>Refurbished</bdi>"],c:2,e:"מוצרים שחזרו מהלקוחות מסווגים כמלאי תקולים — <bdi dir='ltr'>MRB</bdi>; מוצרים שהועברו לתיקון הם מלאי בתהליך תיקון — <bdi dir='ltr'>RTV</bdi>. במסיח השני הסדר הפוך. מלאי שירות הוא מלאי זמין לשירות, וקונסיגנציה היא מלאי אצל הלקוח שאינו מחויב עליו. (שא-2, שקף 12)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מפעל מזון מחזיק כמויות של מוצר ביניים בין תחנת הערבול לתחנת האריזה, כדי שתקלה או עצירה בתחנה אחת לא תשבית את התחנה השנייה. איזה סוג מלאי זה, ומהי מטרתו לפי המצגת?",o:["מלאי בתהליך <bdi dir='ltr'>(WIP)</bdi> — הבטחת שטף הייצור ואי-תלות בין תחנות הייצור","מלאי חומר גלם (חו״ג) — הבטחת זמינות הייצור ואי-תלות של המפעל בספקים","מלאי תוצרת גמורה (תוצ״ג) — הבטחת זמינות האספקות ללקוחות","מלאי מנוהל ספק <bdi dir='ltr'>(VMI)</bdi> — מלאי זמין לשימוש שקיימת עליו מחויבות"],c:0,e:"מלאי בין תחנות ייצור הוא מלאי בתהליך — <bdi dir='ltr'>WIP</bdi> — שתפקידו להבטיח את שטף הייצור וליצור אי-תלות בין תחנות הייצור. חומר גלם מבטיח אי-תלות בספקים, ותוצרת גמורה מבטיחה אי-תלות של האספקות ללקוחות בייצור. (שא-2, שקף 12)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"לפי שקף סוגי המלאי, מהי המטרה של החזקת מלאי תוצרת גמורה (תוצ״ג)?",o:["הבטחת שטף הייצור השוטף ואי-תלות בין תחנות הייצור השונות","הבטחת זמינות האספקות ללקוחות ואי-תלות של האספקות בייצור","הבטחת זמינות הייצור ואי-תלות של הארגון בספקים החיצוניים","החזקת מלאי זמין לשירות ולתיקונים אצל הלקוחות לאורך חיי המוצר"],c:1,e:"תוצרת גמורה מוחזקת כדי להבטיח את זמינות האספקות ללקוחות וליצור אי-תלות של האספקות בייצור — גם אם הייצור נעצר, הלקוח מקבל מהמלאי. שטף הייצור הוא תפקידו של <bdi dir='ltr'>WIP</bdi>, אי-תלות בספקים היא תפקידו של חומר הגלם, ומלאי לשירות הוא מלאי שירות. (שא-2, שקף 12)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"לפי עץ המלאי <bdi dir='ltr'>(Inventory Tree)</bdi>, איזה מהמלאים הבאים <b>אינו</b> נכלל במלאי התפעולי?",o:["מלאי לא תקין <bdi dir='ltr'>(MRB)</bdi>","מלאי מתוקן <bdi dir='ltr'>(Refurbished)</bdi>","מלאי אצל לקוחות","מלאי פיתוח והנדסה"],c:3,e:"עץ המלאי מפצל את המלאי הכולל לשני ענפים. המלאי התפעולי כולל מלאי אצל לקוחות, תוצרת גמורה, חומרי גלם ובתהליך, מלאי שירות, מלאי לא תקין <bdi dir='ltr'>(MRB)</bdi>, מלאי בתהליך תיקון <bdi dir='ltr'>(RTV)</bdi> ומלאי מתוקן <bdi dir='ltr'>(Refurbished)</bdi>. המלאי הלא-תפעולי כולל מלאי איטי/מת, מלאי פיתוח והנדסה ורכוש קבוע. (שא-2, שקף 13)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"בספירת סוף שנה ביחידה לוגיסטית נמצאו אלפי חלקי חילוף לכלי רכב שהוצאו משירות לפני שנים ואין בהם עוד כל תנועה. היכן הם ממוקמים בעץ המלאי?",o:["במלאי התפעולי — כמלאי שירות לכלי הרכב","במלאי התפעולי — כמלאי לא תקין <bdi dir='ltr'>(MRB)</bdi>","במלאי הלא-תפעולי — כמלאי פיתוח והנדסה","במלאי הלא-תפעולי — כמלאי איטי/מת"],c:3,e:"מלאי ללא תנועה הוא מלאי איטי/מת <bdi dir='ltr'>(Slow/Dead Stock)</bdi>, הנמצא בענף הלא-תפעולי של עץ המלאי. מלאי שירות הוא מלאי זמין לשירות — וכאן אין עוד כלים לשרת. <bdi dir='ltr'>MRB</bdi> הוא מוצרים תקולים שחזרו מלקוחות, ומלאי פיתוח והנדסה שייך לפעילות הפיתוח. (שא-2, שקפים 13, 16)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מכשירים שחזרו מלקוחות, תוקנו ונבדקו, ממתינים כעת במחסן כדי לשמש כמכשירים חלופיים ללקוחות. כיצד מוגדר מלאי זה בעץ המלאי?",o:["מלאי איטי — חלק מהמלאי הלא-תפעולי","מלאי לא תקין <bdi dir='ltr'>(MRB)</bdi> — חלק מהמלאי הלא-תפעולי","מלאי בתהליך תיקון <bdi dir='ltr'>(RTV)</bdi> — חלק מהמלאי התפעולי","מלאי מתוקן <bdi dir='ltr'>(Refurbished)</bdi> — חלק מהמלאי התפעולי"],c:3,e:"מכשיר שכבר תוקן ונבדק ומוכן לשימוש חוזר הוא מלאי מתוקן <bdi dir='ltr'>(Refurbished)</bdi>, שנמנה עם המלאי התפעולי. <bdi dir='ltr'>RTV</bdi> הוא מלאי שנמצא עדיין בתהליך תיקון, ו-<bdi dir='ltr'>MRB</bdi> הוא מלאי תקולים שחזר מהלקוח וטרם טופל — ושניהם אף הם בענף התפעולי ולא בלא-תפעולי. (שא-2, שקפים 12–13)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"איזו מההגדרות הבאות <b>אינה</b> אחת מארבע ההגדרות למלאי שבשקף ״הגדרות למלאי״?",o:["מלאי שירות/משופץ <bdi dir='ltr'>(Service/Refurbished)</bdi>","מלאי מת <bdi dir='ltr'>(Dead Stock)</bdi>","מלאי ביטחון <bdi dir='ltr'>(Safety Stock)</bdi>","מלאי תפעולי <bdi dir='ltr'>(Operational Inventory)</bdi>"],c:2,e:"שקף ההגדרות מונה ארבע: מלאי תפעולי <bdi dir='ltr'>(Operational)</bdi>, מלאי איטי <bdi dir='ltr'>(Slow)</bdi>, מלאי מת <bdi dir='ltr'>(Dead Stock)</bdi> ומלאי שירות/משופץ <bdi dir='ltr'>(Service/Refurbished)</bdi>. מלאי ביטחון מופיע במצגת ככלי במדיניות המלאי (שקף 17) — לא כאחת מהגדרות המלאי. (שא-2, שקפים 16–17)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"לקוח ומפעל חתמו על מטריצת גמישות כפי שהוצגה במצגת. בתחילת החודש מבקש הלקוח להגדיל ב-25% את הכמות שהזמין לחודש שאחרי הבא (חודש+2). לאיזו הגדלה מחויב המפעל?",o:["עד 20% — זו הגמישות המוסכמת להגדלה בחודש+2","עד 10% — זו הגמישות להגדלה בכל חודש עתידי","אין מחויבות — מעבר לחודש הנוכחי אין התחייבות","עד 25% — כל שינוי שנמסר חודשיים מראש מחייב"],c:0,e:"במטריצה, ההגדלה המותרת גדלה עם המרחק: חודש+1 עד 10%, חודש+2 עד 20%, חודש+3 עד 30%, ומעבר ל-3 חודשים אין מחויבות. בחודש הנוכחי אין שינוי כלל. לכן לבקשה של 25% לחודש+2 המפעל מחויב עד 20% בלבד, והיתרה כפופה ליכולתו. (שא-2, שקף 15)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"לפי אותה מטריצת גמישות, לקוח מבקש לבטל 30% מהכמות שהזמין לחודש הבא (חודש+1). באיזה היקף הספק מחויב לקבל את ההקטנה?",o:["עד 30% — כל הקטנה שנמסרה מראש","עד 15% — גמישות ההקטנה בחודש+1","עד 35% — גמישות ההקטנה המרבית","עד 10% — כמו גמישות ההגדלה בחודש+1"],c:1,e:"במטריצה ההקטנה המותרת היא: חודש+1 עד 15%, חודש+2 עד 25%, חודש+3 עד 35%, ובחודש הנוכחי אין שינוי. ביטול של 30% בחודש+1 חורג מהגמישות המוסכמת, ולכן הספק מחויב לקבל הקטנה של 15% בלבד. (שא-2, שקף 15)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מדוע, לפי ההערות למטריצת הגמישות, רכיבים בעלי זמן אספקה ארוך <bdi dir='ltr'>(LLI)</bdi> מחייבים טיפול נפרד מזה של שאר הפריטים?",o:["כי עבורם מותר להגדיל את ההזמנה ב-30% כבר בחודש הנוכחי, בלי הודעה מוקדמת","כי המטריצה חלה עליהם רק בחודש הנוכחי, שבו אסור לשנות בהזמנה דבר כלל","כי יש להתחייב עליהם מעבר לאופק של שלושה חודשים, שבו המטריצה אינה מחייבת","כי הם נמדדים לפי <bdi dir='ltr'>SLA</bdi> שבועי, ולא לפי <bdi dir='ltr'>SLA</bdi> חודשי כמו שאר הפריטים"],c:2,e:"המטריצה מגדירה ״<bdi dir='ltr'>No commitment</bdi>״ מעבר לשלושה חודשים, ובהערות לשקף נכתב שפריטי <bdi dir='ltr'>LLI</bdi> הם מעל 3 חודשים. כשזמן האספקה של רכיב ארוך מהאופק שבו יש מחויבות, צריך להתחייב עליו מוקדם יותר — ולכן הוא דורש התייחסות נפרדת בתחזית. (שא-2, שקפים 10, 15)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"פריט מסוים מהווה כ-10% מכמות הפריטים במחסן אך כ-80% מערך המלאי. איזו מדיניות מלאי מתאימה לו לפי המצגת?",o:["קבוצה <bdi dir='ltr'>A</bdi> — רכישת מנה גדולה כדי לנצל הנחות כמות מהספק","קבוצה <bdi dir='ltr'>B</bdi> — בקרה תקופתית ברמה בינונית של תשומת לב","קבוצה <bdi dir='ltr'>A</bdi> — ניהול ובקרה רציפים, והזמנה לפי <bdi dir='ltr'>EOQ</bdi> או <bdi dir='ltr'>MRP</bdi>","קבוצה <bdi dir='ltr'>C</bdi> — רכישת מנה גדולה המספיקה לתקופה ארוכה מראש"],c:2,e:"בסיווג <bdi dir='ltr'>ABC</bdi>, קבוצה <bdi dir='ltr'>A</bdi> היא כ-10% מהכמות וכ-80% מהערך, ומדיניותה ניהול ובקרת מלאי רציפה עם <bdi dir='ltr'>EOQ</bdi> או <bdi dir='ltr'>MRP</bdi>. רכישת מנה לתקופה ארוכה היא מדיניות קבוצה <bdi dir='ltr'>C</bdi> (כ-60% מהכמות וכ-5% מהערך), שבה עלות הבקרה אינה מצדיקה ניהול צמוד. (שא-2, שקף 17)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מחסן מרכזי מחזיק אלפי סוגי ברגים, אטמים ומהדקים — כ-60% מהפריטים אך רק כ-5% מערך המלאי. מה ממליצה המצגת לגביהם?",o:["להזמין לפי כל דרישה בנפרד כדי שלא יישאר מלאי כלל","להחזיק אותם כמלאי <bdi dir='ltr'>VMI</bdi> שהספק מנהל במחסן מדי שבוע","לרכוש מנת מלאי המספיקה לתקופה ארוכה, בלי בקרה צמודה","לנהל אותם בבקרה רציפה ולהזמין לפי <bdi dir='ltr'>MRP</bdi> כמו פריטי <bdi dir='ltr'>A</bdi>"],c:2,e:"אלה פריטי <bdi dir='ltr'>C</bdi>: כ-60% מהכמות וכ-5% מהערך. המדיניות במצגת היא רכישת מנת מלאי המספיקה לתקופה ארוכה — ערכם הנמוך אינו מצדיק את עלות הבקרה הרציפה, השמורה לפריטי <bdi dir='ltr'>A</bdi>. (שא-2, שקף 17)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם הפרמטרים לקביעת מדיניות מלאי שבמצגת?",o:["מחיר המכירה של המוצר ושולי הרווח שלו","ערך החוסר — מה עולה לארגון שהפריט חסר","זמני האספקה של הפריט והתפלגותם","זמינות מקורות תחליפיים לאותו פריט"],c:0,e:"הפרמטרים שבשקף הם: סיווג <bdi dir='ltr'>ABC</bdi>, עלות הפריט, כמות הביקוש לתקופה והתפלגותו, ערך החוסר, זמינות המלאי, זמני אספקה והתפלגותם וזמינות מקורות תחליפיים. מחיר המכירה ושולי הרווח אינם ברשימה — המדיניות נקבעת לפי עלות הפריט ומאפייני הביקוש והאספקה שלו. (שא-2, שקף 17)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"לאיזה מרכיב בעלויות המלאי שייכת ״עלות ההון״ — הריבית שהכסף המושקע במלאי היה יכול להניב?",o:["עלות ההזמנה והמשלוח","עלות החוסר באספקה","עלות הרכישה של הפריט","עלות אחזקת המלאי"],c:3,e:"לפי השקף, עלות אחזקת המלאי כוללת את עלות ההון ואת הפחת. עלות ההזמנה כוללת משלוח וניהול ההזמנות, עלות הרכישה כוללת את המחיר והנחות הכמות, ועלות החוסר מתבטאת בדחיית אספקות ובאובדן אספקות. (שא-2, שקף 18)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מפעל לא הצליח לספק ללקוח משלוח במועד בגלל חוסר ברכיב, והלקוח ביטל חלק מההזמנה ועבר למתחרה. לאיזה מרכיב בעלויות המלאי שייך ההפסד?",o:["עלות ההזמנה — משלוח וניהול ההזמנות לספק","עלות הרכישה — מחיר הרכיב והנחת כמות","עלות החוסר — דחיית אספקות ואובדן אספקות","עלות אחזקת המלאי — פחת ועלות ההון שבמלאי"],c:2,e:"עלות החוסר מוגדרת בשקף באמצעות שני ביטויים: דחיית אספקות ואובדן אספקות — בדיוק האיחור והביטול שבתרחיש. היא העלות של מלאי שאינו קיים כשצריך אותו, בניגוד לעלויות האחזקה, ההזמנה והרכישה של מלאי שכבר קיים או מוזמן. (שא-2, שקף 18)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מחסן רכש סחורה ב-100 ש״ח ליחידה, ומחיר השוק שלה ירד כיום ל-70 ש״ח. לפי העיקרון לחישוב ערך המלאי שבמצגת, מה יהיה ערכה של כל יחידה?",o:["70 ש״ח — הנמוך מבין העלות ומחיר השוק","100 ש״ח — עלות הרכישה המקורית בפועל","85 ש״ח — ממוצע העלות ומחיר השוק","30 ש״ח — ההפרש שנוצר כירידת ערך"],c:0,e:"השקף קובע שערך המלאי מחושב לפי הנמוך מבין העלות לבין ערך השוק. כשמחיר השוק (70) נמוך מהעלות (100), המלאי מוערך לפי 70, וההפרש משקף ירידת ערך — אחד הסיכונים הכספיים של אחזקת מלאי. (שא-2, שקפים 18–19)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"איזו מהשיטות הבאות <b>אינה</b> מופיעה ברשימת השיטות לחישוב ערך המלאי שבמצגת?",o:["<bdi dir='ltr'>LIFO</bdi> — האחרון שנכנס הוא הראשון שיוצא","ממ״ן — ממוצע נע של מחירי הרכישה","<bdi dir='ltr'>FIFO</bdi> — הראשון שנכנס הוא הראשון שיוצא","<bdi dir='ltr'>Re-Evaluation</bdi> — הערכה מחדש של המלאי"],c:0,e:"השיטות שבשקף הן: על פי מחיר אחרון, ממ״ן (ממוצע נע), <bdi dir='ltr'>FIFO</bdi> והערכה מחדש (<bdi dir='ltr'>Re-Evaluation). LIFO</bdi> היא שיטה חשבונאית מוכרת, אך אינה מופיעה ברשימה של המצגת. (שא-2, שקף 18)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"יצרן מזגנים מייצר בחורף יותר ממה שהוא מוכר, ושומר את העודף במלאי לקראת הקיץ. איזה שיקול בעד אחזקת מלאי מתאר המהלך?",o:["מלאי זמין משפר את כושר התחרות, כי אפשר לספק ללקוחות באופן מיידי כשהם מזמינים","הכסף המושקע במלאי נושא ריבית גבוהה יותר מזו שהיה נושא בכל אפיק השקעה אחר","רכישה בכמות גדולה מורידה את הסיכון לעליית מחירים ומצמצמת את מספר ההזמנות בשנה","במוצר עונתי מייצרים עודף בתקופה חלשה כדי לשמור על רמה מאוזנת של גורמי ייצור"],c:3,e:"השקף מונה שלושה שיקולים בעד: הגנה מעליית מחירים וצמצום עלויות ההזמנה; שיפור כושר התחרות באספקה מיידית; ובמוצר עונתי — ייצור עודף בתקופה חלשה ושמירתו לעונה חזקה, כדי לשמור על רמה מאוזנת של גורמי הייצור לאורך השנה. המהלך בתרחיש הוא השלישי. הטענה על ריבית הפוכה — עלות ההון היא שיקול נגד. (שא-2, שקף 19)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"חנות אביזרים לטלפונים נשארה עם מלאי גדול של כיסויים לדגם שהוחלף בדגם חדש, ואיש אינו קונה אותם עוד. איזה שיקול נגד אחזקת מלאי מתממש כאן?",o:["התיישנות פיזית ובלאי של החומרים שבמלאי לאורך הזמן","התיישנות אופנתית בעקבות שינוי בטעם ובהעדפות הצרכנים","עלות ההון שהייתה יכולה לשאת ריבית אחרת","התיישנות טכנולוגית בעקבות שינויים טכנולוגיים בשוק"],c:3,e:"השקף מבחין בשלושה סוגי התיישנות: פיזית (בלאי החומרים), טכנולוגית (בעקבות שינויים טכנולוגיים בשוק) ואופנתית (בעקבות שינוי טעם הצרכנים). כיסוי שאיבד את שוקו כי הדגם הוחלף התיישן טכנולוגית — הוא לא התבלה ולא יצא מהאופנה. (שא-2, שקף 19)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"כדי לשמור על זמישות מול תנודות בביקוש, ספק הרכיבים מחזיק מלאי מנוהל-ספק בתוך מפעל היצרן, והיצרן מושך ממנו לפי הצורך. איזה ״קו הגנה״ מהמצגת מתואר?",o:["<bdi dir='ltr'>VMI at vendor</bdi>","<bdi dir='ltr'>Raw Material buffer</bdi>","<bdi dir='ltr'>Vendors VMI at manufacturer</bdi>","<bdi dir='ltr'>Consigned buffers at manufacturer</bdi>"],c:2,e:"קווי ההגנה לזמישות בשקף הם: תוצרת גמורה <bdi dir='ltr'>(COI)</bdi>, באפר בתחזית הייצור, באפר חומרי גלם (הגדלת <bdi dir='ltr'>Lead Time</bdi>), באפר בקונסיגנציה אצל היצרן, <bdi dir='ltr'>VMI</bdi> של הספקים אצל היצרן ו-<bdi dir='ltr'>VMI</bdi> אצל הספק. מלאי מנוהל-ספק שיושב במפעל היצרן הוא <bdi dir='ltr'>Vendors VMI at manufacturer</bdi>; <bdi dir='ltr'>VMI at vendor</bdi> יושב במחסני הספק עצמו. (שא-2, שקף 20)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מתכנן ייצור מוסיף לתחזית הייצור החודשית כמות קבועה מעבר לביקוש הצפוי, כדי שהמפעל יוכל להגיב לתוספות לא צפויות. איזה ״קו הגנה״ לזמישות מופעל כאן?",o:["<bdi dir='ltr'>VMI at vendor</bdi> — מלאי מנוהל-ספק אצלו","<bdi dir='ltr'>Raw Material buffer</bdi> — באפר בחומרי הגלם של המפעל","<bdi dir='ltr'>Production Forecast buffer</bdi> — באפר בתחזית הייצור","<bdi dir='ltr'>Finished Goods (COI)</bdi> — מלאי תוצרת גמורה במחסן"],c:2,e:"תוספת קבועה לתחזית הייצור היא <bdi dir='ltr'>Production Forecast buffer</bdi> — אחד מקווי ההגנה לזמישות בשקף. באפר חומרי גלם נבנה בגלל זמני אספקה ארוכים, ומלאי תוצרת גמורה הוא מוצרים מוכנים ולא תוספת לתחזית. (שא-2, שקף 20)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מהי ״תכנון רזה״ <bdi dir='ltr'>(Lean Planning)</bdi> לפי ההגדרה במצגת?",o:["שיטה להחזקת מלאי ביטחון גבוה, כדי להבטיח שהלקוח לעולם לא ייתקל בחוסר באספקה","שיטה לתכנון ייצור בכמויות גדולות, כדי לנצל עד תום את קיבולת המפעל והמכונות","שיטה לקיצוץ קבוע של כוח האדם במחלקת התכנון, כדי להוריד את התקורה של הארגון","שיטה ניהולית לשיפור מתמיד של תכנון החומר, להבטחת האספקות ולצמצום רמות המלאי"],c:3,e:"לפי שקף 25, תכנון רזה הוא שיטה ניהולית החותרת לשיפור מתמיד של תהליכי הניהול והתכנון של החומר בארגון, במטרה להבטיח עמידה באספקות וצמצום רמות המלאי. המיקוד בתכנון החומר ובייעול זרימתו מביא ערך ללקוחות תוך העלמת בזבוז בתכנון חסר ערך שגורם למלאי מיותר. מלאי ביטחון גבוה הוא ההפך. (שא-2, שקף 25)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מנהל רכש חדש מציע להגדיל את המלאי בכל המחסנים כדי להבטיח שלא יהיו עוד איחורים באספקות. מה העמדה של שלמה ארליך, כפי שהוצגה בפרק התכנון הרזה?",o:["הגדלת המלאי אינה הפתרון להבטחת האספקות","הגדלת המלאי היא הפתרון הנכון רק לפריטי <bdi dir='ltr'>A</bdi>","הגדלת המלאי נכונה כשהספקים עובדים ב-<bdi dir='ltr'>VMI</bdi>","הגדלת המלאי מוצדקת כשיש <bdi dir='ltr'>SLA</bdi> חודשי מחייב"],c:0,e:"שקף 24 מבהיר ש״הגדלת המלאי אינה הפתרון״ להבטחת האספקות, ושא-8 חוזר על המסר. האתגר הוא להבטיח אספקות תוך שמירה על רמת מלאי נמוכה, והכלים לכך הם תכנון רזה, גמישות וקווי הגנה ממוקדים — לא הגדלה גורפת של המלאי. (שא-2, שקפים 22–24)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם המטרות של התכנון הרזה שבמצגת?",o:["קיצור זמני האספקה <bdi dir='ltr'>(Lead Time)</bdi>","שיתוף פעולה <bdi dir='ltr'>(Collaboration)</bdi> בתוך הארגון","הקשבה לקול הלקוח <bdi dir='ltr'>(Voice of Customer)</bdi>","הגדלת מנות הרכש כדי לנצל הנחות כמות"],c:3,e:"המטרות בשקף 26 הן קול הלקוח, קיצור <bdi dir='ltr'>Lead Time</bdi>, זמישות, הורדת מלאי, יעילות ושיתוף פעולה. הגדלת מנות רכש לניצול הנחות כמות מגדילה את המלאי, ולכן סותרת את מטרת הורדת המלאי. (שא-2, שקף 26)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"יצרן מפסיק לייצר לפי תוכנית שנתית קבועה, ומתחיל לשחרר ייצור רק בהתאם להזמנות שמגיעות בפועל מהלקוחות. איזה עיקרון של התכנון הרזה בא לידי ביטוי?",o:["<bdi dir='ltr'>Accuracy</bdi> — דיוק בנתוני התכנון","<bdi dir='ltr'>Pull</bdi> — ייצור הנמשך מדרישת הלקוח","<bdi dir='ltr'>Partnering</bdi> — שותפות עם הספקים","<bdi dir='ltr'>Human Equity</bdi> — השקעה בהון האנושי"],c:1,e:"עקרונות התכנון הרזה בשקף 27 הם <bdi dir='ltr'>Pull</bdi>, הצעת ערך, ביטול בזבוז, זמישות, שיתוף מידע, דיוק, שיפור מתמיד, <bdi dir='ltr'>Partnering</bdi> והון אנושי. ייצור שמופעל מההזמנות בפועל ולא מתוכנית קבועה הוא <bdi dir='ltr'>Pull</bdi> — הביקוש ״מושך״ את הייצור. (שא-2, שקף 27)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מנהלת שרשרת אספקה מתחילה לשלוח מדי שבוע לספקים העיקריים את תחזית הביקוש, את רמות המלאי ואת תוכנית הייצור. איזה עיקרון של התכנון הרזה היא מיישמת?",o:["<bdi dir='ltr'>Waste</bdi> — ביטול הבזבוז","<bdi dir='ltr'>Data Sharing</bdi> — שיתוף מידע","<bdi dir='ltr'>Continues Improvement</bdi> — שיפור מתמיד","<bdi dir='ltr'>Value Proposition</bdi> — הצעת ערך"],c:1,e:"העברה שוטפת של תחזיות, מלאים ותוכניות לספקים היא <bdi dir='ltr'>Data Sharing</bdi> — שיתוף מידע, אחד מעקרונות התכנון הרזה בשקף 27. שיתוף המידע מאפשר לספקים להיערך מבעוד מועד, ומקטין את הצורך במלאי ״ליתר ביטחון״ בכל חוליה. (שא-2, שקף 27)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"בין התהליכים הניהוליים התומכים בתכנון רזה, איזה תהליך מגדיר מראש כמה מן המלאי הקיים ניתן להבטיח ללקוחות חדשים?",o:["טיפול בפחת ובגריטה — <bdi dir='ltr'>Scrap</bdi>","הגדרת מלאי זמין למכירה — <bdi dir='ltr'>ATS</bdi>","פארטו של ההוצאות — <bdi dir='ltr'>Expense Pareto</bdi>","סלחנות הנהלה לטעויות — <bdi dir='ltr'>Tolerance</bdi>"],c:1,e:"שקף 28 מונה תהליכים תומכים: סלחנות הנהלה <bdi dir='ltr'>(Tolerance)</bdi>, פארטו הוצאות <bdi dir='ltr'>(Expense Pareto)</bdi>, שותפות ומעורבות בתכנון <bdi dir='ltr'>(Sharing)</bdi>, גריטה <bdi dir='ltr'>(Scrap)</bdi>, הגדרת מלאי זמין למכירה <bdi dir='ltr'>(ATS)</bdi> ושיפור תהליכים. <bdi dir='ltr'>ATS</bdi> — <bdi dir='ltr'>Available To Sell</bdi> — מגדיר איזה חלק מהמלאי פנוי למכירה והבטחה ללקוחות. (שא-2, שקף 28)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"בתהליכי תכנון החומר בתכנון רזה, מה משמעות המעבר לתכנון לפי ״<bdi dir='ltr'>Real Sales</bdi>״?",o:["תכנון לפי מחיר המכירה הריאלי אחרי ניכוי האינפלציה","תכנון לפי יעד המכירות השנתי שקבעה ההנהלה בתחילת השנה","תכנון החומר לפי המכירות בפועל, ולא לפי תחזית אופטימית","תכנון לפי נתוני המכירות של המתחרים העיקריים בשוק"],c:2,e:"שקף 29 מונה את תהליכי תכנון החומר בתכנון רזה: שותפות, אופק תכנון קצר, גמישויות, מכירות אמיתיות <bdi dir='ltr'>(Real Sales)</bdi>, מטריצה מוסכמת <bdi dir='ltr'>(Agreed Matrix)</bdi>, וסטנדרטיזציה וניהול תחליפיים. <bdi dir='ltr'>Real Sales</bdi> פירושו לתכנן לפי המכירות בפועל ולא לפי יעדים או תחזיות. (שא-2, שקף 29)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"במסגרת התקשרות רזה עם ספקים, איזה מהצעדים הבאים מופיע במצגת?",o:["הארכת חלון הביטול וצמצום מספר הספקים","ביטול ה-<bdi dir='ltr'>VMI</bdi> והחזרת המלאי למחסני הארגון","הגדלת ה-<bdi dir='ltr'>MOQ</bdi> כדי לקבל מחיר נמוך יותר","קיצור חלון הביטול והרחבת מספר הספקים"],c:0,e:"שקף 30 מונה צעדים בהתקשרות מול ספקים בתכנון רזה: תנאי התקשרות ו-<bdi dir='ltr'>MOQ</bdi>, הארכת חלון הביטול, בקרת שחרור הזמנות ובקרת מלאים, <bdi dir='ltr'>VMI</bdi>, חוזי התקשרות, קיצור זמן האספקה, מיקור חוץ, מעבר מרמת הפריט לרמת המוצר, צמצום מספר הספקים וניהול ושיתוף איתם. חלון ביטול ארוך מגמיש את הארגון; קיצורו והגדלת ה-<bdi dir='ltr'>MOQ</bdi> מגדילים מלאי. (שא-2, שקף 30)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"במחסן מצטבר מלאי מיותר, והצוות מבלה שעות במכירת עודפים ובפינוי המחסן. לפי העיקרון ״לסגור את הברז ולא את הדליפה״, מה צריך לעשות?",o:["להעביר את המלאי העודף לספקים במסגרת הסכמי <bdi dir='ltr'>VMI</bdi>","למכור את כל העודפים בהנחה ולהתחיל את התכנון מחדש","להגדיל את צוות המחסן כדי לפנות את העודפים מהר יותר","לבחון את הגורמים לכניסות למלאי ולעצור אותן במקור"],c:3,e:"בשקף 31, תחת ניהול חוסרים ובחינת הגורמים לכניסות למלאי, מופיע העיקרון ״לסגור את הברז ולא את הדליפה״: במקום לטפל בתוצאה (פינוי עודפים), מטפלים במקור — בוחנים מדוע נכנס למלאי יותר מהנדרש ועוצרים את הכניסות המיותרות. (שא-2, שקף 31)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"ביקוש למוצר גדל בקצב קבוע וידוע, והמתכנן מכוון את ההזמנות לרמת הביקוש הצפויה בעוד שלושה חודשים — המועד שבו ההזמנה תגיע. איזה מודל טיווח מתאר את הגישה?",o:["״הפוגש״ — יירוט המטרה במיקום עתידי משוער","״הרודף״ — מעקב אחר מטרה בווקטור לא ברור","״הצלף״ — ירי ישיר על מטרה ברורה ונייחת","״הצלף העיוור״ — ירי ללא מידע על המטרה"],c:0,e:"במודל ״הפוגש״ <bdi dir='ltr'>(Interception)</bdi> המטרה נעה בווקטור מוגדר, ומיירטים אותה במיקום העתידי המשוער — כמו תכנון לביקוש שיהיה בעת הגעת ההזמנה. ״הצלף״ מתאים למטרה נייחת (ביקוש קבוע), ״הרודף״ לתנועה בווקטור לא ברור, ו״הצלף העיוור״ למצב ללא מידע כלל. (שא-2, שקפים 35–37)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"ביקוש משתנה באופן לא צפוי מחודש לחודש, אך המתכנן רואה את השינויים בזמן אמת ומתקן את התוכנית ברציפות. לאיזה מודל טיווח מתאים הדבר?",o:["״הצלף העיוור״ — הבאת המטרה למקום שאליו כבר מכוונים","״הפוגש״ — יירוט המטרה במיקום עתידי משוער לפי וקטור ידוע","״הרודף״ — מעקב אחר המטרה ושינוי כיוון בהתאם לתנועתה","״הצלף״ — ירי ישיר על המטרה במיקומה הנוכחי והקבוע"],c:2,e:"״הרודף״ <bdi dir='ltr'>(Follow the Target)</bdi> פועל כשהמטרה נעה בווקטור לא ברור: מכוונים אליה תוך יכולת לשנות כיוון לפי שינויי מיקומה. זה המצב בתרחיש — אין וקטור ידוע (ולכן לא ״פוגש״), אבל יש מידע רציף (ולכן לא ״צלף עיוור״). (שא-2, שקפים 35, 38)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"חברה משיקה מוצר חדש לחלוטין, אין לה כל מידע על הביקוש, והיא יוצאת במבצע השקה כדי לכוון את הלקוחות לקנות בדיוק את הכמויות שייצרה. מה מתאר המהלך במונחי ״הצלף העיוור״?",o:["״מלכודת ופיתיון״ — דוחפים את המטרה למקום שבו ניתן לפגוע בה","״ירי למקום האחרון״ — חוזים את הביקוש לפי נתוני העבר של מוצרים דומים","״קופסת אש״ — יורים לכל עבר בתקווה שחלק מהירי יפגע","״מודיעין״ — אוספים כמה שיותר נתונים על המטרה לפני הירי"],c:0,e:"כשאין מידע על המטרה, המצגת מציעה כמה דרכים: ירי למקום שבו המטרה הייתה לאחרונה (תחזית עבר), מודיעין, ״מלכודת ופיתיון״ וירי לכל עבר (״קופסת אש״). מבצע שמכוון את הלקוחות לכמויות שיוצרו הוא ״מלכודת ופיתיון״ — להביא את המטרה למקום שבו אפשר לפגוע בה. וזה גם העיקרון ״<bdi dir='ltr'>Be Proactive</bdi>״: להשפיע על המטרה להיות היכן שחזינו. (שא-2, שקפים 39–41)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם עקרונות ״תכנון ללא תחזית״ <bdi dir='ltr'>(Non Forecast Planning)</bdi> שבמצגת?",o:["מעבר לייצור במנה של יחידה אחת <bdi dir='ltr'>(One Unit Batch)</bdi>","הגדלת מנות הייצור כדי לנצל יתרונות לגודל","תכנון טלסקופי המותאם לשינויים בתחזית","קיצור זמן האספקה <bdi dir='ltr'>(Lead Time)</bdi> של המוצר"],c:1,e:"עקרונות תכנון ללא תחזית בשקף 41: תחזית מבוססת נתונים (היסטוריה, <bdi dir='ltr'>Phase In/Out</bdi>), הבטחת גמישות התחזית, קיצור <bdi dir='ltr'>Lead Time</bdi>, מעבר ל-״<bdi dir='ltr'>One Unit Batch</bdi>״, זירוז תוכניות עתידיות, ״תכנון טלסקופי״ ופרואקטיביות. הגדלת מנות הייצור מנוגדת ל-<bdi dir='ltr'>One Unit Batch</bdi> ומקטינה את הגמישות. (שא-2, שקף 41)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"מנהל לוגיסטיקה משווה את זמני הליקוט במחסן שלו לאלה של מרכז ההפצה המוביל בענף, כדי ללמוד ממנו. איזה כלי מהמצגת הוא מפעיל?",o:["<bdi dir='ltr'>Benchmarking</bdi> פנימי בתוך הארגון עצמו","<bdi dir='ltr'>Benchmarking</bdi> מול הטובים ביותר בפעילות","<bdi dir='ltr'>Kaizen</bdi> — אירוע שיפור ממוקד בתהליך","<bdi dir='ltr'>Expense Pareto</bdi> — פארטו של ההוצאות"],c:1,e:"שקף 42 מציג <bdi dir='ltr'>Benchmarking</bdi> — השוואה לצורך למידה ושיפור, בכמה רמות, ובהן השוואה בתוך הארגון והשוואה מול הטובים ביותר בפעילות. השוואה למרכז ההפצה המוביל בענף היא <bdi dir='ltr'>Benchmarking</bdi> מול הטובים ביותר, ולא פנימי. (שא-2, שקף 42)"},
{t:"ניהול חומר, מלאי ותכנון רזה",s:"שלמה",q:"שלמה ארליך אומר למנהלים ״לתת חכות ולא דגים״. מה משמעות האמירה בהקשר של ניהול שרשרת אספקה?",o:["לשחק מול הספקים טניס תחרותי ולא מטקות שיתופיות","להחזיק מלאי גדול כדי שהלקוח לא יחכה לעולם","להעדיף ספקים זולים על פני ספקים איכותיים ויקרים","לתת לצוות כלים לפתור בעיות, ולא פתרונות מוכנים"],c:3,e:"בשקף האמירות, ״לתת חכות ולא דגים״ מוסבר כ״כלים ולא פתרונות״ — להקנות לצוות יכולת לפתור בעצמו. באותו שקף מופיעה גם ״שחקו מטקות ולא טניס״ — שיתוף ולא תחרות מול הספקים — שהמסיח האחרון הופך. (שא-2, שקף 45)"}
]);

BANK.push.apply(BANK,[
/* שא-3 — ניהול מיקור ורכש (שלמה ארליך) — 28 שאלות */
/* תפקידי הרכש */
{t:"מיקור ורכש",s:"שלמה",q:"חברה לייצור ציוד רפואי נדרשת לרכיב אלקטרוני חדש שטרם נרכש בעבר. הקניין מאתר שלושה יצרנים פוטנציאליים, משווה ביניהם, בוחר באחד מהם וחותם עמו על חוזה התקשרות. לאיזה מתפקידי הרכש שייכת פעילות זו על פי המצגת?",o:["<bdi dir='ltr'>Purchasing</bdi> — רכישת המוצרים והשירותים מהספק והוצאת הזמנות רכש שוטפות על פי תנאי החוזה","<bdi dir='ltr'>Vendor scheduling</bdi> — תזמון הספק וקביעת מועדי האספקה השוטפים של הרכיב","<bdi dir='ltr'>Sourcing</bdi> — איתור מקורות אספקה, בחירת הספק וחתימה על חוזה התקשרות","<bdi dir='ltr'>Expedite</bdi> — קידום האספקה של הרכיב החדש מול הספק שנבחר לאחר ההזמנה"],c:2,e:"איתור מקורות אספקה, בחירת הספק וחתימה על חוזה ההתקשרות הם בדיוק הגדרת המיקור <bdi dir='ltr'>(Sourcing)</bdi> במצגת. <bdi dir='ltr'>Purchasing</bdi> הוא השלב הבא — רכישה שוטפת והוצאת הזמנות רכש מהספק שכבר נבחר, ואילו תזמון ספקים וקידום אספקות עוסקים בניהול השוטף של אספקות קיימות ולא בבחירת הספק. (שא-3, שקף 8)"},
{t:"מיקור ורכש",s:"שלמה",q:"בעקבות ירידה חדה בביקושים החליט מפעל להאט את קצב הייצור, ובמחסן הצטבר מלאי של חומר גלם. הקניין פונה לספק ומבקש לדחות בחודש את מועד האספקה של המשלוח הבא, שכבר הוזמן. כיצד מכונה פעולה זו במצגת?",o:["<bdi dir='ltr'>De-expedite</bdi> — דחיית אספקה שכבר הוזמנה למועד מאוחר יותר","<bdi dir='ltr'>Expedite</bdi> — קידום והקדמה של אספקה מול הספק לפי צורכי הייצור","<bdi dir='ltr'>Sourcing</bdi> — עדכון מקורות האספקה בהתאם לשינוי שחל בביקוש","<bdi dir='ltr'>Cancelation Window</bdi> — ביטול ההזמנה במסגרת חלון הביטול שנקבע בחוזה"],c:0,e:"דחיית אספקה שכבר הוזמנה למועד מאוחר יותר היא <bdi dir='ltr'>De-expedite</bdi>, בעוד <bdi dir='ltr'>Expedite</bdi> הוא ההפך — קידום והקדמה של אספקה כשחסר חומר; שניהם חלק מתפקיד ׳קידום ודחיית אספקות׳ של הרכש. <bdi dir='ltr'>Sourcing</bdi> עוסק בבחירת ספקים, ובתרחיש לא מבטלים את ההזמנה אלא רק דוחים את מועדה. (שא-3, שקף 8)"},
{t:"מיקור ורכש",s:"שלמה",q:"איזו מהפעילויות הבאות <b>אינה</b> נמנית עם תפקידי הרכש כפי שהוצגו במצגת?",o:["ניהול הקשר השוטף עם הספק על פי תנאי החוזה שנחתם עמו","ייצוג הארגון בדרג הגבוה מול הספק במקרה של הסלמה","הוצאת הזמנות רכש לספק ותזמון מועדי האספקות שלו <bdi dir='ltr'>(Vendor scheduling)</bdi>","הכנת תחזית הביקוש וקביעת רמות המלאי הרצויות במחסני הארגון"],c:3,e:"תחזיות וניהול המלאי שייכים לבלוק ׳ניהול חומר׳ במבנה שרשרת האספקה הארגונית (תחזיות, <bdi dir='ltr'>MRP</bdi>, מלאי), ולא לבלוק הרכש. שלוש הפעילויות האחרות מופיעות במפורש ברשימת תפקידי הרכש: ניהול הקשר השוטף עם הספק לפי תנאי החוזה, הדרג הגבוה בארגון בקשר מול הספק בהסלמה, והוצאת הזמנות רכש ותזמון ספקים. (שא-3, שקפים 2, 8)"},
/* תהליך הרכש וחמשת ה״נכון״ */
{t:"מיקור ורכש",s:"שלמה",q:"משלוח של חומרי גלם הגיע למפעל, נספר, נבדק ונקלט במחסן. כעת עובד הכספים משווה את חשבונית הספק אל מול הזמנת הרכש שהוצאה, לפני שהוא מאשר את התשלום. באיזה שלב של תהליך הרכש נמצאת ההזמנה?",o:["בקרת הזמנה — מעקב אחר ביצוע ההזמנה ומועד האספקה מול הספק","אימות החשבונית מול ההזמנה — השלב שלפני ביצוע התשלום","קבלה למלאי — קליטת הסחורה במחסן ובדיקתה מול המשלוח","ביצוע תשלום לספק — השלב הסוגר את תהליך הרכש"],c:1,e:"השוואת חשבונית הספק להזמנת הרכש היא שלב ׳אימות החשבונית מול ההזמנה׳, הבא אחרי הקבלה למלאי ולפני ביצוע התשלום לספק. הקבלה למלאי כבר הסתיימה בתרחיש (הסחורה נספרה ונקלטה), התשלום עצמו טרם בוצע, ובקרת הזמנה מתבצעת עוד לפני הגעת הסחורה. (שא-3, שקף 9)"},
{t:"מיקור ורכש",s:"שלמה",q:"איזה מהרצפים הבאים מתאר נכונה את סדר השלבים הראשונים בתהליך הרכש, כפי שהוצג במצגת?",o:["דרישת רכש ← איתור מקורות האספקה ← קבלה ובחינת הצעות מחיר ← בחירת הספק ← חתימת הסכם רכש","איתור מקורות האספקה ← דרישת רכש ← בחירת הספק ← קבלה ובחינת הצעות מחיר ← חתימת הסכם רכש","דרישת רכש ← קבלה ובחינת הצעות מחיר ← איתור מקורות האספקה ← חתימת הסכם רכש ← בחירת הספק","חתימת הסכם רכש ← דרישת רכש ← איתור מקורות האספקה ← קבלה ובחינת הצעות מחיר ← בחירת הספק"],c:0,e:"התהליך מתחיל בדרישת רכש (הצורך), ממשיך באיתור מקורות האספקה, לאחר מכן מתקבלות ונבחנות הצעות מחיר מהמקורות שאותרו, נבחר הספק ורק אז נחתם עמו הסכם רכש. לא ניתן לבחון הצעות מחיר לפני שאותרו מקורות, ולא ניתן לחתום על הסכם לפני שנבחר הספק. (שא-3, שקף 9)"},
{t:"מיקור ורכש",s:"שלמה",q:"מטרת ניהול תהליך הרכש, על פי המצגת, היא הבטחת זמינות המוצרים לארגון באמצעות חמישה ׳נכונים׳. איזה מהבאים <b>אינו</b> אחד מחמשת ה׳נכונים׳ שהוצגו?",o:["הספק הנכון","הכמות הנכונה","המחיר הנכון","המקום הנכון"],c:2,e:"חמשת ה׳נכונים׳ במצגת הם: המוצר הנכון, הספק הנכון, האיכות הנכונה, הכמות הנכונה והמקום הנכון. המחיר אינו ברשימה — המצגת מגדירה את מטרת ניהול התהליך כהבטחת זמינות המוצרים לארגון, והמחיר והחיסכון מטופלים בנפרד תחת <bdi dir='ltr'>Cost Reduction</bdi>. (שא-3, שקף 9)"},
{t:"מיקור ורכש",s:"שלמה",q:"לאחר שנחתם הסכם רכש והוצאה הזמנה לספק, הקניינית עוקבת אחר אישור ההזמנה על ידי הספק, מוודאת שמועד האספקה המובטח נשמר ומטפלת בחריגות עוד לפני שהסחורה מגיעה. איזה שלב בתהליך הרכש היא מבצעת?",o:["קבלה למלאי — קליטת המשלוח במחסן ובדיקתו מול ההזמנה","בקרת הזמנה — מעקב אחר ההזמנה מרגע הוצאתה ועד האספקה","בחירת הספק — הערכת עמידת הספק בהתחייבויותיו החוזיות","איתור מקורות האספקה — בדיקת ספקים חלופיים למקרה של איחור"],c:1,e:"מעקב אחר אישור ההזמנה, מועד האספקה והחריגות בין הוצאת ההזמנה לבין הגעת הסחורה הוא שלב ׳בקרת הזמנה׳, הבא לאחר חתימת הסכם הרכש ולפני הקבלה למלאי. בחירת הספק ואיתור המקורות הם שלבים מוקדמים שכבר הסתיימו, והקבלה למלאי מתבצעת רק כשהסחורה מגיעה בפועל. (שא-3, שקף 9)"},
/* פרמטרים שמשפיעים על המחיר */
{t:"מיקור ורכש",s:"שלמה",q:"ספק בסין הגיש לקניין שתי הצעות מחיר לאותו מוצר ובאותה כמות: בהצעה האחת המחיר כולל הובלה ימית וביטוח עד לנמל בישראל, ובשנייה הקונה אוסף את הסחורה ממפעל הספק על חשבונו. איזה פרמטר מבין המשפיעים על המחיר מסביר את הפער בין ההצעות?",o:["כמות מינימלית לאריזה — <bdi dir='ltr'>MPQ</bdi>","זמן אספקה — <bdi dir='ltr'>Lead Time</bdi>","אחריות — <bdi dir='ltr'>Warranty</bdi>","תנאי משלוח — <bdi dir='ltr'>Inco Term</bdi>"],c:3,e:"ההבדל בין ההצעות הוא במי נושא בהובלה ובביטוח ועד לאיזו נקודה — זו בדיוק מהות תנאי המשלוח <bdi dir='ltr'>(Inco Term)</bdi>, אחד הפרמטרים המשפיעים על המחיר. הכמות זהה בשתי ההצעות ולכן <bdi dir='ltr'>MPQ</bdi> אינו רלוונטי, ואין בתרחיש שינוי בזמן האספקה או בתנאי האחריות. (שא-3, שקף 10)"},
{t:"מיקור ורכש",s:"שלמה",q:"מפעל זקוק ל-350 יחידות של רכיב. הספק מודיע שהרכיב נארז בקרטונים של 500 יחידות, ושהמחיר ליחידה שהוצע מבוסס על רכישת קרטונים שלמים; רכישה של 350 יחידות בלבד תייקר את המחיר ליחידה. איזה פרמטר משפיע כאן על המחיר?",o:["כמות מינימלית לאריזה — <bdi dir='ltr'>MPQ</bdi>","חלון ביטול ושינוי — <bdi dir='ltr'>Cancelation Window</bdi>","תנאי משלוח — <bdi dir='ltr'>Inco Term</bdi>","זמן אספקה — <bdi dir='ltr'>Lead Time</bdi>"],c:0,e:"הדרישה לרכוש קרטונים שלמים היא כמות מינימלית לאריזה <bdi dir='ltr'>(MPQ)</bdi>, פרמטר שמשפיע על המחיר: הזמנה קטנה מה-<bdi dir='ltr'>MPQ</bdi> מייקרת את המחיר ליחידה. חלון הביטול נוגע לאפשרות לשנות או לבטל הזמנה קיימת, ותנאי המשלוח וזמן האספקה אינם משתנים בתרחיש. (שא-3, שקף 10)"},
{t:"מיקור ורכש",s:"שלמה",q:"במהלך משא ומתן מציע הספק להוזיל את המחיר ב-4% אם החברה תתחייב שלא לבטל ולא לשנות הזמנות בתוך שמונה השבועות שלפני מועד האספקה. על איזה פרמטר מבין המשפיעים על המחיר מתנהל כאן המשא ומתן?",o:["זמן אספקה <bdi dir='ltr'>(Lead Time)</bdi> — משך הזמן מהוצאת ההזמנה ועד האספקה בפועל","חלון ביטול ושינוי <bdi dir='ltr'>(Cancelation Window)</bdi> — פרק הזמן לשינוי הזמנה","אחריות <bdi dir='ltr'>(Warranty)</bdi> — משך ותנאי האחריות שהספק מעניק למוצר","כמות מינימלית לאריזה <bdi dir='ltr'>(MPQ)</bdi> — גודל האריזה הבסיסי של הספק"],c:1,e:"התחייבות שלא לבטל ולא לשנות הזמנות בפרק זמן קבוע שלפני האספקה היא חלון הביטול והשינוי <bdi dir='ltr'>(Cancelation Window)</bdi>: ככל שהספק מקבל ודאות רבה יותר, הוא מוכן להוזיל. זמן אספקה הוא משך הזמן מההזמנה ועד האספקה, ולא ההתחייבות שלא לשנותה. (שא-3, שקף 10)"},
/* חיסכון: מחיר נוכחי / מחיר בסיס / TCO / השפעה על רווחיות */
{t:"מיקור ורכש",s:"שלמה",q:"חברה רוכשת לראשונה שירות תחזוקה חדש. הצעת המחיר הכתובה הראשונה שהתקבלה מהספק הייתה 120 אלף ש״ח לשנה; לאחר משא ומתן נחתם החוזה על 102 אלף ש״ח לשנה. מהו שיעור החיסכון שהרכש רשאי לדווח עליו על פי שיטת החישוב במצגת?",o:["כ-18% — הפער בין ההצעה הראשונה לחוזה, מחולק במחיר החוזה שנחתם בפועל","0% — לשירות חדש אין מחיר נוכחי מהזמנה קודמת, ולכן לא ניתן לדווח על חיסכון","15% — הפער בין הצעת המחיר הראשונה למחיר הנוכחי, מחולק במחיר הבסיס","85% — היחס בין מחיר החוזה שנחתם לבין הצעת המחיר הכתובה הראשונה"],c:2,e:"החיסכון מחושב כהשוואת המחיר הנוכחי (102) אל מול מחיר הבסיס; למוצר או שירות חדש, מחיר הבסיס הוא הצעת המחיר הכתובה הראשונה (120). לכן החיסכון הוא 18/120 = 15%. חלוקה במחיר החוזה (18/102 ≈ 17.6%) שגויה, ו-85% (102/120) הוא היחס בין שני המחירים — המשלים של שיעור החיסכון ולא השיעור עצמו. (שא-3, שקף 11)"},
{t:"מיקור ורכש",s:"שלמה",q:"קניינית נדרשת לקבוע ׳מחיר בסיס׳ לשירות ייעוץ שהארגון מעולם לא רכש, כדי שניתן יהיה למדוד בעתיד את החיסכון שיושג. איזה מהבאים הוא מקור לגיטימי למחיר הבסיס על פי המצגת?",o:["המחיר ששולם בהזמנה האחרונה של אותו שירות מאותו ספק","המחיר הממוצע הנע (ממ״ן) של השירות בשנה האחרונה","המחיר הסופי שנחתם בחוזה לאחר סיום המשא ומתן","מחיר השוק של השירות או מחיר של שירות קיים זהה"],c:3,e:"מחיר הבסיס למוצר או שירות חדש נקבע על פי מחיר מוצר קיים זהה, מחיר שוק או הצעת מחיר כתובה ראשונה. מחיר אחרון בהזמנה קודמת וממוצע נע (ממ״ן) הם הגדרות של ה׳מחיר הנוכחי׳ ואינם קיימים לשירות שמעולם לא נרכש, והמחיר שנחתם לאחר המשא ומתן הוא המחיר הנוכחי שמושווה אל מול הבסיס. (שא-3, שקף 11)"},
{t:"מיקור ורכש",s:"שלמה",q:"בהשוואה בין שני ספקים, ספק א׳ מציע מחיר ליחידה נמוך ב-8% מספק ב׳, אך זמן האספקה שלו ארוך יותר, עלויות ההובלה גבוהות יותר, שיעור הפגומים גבוה יותר ותקופת האחריות קצרה יותר. כיצד יפעל מנהל רכש הפועל על פי גישת <bdi dir='ltr'>Total Cost of Ownership</bdi>?",o:["יבחר בספק א׳, שכן המחיר ליחידה הוא ה-<bdi dir='ltr'>KPI</bdi> המרכזי שעליו נמדד הרכש, ויתר הגורמים באחריות יחידות אחרות","יסכם את כלל העלויות — הובלה, פגומים, אחריות וזמן אספקה — וישווה את העלות הכוללת ולא את המחיר בלבד","יבחר בספק ב׳, שכן איכות גבוהה ותקופת אחריות ארוכה עדיפות תמיד על פני מחיר נמוך, ללא צורך בחישוב","יפצל את ההזמנה בין שני הספקים באופן שווה, כדי לאזן בין המחיר הנמוך של האחד לאיכות של האחר"],c:1,e:"גישת <bdi dir='ltr'>TCO</bdi> — העלות הכוללת — קובעת שהרכש אחראי לעלות הכוללת ולא רק למחיר: יש לסכום את כל מרכיבי העלות (הובלה, פגומים, אחריות, השלכות זמן האספקה) ולהשוות את העלות הכוללת של כל ספק. בחירה לפי המחיר ליחידה בלבד מתעלמת מהעלויות הנוספות, ובחירה אוטומטית באיכות מתעלמת מהחישוב הכולל. (שא-3, שקף 6)"},
{t:"מיקור ורכש",s:"שלמה",q:"מנכ״ל חברה תוהה מדוע ההנהלה מציבה יעד חיסכון של 10% למנהל הרכש, במקום להשקיע את המאמץ בהגדלת המכירות. מהי ההצדקה לכך על פי המצגת?",o:["השפעת הרכש על רווחיות הארגון גדולה מזו של המכירות — חיסכון ברכש יורד ישירות לרווח ושקול לגידול ניכר במכירות","המכירות תלויות בתנאי השוק ואינן בשליטת הארגון, ואילו חיסכון ברכש הוא ודאי ואינו כרוך בסיכון עסקי","הרכש שולט בכ-10% בלבד מהוצאות הארגון, ולכן יעד חיסכון של 10% הוא יעד צנוע שניתן להשיגו בקלות","הרכש אחראי לזמינות החומר, ולכן חיסכון בו מקטין את המלאי במחסנים ומשפר את תזרים המזומנים של הארגון בטווח הקצר"],c:0,e:"המצגת מדגישה שההשפעה של הרכש על רווחיות הארגון גדולה מההשפעה של המכירות: חיסכון של 10% ברכש מתורגם ישירות לרווח, בעוד שגידול במכירות מגדיל גם את העלויות — ולכן נדרש גידול משמעותי בהרבה במכירות כדי להשיג אותה תוספת רווח. הטענה שהרכש הוא רק 10% מההוצאות אינה מופיעה במצגת ואף מנוגדת לרוחה. (שא-3, שקף 6)"},
/* תמחיר מול המחרה וסיווג עלויות */
{t:"מיקור ורכש",s:"שלמה",q:"מהו ההבדל בין תמחיר <bdi dir='ltr'>(Costing)</bdi> לבין המחרה <bdi dir='ltr'>(Pricing)</bdi> על פי המצגת?",o:["תמחיר עוסק בקביעת המחיר לצרכן על פי ציפיותיו, והמחרה עוסקת בסכימת העלויות הישירות בלבד של המוצר","תמחיר הוא שיטה לקביעת המחיר במשא ומתן מול הספק, והמחרה היא סכימת עלויות המכירה והשיווק של המוצר","תמחיר סוכם רק את עלויות הייצור של המוצר, ואילו המחרה סוכמת את עלויות השירות והאחריות שלאחר המכירה ללקוח","תמחיר סוכם את כלל העלויות, הישירות והעקיפות, של המוצר; המחרה קובעת את מחירו על פי ציפיות המשווק והצרכן"],c:3,e:"תמחיר <bdi dir='ltr'>(Costing)</bdi> הוא סכימת כלל העלויות — ישירות ועקיפות — של המוצר או השירות, מרגע הייצור ועד סיום השירות והאחריות; המחרה <bdi dir='ltr'>(Pricing)</bdi> היא שיטה לקביעת מחירו של מוצר או שירות, המבטאת את ציפיות המשווק והצרכן. המסיחים מחליפים בין המושגים או מצמצמים את התמחיר לעלויות ישירות או לעלויות ייצור בלבד. (שא-3, שקף 12)"},
{t:"מיקור ורכש",s:"שלמה",q:"במפעל לייצור ארונות מתכת בהתאמה אישית משתמשים בשמן סיכה למכונות החיתוך המשרתות את כל ההזמנות, ולא ניתן לשייך את צריכתו להזמנה מסוימת. כיצד יסווג שמן הסיכה במערכת התמחיר על פי המצגת?",o:["חומרים ישירים — חומר גלם הנצרך בתהליך הייצור של הארונות","תקורה — הוצאת ייצור שוטפת שאינה עבודה ואינה חומר ישיר","חומרים עקיפים — חומר שלא ניתן לשייכו למוצר או להזמנה","עבודה עקיפה — תשומה המשרתת את כל קווי הייצור במפעל"],c:2,e:"שמן הסיכה הוא חומר, אך לא ניתן לזהותו כשייך למוצר או להזמנה ספציפיים — ולכן הוא ׳חומרים עקיפים׳. חומרים ישירים הם חומרי גלם שניתן לזהותם עם מוצר או הזמנה ספציפיים (כמו פח המתכת של ארון מסוים); תקורה היא יתרת ההוצאות שאינן עבודה או חומרים (שכירות, ביטוח, פחת וריבית), ושמן הסיכה הוא בבירור חומר. (שא-3, שקף 12)"},
{t:"מיקור ורכש",s:"שלמה",q:"מנהל התמחיר במפעל נדרש לסווג שתי הוצאות: שכר טכנאי האחזקה המטפלים בכל המכונות במפעל, ודמי השכירות החודשיים של מבנה המפעל. מהו הסיווג הנכון של שתי ההוצאות, בהתאמה, על פי המצגת?",o:["עבודה עקיפה; תקורה","עבודה ישירה; חומרים עקיפים","תקורה; עבודה ישירה","עבודה עקיפה; חומרים עקיפים"],c:0,e:"שכר טכנאי האחזקה הוא שעות עבודה שלא ניתן לזהותן עם ייצור מוצר או הזמנה ספציפיים — עבודה עקיפה; דמי השכירות הם חלק מיתרת ההוצאות שאינן עבודה או חומרים (שכירות, ביטוח, פחת וריבית) — תקורה. שכירות אינה עבודה ואינה חומר, ולכן אינה יכולה להיות ׳עבודה עקיפה׳ או ׳חומרים עקיפים׳. (שא-3, שקף 12)"},
{t:"מיקור ורכש",s:"שלמה",q:"על פי המצגת, על אילו עלויות ועל איזה טווח זמן משתרע התמחיר <bdi dir='ltr'>(Costing)</bdi> של מוצר?",o:["העלויות הישירות בלבד — חומרים ועבודה — מרגע רכישת חומר הגלם ועד השלמת הייצור","כלל העלויות, הישירות והעקיפות, מרגע הייצור ועד סיום השירות והאחריות למוצר","עלויות הייצור והשיווק בלבד, מרגע קבלת ההזמנה מהלקוח ועד המכירה בפועל","העלויות העקיפות והתקורה בלבד, מרגע המכירה ללקוח ועד סיום תקופת האחריות למוצר"],c:1,e:"המצגת מגדירה תמחיר כסכימת כלל העלויות — הישירות והעקיפות — של המוצר או השירות, מרגע הייצור ועד סיום השירות והאחריות. ההגדרה רחבה גם מבחינת סוגי העלויות (לא רק ישירות ולא רק עקיפות) וגם מבחינת הזמן (אינה נעצרת במכירה אלא נמשכת עד תום האחריות). (שא-3, שקף 12)"},
/* קלשון החיסכון */
{t:"מיקור ורכש",s:"שלמה",q:"מנהל רכש מציג להנהלה שלוש חלופות לתוכנית חיסכון: סבב משא ומתן נוסף עם הספקים הקיימים; ייעול תהליך הרכש והפחתת עלויות הטיפול בהזמנות; ושינוי כולל של תפיסת ההפעלה — למשל מעבר מרכישת רכיבים בודדים לרכישת מכלולים שלמים מספק אסטרטגי. על פי ׳קלשון החיסכון׳, מה ניתן לומר על החלופה השלישית?",o:["היא הפשוטה והמהירה ביותר ליישום, ולכן פוטנציאל החיסכון שלה הוא הנמוך מבין שלוש החלופות","פוטנציאל החיסכון שלה זהה לזה של סבב המשא ומתן, אך היא דורשת זמן ומשאבים רבים יותר","היא שייכת לשן ׳שיפור תהליכים׳ בקלשון, ולכן פוטנציאל החיסכון שלה בינוני","היא שן ה׳אסטרטגיה׳ — המהלך העמוק ביותר ולכן בעל פוטנציאל החיסכון הגבוה ביותר"],c:3,e:"שינוי תפיסת הפעלה הוא שן ה׳אסטרטגיה׳ בקלשון החיסכון: ככל שהמהלך עמוק ומורכב יותר, פוטנציאל החיסכון גדול יותר — משא ומתן בתחתית, שיפור תהליכים באמצע ואסטרטגיה בראש. החלופה השלישית אינה שיפור תהליכים (זו החלופה השנייה), ופוטנציאל החיסכון שלה גבוה בהרבה מזה של משא ומתן. (שא-3, שקף 14)"},
{t:"מיקור ורכש",s:"שלמה",q:"סמנכ״לית הכספים מבקשת לדרג את שלושת מקורות החיסכון ב׳קלשון החיסכון׳, מהמקור בעל פוטנציאל החיסכון הנמוך ביותר אל המקור בעל הפוטנציאל הגבוה ביותר. מהו הדירוג הנכון על פי המצגת?",o:["שיפור תהליכים ← משא ומתן ← אסטרטגיה","אסטרטגיה ← שיפור תהליכים ← משא ומתן","משא ומתן ← שיפור תהליכים ← אסטרטגיה","משא ומתן ← אסטרטגיה ← שיפור תהליכים"],c:2,e:"בקלשון החיסכון, משא ומתן <bdi dir='ltr'>(Negotiation)</bdi> הוא המקור השטוח ביותר ובעל פוטנציאל החיסכון הנמוך ביותר, שיפור תהליכים <bdi dir='ltr'>(Process Improvement)</bdi> נמצא במדרגה גבוהה יותר, ושינוי אסטרטגי של תפיסת ההפעלה <bdi dir='ltr'>(Strategy)</bdi> הוא העמוק ביותר ובעל הפוטנציאל הגבוה ביותר. הדירוג ההפוך מתחיל דווקא באסטרטגיה, ולכן שגוי. (שא-3, שקף 14)"},
/* אסטרטגיית האוקיינוס הכחול */
{t:"מיקור ורכש",s:"שלמה",q:"איזה מההיגדים הבאים מתאר <b>אוקיינוס אדום</b> על פי המצגת?",o:["נישת שוק לא מנוצלת, שבה נוצר ביקוש חדש ונפתחת הזדמנות לצמיחה רווחית מאוד","כלל הענפים והנישות הקיימים, שבהם כללי המשחק ידועים והחברות נאבקות על הביקוש הקיים","שוק שבו התחרות אינה רלוונטית, משום שכללי המשחק של התחרות בו טרם נקבעו כלל","שוק שבו החברה שוברת את פשרת הערך–עלות ומשיגה בידול וגם עלות נמוכה בעת ובעונה אחת"],c:1,e:"אוקיינוסים אדומים מייצגים את כלל הענפים והנישות הקיימים כיום; כללי המשחק של התחרות ידועים ומקובלים, והחברות מנסות לגבור על יריביהן כדי לחטוף נתח שוק גדול יותר מהביקוש הקיים. שלושת ההיגדים האחרים מתארים אוקיינוס כחול: נישה לא מנוצלת, תחרות לא רלוונטית ושבירת פשרת הערך–עלות. (שא-3, שקפים 17, 19)"},
{t:"מיקור ורכש",s:"שלמה",q:"חברת מכשירי כושר פיתחה מוצר המיועד לאנשים שמעולם לא התאמנו ואינם לקוחות של אף מכון כושר, ובכך יצרה ביקוש שלא היה קיים קודם. כיצד יתאר את המהלך מי שמנתח אותו במונחי אסטרטגיית האוקיינוס הכחול?",o:["מהלך אוקיינוס כחול — יצירת נישה חסרת מתחרים ולכידת ביקוש חדש ההופכת את התחרות ללא רלוונטית","מהלך אוקיינוס אדום — כניסה לענף הכושר הקיים ומאבק מול המתחרים על נתח גדול יותר מהביקוש הקיים בו","אסטרטגיית בידול קלאסית — ניצול הביקוש הקיים בענף באמצעות מוצר שונה במהותו מזה של המתחרים","אסטרטגיית עלות נמוכה — הצעת מוצר זול יותר מהמקובל בענף כדי לגבור על המתחרים הקיימים בו"],c:0,e:"פנייה ללא-לקוחות ויצירת ביקוש שלא היה קיים היא ליבת אסטרטגיית האוקיינוס הכחול: ליצור נישה ללא מתחרים, ליצור וללכוד ביקוש חדש ולהפוך את התחרות ללא רלוונטית. אוקיינוס אדום ואסטרטגיות מבוססות-תחרות (בידול או עלות נמוכה) עוסקות בניצול הביקוש הקיים ובניצחון על המתחרים — ההפך מהתרחיש. (שא-3, שקפים 16–19)"},
{t:"מיקור ורכש",s:"שלמה",q:"רשת חדרי כושר חדשה החליטה לוותר לחלוטין על בריכת שחייה, סאונה ומדריכים אישיים — מרכיבים שהענף רואה בהם מובנים מאליהם — כדי להוזיל דרמטית את המנוי. לאיזו מארבע הפעולות של האוקיינוס הכחול מתאים המהלך?",o:["צמצום — הורדת רמתם של גורמים אל מתחת לרמה המקובלת בענף","הגברה — העלאת רמתם של גורמים מעל לרמה המקובלת בענף","יצירה — הוספת גורמים שלא היו קיימים בענף","ביטול — הסרה מוחלטת של גורמים שהענף מקבל כמובנים מאליהם"],c:3,e:"ויתור מוחלט על גורמים שהענף מקבל כמובנים מאליהם הוא פעולת ׳ביטול׳. ׳צמצום׳ פירושו הורדת הרמה של גורם ביחס לרמה המקובלת בענף — לא הסרתו לחלוטין (למשל בריכה קטנה יותר), ולכן אינו מתאים לתרחיש שבו המרכיבים בוטלו כליל. הגברה ויצירה מוסיפות ערך ואינן מסירות. (שא-3, שקף 22)"},
{t:"מיקור ורכש",s:"שלמה",q:"יצרנית רכב חשמלי כוללת במחיר הרכב שירות שאף יצרן בענף לא הציע עד כה: התקנת עמדת טעינה ביתית ותחזוקתה לאורך חיי הרכב. מבין ארבע הפעולות של האוקיינוס הכחול, איזו פעולה מבצעת החברה?",o:["הגברה — הרחבת גורם קיים בענף מעבר לרמה המקובלת בו","ביטול — הסרת גורם שהענף רואה כמובן מאליו","יצירה — הוספת גורם חדש שלא היה קיים כלל בענף עד כה","צמצום — הפחתת גורם קיים ביחס לרמה המקובלת בענף"],c:2,e:"הוספת שירות שאף יצרן בענף לא הציע היא פעולת ׳יצירה׳ — גורמים שלא קיימים. ׳הגברה׳ (הרחבה) היא העלאת רמתו של גורם שכבר קיים בענף מעל לרמה המקובלת, ואילו כאן מדובר בגורם חדש לחלוטין. ביטול וצמצום מסירים או מפחיתים גורמים ואינם רלוונטיים לתרחיש. (שא-3, שקף 22)"},
{t:"מיקור ורכש",s:"שלמה",q:"מהי ׳חדשנות ערך׳ <bdi dir='ltr'>(Value Innovation)</bdi> על פי המצגת, ומתי היא מתחוללת?",o:["פריצת דרך טכנולוגית המעניקה לחברה יתרון ברור על המתחרים; מתחוללת כשההשקעה במחקר ופיתוח עולה על זו של כל המתחרים","זינוק בערך המוצר לקונים ולחברה במקום הבסת המתחרים; רק כשנוצר מתאם בין חדשנות לבין תועלת, מחיר ועלות","בידול המוצר מזה של המתחרים באמצעות תוספת מאפיינים ושירותים; מתחוללת כשהלקוחות מוכנים לשלם מחיר גבוה יותר","הורדת עלות הייצור אל מתחת לזו של המתחרים; מתחוללת כשהחברה משיגה יתרון לגודל ונתח שוק מוביל בענף"],c:1,e:"חדשנות ערך היא זינוק בערך המוצר לקונים ולחברה, הפותח נישת שוק חדשה ללא מתחרים במקום להתמקד בהבסת המתחרים; היא מתחוללת רק כאשר החברה יוצרת מתאם בין חדשנות לבין תועלת, מחיר ועלות, והיא אסטרטגיה כלל-ארגונית. חדשנות טכנולוגית, בידול או עלות נמוכה בלבד הם ביטויים של אסטרטגיה מבוססת-תחרות. (שא-3, שקף 18)"},
