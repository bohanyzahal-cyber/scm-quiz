{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ב-2015 ייצרה Cardo יותר מ-200 מק״טים של מוצרים סופיים, כשכל מוצר הותאם למפיץ ולמדינה (מטען, שפה צרובה, אריזה ומסמכים). ב-2020 עברה ל-SKU אחד ול-Build to Stock. מה ההיגיון של השינוי מנקודת מבט של אסטרטגיית שרשרת האספקה?",o:["הגדלת ההתאמה האישית לכל מפיץ מחייבת ייצור לפי הזמנה ומלאי גדול יותר של תוצרת גמורה","מעבר לייצור למלאי מגדיל את מגוון המק״טים ומאפשר למנוע תחרות בין מפיצים ממדינות שונות","ריבוי מק״טים מאפשר ניצול יתרונות לגודל, ולכן שולב עם Build to Stock כדי להוזיל את הרכש ואת הייצור","צמצום השונות בין המוצרים מאפשר ייצור למלאי של מוצר אחיד, קיצור זמני האספקה וקיטון במלאי"],c:3,e:"מוצר מותאם לכל מפיץ יצר יותר מ-200 מק״טים וחייב ייצור לפי הזמנה (BTO) עם זמן אספקה של 8 שבועות. צמצום ל-SKU אחד מבטל את השונות ומאפשר Build to Stock — ייצור למלאי של מוצר אחיד — וכך מתקבלים היתרונות שהמצגת מונה: קיצור זמני אספקה, קיטון במלאי ושיפור ההון החוזר. ריבוי מק״טים דווקא מפצל את המלאי ואינו מקנה יתרונות לגודל. (שא-7, שקפים 30, 34, 39)"}
]);

BANK.push.apply(BANK,[
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"כיצד מנוסח האתגר העיקרי של מנהל שרשרת האספקה במצגת ״ארגז כלים וסיכום״?",o:["עמידה בתחזית המכירות השנתית, תוך ניצול מלא של קיבולת הייצור והמכונות במפעל לאורך כל השנה","הגדלת המלאי בכל שלבי השרשרת, כדי להבטיח שהלקוחות לעולם לא ייתקלו בחוסרים","הורדת עלויות הרכש בכל שנה, תוך שמירה על מספר קטן של ספקים ועל מלאי ביטחון גבוה בכל המחסנים","הבטחת אספקות לפי תוכנית המכירות, תוך שמירה על גמישות תפעולית, מלאי נמוך ואיכות גבוהה"],c:3,e:"בשקף 3: ״האתגר: הבטחת אספקות ללקוחות על פי תוכנית המכירות, תוך שמירה על גמישות תפעולית, רמת מלאי נמוכה ואיכות גבוהה!״ — בגרסה זו נוסף רכיב האיכות הגבוהה לאתגר שהוצג במבוא. הגדלת המלאי מנוגדת לאתגר: ״הגדלת המלאי אינה הפתרון״. (שא-8, שקפים 3, 6)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם עיסוקי הליבה של שרשרת האספקה במצגת ארגז הכלים?",o:["בקרת תהליכים (Process Control)","קביעת מחירי המכירה ללקוחות (Pricing)","ניהול ספקים ומיקור פריטים ייחודיים (Vendor Management)","מעבר מפיתוח לייצור של מוצרים חדשים (NPI)"],c:1,e:"בשקף 5 עיסוקי הליבה הם: ניהול הזמנות ואספקות, ניהול חומר ותחזיות, ניהול מלאי, ניהול ספקים, מיקור של פריטים ייחודיים, הורדת עלויות, לוגיסטיקה, NPI — מעבר מפיתוח לייצור, ושיפור תהליכים ובקרה (Process Control). תמחור מכירה הוא תפקיד השיווק. (שא-8, שקף 5)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי ״מודל השנה הראשונה בתפקיד״, היכן נמצאת נקודת השפל של שביעות הרצון של מנהל חדש?",o:["ביום הראשון, ומשם העקומה רק עולה בהדרגה עד סוף השנה","בסביבות שלושה חודשים, אחרי ירידה מתונה ורציפה מהיום הראשון","בסוף השנה, כשמגיעים הלקחים והמסקנות מהשנה הראשונה","בסביבות החודש הראשון, אחרי שיא קטן בשבוע הראשון"],c:3,e:"בשקף 7 מוצגת עקומת שביעות רצון לאורך זמן: ״הלם״ בהתחלה, שיא קטן אחרי שבוע, ירידה לנקודת שפל סביב החודש, התאוששות עד שלושה חודשים ועלייה מתמשכת עד שנה. מנהל שמכיר את העקומה יודע שהשפל של החודש הראשון צפוי ואינו סימן לכישלון. (שא-8, שקף 7)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהלת שרשרת אספקה חדשה מתחילה בתפקיד. לפי תוכנית העבודה השנתית, מה עליה לעשות ברבעון הראשון?",o:["להקשיב, ללמוד, לא לבטל את העבר — וללמוד את הארגון ואת סביבת הפעולה","להחליף את מנהלי הצוותים ולהתחיל מיד ביישום השינוי המבני בשרשרת","לעדכן את הייעוד, המדדים והאסטרטגיה על סמך הלקחים של השנה הראשונה","לנהל משא ומתן מחודש עם כל הספקים ולבחור מחדש את הספקים הקבועים"],c:0,e:"בשקף 8, הדגשים לרבעון הראשון: להקשיב, ללמוד, לא לבטל את העבר, ולימוד הארגון וסביבת הפעולה; התוצרים: תובנות, משימות להמשך ופגישות אישיות. יישום השינוי, החלפת כוח אדם וניהול ספקים הם ברבעון השלישי, ועדכון הייעוד והאסטרטגיה — ברבעון הרביעי. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"באיזה רבעון בתוכנית העבודה השנתית מופיעים ״יישום השינוי, תחילת החלפת כוח אדם וניהול ספקים״?",o:["ברבעון השלישי","ברבעון הראשון","ברבעון השני","ברבעון הרביעי"],c:0,e:"בשקף 8: רבעון I — להקשיב וללמוד; רבעון II — תכנון והכנת תוכנית עבודה (ייעוד, אסטרטגיה, קודי התנהגות, מדדים); רבעון III — יישום השינוי, תחילת החלפת כוח אדם וניהול ספקים, עם יישום תהליכים, ארגון מבנה השרשרת ומדידת ביצועים כנקודת ייחוס; רבעון IV — בקרה ולמידה ושיפור ביצועים. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה התוצר של הרבעון השני בתוכנית העבודה השנתית של מנהל שרשרת האספקה?",o:["תוכנית עבודה: ייעוד, אסטרטגיה, קודי התנהגות ומדדים","לקחים מהשנה הראשונה בתפקיד ותוכנית עבודה מפורטת לשנה הבאה","תובנות, משימות להמשך ופגישות אישיות עם המנהלים והעובדים","מבנה שרשרת חדש ומדידת ביצועים כנקודת ייחוס"],c:0,e:"ברבעון II הדגש הוא תכנון, והתוצר — הכנת תוכנית עבודה הכוללת ייעוד, אסטרטגיה, קודי התנהגות ומדדים. תובנות ופגישות אישיות הן תוצרי הרבעון הראשון, מבנה השרשרת ונקודת הייחוס — של השלישי, והלקחים ותוכנית השנה הבאה — של הרביעי. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל מסיים את השנה הראשונה בתפקיד. לפי תוכנית העבודה, מה מאפיין את הרבעון הרביעי?",o:["יישום השינוי — תחילת החלפת כוח האדם וארגון מחדש של מבנה השרשרת ושל הספקים","בקרה ולמידה — שיפור ביצועים, עדכון הייעוד והמדדים ותוכנית לשנה הבאה","תכנון — הכנת תוכנית עבודה ראשונה הכוללת ייעוד, אסטרטגיה ומדדים","הקשבה ולמידה — פגישות אישיות ולימוד הארגון וסביבת הפעולה שלו"],c:1,e:"בשקף 8 הרבעון הרביעי הוא ״בקרה ולמידה — שיפור ביצועים״, ותוצריו: עדכון ייעוד, מדדים ואסטרטגיה, לקחים מהשנה הראשונה ותוכנית לשנה הבאה. המדידה שנעשתה ברבעון השלישי כנקודת ייחוס מאפשרת כעת לבחון את השיפור. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי ״מרכיבי תוכנית העבודה של השרשרת״, ממה נגזר ייעוד השרשרת (Mission), וממה נגזרים קודי ההתנהגות (Code of Conduct)?",o:["הייעוד — מחזון הארגון; קודי ההתנהגות — מערכי הארגון","הייעוד — מערכי הארגון; קודי ההתנהגות — מחזון הארגון","הייעוד — מהמדדים שנקבעו; קודי ההתנהגות — מדרישות הלקוחות","הייעוד — מתוכנית המכירות; קודי ההתנהגות — מתקנון הרכש"],c:0,e:"בשקף 9: ״הגדרת ייעוד השרשרת Mission כנגזרת מחזון הארגון״ ו״הגדרת קודי ההתנהגות Code of Conduct כנגזרת לערכי הארגון״. יתר המרכיבים: הבנת אסטרטגיית הארגון וסביבת הפעולה, הגדרת אסטרטגיית השרשרת (עלות/יעילות מול גמישות/אפקטיביות), הגדרת המדדים, והגדרת משימות ותוכנית עבודה. (שא-8, שקף 9)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהי השורה המודגשת בתחתית שקף ״מרכיבי תוכנית העבודה של השרשרת״?",o:["התאמת מבנה שרשרת האספקה (Structure) לחלוקת הסמכויות בין המנהלים (Power)","התאמת תקציב שרשרת האספקה (Cost) לתוכנית המכירות השנתית של הארגון (Sales)","התאמת תפיסת שרשרת האספקה (Supply) לציפיות ודרישות הלקוחות (Demand)","התאמת מלאי שרשרת האספקה (Inventory) לקיבולת המחסנים הקיימים של הארגון (Space)"],c:2,e:"בתחתית שקף 9 מודגש: ״התאמת תפיסת שרשרת האספקה — Supply — לציפיות ודרישות הלקוחות — Demand״. זה ממשיך את רעיון ״ההתאמה האסטרטגית״: ״יש לוודא התאמת תפיסת שרשרת האספקה לאסטרטגיה הארגונית!״ (שקף 10). (שא-8, שקפים 9–10)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי פירמידת ״התפתחות שרשרת האספקה״, מהו הסדר מהבסיס לפסגה?",o:["פנים-ארגונית ← חוץ-ארגונית ← רשת אספקה ← רשת גלוקאלית ← רזה (Lean) ← זמישה (Agile)","פנים-ארגונית ← רשת אספקה ← חוץ-ארגונית ← רזה (Lean) ← רשת גלוקאלית ← זמישה (Agile)","חוץ-ארגונית ← פנים-ארגונית ← רשת גלוקאלית ← רשת אספקה ← זמישה (Agile) ← רזה (Lean)","רזה (Lean) ← פנים-ארגונית ← חוץ-ארגונית ← זמישה (Agile) ← רשת אספקה ← רשת גלוקאלית"],c:0,e:"בשקף 12 הפירמידה עולה משרשרת אספקה פנים-ארגונית, דרך חוץ-ארגונית, רשת אספקה (Supply Network) ורשת אספקה גלוקאלית (GloCal), אל שרשרת רזה (Lean) ובפסגה שרשרת זמישה (Agile). לצדה: ״מעבר משרשרת יעילה לשרשרת אפקטיבית״ ו״משרשרת אספקה לשרשרת ביקוש״. (שא-8, שקף 12)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה משפט מלווה את פירמידת התפתחות שרשרת האספקה במצגת?",o:["מעבר מרשת גלוקאלית לשרשרת מקומית","מעבר משרשרת אפקטיבית לשרשרת יעילה","מעבר משרשרת ביקוש לשרשרת אספקה","מעבר משרשרת יעילה לשרשרת אפקטיבית"],c:3,e:"בשקף 12, לצד הפירמידה: ״מעבר משרשרת יעילה לשרשרת אפקטיבית״ — והכיוון הכללי במצגות הוא גם ״משרשרת אספקה לשרשרת ביקוש״, כלומר ממיקוד פנימה בעלות אל מיקוד החוצה בלקוח. שלושת המסיחים הופכים את הכיוון. (שא-8, שקף 12; שא-7, שקף 5)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"בסיכום הקורס חוזרות חמש מטרות שרשרת האספקה. איזו מהן מוגדרת כ״ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת״?",o:["יצירת ערך מוסף לארגון","Supply Chain Value","Supply Chain Profitability","Supply Chain Value Proposition"],c:2,e:"בשקף 13, חמש המטרות הן יצירת ערך מוסף לארגון, Supply Chain Value, Supply Chain Profitability — ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת — Supply Chain Value Proposition, ומעבר ממרכז עלות (Cost Center) למרכז רווח (Profit Center). (שא-8, שקף 13; שא-7, שקף 10)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"חברה מתלבטת היכן להקים את מחסני ההפצה שלה ואילו שווקים יתמוך כל מחסן, תוך תכנון המשכיות עסקית למקרה של השבתה. לאיזו קטגוריה של החלטות בשרשרת שייכת ההתלבטות?",o:["החלטות אסטרטגיות — מיקום אתרים, שווקים ו-BCP","החלטות תפעוליות — ליקוט, אריזה ומשלוח יומי ללקוחות","החלטות טקטיות — תזמון ספקים ושחרור הזמנות רכש","החלטות תמחיר — המחרת שירותי השרשרת ללקוח"],c:0,e:"בשקף 14, ״החלטות אסטרטגיות בשרשרת האספקה״ כוללות: מיקום יצרנים, ספקים ומחסנים — כולל BCP; Make or Buy; אילו אתרי ייצור ומחסנים ובאילו שווקים יתמכו; מיקום המלאי; שיטות השילוח וההפצה; ומערכת המידע לתמיכה בשרשרת. (שא-8, שקף 14)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"ברשת מסחר מקוון, שרשרת האספקה — מהירות המשלוח וזמינות המלאי — היא חלק מהצעת הערך ללקוח והמרכיב העיקרי בהוצאות. לפי ״תפיסת ההפעלה של שרשרת האספקה״, איזו אפשרות מתאימה לה?",o:["לבחון הוצאה למיקור חוץ, כמו כל מרכיב הוצאה משמעותי בארגון","לבחון את הצעת הערך ולנהל את השרשרת כמרכז הוצאה בלבד","לבחון צמצום השרשרת כך שתתמקד בפעילויות הקריטיות","לבחון הרחבת שירותים ולקוחות — מכירת שירותי השרשרת לארגונים אחרים"],c:3,e:"בשקף 15: כששרשרת האספקה <b>היא</b> הליבה הארגונית — היא קריטית לייעוד, חלק מהצעת הערך, המרכיב העיקרי בהוצאות ובעלת פוטנציאל למרכז רווח — ולכן בוחנים הרחבת השירותים והלקוחות: מכירת שירותי השרשרת. כשהיא <b>אינה</b> הליבה, היא נתפסת כמרכז הוצאה ובוחנים הוצאה למיקור חוץ ואת הצעת הערך. (שא-8, שקף 15)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מאפיין משותף לשני המצבים בשקף ״תפיסת ההפעלה״ — גם כששרשרת האספקה היא הליבה הארגונית וגם כשאינה?",o:["בשני המצבים יש לבחון את הוצאתה למיקור חוץ","בשני המצבים היא קריטית להבטחת ייעוד הארגון","בשני המצבים היא נתפסת כמרכז הוצאה בלבד","בשני המצבים היא חלק מהצעת הערך של הארגון"],c:1,e:"בשקף 15 שתי העמודות נפתחות באותו משפט: ״קריטית להבטחת ייעוד הארגון״. ההבדל ביניהן: כשהיא הליבה, היא חלק מהצעת הערך ופוטנציאל למרכז רווח; כשאינה הליבה, היא אינה חלק מהצעת הערך, נתפסת כמרכז הוצאה, ובוחנים הוצאה למיקור חוץ. (שא-8, שקף 15)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל שרשרת אספקה מקיים פעם בשבוע ישיבה שבה משתפים מידע ומשווים את התכנון לביצוע בפועל. איזה רכיב של ״מערכת ניהול, מדידה ובקרה״ זה?",o:["הבקרה הרבעונית — QBR ומעקב אחר המשימות הפתוחות","הדו״ח החודשי — סקירת המדדים העיקריים של השרשרת","תהליך הלמידה — סיכום ותחקיר (SAD)","הדו״ח השבועי — שיתוף מידע ותכנון מול ביצוע"],c:3,e:"בשקף 17: הגדרת עץ המדדים (BSC ו-SMART); Dash Board — לוח שעונים ארגוני עם נתונים זמינים ואמינים; דו״ח שבועי — שיתוף מידע ותכנון מול ביצוע; דו״ח חודשי — מדדים עיקריים; בקרה רבעונית QBR — בקרת KPI ומעקב משימות; תוכנית עבודה שנתית; ותהליכי למידה — סיכום ותחקיר (SAD). (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה מתבצע בבקרה הרבעונית — QBR (Quarterly Business Review) — לפי המצגת?",o:["סיכום ותחקיר של אירועים חריגים בלבד","שיתוף מידע ותכנון מול ביצוע שבועי","תיקוף הייעוד והגדרת התקציב השנתי","בקרת מדדי ה-KPI ומעקב אחר המשימות"],c:3,e:"בשקף 17, הבקרה הרבעונית (QBR) מוגדרת כבקרת מדדים — KPI — ומעקב משימות. שיתוף מידע ותכנון מול ביצוע הם בדו״ח השבועי, תיקוף הייעוד והתקציב — בתוכנית העבודה השנתית, והסיכום והתחקיר — בתהליכי הלמידה (SAD). (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי מערכת הניהול, המדידה והבקרה, באילו כלים משתמשים להגדרת עץ המדדים?",o:["גיליון ציונים מאוזן (Balanced Score Card) ומודל SMART","סקירה עסקית רבעונית (QBR) ותוכנית עבודה שנתית ותקציב מאושר","ניתוח תחקיר (SAD) ופארטו של הוצאות הארגון (Expense Pareto)","לוח שעונים ארגוני (Dash Board) ודו״ח חודשי של המדדים העיקריים"],c:0,e:"בשקף 17, תחת ״הגדרת עץ המדדים״: ״יישום גיליון ציונים מאוזן — Balanced Score Card — והגדרת מדדים לפי מודל SMART״. ה-Dash Board, הדו״חות, ה-QBR וה-SAD הם שלבים אחרים במערכת, שמשתמשים במדדים שהוגדרו. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה מאפיין את ה-Dash Board במערכת הניהול, המדידה והבקרה של שלמה?",o:["תחקיר לאחר אירוע חריג לצורך הפקת לקחים בצוות","ישיבה רבעונית של ההנהלה לבקרת המשימות הפתוחות","לוח שעונים ארגוני המבוסס על נתונים זמינים ואמינים","דו״ח שנתי מודפס המסכם את כל הביצועים של השנה"],c:2,e:"בשקף 17: ״בניית Dash Board — לוח שעונים ארגוני — נתונים זמינים ואמינים״. בלי נתונים זמינים ואמינים, לוח השעונים לא ישקף את מצב השרשרת בזמן אמת, והמדדים לא ישמשו לניהול. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם ״המודלים המתקדמים לשרשרת אספקה״ שבמצגת?",o:["שרשרת אספקה שיתופית (Shared Supply Chain)","שרשרת אספקה התנהגותית — כלכלה התנהגותית","שרשרת אספקה שטוחה (Flat Supply Chain)","שרשרת אספקה ריכוזית (Centralized)"],c:3,e:"בשקף 18 המודלים המתקדמים הם: מעבר מ״שרשרת אספקה״ ל״רשת אספקה״ לפי הגישה הגלוקאלית, Lean, Agile, שרשרת אספקה שיתופית (Shared), שרשרת אספקה שטוחה (Flat) ושרשרת אספקה התנהגותית. ״שרשרת ריכוזית״ אינה ברשימה. (שא-8, שקף 18)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"במפעל אחד עומדות מכונות בטלות ומצטבר מלאי איטי, ובמפעל אחר באותו אזור חסרה קיבולת ייצור והספקים מאחרים. איזו בעיה מתאר המצב, לפי פרק ״שרשרת אספקה שיתופית״?",o:["חוסר איזון בין ביקוש להיצע — תחזית שגויה בשני המפעלים גם יחד","שוט השור — הגברת התנודות בהזמנות ככל שמתרחקים מהלקוח הסופי","בזבוז המתנה — עובדים ומכונות שממתינים לחלקים מהתחנה הקודמת","חוסר איזון בניהול משאבים — עודף במקום אחד וחוסר במקום אחר"],c:3,e:"בשקף 23 מוגדרת ״הבעיה: חוסר איזון בניהול משאבים״ — מצד אחד עודף במשאבים (משאבים בטלים, עודפי מלאי איטי ומת, חוסר יעילות ועלויות גבוהות להפעלת משאבים), ומצד שני חוסר במשאבים (אי-עמידה באספקות, חוסרים בחומר, קיבולת ייצור חסרה ועלויות גבוהות לקידום אספקות). השרשרת השיתופית מחברת בין שני הצדדים. (שא-8, שקף 23)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהי ״כלכלה שיתופית״ (Shared Economy), כפי שהיא מוגדרת במצגת?",o:["מערכת המאפשרת שיתוף רכוש, מוצרים ושירותים, תוך ניצול יעיל של משאבים עודפים לטובת מי שחסר אותם","מערכת שבה המדינה מחלקת משאבים בין הארגונים לפי צורכיהם, בלי מנגנון מחירים ובלי תחרות ביניהם","מערכת שבה העובדים שותפים ברווחי הארגון, וכך מוגברים המוטיבציה והפריון שלהם בשרשרת האספקה","מערכת שבה ארגונים מאחדים את כל הרכש שלהם אצל ספק יחיד, כדי לקבל הנחת כמות משותפת גדולה יותר מהספק"],c:0,e:"בשקף 24: כלכלה שיתופית היא מערכת כלכלית המאפשרת שיתוף רכוש, מוצרים ושירותים בין אנשים וארגונים, תוך ניצול יעיל יותר של המשאבים העצמיים והעודף הקיים שלהם, כדי לתת מענה לצורך או לחוסר במשאבים אלה אצל אחרים. (שא-8, שקף 24)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מפעל משכיר בשעות הלילה קו ייצור שעומד בטל לחברה אחרת דרך פלטפורמה שיתופית, ובמקביל שוכר בעצמו שטח אחסון בעונת השיא במקום לבנות מחסן. איזו תרומה של השרשרת השיתופית משתקפת בכך?",o:["שיתוף מידע על אופי המשאבים — דירוג הספקים לפי איכות המלאי שלהם","הורדת מחירי המשאבים — מעבר מהוצאות קבועות למשתנות והגדלת נצילות","זמישות משאבים — ויתור על כל המשאבים העצמיים לטובת שכירות בלבד","קיצור ושיטוח השרשרת — ביטול כל המתווכים בין המפעל לבין הלקוחות"],c:1,e:"בשקף 26 תרומות השרשרת השיתופית: זמישות משאבים (הגדלת כמות המשאבים הזמינה וגמישות שימוש לטווח קצר), הורדת מחירי משאבים (מעבר מהוצאות קבועות למשתנות והגדלת נצילות), קיצור ושיטוח השרשרת (קשר ישיר בין בעלי המשאבים ללקוחות), ושיתוף מידע על אופי המשאבים (דירוג). השכרת קו בטל ושכירת מחסן במקום בנייה הן הגדלת נצילות ומעבר מקבועות למשתנות. (שא-8, שקף 26)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"כיצד תומכת השרשרת השיתופית בשרשרת אספקה רזה (Lean), לפי המצגת?",o:["ביטול הצורך בתכנון החומר, כי המשאבים זמינים תמיד בפלטפורמה","הגדלת מלאי הביטחון של הארגון באמצעות מלאים של ארגונים אחרים בשוק","עלות נמוכה של משאבים שיתופיים, ויצירת הכנסה ממשאבי הארגון הבטלים","ניצול מלאים שיתופיים זמינים כדי לשפר את זריזות האספקות ללקוחות בשעת שיא"],c:2,e:"בשקף 27: לשרשרת היעילה — ניהול רזה (Lean) — השרשרת השיתופית תורמת עלות נמוכה של המשאבים השיתופיים הזמינים בשוק, ושיפור יעילות ונצילות של משאבי הארגון הבטלים תוך יצירת הכנסה לשרשרת. ניצול מלאים שיתופיים לשיפור גמישות וזריזות באספקות הוא התרומה לשרשרת התגובתית — הזמישה (Agile). (שא-8, שקף 27)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> מופיע בין רכיבי ״שרשרת האספקה השטוחה״ במצגת?",o:["איחוד מרכזי הפצה","משלוחים קטנים ותכופים","הגדלת מגוון המוצרים","דחיינות"],c:2,e:"בשקף 31, תחת ״מניהול שרשרת אספקה לניהול שרשרת הביקוש״, מופיעים: שיפור אמינות התחזית, הבטחת זמינות המלאי, קיצור זמני אספקה מספקים, צמצום מגוון המוצרים, דחיינות, איחוד מרכזי הפצה, משלוחים קטנים ותכופים, קיצור תהליכים לוגיסטיים ומערכת מידע לשליטה ובקרה. המגוון מצומצם — לא מוגדל. (שא-8, שקף 31)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי שקף ״שרשרת אספקה שטוחה — מה נשתנה?״, מה איפשר את המעבר לשרשרת שטוחה?",o:["הגדלת כוח האדם במחסנים ובמרכזי ההפצה של הארגונים בכל רחבי העולם","מעבר מוחלט לספקים מקומיים וביטול היבוא מחו״ל","התפתחות טכנולוגית — מהירות תקשורת, זמינות מידע ויכולות עיבוד","הגדלת המלאי בכל חוליה בשרשרת כדי לקצר את זמני האספקה ללקוחות"],c:2,e:"בשקף 30 שני משושים: ״התפתחות טכנולוגית: מהירות התקשורת, זמינות המידע ויכולות עיבוד״, שהובילה ל״פישוט תהליכים, הקטנת מלאים, חיסכון בעלויות וקיצור זמני אספקה — שרשרת אספקה זמישה״. הגדלת מלאי היא ההפך מהקטנת המלאים. (שא-8, שקף 30)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"במה שונה הכלכלה ההתנהגותית מהכלכלה הקלאסית, לפי המצגת?",o:["היא מניחה שהפרטים רציונליים לחלוטין ובעלי מידע מושלם ומיידי על השוק","היא מצביעה על מגבלות והטיות בקבלת החלטות בפועל, בניגוד להנחת הרציונליות המלאה","היא מחליפה את מדדי הביצוע בשרשרת במדדים של שביעות רצון העובדים בלבד","היא עוסקת רק בהחלטות של ארגונים גדולים, ולא בהחלטות של פרטים או של צרכנים"],c:1,e:"בשקף 32: הכלכלה ההתנהגותית שואבת מהפסיכולוגיה ומתורת המשחקים בהקשר של קבלת החלטות כלכליות בתנאי אי-ודאות. בעוד הכלכלה הקלאסית מניחה שפרטים משיאים את תועלתם ומקבלים החלטות באופן רציונלי ועם מידע מושלם ומיידי, הכלכלה ההתנהגותית מצביעה על מגבלות, הטיות ובעיות אחרות בקבלת החלטות בפועל (דן אריאלי). (שא-8, שקף 32)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל מסרב למכור מלאי ישן במחיר נמוך מעלותו, אף שהמלאי מתיישן ותופס מקום, כי ״אסור לממש הפסד״. איזו הטיה בקבלת החלטות מהמצגת מתוארת?",o:["החלטות הרוב","שנאת הפסד","מוצר השוואתי","צדק חברתי"],c:1,e:"בשקף 33 מופיעות הטיות בקבלת החלטות בשרשרת: הבטחת אספקות או מלאי, מבצעי הנחות — 1+1, שנאת הפסד, מוצר השוואתי, החלטות הרוב וצדק חברתי. סירוב לממש הפסד ידוע, גם כשהוא משתלם, הוא שנאת הפסד. (שא-8, שקף 33)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"קניין מזמין כמות כפולה מהנדרש כי הספק הציע מבצע ״1+1״, והמלאי העודף נשאר במחסן חודשים. לאיזו הטיה מתאים המקרה?",o:["הבטחת אספקות או מלאי","מבצעי הנחות — 1+1","מוצר השוואתי","החלטות הרוב"],c:1,e:"״מבצעי הנחות — 1+1״ היא אחת ההטיות בשקף 33: המבצע מושך לרכוש יותר ממה שנדרש, גם כשהחיסכון הנראה לעין מתקזז בעלויות האחזקה ובסיכון ההתיישנות של המלאי העודף. (שא-8, שקף 33)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהו הסדר של ״מחזור חיי ניהול הספקים בארגון״, ומי אחראי על כל שלב?",o:["הערכה תקופתית (הרכש) ← בחירה (ניהול איכות) ← ניהול שוטף ואירועים חריגים (שרשרת האספקה)","בחירה (הרכש) ← ניהול שוטף (שרשרת האספקה) ← הערכה תקופתית ואירועים חריגים (ניהול איכות)","ניהול שוטף (הרכש) ← בחירה (שרשרת האספקה) ← הערכה תקופתית ואירועים חריגים (הכספים)","בחירה (ניהול איכות) ← ניהול שוטף (הרכש) ← הערכה תקופתית ואירועים חריגים (שרשרת האספקה)"],c:1,e:"בשקף 35 מחזור החיים: בחירת ספקים ← ניהול שוטף ← הערכה תקופתית ← אירועים חריגים; ומתחת לכל שלב — הגורם האחראי: הרכש, שרשרת האספקה, ניהול איכות וניהול איכות. זו התשובה לשאלה בשקף הבא, ״מי בתפעול מנהל את הספקים?״. (שא-8, שקפים 35–36)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> אחד מ״המודלים המתקדמים לניהול ספקים״ בשקף המסכם של שלמה?",o:["״להפוך אנרגיית חיכוך לאנרגיית תנועה״","״שתי חברות — קבוצה אחת״","״הלקוח תמיד צודק״","״כמה סוכר בקפה?״"],c:2,e:"בשקף 34 המודלים הם: ״שחקו מטקות ולא טניס״, ״המראה האחורית״, ״להפוך אנרגיית חיכוך לאנרגיית תנועה״, ״הפינה בחדר העגול״, GloCal — Think Global Act Local, ״כמה סוכר בקפה?״, ״שתי חברות — קבוצה אחת״, ״69״, ״לטפס על מגדל התצפית״, שרשרת האספקה השטוחה ושרשרת אספקה זמישה (Agile). ״הלקוח תמיד צודק״ אינו ביניהם. (שא-8, שקף 34)"}
]);

BANK.push.apply(BANK,[
/* הרצאה 14.7 — ד"ר ניצן סוויד, מצגת 1: ניהול האינטגרציה בשרשרת האספקה (מקור: תמלול ההקלטה בלבד) */
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"חנות קמעונאית חוזה ביקוש של 1,000 יחידות ומזמינה מהמפיץ 1,100 'ליתר ביטחון'; המפיץ מזמין מהיצרן 1,210; היצרן מזמין מספק חומרי הגלם 1,331. איזו תופעה מתוארת כאן, ומה קורה לסטייה ככל שמתרחקים מהלקוח הסופי?",o:["ניהול דיפרנציאלי של מלאי — כל חוליה מסווגת את הפריט לפי פארטו, והסטייה מתאזנת ככל שמתרחקים מהלקוח הסופי","שיטת המשיכה — ביקוש הלקוח הסופי 'מושך' את השרשרת, ולכן הסטייה נשארת קבועה ואינה גדלה לאורך כל החוליות שבמעלה השרשרת","שוט השור (Bullwhip) — כל חוליה מוסיפה מרווח משלה, והסטייה בין הביקוש האמיתי להזמנות גדלה באופן מעריכי במעלה השרשרת","אי-התאמת מלאי (פחת) — פער בין הרישום הממוחשב למציאות, שמתגלה רק בספירת סוף השנה אצל היצרן ואינו תלוי כלל במרחק מהלקוח הסופי"],c:2,e:"המרצה תיאר 'טלפון שבור' בשרשרת: כל אחד מודיע לבא אחריו כמה הוא צריך ומוסיף כעשרה אחוזים, והטעות 'הולכת וגדלה אקספוננציאלית' — זהו אפקט שוט השור (Bullwhip), שבסופו רשתות השיווק מוצאות פערים גדולים בין התחזית לנתונים בפועל. שיטת המשיכה היא דווקא הגישה שבה הפעילות נגזרת מהלקוח הסופי ואינה מתארת הגדלת סטיות. (הרצאה 14.7, דקה ~58)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"נניח שאוסם מחוברת במערכת ממוחשבת לקופות של כל רשתות השיווק, ורואה שקצב ה'צפצופים' של במבה בקופות ירד מכ-1,000 בשעה לכ-300. לפי ההרצאה, מה היתרון המרכזי של חיבור כזה?",o:["אוסם מזהה מיד את השינוי בביקוש הלקוח הסופי ומתאימה את קצב הייצור, במקום לגלות זאת באיחור דרך הזמנות מעוותות של החוליות שבדרך","אוסם יכולה לחייב את רשתות השיווק להזמין לפי הסכם מסגרת קבוע, ובכך לבטל לחלוטין את אי-הוודאות בביקוש ואת הצורך בתחזיות בכלל לאורך השנה","אוסם יכולה להגדיל את ניצולת המכונות ל-100% ולייצר למלאי, מתוך ידיעה שהביקוש יחזור לרמתו הקודמת בתוך זמן קצר, כפי שקרה בעבר","אוסם חוסכת את עלויות החזקת המלאי בסניפים, כי האחריות על המלאי עוברת לרשתות השיווק ברגע שהמוצר נסרק בקופה ומדווח למערכת"],c:0,e:"שיתוף מידע בין חוליות השרשרת מאפשר להתאים את קצב העבודה של כל השרשרת לדרישות הלקוח הסופי — וזו הדרך שבה האינטגרציה מצמצמת (אם כי לא מבטלת לגמרי) את שוט השור. בדוגמה, ירידה פתאומית (למשל בגלל מוצר מתחרה של עלית) מובילה מיד לישיבת הנהלה ולצמצום קצב הייצור. הסכם מסגרת קבוע הוא דווקא שיטת הדחיפה שמבוססת על תחזית, וייצור למלאי הוא בדיוק הטעות שהמרצה הזהיר מפניה. (הרצאה 14.7, דקה ~59)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"חברת אגד צריכה שבכל רגע יהיו 100 אוטובוסים בנסיעה על קו מסוים. זמינות האוטובוסים היא 80% בלבד (היתר בטיפולים ובתקלות), וכל אוטובוס עולה כמיליון ש״ח. מה המשמעות לפי ההרצאה?",o:["די ב-100 אוטובוסים בדיוק — הזמינות משפיעה רק על תקציב האחזקה השוטף ולא על מספר הכלים שיש לרכוש","נדרשים פחות מ-100 אוטובוסים, כי בכל רגע נתון רק 80% מהקו פעיל בפועל, ואת היתרה אפשר לחסוך ולא לרכוש","גודל הצי ייקבע לפי ה-MTBF של האוטובוסים בלבד, ואילו הזמינות רלוונטית רק לתכנון משמרות הנהגים בקו","החברה תיאלץ להחזיק צי גדול מ-100 — ככל שהזמינות נמוכה יותר נדרשים יותר אוטובוסים, בעלות של מיליוני ש״ח"],c:3,e:"זמינות היא אחוז הזמן שבו הציוד זמין לשימוש. המרצה הסביר שאם אוטובוס באגד אינו במצב נסיעה חלק מהזמן (תקלות, טיפולים, נהג שמאחר), 'אני צריך להחזיק יותר אוטובוסים ככל שהזמינות נמוכה יותר' — למשל עוד 30 אוטובוסים = 30 מיליון ש״ח. הזמינות משפיעה ישירות על גודל הצי הנדרש, לא רק על תקציב האחזקה, ו-MTBF הוא מדד אמינות ולא הקובע של גודל הצי. (הרצאה 14.7, דקה ~28)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"על רכב א' נאמר: 'הוא מוכן לנסיעה 95% מהזמן'. על רכב ב' נאמר: 'ההסתברות שיסיים נסיעה של ארבע שעות לאילת בלי תקלה היא 90%'. אילו מדדים מתוארים כאן, בהתאמה?",o:["רכב א' — אמינות (אחוז מהזמן ללא תקלה); רכב ב' — זמינות (ההסתברות שהרכב יהיה פנוי לנסיעה)","רכב א' — זמינות (אחוז מהזמן שהציוד זמין); רכב ב' — אמינות (הסתברות לסיים משימה במשך זמן נתון)","רכב א' — MTBF (הזמן הממוצע התקין); רכב ב' — זמינות (ההסתברות שהמשימה תסתיים בזמן שנקבע)","שני התיאורים הם מדדי אמינות — ההבדל ביניהם הוא רק שהראשון מבוטא באחוזים והשני בהסתברות"],c:1,e:"המרצה הגדיר זמינות כ'אחוז מהזמן שהציוד זמין לנסיעה' (דוגמת האוטובוס באגד), ואמינות כ'ההסתברות שציוד יצליח לסיים משימה בת X שעות בהצלחה' — ואף נתן את דוגמת הנסיעה לאילת בארבע שעות. החלפת ההגדרות זו בזו היא הטעות הנפוצה; MTBF הוא מדד לאמינות (זמן ממוצע בין תקלות) ולא הגדרת הזמינות. (הרצאה 14.7, דקה ~28-31)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"יחידה שוקלת שני גנרטורים זהים במחירם: לגנרטור א' MTBF של 400 שעות, ולגנרטור ב' MTBF של 1,500 שעות. מה עדיף לפי ההרצאה, ומדוע?",o:["גנרטור ב' — MTBF הוא הזמן הממוצע בין תקלה לתקלה, ורוצים שיהיה גבוה ככל האפשר","גנרטור א' — MTBF נמוך פירושו שהתקלות מתוקנות מהר יותר והציוד חוזר לעבודה בזמן קצר","גנרטור א' — פרקי זמן קצרים בין טיפולים מאפשרים ביקורת צמודה יותר ומונעים כשל פתאומי","אין הבדל — MTBF מודד את זמינות הציוד ולא את אמינותו, ולכן כלל אינו רלוונטי לבחירה"],c:0,e:"MTBF — Mean Time Between Failures — הוא 'המדד המרכזי של אמינות': הזמן הממוצע בין תקלה לתקלה. ככל שהציוד עובד זמן רב יותר בין תקלות הוא אמין יותר, ולכן רוצים MTBF גבוה — והמרצה הדגיש ש'הרבה טועים בזה'. MTBF אינו מודד את מהירות התיקון ואינו מדד זמינות, ולכן שני הנימוקים בעד גנרטור א' שגויים. (הרצאה 14.7, דקה ~31-32)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"ההסתברות שמנוע בודד של מטוס יתפקד לאורך כל הטיסה לארה״ב היא כ-97%. המרצה טען שאיש לא היה עולה על מטוס חד-מנועי כזה — ובכל זאת אנשים טסים בבואינג. כיצד הסביר זאת?",o:["חברות התעופה מבצעות ביקורות תכופות לפני כל טיסה, וכך מעלות את אמינותו של כל מנוע בודד מ-97% ל-100% מלאים","ה-97% מתייחסים לזמינות המנוע ולא לאמינותו, ולכן אין מדובר בסיכון לנפילה אלא רק בעיכובים ביציאה לטיסה","אמינות מטוס עם כמה מנועים היא הממוצע של אמינויות המנועים, כלומר עדיין 97% — סיכון שהציבור ורשויות התעופה למדו לקבל לאורך השנים","יש כמה מנועים במקביל; כדי שהמטוס ייפול כולם צריכים להיכשל בו-זמנית — הסתברות נמוכה מאוד — ולכן אמינות המערכת קרובה ל-100%"],c:3,e:"97% פירושו שמכל 100 טיסות שלוש נופלות — חברה שמטיסה כ-100 טיסות ביום הייתה קורסת. המרצה הסביר שנלמד לחשב 'אמינות במקביל': ההסתברות שכל המנועים ייכשלו באותו רגע נמוכה מאוד, ולכן האמינות 'מאוד גבוהה — לא מאה, אבל 99.9...'. את השארית פותרים בביקורות ואחזקה. אמינות במקביל אינה ממוצע של הרכיבים — היא גבוהה מכל רכיב בודד — ואף ביקורת אינה מביאה מנוע בודד ל-100%. (הרצאה 14.7, דקה ~33-34)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"מוסך מחזיק במלאי מנועים ותיבות הילוכים (יקרים ומעטים) וגם אלפי סוגי ברגים (חצי סנט לבורג). איך לפי ההרצאה צריך לנהל את שני סוגי הפריטים?",o:["במדיניות אחידה לכל המק״טים — חישוב EOQ זהה לכל פריט, כי המודל הבסיסי אינו מבחין בין פריטים יקרים לזולים","בניהול דיפרנציאלי על בסיס פארטו — תשומת הלב לפריטים היקרים המעטים, וברגים זולים מחזיקים בכמויות גדולות","להחזיק מלאי גדול של מנועים כי הם קריטיים, ומלאי מינימלי של ברגים כי הם תופסים מספר גדול של מק״טים במחסן","לנהל בקפדנות דווקא את הברגים, כי הם מהווים כ-80% מהמק״טים ולכן גם את רוב עלות החזקת המלאי במוסך"],c:1,e:"המרצה הסביר שרוב הכסף מגיע ממספר קטן של מק״טים (פארטו): 'יותר קל להחזיק הרבה ברגים מאשר הרבה מנועים' בגלל עלויות ההחזקה, ולכן 'מתייחסים לזה בצורה שונה' — ניהול דיפרנציאלי של מלאי. הברגים הם רוב המק״טים אך חלק זניח מהערך, ולכן ההשקעה הניהולית צריכה להיות במנועים ובתיבות ההילוכים, לא במדיניות אחידה ולא בברגים. (הרצאה 14.7, דקה ~27)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בית חולים ורשת שיווק פרטית מנהלים שניהם מלאי. לפי ההרצאה, במה תתבטא ההבחנה העיקרית בגישה למלאי בין שני הארגונים?",o:["הרשת הפרטית תחזיק מלאי ביטחון גדול יותר, כי הפסד מכירה עולה לה יותר מאשר לבית חולים הממומן מתקציב ציבורי קבוע ומובטח","שני הארגונים ינהלו את המלאי באותה שיטה (EOQ), וההבדל יהיה רק בגודל ההזמנות בגלל הבדלי היקף הפעילות ביניהם לאורך השנה","בית החולים, כארגון בעל אופי כוננותי, יחזיק מלאי חירום גדול גם במחיר עלויות; הרשת הפרטית תצמצם מלאים כדי לחסוך","בית החולים יצמצם מלאים כי תרופות מתקלקלות, ואילו הרשת תחזיק מלאי ביטחון גדול של מוצרי חלב כדי לא לאבד לקוחות לטובת המתחרים"],c:2,e:"המרצה הדגיש שארגונים בעלי אופי כוננותי — צה״ל, בתי חולים — 'עובדים מאוד חזק על מלאי כוננות, מלאי חירום', ולכן ניהול המלאי אצלם 'שונה לגמרי' מארגון עסקי-פרטי, שינסה לצמצם מלאים כדי לחסוך בעלויות. רמי לוי, למשל, אינו מחזיק מלאי ביטחון של חלב — 'מה שנגמר נגמר' — ואילו בצה״ל מלאי החירום גדול בהרבה מהצריכה השוטפת. (הרצאה 14.7, דקה ~21-22)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המכולת ליד הבית מנהלת מלאי מצוין בשיטה 'מה שנמכר אתמול יימכר מחר' (200 חלב אתמול, 203 היום). מדוע לפי המרצה השיטה הזו מתאימה למכולת אך לא לצה״ל?",o:["במכולת הביקוש קבוע ולכן השיטה הנאיבית מספיקה; צה״ל פועל בחוסר ודאות מוחלט, הביקוש אצלו אינו קבוע ונדרשות שיטות חיזוי של ממש","צה״ל מחזיק הרבה יותר מק״טים, ולכן אין לו כוח אדם לעדכן תחזית נאיבית יומית לכל פריט ופריט כפי שעושה בעל המכולת מדי בוקר","השיטה הנאיבית דורשת אקסל ומחשבון שיש במכולת, ואילו בצה״ל התחזיות נעשות בשיטת הדחיפה על פי הסכמי מסגרת רב-שנתיים עם ספקים קבועים","במכולת קיימת מגמת עלייה קבועה בביקוש, ואילו בצה״ל הביקוש עונתי, ולכן נדרש שם מודל עונתיות מורכב ולא שיטה נאיבית פשוטה"],c:0,e:"המרצה כינה זאת 'שיטה נאיבית' — 'מה שאתמול יהיה מחר' — שעובדת כשהביקוש קבוע (חלב, גבינה צהובה) ולא דורשת חישוב. אבל בצה״ל 'זה לא ביקוש קבוע' — הוא נמצא בעולם של חוסר ודאות מוחלט, ולכן חייבים לחזות בצורה טובה ומדויקת. עונתיות, מספר המק״טים או הצורך במחשבון אינם הנימוק שהמרצה נתן. (הרצאה 14.7, דקה ~19)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"יצרן חותם עם ספק הסכם מסגרת: '12,000 יחידות בשנה — תדחוף לי 1,000 כל חודש', על בסיס תחזית. ברשת אחרת, לעומת זאת, כל קנייה של במבה בקופה היא שמפעילה את השרשרת אחורה. איך מכנה ההרצאה את שתי הגישות?",o:["הראשונה — שיטת המשיכה (הספק מושך הזמנות קבועות); השנייה — שיטת הדחיפה (הלקוח דוחף את הביקוש לתוך השרשרת)","הראשונה — VMI (הספק מנהל את המלאי אצל הלקוח); השנייה — MRP (תכנון דרישות החומרים על פי נתוני הקופות ברשת)","הראשונה — אינטגרציה בין-ארגונית; השנייה — אינטגרציה פנים-ארגונית, שבה הקופה והמחסן מדווחים לאותו מחשב מרכזי","הראשונה — שיטת הדחיפה (דוחפים לפי הסכם שנסגר מראש על פי תחזית); השנייה — שיטת המשיכה (הפעילות נגזרת מהלקוח הסופי)"],c:3,e:"שיטת המשיכה — 'שיטה חדשה יחסית' — אומרת שכל פעילות השרשרת נגזרת ממה שהלקוח הסופי (הילדה שרוצה במבה) מבקש: היא קובעת אם השרשרת מהירה או איטית. בשיטת הדחיפה החלקים האחוריים של השרשרת דוחפים לפי הסכם שנסגר מראש על פי חיזוי — ומה שקורה עם חיזוי הוא שהוא 'לא מתממש'. האפשרות הראשונה הופכת את ההגדרות זו בזו. (הרצאה 14.7, דקה ~39-40)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בספירת המלאי בסוף השנה מתגלה שבמחסן יש 40 יחידות פחות ממה שרשום במחשב, ואיש אינו יודע להסביר את הפער. איזה מושג מההרצאה מתאר זאת, ומה גורם לו בדרך כלל?",o:["קלקול — מוצרים שנפלו, נשברו או פג תוקפם, ולכן נמחקו מהרישום הממוחשב מבלי שדווח על כך למנהל המחסן","אי-התאמת מלאי (פחת) — פער בין ה'תיאוריה הממוחשבת' למציאות שמתגלה רק בספירה, בגלל גניבות או ניפוקים שלא נרשמו","מלאי ביטחון שנוצל — היחידות החסרות נמשכו מן הרזרבה בתקופת ביקוש חריג וטרם הושלמו על ידי הספק","שוט השור — ההזמנות מהספק היו גדולות מן הצריכה בפועל, וההפרש נרשם במחשב אך מעולם לא הגיע פיזית למחסן"],c:1,e:"המרצה הבחין בין קלקולים (מוצרים שנופלים ונשברים) לבין 'פחת' — 'זה לא אותו דבר' — אי-התאמה בין הרישום הממוחשב למציאות, שמתגלה רק כשבאים לספור בסוף השנה, 'או בגלל גניבות או בגלל שלא העבירו בפרוצדורות'. שניהם חלק מעלויות החזקת המלאי, אך רק הפחת הוא פער בלתי מוסבר בין הרישום למציאות; קלקול הוא נזק פיזי ידוע. (הרצאה 14.7, דקה ~23-24)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"מנכ״ל מפעל לחלקי מתכת בדטרויט (מהספר 'המטרה') הציב יעד של ניצול מרבי של המכונות, קיבל מהספק הנחה של 10% על רכישה בכמות גדולה — ומצא את עצמו עם מלאי של עשרה חודשים. מה הלקח שהמרצה הפיק מהסיפור?",o:["הבעיה הייתה בספק שסיפק כמות גדולה מדי; יש לעבור להסכמי מסגרת חודשיים כדי לשלוט בקצב האספקה ולמנוע הצטברות","ניצול מכונות של 100% הוא יעד נכון, אך היה צריך לאזן אותו בהגדלת מלאי הביטחון של מוצרים מוגמרים למכירה","צריך לייצר את מה שנדרש ולא כמה שיותר — עדיף שעובד ישתה קפה חלק מהזמן מאשר להחזיק מלאי סתם, כי מלאי עולה כסף","המנכ״ל היה חרוץ אך לא ידע לנהל, ולכן הפתרון היה להחליף אותו במנהל מנוסה ולא לשנות את מטרת המפעל"],c:2,e:"המרצה סיפר שלפני 40-50 שנה המטרה הייתה לנצל את הציוד ככל האפשר — 'אם המכונה עובדת 100% מהזמן אתה מלך' — אבל 'לא בטוח שהלקוחות צריכים את זה'. היועץ אמר למנכ״ל שהבעיה היא המטרה שהגדיר; הלקח: 'לא תמיד צריך לייצר הרבה, צריך לייצר כמה שצריך', ועדיף עובד ששותה קפה מאשר מלאי מיותר. ההנחה מהספק הייתה פיתוי שהוביל למלאי עצום, לא הסיבה השורשית. (הרצאה 14.7, דקה ~62-63)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"זרקו שתי קוביות פעמיים, ובשתי הפעמים התקבל 6-6. מה ההסתברות לקבל 6-6 גם בזריקה השלישית, לפי מה שהסביר המרצה?",o:["כמו בכל זריקה — שישית כפול שישית; להסתברות 'אין זיכרון' וכל זריקה מתחילה מחדש","נמוכה מהרגיל, כי לאורך זמן הסטטיסטיקה 'מתיישרת' וצירוף שכבר חזר פעמיים צפוי להתאזן","גבוהה מהרגיל, כי הקוביות נמצאות 'ברצף' ותוצאות קודמות מעידות על נטייה של הקובייה","שישית בלבד — אחרי שני צירופים זהים די בכך שקובייה אחת תתאים לתוצאה הקודמת שהתקבלה"],c:0,e:"המרצה הסביר את 'תכונת חוסר הזיכרון בסטטיסטיקה': ההסתברות 'חוזרת מההתחלה', מוחקים את העבר ומתחילים משחק חדש — תמיד אותה הסתברות (1/6 לכל קובייה, שישית כפול שישית לצירוף). הוא הזהיר במפורש שלא לחשוב שאם שחקן כדורסל פוגע באחוזים קבועים ופתאום יש רצף, 'הסטטיסטיקה מתיישרת' — זה לא חייב לקרות. (הרצאה 14.7, דקה ~13-14)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"לפי ההבחנה שהציג המרצה בין חיזוי להימור, איזו מהפעולות הבאות היא חיזוי?",o:["מילוי טופס לוטו לפי תאריכי הלידה של הילדים, שכן למספרים יש משמעות אישית עבור הממלא","הימור ברולטה בקזינו לאחר מעקב ארוך אחר המספרים שיצאו בסיבובים הקודמים באותו ערב","בחירת מספרים מפוזרים בלוטו במקום 1-2-3-4-5-6-7, משום שצירוף רציף כזה מעולם לא יצא","מילוי טופס טוטו על משחקי המונדיאל בידי מי שמכיר את הקבוצות ומפעיל עליהן שיקול דעת"],c:3,e:"המרצה הסביר שרולטה ולוטו הם הימור — למספרים שבוחרים אין משמעות אמיתית, וההסתברות זהה לכל צירוף (כ-1 ל-17 מיליון, גם לרצף 1-7 וגם למספרים מפוזרים). לעומת זאת בטוטו על המונדיאל 'מי שממלא מכיר את הקבוצות ומפעיל שיקול דעת' — 'ברגע שיש קצת יותר מניחוש פראי, זה הופך להיות חיזוי'. (הרצאה 14.7, דקה ~12-17)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המרצה הסביר שאינטגרציה פנים-ארגונית עובדת גם כשמנהל המחסן ומנהל הרכב מסוכסכים ואינם מדברים זה עם זה. מדוע?",o:["כי המנכ״ל מקבל את הדיווחים משני המנהלים ומתווך ביניהם, ולכן הסכסוך ביניהם אינו פוגע בזרימת המידע בארגון","כי הדיווח נעשה במערכת המחשוב וכולם רואים את המידע בלי תלות ביחסים אישיים — אין צורך ב'גיבוש חברתי'","כי בשלב האינטגרציה הפנים-ארגונית כל מחלקה נשארת 'ממלכה' עצמאית, ורק המידע הכספי משותף לכל המחלקות","כי מערכת ה-ERP מחליפה את המנהלים בתהליך אוטומטי של הזמנות, כך שאין עוד צורך בהחלטות אנושיות ביניהם"],c:1,e:"אינטגרציה = חיבור, שילוב. המרצה הדגיש ששיתוף הפעולה בשרשרת 'זה לא עניין של גיבוש חברתי' — אי אפשר להכריח שני אנשים להיות חברים. האינטגרציה נוצרת בזכות מהפכת המידע: 'הם יכולים להיות מסוכסכים, זה לא משנה, כי במחשב הם צריכים לדווח' — וכולם יודעים הכל. הפתרון הוא מערכת המידע, לא תיווך של המנכ״ל ולא ביטול המנהלים. (הרצאה 14.7, דקה ~43-52)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"כיצד הגדיר המרצה 'שרשרת אספקה', ומה עושה כל ארגון לאורכה?",o:["רצף הסכמי מסגרת בין יצרן לספקיו, שבו כל ארגון מתחייב לכמות שנתית קבועה ודוחף אותה במנות חודשיות","מערכת ממוחשבת אחת (ERP) המחברת ספקים, ארגון ולקוחות, שבה כל ארגון מדווח על המלאי שברשותו","זרימת חומרים מספק חומרי הגלם ועד הלקוח הסופי שבקצה, כשכל ארגון בדרך מבצע 'המרה' ומוסיף ערך","אוסף המחלקות בתוך הארגון — רכש, ייצור, מכירות וכספים — שכל אחת מהן אחראית לחוליה אחת בתהליך"],c:2,e:"'שרשרת אספקה זו בעצם זרימת החומרים מספק חומרי הגלם ועד הלקוח הסופי שנמצא בקצה' — דוגמת המסטיק שעבר 'הרבה תלאות' בין ארגונים רבים, שכל אחד מהם מבצע 'פעולת המרה' וחייב להוסיף ערך, אחרת יידחק החוצה. ERP והסכמי מסגרת הם כלים או שיטות שפועלים בתוך השרשרת, לא הגדרתה; המחלקות הפנימיות הן העולם הפנימי של כל ארגון בשרשרת. (הרצאה 14.7, דקה ~34-35)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המרצה המחיש את מושג ה'המרה' באמצעות האוניברסיטה. מהי המרה בהקשר של שרשרת האספקה?",o:["לקיחת חומרי גלם, ציוד וכוח אדם והפיכתם למוצר — כמו שהאוניברסיטה לוקחת מרצה וכיתה והופכת אותם לידע","העברת הבעלות על החומר מספק אחד לספק הבא בשרשרת, כפי שהאוניברסיטה 'מעבירה' סטודנטים משנה לשנה","תרגום תחזית הביקוש להזמנת רכש — כמו שהאוניברסיטה ממירה את מספר הנרשמים למספר הכיתות הנדרש","מעבר משיטת הדחיפה לשיטת המשיכה — כמו שהאוניברסיטה פותחת קורסים לפי דרישת הסטודנטים ולא לפי תכנון"],c:0,e:"'אנחנו לוקחים חומרי גלם, ציוד וכוח אדם והופכים את זה למוצר' — זו ההמרה, וכל ארגון בשרשרת מבצע אותה. האוניברסיטה 'לוקחת מרצה, כיתה עם מזגנים... והופכת את זה לידע', כמו אפיית עוגה מחומרים. המרצה הוסיף שיש ארגונים שיודעים לבצע המרה טוב יותר מאחרים ולכן מצליחים יותר. העברת בעלות או תרגום תחזית להזמנה אינם המרה. (הרצאה 14.7, דקה ~35-36)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"לפי ההרצאה, מאילו שלושה מרכיבים מורכב ניהול שרשרת האספקה, ומה מתקבל כשמחברים את שלושתם למערכת אחת?",o:["חיזוי, ניהול מלאי ושינוע; חיבורם יחד נותן MRP — תכנון דרישות החומרים של הארגון","דחיפה, משיכה ואינטגרציה; חיבורם יחד נותן VMI — מלאי המנוהל על ידי הספק דרך רשת האינטרנט","זמינות, אמינות ו-MTBF; חיבורם יחד נותן את מדד האמינות במקביל של המערכת כולה","ההיצע (ספקים — SRM), הפנים-ארגוני (ISCM) והביקוש (לקוחות — CRM); חיבורם יחד נותן ERP"],c:3,e:"המרצה תיאר את ניהול השרשרת כמורכב משלושה מרכיבים — ההיצע (ניהול הספקים, SRM), הפנים-ארגוני (Internal SCM) והביקוש (CRM — מחירים, תלונות, אשראי, מבצעים של הלקוחות). 'בואו נחבר את כל השלושה ביחד, נקבל ERP — Enterprise Resource Planning' (למשל SAP), כי הגיעו למסקנה ש'אי אפשר לעבוד עם כמה מערכות'. MRP הוא השלב הקודם שהתמקד בדרישות החומר בלבד. (הרצאה 14.7, דקה ~54-56)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"ספק של חנות ספרים רואה במערכת שמלאי העותקים של ספר מסוים ירד מ-10 ל-5, ושולח עוד 10 בלי שהחנות הזמינה. איזה מושג מההרצאה מתאר זאת, ומה איפשר אותו?",o:["MRP — תכנון דרישות החומרים בתוך הארגון; הדבר התאפשר בזכות רשת תקשורת המחשבים הפנימית שקדמה לאינטרנט בשנות ה-80","VMI — הספק מנהל את מלאי הלקוח על סמך מידע משותף; הדבר התאפשר בזכות האינטרנט, שהכניס את הספק לתוך המידע","שיטת הדחיפה — הספק דוחף לפי הסכם מסגרת; הדבר התאפשר בזכות תחזית שנתית שסוכמה מראש בין הספק לבין החנות בתחילת השנה","CRM — ניהול קשרי הלקוחות של החנות; הדבר התאפשר בזכות מערכת ה-ERP שהספק התקין אצל הלקוח"],c:1,e:"המרצה הסביר שבשלב שרשרת האספקה גם הספק והלקוח נכנסו לתוך המידע: הספק 'יכול להסתכל מה יש לכם במלאי... ירד מ-10 ל-5, זורק לו עוד 10' בלי לחכות להזמנה — 'קוראים לזה VMI... וזה בזכות האינטרנט'. הוא הוסיף שלא כולם מאמצים זאת בגלל חשש מחשיפת סודות. MRP הוא אינטגרציה פנים-ארגונית בלבד, ושיטת הדחיפה פועלת לפי הסכם ולא לפי מלאי בפועל. (הרצאה 14.7, דקה ~53)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בשנות ה-80 ארגונים רכשו מחשב אישי למנכ״ל, למנהל הרכב, למנהל הכספים ולמנהל הלוגיסטיקה. איזו בעיה נוצרה, ואיזו תפיסה — שקדמה לאינטרנט — באה לפתור אותה?",o:["המחשבים היו יקרים מדי; ERP איחד את כל המחשבים למחשב מרכזי אחד וחסך לארגונים את עלויות הרכישה והתחזוקה הכפולות","המנהלים לא ידעו להפעיל אקסל; CRM הכשיר אותם לנהל את נתוני הלקוחות והמחירים בצורה ממוחשבת ואחידה","המחשבים לא 'דיברו' זה עם זה; MRP (תכנון דרישות החומרים) יצר שיתוף מידע פנים-ארגוני סביב הרכש, המלאי והניפוק","הספקים לא ראו את המלאי; VMI חיבר את מחשבי הספקים למחשב של מנהל הרכש באמצעות תקשורת מחשבים ייעודית"],c:2,e:"'כל אחד עם מחשב — מה הבעיה? המחשבים לא מדברים זה עם זה'. לפני האינטרנט התפתחה תפיסת ה-MRP, שהתמקדה בדרישות החומר: מנהל הרכש רוכש, מנהל המחסן יודע, המנכ״ל יודע, מנהל השיווק יודע מה יש במלאי — 'פה התחילה האינטגרציה' הפנים-ארגונית. ERP ו-VMI הם שלבים מאוחרים יותר, המחברים גם ספקים ולקוחות, ובעיית המחיר או האקסל לא הוזכרה כלל. (הרצאה 14.7, דקה ~50-52)"}
]);

BANK.push.apply(BANK,[
/* ===== חיזוי — שיטות ומדדים (ניצן, מצגת 2 + הרצאות 28.7, 4.8, 11.8) — שאלות מושגיות ===== */
/* --- הגדרה וחשיבות --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"כיצד מגדירה המצגת את פעולת החיזוי?",o:["קביעת יעדי המכירות שהארגון מתחייב לעמוד בהם בתקופה הבאה","תיעוד מסודר של התנהגות התופעה בעבר לצורך הפקת דוחות ניהוליים","ניסיון לנבא התנהגות של תופעות בעתיד — קצת יותר טוב מניחוש פראי","חישוב מדויק וודאי של הביקוש העתידי באמצעות מודל מתמטי מוסכם"],c:2,e:"המצגת מגדירה חיזוי כפעולה שמנסה לנבא התנהגות של תופעות בעתיד — היכולת לדעת היום מה יקרה בעתיד, ״משהו קצת יותר טוב מניחוש פראי״. חיזוי אינו ידיעה ודאית ואינו תיעוד של העבר, וקביעת יעדים היא החלטה ניהולית ולא ניבוי. (מצגת 2, שקף 2)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"יצרן רהיטים מחליט לוותר על חיזוי ביקוש ולהזמין חומרי גלם רק לאחר שמתקבלות הזמנות בפועל. על איזו תועלת מרכזית של החיזוי, לפי המצגת, הוא מוותר?",o:["הכנה מראש של התשתית הדרושה לאספקת הביקוש — תוכנית ייצור, חומרי גלם וקיבולת","ידיעה ודאית מראש של כמות ההזמנות שתתקבל, המאפשרת לבטל לחלוטין את החזקת המלאי","קביעת המחיר שהלקוח ישלם על פי העלות בפועל של ההזמנה שכבר התקבלה במערכת","חיסכון בעלויות הפרסום, מפני שהזמנות בפועל אינן דורשות פעילות שיווקית כלשהי"],c:0,e:"שקף 3 מסביר שחיזוי הצרכים העתידיים מאפשר הכנה מראש של התשתית הדרושה לאספקת הביקוש: בניית תוכנית ייצור, הזמנת חומרי גלם, תכנון קיבולת הייצור, מדיניות פרסום ומחירים ותכנון שיווקי. תחזית אינה מבטיחה ידיעה ודאית ואינה מבטלת את הצורך במלאי — היא רק מאפשרת להיערך. (מצגת 2, שקף 3)"},
/* --- אופקי תכנון --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהלת סניף של רשת מזון צריכה לשבץ עובדים למשמרות ולקבוע כמויות מלאי לפריטים ספציפיים לשבועות הקרובים. איזה סוג תחזית משרת אותה, לפי המצגת?",o:["תחזית לטווח בינוני — עד שלוש שנים, לקבוצות דגמים, לצורכי תקצוב","תחזית לטווח קצר — עד שלושה חודשים, למוצרים בודדים ומסוימים","תחזית לטווח ארוך — מעל שלוש שנים, למוצרים בפיתוח ולהקצאת אתרים","תחזית לטווח בינוני — עד שלושה חודשים, למוצרים כוללניים בלבד"],c:1,e:"התחזית לטווח הקצר (עד שלושה חודשים) עוסקת במוצרים בודדים ומסוימים, ומטרתה זימון עבודה, מטלות עובדים וניהול מלאי — בדיוק הצרכים שבתרחיש. הטווח הבינוני (עד 3 שנים) משרת תכנון שיווק, ייצור ותקצוב ברמת מוצרים כוללניים, והארוך (מעל 3 שנים) — מוצרים חדשים והקצאת אתרים. (מצגת 2, שקף 4)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"הנהלת חברה דנה בהקמת מפעל חדש ובפיתוח קו מוצרים שיושק בעוד ארבע שנים. איזה אופק תחזית נדרש, ומה מאפיין אותו?",o:["טווח קצר — מוצרים מסוימים, לצורך זימון עבודה וניהול מלאי","טווח בינוני — מוצרים כוללניים בכמה דגמים, לצורך תכנון שיווק, ייצור ותקצוב","טווח בינוני — מוצרים בפיתוח, לצורך תקצוב והקצאת אתרים","טווח ארוך — מוצרים בפיתוח, לצורך תכנון מוצרים חדשים והקצאת אתרים"],c:3,e:"אופק של מעל שלוש שנים הוא תחזית לטווח ארוך: היא עוסקת במוצרים לטווח ארוך ובפיתוח, ומטרתה תכנון מוצרים חדשים והקצאת אתרים — כמו הקמת מפעל. הטווח הבינוני מוגבל לשלוש שנים ועוסק במוצרים כוללניים לצורכי תכנון שיווק, ייצור ותקצוב, ולא בהחלטות על אתרים. (מצגת 2, שקף 4)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"כיצד משתנה רמת הפירוט של המוצרים בתחזית ככל שאופק התכנון מתארך?",o:["ממוצרים בודדים ומסוימים בטווח הקצר, למוצרים כוללניים בבינוני ולמוצרי פיתוח בארוך","הפירוט נשאר זהה בכל האופקים, ורק שיטת החישוב משתנה מאיכותית לכמותית ככל שהטווח מתארך","ממוצרים כוללניים בטווח הקצר למוצרים בודדים ומסוימים בטווח הארוך, כדי לדייק בתכנון האתרים","בטווח הקצר מתכננים מוצרים חדשים בלבד, ובטווח הארוך עוברים לניהול המלאי של פריטים קיימים"],c:0,e:"שקף 4 מדרג את המוצרים לפי האופק: בטווח הקצר מוצרים בודדים ומסוימים, בטווח הבינוני מוצרים כוללניים (כמה דגמים או סוגים), ובטווח הארוך מוצרים לטווח ארוך ופיתוח. הכיוון ההפוך — פירוט גובר ככל שמתרחקים — סותר את המצגת, שכן לפי עקרונות היסוד התחזיות מדויקות יותר דווקא לטווח הקצר. (מצגת 2, שקפים 4, 31)"},
/* --- סובייקטיבי מול אובייקטיבי --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברת סטארט-אפ עומדת להשיק מוצר חדש לחלוטין, שאין לו נתוני מכירות היסטוריים. איזו גישת חיזוי עדיפה במצב זה, ומדוע?",o:["אובייקטיבית — מודל מתמטי אינו תלוי בנתוני עבר ולכן מתאים דווקא למוצר חדש","אובייקטיבית — רגרסיה ליניארית על נתוני מוצרים דומים מבטיחה תחזית מדויקת","סובייקטיבית — מתבססת על הערכות, אינטואיציה וניסיון, ועדיפה כשאין מידע על העבר","סובייקטיבית — היא מדויקת יותר מכל מודל כמותי גם כשקיים מידע היסטורי מלא"],c:2,e:"לפי שקף 5, השיטות הסובייקטיביות (האיכותיות) מתבססות על הערכות ומשלבות אינטואיציה וניסיון של מקבלי ההחלטות, והן עדיפות כאשר אין מידע על העבר. השיטות האובייקטיביות מבוססות על מודלים מתמטיים ומיושמות דווקא כשהמצב יציב וקיים מידע היסטורי — שאינו קיים למוצר חדש. (מצגת 2, שקף 5)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"באילו תנאים, לפי המצגת, ראוי ליישם שיטות חיזוי אובייקטיביות (כמותיות)?",o:["כאשר מקבלי ההחלטות בעלי ניסיון רב ואינטואיציה מפותחת בתחום המוצר","כאשר המצב יציב וקיים מידע היסטורי שעליו ניתן להריץ מודל מתמטי","כאשר המוצר חדש ואין נתוני עבר, ולכן נדרש מודל שאינו תלוי בנתונים","כאשר השוק משתנה במהירות ונדרשת הערכה מהירה של קבוצת מנהלים בכירים"],c:1,e:"שיטות אובייקטיביות מתבססות על מודלים מתמטיים ומיושמות כאשר המצב יציב וקיים מידע היסטורי. ניסיון ואינטואיציה של מקבלי ההחלטות הם הבסיס לשיטות הסובייקטיביות, וכשאין נתוני עבר או כשנדרשת הערכת מנהלים מהירה — פונים לשיטות איכותיות ולא למודל כמותי. (מצגת 2, שקף 5)"},
/* --- חמש השיטות האיכותיות --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בעל מכולת קובע שהתחזית לחודש יוני שווה בדיוק למכירות שנרשמו במאי. באיזו שיטה הוא נוקט, ומה נאמר עליה במצגת?",o:["ממוצע נע פשוט עם n=2 — שיטה כמותית שחסרונה הוא פיגור אחרי המגמה הכללית","דעות סגל ניהולי — הערכה מהירה של מנהל בכיר יחיד, החשופה לחיסרון של חשיבה קבוצתית","החלקה מעריכית עם α=0 — כל המשקל ניתן לתחזית הקודמת ולא למכירות האחרונות","הגישה הנאיבית — התחזית זהה לביצועי התקופה שחלפה, ולעיתים יעילה גם כלכלית"],c:3,e:"הגישה הנאיבית מניחה שתחזית התקופה הקרובה זהה לביצועי התקופה שחלפה — הדוגמה במצגת היא בדיוק 48 במאי ולכן 48 ביוני — והמצגת מציינת שלעיתים היא יעילה גם בהיבט הכלכלי. היא מסווגת בין השיטות האיכותיות; ממוצע נע עם n=2 היה ממצע את אפריל ומאי, ולא נשען על מאי בלבד. (מצגת 2, שקפים 6–7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנכ״ל מכנס חמישה סמנכ״לים לישיבה קצרה שבה הם מעריכים יחד את הביקוש לשנה הבאה, תוך שילוב ניסיונם עם נתונים סטטיסטיים. מהו החיסרון העיקרי של שיטה זו לפי המצגת?",o:["חשיבה קבוצתית — הקבוצה נוטה להתכנס לדעה אחת ומאבדת הערכות עצמאיות","איטיות — תהליך נשנה של סבבי שאלונים שנמשך זמן רב עד להשגת הסכמה","הטיה אופטימית — המנהלים מתוגמלים בבונוסים על עמידה ביעדי המכירות שהעריכו","פער בין ההצהרות לבין ההתנהגות בפועל של המשתתפים בהערכת הביקוש"],c:0,e:"זוהי שיטת דעות הסגל הניהולי: קבוצה קטנה של מנהלים בכירים מעריכה ביקושים בעבודת צוות, משלבת ניסיון ניהולי עם מודלים סטטיסטיים והיא יחסית מהירה — אך חסרונה הוא ״חשיבה קבוצתית״. איטיות אינה חיסרון שלה (היא מהירה), והטיית הבונוסים מיוחסת במצגת לחוות דעת אנשי המכירות. (מצגת 2, שקף 8)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"ארגון חושש שהערכת ביקוש בישיבת הנהלה תיפגע מ״חשיבה קבוצתית״, ומעוניין בתהליך מובנה שבו המומחים אינם משפיעים זה על זה ישירות. איזו שיטה איכותית מתאימה?",o:["חוות דעת אנשי מכירות — כל איש מכירות מגיש תחזית עצמאית לאזורו","סקר שווקים של לקוחות — שואלים את הלקוחות ישירות על תוכניות הרכש","שיטת דלפי — תהליך קבוצתי נשנה-אינטראקטיבי שמצמצם חשיבה קבוצתית","הגישה הנאיבית — מסתמכים על ביצועי התקופה שחלפה ללא דיון קבוצתי"],c:2,e:"שיטת דלפי היא תהליך קבוצתי נשנה-אינטראקטיבי עם שלושה סוגי משתתפים (מקבלי החלטות-מומחים, סגל ניהולי ומשיבים), והמצגת מציינת במפורש שהיא מצמצמת ״חשיבה קבוצתית״. חוות דעת אנשי מכירות וסקר לקוחות אינם פותרים את בעיית ההשפעה ההדדית בין מומחים, והגישה הנאיבית כלל אינה תהליך הערכה. (מצגת 2, שקף 9)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מי הם שלושת סוגי המשתתפים בשיטת דלפי, לפי המצגת?",o:["אנשי מכירות, לקוחות מרכזיים ואנליסטים סטטיסטיים","מקבלי החלטות (מומחים), סגל ניהולי ומשיבים","מנהלים בכירים, מנהלי ביניים ועובדי הייצור","מומחים חיצוניים, ספקים עיקריים ומשיבים מהציבור"],c:1,e:"בשיטת דלפי משתתפים שלושה סוגים: מקבלי החלטות (המומחים), סגל ניהולי ומשיבים, בתהליך נשנה-אינטראקטיבי. אנשי מכירות ולקוחות שייכים לשיטות איכותיות אחרות (חוות דעת אנשי מכירות וסקר שווקים), ולא להרכב המשתתפים של דלפי. (מצגת 2, שקף 9)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהל שיווק אוסף מכל איש מכירות תחזית לאזורו ומשלב אותן לתחזית ארצית. אנשי המכירות מתוגמלים בבונוסים על עמידה ביעדים. מה היתרון ומה הסיכון בשיטה זו, לפי המצגת?",o:["יתרון: תהליך מהיר יחסית לשאר השיטות; סיכון: חשיבה קבוצתית בין אנשי המכירות באותו אזור","יתרון: מצמצם חשיבה קבוצתית; סיכון: פער בין מה שהלקוחות אומרים למה שיעשו בפועל","יתרון: מבוסס על מודל סטטיסטי; סיכון: התחזית מפגרת אחרי המגמה הכללית של השוק","יתרון: איש המכירות מכיר את הלקוח; סיכון: נטייה לתחזית אופטימית והטיה מהבונוסים"],c:3,e:"בחוות דעת אנשי מכירות כל איש מכירות מציג את תחזיתו והתחזיות משולבות ברמה אזורית ולאומית; היתרון הוא שאיש המכירות מכיר את הלקוח, והחסרונות הם נטייה לתחזית אופטימית והטיה כתוצאה מבונוסים. חשיבה קבוצתית היא חיסרון של דעות הסגל הניהולי, והפער בין אמירה למעשה מאפיין סקר לקוחות. (מצגת 2, שקף 10)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"רשת חנויות פונה ללקוחותיה העסקיים ושואלת אותם מה בכוונתם לרכוש בשנה הבאה, ובונה על כך תחזית. מהי המגבלה העיקרית של שיטה זו לפי המצגת?",o:["פער בין מה שהלקוחות אומרים לבין מה שיעשו בפועל","הלקוחות נוטים לדווח תחזית אופטימית בגלל תמריצים","התהליך איטי ומחייב סבבי שאלונים חוזרים למומחים","השיטה אינה מנצלת את היכרות איש המכירות עם הלקוח"],c:0,e:"סקר שווקים של לקוחות שואל את הלקוח על תוכניות הרכש העתידיות שלו, והמצגת מציינת כמגבלה את הפער בין מה שהלקוחות אומרים לבין מה שיעשו בפועל. הטיה אופטימית בגלל תמריצים מיוחסת לאנשי המכירות, וסבבי שאלונים חוזרים מאפיינים את שיטת דלפי. (מצגת 2, שקף 11)"},
/* --- מרכיבי סדרה עתית --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מכירות תנורי חימום מגיעות לשיא בחודשי החורף ולשפל בקיץ, ומכירות מזגנים מתנהגות הפוך — בכל שנה מחדש. איזה מרכיב של הסדרה העתית מתואר כאן?",o:["מגמה — שינוי עקבי לאורך זמן בכיוון קבוע","עונתיות — דפוס החוזר על עצמו במחזור קבוע של שנה","תנועות אקראיות — תנודות ללא דפוס שניתן לחזות","מחזוריות — גלים ארוכים שאינם קשורים ללוח השנה"],c:1,e:"דפוס שחוזר על עצמו בתוך כל שנה — שיא בחורף ושפל בקיץ (או להפך) — הוא עונתיות, והמצגת מדגימה זאת בדיוק בגרף תנורי חימום מול מזגנים לפי חודשים (m max, m min). מגמה היא שינוי עקבי בכיוון אחד לאורך זמן, ותנועות אקראיות הן תנודות ללא דפוס. (מצגת 2, שקפים 13, 18)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"נתוני גיוס החרדים לצה״ל בדוגמת הכיתה עלו בעקביות משנה לשנה (1282 ב-2013 ועד 3070 ב-2019). איזה מרכיב של הסדרה העתית בולט בנתונים, ומה משמעותו לבחירת השיטה?",o:["עונתיות — ולכן יש להשתמש במודל עונתיות עם m max ו-m min","תנועות אקראיות — ולכן שום שיטה כמותית לא תיתן תחזית סבירה","מגמה — ולכן הרגרסיה הליניארית צפויה להתאים יותר מממוצע נע","מחזוריות — ולכן יש להעדיף ממוצע נע פשוט עם n גדול ככל האפשר"],c:2,e:"עלייה עקבית משנה לשנה היא מגמה. בהרצאה הודגש שכאשר יש מגמה, הרגרסיה הליניארית היא המתאימה ביותר, ואילו הממוצע הנע מפגר אחרי המגמה הכללית — ואכן בדוגמת הכיתה הרגרסיה השיגה את המדדים הנמוכים ביותר. עונתיות היא דפוס חוזר בתוך שנה, ואינה מה שנצפה כאן. (מצגת 2, שקפים 13, 19, 21, 34)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מכירות הגלידה של יצרן עולות משנה לשנה, ובתוך כל שנה יש שיא בקיץ ושפל בחורף. איזו צורת תנועה מהמצגת מתארת את הסדרה?",o:["מחזוריות בלבד — גלים חוזרים באורך משתנה שאינם תלויים בעונה","עונתיות בלבד — הדפוס השנתי החוזר מסביר את כל התנועה בנתונים","מגמה בלבד — העלייה הרב-שנתית מסבירה את כל התנועה","מגמה משולבת עונתיות — עלייה כללית עם דפוס עונתי חוזר"],c:3,e:"שקף 13 מציג בין מרכיבי הסדרה העתית גם ״מגמה משולבת עונתיות״ — סדרה שיש בה גם עלייה (או ירידה) כללית לאורך השנים וגם דפוס עונתי החוזר בתוך כל שנה, בדיוק כמו מכירות הגלידה בתרחיש. עונתיות בלבד לא הייתה מסבירה את העלייה הרב-שנתית, ומגמה בלבד לא הייתה מסבירה את שיאי הקיץ. (מצגת 2, שקף 13)"},
/* --- רגרסיה ליניארית ומקדם המתאם --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מהו קו הרגרסיה הליניארית, לפי ההגדרה במצגת?",o:["הקו הישר שיוצר את השגיאה המצטברת הקטנה ביותר ביחס לנקודות התצפית","הקו הישר העובר דרך הנקודה הראשונה והנקודה האחרונה בסדרת הנתונים","הקו הישר המחבר את ערך המקסימום ואת ערך המינימום של המשתנה התלוי","הקו הישר שמספר הנקודות שמעליו שווה למספר הנקודות שמתחתיו בסדרה"],c:0,e:"המצגת מגדירה את קו הרגרסיה כקו שיוצר את השגיאה המצטברת הקטנה ביותר: לכל נקודה יש סטייה (שגיאה) מהקו, והקו נבחר כך שסך השגיאות מינימלי. משוואתו Y=a+bX, כאשר X הוא המשתנה הבלתי תלוי ו-Y התלוי. חיבור נקודות קצה או קיצון אינו מבטיח שגיאה מינימלית. (מצגת 2, שקף 14)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בבדיקת הקשר בין מחיר מוצר לבין הביקוש לו התקבל מקדם מתאם R=−0.95. מה משמעות התוצאה?",o:["קשר ליניארי חלש — הערך רחוק מ-1 ולכן רגרסיה ליניארית אינה מתאימה לנתונים","טעות חישוב — מקדם המתאם אינו יכול לקבל ערכים שליליים","קשר ליניארי חזק ושלילי — כשהמחיר עולה, הביקוש יורד כמעט בקו ישר","קשר ליניארי חזק וחיובי — הסימן השלילי מציין רק את כיוון ציר הזמן"],c:2,e:"מקדם המתאם R מבטא את עוצמת הקשר הליניארי ואת כיוונו, בתחום −1 עד 1: R קרוב ל-−1 הוא קשר ליניארי חזק ושלילי (כש-X עולה, Y יורד), R קרוב ל-1 חזק וחיובי, ו-R קרוב ל-0 חלש. הסימן השלילי הוא כיוון הקשר ולא שגיאה, והעוצמה נמדדת לפי הקרבה ל-1 או ל-−1. (מצגת 2, שקף 15)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"צוות שמכין את מטלת החיזוי חישב באקסל את מקדם המתאם (CORREL) וקיבל R=0.16. מה המסקנה הנכונה, לפי מה שנאמר בהרצאה?",o:["הרגרסיה תהיה השיטה הטובה ביותר בכל מקרה, שכן R חיובי מעיד על מגמת עלייה","הקשר הליניארי חלש, ולא בטוח שהרגרסיה תנצח — יש להשוות בעזרת MAD ו-MSE","יש להעלות את R בריבוע כדי לקבל את עוצמת הקשר האמיתית לפני ההחלטה","יש לפסול את הנתונים — R נמוך מ-0.5 מעיד שהסדרה אינה ניתנת לחיזוי כלל"],c:1,e:"בהרצאה, כשהתקבל R=0.16, אמר ניצן שזהו מקדם מתאם נמוך — ככל ש-R קרוב ל-1 או ל-−1 הקשר הליניארי חזק, וכאן הוא יחסית חלש, ״זה אומר שהרגרסיה לא כזאת מי יודע מה״. במקרה כזה לא בטוח שהרגרסיה עדיפה על הממוצעים הנעים, ולכן משווים את השיטות לפי MAD ו-MSE. הודגש שעובדים עם R ולא עם R בריבוע. (הרצאה 4.8)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בהכנת רגרסיה ליניארית לחיזוי ביקוש על פי שש שנות מכירה (2021–2026), מה מציבים כמשתנה הבלתי תלוי X, לפי ההנחיה בהרצאה?",o:["את השנים עצמן (2021, 2022, ...), כי הן מייצגות את ציר הזמן האמיתי","את נתוני הביקוש, כי הביקוש הוא הגורם שמסביר את השנה שבה נמכר","את התחזיות של הממוצע הנע, כדי לשפר אותן באמצעות התאמת קו ישר","את מספרי התקופות הסידוריים 1, 2, ..., 6 — ואת הביקושים כמשתנה Y"],c:3,e:"בהרצאה הוסבר שבחיזוי עוסקים במשתנה התלוי בזמן, ולכן ציר X הוא התקופות במספור סידורי 1..n (״התקופות זה ציר ה-X״), והביקושים הם Y. כך גם בדוגמת גיוס החרדים במצגת: מס״ד 1–7 לשנים 2013–2019, והחיזוי ל-2020 נעשה בהצבת X=8. באקסל: a מ-INTERCEPT, b מ-SLOPE, R מ-CORREL. (הרצאה 4.8; מצגת 2, שקף 19)"},
/* --- ממוצע נע פשוט ומשוקלל --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"הביקוש החודשי לסוכר במאפייה נע סביב ממוצע קבוע, ללא מגמת עלייה או ירידה וללא דפוס עונתי. איזו שיטה כמותית מתאימה, לפי המצגת, ומדוע?",o:["ממוצע נע פשוט — יעיל כשהביקוש יציב ללא מגמה או עונתיות ונע קרוב לממוצע","רגרסיה ליניארית — קו ישר הוא היחיד שמסוגל לתאר ביקוש שנע סביב ממוצע קבוע","מודל עונתיות — משתמשים בו כברירת מחדל בכל סדרה חודשית, גם ללא דפוס עונתי מובהק","ממוצע נע משוקלל — הוא היחיד שמבטל לחלוטין את השפעת המגמה על התחזית"],c:0,e:"שקף 21 קובע שממוצע נע פשוט יעיל כאשר הביקוש יציב ללא מגמה או עונתיות, ונכון להשתמש בו כשהמכירות נעות קרוב לממוצע — בדיוק התרחיש. בהרצאה הודגש שכשהנתונים די קבועים, לא בטוח שהרגרסיה תהיה טובה יותר מהממוצע הנע. מודל עונתיות דורש דפוס עונתי, שאינו קיים כאן. (מצגת 2, שקף 21; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברה חוזה ביקוש למוצר שמכירותיו עולות בהתמדה מדי שנה באמצעות ממוצע נע פשוט, ומגלה שהתחזית נמוכה מהביקוש בפועל כמעט בכל תקופה. מה ההסבר לפי המצגת?",o:["המשקולות שנבחרו לתקופות הישנות היו גבוהות מדי ביחס לתקופה האחרונה","הממוצע הנע מפגר אחרי המגמה הכללית — הוא ממצע תקופות קודמות ונמוכות יותר","מספר התקופות n שנבחר קטן מדי, ולכן הממוצע רגיש מדי לתנודות אקראיות","מקדם ההחלקה α שנבחר קרוב מדי לאפס, ולכן התחזית מגיבה לאט למכירות האחרונות"],c:1,e:"חסרונו של הממוצע הנע הפשוט, לפי שקף 21, הוא שהוא מפגר אחרי המגמה הכללית: כשהביקוש עולה, ממוצע התקופות הקודמות תמיד נמוך מהערך הבא. בהרצאה הודגש שבמקרה של מגמה הרגרסיה הליניארית מתאימה יותר. משקולות שייכות לממוצע המשוקלל ו-α להחלקה מעריכית, ואינן רלוונטיות לממוצע הפשוט. (מצגת 2, שקף 21; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מה מבדיל את שיטת הממוצע הנע המשוקלל מהממוצע הנע הפשוט, לפי המצגת?",o:["המשוקלל משתמש במספר תקופות גדול יותר, ולכן מחליק טוב יותר את התנודות","המשוקלל מוסיף לממוצע את התחזית הקודמת ומשקלל אותה עם המכירות האחרונות בלבד","המשוקלל נותן משקל יחסי שונה לכל תקופה — גבוה יותר לתקופה הדומה לזו החזויה","המשוקלל מתאים רק לסדרות עונתיות, ואילו הפשוט מתאים לסדרות עם מגמה"],c:2,e:"שקף 24 מציג את הממוצע הנע המשוקלל כהתאמה של הממוצע הנע שתבטא טוב יותר את שינויי הביקוש: ניתן משקל יחסי שונה לכל תקופה, ולתקופה בעלת מאפיינים דומים לתקופה החזויה ניתן משקל גבוה. שקלול התחזית הקודמת עם המכירות האחרונות הוא עקרון ההחלקה המעריכית, לא של הממוצע המשוקלל. (מצגת 2, שקף 24)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בהרצאה הוצגה דרך לקביעת המשקולות בממוצע נע משוקלל. איזה תיאור תואם את מה שנאמר?",o:["המשקולות חייבות להסתכם ל-1 בדיוק (למשל 0.6 ו-0.4), אחרת התחזית יוצאת מוטה כלפי מעלה","לתקופה הרחוקה ביותר ניתן משקל 1, ובכל תקופה קדימה מוסיפים 10% עד לתקופה האחרונה","כל התקופות מקבלות משקל שווה של 1, ורק התקופה החזויה עצמה מקבלת משקל כפול","לתקופה האחרונה משקל 1, אחורה מפחיתים 10% (או 15%), ומחלקים בסכום המשקולות"],c:3,e:"ניצן הדגים: לתקופה האחרונה נותנים משקל 1 ובכל תקופה אחורה מורידים 10% (0.9, 0.8...) או 15% (0.85, 0.7...) — ההפחתה נתונה לבחירה. הוא הדגיש שסכום המשקולות לא חייב להיות 100%: מכפילים כל ביקוש במשקלו ומחלקים בסכום המשקולות, כמו ממוצע בגרות משוקלל לפי יחידות. את התוצאות הציג בשתי ספרות אחרי הנקודה. (הרצאה 28.7; הרצאה 11.8)"},
/* --- החלקה מעריכית --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בנוסחת ההחלקה המעריכית F(t+1)=α·X(t)+(1−α)·F(t), מה מייצגים α ו-(1−α)?",o:["α — המשקל למכירות האחרונות (ההווה); (1−α) — המשקל לתחזית של התקופה הקודמת","α — המשקל לתחזית של התקופה הקודמת; (1−α) — המשקל לממוצע כל המכירות ההיסטוריות","α — שיעור המגמה השנתי; (1−α) — שיעור העונתיות שנותר לאחר ניכוי המגמה","α — מספר התקופות בממוצע; (1−α) — שיעור ההפחתה במשקל בכל תקופה אחורה"],c:0,e:"לפי שקפים 27–28, ההחלקה המעריכית משקללת את המכירות האחרונות (ההווה) ואת התחזית של התקופה הקודמת: המשקל למכירות האחרונות הוא α והמשקל לתחזית הקודמת הוא המשלים (1−α), כאשר 0<α<1. יתרונותיה: חישובים פשוטים ושיטה רגישה. α אינו מספר תקופות ואינו קשור למגמה או לעונתיות. (מצגת 2, שקפים 27–28)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"צוות שמכין את מטלת החיזוי מגלה שבקובץ המטלה מופיעה גם שיטת ההחלקה המעריכית. מה הנחה ניצן בהרצאה?",o:["לחשב אותה עם α=0.5 כברירת מחדל, מכיוון שהיא השיטה הרגישה ביותר","לדלג עליה — היא לא נלמדה בקורס, ויש להסתפק בחמש השיטות שנלמדו","לחשב אותה במקום הממוצע הנע המשוקלל, כי חישוביה פשוטים יותר","לחשב אותה רק אם R של הרגרסיה נמוך מ-0.5 ואין שיטה אחרת מתאימה"],c:1,e:"בהרצאה 11.8 אמר ניצן: ״יש שם שיטה שלא למדנו — החלקה מעריכית — לא צריך״, ובהרצאה 28.7: ״יש פה החלקה מעריכית, לדלג על זה, זה לא בחומר״. המטלה כוללת חמש שיטות בלבד: רגרסיה ליניארית, ממוצע נע פשוט n=2 ו-n=3, וממוצע נע משוקלל n=2 ו-n=3, והשוואה ביניהן. (הרצאה 11.8; הרצאה 28.7)"},
/* --- מדדי דיוק ובחירת מודל --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מה ההבדל בין המדדים MAD ו-MSE להשוואת מודלי חיזוי?",o:["MAD הוא ממוצע הסטיות היחסיות באחוזים; MSE הוא ממוצע הסטיות בערך מוחלט","MAD מחושב רק על התקופה העתידית; MSE מחושב על כל תקופות העבר","MAD הוא ממוצע הסטיות בערך מוחלט; MSE הוא ממוצע ריבועי הסטיות","MAD מודד את כיוון הסטייה (חיובית או שלילית); MSE מודד את גודלה בלבד"],c:2,e:"לפי שקף 32: MAD = Σ|Xt−Ft|/n — ממוצע הסטיות בערך מוחלט; MSE = Σ(Xt−Ft)²/n — ממוצע ריבועי הסטיות; כאשר Ft התחזית, Xt הערך בפועל ו-n מספר התקופות. ממוצע הסטיות היחסי באחוזים הוא MRD (MAPE), שממנו נאמר בהרצאה להתעלם. שני המדדים מחושבים על תקופות העבר שיש להן תחזית. (מצגת 2, שקף 32)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בטבלת ההשוואה של דוגמת הכיתה התקבל לרגרסיה MAD=62.06 ולממוצע הנע הפשוט (n=2) MAD=481.40. מה המסקנה לפי כלל הבחירה במצגת?",o:["יש לבחור בממוצע הנע — ערך MAD גבוה מעיד שהמודל 'תופס' יותר מהתנודות","אי אפשר להכריע — יש לחשב את הממוצע של שני המדדים ולבחור את הקרוב אליו","יש לבחור בממוצע הנע — MAD נמדד ביחידות שונות לכל מודל ולכן הפער אינו מעיד","יש לבחור ברגרסיה — המודל הנבחר הוא זה שמביא את קריטריון ההשוואה למינימום"],c:3,e:"שלב 6 בשקף 33: המודל הנבחר יהיה זה שיביא למינימום את הקריטריון הנבחר — ערך סטייה נמוך פירושו תחזית קרובה יותר לביקוש בפועל. בדוגמת הכיתה השיטה בעלת המדדים הנמוכים ביותר הייתה הרגרסיה, ולכן התחזית ל-2020 נלקחה ממנה (3436). MAD גבוה מעיד על סטיות גדולות, לא על ״תפיסת תנודות״. (מצגת 2, שקפים 33–34; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מהו הסדר הנכון של השלבים לבחירת מודל חיזוי מתאים, לפי המצגת?",o:["הרצה על כמה מודלים ← חישוב השגיאה בכל מודל ← בחירת קריטריון ← חישוב ערכו לכל מודל ← בחירת הממזער","בחירת המודל המקובל בענף ← הרצת הנתונים עליו ← חישוב השגיאה ← אימוץ המודל אם השגיאה קטנה מ-10% מהביקוש","בחירת קריטריון ← בחירת המודל שהמרצה ממליץ עליו ← הרצת הנתונים עליו ← חישוב השגיאה לצורך דיווח בלבד","חישוב השגיאה לכל מודל ← בחירת המודל עם השגיאה הקטנה ← הרצת הנתונים עליו ← חישוב הקריטריון"],c:0,e:"שקף 33 מונה שישה שלבים: הרצת נתוני המכירות על מספר מודלים; חישוב השגיאה בכל מודל; בחירת קריטריון להשוואה; אפיון אוכלוסיית הסטיות המשותפת לכל המודלים; מציאת הערכים לכל מודל לפי הקריטריון; ובחירת המודל שמביא את הקריטריון למינימום. אין ״מודל מקובל״ מראש — ריבוי השיטות נובע מכך שאין שיטה דומיננטית. (מצגת 2, שקפים 29, 33)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בקובץ המטלה, לצד MAD ו-MSE, מופיע גם המדד MAPE (ממוצע הסטיות היחסי באחוזים, MRD במצגת). כיצד הנחה ניצן להתייחס אליו?",o:["לחשב אותו ולהכריע לפיו כשיש סתירה בין MAD ל-MSE","לחשב אותו במקום MSE, מפני שאחוזים נוחים יותר להשוואה","להתעלם ממנו — בקורס למדו ומשתמשים רק ב-MAD וב-MSE","לחשב אותו רק עבור הרגרסיה, שבה הסטיות היחסיות קטנות"],c:2,e:"בהרצאה 11.8 אמר ניצן: ״יש פה גם MAPE, אז תתעלמו מה-MAPE — למדנו רק MAD ו-MSE״, ובהרצאה 28.7: ״אתם פטורים בקורס הזה מ-MRD״. את ההשוואה בין חמש השיטות עורכים לפי MAD ו-MSE בלבד, ואין למדד היחסי תפקיד בהכרעה. (הרצאה 11.8; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"במטלה מחשבים תחזית (Ft) לא רק לתקופה העתידית אלא גם לתקופות העבר שכבר ידוע בהן הביקוש בפועל. מדוע?",o:["כדי למדוד את הסטיות מהביקוש בפועל ולחשב MAD ו-MSE להשוואה בין השיטות","כדי להחליף את נתוני הביקוש בפועל בערכים חלקים יותר לפני חישוב הרגרסיה","כדי לוודא שהתחזית זהה לביקוש בפועל — אם אינה זהה, המודל שגוי ויש להחליפו","כדי להשלים את התקופות הראשונות שאין להן תחזית בממוצע הנע, כך שהטבלה תהיה מלאה"],c:0,e:"ניצן הסביר שהפערים בין הביקוש לתחזית בתקופות העבר הם שמאפשרים למצוא את הסטייה של כל שיטה, ומהן מחשבים את MAD ו-MSE כדי לבחור את השיטה הטובה ביותר. הודגש שתחזית ובפועל ״אף פעם לא דומים״ — פער אינו סימן לשגיאה. בממוצע נע מוחקים את n התקופות הראשונות (אין להן תחזית), והסטיות מחושבות רק היכן שיש תחזית. (הרצאה 28.7; הרצאה 4.8)"},
/* --- בקרת התחזית ועקרונות יסוד --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברה בחרה מודל חיזוי לפני שנה על סמך MAD מינימלי. בחודשים האחרונים, לאחר שמתחרה השיק טכנולוגיה חדשה, השגיאות הולכות וגדלות. מה נדרש לפי עקרונות בקרת התחזית במצגת?",o:["להמשיך עם המודל כפי שהוא — הוא נבחר כדין לפי הקריטריון, ושינוי מודל פוגע בעקביות","לבחון מחדש את התאמת המודל ולעדכנו — תהליך החיזוי אינו מסתיים בבחירת השיטה","להגדיל את מספר התקופות n בממוצע הנע כדי להחליק את השפעת המתחרה החדש","לעבור לשיטה איכותית בלבד — מודלים כמותיים אינם רלוונטיים אחרי שינוי טכנולוגי"],c:1,e:"שקף 30 קובע שתהליך החיזוי אינו מסתיים עם בחירת שיטת החיזוי אלא מחייב בחינה מתמדת של המודל ועדכונו; בעיות הדיוק נובעות מהתאמת המודל למוצר ומהשפעות חיצוניות — ושקף 31 מונה במפורש ״הופעת טכנולוגיות חדשות״ בין ההשפעות. הימנעות מעדכון מנוגדת לעקרון הבקרה; מעבר גורף לשיטה איכותית אינו נדרש. (מצגת 2, שקפים 30–31)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהל מציג להנהלה תחזית מכירות לשנה הבאה כמספר יחיד — 12,000 יחידות — ללא כל התייחסות לטווח הסטייה האפשרי. איזה עיקרון יסוד בבניית תחזית הופר?",o:["תחזיות מדויקות יותר לטווח הקצר, ולכן אין להציג תחזית שנתית","יש לבחון את שיטת התחזית לפני שמאמצים אותה סופית","יש להריץ את הנתונים על מספר מודלים ולבחור את הממזער את הקריטריון","התחזית חייבת לכלול הערכה ביחס לגודל השגיאה האפשרית"],c:3,e:"בין עקרונות היסוד בשקף 31: התחזית חייבת לכלול הערכה ביחס לגודל השגיאה האפשרית — הצגת מספר יחיד בלי טווח סטייה מפרה עיקרון זה. העיקרון על דיוק הטווח הקצר אינו אוסר תחזית שנתית, ובחינת השיטה לפני אימוץ עוסקת בשלב בחירת המודל ולא באופן הצגת התוצאה. (מצגת 2, שקף 31)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"לפי המצגת, משני אילו מקורות נובעות בעיות הדיוק בתחזית?",o:["בחירת קריטריון השוואה שגוי, ומספר תקופות n קטן מדי בממוצע הנע הפשוט או המשוקלל","אורך אופק התכנון שנבחר, ורמת הפירוט של המוצרים שנכללו בתחזית ביחס לאופק","אי-התאמת המודל למוצר, והשפעות חיצוניות (שנצפו ושלא נצפו) המטעות את הנתונים","שגיאות חישוב של העובדים במחשבון או באקסל, ואיסוף נתונים ממספר שנים גדול מדי"],c:2,e:"שקף 30 קובע שלמרות כל חיזוי קיימת בעיית דיוק, הנובעת משני מקורות: (1) האם המודל שהשתמשנו בו מתאים למוצר; (2) השפעות חיצוניות שנצפו וכאלה שלא נצפו שיכולות להטעות את הנתונים (משתנה חדש, מזג אוויר, טעם צרכנים, טכנולוגיה). קריטריון ההשוואה ו-n הם החלטות בבחירת המודל, לא מקורות הדיוק שהמצגת מונה. (מצגת 2, שקפים 30–31)"},
/* --- מספר השנים לאיסוף נתונים --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"צוות אחד חוזה ביקוש לדגם סמארטפון וצוות אחר חוזה ביקוש לגבינת קוטג'. כמה תקופות עבר כדאי לכל צוות לאסוף, לפי המצגת?",o:["לשניהם אותו מספר — לפחות עשר שנים אחורה, כדי שהרגרסיה תצא מובהקת","לסמארטפון טווח קצר של נתונים, לקוטג' טווח ארוך — לפי רלוונטיות צריכת המוצר","לסמארטפון טווח ארוך כדי לתפוס את המגמה, לקוטג' טווח קצר כי הביקוש יציב","לשניהם מעט תקופות ככל האפשר, כי נתונים ישנים תמיד מטעים את המודל הכמותי"],c:1,e:"לפי שקף 35, מספר השנים שיש לאסוף נקבע לפי מידת הרלוונטיות של צריכת המוצר באותן תקופות: מוצרים טכנולוגיים כמו אייפון — טווח קצר; מוצרי בסיס כמו רכבת ישראל או גבינת קוטג' — טווח ארוך. בהרצאה: מוצר טכנולוגי שמשתנה מהר — מספר קטן של תקופות, מוצרי אוסם — מספר גדול; למטלה נדרשו לפחות שישה נתוני עבר. (מצגת 2, שקף 35; הרצאה 4.8)"}
]);

{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש החודשי למוצר:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>120</td><td>135</td><td>128</td><td>142</td><td>150</td><td>146</td></tr></table>מהי התחזית לחודש 7 בשיטת ממוצע נע פשוט עם N=2?",o:["146.00","127.50","136.83","148.00"],c:3,e:"בממוצע נע עם N=2 התחזית היא ממוצע שתי התקופות האחרונות: <bdi dir='ltr'>F7 = (X5 + X6) / 2 = (150 + 146) / 2 = 148</bdi>.<br>טעויות נפוצות: ממוצע שלוש תקופות (N=3) נותן 146; ממוצע כל התקופות נותן 136.83. (מצגת 2, שקף 22)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"מספר המתגייסים ליחידה בשש השנים האחרונות:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>מתגייסים</th><td>2,280</td><td>2,475</td><td>2,850</td><td>3,070</td><td>2,960</td><td>3,110</td></tr></table>מהי התחזית לשנה 7 בשיטת ממוצע נע פשוט עם N=3?",o:["2,960.00","2,790.83","3,046.67","3,035.00"],c:2,e:"בממוצע נע עם N=3 ממצעים את שלוש השנים האחרונות: <bdi dir='ltr'>F7 = (3070 + 2960 + 3110) / 3 = 9140 / 3 = 3046.67</bdi>.<br>שים לב לא לבלבל עם התחזית לשנה 6, שמשתמשת בשנים 3–5 ויוצאת 2960. (מצגת 2, שקף 23)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש השבועי:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>48</td><td>52</td><td>50</td><td>55</td><td>53</td></tr></table>מחשבים תחזיות בשיטת ממוצע נע פשוט עם N=3 לכל התקופות האפשריות (כולל תקופות העבר), כדי לחשב MAD. על כמה תקופות יחושב ה-MAD?",o:["3 תקופות — תקופות 3, 4 ו-5","2 תקופות — תקופות 4 ו-5","5 תקופות — כל התקופות שבטבלה","6 תקופות — כולל התקופה החזויה"],c:1,e:"בממוצע נע עם N=3 אין תחזית לשלוש התקופות הראשונות (״מוחקים״ אותן), ולכן תחזיות בעבר קיימות רק לתקופות 4 ו-5. הסטיות, ומהן MAD ו-MSE, מחושבות רק על תקופות שיש להן גם תחזית וגם ביקוש בפועל — כאן n=2. התחזית לתקופה 6 אינה נכנסת לחישוב, כי אין לה עדיין ערך בפועל. (מצגת 2, שקפים 23, 32; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>30</td><td>34</td><td>31</td><td>37</td><td>36</td></tr></table>חשבו את ה-MAD של שיטת ממוצע נע פשוט עם N=2 על תקופות העבר שיש להן תחזית.",o:["8.42","1.50","7.50","2.50"],c:3,e:"תחזיות N=2: <bdi dir='ltr'>F3 = (30+34)/2 = 32</bdi>, <bdi dir='ltr'>F4 = (34+31)/2 = 32.5</bdi>, <bdi dir='ltr'>F5 = (31+37)/2 = 34</bdi>.<br>סטיות מוחלטות: <bdi dir='ltr'>|31−32| = 1</bdi>, <bdi dir='ltr'>|37−32.5| = 4.5</bdi>, <bdi dir='ltr'>|36−34| = 2</bdi>.<br><bdi dir='ltr'>MAD = (1 + 4.5 + 2) / 3 = 7.5 / 3 = 2.5</bdi> — מחלקים ב-3 (מספר התקופות שיש להן תחזית), לא ב-5. (מצגת 2, שקפים 22, 32)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש החודשי:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>400</td><td>420</td><td>410</td><td>440</td><td>450</td></tr></table>מהי התחזית לחודש 6 בשיטת ממוצע נע משוקלל עם N=2, לפי המוסכמה של ניצן: משקל 1 לתקופה האחרונה והפחתה של 10% לכל תקופה אחורה?",o:["846.00","445.00","445.26","444.74"],c:2,e:"המשקולות: לחודש 5 — 1, לחודש 4 — 0.9. <bdi dir='ltr'>F6 = (440×0.9 + 450×1) / (0.9 + 1) = (396 + 450) / 1.9 = 846 / 1.9 = 445.26</bdi>.<br>טעות נפוצה אחת היא לשכוח לחלק בסכום המשקולות (846). טעות אחרת היא להצמיד את המשקל 1 לתקופה הישנה (444.74). (מצגת 2, שקף 25; הרצאה 11.8)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>60</td><td>64</td><td>70</td><td>68</td><td>75</td><td>78</td></tr></table>מהי התחזית לתקופה 7 בשיטת ממוצע נע משוקלל עם N=3, כשהמשקולות הן 1 לתקופה האחרונה והפחתה של 10% לכל תקופה אחורה (הפחתה ליניארית, כמו בשקף)?",o:["74.01","74.04","73.67","199.90"],c:1,e:"המשקולות לשלוש התקופות האחרונות: 0.8, 0.9, 1 (סכום 2.7). <bdi dir='ltr'>F7 = (68×0.8 + 75×0.9 + 78×1) / 2.7 = (54.4 + 67.5 + 78) / 2.7 = 199.9 / 2.7 = 74.04</bdi>.<br>ההפחתה ליניארית (1, 0.9, 0.8) ולא כפלית (1, 0.9, 0.81). כך בשקף 26 ובהרצאה: ״0.9, 0.8, 0.7, 0.6״. (מצגת 2, שקף 26; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>ביקוש</th><td>200</td><td>220</td><td>215</td><td>240</td></tr></table>הצוות בחר הפחתה של 15%. מהי התחזית לתקופה 5 בממוצע נע משוקלל עם N=3 (משקל 1 לתקופה האחרונה)?",o:["226.18","225.74","225.00","576.75"],c:0,e:"עם הפחתה של 15% המשקולות הן 1, 0.85 ו-0.7 (סכום 2.55). <bdi dir='ltr'>F5 = (220×0.7 + 215×0.85 + 240×1) / 2.55 = (154 + 182.75 + 240) / 2.55 = 576.75 / 2.55 = 226.18</bdi>.<br>בהרצאה 11.8: ״כמה זה 1 פחות 15%? 0.85. כמה זה 0.85 פחות 15%? 0.7״. (מצגת 2, שקף 26; הרצאה 11.8)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש ועמודת המשקולות, בדיוק כמו בשקף 26 (משקל 1 לתקופה האחרונה, והפחתה של 0.1 לכל תקופה אחורה):<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>40</td><td>44</td><td>50</td><td>48</td><td>54</td></tr><tr><th>משקל W<sub>t</sub></th><td>0.60</td><td>0.70</td><td>0.80</td><td>0.90</td><td>1</td></tr></table>מהי התחזית <b>לתקופה 4</b> (תחזית עבר, לצורך חישוב הסטייה) בממוצע נע משוקלל עם N=3?",o:["44.67","45.04","45.14","94.80"],c:2,e:"המשקל צמוד לתקופה ולא למיקום בחלון. לכן התחזית לתקופה 4 משתמשת במשקולות של תקופות 1–3: 0.6, 0.7 ו-0.8. <bdi dir='ltr'>F4 = (40×0.6 + 44×0.7 + 50×0.8) / (0.6+0.7+0.8) = (24 + 30.8 + 40) / 2.1 = 94.8 / 2.1 = 45.14</bdi>.<br>כך חושבו בשקף 26 תחזיות העבר, למשל <bdi dir='ltr'>F2016 = (1282×0.4 + 1447×0.5 + 1972×0.6) / 1.5 = 1613</bdi>. שימוש ב-1, 0.9 ו-0.8 לכל חלון נותן 45.04. (מצגת 2, שקפים 25–26)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>10</td><td>14</td><td>15</td><td>19</td><td>22</td></tr></table>נתון: <bdi dir='ltr'>Σx = 15, Σy = 80, Σxy = 269, Σx² = 55</bdi> (X = מספר התקופה). מהו שיפוע קו הרגרסיה b?",o:["2.90","5.48","4.89","7.30"],c:0,e:"<bdi dir='ltr'>b = (nΣxy − ΣxΣy) / (nΣx² − (Σx)²) = (5×269 − 15×80) / (5×55 − 15²) = (1345 − 1200) / (275 − 225) = 145 / 50 = 2.9</bdi>.<br>הביקוש עולה בממוצע ב-2.9 יחידות בכל תקופה. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"לאותם נתונים (<bdi dir='ltr'>n = 5, Σx = 15, Σy = 80</bdi>) התקבל שיפוע <bdi dir='ltr'>b = 2.9</bdi>. מהו החותך a, ומהי התחזית לתקופה 6?",o:["a = 16; התחזית לתקופה 6 היא 33.4","a = 3; התחזית לתקופה 6 היא 20.4","a = 7.3; התחזית לתקופה 6 היא 21.8","a = 7.3; התחזית לתקופה 6 היא 24.7"],c:3,e:"<bdi dir='ltr'>ȳ = 80/5 = 16, x̄ = 15/5 = 3</bdi><br><bdi dir='ltr'>a = ȳ − b·x̄ = 16 − 2.9×3 = 7.3</bdi>.<br><bdi dir='ltr'>F6 = a + b×6 = 7.3 + 17.4 = 24.7</bdi>.<br>טעויות נפוצות: להשתמש ב-ȳ במקום a, או להציב X=5 במקום X=6. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"ביקוש שנתי למוצר ישן שהולך ויוצא מהשוק:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>200</td><td>190</td><td>185</td><td>170</td><td>160</td><td>155</td></tr></table>חשבו את קו הרגרסיה (X = מספר התקופה) ואת התחזית לתקופה 7.",o:["209.67","275.67","143.67","153.10"],c:2,e:"<bdi dir='ltr'>Σx = 21, Σy = 1060, Σxy = 3,545, Σx² = 91</bdi>.<br><bdi dir='ltr'>b = (6×3,545 − 21×1060) / (6×91 − 21²) = (21,270 − 22,260) / 105 = -9.43</bdi><br><bdi dir='ltr'>a = 1060/6 − (-9.43)×3.5 = 209.67</bdi>.<br><bdi dir='ltr'>F7 = 209.67 + (-9.43)×7 = 143.67</bdi> — השיפוע שלילי, כי הביקוש יורד. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"לנתוני הביקוש <bdi dir='ltr'>10, 14, 15, 19, 22</bdi> (תקופות 1–5) נתון גם <bdi dir='ltr'>Σy² = 1366</bdi>. מהו מקדם המתאם R, ומה משמעותו?",o:["R ≈ 0.99 — קשר ליניארי חזק וחיובי","R ≈ 2.9 — הקשר חזק מאוד, כי R גדול מ-1","R ≈ 0.98 — זהו R², והקשר חלש","R ≈ −0.99 — קשר ליניארי חזק ושלילי"],c:0,e:"<bdi dir='ltr'>R = (nΣxy − ΣxΣy) / √[(nΣx² − (Σx)²)(nΣy² − (Σy)²)] = 145 / √(50 × (5×1366 − 80²)) = 145 / √(50×430) = 145 / 146.63 ≈ 0.99</bdi>.<br>R קרוב ל-1, ולכן הקשר הליניארי חזק וחיובי. ערכי R נעים בין −1 ל-1, ובקורס עובדים עם R ולא עם R² (הרצאה 4.8). (מצגת 2, שקף 15)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"בדוגמת הכיתה (גיוס חרדים 2013–2019, X = 1..7) התקבל קו הרגרסיה <bdi dir='ltr'>Y = 957.57 + 309.75X</bdi>. מהי התחזית לשנת 2020, ומה משמעות השיפוע?",o:["3,435.57 — הגיוס גדל בכ-310 מתגייסים בשנה","626,653 — הגיוס גדל בכ-958 מתגייסים בשנה","3,125.82 — הגיוס גדל בכ-310 מתגייסים בשנה","3,435.57 — הגיוס גדל בכ-958 מתגייסים בשנה"],c:0,e:"לשנת 2020 מציבים X=8 (ולא את השנה עצמה): <bdi dir='ltr'>F = 957.57 + 309.75×8 = 3435.57</bdi> — בשקף ״3436״. השיפוע b=309.75 הוא הגידול השנתי הממוצע, ו-a=957.57 הוא נקודת החיתוך. הצבת X=7 נותנת את תחזית 2019 (3125.82), והצבת 2020 במקום 8 נותנת מספר חסר משמעות. (מצגת 2, שקפים 19–20, 34)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"להלן הביקוש בפועל והתחזית של שיטה מסוימת:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>בפועל X<sub>t</sub></th><td>100</td><td>110</td><td>105</td><td>115</td></tr><tr><th>תחזית F<sub>t</sub></th><td>104</td><td>106</td><td>108</td><td>110</td></tr></table>מהו ה-MAD, ומהו ה-MSE?",o:["MAD = 16; MSE = 66","MAD = 4; MSE = 16.50","MAD = 4; MSE = 16","MAD = 0.50; MSE = 16.50"],c:1,e:"סטיות מוחלטות: 4, 4, 3, 5; ריבועיהן: 16, 16, 9, 25.<br><bdi dir='ltr'>MAD = (4+4+3+5)/4 = 16/4 = 4</bdi><br><bdi dir='ltr'>MSE = (16+16+9+25)/4 = 66/4 = 16.5</bdi>.<br>בלי ערך מוחלט הסטיות מתקזזות (0.5), וריבוע ה-MAD אינו ה-MSE. (מצגת 2, שקף 32)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"שתי שיטות חיזוי נבחנו על אותן ארבע תקופות:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>בפועל</th><td>50</td><td>54</td><td>52</td><td>58</td></tr><tr><th>שיטה א׳</th><td>51</td><td>52</td><td>55</td><td>56</td></tr><tr><th>שיטה ב׳</th><td>49</td><td>55</td><td>52</td><td>53</td></tr></table>איזו שיטה עדיפה לפי MAD, ואיזו לפי MSE?",o:["לפי MAD — שיטה א׳ (2 מול 1.75); לפי MSE — שיטה ב׳ (6.75 מול 4.5)","לפי MAD — שיטה ב׳ (1.75 מול 2); לפי MSE — שיטה א׳ (4.50 מול 6.75)","שיטה ב׳ עדיפה בשני המדדים (MAD של 1.75 מול 2, ו-MSE של 4.5 מול 6.75)","שיטה א׳ עדיפה בשני המדדים (MAD של 2 מול 1.75, ו-MSE של 4.5 מול 6.75)"],c:1,e:"שיטה א׳: סטיות 1, 2, 3, 2 — <bdi dir='ltr'>MAD = 8/4 = 2</bdi>, <bdi dir='ltr'>MSE = (1+4+9+4)/4 = 4.5</bdi>.<br>שיטה ב׳: סטיות 1, 1, 0, 5 — <bdi dir='ltr'>MAD = 7/4 = 1.75</bdi>, <bdi dir='ltr'>MSE = (1+1+0+25)/4 = 6.75</bdi>.<br>ה-MSE מעניש סטייה גדולה אחת (5) יותר מה-MAD, ולכן השיטות מתחלפות. בוחרים קריטריון אחד מראש ומאמצים את השיטה שממזערת אותו. (מצגת 2, שקפים 32–33)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"טבלת ההשוואה של חמש שיטות על אותם נתונים:<br><table><tr><th>שיטה</th><th>MAD</th><th>MSE</th></tr><tr><td>רגרסיה</td><td>18.4</td><td>512</td></tr><tr><td>ממוצע נע N=2</td><td>15.2</td><td>401</td></tr><tr><td>ממוצע נע N=3</td><td>21.7</td><td>655</td></tr><tr><td>משוקלל N=2</td><td>14.8</td><td>389</td></tr><tr><td>משוקלל N=3</td><td>19.9</td><td>590</td></tr></table>באיזו שיטה יש לבחור לפי כלל הבחירה במצגת?",o:["ממוצע נע משוקלל N=2 — הנמוך ביותר גם ב-MAD וגם ב-MSE","רגרסיה — השיטה המתאימה תמיד לנתונים שיש בהם מגמה עולה","ממוצע נע N=3 — הגבוה ביותר בשני המדדים, ולכן השמרני ביותר","ממוצע נע N=2 — השני בדירוג בשני המדדים, ולכן היציב ביותר"],c:0,e:"לפי שקף 33, המודל הנבחר הוא זה שמביא את הקריטריון (MAD או MSE) למינימום. כאן הממוצע המשוקלל עם N=2 נמוך ביותר בשניהם (14.8 ו-389), ולכן ההכרעה ברורה. הרגרסיה אינה עדיפה ״תמיד״: בהרצאה נאמר שלא בטוח שהיא טובה יותר מהממוצע הנע, ולכן משווים. (מצגת 2, שקפים 33–34; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>80</td><td>86</td><td>83</td><td>90</td><td>88</td></tr></table>חשבו את ה-MSE של שיטת ממוצע נע פשוט עם N=2.",o:["32.50","2.33","6.50","10.83"],c:3,e:"תחזיות: <bdi dir='ltr'>F3 = (80+86)/2 = 83</bdi>, <bdi dir='ltr'>F4 = (86+83)/2 = 84.5</bdi>, <bdi dir='ltr'>F5 = (83+90)/2 = 86.5</bdi>.<br>סטיות: <bdi dir='ltr'>|83−83| = 0</bdi>, <bdi dir='ltr'>|90−84.5| = 5.5</bdi>, <bdi dir='ltr'>|88−86.5| = 1.5</bdi>.<br><bdi dir='ltr'>MSE = (0² + 5.5² + 1.5²) / 3 = (0 + 30.25 + 2.25) / 3 = 32.5 / 3 = 10.83</bdi>. (מצגת 2, שקפים 22, 32)",k:"calc"},

(function(){
