/* שא 7 — אסטרטגיות שרשרת אספקה — שרשרת אספקה זמישה (שלמה ארליך), 36 שאלות */
/* מהי שרשרת האספקה — רשת, הלקוח כחלק מהשרשרת, מידע וכסף */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי הגדרת שרשרת האספקה במצגת, איזה מההיגדים הבאים <b>אינו</b> נכון?",o:["השרשרת כוללת את כל השלבים בתהליך, מייצור חומרי הגלם ועד האספקה ללקוח","הלקוח הסופי נמצא מחוץ לשרשרת, שכן השרשרת מסתיימת אצל הקמעונאי","השרשרת כוללת לא רק תנועה של חומר אלא גם תנועה של מידע וכסף בין מרכיביה","מובילים, מחסנים וסיטונאים הם חלק ממרכיבי השרשרת החוץ-ארגונית"],c:1,e:"המצגת מדגישה במפורש כי הלקוח מהווה חלק מהשרשרת, ולכן ההיגד שהשרשרת מסתיימת אצל הקמעונאי שגוי. שאר ההיגדים לקוחים ישירות מההגדרה: כל השלבים מחומרי הגלם ועד הלקוח, תנועת חומר, מידע וכסף, ומובילים, מחסנים וסיטונאים כמרכיבים חוץ-ארגוניים. (שא-7, שקף 8)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן ציוד רפואי הפסיק לרכז את כל המשלוחים במחסן מרכזי: חלק מהספקים שולחים כעת ערכות ישירות לבתי החולים, ותהליכי הרכש, הייצור וההפצה מתנהלים במקביל ולא בטור. איזה מושג מהמצגת מתאר את המעבר?",o:["מעבר משרשרת אספקה לרשת אספקה — תהליכים מקבילים ומשלוח ישיר מהספקים ללקוחות","מעבר משרשרת אספקה לשרשרת ביקוש — תכנון על בסיס מידע מהשוק ולא על בסיס מלאי בארגון","מעבר מתהליכי דחיפה לתהליכי משיכה — ייצור והפצה רק לאחר קבלת הזמנת הלקוח","מעבר ממרכז עלות למרכז רווח — מדידת השרשרת לפי תרומתה לרווח ולא לפי עלויותיה"],c:0,e:"המצגת מתארת את המעבר מ״שרשרת אספקה״ ל״רשת אספקה״ באמצעות שני מאפיינים בדיוק: תהליכים מקבילים ומשלוח ישיר מהספקים ללקוחות — כפי שבתרחיש. שרשרת ביקוש עוסקת בתכנון לפי מידע מהשוק, ומשיכה עוסקת בעיתוי הייצור ביחס להזמנה, ולא במבנה הרשת. (שא-7, שקף 8)"},
/* Push/Pull ונקודת הניתוק */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"רשת חנויות רהיטים מייצרת שלדי ספות בדגמים סטנדרטיים לפי תחזית ומחזיקה אותם במחסן; ריפוד הבד בצבע שבחר הלקוח מתבצע רק לאחר שהלקוח מזמין בחנות. היכן עוברת נקודת הניתוק <bdi dir='ltr'>(Push/Pull boundary)</bdi> בשרשרת זו?",o:["ברכש חומרי הגלם — כל השלבים שאחרי הרכש נחשבים לתהליכי משיכה הנובעים מהביקוש בפועל","במסירה ללקוח — כל השלבים עד המסירה, כולל הריפוד, נחשבים לתהליכי דחיפה לפי תחזית","בקבלת הזמנת הלקוח — ייצור השלדים למלאי עד שלב זה הוא <bdi dir='ltr'>Push</bdi>, והריפוד לאחריו הוא <bdi dir='ltr'>Pull</bdi>","בתכנון התחזית — התחזית היא שמושכת את הייצור ולכן כל השרשרת, כולל הריפוד, היא <bdi dir='ltr'>Pull</bdi>"],c:2,e:"לפי המצגת, נקודת הניתוק בין דחיפה למשיכה היא קבלת הזמנת הלקוח: עד אליה מייצרים לתחזית ולמלאי <bdi dir='ltr'>(Push)</bdi>, ואחריה מבצעים לפי ההזמנה <bdi dir='ltr'>(Pull)</bdi>. ייצור השלדים למלאי הוא <bdi dir='ltr'>Push</bdi>, והריפוד לפי בחירת הלקוח הוא <bdi dir='ltr'>Pull</bdi>. תחזית אינה ״מושכת״ ייצור — ייצור לתחזית הוא עצם ההגדרה של דחיפה. (שא-7, שקף 9)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מה מאפיין תהליך <bdi dir='ltr'>Push</bdi> (דחיפה) בשרשרת האספקה, לפי המצגת?",o:["ייצור המתחיל רק לאחר קבלת הזמנת לקוח, ללא החזקת מלאי של מוצרים גמורים","העברת מידע על הביקוש בפועל מהלקוח אל הספקים לאורך כל השרשרת","משלוח ישיר מהספקים ללקוחות תוך ביטול המחסנים והסיטונאים בשרשרת","ייצור והחזקת מלאי על בסיס תחזית, עוד לפני שהתקבלה הזמנת לקוח"],c:3,e:"תהליך <bdi dir='ltr'>Push</bdi> הוא ייצור לתחזית ולמלאי — הפעילות מתבצעת לפני שיש הזמנת לקוח, והמלאי נדחף לאורך השרשרת. ייצור שמתחיל רק לאחר הזמנת לקוח הוא ההגדרה של <bdi dir='ltr'>Pull</bdi> (משיכה), והמסיחים האחרים מתארים זרימת מידע ורשת אספקה, לא את מנגנון הדחיפה. (שא-7, שקף 9)"},
/* חמש מטרות שרשרת האספקה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברת הפצה חישבה כי ההכנסות מלקוחותיה בשנה האחרונה היו 12 מיליון ש״ח, בעוד סך העלויות של כל חוליות השרשרת — רכש, ייצור, אחסון והובלה — הסתכם ב-9 מיליון ש״ח. איזו ממטרות שרשרת האספקה מבטא ההפרש שחושב?",o:["<bdi dir='ltr'>Supply Chain Value</bdi> — הערך הכולל שהשרשרת יוצרת עבור הלקוח ועבור הארגון","<bdi dir='ltr'>Supply Chain Profitability</bdi> — ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת","<bdi dir='ltr'>Supply Chain Value Proposition</bdi> — הצעת הערך שהשרשרת מציעה ללקוחותיה","יצירת ערך מוסף לארגון — תרומת השרשרת לחוסנו התחרותי של הארגון"],c:1,e:"<bdi dir='ltr'>Supply Chain Profitability</bdi> מוגדרת במצגת בדיוק כך: ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת — כאן 12 פחות 9, כלומר 3 מיליון ש״ח. <bdi dir='ltr'>Supply Chain Value</bdi> הוא הערך שהשרשרת יוצרת (מושג רחב יותר, לא חישוב רווח), והצעת הערך היא מה שמוצע ללקוח, לא תוצאה כספית. (שא-7, שקף 10)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם חמש מטרות שרשרת האספקה כפי שהן מפורטות במצגת?",o:["מעבר מניהול השרשרת כמרכז עלות <bdi dir='ltr'>(Cost Center)</bdi> לניהולה כמרכז רווח <bdi dir='ltr'>(Profit Center)</bdi>","ניסוח הצעת הערך של השרשרת — <bdi dir='ltr'>Supply Chain Value Proposition</bdi>","צמצום מספר הספקים והמפיצים בשרשרת כדי לפשט את ניהולה השוטף","יצירת ערך מוסף לארגון באמצעות פעילות שרשרת האספקה"],c:2,e:"חמש המטרות במצגת הן: יצירת ערך מוסף לארגון, <bdi dir='ltr'>Supply Chain Value, Supply Chain Profitability, Supply Chain Value Proposition</bdi> ומעבר ממרכז עלות למרכז רווח. צמצום מספר הספקים והמפיצים אינו מופיע ברשימה — הוא לכל היותר החלטה תפעולית, לא מטרה של השרשרת. (שא-7, שקף 10)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מנכ״לית של יצרן מזון החליטה שמערך הלוגיסטיקה יפסיק להימדד רק לפי חיסכון בהוצאות, ויימדד לפי תרומתו להכנסות — למשל באמצעות שירותי משלוח מהיר בתשלום. איזו ממטרות שרשרת האספקה מתבטאת בהחלטה?",o:["מעבר מניהול השרשרת כמרכז עלות <bdi dir='ltr'>(Cost Center)</bdi> לניהולה כמרכז רווח <bdi dir='ltr'>(Profit Center)</bdi>","חישוב <bdi dir='ltr'>Supply Chain Profitability</bdi> — ההפרש בין ההכנסות מהלקוח לעלויות השרשרת","הגדרת <bdi dir='ltr'>Supply Chain Value</bdi> — כימות הערך שהשרשרת יוצרת עבור לקוחות הארגון","ניסוח <bdi dir='ltr'>Supply Chain Value Proposition</bdi> — הצעת הערך של השרשרת לשוק היעד"],c:0,e:"המטרה החמישית במצגת היא מעבר ממרכז עלות למרכז רווח: השרשרת נמדדת לפי תרומתה להכנסות ולרווח ולא רק לפי הוצאותיה — בדיוק השינוי במדידה שבתרחיש. <bdi dir='ltr'>Supply Chain Profitability</bdi> הוא חישוב של הפרש בין הכנסות לעלויות, ולא שינוי בתפיסת הניהול של המערך. (שא-7, שקף 10)"},
/* מרכיבי האסטרטגיה והחלטות אסטרטגיות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית ציוד ספורט שוקלת אם להמשיך לייצר את מסגרות האופניים במפעלה או להעביר את הייצור לקבלן חיצוני ולהשאיר בבית רק את התכנון והשיווק. לאיזו החלטה אסטרטגית בשרשרת האספקה שייכת הסוגיה?",o:["הקצאת מוצרים לאחסון — קביעה איזה מוצר יאוחסן בכל אחד מהמחסנים","<bdi dir='ltr'>BCP</bdi> — תוכנית המשכיות עסקית למקרה של השבתת אתר הייצור המרכזי או של ספק קריטי","שיטות שילוח והפצה — בחירת המודלים ומסלולי ההפצה ללקוחות","<bdi dir='ltr'>Make or Buy</bdi> — הבחירה בין ייצור עצמי <bdi dir='ltr'>(In-house)</bdi> לבין מיקור חוץ <bdi dir='ltr'>(Outsourcing)</bdi>"],c:3,e:"השאלה אם לייצר בעצמך או לרכוש מקבלן היא בדיוק החלטת <bdi dir='ltr'>Make or Buy</bdi> — <bdi dir='ltr'>In-house</bdi> מול <bdi dir='ltr'>Outsourcing</bdi> — הנמנית עם ההחלטות האסטרטגיות בשרשרת. <bdi dir='ltr'>BCP</bdi> עוסק בהמשכיות עסקית בעת משבר, והקצאת מוצרים למחסנים ושיטות ההפצה עוסקות בשלבים שלאחר הייצור. (שא-7, שקף 11)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לאחר שמפעל יחיד של ספק קריטי הושבת בשריפה, חברה מיפתה אתרי ייצור ומחסנים חלופיים ותכננה מראש כיצד תמשיך לספק ללקוחותיה במקרה של השבתה נוספת. איזה מרכיב בהחלטות האסטרטגיות של השרשרת בא לידי ביטוי?",o:["<bdi dir='ltr'>R</bdi>&<bdi dir='ltr'>R</bdi> — הגדרת תחומי האחריות של כל חוליה וכל גורם בשרשרת","<bdi dir='ltr'>BCP</bdi> — תוכנית המשכיות עסקית כחלק מהחלטות המיקום של יצרנים, ספקים ומחסנים","<bdi dir='ltr'>KPI</bdi> — קביעת מדדי ביצוע להזמנות, למלאי ולהובלה לאורך השרשרת ובכל אחת מחוליותיה","<bdi dir='ltr'>Sourcing</bdi> — הגדרת עיסוקי הליבה והעברת שאר הפעילויות למיקור חוץ אצל ספקים מומחים"],c:1,e:"במצגת, החלטות המיקום (יצרנים, ספקים, מחסנים) כוללות <bdi dir='ltr'>BCP</bdi> — תוכנית המשכיות עסקית, שמטרתה להבטיח המשך אספקה גם כשאתר מושבת, כמו בתרחיש. <bdi dir='ltr'>R</bdi>&<bdi dir='ltr'>R</bdi> עוסק בחלוקת אחריות, <bdi dir='ltr'>KPI</bdi> במדידה, ו-<bdi dir='ltr'>Sourcing</bdi> בהגדרת הליבה ומיקור חוץ — אף אחד מהם אינו תכנון להתמודדות עם השבתה. (שא-7, שקף 11)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם מרכיבי אסטרטגיית שרשרת האספקה כפי שהם מפורטים במצגת, אלא שייך לאסטרטגיה ארגונית אחרת?",o:["הגדרת התפיסה האסטרטגית של השרשרת — יעילות מול זמישות — כנגזרת מהאסטרטגיה הארגונית","קביעת מדיניות מלאי נפרדת לחומרי גלם, מלאי בתהליך, תוצרת גמורה ומלאי שירות","<bdi dir='ltr'>Segmentation</bdi> של השווקים והלקוחות ו-<bdi dir='ltr'>Positioning</bdi> של המוצרים בכל פלח שוק","בחירת מערכת המידע שתתמוך בשרשרת ובחירת שיטות השילוח וההפצה"],c:2,e:"<bdi dir='ltr'>Segmentation</bdi> ו-<bdi dir='ltr'>Positioning</bdi> מופיעים במצגת כמרכיבי אסטרטגיית השיווק (יחד עם המחרה וקידום מכירות), ולא כמרכיב של אסטרטגיית שרשרת האספקה. התפיסה האסטרטגית, מדיניות המלאי לסוגיו, מערכת המידע ושיטות השילוח וההפצה מופיעים כולם ברשימת מרכיבי אסטרטגיית השרשרת. (שא-7, שקפים 11–14)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מנהל תפעול מגדיר כללים שונים לכל סוג מלאי: רמת מלאי חומרי הגלם, היקף המלאי בתהליך, כמות התוצרת הגמורה במחסנים והיקף מלאי חלקי החילוף לשירות. איזה מרכיב באסטרטגיית שרשרת האספקה בא לידי ביטוי?",o:["מלאי — הגדרת מדיניות מלאי נפרדת לכל אחד מסוגי המלאי בשרשרת","הובלה — קביעת מודלים ומסלולי הפצה לאורך שרשרת האספקה ועד הלקוח הסופי","<bdi dir='ltr'>Sourcing</bdi> — הגדרת עיסוקי הליבה של הארגון והעברת פעילויות למיקור חוץ","<bdi dir='ltr'>KPI</bdi> — קביעת מדדי ביצוע להזמנות, למלאי ולהובלה בשרשרת"],c:0,e:"המצגת מונה במרכיב המלאי ארבעה סוגים — חומרי גלם, מלאי בתהליך, תוצרת גמורה ומלאי שירות — ודורשת מדיניות מלאי לכל אחד מהם, בדיוק כפי שהמנהל עושה. <bdi dir='ltr'>KPI</bdi> עוסק במדידת ביצועים ולא בקביעת כללי ניהול, ו-<bdi dir='ltr'>Sourcing</bdi> והובלה עוסקים בליבה ובהפצה. (שא-7, שקף 12)"},
/* זמישות — הגדרה ומרכיבים */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"כיצד מגדירה המצגת את המושג ״זמישות״ <bdi dir='ltr'>(Agility)</bdi>?",o:["זמינות + זולות + יעילות — יכולת לספק את המוצר במחיר הנמוך ביותר בשוק","זריזות + דיוק + אמינות — יכולת לעמוד בתחזית ובלוח הזמנים שנקבע מראש","גמישות + ריכוזיות + סטנדרטיזציה — יכולת לייצר מגוון רחב במפעל אחד","זמינות + זריזות + גמישות — יכולת התאמה מהירה לנסיבות משתנות"],c:3,e:"המצגת מפרקת את המילה ״זמישות״ לשלושת מרכיביה: זמינות, זריזות וגמישות, ומגדירה אותה כיכולת התאמה מהירה לנסיבות משתנות ולצעדי המתחרים. זולות ויעילות שייכות לעולם ה-<bdi dir='ltr'>Lean</bdi>, ואמינות ודיוק בתחזית אינם חלק מההגדרה. (שא-7, שקף 15)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית משקאות זיהתה בתוך שבועיים שמתחרה השיקה טעם חדש שזוכה להצלחה, שינתה את תוכנית הייצור, הוסיפה קו טעמים והגיעה למדפים לפני שהמתחרה ביססה את מעמדה. איזו יכולת, כפי שהוגדרה במצגת, הפגינה החברה?",o:["<bdi dir='ltr'>Lean</bdi> — יכולת לייצר ביעילות מרבית תוך צמצום כל בזבוז ומלאי עודף בתהליך הייצור","<bdi dir='ltr'>Agility</bdi> — יכולת להגיב מהר לנסיבות משתנות ולצעדים שנוקטות חברות מתחרות","<bdi dir='ltr'>JIT</bdi> — יכולת לספק את המוצר בדיוק בזמן הנדרש ללא החזקת מלאי ביניים לאורך השרשרת","<bdi dir='ltr'>BCP</bdi> — יכולת להמשיך לפעול ולספק ללקוחות גם לאחר משבר או השבתה של אתר ייצור"],c:1,e:"המצגת מגדירה <bdi dir='ltr'>Agility</bdi> כיכולת של ארגון להגיב מהר לנסיבות המשתנות ולצעדים שנוקטות חברות מתחרות — ולעיתים אף כתנאי להישרדותו. התגובה המהירה להשקת המתחרה היא בדיוק זו. <bdi dir='ltr'>Lean</bdi> עוסק ביעילות ובצמצום בזבוז, ו-<bdi dir='ltr'>BCP</bdi> בהמשכיות לאחר משבר, לא בתגובה תחרותית. (שא-7, שקף 15)"},
/* אסטרטגיה ארגונית ← אסטרטגיית שרשרת */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן רכיבים לתעשיית הרכב מתחרה בעיקר על <bdi dir='ltr'>Lead Time</bdi> קצר ועל <bdi dir='ltr'>Time to Market</bdi> מהיר של דגמים חדשים. לפי המצגת, איזו אסטרטגיה ארגונית מנחה את החברה, ואיזו אסטרטגיית שרשרת נגזרת ממנה?",o:["אסטרטגיית עלות; ממנה נגזרת שרשרת יעילה המדגישה נצילות משאבים גבוהה","אסטרטגיית איכות; ממנה נגזרת שרשרת המדגישה תהליכי בדיקה ואמינות","אסטרטגיית זמן; ממנה נגזרת שרשרת תגובתית המדגישה אפקטיביות","אסטרטגיית גמישות; ממנה נגזרת שרשרת המדגישה מגוון מוצרים ו-<bdi dir='ltr'>MOQ</bdi> נמוך"],c:2,e:"במצגת, <bdi dir='ltr'>Lead Time</bdi> ו-<bdi dir='ltr'>Time to Market</bdi> הם המרכיבים של אסטרטגיית ה״זמן״ הארגונית, וממנה נגזרת שרשרת תגובתית/אפקטיבית. אסטרטגיית גמישות עוסקת במגוון מוצרים וב-<bdi dir='ltr'>MOQ</bdi>, ואסטרטגיית עלות — בחומרי גלם, עבודה ותקורה — מובילה לשרשרת יעילה, לא לזו שבתרחיש. (שא-7, שקף 17)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי המצגת, מהו הרצף שבו אסטרטגיית שרשרת האספקה נגזרת ומתורגמת לתוצאות?",o:["אסטרטגיה ארגונית ← אסטרטגיית שרשרת (עלות/יעילות מול תגובתיות/אפקטיביות) ← יכולות ← ביצועים","ביצועים ← יכולות ← אסטרטגיית שרשרת ← אסטרטגיה ארגונית, שכן התוצאות בשטח מכתיבות את האסטרטגיה","אסטרטגיית שרשרת ← אסטרטגיה ארגונית ← ביצועים ← יכולות, שכן השרשרת היא ליבת הפעילות של הארגון","יכולות ← אסטרטגיה ארגונית ← אסטרטגיית שרשרת ← ביצועים, שכן היכולות הקיימות קובעות את כיוון הארגון"],c:0,e:"המצגת מציגה את אסטרטגיית השרשרת כנגזרת מהאסטרטגיה הארגונית (איכות, זמן, גמישות, עלות): הבחירה בין עלות/יעילות לתגובתיות/אפקטיביות מגדירה את היכולות הנדרשות, ואלה מניבות את הביצועים. הרצפים ההפוכים הופכים את הסיבה והתוצאה. (שא-7, שקף 17)"},
/* התאמה אסטרטגית / החזית האסטרטגית */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברה משווקת מלח שולחני — מוצר בסיסי בעל ביקוש יציב וידוע לאורך כל השנה. לפי מודל ״ההתאמה האסטרטגית״, איזו שרשרת אספקה מתאימה לה?",o:["שרשרת תגובתית — כדי להבטיח שהמוצר לעולם לא יחסר על המדף בחנויות הרשת","שרשרת זמישה — כדי להגיב במהירות לכל שינוי קטן בהעדפות הצרכנים בשוק","שרשרת <bdi dir='ltr'>Hedge and deploy</bdi> — החזקת מלאי גדול כדי לגדר את אי-הוודאות בביקוש","שרשרת יעילה — לביקוש ידוע ויציב מתאימה שרשרת המדגישה עלות נמוכה"],c:3,e:"במודל ההתאמה האסטרטגית, ביקוש ידוע ויציב ממוקם בקצה הנמוך של ציר אי-הוודאות, ותחום ההתאמה (האלכסון) מצמיד לו שרשרת יעילה שמדגישה עלות נמוכה. שרשרת תגובתית או זמישה נושאת עלויות תגובתיות שאינן נדרשות כשאין אי-ודאות בביקוש. (שא-7, שקפים 18–19)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"סטארט-אפ משיק מכשיר אלקטרוני חדשני שאין לו נתוני עבר על הביקוש, והתחזיות נעות בטווח רחב מאוד. איזה שילוב של אי-ודאות ביקוש ותגובתיות שרשרת נמצא, במקרה זה, בתחום ההתאמה האסטרטגית?",o:["אי-ודאות ביקוש גבוהה יחד עם שרשרת יעילה","אי-ודאות ביקוש גבוהה יחד עם שרשרת תגובתית","אי-ודאות ביקוש נמוכה יחד עם שרשרת תגובתית","אי-ודאות ביקוש נמוכה יחד עם שרשרת יעילה"],c:1,e:"מוצר חדש ללא היסטוריה ועם תחזית רחבה ממוקם גבוה בציר אי-ודאות הביקוש, ותחום ההתאמה (האלכסון) דורש לו שרשרת תגובתית. שילוב של אי-ודאות גבוהה עם שרשרת יעילה נמצא מחוץ לאלכסון — השרשרת לא תוכל להגיב לסטיות מהתחזית. (שא-7, שקף 19)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית נייר טואלט — מוצר בעל ביקוש יציב ותחזית מדויקת — בנתה שרשרת עם קיבולת ייצור גמישה, מלאי ביטחון גדול וספקים מהירים ויקרים. כיצד יאופיין מצב זה לפי מודל ההתאמה האסטרטגית?",o:["התאמה מלאה: מוצר בסיסי מחייב תגובתיות גבוהה כדי למנוע חוסרים על המדף בכל מחיר ובכל עונה של השנה","חוסר התאמה: השרשרת יעילה מדי ואינה מסוגלת להגיב לשינויים בביקוש למוצר","חוסר התאמה: השרשרת נמצאת מחוץ לאלכסון ונושאת עלויות תגובתיות שהביקוש היציב אינו מצדיק","התאמה חלקית: ביקוש יציב מחייב שרשרת תגובתית, אך מלאי הביטחון הגדול מיותר"],c:2,e:"ביקוש יציב וצפוי דורש שרשרת יעילה; קיבולת גמישה, מלאי ביטחון וספקים יקרים הם מאפייני שרשרת תגובתית, ולכן החברה נמצאת מחוץ לאלכסון ההתאמה ומשלמת על תגובתיות שאינה נחוצה. המסיח ״יעילה מדי״ הפוך למציאות בתרחיש — השרשרת תגובתית מדי, לא יעילה מדי. (שא-7, שקף 19)"},
/* טבלת רמות אי-הוודאות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מוצר מסוים מאופיין באי-דיוק בתחזית של כ-10%, בהיקף חוסרים של 1–2% ובסטיית עונתיות אפסית. לפי טבלת רמות אי-הוודאות במצגת, כיצד יסווג המוצר ומהי רמת הרווחיות הצפויה בקבוצה שלו?",o:["ביקוש ואספקה ידועים וצפויים — אי-ודאות נמוכה ורווחיות נמוכה","ביקוש ואספקה לא צפויים — אי-ודאות גבוהה ורווחיות גבוהה","ביקוש לא ידוע ואספקה ידועה — אי-ודאות בינונית ורווחיות בינונית","ביקוש ואספקה ידועים וצפויים — אי-ודאות נמוכה ורווחיות גבוהה"],c:0,e:"הערכים בתרחיש — אי-דיוק בתחזית כ-10%, חוסרים 1–2%, עונתיות 0% — הם בדיוק העמודה של ביקוש ואספקה ידועים וצפויים, שבה אי-הוודאות נמוכה והרווחיות נמוכה. המסיח האחרון מסווג נכון אך משייך לקבוצה רווחיות גבוהה, שבטבלה מאפיינת דווקא את המוצרים באי-ודאות גבוהה. (שא-7, שקף 20)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי טבלת רמות אי-הוודאות במצגת, אילו ערכים מאפיינים מוצרים שהביקוש והאספקה שלהם אינם צפויים (אי-ודאות גבוהה)?",o:["אי-דיוק בתחזית כ-10%, היקף חוסרים 1–2%, סטיית עונתיות 0%","אי-דיוק בתחזית 10–25%, היקף חוסרים 40–100%, סטיית עונתיות 1–2% בלבד","אי-דיוק בתחזית 1–2%, היקף חוסרים 0%, סטיית עונתיות 40–100%","אי-דיוק בתחזית 40–100%, היקף חוסרים 10–40%, סטיית עונתיות 10–25%"],c:3,e:"בעמודת אי-הוודאות הגבוהה בטבלה: אי-דיוק בתחזית 40–100%, היקף חוסרים 10–40% וסטיית עונתיות 10–25%, לצד רווחיות גבוהה. הערכים 10%, 1–2% ו-0% שייכים לעמודת אי-הוודאות הנמוכה, והמסיחים האחרים מערבבים את הטווחים בין השורות. (שא-7, שקף 20)"},
/* Who needs Agile — 80/20 */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ביצרנית כלי בית, 20% מהפריטים מייצרים כ-80% מהביקוש, ואילו 80% מהפריטים הנותרים מייצרים רק כ-20% ממנו. לפי שקף ״<bdi dir='ltr'>Who needs Agile Supply Chain</bdi>?״, כיצד יש לנהל את הקבוצה הגדולה של הפריטים בעלי הביקוש הנמוך?",o:["בגישת <bdi dir='ltr'>Lean</bdi>: <bdi dir='ltr'>Make to forecast</bdi>, עדיפות נמוכה בלוח הייצור, ניהול מלאי מרכזי וחיפוש יתרונות לגודל","בגישת <bdi dir='ltr'>Agile</bdi>: <bdi dir='ltr'>Make to order</bdi>, עדיפות גבוהה בלוח הייצור ושימוש ב-<bdi dir='ltr'>Quick Response</bdi> ו-<bdi dir='ltr'>Continuous Replenishment</bdi>","בגישת <bdi dir='ltr'>Lean</bdi>: ייצור למלאי בכמויות גדולות כדי לנצל יתרונות לגודל ולהוזיל את העלות ליחידה של כל פריט ופריט בקבוצה","בגישת <bdi dir='ltr'>Agile</bdi>: <bdi dir='ltr'>Make to forecast</bdi> עם מלאי ביטחון גדול, כדי להבטיח זמינות מיידית של כל פריט בקבוצה"],c:1,e:"לפי השקף, 80% מהמוצרים שמייצרים רק 20% מהביקוש מנוהלים בגישת <bdi dir='ltr'>Agile</bdi>: <bdi dir='ltr'>Make to order</bdi>, עדיפות גבוהה בלוח הייצור, <bdi dir='ltr'>Quick Response</bdi> ו-<bdi dir='ltr'>Continuous Replenishment</bdi>. גישת <bdi dir='ltr'>Lean</bdi> — <bdi dir='ltr'>Make to forecast</bdi>, עדיפות נמוכה, מלאי מרכזי ויתרונות לגודל — מיועדת דווקא ל-20% המוצרים שמייצרים את רוב הביקוש. (שא-7, שקף 21)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מה משמעות העיקרון ״<bdi dir='ltr'>Forecast for capacity, execute to demand</bdi>״ המופיע בהקשר של שרשרת <bdi dir='ltr'>Agile</bdi>?",o:["התחזית קובעת את כמויות הייצור, ואילו הקיבולת מותאמת בדיעבד לביקוש שהתממש בפועל","יש לייצר לפי התחזית עד מלוא הקיבולת, ולמכור את העודפים בהנחה בזמני שפל","התחזית משמשת לתכנון הקיבולת בלבד, ואילו הייצור בפועל מתבצע לפי הביקוש הממשי של הלקוחות","יש להזמין מהספקים לפי הקיבולת המרבית, ולבצע רק את ההזמנות שהתחזית צפתה"],c:2,e:"בשרשרת <bdi dir='ltr'>Agile</bdi> התחזית אינה מכתיבה מה לייצר אלא רק כמה קיבולת להכין <bdi dir='ltr'>(Forecast for capacity)</bdi>; הייצור עצמו מתבצע לפי הביקוש הממשי <bdi dir='ltr'>(execute to demand)</bdi>. המסיח הראשון הופך את היוצרות — הוא מתאר ייצור לתחזית, שהוא מאפיין של <bdi dir='ltr'>Lean</bdi>. (שא-7, שקף 21)"},
/* מטריצת ביקוש × זמן אספקה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מוצר בעל ביקוש צפוי ויציב, שזמן האספקה שלו מהספק ארוך ונמדד בחודשים. לאיזו משבצת במטריצת מאפייני הביקוש × זמן האספקה הוא שייך?",o:["<bdi dir='ltr'>Plan and execute (Lean)</bdi> — תכנון לפי תחזית וביצוע התוכנית","<bdi dir='ltr'>JIT</bdi> — אספקה בדיוק בזמן ללא החזקת מלאי","<bdi dir='ltr'>Hedge and deploy</bdi> — גידור אי-הוודאות באמצעות החזקת מלאי גדול","<bdi dir='ltr'>React and execute (Agile)</bdi> — תגובה מהירה לביקוש בפועל בזמן אמת"],c:0,e:"במטריצה, ביקוש צפוי בשילוב זמן אספקה ארוך מוביל ל-<bdi dir='ltr'>Plan and execute</bdi> — גישת <bdi dir='ltr'>Lean</bdi> שבה מתכננים לפי תחזית ומבצעים. <bdi dir='ltr'>JIT</bdi> מתאים לביקוש צפוי עם זמן אספקה קצר, ואילו <bdi dir='ltr'>Hedge and deploy</bdi> ו-<bdi dir='ltr'>Agile</bdi> מיועדים לביקוש שאינו צפוי. (שא-7, שקף 22)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יבואן צעצועים לעונת החגים מזמין מהמזרח הרחוק בזמן אספקה של ארבעה חודשים, והביקוש לכל דגם אינו ניתן לחיזוי. איזו אסטרטגיה מציעה מטריצת הביקוש × זמן האספקה למקרה זה?",o:["<bdi dir='ltr'>React and execute (Agile)</bdi> — תגובה לביקוש בפועל בזמן אמת","<bdi dir='ltr'>JIT</bdi> — אספקה בדיוק בזמן על פי ההזמנות שמתקבלות","<bdi dir='ltr'>Plan and execute (Lean)</bdi> — תכנון וביצוע לפי התחזית","<bdi dir='ltr'>Hedge and deploy</bdi> — גידור אי-הוודאות באמצעות החזקת מלאי מראש"],c:3,e:"ביקוש לא צפוי בשילוב זמן אספקה ארוך הוא המשבצת של <bdi dir='ltr'>Hedge and deploy / Hold inventory</bdi>: כשאי אפשר להגיב מהר, מגדרים את אי-הוודאות באמצעות מלאי. <bdi dir='ltr'>React and execute (Agile)</bdi> דורש זמן אספקה קצר שמאפשר תגובה, מה שאינו קיים בארבעה חודשי הובלה. (שא-7, שקף 22)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי מטריצת מאפייני הביקוש × זמן האספקה, מה מבדיל בין המשבצת של <bdi dir='ltr'>JIT</bdi> לבין המשבצת של <bdi dir='ltr'>Agile (React and execute)</bdi>?",o:["שתיהן בביקוש צפוי, אך <bdi dir='ltr'>JIT</bdi> מתאימה לזמן אספקה קצר ו-<bdi dir='ltr'>Agile</bdi> לזמן אספקה ארוך","שתיהן בזמן אספקה קצר, אך <bdi dir='ltr'>JIT</bdi> מתאימה לביקוש צפוי ו-<bdi dir='ltr'>Agile</bdi> לביקוש לא צפוי","שתיהן בביקוש לא צפוי, אך <bdi dir='ltr'>JIT</bdi> מתאימה לזמן אספקה ארוך ו-<bdi dir='ltr'>Agile</bdi> לזמן אספקה קצר","שתיהן בזמן אספקה ארוך, אך <bdi dir='ltr'>JIT</bdi> מתאימה לביקוש לא צפוי ו-<bdi dir='ltr'>Agile</bdi> לביקוש צפוי"],c:1,e:"שתי המשבצות נמצאות בשורת זמן האספקה הקצר: <bdi dir='ltr'>JIT</bdi> בעמודת הביקוש הצפוי, ו-<bdi dir='ltr'>React and execute (Agile)</bdi> בעמודת הביקוש הלא צפוי. זמן אספקה ארוך מוביל ל-<bdi dir='ltr'>Plan and execute</bdi> (ביקוש צפוי) או ל-<bdi dir='ltr'>Hedge and deploy</bdi> (ביקוש לא צפוי), ולא לאחת משתי אלה. (שא-7, שקף 22)"},
/* מאפייני שרשרת הביקוש הזמישה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"רשת קמעונאית משדרת לספקיה מדי יום את נתוני המכירות בפועל מהקופות, והספקים מתכננים את הייצור על פי נתונים אלה ולא על פי רמות המלאי במחסני הרשת. איזה מאפיין של שרשרת הביקוש הזמישה בא לידי ביטוי?",o:["<bdi dir='ltr'>Process integration</bdi> — שיתוף פעולה בין ספקים ללקוחות בפיתוח מוצרים חדשים","<bdi dir='ltr'>Market sensitive</bdi> — היכולת לחוש את דרישות השוק המשתנות ולהגיב להן","<bdi dir='ltr'>Virtual</bdi> — שרשרת המבוססת על מידע מהשוק ולא על בסיס המלאי בארגון","<bdi dir='ltr'>Network based</bdi> — רשת של שותפים המחוברים <bdi dir='ltr'>On Line</bdi> באמצעות <bdi dir='ltr'>EDI</bdi>"],c:2,e:"המאפיין <bdi dir='ltr'>Virtual</bdi> מוגדר במצגת כשרשרת המבוססת על מידע מהשוק ולא על בסיס מלאי בארגון — בדיוק ההחלפה שבתרחיש: נתוני מכירה במקום רמות מלאי. <bdi dir='ltr'>Market sensitive</bdi> עוסק ביכולת לחוש ולהגיב לדרישות השוק, אך הדגש בתרחיש הוא על בסיס התכנון (מידע במקום מלאי). (שא-7, שקף 24)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן רכיבים ולקוחו, יצרן מכשירים, מפתחים יחד את הדור הבא של המוצר, מתאמים תהליכי עבודה משותפים ומשתפים זה את זה בתוכניות הייצור. איזה מאפיין של שרשרת הביקוש הזמישה מתואר?",o:["<bdi dir='ltr'>Process integration</bdi> — אינטגרציה של תהליכים בין ספקים ללקוחות ושיתוף פעולה בפיתוח מוצרים","<bdi dir='ltr'>Market sensitive</bdi> — היכולת לחוש ולהגיב לדרישות השוק ולשינויים בהעדפות הלקוחות בשווקים השונים","<bdi dir='ltr'>Virtual</bdi> — שרשרת המבוססת על מידע מהשוק ולא על בסיס המלאי הקיים בארגון, תוך תכנון לפי נתוני המכירות","<bdi dir='ltr'>Network based</bdi> — רשת שותפים המחוברים <bdi dir='ltr'>On Line</bdi> ופועלים על פי ביקוש אמיתי של הלקוחות, באמצעות <bdi dir='ltr'>EDI</bdi>"],c:0,e:"<bdi dir='ltr'>Process integration</bdi> מוגדר במצגת כאינטגרציה של תהליכים בין הספקים ללקוחות, כולל שיתוף פעולה בפיתוח מוצרים — בדיוק הפיתוח המשותף ותיאום התהליכים שבתרחיש. <bdi dir='ltr'>Network based</bdi> עוסק בחיבור מקוון של רשת שותפים, ולא בפיתוח משותף. (שא-7, שקף 24)"},
/* Lean מול Agile */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי המצגת, מה מבדיל בין שרשרת <bdi dir='ltr'>Lean</bdi> לבין שרשרת <bdi dir='ltr'>Agile</bdi> מבחינת הדגש, כיוון המיקוד וסוג השרשרת?",o:["<bdi dir='ltr'>Lean</bdi> — אפקטיביות ותגובתיות, מיקוד החוצה בלקוח, <bdi dir='ltr'>Demand Chain</bdi>; <bdi dir='ltr'>Agile</bdi> — יעילות ועלות, מיקוד פנימה בארגון, <bdi dir='ltr'>Supply Chain</bdi>","<bdi dir='ltr'>Lean</bdi> — יעילות ועלות, מיקוד החוצה בלקוח, <bdi dir='ltr'>Demand Chain</bdi>; <bdi dir='ltr'>Agile</bdi> — אפקטיביות ותגובתיות, מיקוד פנימה בארגון, <bdi dir='ltr'>Supply Chain</bdi>","<bdi dir='ltr'>Lean</bdi> — אפקטיביות ועלות, מיקוד פנימה בארגון, <bdi dir='ltr'>Demand Chain</bdi>; <bdi dir='ltr'>Agile</bdi> — יעילות ותגובתיות, מיקוד החוצה בלקוח, <bdi dir='ltr'>Supply Chain</bdi>","<bdi dir='ltr'>Lean</bdi> — יעילות ועלות, מיקוד פנימה בארגון, <bdi dir='ltr'>Supply Chain</bdi>; <bdi dir='ltr'>Agile</bdi> — אפקטיביות ותגובתיות, מיקוד החוצה בלקוח, <bdi dir='ltr'>Demand Chain</bdi>"],c:3,e:"בשקף <bdi dir='ltr'>Lean vs. Agile</bdi>: <bdi dir='ltr'>Lean</bdi> מדגיש יעילות ועלות, ממוקד פנימה בארגון ומייצג <bdi dir='ltr'>Supply Chain</bdi>; <bdi dir='ltr'>Agile</bdi> מדגיש אפקטיביות ותגובתיות, ממוקד החוצה בלקוח ומייצג <bdi dir='ltr'>Demand Chain</bdi>. המסיחים מחליפים בין הדגשים, בין כיווני המיקוד או בין סוגי השרשרת. (שא-7, שקף 25)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית ריהוט מאפשרת ללקוחותיה להזמין כל פריט במידות ובגימור אישיים; כל הזמנה מיוצרת כיחידה בודדת לאחר קבלתה ונמסרת במועד שביקש הלקוח. כיצד תסווג השרשרת לפי שקף ״מה עושים עכשיו״?",o:["שרשרת ״רזה״ <bdi dir='ltr'>(Lean)</bdi> — <bdi dir='ltr'>Push</bdi>, יעילות אריזה ומשלוחים ואספקה ממלאי זמין","שרשרת ״זמישה״ <bdi dir='ltr'>(Agile)</bdi> — <bdi dir='ltr'>Batch of One, Pull</bdi> ומענה לביקוש בזמן המבוקש","שרשרת ״רזה״ <bdi dir='ltr'>(Lean)</bdi> — <bdi dir='ltr'>Batch of One</bdi> כאמצעי לצמצום המלאי ולהוזלת האחסון","שרשרת ״זמישה״ <bdi dir='ltr'>(Agile)</bdi> — <bdi dir='ltr'>Push</bdi> על בסיס תחזית ואספקה מיידית ממלאי זמין"],c:1,e:"ייצור של יחידה בודדת לפי הזמנה <bdi dir='ltr'>(Batch of One)</bdi>, התחלת הייצור רק לאחר ההזמנה <bdi dir='ltr'>(Pull)</bdi> ומסירה במועד שביקש הלקוח הם שלושת מאפייני השרשרת ה״זמישה״ בשקף. שרשרת ״רזה״ מאופיינת ב-<bdi dir='ltr'>Push</bdi>, ביעילות אריזה ומשלוחים ובאספקה ממלאי זמין; <bdi dir='ltr'>Batch of One</bdi> אינו כלי <bdi dir='ltr'>Lean</bdi>. (שא-7, שקף 26)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בחברה אחת מודדים את הצלחת השרשרת לפי עלות ליחידה ונצילות המשאבים, ובחברה שנייה — לפי שיעור ההזמנות שסופקו בזמן ובכמות שביקש הלקוח. לפי ההבחנה בין <bdi dir='ltr'>Lean</bdi> ל-<bdi dir='ltr'>Agile</bdi>, מה ניתן לומר על שתי החברות?",o:["הראשונה מודדת אפקטיביות ברוח <bdi dir='ltr'>Agile</bdi>, והשנייה מודדת יעילות ברוח <bdi dir='ltr'>Lean</bdi>","שתיהן מודדות יעילות, שכן עמידה בזמנים ועלות ליחידה הם מדדי <bdi dir='ltr'>Lean</bdi> קלאסיים","הראשונה מודדת יעילות ברוח <bdi dir='ltr'>Lean</bdi>, והשנייה מודדת אפקטיביות ותגובתיות ברוח <bdi dir='ltr'>Agile</bdi>","שתיהן מודדות אפקטיביות, שכן שני המדדים נגזרים מדרישות הלקוח הסופי"],c:2,e:"עלות ליחידה ונצילות משאבים הם מדדי יעילות — הדגש של <bdi dir='ltr'>Lean</bdi>, הממוקד פנימה בארגון. עמידה בזמן ובכמות שביקש הלקוח היא מדד אפקטיביות ותגובתיות — הדגש של <bdi dir='ltr'>Agile</bdi>, הממוקד החוצה בלקוח. עמידה בזמנים אינה מדד יעילות, ועלות ליחידה אינה נגזרת מדרישות הלקוח. (שא-7, שקף 25)"},
/* טבלת ההשוואה — שמונה שורות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית מחשבים ניידים מתכננת את מוצריה כך שניתן להרכיבם ממודולים מתחלפים (זיכרון, מסך, סוללה) ולהתאימם להזמנת כל לקוח. לאיזו אסטרטגיה שייכת ההחלטה, ובאיזו שורה בטבלת ההשוואה היא מופיעה?",o:["תגובתיות/אפקטיביות — אסטרטגיית תיכון המוצר: תיכון מודולרי למתן אפשרות התאמה","עלות/יעילות — אסטרטגיית תיכון המוצר: תיכון המוצר בעלות המינימלית האפשרית לייצור","תגובתיות/אפקטיביות — אסטרטגיית ייצור: קיבולת ייצור גמישה המותאמת לביקוש המשתנה","עלות/יעילות — אסטרטגיית ייצור: נצילות גבוהה של משאבי הייצור והמכונות במפעל"],c:0,e:"בשורת אסטרטגיית תיכון המוצר בטבלה, השרשרת התגובתית/אפקטיבית מתכננת מוצר מודולרי כדי לאפשר התאמה, ואילו השרשרת היעילה מתכננת בעלות מינימלית. מודולים מתחלפים הם תיכון מוצר, לא קיבולת ייצור — ולכן שורת אסטרטגיית הייצור אינה רלוונטית. (שא-7, שקף 28)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברה בוחרת ספקים לפי קריטריון עיקרי אחד — המחיר הנמוך ביותר לרכיב, תוך הסתפקות באיכות בסיסית; במקביל היא מחזיקה מלאי מינימלי ומפיצה במסלול הזול ביותר. איזו אסטרטגיה מתוארת, ומה היה צפוי בשרשרת ההפוכה?",o:["אסטרטגיית תגובתיות/אפקטיביות; בשרשרת יעילה היו נבחרים ספקים יקרים ואיכותיים ומוחזק מלאי ביטחון גדול","אסטרטגיית עלות/יעילות; בשרשרת תגובתית היו נבחרים ספקים זולים עוד יותר ומוחזק מלאי אפס","אסטרטגיית תגובתיות/אפקטיביות; בשרשרת יעילה הייתה מוחזקת קיבולת ייצור גמישה ומלאי ביטחון","אסטרטגיית עלות/יעילות; בשרשרת תגובתית היו נבחרים ספקים זמישים באיכות גבוהה ומוחזק מלאי ביטחון"],c:3,e:"ספקים לפי עלות ואיכות נמוכה, מלאי מינימלי והפצה בעלות נמוכה הם שלוש שורות בעמודת העלות/יעילות בטבלה. בעמודה התגובתית/אפקטיבית מולן: ספקים זמישים באיכות גבוהה, מלאי ביטחון והפצה מהירה וזמישה. המסיחים משייכים את התיאור לאסטרטגיה הלא נכונה או מתארים שרשרת הפוכה שאינה קיימת בטבלה. (שא-7, שקף 28)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בטבלת ההשוואה בין אסטרטגיית עלות/יעילות לאסטרטגיית תגובתיות/אפקטיביות, איזה מהצמדים הבאים <b>אינו</b> תואם את המצגת?",o:["אסטרטגיית זמני אספקה: צמצום בעלות מיטבית בשרשרת יעילה מול צמצום בכל מחיר בשרשרת תגובתית","אסטרטגיית המחרה: רווחיות גבוהה בשרשרת יעילה מול רווחיות נמוכה בשרשרת תגובתית","אסטרטגיית מלאי: מלאי מינימלי בשרשרת יעילה מול מלאי ביטחון בשרשרת תגובתית","אסטרטגיית שילוח והפצה: עלות נמוכה בשרשרת יעילה מול הפצה מהירה וזמישה בשרשרת תגובתית"],c:1,e:"בשורת אסטרטגיית ההמחרה בטבלה, השרשרת היעילה פועלת ברווחיות נמוכה והשרשרת התגובתית ברווחיות גבוהה — הצמד במסיח הפוך. שלוש השורות האחרות (זמני אספקה, מלאי, שילוח/הפצה) מובאות כפי שהן בטבלה. (שא-7, שקף 28)"},
/* מקרה Cardo */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בשלב מסוים בציר השינוי של <bdi dir='ltr'>Cardo</bdi>, רוב הספקים הקריטיים עדיין בסין אך ספקים שוליים כבר באירופה, הרכש עבר לספק <bdi dir='ltr'>(Turn Key)</bdi>, הייצור עדיין <bdi dir='ltr'>BTO</bdi>, המסירה <bdi dir='ltr'>FOB</bdi> הונגריה עם 6 ימי הובלה יבשתית, והמרכזים הלוגיסטיים במיקור חוץ. לאיזו שנה בציר מתאים התיאור?",o:["2015 — נקודת המוצא, כאשר החברה עצמה רכשה את ה-<bdi dir='ltr'>BOM</bdi> והייצור בוצע בקבלנות משנה בסין","2020 — השלב המתקדם, לאחר המעבר לספקים מקומיים <bdi dir='ltr'>(Localization)</bdi> ול-<bdi dir='ltr'>Build to Stock</bdi>","2017 — שלב הביניים, לאחר העברת הרכש לספק ולפני המעבר ל-<bdi dir='ltr'>SKU</bdi> אחד ול-<bdi dir='ltr'>Build to Stock</bdi>","שלב ביניים בין 2017 ל-2020, לאחר המעבר ל-<bdi dir='ltr'>Build to Stock</bdi> אך לפני ה-<bdi dir='ltr'>Localization</bdi>"],c:2,e:"התיאור תואם את עמודת 2017: רוב הספקים הקריטיים בסין וספקים שוליים באירופה, רכש <bdi dir='ltr'>Turn Key</bdi> על ידי הספק, <bdi dir='ltr'>BTO, FOB</bdi> הונגריה, 6 ימי הובלה יבשתית ומרכזים לוגיסטיים במיקור חוץ. ב-2015 החברה רכשה את ה-<bdi dir='ltr'>BOM</bdi> והמסירה הייתה <bdi dir='ltr'>FOB</bdi> הונג קונג; ב-2020 כבר עברו ל-<bdi dir='ltr'>Localization</bdi>, ל-<bdi dir='ltr'>SKU</bdi> אחד ול-<bdi dir='ltr'>Build to Stock</bdi>. (שא-7, שקפים 36, 39)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ב-2015 מסרה <bdi dir='ltr'>Cardo</bdi> למפיצים בתנאי <bdi dir='ltr'>FOB</bdi> הונג קונג עם כ-6 שבועות הובלה ימית לארה״ב, ומפעל הקבלן הושבת מדי שנה בראש השנה הסיני. איזה שינוי בציר 2017–2020 נועד לקצר את זמן ההובלה ולהפחית את התלות בסין?",o:["מעבר לספקים מקומיים <bdi dir='ltr'>(Localization)</bdi> ומסירה <bdi dir='ltr'>FOB</bdi> הונגריה עם כ-6 ימי הובלה יבשתית","החזרת רכש רכיבי ה-<bdi dir='ltr'>BOM</bdi> לידי החברה והרחבת הייצור בקבלנות משנה בסין","פתיחת מרכזים לוגיסטיים נוספים בבעלות עצמית באירופה ובארה״ב לקיצור המשלוחים","הגדלת מספר המק״טים ל-200 כדי להתאים כל מוצר למפיץ ולמדינה ולקצר את ההפצה"],c:0,e:"בציר השינוי, המסירה עברה מ-<bdi dir='ltr'>FOB</bdi> הונג קונג עם 6 שבועות הובלה ימית ל-<bdi dir='ltr'>FOB</bdi> הונגריה עם 6 ימי הובלה יבשתית, ובמקביל עברו לספקים מקומיים <bdi dir='ltr'>(Localization)</bdi> ולרכש <bdi dir='ltr'>Turn Key</bdi> על ידי הספק — צעדים שקיצרו את זמן האספקה והקטינו את התלות בסין. המרכזים הלוגיסטיים עברו דווקא למיקור חוץ, והמק״טים צומצמו ולא הוגדלו. (שא-7, שקפים 31, 36, 39)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ב-2015 ייצרה <bdi dir='ltr'>Cardo</bdi> יותר מ-200 מק״טים של מוצרים סופיים, כשכל מוצר הותאם למפיץ ולמדינה (מטען, שפה צרובה, אריזה ומסמכים). ב-2020 עברה ל-<bdi dir='ltr'>SKU</bdi> אחד ול-<bdi dir='ltr'>Build to Stock</bdi>. מה ההיגיון של השינוי מנקודת מבט של אסטרטגיית שרשרת האספקה?",o:["הגדלת ההתאמה האישית לכל מפיץ מחייבת ייצור לפי הזמנה ומלאי גדול יותר של תוצרת גמורה","מעבר לייצור למלאי מגדיל את מגוון המק״טים ומאפשר למנוע תחרות בין מפיצים ממדינות שונות","ריבוי מק״טים מאפשר ניצול יתרונות לגודל, ולכן שולב עם <bdi dir='ltr'>Build to Stock</bdi> כדי להוזיל את הרכש ואת הייצור","צמצום השונות בין המוצרים מאפשר ייצור למלאי של מוצר אחיד, קיצור זמני האספקה וקיטון במלאי"],c:3,e:"מוצר מותאם לכל מפיץ יצר יותר מ-200 מק״טים וחייב ייצור לפי הזמנה <bdi dir='ltr'>(BTO)</bdi> עם זמן אספקה של 8 שבועות. צמצום ל-<bdi dir='ltr'>SKU</bdi> אחד מבטל את השונות ומאפשר <bdi dir='ltr'>Build to Stock</bdi> — ייצור למלאי של מוצר אחיד — וכך מתקבלים היתרונות שהמצגת מונה: קיצור זמני אספקה, קיטון במלאי ושיפור ההון החוזר. ריבוי מק״טים דווקא מפצל את המלאי ואינו מקנה יתרונות לגודל. (שא-7, שקפים 30, 34, 39)"}
]);

BANK.push.apply(BANK,[
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"כיצד מנוסח האתגר העיקרי של מנהל שרשרת האספקה במצגת ״ארגז כלים וסיכום״?",o:["עמידה בתחזית המכירות השנתית, תוך ניצול מלא של קיבולת הייצור והמכונות במפעל לאורך כל השנה","הגדלת המלאי בכל שלבי השרשרת, כדי להבטיח שהלקוחות לעולם לא ייתקלו בחוסרים","הורדת עלויות הרכש בכל שנה, תוך שמירה על מספר קטן של ספקים ועל מלאי ביטחון גבוה בכל המחסנים","הבטחת אספקות לפי תוכנית המכירות, תוך שמירה על גמישות תפעולית, מלאי נמוך ואיכות גבוהה"],c:3,e:"בשקף 3: ״האתגר: הבטחת אספקות ללקוחות על פי תוכנית המכירות, תוך שמירה על גמישות תפעולית, רמת מלאי נמוכה ואיכות גבוהה!״ — בגרסה זו נוסף רכיב האיכות הגבוהה לאתגר שהוצג במבוא. הגדלת המלאי מנוגדת לאתגר: ״הגדלת המלאי אינה הפתרון״. (שא-8, שקפים 3, 6)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם עיסוקי הליבה של שרשרת האספקה במצגת ארגז הכלים?",o:["בקרת תהליכים <bdi dir='ltr'>(Process Control)</bdi>","קביעת מחירי המכירה ללקוחות <bdi dir='ltr'>(Pricing)</bdi>","ניהול ספקים ומיקור פריטים ייחודיים <bdi dir='ltr'>(Vendor Management)</bdi>","מעבר מפיתוח לייצור של מוצרים חדשים <bdi dir='ltr'>(NPI)</bdi>"],c:1,e:"בשקף 5 עיסוקי הליבה הם: ניהול הזמנות ואספקות, ניהול חומר ותחזיות, ניהול מלאי, ניהול ספקים, מיקור של פריטים ייחודיים, הורדת עלויות, לוגיסטיקה, <bdi dir='ltr'>NPI</bdi> — מעבר מפיתוח לייצור, ושיפור תהליכים ובקרה <bdi dir='ltr'>(Process Control)</bdi>. תמחור מכירה הוא תפקיד השיווק. (שא-8, שקף 5)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי ״מודל השנה הראשונה בתפקיד״, היכן נמצאת נקודת השפל של שביעות הרצון של מנהל חדש?",o:["ביום הראשון, ומשם העקומה רק עולה בהדרגה עד סוף השנה","בסביבות שלושה חודשים, אחרי ירידה מתונה ורציפה מהיום הראשון","בסוף השנה, כשמגיעים הלקחים והמסקנות מהשנה הראשונה","בסביבות החודש הראשון, אחרי שיא קטן בשבוע הראשון"],c:3,e:"בשקף 7 מוצגת עקומת שביעות רצון לאורך זמן: ״הלם״ בהתחלה, שיא קטן אחרי שבוע, ירידה לנקודת שפל סביב החודש, התאוששות עד שלושה חודשים ועלייה מתמשכת עד שנה. מנהל שמכיר את העקומה יודע שהשפל של החודש הראשון צפוי ואינו סימן לכישלון. (שא-8, שקף 7)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהלת שרשרת אספקה חדשה מתחילה בתפקיד. לפי תוכנית העבודה השנתית, מה עליה לעשות ברבעון הראשון?",o:["להקשיב, ללמוד, לא לבטל את העבר — וללמוד את הארגון ואת סביבת הפעולה","להחליף את מנהלי הצוותים ולהתחיל מיד ביישום השינוי המבני בשרשרת","לעדכן את הייעוד, המדדים והאסטרטגיה על סמך הלקחים של השנה הראשונה","לנהל משא ומתן מחודש עם כל הספקים ולבחור מחדש את הספקים הקבועים"],c:0,e:"בשקף 8, הדגשים לרבעון הראשון: להקשיב, ללמוד, לא לבטל את העבר, ולימוד הארגון וסביבת הפעולה; התוצרים: תובנות, משימות להמשך ופגישות אישיות. יישום השינוי, החלפת כוח אדם וניהול ספקים הם ברבעון השלישי, ועדכון הייעוד והאסטרטגיה — ברבעון הרביעי. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"באיזה רבעון בתוכנית העבודה השנתית מופיעים ״יישום השינוי, תחילת החלפת כוח אדם וניהול ספקים״?",o:["ברבעון השלישי","ברבעון הראשון","ברבעון השני","ברבעון הרביעי"],c:0,e:"בשקף 8: רבעון <bdi dir='ltr'>I</bdi> — להקשיב וללמוד; רבעון <bdi dir='ltr'>II</bdi> — תכנון והכנת תוכנית עבודה (ייעוד, אסטרטגיה, קודי התנהגות, מדדים); רבעון <bdi dir='ltr'>III</bdi> — יישום השינוי, תחילת החלפת כוח אדם וניהול ספקים, עם יישום תהליכים, ארגון מבנה השרשרת ומדידת ביצועים כנקודת ייחוס; רבעון <bdi dir='ltr'>IV</bdi> — בקרה ולמידה ושיפור ביצועים. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה התוצר של הרבעון השני בתוכנית העבודה השנתית של מנהל שרשרת האספקה?",o:["תוכנית עבודה: ייעוד, אסטרטגיה, קודי התנהגות ומדדים","לקחים מהשנה הראשונה בתפקיד ותוכנית עבודה מפורטת לשנה הבאה","תובנות, משימות להמשך ופגישות אישיות עם המנהלים והעובדים","מבנה שרשרת חדש ומדידת ביצועים כנקודת ייחוס"],c:0,e:"ברבעון <bdi dir='ltr'>II</bdi> הדגש הוא תכנון, והתוצר — הכנת תוכנית עבודה הכוללת ייעוד, אסטרטגיה, קודי התנהגות ומדדים. תובנות ופגישות אישיות הן תוצרי הרבעון הראשון, מבנה השרשרת ונקודת הייחוס — של השלישי, והלקחים ותוכנית השנה הבאה — של הרביעי. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל מסיים את השנה הראשונה בתפקיד. לפי תוכנית העבודה, מה מאפיין את הרבעון הרביעי?",o:["יישום השינוי — תחילת החלפת כוח האדם וארגון מחדש של מבנה השרשרת ושל הספקים","בקרה ולמידה — שיפור ביצועים, עדכון הייעוד והמדדים ותוכנית לשנה הבאה","תכנון — הכנת תוכנית עבודה ראשונה הכוללת ייעוד, אסטרטגיה ומדדים","הקשבה ולמידה — פגישות אישיות ולימוד הארגון וסביבת הפעולה שלו"],c:1,e:"בשקף 8 הרבעון הרביעי הוא ״בקרה ולמידה — שיפור ביצועים״, ותוצריו: עדכון ייעוד, מדדים ואסטרטגיה, לקחים מהשנה הראשונה ותוכנית לשנה הבאה. המדידה שנעשתה ברבעון השלישי כנקודת ייחוס מאפשרת כעת לבחון את השיפור. (שא-8, שקף 8)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי ״מרכיבי תוכנית העבודה של השרשרת״, ממה נגזר ייעוד השרשרת <bdi dir='ltr'>(Mission)</bdi>, וממה נגזרים קודי ההתנהגות <bdi dir='ltr'>(Code of Conduct)</bdi>?",o:["הייעוד — מחזון הארגון; קודי ההתנהגות — מערכי הארגון","הייעוד — מערכי הארגון; קודי ההתנהגות — מחזון הארגון","הייעוד — מהמדדים שנקבעו; קודי ההתנהגות — מדרישות הלקוחות","הייעוד — מתוכנית המכירות; קודי ההתנהגות — מתקנון הרכש"],c:0,e:"בשקף 9: ״הגדרת ייעוד השרשרת <bdi dir='ltr'>Mission</bdi> כנגזרת מחזון הארגון״ ו״הגדרת קודי ההתנהגות <bdi dir='ltr'>Code of Conduct</bdi> כנגזרת לערכי הארגון״. יתר המרכיבים: הבנת אסטרטגיית הארגון וסביבת הפעולה, הגדרת אסטרטגיית השרשרת (עלות/יעילות מול גמישות/אפקטיביות), הגדרת המדדים, והגדרת משימות ותוכנית עבודה. (שא-8, שקף 9)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהי השורה המודגשת בתחתית שקף ״מרכיבי תוכנית העבודה של השרשרת״?",o:["התאמת מבנה שרשרת האספקה <bdi dir='ltr'>(Structure)</bdi> לחלוקת הסמכויות בין המנהלים <bdi dir='ltr'>(Power)</bdi>","התאמת תקציב שרשרת האספקה <bdi dir='ltr'>(Cost)</bdi> לתוכנית המכירות השנתית של הארגון <bdi dir='ltr'>(Sales)</bdi>","התאמת תפיסת שרשרת האספקה <bdi dir='ltr'>(Supply)</bdi> לציפיות ודרישות הלקוחות <bdi dir='ltr'>(Demand)</bdi>","התאמת מלאי שרשרת האספקה <bdi dir='ltr'>(Inventory)</bdi> לקיבולת המחסנים הקיימים של הארגון <bdi dir='ltr'>(Space)</bdi>"],c:2,e:"בתחתית שקף 9 מודגש: ״התאמת תפיסת שרשרת האספקה — <bdi dir='ltr'>Supply</bdi> — לציפיות ודרישות הלקוחות — <bdi dir='ltr'>Demand</bdi>״. זה ממשיך את רעיון ״ההתאמה האסטרטגית״: ״יש לוודא התאמת תפיסת שרשרת האספקה לאסטרטגיה הארגונית!״ (שקף 10). (שא-8, שקפים 9–10)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי פירמידת ״התפתחות שרשרת האספקה״, מהו הסדר מהבסיס לפסגה?",o:["פנים-ארגונית ← חוץ-ארגונית ← רשת אספקה ← רשת גלוקאלית ← רזה <bdi dir='ltr'>(Lean)</bdi> ← זמישה <bdi dir='ltr'>(Agile)</bdi>","פנים-ארגונית ← רשת אספקה ← חוץ-ארגונית ← רזה <bdi dir='ltr'>(Lean)</bdi> ← רשת גלוקאלית ← זמישה <bdi dir='ltr'>(Agile)</bdi>","חוץ-ארגונית ← פנים-ארגונית ← רשת גלוקאלית ← רשת אספקה ← זמישה <bdi dir='ltr'>(Agile)</bdi> ← רזה <bdi dir='ltr'>(Lean)</bdi>","רזה <bdi dir='ltr'>(Lean)</bdi> ← פנים-ארגונית ← חוץ-ארגונית ← זמישה <bdi dir='ltr'>(Agile)</bdi> ← רשת אספקה ← רשת גלוקאלית"],c:0,e:"בשקף 12 הפירמידה עולה משרשרת אספקה פנים-ארגונית, דרך חוץ-ארגונית, רשת אספקה <bdi dir='ltr'>(Supply Network)</bdi> ורשת אספקה גלוקאלית <bdi dir='ltr'>(GloCal)</bdi>, אל שרשרת רזה <bdi dir='ltr'>(Lean)</bdi> ובפסגה שרשרת זמישה <bdi dir='ltr'>(Agile)</bdi>. לצדה: ״מעבר משרשרת יעילה לשרשרת אפקטיבית״ ו״משרשרת אספקה לשרשרת ביקוש״. (שא-8, שקף 12)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה משפט מלווה את פירמידת התפתחות שרשרת האספקה במצגת?",o:["מעבר מרשת גלוקאלית לשרשרת מקומית","מעבר משרשרת אפקטיבית לשרשרת יעילה","מעבר משרשרת ביקוש לשרשרת אספקה","מעבר משרשרת יעילה לשרשרת אפקטיבית"],c:3,e:"בשקף 12, לצד הפירמידה: ״מעבר משרשרת יעילה לשרשרת אפקטיבית״ — והכיוון הכללי במצגות הוא גם ״משרשרת אספקה לשרשרת ביקוש״, כלומר ממיקוד פנימה בעלות אל מיקוד החוצה בלקוח. שלושת המסיחים הופכים את הכיוון. (שא-8, שקף 12; שא-7, שקף 5)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"בסיכום הקורס חוזרות חמש מטרות שרשרת האספקה. איזו מהן מוגדרת כ״ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת״?",o:["יצירת ערך מוסף לארגון","<bdi dir='ltr'>Supply Chain Value</bdi>","<bdi dir='ltr'>Supply Chain Profitability</bdi>","<bdi dir='ltr'>Supply Chain Value Proposition</bdi>"],c:2,e:"בשקף 13, חמש המטרות הן יצירת ערך מוסף לארגון, <bdi dir='ltr'>Supply Chain Value, Supply Chain Profitability</bdi> — ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת — <bdi dir='ltr'>Supply Chain Value Proposition</bdi>, ומעבר ממרכז עלות <bdi dir='ltr'>(Cost Center)</bdi> למרכז רווח <bdi dir='ltr'>(Profit Center)</bdi>. (שא-8, שקף 13; שא-7, שקף 10)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"חברה מתלבטת היכן להקים את מחסני ההפצה שלה ואילו שווקים יתמוך כל מחסן, תוך תכנון המשכיות עסקית למקרה של השבתה. לאיזו קטגוריה של החלטות בשרשרת שייכת ההתלבטות?",o:["החלטות אסטרטגיות — מיקום אתרים, שווקים ו-<bdi dir='ltr'>BCP</bdi>","החלטות תפעוליות — ליקוט, אריזה ומשלוח יומי ללקוחות","החלטות טקטיות — תזמון ספקים ושחרור הזמנות רכש","החלטות תמחיר — המחרת שירותי השרשרת ללקוח"],c:0,e:"בשקף 14, ״החלטות אסטרטגיות בשרשרת האספקה״ כוללות: מיקום יצרנים, ספקים ומחסנים — כולל <bdi dir='ltr'>BCP</bdi>; <bdi dir='ltr'>Make or Buy</bdi>; אילו אתרי ייצור ומחסנים ובאילו שווקים יתמכו; מיקום המלאי; שיטות השילוח וההפצה; ומערכת המידע לתמיכה בשרשרת. (שא-8, שקף 14)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"ברשת מסחר מקוון, שרשרת האספקה — מהירות המשלוח וזמינות המלאי — היא חלק מהצעת הערך ללקוח והמרכיב העיקרי בהוצאות. לפי ״תפיסת ההפעלה של שרשרת האספקה״, איזו אפשרות מתאימה לה?",o:["לבחון הוצאה למיקור חוץ, כמו כל מרכיב הוצאה משמעותי בארגון","לבחון את הצעת הערך ולנהל את השרשרת כמרכז הוצאה בלבד","לבחון צמצום השרשרת כך שתתמקד בפעילויות הקריטיות","לבחון הרחבת שירותים ולקוחות — מכירת שירותי השרשרת לארגונים אחרים"],c:3,e:"בשקף 15: כששרשרת האספקה <b>היא</b> הליבה הארגונית — היא קריטית לייעוד, חלק מהצעת הערך, המרכיב העיקרי בהוצאות ובעלת פוטנציאל למרכז רווח — ולכן בוחנים הרחבת השירותים והלקוחות: מכירת שירותי השרשרת. כשהיא <b>אינה</b> הליבה, היא נתפסת כמרכז הוצאה ובוחנים הוצאה למיקור חוץ ואת הצעת הערך. (שא-8, שקף 15)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מאפיין משותף לשני המצבים בשקף ״תפיסת ההפעלה״ — גם כששרשרת האספקה היא הליבה הארגונית וגם כשאינה?",o:["בשני המצבים יש לבחון את הוצאתה למיקור חוץ","בשני המצבים היא קריטית להבטחת ייעוד הארגון","בשני המצבים היא נתפסת כמרכז הוצאה בלבד","בשני המצבים היא חלק מהצעת הערך של הארגון"],c:1,e:"בשקף 15 שתי העמודות נפתחות באותו משפט: ״קריטית להבטחת ייעוד הארגון״. ההבדל ביניהן: כשהיא הליבה, היא חלק מהצעת הערך ופוטנציאל למרכז רווח; כשאינה הליבה, היא אינה חלק מהצעת הערך, נתפסת כמרכז הוצאה, ובוחנים הוצאה למיקור חוץ. (שא-8, שקף 15)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל שרשרת אספקה מקיים פעם בשבוע ישיבה שבה משתפים מידע ומשווים את התכנון לביצוע בפועל. איזה רכיב של ״מערכת ניהול, מדידה ובקרה״ זה?",o:["הבקרה הרבעונית — <bdi dir='ltr'>QBR</bdi> ומעקב אחר המשימות הפתוחות","הדו״ח החודשי — סקירת המדדים העיקריים של השרשרת","תהליך הלמידה — סיכום ותחקיר <bdi dir='ltr'>(SAD)</bdi>","הדו״ח השבועי — שיתוף מידע ותכנון מול ביצוע"],c:3,e:"בשקף 17: הגדרת עץ המדדים (<bdi dir='ltr'>BSC</bdi> ו-<bdi dir='ltr'>SMART</bdi>); <bdi dir='ltr'>Dash Board</bdi> — לוח שעונים ארגוני עם נתונים זמינים ואמינים; דו״ח שבועי — שיתוף מידע ותכנון מול ביצוע; דו״ח חודשי — מדדים עיקריים; בקרה רבעונית <bdi dir='ltr'>QBR</bdi> — בקרת <bdi dir='ltr'>KPI</bdi> ומעקב משימות; תוכנית עבודה שנתית; ותהליכי למידה — סיכום ותחקיר <bdi dir='ltr'>(SAD)</bdi>. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה מתבצע בבקרה הרבעונית — <bdi dir='ltr'>QBR (Quarterly Business Review)</bdi> — לפי המצגת?",o:["סיכום ותחקיר של אירועים חריגים בלבד","שיתוף מידע ותכנון מול ביצוע שבועי","תיקוף הייעוד והגדרת התקציב השנתי","בקרת מדדי ה-<bdi dir='ltr'>KPI</bdi> ומעקב אחר המשימות"],c:3,e:"בשקף 17, הבקרה הרבעונית <bdi dir='ltr'>(QBR)</bdi> מוגדרת כבקרת מדדים — <bdi dir='ltr'>KPI</bdi> — ומעקב משימות. שיתוף מידע ותכנון מול ביצוע הם בדו״ח השבועי, תיקוף הייעוד והתקציב — בתוכנית העבודה השנתית, והסיכום והתחקיר — בתהליכי הלמידה <bdi dir='ltr'>(SAD)</bdi>. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי מערכת הניהול, המדידה והבקרה, באילו כלים משתמשים להגדרת עץ המדדים?",o:["גיליון ציונים מאוזן <bdi dir='ltr'>(Balanced Score Card)</bdi> ומודל <bdi dir='ltr'>SMART</bdi>","סקירה עסקית רבעונית <bdi dir='ltr'>(QBR)</bdi> ותוכנית עבודה שנתית ותקציב מאושר","ניתוח תחקיר <bdi dir='ltr'>(SAD)</bdi> ופארטו של הוצאות הארגון <bdi dir='ltr'>(Expense Pareto)</bdi>","לוח שעונים ארגוני <bdi dir='ltr'>(Dash Board)</bdi> ודו״ח חודשי של המדדים העיקריים"],c:0,e:"בשקף 17, תחת ״הגדרת עץ המדדים״: ״יישום גיליון ציונים מאוזן — <bdi dir='ltr'>Balanced Score Card</bdi> — והגדרת מדדים לפי מודל <bdi dir='ltr'>SMART</bdi>״. ה-<bdi dir='ltr'>Dash Board</bdi>, הדו״חות, ה-<bdi dir='ltr'>QBR</bdi> וה-<bdi dir='ltr'>SAD</bdi> הם שלבים אחרים במערכת, שמשתמשים במדדים שהוגדרו. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מה מאפיין את ה-<bdi dir='ltr'>Dash Board</bdi> במערכת הניהול, המדידה והבקרה של שלמה?",o:["תחקיר לאחר אירוע חריג לצורך הפקת לקחים בצוות","ישיבה רבעונית של ההנהלה לבקרת המשימות הפתוחות","לוח שעונים ארגוני המבוסס על נתונים זמינים ואמינים","דו״ח שנתי מודפס המסכם את כל הביצועים של השנה"],c:2,e:"בשקף 17: ״בניית <bdi dir='ltr'>Dash Board</bdi> — לוח שעונים ארגוני — נתונים זמינים ואמינים״. בלי נתונים זמינים ואמינים, לוח השעונים לא ישקף את מצב השרשרת בזמן אמת, והמדדים לא ישמשו לניהול. (שא-8, שקף 17)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם ״המודלים המתקדמים לשרשרת אספקה״ שבמצגת?",o:["שרשרת אספקה שיתופית <bdi dir='ltr'>(Shared Supply Chain)</bdi>","שרשרת אספקה התנהגותית — כלכלה התנהגותית","שרשרת אספקה שטוחה <bdi dir='ltr'>(Flat Supply Chain)</bdi>","שרשרת אספקה ריכוזית <bdi dir='ltr'>(Centralized)</bdi>"],c:3,e:"בשקף 18 המודלים המתקדמים הם: מעבר מ״שרשרת אספקה״ ל״רשת אספקה״ לפי הגישה הגלוקאלית, <bdi dir='ltr'>Lean, Agile</bdi>, שרשרת אספקה שיתופית <bdi dir='ltr'>(Shared)</bdi>, שרשרת אספקה שטוחה <bdi dir='ltr'>(Flat)</bdi> ושרשרת אספקה התנהגותית. ״שרשרת ריכוזית״ אינה ברשימה. (שא-8, שקף 18)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"במפעל אחד עומדות מכונות בטלות ומצטבר מלאי איטי, ובמפעל אחר באותו אזור חסרה קיבולת ייצור והספקים מאחרים. איזו בעיה מתאר המצב, לפי פרק ״שרשרת אספקה שיתופית״?",o:["חוסר איזון בין ביקוש להיצע — תחזית שגויה בשני המפעלים גם יחד","שוט השור — הגברת התנודות בהזמנות ככל שמתרחקים מהלקוח הסופי","בזבוז המתנה — עובדים ומכונות שממתינים לחלקים מהתחנה הקודמת","חוסר איזון בניהול משאבים — עודף במקום אחד וחוסר במקום אחר"],c:3,e:"בשקף 23 מוגדרת ״הבעיה: חוסר איזון בניהול משאבים״ — מצד אחד עודף במשאבים (משאבים בטלים, עודפי מלאי איטי ומת, חוסר יעילות ועלויות גבוהות להפעלת משאבים), ומצד שני חוסר במשאבים (אי-עמידה באספקות, חוסרים בחומר, קיבולת ייצור חסרה ועלויות גבוהות לקידום אספקות). השרשרת השיתופית מחברת בין שני הצדדים. (שא-8, שקף 23)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהי ״כלכלה שיתופית״ <bdi dir='ltr'>(Shared Economy)</bdi>, כפי שהיא מוגדרת במצגת?",o:["מערכת המאפשרת שיתוף רכוש, מוצרים ושירותים, תוך ניצול יעיל של משאבים עודפים לטובת מי שחסר אותם","מערכת שבה המדינה מחלקת משאבים בין הארגונים לפי צורכיהם, בלי מנגנון מחירים ובלי תחרות ביניהם","מערכת שבה העובדים שותפים ברווחי הארגון, וכך מוגברים המוטיבציה והפריון שלהם בשרשרת האספקה","מערכת שבה ארגונים מאחדים את כל הרכש שלהם אצל ספק יחיד, כדי לקבל הנחת כמות משותפת גדולה יותר מהספק"],c:0,e:"בשקף 24: כלכלה שיתופית היא מערכת כלכלית המאפשרת שיתוף רכוש, מוצרים ושירותים בין אנשים וארגונים, תוך ניצול יעיל יותר של המשאבים העצמיים והעודף הקיים שלהם, כדי לתת מענה לצורך או לחוסר במשאבים אלה אצל אחרים. (שא-8, שקף 24)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מפעל משכיר בשעות הלילה קו ייצור שעומד בטל לחברה אחרת דרך פלטפורמה שיתופית, ובמקביל שוכר בעצמו שטח אחסון בעונת השיא במקום לבנות מחסן. איזו תרומה של השרשרת השיתופית משתקפת בכך?",o:["שיתוף מידע על אופי המשאבים — דירוג הספקים לפי איכות המלאי שלהם","הורדת מחירי המשאבים — מעבר מהוצאות קבועות למשתנות והגדלת נצילות","זמישות משאבים — ויתור על כל המשאבים העצמיים לטובת שכירות בלבד","קיצור ושיטוח השרשרת — ביטול כל המתווכים בין המפעל לבין הלקוחות"],c:1,e:"בשקף 26 תרומות השרשרת השיתופית: זמישות משאבים (הגדלת כמות המשאבים הזמינה וגמישות שימוש לטווח קצר), הורדת מחירי משאבים (מעבר מהוצאות קבועות למשתנות והגדלת נצילות), קיצור ושיטוח השרשרת (קשר ישיר בין בעלי המשאבים ללקוחות), ושיתוף מידע על אופי המשאבים (דירוג). השכרת קו בטל ושכירת מחסן במקום בנייה הן הגדלת נצילות ומעבר מקבועות למשתנות. (שא-8, שקף 26)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"כיצד תומכת השרשרת השיתופית בשרשרת אספקה רזה <bdi dir='ltr'>(Lean)</bdi>, לפי המצגת?",o:["ביטול הצורך בתכנון החומר, כי המשאבים זמינים תמיד בפלטפורמה","הגדלת מלאי הביטחון של הארגון באמצעות מלאים של ארגונים אחרים בשוק","עלות נמוכה של משאבים שיתופיים, ויצירת הכנסה ממשאבי הארגון הבטלים","ניצול מלאים שיתופיים זמינים כדי לשפר את זריזות האספקות ללקוחות בשעת שיא"],c:2,e:"בשקף 27: לשרשרת היעילה — ניהול רזה <bdi dir='ltr'>(Lean)</bdi> — השרשרת השיתופית תורמת עלות נמוכה של המשאבים השיתופיים הזמינים בשוק, ושיפור יעילות ונצילות של משאבי הארגון הבטלים תוך יצירת הכנסה לשרשרת. ניצול מלאים שיתופיים לשיפור גמישות וזריזות באספקות הוא התרומה לשרשרת התגובתית — הזמישה <bdi dir='ltr'>(Agile)</bdi>. (שא-8, שקף 27)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> מופיע בין רכיבי ״שרשרת האספקה השטוחה״ במצגת?",o:["איחוד מרכזי הפצה","משלוחים קטנים ותכופים","הגדלת מגוון המוצרים","דחיינות"],c:2,e:"בשקף 31, תחת ״מניהול שרשרת אספקה לניהול שרשרת הביקוש״, מופיעים: שיפור אמינות התחזית, הבטחת זמינות המלאי, קיצור זמני אספקה מספקים, צמצום מגוון המוצרים, דחיינות, איחוד מרכזי הפצה, משלוחים קטנים ותכופים, קיצור תהליכים לוגיסטיים ומערכת מידע לשליטה ובקרה. המגוון מצומצם — לא מוגדל. (שא-8, שקף 31)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"לפי שקף ״שרשרת אספקה שטוחה — מה נשתנה?״, מה איפשר את המעבר לשרשרת שטוחה?",o:["הגדלת כוח האדם במחסנים ובמרכזי ההפצה של הארגונים בכל רחבי העולם","מעבר מוחלט לספקים מקומיים וביטול היבוא מחו״ל","התפתחות טכנולוגית — מהירות תקשורת, זמינות מידע ויכולות עיבוד","הגדלת המלאי בכל חוליה בשרשרת כדי לקצר את זמני האספקה ללקוחות"],c:2,e:"בשקף 30 שני משושים: ״התפתחות טכנולוגית: מהירות התקשורת, זמינות המידע ויכולות עיבוד״, שהובילה ל״פישוט תהליכים, הקטנת מלאים, חיסכון בעלויות וקיצור זמני אספקה — שרשרת אספקה זמישה״. הגדלת מלאי היא ההפך מהקטנת המלאים. (שא-8, שקף 30)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"במה שונה הכלכלה ההתנהגותית מהכלכלה הקלאסית, לפי המצגת?",o:["היא מניחה שהפרטים רציונליים לחלוטין ובעלי מידע מושלם ומיידי על השוק","היא מצביעה על מגבלות והטיות בקבלת החלטות בפועל, בניגוד להנחת הרציונליות המלאה","היא מחליפה את מדדי הביצוע בשרשרת במדדים של שביעות רצון העובדים בלבד","היא עוסקת רק בהחלטות של ארגונים גדולים, ולא בהחלטות של פרטים או של צרכנים"],c:1,e:"בשקף 32: הכלכלה ההתנהגותית שואבת מהפסיכולוגיה ומתורת המשחקים בהקשר של קבלת החלטות כלכליות בתנאי אי-ודאות. בעוד הכלכלה הקלאסית מניחה שפרטים משיאים את תועלתם ומקבלים החלטות באופן רציונלי ועם מידע מושלם ומיידי, הכלכלה ההתנהגותית מצביעה על מגבלות, הטיות ובעיות אחרות בקבלת החלטות בפועל (דן אריאלי). (שא-8, שקף 32)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מנהל מסרב למכור מלאי ישן במחיר נמוך מעלותו, אף שהמלאי מתיישן ותופס מקום, כי ״אסור לממש הפסד״. איזו הטיה בקבלת החלטות מהמצגת מתוארת?",o:["החלטות הרוב","שנאת הפסד","מוצר השוואתי","צדק חברתי"],c:1,e:"בשקף 33 מופיעות הטיות בקבלת החלטות בשרשרת: הבטחת אספקות או מלאי, מבצעי הנחות — 1+1, שנאת הפסד, מוצר השוואתי, החלטות הרוב וצדק חברתי. סירוב לממש הפסד ידוע, גם כשהוא משתלם, הוא שנאת הפסד. (שא-8, שקף 33)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"קניין מזמין כמות כפולה מהנדרש כי הספק הציע מבצע ״1+1״, והמלאי העודף נשאר במחסן חודשים. לאיזו הטיה מתאים המקרה?",o:["הבטחת אספקות או מלאי","מבצעי הנחות — 1+1","מוצר השוואתי","החלטות הרוב"],c:1,e:"״מבצעי הנחות — 1+1״ היא אחת ההטיות בשקף 33: המבצע מושך לרכוש יותר ממה שנדרש, גם כשהחיסכון הנראה לעין מתקזז בעלויות האחזקה ובסיכון ההתיישנות של המלאי העודף. (שא-8, שקף 33)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"מהו הסדר של ״מחזור חיי ניהול הספקים בארגון״, ומי אחראי על כל שלב?",o:["הערכה תקופתית (הרכש) ← בחירה (ניהול איכות) ← ניהול שוטף ואירועים חריגים (שרשרת האספקה)","בחירה (הרכש) ← ניהול שוטף (שרשרת האספקה) ← הערכה תקופתית ואירועים חריגים (ניהול איכות)","ניהול שוטף (הרכש) ← בחירה (שרשרת האספקה) ← הערכה תקופתית ואירועים חריגים (הכספים)","בחירה (ניהול איכות) ← ניהול שוטף (הרכש) ← הערכה תקופתית ואירועים חריגים (שרשרת האספקה)"],c:1,e:"בשקף 35 מחזור החיים: בחירת ספקים ← ניהול שוטף ← הערכה תקופתית ← אירועים חריגים; ומתחת לכל שלב — הגורם האחראי: הרכש, שרשרת האספקה, ניהול איכות וניהול איכות. זו התשובה לשאלה בשקף הבא, ״מי בתפעול מנהל את הספקים?״. (שא-8, שקפים 35–36)"},
{t:"ארגז הכלים של מנהל שרשרת האספקה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> אחד מ״המודלים המתקדמים לניהול ספקים״ בשקף המסכם של שלמה?",o:["״להפוך אנרגיית חיכוך לאנרגיית תנועה״","״שתי חברות — קבוצה אחת״","״הלקוח תמיד צודק״","״כמה סוכר בקפה?״"],c:2,e:"בשקף 34 המודלים הם: ״שחקו מטקות ולא טניס״, ״המראה האחורית״, ״להפוך אנרגיית חיכוך לאנרגיית תנועה״, ״הפינה בחדר העגול״, <bdi dir='ltr'>GloCal</bdi> — <bdi dir='ltr'>Think Global Act Local</bdi>, ״כמה סוכר בקפה?״, ״שתי חברות — קבוצה אחת״, ״69״, ״לטפס על מגדל התצפית״, שרשרת האספקה השטוחה ושרשרת אספקה זמישה <bdi dir='ltr'>(Agile)</bdi>. ״הלקוח תמיד צודק״ אינו ביניהם. (שא-8, שקף 34)"}
]);

/* הרצאה 14.7 — ד"ר ניצן סוויד, מצגת 1: ניהול האינטגרציה בשרשרת האספקה (מקור: תמלול ההקלטה בלבד) */
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"חנות קמעונאית חוזה ביקוש של 1,000 יחידות ומזמינה מהמפיץ 1,100 'ליתר ביטחון'; המפיץ מזמין מהיצרן 1,210; היצרן מזמין מספק חומרי הגלם 1,331. איזו תופעה מתוארת כאן, ומה קורה לסטייה ככל שמתרחקים מהלקוח הסופי?",o:["ניהול דיפרנציאלי של מלאי — כל חוליה מסווגת את הפריט לפי פארטו, והסטייה מתאזנת ככל שמתרחקים מהלקוח הסופי","שיטת המשיכה — ביקוש הלקוח הסופי 'מושך' את השרשרת, ולכן הסטייה נשארת קבועה ואינה גדלה לאורך כל החוליות שבמעלה השרשרת","שוט השור <bdi dir='ltr'>(Bullwhip)</bdi> — כל חוליה מוסיפה מרווח משלה, והסטייה בין הביקוש האמיתי להזמנות גדלה באופן מעריכי במעלה השרשרת","אי-התאמת מלאי (פחת) — פער בין הרישום הממוחשב למציאות, שמתגלה רק בספירת סוף השנה אצל היצרן ואינו תלוי כלל במרחק מהלקוח הסופי"],c:2,e:"המרצה תיאר 'טלפון שבור' בשרשרת: כל אחד מודיע לבא אחריו כמה הוא צריך ומוסיף כעשרה אחוזים, והטעות 'הולכת וגדלה אקספוננציאלית' — זהו אפקט שוט השור <bdi dir='ltr'>(Bullwhip)</bdi>, שבסופו רשתות השיווק מוצאות פערים גדולים בין התחזית לנתונים בפועל. שיטת המשיכה היא דווקא הגישה שבה הפעילות נגזרת מהלקוח הסופי ואינה מתארת הגדלת סטיות. (הרצאה 14.7, דקה ~58)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"נניח שאוסם מחוברת במערכת ממוחשבת לקופות של כל רשתות השיווק, ורואה שקצב ה'צפצופים' של במבה בקופות ירד מכ-1,000 בשעה לכ-300. לפי ההרצאה, מה היתרון המרכזי של חיבור כזה?",o:["אוסם מזהה מיד את השינוי בביקוש הלקוח הסופי ומתאימה את קצב הייצור, במקום לגלות זאת באיחור דרך הזמנות מעוותות של החוליות שבדרך","אוסם יכולה לחייב את רשתות השיווק להזמין לפי הסכם מסגרת קבוע, ובכך לבטל לחלוטין את אי-הוודאות בביקוש ואת הצורך בתחזיות בכלל לאורך השנה","אוסם יכולה להגדיל את ניצולת המכונות ל-100% ולייצר למלאי, מתוך ידיעה שהביקוש יחזור לרמתו הקודמת בתוך זמן קצר, כפי שקרה בעבר","אוסם חוסכת את עלויות החזקת המלאי בסניפים, כי האחריות על המלאי עוברת לרשתות השיווק ברגע שהמוצר נסרק בקופה ומדווח למערכת"],c:0,e:"שיתוף מידע בין חוליות השרשרת מאפשר להתאים את קצב העבודה של כל השרשרת לדרישות הלקוח הסופי — וזו הדרך שבה האינטגרציה מצמצמת (אם כי לא מבטלת לגמרי) את שוט השור. בדוגמה, ירידה פתאומית (למשל בגלל מוצר מתחרה של עלית) מובילה מיד לישיבת הנהלה ולצמצום קצב הייצור. הסכם מסגרת קבוע הוא דווקא שיטת הדחיפה שמבוססת על תחזית, וייצור למלאי הוא בדיוק הטעות שהמרצה הזהיר מפניה. (הרצאה 14.7, דקה ~59)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"חברת אגד צריכה שבכל רגע יהיו 100 אוטובוסים בנסיעה על קו מסוים. זמינות האוטובוסים היא 80% בלבד (היתר בטיפולים ובתקלות), וכל אוטובוס עולה כמיליון ש״ח. מה המשמעות לפי ההרצאה?",o:["די ב-100 אוטובוסים בדיוק — הזמינות משפיעה רק על תקציב האחזקה השוטף ולא על מספר הכלים שיש לרכוש","נדרשים פחות מ-100 אוטובוסים, כי בכל רגע נתון רק 80% מהקו פעיל בפועל, ואת היתרה אפשר לחסוך ולא לרכוש","גודל הצי ייקבע לפי ה-<bdi dir='ltr'>MTBF</bdi> של האוטובוסים בלבד, ואילו הזמינות רלוונטית רק לתכנון משמרות הנהגים בקו","החברה תיאלץ להחזיק צי גדול מ-100 — ככל שהזמינות נמוכה יותר נדרשים יותר אוטובוסים, בעלות של מיליוני ש״ח"],c:3,e:"זמינות היא אחוז הזמן שבו הציוד זמין לשימוש. המרצה הסביר שאם אוטובוס באגד אינו במצב נסיעה חלק מהזמן (תקלות, טיפולים, נהג שמאחר), 'אני צריך להחזיק יותר אוטובוסים ככל שהזמינות נמוכה יותר' — למשל עוד 30 אוטובוסים = 30 מיליון ש״ח. הזמינות משפיעה ישירות על גודל הצי הנדרש, לא רק על תקציב האחזקה, ו-<bdi dir='ltr'>MTBF</bdi> הוא מדד אמינות ולא הקובע של גודל הצי. (הרצאה 14.7, דקה ~28)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"על רכב א' נאמר: 'הוא מוכן לנסיעה 95% מהזמן'. על רכב ב' נאמר: 'ההסתברות שיסיים נסיעה של ארבע שעות לאילת בלי תקלה היא 90%'. אילו מדדים מתוארים כאן, בהתאמה?",o:["רכב א' — אמינות (אחוז מהזמן ללא תקלה); רכב ב' — זמינות (ההסתברות שהרכב יהיה פנוי לנסיעה)","רכב א' — זמינות (אחוז מהזמן שהציוד זמין); רכב ב' — אמינות (הסתברות לסיים משימה במשך זמן נתון)","רכב א' — <bdi dir='ltr'>MTBF</bdi> (הזמן הממוצע התקין); רכב ב' — זמינות (ההסתברות שהמשימה תסתיים בזמן שנקבע)","שני התיאורים הם מדדי אמינות — ההבדל ביניהם הוא רק שהראשון מבוטא באחוזים והשני בהסתברות"],c:1,e:"המרצה הגדיר זמינות כ'אחוז מהזמן שהציוד זמין לנסיעה' (דוגמת האוטובוס באגד), ואמינות כ'ההסתברות שציוד יצליח לסיים משימה בת <bdi dir='ltr'>X</bdi> שעות בהצלחה' — ואף נתן את דוגמת הנסיעה לאילת בארבע שעות. החלפת ההגדרות זו בזו היא הטעות הנפוצה; <bdi dir='ltr'>MTBF</bdi> הוא מדד לאמינות (זמן ממוצע בין תקלות) ולא הגדרת הזמינות. (הרצאה 14.7, דקה ~28-31)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"יחידה שוקלת שני גנרטורים זהים במחירם: לגנרטור א' <bdi dir='ltr'>MTBF</bdi> של 400 שעות, ולגנרטור ב' <bdi dir='ltr'>MTBF</bdi> של 1,500 שעות. מה עדיף לפי ההרצאה, ומדוע?",o:["גנרטור ב' — <bdi dir='ltr'>MTBF</bdi> הוא הזמן הממוצע בין תקלה לתקלה, ורוצים שיהיה גבוה ככל האפשר","גנרטור א' — <bdi dir='ltr'>MTBF</bdi> נמוך פירושו שהתקלות מתוקנות מהר יותר והציוד חוזר לעבודה בזמן קצר","גנרטור א' — פרקי זמן קצרים בין טיפולים מאפשרים ביקורת צמודה יותר ומונעים כשל פתאומי","אין הבדל — <bdi dir='ltr'>MTBF</bdi> מודד את זמינות הציוד ולא את אמינותו, ולכן כלל אינו רלוונטי לבחירה"],c:0,e:"<bdi dir='ltr'>MTBF</bdi> — <bdi dir='ltr'>Mean Time Between Failures</bdi> — הוא 'המדד המרכזי של אמינות': הזמן הממוצע בין תקלה לתקלה. ככל שהציוד עובד זמן רב יותר בין תקלות הוא אמין יותר, ולכן רוצים <bdi dir='ltr'>MTBF</bdi> גבוה — והמרצה הדגיש ש'הרבה טועים בזה'. <bdi dir='ltr'>MTBF</bdi> אינו מודד את מהירות התיקון ואינו מדד זמינות, ולכן שני הנימוקים בעד גנרטור א' שגויים. (הרצאה 14.7, דקה ~31-32)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"ההסתברות שמנוע בודד של מטוס יתפקד לאורך כל הטיסה לארה״ב היא כ-97%. המרצה טען שאיש לא היה עולה על מטוס חד-מנועי כזה — ובכל זאת אנשים טסים בבואינג. כיצד הסביר זאת?",o:["חברות התעופה מבצעות ביקורות תכופות לפני כל טיסה, וכך מעלות את אמינותו של כל מנוע בודד מ-97% ל-100% מלאים","ה-97% מתייחסים לזמינות המנוע ולא לאמינותו, ולכן אין מדובר בסיכון לנפילה אלא רק בעיכובים ביציאה לטיסה","אמינות מטוס עם כמה מנועים היא הממוצע של אמינויות המנועים, כלומר עדיין 97% — סיכון שהציבור ורשויות התעופה למדו לקבל לאורך השנים","יש כמה מנועים במקביל; כדי שהמטוס ייפול כולם צריכים להיכשל בו-זמנית — הסתברות נמוכה מאוד — ולכן אמינות המערכת קרובה ל-100%"],c:3,e:"97% פירושו שמכל 100 טיסות שלוש נופלות — חברה שמטיסה כ-100 טיסות ביום הייתה קורסת. המרצה הסביר שנלמד לחשב 'אמינות במקביל': ההסתברות שכל המנועים ייכשלו באותו רגע נמוכה מאוד, ולכן האמינות 'מאוד גבוהה — לא מאה, אבל 99.9...'. את השארית פותרים בביקורות ואחזקה. אמינות במקביל אינה ממוצע של הרכיבים — היא גבוהה מכל רכיב בודד — ואף ביקורת אינה מביאה מנוע בודד ל-100%. (הרצאה 14.7, דקה ~33-34)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"מוסך מחזיק במלאי מנועים ותיבות הילוכים (יקרים ומעטים) וגם אלפי סוגי ברגים (חצי סנט לבורג). איך לפי ההרצאה צריך לנהל את שני סוגי הפריטים?",o:["במדיניות אחידה לכל המק״טים — חישוב <bdi dir='ltr'>EOQ</bdi> זהה לכל פריט, כי המודל הבסיסי אינו מבחין בין פריטים יקרים לזולים","בניהול דיפרנציאלי על בסיס פארטו — תשומת הלב לפריטים היקרים המעטים, וברגים זולים מחזיקים בכמויות גדולות","להחזיק מלאי גדול של מנועים כי הם קריטיים, ומלאי מינימלי של ברגים כי הם תופסים מספר גדול של מק״טים במחסן","לנהל בקפדנות דווקא את הברגים, כי הם מהווים כ-80% מהמק״טים ולכן גם את רוב עלות החזקת המלאי במוסך"],c:1,e:"המרצה הסביר שרוב הכסף מגיע ממספר קטן של מק״טים (פארטו): 'יותר קל להחזיק הרבה ברגים מאשר הרבה מנועים' בגלל עלויות ההחזקה, ולכן 'מתייחסים לזה בצורה שונה' — ניהול דיפרנציאלי של מלאי. הברגים הם רוב המק״טים אך חלק זניח מהערך, ולכן ההשקעה הניהולית צריכה להיות במנועים ובתיבות ההילוכים, לא במדיניות אחידה ולא בברגים. (הרצאה 14.7, דקה ~27)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בית חולים ורשת שיווק פרטית מנהלים שניהם מלאי. לפי ההרצאה, במה תתבטא ההבחנה העיקרית בגישה למלאי בין שני הארגונים?",o:["הרשת הפרטית תחזיק מלאי ביטחון גדול יותר, כי הפסד מכירה עולה לה יותר מאשר לבית חולים הממומן מתקציב ציבורי קבוע ומובטח","שני הארגונים ינהלו את המלאי באותה שיטה <bdi dir='ltr'>(EOQ)</bdi>, וההבדל יהיה רק בגודל ההזמנות בגלל הבדלי היקף הפעילות ביניהם לאורך השנה","בית החולים, כארגון בעל אופי כוננותי, יחזיק מלאי חירום גדול גם במחיר עלויות; הרשת הפרטית תצמצם מלאים כדי לחסוך","בית החולים יצמצם מלאים כי תרופות מתקלקלות, ואילו הרשת תחזיק מלאי ביטחון גדול של מוצרי חלב כדי לא לאבד לקוחות לטובת המתחרים"],c:2,e:"המרצה הדגיש שארגונים בעלי אופי כוננותי — צה״ל, בתי חולים — 'עובדים מאוד חזק על מלאי כוננות, מלאי חירום', ולכן ניהול המלאי אצלם 'שונה לגמרי' מארגון עסקי-פרטי, שינסה לצמצם מלאים כדי לחסוך בעלויות. רמי לוי, למשל, אינו מחזיק מלאי ביטחון של חלב — 'מה שנגמר נגמר' — ואילו בצה״ל מלאי החירום גדול בהרבה מהצריכה השוטפת. (הרצאה 14.7, דקה ~21-22)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המכולת ליד הבית מנהלת מלאי מצוין בשיטה 'מה שנמכר אתמול יימכר מחר' (200 חלב אתמול, 203 היום). מדוע לפי המרצה השיטה הזו מתאימה למכולת אך לא לצה״ל?",o:["במכולת הביקוש קבוע ולכן השיטה הנאיבית מספיקה; צה״ל פועל בחוסר ודאות מוחלט, הביקוש אצלו אינו קבוע ונדרשות שיטות חיזוי של ממש","צה״ל מחזיק הרבה יותר מק״טים, ולכן אין לו כוח אדם לעדכן תחזית נאיבית יומית לכל פריט ופריט כפי שעושה בעל המכולת מדי בוקר","השיטה הנאיבית דורשת אקסל ומחשבון שיש במכולת, ואילו בצה״ל התחזיות נעשות בשיטת הדחיפה על פי הסכמי מסגרת רב-שנתיים עם ספקים קבועים","במכולת קיימת מגמת עלייה קבועה בביקוש, ואילו בצה״ל הביקוש עונתי, ולכן נדרש שם מודל עונתיות מורכב ולא שיטה נאיבית פשוטה"],c:0,e:"המרצה כינה זאת 'שיטה נאיבית' — 'מה שאתמול יהיה מחר' — שעובדת כשהביקוש קבוע (חלב, גבינה צהובה) ולא דורשת חישוב. אבל בצה״ל 'זה לא ביקוש קבוע' — הוא נמצא בעולם של חוסר ודאות מוחלט, ולכן חייבים לחזות בצורה טובה ומדויקת. עונתיות, מספר המק״טים או הצורך במחשבון אינם הנימוק שהמרצה נתן. (הרצאה 14.7, דקה ~19)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"יצרן חותם עם ספק הסכם מסגרת: '12,000 יחידות בשנה — תדחוף לי 1,000 כל חודש', על בסיס תחזית. ברשת אחרת, לעומת זאת, כל קנייה של במבה בקופה היא שמפעילה את השרשרת אחורה. איך מכנה ההרצאה את שתי הגישות?",o:["הראשונה — שיטת המשיכה (הספק מושך הזמנות קבועות); השנייה — שיטת הדחיפה (הלקוח דוחף את הביקוש לתוך השרשרת)","הראשונה — <bdi dir='ltr'>VMI</bdi> (הספק מנהל את המלאי אצל הלקוח); השנייה — <bdi dir='ltr'>MRP</bdi> (תכנון דרישות החומרים על פי נתוני הקופות ברשת)","הראשונה — אינטגרציה בין-ארגונית; השנייה — אינטגרציה פנים-ארגונית, שבה הקופה והמחסן מדווחים לאותו מחשב מרכזי","הראשונה — שיטת הדחיפה (דוחפים לפי הסכם שנסגר מראש על פי תחזית); השנייה — שיטת המשיכה (הפעילות נגזרת מהלקוח הסופי)"],c:3,e:"שיטת המשיכה — 'שיטה חדשה יחסית' — אומרת שכל פעילות השרשרת נגזרת ממה שהלקוח הסופי (הילדה שרוצה במבה) מבקש: היא קובעת אם השרשרת מהירה או איטית. בשיטת הדחיפה החלקים האחוריים של השרשרת דוחפים לפי הסכם שנסגר מראש על פי חיזוי — ומה שקורה עם חיזוי הוא שהוא 'לא מתממש'. האפשרות הראשונה הופכת את ההגדרות זו בזו. (הרצאה 14.7, דקה ~39-40)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בספירת המלאי בסוף השנה מתגלה שבמחסן יש 40 יחידות פחות ממה שרשום במחשב, ואיש אינו יודע להסביר את הפער. איזה מושג מההרצאה מתאר זאת, ומה גורם לו בדרך כלל?",o:["קלקול — מוצרים שנפלו, נשברו או פג תוקפם, ולכן נמחקו מהרישום הממוחשב מבלי שדווח על כך למנהל המחסן","אי-התאמת מלאי (פחת) — פער בין ה'תיאוריה הממוחשבת' למציאות שמתגלה רק בספירה, בגלל גניבות או ניפוקים שלא נרשמו","מלאי ביטחון שנוצל — היחידות החסרות נמשכו מן הרזרבה בתקופת ביקוש חריג וטרם הושלמו על ידי הספק","שוט השור — ההזמנות מהספק היו גדולות מן הצריכה בפועל, וההפרש נרשם במחשב אך מעולם לא הגיע פיזית למחסן"],c:1,e:"המרצה הבחין בין קלקולים (מוצרים שנופלים ונשברים) לבין 'פחת' — 'זה לא אותו דבר' — אי-התאמה בין הרישום הממוחשב למציאות, שמתגלה רק כשבאים לספור בסוף השנה, 'או בגלל גניבות או בגלל שלא העבירו בפרוצדורות'. שניהם חלק מעלויות החזקת המלאי, אך רק הפחת הוא פער בלתי מוסבר בין הרישום למציאות; קלקול הוא נזק פיזי ידוע. (הרצאה 14.7, דקה ~23-24)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"מנכ״ל מפעל לחלקי מתכת בדטרויט (מהספר 'המטרה') הציב יעד של ניצול מרבי של המכונות, קיבל מהספק הנחה של 10% על רכישה בכמות גדולה — ומצא את עצמו עם מלאי של עשרה חודשים. מה הלקח שהמרצה הפיק מהסיפור?",o:["הבעיה הייתה בספק שסיפק כמות גדולה מדי; יש לעבור להסכמי מסגרת חודשיים כדי לשלוט בקצב האספקה ולמנוע הצטברות","ניצול מכונות של 100% הוא יעד נכון, אך היה צריך לאזן אותו בהגדלת מלאי הביטחון של מוצרים מוגמרים למכירה","צריך לייצר את מה שנדרש ולא כמה שיותר — עדיף שעובד ישתה קפה חלק מהזמן מאשר להחזיק מלאי סתם, כי מלאי עולה כסף","המנכ״ל היה חרוץ אך לא ידע לנהל, ולכן הפתרון היה להחליף אותו במנהל מנוסה ולא לשנות את מטרת המפעל"],c:2,e:"המרצה סיפר שלפני 40-50 שנה המטרה הייתה לנצל את הציוד ככל האפשר — 'אם המכונה עובדת 100% מהזמן אתה מלך' — אבל 'לא בטוח שהלקוחות צריכים את זה'. היועץ אמר למנכ״ל שהבעיה היא המטרה שהגדיר; הלקח: 'לא תמיד צריך לייצר הרבה, צריך לייצר כמה שצריך', ועדיף עובד ששותה קפה מאשר מלאי מיותר. ההנחה מהספק הייתה פיתוי שהוביל למלאי עצום, לא הסיבה השורשית. (הרצאה 14.7, דקה ~62-63)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"זרקו שתי קוביות פעמיים, ובשתי הפעמים התקבל 6-6. מה ההסתברות לקבל 6-6 גם בזריקה השלישית, לפי מה שהסביר המרצה?",o:["כמו בכל זריקה — שישית כפול שישית; להסתברות 'אין זיכרון' וכל זריקה מתחילה מחדש","נמוכה מהרגיל, כי לאורך זמן הסטטיסטיקה 'מתיישרת' וצירוף שכבר חזר פעמיים צפוי להתאזן","גבוהה מהרגיל, כי הקוביות נמצאות 'ברצף' ותוצאות קודמות מעידות על נטייה של הקובייה","שישית בלבד — אחרי שני צירופים זהים די בכך שקובייה אחת תתאים לתוצאה הקודמת שהתקבלה"],c:0,e:"המרצה הסביר את 'תכונת חוסר הזיכרון בסטטיסטיקה': ההסתברות 'חוזרת מההתחלה', מוחקים את העבר ומתחילים משחק חדש — תמיד אותה הסתברות (1/6 לכל קובייה, שישית כפול שישית לצירוף). הוא הזהיר במפורש שלא לחשוב שאם שחקן כדורסל פוגע באחוזים קבועים ופתאום יש רצף, 'הסטטיסטיקה מתיישרת' — זה לא חייב לקרות. (הרצאה 14.7, דקה ~13-14)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"לפי ההבחנה שהציג המרצה בין חיזוי להימור, איזו מהפעולות הבאות היא חיזוי?",o:["מילוי טופס לוטו לפי תאריכי הלידה של הילדים, שכן למספרים יש משמעות אישית עבור הממלא","הימור ברולטה בקזינו לאחר מעקב ארוך אחר המספרים שיצאו בסיבובים הקודמים באותו ערב","בחירת מספרים מפוזרים בלוטו במקום 1-2-3-4-5-6-7, משום שצירוף רציף כזה מעולם לא יצא","מילוי טופס טוטו על משחקי המונדיאל בידי מי שמכיר את הקבוצות ומפעיל עליהן שיקול דעת"],c:3,e:"המרצה הסביר שרולטה ולוטו הם הימור — למספרים שבוחרים אין משמעות אמיתית, וההסתברות זהה לכל צירוף (כ-1 ל-17 מיליון, גם לרצף 1-7 וגם למספרים מפוזרים). לעומת זאת בטוטו על המונדיאל 'מי שממלא מכיר את הקבוצות ומפעיל שיקול דעת' — 'ברגע שיש קצת יותר מניחוש פראי, זה הופך להיות חיזוי'. (הרצאה 14.7, דקה ~12-17)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המרצה הסביר שאינטגרציה פנים-ארגונית עובדת גם כשמנהל המחסן ומנהל הרכב מסוכסכים ואינם מדברים זה עם זה. מדוע?",o:["כי המנכ״ל מקבל את הדיווחים משני המנהלים ומתווך ביניהם, ולכן הסכסוך ביניהם אינו פוגע בזרימת המידע בארגון","כי הדיווח נעשה במערכת המחשוב וכולם רואים את המידע בלי תלות ביחסים אישיים — אין צורך ב'גיבוש חברתי'","כי בשלב האינטגרציה הפנים-ארגונית כל מחלקה נשארת 'ממלכה' עצמאית, ורק המידע הכספי משותף לכל המחלקות","כי מערכת ה-<bdi dir='ltr'>ERP</bdi> מחליפה את המנהלים בתהליך אוטומטי של הזמנות, כך שאין עוד צורך בהחלטות אנושיות ביניהם"],c:1,e:"אינטגרציה = חיבור, שילוב. המרצה הדגיש ששיתוף הפעולה בשרשרת 'זה לא עניין של גיבוש חברתי' — אי אפשר להכריח שני אנשים להיות חברים. האינטגרציה נוצרת בזכות מהפכת המידע: 'הם יכולים להיות מסוכסכים, זה לא משנה, כי במחשב הם צריכים לדווח' — וכולם יודעים הכל. הפתרון הוא מערכת המידע, לא תיווך של המנכ״ל ולא ביטול המנהלים. (הרצאה 14.7, דקה ~43-52)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"כיצד הגדיר המרצה 'שרשרת אספקה', ומה עושה כל ארגון לאורכה?",o:["רצף הסכמי מסגרת בין יצרן לספקיו, שבו כל ארגון מתחייב לכמות שנתית קבועה ודוחף אותה במנות חודשיות","מערכת ממוחשבת אחת <bdi dir='ltr'>(ERP)</bdi> המחברת ספקים, ארגון ולקוחות, שבה כל ארגון מדווח על המלאי שברשותו","זרימת חומרים מספק חומרי הגלם ועד הלקוח הסופי שבקצה, כשכל ארגון בדרך מבצע 'המרה' ומוסיף ערך","אוסף המחלקות בתוך הארגון — רכש, ייצור, מכירות וכספים — שכל אחת מהן אחראית לחוליה אחת בתהליך"],c:2,e:"'שרשרת אספקה זו בעצם זרימת החומרים מספק חומרי הגלם ועד הלקוח הסופי שנמצא בקצה' — דוגמת המסטיק שעבר 'הרבה תלאות' בין ארגונים רבים, שכל אחד מהם מבצע 'פעולת המרה' וחייב להוסיף ערך, אחרת יידחק החוצה. <bdi dir='ltr'>ERP</bdi> והסכמי מסגרת הם כלים או שיטות שפועלים בתוך השרשרת, לא הגדרתה; המחלקות הפנימיות הן העולם הפנימי של כל ארגון בשרשרת. (הרצאה 14.7, דקה ~34-35)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"המרצה המחיש את מושג ה'המרה' באמצעות האוניברסיטה. מהי המרה בהקשר של שרשרת האספקה?",o:["לקיחת חומרי גלם, ציוד וכוח אדם והפיכתם למוצר — כמו שהאוניברסיטה לוקחת מרצה וכיתה והופכת אותם לידע","העברת הבעלות על החומר מספק אחד לספק הבא בשרשרת, כפי שהאוניברסיטה 'מעבירה' סטודנטים משנה לשנה","תרגום תחזית הביקוש להזמנת רכש — כמו שהאוניברסיטה ממירה את מספר הנרשמים למספר הכיתות הנדרש","מעבר משיטת הדחיפה לשיטת המשיכה — כמו שהאוניברסיטה פותחת קורסים לפי דרישת הסטודנטים ולא לפי תכנון"],c:0,e:"'אנחנו לוקחים חומרי גלם, ציוד וכוח אדם והופכים את זה למוצר' — זו ההמרה, וכל ארגון בשרשרת מבצע אותה. האוניברסיטה 'לוקחת מרצה, כיתה עם מזגנים... והופכת את זה לידע', כמו אפיית עוגה מחומרים. המרצה הוסיף שיש ארגונים שיודעים לבצע המרה טוב יותר מאחרים ולכן מצליחים יותר. העברת בעלות או תרגום תחזית להזמנה אינם המרה. (הרצאה 14.7, דקה ~35-36)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"לפי ההרצאה, מאילו שלושה מרכיבים מורכב ניהול שרשרת האספקה, ומה מתקבל כשמחברים את שלושתם למערכת אחת?",o:["חיזוי, ניהול מלאי ושינוע; חיבורם יחד נותן <bdi dir='ltr'>MRP</bdi> — תכנון דרישות החומרים של הארגון","דחיפה, משיכה ואינטגרציה; חיבורם יחד נותן <bdi dir='ltr'>VMI</bdi> — מלאי המנוהל על ידי הספק דרך רשת האינטרנט","זמינות, אמינות ו-<bdi dir='ltr'>MTBF</bdi>; חיבורם יחד נותן את מדד האמינות במקביל של המערכת כולה","ההיצע (ספקים — <bdi dir='ltr'>SRM</bdi>), הפנים-ארגוני <bdi dir='ltr'>(ISCM)</bdi> והביקוש (לקוחות — <bdi dir='ltr'>CRM</bdi>); חיבורם יחד נותן <bdi dir='ltr'>ERP</bdi>"],c:3,e:"המרצה תיאר את ניהול השרשרת כמורכב משלושה מרכיבים — ההיצע (ניהול הספקים, <bdi dir='ltr'>SRM</bdi>), הפנים-ארגוני <bdi dir='ltr'>(Internal SCM)</bdi> והביקוש (<bdi dir='ltr'>CRM</bdi> — מחירים, תלונות, אשראי, מבצעים של הלקוחות). 'בואו נחבר את כל השלושה ביחד, נקבל <bdi dir='ltr'>ERP</bdi> — <bdi dir='ltr'>Enterprise Resource Planning</bdi>' (למשל <bdi dir='ltr'>SAP</bdi>), כי הגיעו למסקנה ש'אי אפשר לעבוד עם כמה מערכות'. <bdi dir='ltr'>MRP</bdi> הוא השלב הקודם שהתמקד בדרישות החומר בלבד. (הרצאה 14.7, דקה ~54-56)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"ספק של חנות ספרים רואה במערכת שמלאי העותקים של ספר מסוים ירד מ-10 ל-5, ושולח עוד 10 בלי שהחנות הזמינה. איזה מושג מההרצאה מתאר זאת, ומה איפשר אותו?",o:["<bdi dir='ltr'>MRP</bdi> — תכנון דרישות החומרים בתוך הארגון; הדבר התאפשר בזכות רשת תקשורת המחשבים הפנימית שקדמה לאינטרנט בשנות ה-80","<bdi dir='ltr'>VMI</bdi> — הספק מנהל את מלאי הלקוח על סמך מידע משותף; הדבר התאפשר בזכות האינטרנט, שהכניס את הספק לתוך המידע","שיטת הדחיפה — הספק דוחף לפי הסכם מסגרת; הדבר התאפשר בזכות תחזית שנתית שסוכמה מראש בין הספק לבין החנות בתחילת השנה","<bdi dir='ltr'>CRM</bdi> — ניהול קשרי הלקוחות של החנות; הדבר התאפשר בזכות מערכת ה-<bdi dir='ltr'>ERP</bdi> שהספק התקין אצל הלקוח"],c:1,e:"המרצה הסביר שבשלב שרשרת האספקה גם הספק והלקוח נכנסו לתוך המידע: הספק 'יכול להסתכל מה יש לכם במלאי... ירד מ-10 ל-5, זורק לו עוד 10' בלי לחכות להזמנה — 'קוראים לזה <bdi dir='ltr'>VMI</bdi>... וזה בזכות האינטרנט'. הוא הוסיף שלא כולם מאמצים זאת בגלל חשש מחשיפת סודות. <bdi dir='ltr'>MRP</bdi> הוא אינטגרציה פנים-ארגונית בלבד, ושיטת הדחיפה פועלת לפי הסכם ולא לפי מלאי בפועל. (הרצאה 14.7, דקה ~53)"},
{t:"אינטגרציה ושוט השור",s:"הקלטות",q:"בשנות ה-80 ארגונים רכשו מחשב אישי למנכ״ל, למנהל הרכב, למנהל הכספים ולמנהל הלוגיסטיקה. איזו בעיה נוצרה, ואיזו תפיסה — שקדמה לאינטרנט — באה לפתור אותה?",o:["המחשבים היו יקרים מדי; <bdi dir='ltr'>ERP</bdi> איחד את כל המחשבים למחשב מרכזי אחד וחסך לארגונים את עלויות הרכישה והתחזוקה הכפולות","המנהלים לא ידעו להפעיל אקסל; <bdi dir='ltr'>CRM</bdi> הכשיר אותם לנהל את נתוני הלקוחות והמחירים בצורה ממוחשבת ואחידה","המחשבים לא 'דיברו' זה עם זה; <bdi dir='ltr'>MRP</bdi> (תכנון דרישות החומרים) יצר שיתוף מידע פנים-ארגוני סביב הרכש, המלאי והניפוק","הספקים לא ראו את המלאי; <bdi dir='ltr'>VMI</bdi> חיבר את מחשבי הספקים למחשב של מנהל הרכש באמצעות תקשורת מחשבים ייעודית"],c:2,e:"'כל אחד עם מחשב — מה הבעיה? המחשבים לא מדברים זה עם זה'. לפני האינטרנט התפתחה תפיסת ה-<bdi dir='ltr'>MRP</bdi>, שהתמקדה בדרישות החומר: מנהל הרכש רוכש, מנהל המחסן יודע, המנכ״ל יודע, מנהל השיווק יודע מה יש במלאי — 'פה התחילה האינטגרציה' הפנים-ארגונית. <bdi dir='ltr'>ERP</bdi> ו-<bdi dir='ltr'>VMI</bdi> הם שלבים מאוחרים יותר, המחברים גם ספקים ולקוחות, ובעיית המחיר או האקסל לא הוזכרה כלל. (הרצאה 14.7, דקה ~50-52)"}
]);
