{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי שקף ״עיסוקי הליבה של הארגון״, מהי השאלה המרכזית שעומדת בפני ארגון שעיסוקו פיתוח ומכירות?",o:["בחינת מיקור חוץ (Outsource) של הפעילות התפעולית","האם לספק שירותים תפעוליים גם לארגונים אחרים","האם להקים מפעל עצמי כדי לשלוט בכל שלבי הייצור","האם לעבור לייצור למלאי במקום ייצור לפי הזמנה"],c:0,e:"בעץ ״סוג הארגון?״ בשקף, ארגון פיתוח/מכירות מוביל ל״בחינת Outsource״. ארגון תפעולי מתפצל לשני סוגים: ארגון שירותים, שהשאלה שלו היא ״אספקת שירותים לאחרים?״, וארגון יצרני, שהשאלה שלו היא In house או Outsource. (שא-4, שקף 8)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"ארגון תפעולי שעיסוקו מתן שירותים — למשל מערך אחזקה של צי רכב — שואל את עצמו מה הצעד הבא בעיסוקי הליבה שלו. מה מציע עץ ״סוג הארגון״?",o:["לבחון אספקת שירותים לארגונים אחרים","לבחון פיצול למרכזי רווח נפרדים","לבחון מעבר לייצור עצמי מלא","לבחון מיקור חוץ של כל פעילותו התפעולית"],c:0,e:"בעץ שבשקף, ארגון תפעולי מתפצל ל״יצרני״ (In house / Outsource?) ול״שירותים״, וענף השירותים מוביל לשאלה ״אספקת שירותים לאחרים?״ — כלומר ניצול היכולת התפעולית למתן שירות גם לגורמים חיצוניים. בחינת Outsource מופיעה בענף הפיתוח/מכירות. (שא-4, שקף 8)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה של yes שהוצג בכיתה, כיצד תוארה התפתחות שרשרת האספקה של החברה לאורך השנים?",o:["In house ➔ Outsource ➔ In house","Outsource ➔ Outsource ➔ In house","Outsource ➔ In house ➔ Outsource","In house ➔ Outsource ➔ Outsource"],c:2,e:"שקף ״למה קמה yes?״ מתאר את שרשרת האספקה של החברה כמהלך של Outsource ➔ In house ➔ Outsource, ושואל אם החברה עמדה במטרה שלשמה קמה ואם יש לה עתיד. בשלב I התמקדה בליבה (שיווק, מרכז שידורים), ובשלב II הקימה חטיבת לקוחות (מכירות, התקנות ושירות לקוחות). (שא-4, שקף 10)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה ECI–Flex (״The $1B outsourcing״), איזה מהשינויים הבאים מתאר נכון את מערך התפעול של ECI אחרי 2008, לעומת לפני 2007?",o:["מ-4 אתרי ייצור עצמיים ל-8 אתרים, ומחברה פרטית לחברה ציבורית בבורסה","מ-1,000 עובדי תפעול ל-70, ומ-4 אתרי ייצור עצמיים ל-2 שותפים עסקיים","מ-1,000 עובדי תפעול ל-700, ומ-4 אתרי ייצור עצמיים ל-4 שותפים עסקיים","מ-70 עובדי תפעול ל-1,000, ומ-2 שותפים עסקיים ל-4 אתרי ייצור עצמיים"],c:1,e:"לפני 2007 ECI הייתה חברה ציבורית עם עסק חזק ותפעול In-House: 4 אתרי ייצור עצמיים ומעט קבלני משנה, ו-1,000 עובדי תפעול. אחרי 2008 הייתה חברה פרטית עם עסק חלש, והתפעול עבר למיקור חוץ: 4 ← 2 שותפים עסקיים ו-70 עובדי תפעול בלבד. (שא-4, שקף 14)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה הייתה עמדתו של שלמה ארליך לגבי השאלה אם מיקור החוץ של ECI ל-Flex היה רעיון טוב?",o:["זה היה נכון רק מבחינה כספית, אך לדעתו פגע באיכות המוצרים עד כדי אובדן לקוחות מרכזיים","זה היה מהלך נכון לכל חברה בענף, ולכן כל יצרני התקשורת בישראל העבירו אז את הייצור לחו״ל","זה היה כישלון ברור, כי ECI איבדה את השליטה בידע התפעולי ונאלצה לחזור לייצור עצמי מלא","אין תשובה אמיתית — תלוי את מי שואלים; לדעתו האישית זה היה מהלך נכון שאולי הציל את ECI"],c:3,e:"בשקף הסיכום של המקרה נאמר: ״No real answer — depends who you ask…״, ושלמה מוסיף: ״I personally think it was the right move that may have saved ECI״. המקרה מוצג כדילמה, לא ככישלון וגם לא כמתכון גורף לכל הענף. (שא-4, שקף 15)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"סמנכ״ל הכספים של חברת אלקטרוניקה מבקש שהוצאות הייצור ישתנו בהתאם להיקף המכירות, במקום לשלם קבוע על מפעל ועובדים גם בחודשים חלשים. איזה שיקול בעד Turn Key מתאים לבקשתו?",o:["שמירה על הקניין הרוחני (IP) בבית","מעבר מעלויות קבועות לעלויות משתנות","שליטה מלאה בכלל הפעילות התפעולית","הגדלת המלאי כדי לשפר את זמינות הייצור"],c:1,e:"בין השיקולים בעד Turn Key בשקף 17: תמיכה באסטרטגיה, השפעה על הדוחות הכספיים, עמידה ביעדי השרשרת, מיקוד בליבה והעברה למומחים, Risk Sharing, TCO, מעבר מעלויות קבועות למשתנות והורדת מלאי. שמירת IP ושליטה בפעילות הם דווקא יתרונות הייצור העצמי (Make), ומיקור חוץ מוריד מלאי ולא מגדיל אותו. (שא-4, שקפים 17, 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> שיקול בעד Turn Key — מיקור חוץ מלא — לפי המצגת?",o:["מיקוד בליבה והעברה למומחים בתחום","שיתוף הסיכונים עם השותף (Risk Sharing)","הורדת המלאי והעלות הכוללת (TCO)","שמירה על הקניין הרוחני של הארגון"],c:3,e:"שיקולי Turn Key בשקף 17 כוללים Risk Sharing, מיקוד בפעילות הארגון והעברה למומחים, TCO, מעבר מעלויות קבועות למשתנות והורדת מלאי. שמירת הקניין הרוחני (IP) מופיעה בשקף 19 כיתרון של ייצור עצמי (Make) — היא שיקול נגד מיקור חוץ, לא בעדו. (שא-4, שקפים 17, 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברת רחפנים פיתחה אלגוריתם ייחודי לניווט, ומנהלת התפעול חוששת שהעברת הייצור לקבלן חיצוני תחשוף אותו למתחרים. לאיזה צד בשיקולי Make or Buy מתאים החשש?",o:["Make — הורדת המלאי והעברתו לידי השותף","Buy — רכישת ידע מהמומחים בתחום הייצור","Buy — החלפת עלויות קבועות בעלויות משתנות","Make — שמירה על ה-IP ושליטה בכלל הפעילות"],c:3,e:"לפי שקף 19, יתרונות הייצור העצמי (Make) הם שליטה בהוצאות העצמיות, שמירה על IP ושליטה בכלל הפעילות; יתרונות הרכישה (Buy) הם החלפת עלויות קבועות במשתנות ו״רכישת ידע״ מהמומחים. חשש מחשיפת קניין רוחני הוא נימוק מובהק בעד Make. הורדת מלאי היא יתרון של מיקור חוץ, לא של ייצור עצמי. (שא-4, שקף 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"יצרן ציוד רפואי קטן שוקל להעביר את הרכבת המעגלים האלקטרוניים ליצרן קבלן גדול ומנוסה, כי אין לו מומחיות בטכנולוגיות ההרכבה החדשות. איזה יתרון של Buy מנצל היצרן?",o:["שליטה בהוצאות העצמיות של המפעל","שמירה על הקניין הרוחני שבמוצר","שליטה מלאה בכל שלבי הייצור","״רכישת ידע״ מהמומחים בתחום"],c:3,e:"בשקף 19, בצד הרכישה (Buy) מופיעים החלפת עלויות קבועות במשתנות ו״רכישת ידע״ מהמומחים בתחום — בדיוק הנימוק בתרחיש. שליטה בהוצאות, שמירת IP ושליטה בכלל הפעילות הם יתרונות הייצור העצמי (Make). (שא-4, שקף 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי פירמידת ״רמות מיקור חוץ״ במצגת, מהו הסדר הנכון מבסיס הפירמידה ועד פסגתה?",o:["Subcontracting → All In-house → Full Turn Key → Outsource → JDM → DMS → ODM","All In-house → Subcontracting → DMS → Outsource → JDM → Full Turn Key → ODM","All In-house → Subcontracting → Outsource → Full Turn Key → DMS → JDM → ODM","All In-house → Outsource → Subcontracting → DMS → Full Turn Key → ODM → JDM"],c:2,e:"בפירמידה שבשקף 20, מלמטה למעלה: All In-house, Subcontracting, Outsource, Full Turn Key, DMS (Design & Mfg. Services), JDM (Join Development) ו-ODM (Origin Design) בפסגה. ככל שעולים, הספק לוקח אחריות רחבה יותר — מקבלנות משנה בלבד, דרך אחריות מלאה על הייצור, ועד תכנון המוצר עצמו. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברה מעבירה לספק חיצוני שלבים בודדים בתהליך — למשל ציפוי והרכבה של חלקים — בעוד שכל שאר הייצור, הרכש והתכנון נשארים אצלה. באיזו רמה של מיקור חוץ מדובר?",o:["JDM — פיתוח משותף עם הספק","Full Turn Key — מיקור חוץ מלא","Outsource — העברת הייצור כולו","Subcontracting — קבלנות משנה"],c:3,e:"בפירמידה שבשקף 20, Subcontracting היא הרמה הראשונה מעל All In-house: הספק מבצע פעולות מסוימות בלבד, והארגון מחזיק בשאר. Outsource ו-Full Turn Key מעבירים לספק את הייצור ואת האחריות עליו, ו-JDM כבר כולל פיתוח משותף של המוצר. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברת מותג צרכני קונה מספק מוצר שהספק עצמו תכנן ומייצר, ומוסיפה לו רק את המותג שלה. איזו רמה בפירמידת מיקור החוץ מתארת זאת?",o:["DMS — שירותי תכנון וייצור, באמצע הפירמידה","Full Turn Key — ייצור מלא לפי תכנון החברה","ODM — Origin Design, בפסגת הפירמידה","JDM — פיתוח משותף של החברה ושל הספק"],c:2,e:"בפסגת הפירמידה נמצא ODM (Origin Design): הספק הוא שמתכנן את המוצר ומייצר אותו, והחברה מוכרת אותו תחת המותג שלה. ב-JDM התכנון משותף, ב-DMS הספק נותן שירותי תכנון וייצור, וב-Full Turn Key הספק אחראי לייצור המלא אך לא לתכנון המוצר. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה מבטאים החצים ״EMS״ ו-״ODM״ המסומנים לצד פירמידת רמות מיקור החוץ?",o:["EMS ו-ODM הם מדדי ביצוע שבאמצעותם מעריכים כל רמה בפירמידה","ספקי EMS יורדים לקבלנות משנה, וספקי ODM עולים למיקור חוץ מלא ומקיף","ספקי EMS מטפסים לשירותי תכנון, וספקי ODM יורדים אל שירותי הייצור","EMS ו-ODM הן שתי רמות נוספות, בבסיס הפירמידה ובאמצעה בהתאמה"],c:2,e:"בשקף 20 מופיעה הכותרת ״מגמות״ עם שני חצים: חץ EMS העולה כלפי מעלה וחץ ODM היורד כלפי מטה. המשמעות: יצרני שירותי ייצור (EMS) מרחיבים את היצע השירותים שלהם כלפי תכנון, ויצרני ODM מרחיבים כלפי שירותי ייצור — שני הצדדים מתכנסים לאמצע הפירמידה. הם אינם רמות נוספות. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בין הדגשים למיקור חוץ מלא, שלמה ממליץ ״Always have a 2nd Source״. באיזה שם הוא מכנה את המודל?",o:["מודל הפינה בחדר העגול (Corner in a Rounded Room)","מודל המראה האחורית (Back Mirror Model)","מודל הטיפוס למגדל (Climb to the Higher Point)","מודל המטקות ולא הטניס (Play MATKOT not Tennis)"],c:1,e:"בשקף 21: ״Always have a 2nd Source (Back Mirror Model)״ — כמו מראה אחורית, צריך תמיד לראות חלופה. ״פינה בחדר עגול״ מתאר אחריות End-to-End, ״מטקות ולא טניס״ מתאר שותפות עסקית (״שני צוותים — חברה אחת״), ו״לטפס לנקודה הגבוהה במגדל״ מתאר את נקודת המבט של ההנהלה הבכירה. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי דגשי מיקור החוץ המלא, מה הופך ל״מאמץ העיקרי ולמוקד המתח בארגון״ אחרי המעבר ל-Full Outsourcing?",o:["ניהול המחסנים והשילוח (Warehousing)","ניהול כוח האדם בקו הייצור (Workforce)","ניהול החוסרים (Shortages Management)","ניהול תחזוקת המכונות במפעל (Maintenance)"],c:2,e:"בשקף 21: ״Shortages Management — Main effort and tension in organization!״. כשהייצור אצל השותף, הארגון אינו מנהל עוד עובדי ייצור ומכונות — והמאמץ עובר לוודא שהחומר זמין ושהחוסרים מטופלים. באותו שקף מופיעים גם רכש BOM מלא, Aging ותמחיר ברמת מוצר. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"שלמה מתאר מיקור חוץ מלא כ״פינה בחדר עגול״ (A Corner in Rounded Room). איזה עיקרון מבטא הדימוי?",o:["ראייה מלמעלה — לטפס לנקודה הגבוהה במגדל ולראות הכול","גיבוי תמידי — לשמור תמיד על מקור אספקה שני לכל פריט קריטי","אחריות מלאה מקצה לקצה (End 2 End) — אין פינה שבה אפשר להסתתר","שיתוף פעולה עסקי — שני צוותים שמשחקים יחד כחברה אחת מול הלקוח"],c:2,e:"בשקף 21, ״Full Outsourcing — End 2 End Responsibility (A Corner in Rounded Room)״: בחדר עגול אין פינות — השותף אחראי על כל התהליך ואין שלב שנופל ״בין הכיסאות״. שיתוף הפעולה (״מטקות ולא טניס״), המקור השני (״המראה האחורית״) והמבט מלמעלה הם דגשים אחרים באותו שקף. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי דגשי מיקור החוץ המלא, איך משתנה בסיס הרכש אצל השותף?",o:["מרכש לפי תחזית (Purchase to Forecast) לאספקה מלאה של הזמנות הלקוח","מרכש שמבצע השותף לרכש שחוזר אל הארגון עצמו ברמת כל רכיב ורכיב","מרכש של פריטים בודדים לרכש של חומרי גלם בלבד, בלי רכיבים מורכבים","מרכש לפי הזמנות לקוח לרכש לפי תחזית שנתית קבועה ומוסכמת מראש"],c:0,e:"בשקף 21: ״Purchase to Forecast ➔ Full Customer Order Delivery״ — השותף אינו קונה רק לפי תחזית, אלא אחראי לאספקה מלאה של הזמנות הלקוחות, ולצד זה מבצע רכש של ה-BOM המלא (Full BOM Purchasing). הכיוון ההפוך סותר את רעיון האחריות מקצה לקצה. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה מתאר המעבר ״מרשת אספקה מקומית לרשת אספקה גלוקאלית״ (GloCal) במצגת?",o:["מרשת של כמה אתרים — לריכוז כל הייצור באתר אחד גדול, כדי לנצל יתרונות לגודל בשוק הגלובלי","מאתר ארגון יחיד מול ספקים ולקוחות — לרשת של כמה אתרים, ספקים ולקוחות; Think Global, Act Local","משיווק גלובלי — לשיווק מקומי בלבד, כדי לצמצם את עלויות ההפצה וההובלה הבין-לאומית","מרכש מקומי בלבד — לרכש מספק גלובלי יחיד, כדי להוזיל את המחיר באמצעות כמויות גדולות"],c:1,e:"בשקף 22 מוצג ״לפני״: אתר ארגון אחד בין ספק ללקוח; ו״אחרי״: כמה אתרי ארגון, ספקים ולקוחות המחוברים ברשת — ״GloCal — Think Global, Act Local!״: חשיבה גלובלית ופעולה מקומית קרוב לשווקים. ריכוז הייצור באתר אחד הוא הכיוון ההפוך. (שא-4, שקף 22)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"כיצד מגדירה המצגת ייצור רזה (Lean Production)?",o:["מתודולוגיה להחזקת מלאי ביטחון גבוה, כדי למנוע כל עצירה בקו הייצור","מתודולוגיה לצמצום הבזבוז לאורך תהליך הייצור, תוך התמקדות בערך ללקוח","מתודולוגיה להגדלת מנות הייצור, כדי לנצל עד תום את קיבולת המפעל","מתודולוגיה לצמצום מספר העובדים, כדי להוריד את עלויות השכר במפעל"],c:1,e:"לפי שקף 24, ייצור רזה הוא מתודולוגיית ניהול ייצור שמטרתה צמצום הבזבוז לאורך תהליך הייצור תוך התמקדות בערך ללקוח (Customer Value), בתהליך מתמשך של ייעול זרימת המידע והחומר. צמצום הבזבוז מגדיל את האיכות ומקטין את זמן הייצור ואת ההוצאות. (שא-4, שקף 24)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתחנת הרכבה, כל מגש חלקים מגיע עם כרטיס. כשהמגש מתרוקן, הכרטיס נשלח לתחנה הקודמת כאות לייצר מנה חדשה בגודל קבוע. באיזה כלי של ייצור רזה מדובר?",o:["Work cells — תאי עבודה שמרכזים מספר תחנות יחד","Poka Yoke — מנגנון שמונע טעויות וחלקים פגומים","Kanban — כרטיס המגדיר מנת ייצור לחידוש המלאי","Visual Management — לוח בקרה חזותי בקו הייצור"],c:2,e:"Kanban (״פתק״) הוא כלי להגדרת מנות ייצור לחידוש המלאי: הכרטיס הוא האות שמושך ייצור מהתחנה הקודמת לפי הצריכה בפועל — יישום של Pull. בשקף טויוטה הוא מופיע כ״Kanban — תזמון ביקוש, Pull Systems״. (שא-4, שקפים 25, 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מפעל התקין בקו ההרכבה התקן שבו חלק אינו נכנס למקומו אם הוא הפוך או פגום, כך שלא ניתן להמשיך בהרכבה. איזה עיקרון מיושם?",o:["Takt Time — איזון קווי הייצור לפי קצב קבוע","Heijunka — איזון האספקות מול הביקוש בקו הייצור","One Piece Flow — ייצור בנפחים קטנים של יחידה אחת","Poka Yoke — שאיפה לאפס פגמים ופתרון בעיות במקור"],c:3,e:"בשקף 25: שאיפה לאפס פגמים, גילוי ופתרון בעיות בנקודת המקור — Poka Yoke, מנגנון שמונע טעות מלכתחילה. One Piece Flow עוסק בגודל המנות, ו-Heijunka ו-Takt Time עוסקים באיזון הייצור והאספקות — לא במניעת פגמים. (שא-4, שקף 25)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"קו ייצור עבר מייצור במנות של 500 יחידות לתהליך שבו כל יחידה עוברת מתחנה לתחנה מיד עם סיום הטיפול בה. איזה עיקרון של ייצור רזה מיושם?",o:["Work cells — ריכוז התחנות לתא עבודה אחד במפעל","One Piece Flow — נפחי ייצור קטנים בלי להקריב יעילות","Just In Time — איזון שטף האספקה מול שטף הייצור","Kanban — כרטיסים המגדירים מנה קבועה לחידוש המלאי"],c:1,e:"One Piece Flow בשקף 25: ייצור בנפחים קטנים יותר — עד יחידה בודדת — מבלי להקריב יעילות. היחידה זורמת בין התחנות בלי להמתין להשלמת מנה גדולה, וכך מצטמצמים מלאי בתהליך וזמני המתנה. (שא-4, שקף 25)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי המצגת, מהו ״בזבוז״ (Muda)?",o:["פעולה או הוצאה שהלקוח אינו מוכן לשלם עבורה","כל עלות שחורגת מהתקציב השנתי של המפעל","כל פעולה שמתבצעת על ידי ספק חיצוני לארגון","כל מוצר שנמכר ללקוח במחיר נמוך מעלותו"],c:0,e:"שקף 26 מגדיר בזבוז כפעולה או הוצאה שהלקוח אינו מוכן לשלם עבורה. זו נקודת המבט של הלקוח: פעילות שאינה מוסיפה ערך בעיניו היא בזבוז, גם אם היא מתוקצבת ומבוצעת בתוך הארגון. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בקו הרכבה, עובדים עומדים בחיבוק ידיים כעשרים דקות בכל משמרת עד שמגיעים חלקים מהתחנה הקודמת. איזה סוג בזבוז מתואר?",o:["המתנה","תנועות מיותרות","מלאי לא נדרש","עיבוד עודף"],c:0,e:"עובדים ומכונות שממתינים לחלקים, לאישורים או למידע — זה בזבוז ״המתנה״, השני ברשימה בשקף 26. תנועות מיותרות הן תזוזות של העובד עצמו, מלאי לא נדרש הוא חומר שמצטבר בלי צורך, ועיבוד עודף הוא ביצוע תהליכים מיותרים. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מפעל ממשיך לייצר גם כשאין הזמנות, ״כדי שהמכונות לא יעמדו״, והמוצרים הגמורים נערמים במחסן. איזה סוג בזבוז הוא הבעיה העיקרית כאן?",o:["תוצרת פגומה — איכות","ייצור עודף — כמות","המתנה — עיכוב","תעבורה — הובלה"],c:1,e:"ייצור מעבר למה שהלקוח דורש הוא בזבוז ״ייצור עודף — כמות״ (מספר 6 בשקף 26). הוא גם גורם בזבוזים נוספים כמו מלאי לא נדרש, ולכן נחשב לאחד המסוכנים. הייצור הרזה פועל לפי Pull — לפי דרישת הלקוח ולא לפי הקיבולת האפשרית. (שא-4, שקפים 25–26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"טופס אישור עובר חמש חתימות של מנהלים, אף שרק שתיים מהן משנות משהו בהחלטה. לאיזה סוג בזבוז מתאים התיאור?",o:["תנועות מיותרות — תזוזת עובדים","ייצור עודף — כמות גדולה מדי","מלאי לא נדרש — טפסים ממתינים","עיבוד עודף — תהליכים מיותרים"],c:3,e:"ביצוע שלבים שאינם מוסיפים ערך — כמו חתימות שאינן משנות את ההחלטה — הוא ״עיבוד עודף — תהליכים מיותרים״ (מספר 7 בשקף 26). הבזבוז אינו בכמות שמיוצרת או בתנועת העובד, אלא בעצם קיומם של שלבים שהלקוח לא ישלם עליהם. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במפעל, מלגזה מעבירה משטחים בין שלושה מחסני ביניים לפני שהם מגיעים לקו הייצור, אף שאפשר היה להביאם ישירות. איזה סוג בזבוז מתואר?",o:["תעבורה","עיבוד עודף","תוצרת פגומה","המתנה"],c:0,e:"שינוע מיותר של חומרים בין מקומות הוא בזבוז ״תעבורה״ (מספר 4 בשקף 26). הוא שונה מ״תנועות מיותרות״, שעניינן תנועות של העובד עצמו בתחנת העבודה (למשל חיפוש כלים או הושטת יד רחוקה). (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתמונה שבשקף הבזבוזים כתוב ״Eight Wastes״, אך הרשימה בשקף מונה שבעה. איזה בזבוז מופיע בתמונה ואינו ברשימה?",o:["מלאי לא נדרש שמצטבר במחסנים ובקו הייצור (Inventory)","אי-ניצול של כישורי העובדים (Under-utilized People)","שינוע מיותר בין מחסנים (Transportation)","המתנה של עובדים ומכונות לחלקים ולמידע (Waiting)"],c:1,e:"שבעת הבזבוזים ברשימה בשקף 26: תוצרת פגומה, המתנה, מלאי לא נדרש, תעבורה, תנועות מיותרות, ייצור עודף ועיבוד עודף. בתמונה ״Eight Wastes״ מופיע בזבוז שמיני — Under-utilized People, אי-ניצול של הכישורים והרעיונות של העובדים. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מנהל מפעל מתכנן אירוע קייזן. באיזה שלב עליו לבחור את התהליך לשיפור, להגדיר את גבולותיו ואת המדדים, ולבחור משתתפים — עובדים, ספקים ולקוחות קצה?",o:["בשלב אימוץ השיפור וסגירת התהליך","בשלב סיכום האירוע (Post-Kaizen)","בשלב ההתארגנות לאירוע (Pre-Kaizen)","בשלב האירוע עצמו (Kaizen Event)"],c:2,e:"לפי שקף 27, בשלב ההתארגנות (Pre-Kaizen) בוחרים את התהליך לשיפור, מגדירים את המצב הקיים ואת גבולות התהליך, קובעים מדדים ויעדים, בוחרים מנהל ומשתתפים (עובדים, ספקים ולקוחות קצה) ומנתחים את התהליך. באירוע עצמו ממפים, מאתרים בזבוזים ומחליטים. (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"צוות קייזן סיים את האירוע והחליט על שינויים. חודשיים אחר כך הוא משווה את ביצועי התהליך החדש לתהליך הקודם לפי המדדים שנקבעו, ומחליט אם לאמץ את השיפורים. באיזה שלב מדובר?",o:["PDCA — שלב התכנון (Plan)","Kaizen Event — האירוע עצמו","Pre-Kaizen — התארגנות לאירוע","Post-Kaizen — סיכום האירוע"],c:3,e:"בשלב Post-Kaizen (סיכום האירוע) עוקבים אחר המשימות הפתוחות, מדריכים את הצוותים, בוחנים את אפקטיביות התהליך החדש בהשוואה לקודם לפי המדדים שנקבעו, ומחליטים אם לאמץ את השיפורים ולסגור את התהליך. (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"איזו פעולה מתבצעת <b>במהלך</b> אירוע הקייזן עצמו (Kaizen Event), ולא לפניו או אחריו?",o:["בחירת התהליך לשיפור והגדרת גבולותיו","מעקב אחר המשימות הפתוחות אחרי האירוע","הדרכת כל הצוותים בתהליך החדש שאומץ","מיפוי חזותי של המצב הקיים ואיתור הבזבוזים"],c:3,e:"באירוע עצמו (שקף 27): מיפוי חזותי של התהליך במצב הקיים, איתור בזבוזים והצעת רעיונות, חלוקה לצוותים, דיון בחלופות והחלטה, תכנון הביצוע, מדידת התוצאות ותיעוד חזותי של התהליך המשופר. בחירת התהליך היא בהתארגנות (Pre-Kaizen), והדרכה ומעקב הם בסיכום (Post-Kaizen). (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתחנת עבודה מוציאים את כל הכלים והחומרים, משאירים רק את הפריטים החיוניים לעבודה, ואת השאר מאחסנים במקום אחר או זורקים. איזה שלב של 5S זה?",o:["Sort (Seiri) — מיון","Standardize (Seiketsu) — תקינה","Shine (Seiso) — ניקיון","Straighten (Seiton) — סידור"],c:0,e:"לפי שקף 28, Sort (Seiri) הוא מיון הכלים, החומרים והמסמכים באזור העבודה ושמירה רק על הפריטים החיוניים — כל השאר מאוחסנים או נזרקים. Straighten הוא סידור שיטתי של מה שנשאר לגישה קלה, ו-Shine הוא שמירה על אזור עבודה נקי. (שא-4, שקף 28)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במחסן כלי עבודה סימנו על הקיר צללית לכל כלי, כך שכל כלי מוחזר למקום קבוע ומוצא בתוך שניות. איזה שלב של 5S מיושם?",o:["Straighten (Seiton) — סידור שיטתי","Shine (Seiso) — ניקיון האזור","Sort (Seiri) — מיון וזריקה","Sustain (Shitsuke) — שימור הרגל"],c:0,e:"Straighten (Seiton) בשקף 28: אזור עבודה מאורגן — ציוד וחומרים מסודרים באופן שיטתי כדי לאפשר את הגישה הקלה והיעילה ביותר. מיון (Sort) קודם לו ומחליט מה להשאיר, ושימור (Sustain) דואג שהסדר יישמר לאורך זמן. (שא-4, שקף 28)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בשקף ״יישום ייצור רזה בטויוטה״, מה מתאר המושג Jidoka?",o:["תזמון ביקוש","איזון אספקות מול הביקוש","אוטומציה חכמה","איזון קווי ייצור"],c:2,e:"בשקף 29: JIT — Just In Time Production; Kanban — תזמון ביקוש (Pull Systems); איזון קווי ייצור — Takt Time; איזון אספקות מול הביקוש — Heijunka; זיהוי תקלות, עצירת הקו ופתרון בעיות השורש; אוטומציה חכמה — Jidoka; שיפור מתמיד — Kaizen; ויישום 5S בסביבת העבודה. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי שקף טויוטה, איזה מושג מתאר את <b>איזון האספקות מול הביקוש</b>?",o:["Takt Time","Heijunka","Kaizen","Jidoka"],c:1,e:"בשקף 29 מוצגים זה לצד זה ״איזון קווי ייצור — Takt Time״ ו״איזון אספקות מול הביקוש — Heijunka״. Jidoka היא אוטומציה חכמה, ו-Kaizen הוא שיפור מתמיד. בבית ה-TPS שבתמונה, איזון העומסים (Load Leveling) מופיע כבסיס הבית. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מהי המטרה של מערכת הייצור של טויוטה (TPS), כפי שהיא מנוסחת בשקף?",o:["שיפור יעילות תוך צמצום הבזבוז","הגדלת נפחי הייצור והמלאי","הורדת מחיר המכירה ללקוח","ייצור כל רכיב במפעל עצמי"],c:0,e:"בשקף 29: ״המטרה — שיפור יעילות תוך צמצום הבזבוז״. לשם כך משמשים העקרונות — JIT, Kanban, איזון קווים ואספקות, Jidoka, Kaizen, 5S, הבטחת איכות ושיתוף עובדים, מנהלים וספקים. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה Timbuk2 שהוצג בכיתה, מה אפיין את החברה ואת המוצר האיקוני שלה?",o:["אופניים מותאמים אישית, שמיוצרים בקבלנות משנה ונמכרים בחנויות האופניים","תיקים סטנדרטיים בכמויות גדולות, שמיוצרים בסין ונמכרים ממלאי מרכזי","ציוד רכיבה מקצועי, שמיוצר בהונג קונג ונמסר למפיצים בתנאי FOB","תיקי שליח בהתאמה אישית שמיוצרים בסן פרנסיסקו, עם דגש על Just-in-Time"],c:3,e:"לפי שקף 32, Timbuk2 נוסדה ב-1989 במוסך בסן פרנסיסקו על ידי שליח אופניים, ומייצרת מאז ב-Mission District. מייסדה היה ״אובססיבי ל-Just-in-Time״, החברה הביאה התאמה אישית להמונים והשיקה את הקסטומייזר המקוון הראשון ב-1999 — ותיק השליח המותאם אישית, שמיוצר בסן פרנסיסקו, הוא הלב שלה. (שא-4, שקפים 31–32)"}
]);

BANK.push.apply(BANK,[
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מספנה בונה ספינה לפי חוזה עם לקוח יחיד, וכל הרכש — ממנועים ועד מערכות ניווט — מתחיל רק אחרי חתימת ההזמנה. לפי שקף ״מקומו של ניהול ההזמנות״, מהו סוג הארגון והיכן ממוקמת ההזמנה?",o:["ייצור למלאי — ההזמנה לאחר השלמת הייצור","פרויקט — ההזמנה לאחר הרכש ולפני המסירה","ייצור להזמנה — ההזמנה לפני שלב הייצור בלבד","פרויקט — ההזמנה בתחילת התהליך, עוד לפני הרכש"],c:3,e:"בטבלה בשקף 7: בארגון פרויקטים (Project) ההצטיידות היא לפרויקט/להזמנה, וההזמנה בתחילת התהליך — לפני הרכש. בייצור להזמנה (Build to Order) ההצטיידות לתחזית והייצור להזמנה, וההזמנה לפני הייצור; בייצור למלאי (Build to Stock) ההצטיידות והייצור לתחזית, וההזמנה לאחר הייצור. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"יצרן מחשבים מחזיק מלאי רכיבים לפי תחזית, ומרכיב כל מחשב רק אחרי שהלקוח בחר את התצורה באתר. היכן ממוקמת ההזמנה בתהליך, לפי המצגת?",o:["לאחר המסירה — ייצור לפי התחזית בלבד (Forecast)","לפני הרכש — ארגון המנוהל כפרויקט (Project)","לאחר הייצור — ייצור למלאי (Build to Stock)","לפני הייצור — ייצור להזמנה (Build to Order)"],c:3,e:"בייצור להזמנה (Build to Order) ההצטיידות היא לתחזית — כמו מלאי הרכיבים — והייצור עצמו להזמנה, ולכן ההזמנה ממוקמת לפני הייצור. בפרויקט ההזמנה קודמת גם לרכש, ובייצור למלאי היא מגיעה אחרי שהמוצר כבר יוצר. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"יצרן משקאות קלים מייצר לפי תחזית ומחזיק מלאי במרכזי ההפצה, ורשתות השיווק מזמינות מהמלאי הקיים. איך מוגדרים ההצטיידות, הייצור ומיקום ההזמנה?",o:["הצטיידות לתחזית, ייצור לתחזית; ההזמנה לאחר הייצור","הצטיידות להזמנה, ייצור לתחזית; ההזמנה לפני הייצור","הצטיידות לתחזית, ייצור להזמנה; ההזמנה לפני הייצור","הצטיידות להזמנה, ייצור להזמנה; ההזמנה לפני הרכש"],c:0,e:"זהו ייצור למלאי (Build to Stock): גם ההצטיידות וגם הייצור מבוססים על תחזית, והזמנת הלקוח מגיעה לאחר הייצור ומסופקת מהמלאי. השילוב של הצטיידות לתחזית עם ייצור להזמנה הוא Build to Order, והצטיידות להזמנה מאפיינת ארגון פרויקטים. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מהי ההגדרה של Order Management כפי שהיא מופיעה במצגת?",o:["התהליך של תכנון הייצור לפי תחזית, פיצוץ ה-BOM והוצאת פקודות עבודה לרצפת הייצור","התהליך של הוצאת הזמנות רכש לספקים, מעקב אחריהן ותשלום לספקים לאחר קבלת הסחורה","התהליך של קביעת מחירי המכירה והמבצעים ללקוחות, ובקרת שולי הרווח של כל הזמנה","התהליך של קבלה, ארגון, מעקב ומילוי של הזמנות הלקוחות למוצרי החברה או לשירותיה"],c:3,e:"שקף 7 מגדיר: ״The process of taking, organizing, tracking and satisfying customer's orders for a company products or services״, ובנוסף ארגון תהליך מילוי ההזמנות (Order Fulfillment) בחברה יצרנית. הזמנות רכש לספקים הן תפקיד הרכש, ופקודות עבודה הן תוצר של ה-MRP. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה מגדירה המצגת כ-Order Fulfilment?",o:["מילוי יעדי המכירות השנתיים שנקבעו לאנשי המכירות בארגון","השלמת הזמנות רכש פתוחות מול הספקים הקבועים של הארגון","מילוי מחסני הארגון במלאי מספק לקראת עונת השיא של השנה","רצף הצעדים בטיפול בהזמנת לקוח עד לשביעות רצונו"],c:3,e:"שקף 10: ״Order Fulfilment — Sequence of steps involved in processing a customer order to the satisfaction of the customer״ — כל שלבי הטיפול בהזמנה, מקבלתה ועד שהלקוח מרוצה. זה אינו מילוי מחסנים ואינו עמידה ביעדי מכירות. (שא-5, שקף 10)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי המצגת, לפי מה נבנה המבנה של יחידת ניהול ההזמנות?",o:["לפי שלבי הייצור — ייצור רכיבים מול הרכבה סופית ובדיקות במפעל","לפי חלוקת הספקים — ספקים מקומיים מול ספקים מחו״ל ומול ספקים גלובליים","לפי סוגי המלאי — חומרי גלם, מלאי בתהליך ותוצרת גמורה","לפי חלוקת הלקוחות — גיאוגרפית, לפי סוגי מוצרים או סוגי שירות"],c:3,e:"בשקף 10: ״מבנה היחידה על פי חלוקת הלקוחות — גיאוגרפי, סוגי מוצר / שירות...״. זה עקבי עם העיקרון של שלמה מהמבוא: מבנה פנים היחידה הארגונית נבנה לפי מבנה לקוחותיה. (שא-5, שקף 10; שא-1, שקף 8)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה תפקידם של אנשי ניהול ההזמנות כלפי הארגון, לפי שקף ״Order Management — Order Fulfilment״?",o:["לייצג את הלקוחות כלפי השרשרת ולספק תחזית הכנסות וסיכוני אספקה","לנהל את המחסנים ולקבוע היכן יאוחסן כל פריט במרכז הלוגיסטי","לתכנן את קיבולת המפעל ולקבוע את סדר העבודה בכל אחת מהתחנות בקו הייצור","לנהל את המשא ומתן עם הספקים ולקבוע את מחירי הרכש של הרכיבים והחומרים"],c:0,e:"השקף קובע שאנשי ניהול ההזמנות מייצגים את לקוחות הארגון / המכירות כלפי שרשרת האספקה ולהפך, והם אחראים לספק לארגון את תחזית ההכנסות ואת סיכוני האספקות. משא ומתן עם ספקים הוא תפקיד הרכש, ותכנון קיבולת שייך לייצור. (שא-5, שקף 10)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי טבלת מדדי ה-Order Management, כיצד נמדד Lead Time?",o:["משך הזמן מקבלת ההזמנה ועד אספקת הפריט האחרון, מול ה-SLA","משך הזמן מהוצאת הזמנת הרכש ועד קבלת החומר מהספק במחסן הראשי","משך הזמן ממשלוח ההזמנה ללקוח ועד קבלת התשלום המלא ממנו","משך הזמן מתחילת הייצור ועד סיום הבדיקה של המוצר האחרון בהזמנה"],c:0,e:"בשקף 9, Lead Time נמדד מול בסיס השוואה של SLA, והביצוע בפועל הוא משך הזמן מקבלת ההזמנה ועד אספקת הפריט האחרון — עם תחזית או בלי תחזית. הוא מודד את הזמן שהלקוח ממתין, ולא את זמן הרכש מהספק או את זמן הגבייה. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מחלקת הזמנות שלחה החודש 40 הזמנות. 34 מהן יצאו עד מועד ההתחייבות הראשון, ו-6 יצאו מאוחר יותר. מה ה-OTD של המחלקה, והאם היא עומדת ביעד המופיע במצגת?",o:["85% — מתחת ליעד של 90% מההזמנות","85% — מעל היעד של 80% מההזמנות","94% — מעל היעד של 90% מההזמנות","15% — מתחת ליעד של 10% איחורים"],c:0,e:"OTD (On Time Delivery) משווה את מועד המשלוח בפועל להתחייבות הראשונה או ל-SLA: 34 מתוך 40 הזמנות יצאו בזמן, כלומר 34/40 = 85%. בהערות לשקף מופיעה הגדרת יעד של 90% מההזמנות — ולכן המחלקה מתחת ליעד. 15% הוא שיעור האיחורים ולא ה-OTD. (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"הזמנה אחת כוללת 5 שורות (פריטים שונים). 4 שורות נשלחו במועד, ושורה אחת נשלחה באיחור של שבוע. מה ה-OTD של הזמנה זו, אם מודדים לפי ההזמנה כולה ואם מודדים לפי שורה?",o:["לפי ההזמנה כולה — 80%; לפי שורה — 0% (שורה אחת איחרה)","לפי ההזמנה כולה — 80%; לפי שורה — 80%, שכן שני המדדים זהים תמיד","לפי ההזמנה כולה — 0% (ההזמנה לא הושלמה בזמן); לפי שורה — 80% (4 מתוך 5)","לפי ההזמנה כולה — 100% (רוב השורות נשלחו); לפי שורה — 80%"],c:2,e:"בשקף 9, OTD יכול להימדד על ההזמנה כולה או על כל שורה בהזמנה. לפי ההזמנה כולה, ההזמנה נחשבת בזמן רק אם כל השורות יצאו בזמן — כאן לא, ולכן 0%. לפי שורות, 4 מתוך 5 שורות יצאו בזמן = 80%. ההבדל הזה הוא שמוביל לשאלה אם לפצל הזמנות (Split Order). (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בהערות למדד ה-OTD מופיעה ״בחינת פיצול הזמנות (Split Order)״. מה ההיגיון בבחינה זו?",o:["כדי לעמוד ביעד OTD, כדאי לפצל כל הזמנה גדולה לכמה הזמנות קטנות מראש ובאופן קבוע","כדי להגדיל את ה-Lead Time, כדאי לדחות את המשלוח עד שהמלאי כולו זמין","כששורה אחת מעכבת הזמנה שלמה, ייתכן שכדאי לשלוח את השורות הזמינות מיד","כדי להקטין את מספר המשלוחים, כדאי לאחד כמה הזמנות של לקוחות שונים"],c:2,e:"כשמודדים OTD לפי ההזמנה כולה, שורה חסרה אחת מכשילה את כל ההזמנה. פיצול ההזמנה — שליחת השורות הזמינות בזמן וההשלמה בהמשך — עשוי לשפר את השירות ללקוח, אך מגדיל את מספר המשלוחים ועלותם, ולכן יש לבחון אותו. איחוד הזמנות של לקוחות שונים הוא נושא לוגיסטי אחר. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מתוך 50 הזמנות בחודש, 5 איחרו: באיחורים של 2, 3, 4, 5 ו-6 ימים. מהו ״מספר ימי האיחור״ הממוצע לפי ההגדרה במצגת?",o:["20 ימים — סך ימי האיחור בכל ההזמנות המאחרות","4 ימים — ממוצע על ההזמנות המאחרות בלבד","0.4 ימים — ממוצע ימי האיחור על כל 50 ההזמנות","5 ימים — מספר ההזמנות שאיחרו בחודש"],c:1,e:"בשקף 9, ״מספר ימי איחור״ משווה את מועד המשלוח בפועל למועד ההתחייבות, וההערה מדגישה: ״הזמנות מאחרות בלבד״. לכן (2+3+4+5+6)/5 = 20/5 = 4 ימים. חלוקה בכל 50 ההזמנות מטשטשת את חומרת האיחורים, ו-5 הוא ״מספר ההזמנות המאחרות״ — מדד נפרד (Counter). (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה ההבדל בין המדד ״מספר הזמנות מאחרות״ לבין המדד ״מספר ימי איחור״ בטבלת המדדים?",o:["הראשון נמדד רק על הזמנות שלמות; השני נמדד רק על שורות בודדות בתוך ההזמנות הפתוחות של הלקוח","הראשון הוא מונה (Counter) של הזמנות; השני מודד את משך האיחור בהזמנות המאחרות בלבד","הראשון נמדד מול ה-SLA; השני נמדד מול התחזית שהכין אגף המכירות בתחילת השנה עבור כל לקוח","שניהם מודדים אותו דבר, אלא שהראשון מבוטא באחוזים והשני מבוטא בימי עבודה מלאים בחודש"],c:1,e:"בשקף 9 שני המדדים משווים את מועד ההתחייבות לאספקה למועד המשלוח בפועל. ״מספר הזמנות מאחרות״ מסומן בהערות כ״מונה — Counter״ — כמה הזמנות איחרו; ״מספר ימי איחור״ מסומן ״הזמנות מאחרות בלבד״ — בכמה זמן הן איחרו. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה פירוש הראשי תיבות SLA, המופיע כבסיס ההשוואה של רוב מדדי ניהול ההזמנות?",o:["Sales Level Assessment — הערכת רמת המכירות","Supply Lead Allocation — הקצאת זמן אספקה","Stock Level Adjustment — התאמת רמת המלאי","Service Level Agreement — הסכם רמת שירות"],c:3,e:"בתחתית שקף 9 מודגש: ״SLA — Service Level Agreement״ — ההסכם עם הלקוח על רמת השירות, למשל זמן אספקה מוסכם. הוא בסיס ההשוואה ל-Lead Time, ל-OTD ולמועד ההתחייבות. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה בודק המדד Commitment date בטבלת מדדי ניהול ההזמנות?",o:["את מספר ההתחייבויות שנדחו, מול יעד של 90%","את מועד קבלת ההזמנה, מול מועד תחילת הייצור בפועל","את מועד ההתחייבות הראשון שניתן ללקוח, מול ה-SLA המוסכם","את מועד המשלוח בפועל, מול מועד ההתחייבות"],c:2,e:"בשקף 9, ל-Commitment date בסיס ההשוואה הוא ה-SLA, והביצוע בפועל הוא ״מועד התחייבות ראשון״ — האם המועד שהובטח ללקוח עומד ברמת השירות המוסכמת. השוואת מועד המשלוח בפועל למועד ההתחייבות היא דווקא המדדים של הזמנות מאחרות וימי איחור. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בתחנת ייצור ממתינות שלוש הזמנות: א׳ דורשת 6 שעות עבודה, ב׳ — 2 שעות, ג׳ — 4 שעות. לפי כלל SPT, מה סדר הטיפול?",o:["א׳ ← ב׳ ← ג׳","ב׳ ← ג׳ ← א׳","א׳ ← ג׳ ← ב׳","ג׳ ← ב׳ ← א׳"],c:1,e:"SPT — Shortest Process Time — מטפל קודם בהזמנה שמשך הזמן הנדרש לה הקצר ביותר: ב׳ (2 שעות), אחריה ג׳ (4) ולבסוף א׳ (6). הסדר ההפוך מתחיל דווקא בהזמנה הארוכה ביותר, והסדר א׳-ב׳-ג׳ הוא סדר ההגעה (FIFO), לא SPT. (שא-5, שקף 11)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"שלוש הזמנות ממתינות לייצור: הזמנה X — מועד יעד 20 בחודש; הזמנה Y — מועד יעד 12 בחודש; הזמנה Z — מועד יעד 15 בחודש. לפי כלל EDD, באיזו הזמנה יטפלו ראשונה?",o:["בהזמנה שזמן העבודה הנדרש עליה הקצר ביותר","בהזמנה X — היא הגיעה ראשונה לתחנה","בהזמנה Y — מועד היעד שלה (ה-12 בחודש) המוקדם ביותר","בהזמנה Z — מועד היעד שלה באמצע"],c:2,e:"EDD — Earliest Due Date — מתעדף לפי תאריך היעד: קודם ההזמנה שמועד היעד שלה המוקדם ביותר (Y, ה-12 בחודש), אחריה Z ואחר כך X. טיפול לפי סדר הגעה הוא FIFO, וטיפול לפי זמן העבודה הקצר הוא SPT. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מחסן חלקי חילוף מטפל בבקשות לפי הסדר שבו הגיעו, בלי קשר לדחיפותן או לגודלן. איזה כלל קדימות מופעל?",o:["לפי שווי ההזמנה או רווחיותה","SPT — לפי משך הזמן הנדרש","FIFO — לפי מועד הגעת ההזמנה","EDD — לפי מועד היעד המוקדם"],c:2,e:"בשקף 11, FIFO מתואר כקדימות ״לפי מועד הגעת ההזמנה״ (ובשקף מופיעה גם שאלה: או לפי תחזית?). SPT מתעדף לפי משך הזמן הנדרש, EDD לפי תאריך היעד, ושאר הקדימויות לפי זמינות החומר, שווי ההזמנה או חשיבות הלקוח. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"במפעל חסר רכיב, והמלאי שהגיע מספיק רק לחלק מההזמנות. מנהלת ההזמנות מקצה אותו קודם להזמנות שבזכותו ייסגרו במלואן. איזו קדימות היא מפעילה?",o:["שווי ההזמנה — קדימות להזמנות הרווחיות ביותר","זמינות החומר — קדימות לסגירת הזמנות מלאות","חשיבות הלקוח — קדימות ללקוחות האסטרטגיים","EDD — קדימות להזמנה שמועד היעד שלה מוקדם"],c:1,e:"בין כללי הקדימות בשקף 11 מופיע: ״זמינות החומר — קדימות לסגירת הזמנות מלאות״ — הקצאת החומר המוגבל כך שהזמנות שלמות ייסגרו, במקום לפזר אותו על הזמנות רבות שיישארו חלקיות. שווי ההזמנה, EDD וחשיבות הלקוח הם כללי קדימות אחרים באותו שקף. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"איזה מהבאים <b>אינו</b> מופיע בשקף ״ניהול קדימות ההזמנות — Allocation / Priority״?",o:["קדימות להזמנה שהזמן שחלף מאז משלוחה הקודם ארוך ביותר","קדימות לפי שווי ההזמנה או לפי רווחיותה עבור הארגון כולו","קדימות לפי משך הזמן הנדרש לטיפול בכל הזמנה ומשלוח (SPT)","קדימות לפי חשיבות הלקוח שהזמין את המוצרים"],c:0,e:"שקף 11 מונה: SPT (משך הזמן הנדרש), EDD (תאריך היעד), FIFO (מועד הגעת ההזמנה), זמינות החומר (קדימות לסגירת הזמנות מלאות), שווי ההזמנה / רווחיות, וחשיבות הלקוח. קדימות לפי הזמן שחלף מהמשלוח הקודם אינה ברשימה. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי שקף ״On line — Order Management״, מדוע מערך ניהול ההזמנות קריטי לחברה שמוכרת באינטרנט?",o:["כי באינטרנט הלקוח מזמין ישירות מהספק, ולכן הארגון אחראי רק לגבייה ולא לאספקה עצמה","כי ניהול ההזמנות הוא פעילות ליבה — הקשר של הארגון עם הלקוח, ומכירות On Line מבוססות עליו","כי מכירה באינטרנט מבטלת את הצורך במלאי, ולכן ההזמנות הן המדד היחיד שנותר לארגון לנהל ולמדוד","כי מכירות באינטרנט אינן כפופות ל-SLA, ולכן יש צורך במערך שיקבע לכל לקוח מועד אספקה נפרד משלו"],c:1,e:"בשקף 12: ״ניהול ההזמנות הינה פעילות ליבה של שרשרת האספקה — הקשר של הארגון עם הלקוח!״, ומערכות המכירה באינטרנט (On Line Sales) מבוססות על מערך ניהול ההזמנות: קישור הלקוחות לספקים, קליטת הזמנות ומעקב אחר ביצוען, התחשבנות עם הלקוחות והספקים ושירות לקוחות לאחר מכירה. (שא-5, שקף 12)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בתרשים תהליכי הליבה של תפעול בהייטק (High-Tech Operations Core processes), איזה רצף מופיע בשורת ה-Delivery?",o:["Order Mng., Sourcing, Pilot, Production, Repair, Logistics","Material Mng., Purchasing, Order Mng., Production, Logistics","Service Inventory, Reverse Logistics, Repair, Order Mng.","Sourcing, Purchasing, Pilot, Development, Production, Logistics"],c:1,e:"בשקף 4 שלוש שורות: Development — Sourcing, Purchasing, Pilot; Delivery — Material Mng., Purchasing, Order Mng., Production, Logistics (ו-Order Mng. מודגש בעיגול); Service — Service Inventory, Reverse Logistics, Repair. שורת ה-Delivery היא בדיוק חמשת הבלוקים של שרשרת האספקה הפנים-ארגונית. (שא-5, שקף 4)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בעץ ה-KPI של ניהול ההזמנות, לאיזה ענף שייכים המדדים Delayed orders ו-Lost Orders?",o:["Operational Cost","Forecast Accuracy","Revenue Shortages","On Time Delivery"],c:2,e:"בעץ ה-KPI, הענף Revenue Shortages — הכנסות שנפגעו בגלל חוסרים — כולל את Delayed orders ואת Lost Orders. ענף On Time Delivery כולל את Average day Delay ואת Number of delays, ו-Forecast Accuracy כולל Coverage, Undershoot ו-Overshoot. (שא-5, שקף 8)"}
]);

{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי טבלת מדדי הלוגיסטיקה, כיצד נמדדת ״עלות כלל המערכת הלוגיסטית״?",o:["כמספר המשלוחים הכולל שיצאו מהמחסן בחודש","כסך העלות השנתית של כל השילוח הימי והאווירי יחד","כיחס בין נפח האחסון המנוצל לנפח המשולם","כיחס בין העלויות הלוגיסטיות לבין המכירות או ה-COGS"],c:3,e:"בשקף 6, המדד הכולל ״עלות כלל המערכת הלוגיסטית״ נמדד כיחס בין העלויות הלוגיסטיות למכירות או ל-COGS — כך אפשר להשוות בין תקופות ובין היקפי פעילות. מספר המשלוחים הוא מדד שילוח, ונצילות נפח אחסון היא מדד מחסן. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מנהל לוגיסטיקה מציע להנהלה להעביר את רוב המשלוחים הדחופים מאוויר לים. איזה מדד שילוח רלוונטי להחלטה, ומה הדגש לגביו במצגת?",o:["אמינות המלאי — חוסרים ועודפים ברמה התפעולית וברמה הפיננסית של המחסן בפועל","תנועות המלאי — היקף התנועות הכולל במחסן, Transactions","יחס המשלוחים — מהיר : ים : אוויר; עלות משלוח אווירי כחמש מונים מימי","נצילות נפח האחסון — נפח מנוצל מתוך הנפח הקיים או המשולם במחסן המרכזי"],c:2,e:"במדדי השילוח בשקף 6 מופיע ״יחס משלוחים: שילוח מהיר : ים : אוויר״, ולצדו הדגש ״יחס עלות משלוח ים : אוויר 5:1״ — משלוח אווירי יקר פי כחמישה. לכן העברת משלוחים מאוויר לים חוסכת, אך מאריכה את זמן האספקה. נצילות נפח, אמינות מלאי ותנועות מלאי הם מדדי מחסן. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"משלוח של כריות קלות ונפחיות מחויב לפי נפחו ולא לפי משקלו בפועל. באיזה מדד לוגיסטי עוסק הנושא, ומה המושג שבשקף?",o:["יעילות משלוח — Chargeable Weight, יחס בין המשקל למשקל הנפחי","יחס משלוחים — שילוח מהיר מול ים ואוויר בכל תקופה","אמינות המלאי — Inventory Accuracy, יחס חוסרים ועודפים במחסן הראשי","תנועות מלאי — Transactions, היקף הקליטות והניפוקים במחסן לאורך החודש"],c:0,e:"בשקף 6, ״יעילות משלוח״ נמדדת כיחס בין המשקל למשקל הנפחי, והדגש הוא Chargeable Weight — נפח : משקל. מטען נפחי וקל מחויב לפי נפחו, ולכן אריזה יעילה חוסכת בעלות השילוח. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה הדגש שמופיע במצגת לצד המדד ״מספר משלוחים כולל״?",o:["שילוח ישיר","שילוח מהיר","איחוד משלוחים","פיצול משלוחים"],c:2,e:"בטבלת מדדי הלוגיסטיקה, לצד ״מספר משלוחים כולל״ מופיע הדגש ״איחוד משלוחים״ — צמצום מספר המשלוחים על ידי איחודם מוזיל את עלות השילוח. בדומה, בשקף LCL/FCL מוצג המעבר LCL → FCL, איחוד מטענים חלקיים למכולה מלאה. (שא-6, שקפים 6, 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בספירת מלאי נמצאו במחסן פערים בין הכמויות הרשומות במערכת לכמויות בפועל — חוסרים בחלק מהפריטים ועודפים באחרים. איזה מדד מחסן מתאר זאת?",o:["יעילות המשלוח — Chargeable Weight","נצילות נפח האחסון — נפח מנוצל","אמינות המלאי — Inventory Accuracy","תנועות המלאי — Transactions"],c:2,e:"בשקף 6, ״אמינות המלאי״ נמדדת לפי החוסרים והעודפים — ברמה התפעולית ובערך הפיננסי — ומכונה Inventory Accuracy. נצילות נפח האחסון מודדת נפח מנוצל מתוך הקיים או המשולם, ותנועות המלאי מודדות את היקף הפעילות. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מעל טבלת מדדי הלוגיסטיקה מופיעה השאלה ״Logistics — Cost Center or Profit center?״, ומתחתיה ״Logistics Cost Allocation — Project / Order / Department״. מה מבטאים שני הכיתובים?",o:["הלוגיסטיקה היא תמיד מרכז עלות, ולכן אין טעם להקצות את עלויותיה לגורמים שונים בארגון","אפשר לנהל את הלוגיסטיקה גם כמרכז רווח, ולהקצות את עלותה לפרויקט, להזמנה או למחלקה","הלוגיסטיקה היא תמיד מרכז רווח, ולכן היא גובה מכל מחלקה מחיר שוק מלא על כל שירות","הלוגיסטיקה נמדדת רק לפי מספר המשלוחים, ולכן אין צורך להקצות את עלויותיה לפי פרויקט"],c:1,e:"שקף 6 שואל אם הלוגיסטיקה היא מרכז עלות או מרכז רווח — בהלימה למטרה של שרשרת האספקה לעבור ממרכז עלות למרכז רווח — ומדגיש הקצאה של העלויות הלוגיסטיות לפרויקט, להזמנה או למחלקה, כדי שכל גורם יידע כמה הלוגיסטיקה שלו עולה. (שא-6, שקף 6; שא-7, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המצגת, מהי לוגיסטיקה?",o:["ניהול זרימת החומר מהספק ללקוח","ניהול ההזמנות המתקבלות מהלקוחות","ניהול מלאי חומרי הגלם במפעל ובמחסנים","ניהול משא ומתן עם ספקי ההובלה והשילוח"],c:0,e:"שקף 7 מגדיר לוגיסטיקה כ״ניהול זרימת החומר מהספק ללקוח״, ומפרט את התהליך: שינוע נכנס (יבוא), אחסון (קליטה למלאי, ניהול המלאי, מלאי חומרי גלם), העברה לייצור (מלאי בתהליך, ניפוק לייצור), אחסון תוצרת גמורה (ליקוט, אריזה), והפצה (משלוח ללקוח, יצוא). (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מהו הסדר הנכון של שלבי התהליך הלוגיסטי שבמצגת?",o:["העברה לייצור ← שינוע נכנס ← אחסון תוצ״ג ← אחסון ← הפצה ← לקוח","שינוע נכנס ← אחסון ← העברה לייצור ← אחסון תוצ״ג ← הפצה ← לקוח","אחסון ← שינוע נכנס ← הפצה ← העברה לייצור ← אחסון תוצ״ג ← לקוח","שינוע נכנס ← העברה לייצור ← אחסון ← הפצה ← אחסון תוצ״ג ← לקוח"],c:1,e:"בשקף 7 החומר זורם כך: שינוע נכנס (יבוא) ← אחסון (קליטה למלאי וניהול מלאי חומרי גלם) ← העברה לייצור (מלאי בתהליך, ניפוק) ← אחסון תוצרת גמורה (ליקוט ואריזה) ← הפצה (משלוח ללקוח, יצוא) ← לקוח. (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"עובד במחסן אוסף פריטים ממדפים שונים לפי הזמנת לקוח ומכין אותם לאריזה. באיזה שלב של התהליך הלוגיסטי הוא נמצא?",o:["אחסון תוצרת גמורה — ליקוט ואריזה","אחסון — קליטה למלאי וניהול המלאי","שינוע נכנס — קבלת סחורה מיבוא","העברה לייצור — ניפוק חומר לייצור"],c:0,e:"בשקף 7, שלב האחסון של התוצרת הגמורה כולל ליקוט ואריזה, ואחריו מגיעה ההפצה (משלוח ללקוח). ניפוק לייצור שייך להעברה לייצור, וקליטה למלאי שייכת לאחסון חומרי הגלם שבתחילת התהליך. (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המצגת, מה מתאר המונח 3PL?",o:["Cargo Owners — בעלי המטען שמבצעים את הכול בעצמם","Full Turn Key — ניהול שרשרת האספקה כולה","Subcontracting — קבלנות משנה של הובלה בלבד","Outsourcing — מיקור חוץ לספק שירותים לוגיסטיים חיצוני"],c:3,e:"בשקף 9: 2PL = Subcontracting (מובילים — Transportation), 3PL = Outsourcing (ספקי שירותים לוגיסטיים — Logistics), 4PL = Full Turn Key (ספקים מובילים ויועצים — ניהול שרשרת האספקה). 1PL הם בעלי המטען עצמם — יצרנים וקמעונאים. (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"חברה מעבירה לגורם חיצוני את ניהול שרשרת האספקה הלוגיסטית כולה — כולל תיאום בין כמה ספקי שירות, תכנון הרשת וייעוץ. לאיזו רמת שירות לוגיסטי זה מתאים?",o:["1PL — Cargo Owners","2PL — Subcontracting","3PL — Outsourcing","4PL — Full Turn Key"],c:3,e:"4PL בשקף 9 הם Lead Logistics Providers & Consultants, שמספקים Supply Chain Management, ובהשוואה של שלמה: 4PL = Full Turn Key. 3PL הוא מיקור חוץ של השירות הלוגיסטי עצמו, 2PL הוא קבלנות משנה של הובלה, ו-1PL הם בעלי המטען. (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"יצרן שוכר חברת הובלות שמעבירה משאיות מהמפעל ללקוחות, בעוד שהאחסון, התכנון וניהול המלאי נשארים אצלו. לאיזו רמה זה מתאים?",o:["4PL — Full Turn Key של שרשרת האספקה","1PL — ביצוע ההובלה בכוחות עצמיים בלבד","3PL — Outsourcing של כל השירות הלוגיסטי","2PL — Subcontracting של שירותי ההובלה"],c:3,e:"2PL בשקף 9 הם המובילים (Carriers), שמספקים הובלה (Transportation) — ובהשוואה של שלמה 2PL = Subcontracting. כשרק ההובלה עוברת לגורם חיצוני, זו קבלנות משנה ולא מיקור חוץ לוגיסטי מלא (3PL) או ניהול השרשרת כולה (4PL). (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי פירמידת ״Logistics Outsourcing levels & trends״, מה מבטא החץ ״From Pure Logistics to APL — All Party Logistics״?",o:["ספקי הלוגיסטיקה מרחיבים שירותים — משילוח בסיסי ועד רכש, תכנון חומר ומימון","חברות ההובלה הופכות ליצרניות בעצמן ומייצרות את המוצרים שהן מובילות ללקוחות","ספקי הלוגיסטיקה מצמצמים את שירותיהם ומתמקדים בשילוח ובהובלה הבין-לאומית","הארגונים מחזירים את הלוגיסטיקה לתוכם ומבטלים בהדרגה את מיקור החוץ הלוגיסטי"],c:0,e:"בשקף 8 הפירמידה עולה מ-All In-house, דרך Shipments & Forwarding, Drop Shipments & Consolidations, Global Hubs, Value Added Services, Service/Reverse Logistics & Repair, Supply Chain Services, Inventory Management ו-Purchasing, ועד Material Planning ו-Financing (מימון חומרי גלם ותוצרת גמורה). החץ מתאר מעבר מ״לוגיסטיקה טהורה״ לספק שנותן את כל השירותים. (שא-6, שקף 8)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המלל שבשקף ״Logistics Outsourcing levels & trends״, איזו מגמה מתרחשת בין יצרני ה-EMS לבין ספקי הלוגיסטיקה?",o:["ספקי הלוגיסטיקה נעים לייצור אלקטרוני, ויצרני EMS מוותרים על שירותי הייצור שלהם","יצרני EMS וספקי הלוגיסטיקה מתאחדים לחברה אחת, בכל מדינה שבה הם פועלים","יצרני EMS נעים לשירותים לוגיסטיים, וספקי הלוגיסטיקה מציעים שירותי שרשרת אספקה מלאים","יצרני EMS מוציאים את הלוגיסטיקה לספקים, וספקי הלוגיסטיקה חוזרים לשילוח בלבד"],c:2,e:"בשקף 8 כתוב: ״EMSs are moving toward Logistics Services While Logistics vendors [are] offering Supply Chain Services״ — שני סוגי הספקים מרחיבים את היצע השירותים שלהם זה לעבר זה. באותה רוח, בשא-4 מסומנות מגמות EMS ו-ODM בפירמידת מיקור החוץ. (שא-6, שקף 8; שא-4, שקף 20)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי שקף ״התפתחות המרכזים הלוגיסטיים״, מה מוסיף מרכז לוגיסטי (Logistics Center) על מחסן רגיל?",o:["משלוחים ישירים ללקוחות","שירותי ערך מוסף (VAS)","ניהול מלא של הזמנות","אחסון וניהול מלאי"],c:1,e:"בשקף 10 המרכזים מוצגים כמעגלים מתרחבים: מחסן (Warehouse) — אחסון וניהול מלאי; מרכז לוגיסטי — מוסיף שירותי ערך מוסף (VAS); מרכז הפצה (DC) — מוסיף משלוחים ללקוחות; מרכז הזמשה (FC) — מוסיף ניהול הזמנות. (שא-6, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"חברת סחר מקוון מחפשת מתקן שיקלוט את הזמנות הלקוחות באתר, ילקט ויארוז אותן, ישלח אותן ללקוחות ויאחסן את המלאי. איזה סוג מרכז מתאים לה?",o:["מרכז הפצה — Distribution Center (DC)","מרכז הזמשה — Fulfilment Center (FC)","מרכז לוגיסטי — Logistics Center","מחסן — Warehouse, לאחסון בלבד"],c:1,e:"מרכז הזמשה (FC) הוא הרמה הרחבה ביותר בשקף 10: הוא כולל את כל יכולות המרכזים שמתחתיו — אחסון, ניהול מלאי, שירותי ערך מוסף ומשלוחים ללקוחות — ומוסיף עליהם ניהול הזמנות. מרכז הפצה (DC) שולח ללקוחות, אך אינו מנהל את ההזמנות עצמן. (שא-6, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה מגדירים תנאי ה-IncoTerms המוצגים בפרק הלוגיסטיקה?",o:["את גודל המכולות ואת המשקל המרבי המותר בהן","את המכסים ומסי היבוא שחלים על כל סוג של סחורה בנמל היעד שבו היא נפרקת","את חלוקת האחריות, העלויות והסיכון בין המוכר לקונה במשלוח","את זמני ההובלה המרביים המותרים בין נמלי המוצא לנמלי היעד בעולם"],c:2,e:"IncoTerms (שקפים 11–12) הם תנאי הסחר הבין-לאומיים, המגדירים עד איזו נקודה המוכר אחראי לסחורה ולעלויותיה, וממנה עוברים האחריות והסיכון לקונה. בשא-3 הם מופיעים כאחד הפרמטרים המשפיעים על המחיר, ובמקרה Cardo המסירה היא בתנאי FOB — מסירה על האונייה. (שא-6, שקף 11; שא-3, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"יבואן קטן שולח בכל חודש כמה משטחים בלבד מהמזרח הרחוק, ומטענו חולק מכולה עם מטענים של יבואנים אחרים. באיזו שיטת משלוח מדובר?",o:["LCL — Less Than Container Load","FCL — Full Container Load (מכולה מלאה)","Drop — משלוח ישיר מהספק אל הלקוח","Courier — שילוח מהיר של חבילות קטנות"],c:0,e:"LCL (Less Than Container Load) הוא מטען שאינו ממלא מכולה, ולכן חולק אותה עם מטענים אחרים; FCL (Full Container Load) הוא מכולה מלאה של שולח אחד. בשקף 13 מופיעים גם המעברים LCL → FCL (איחוד מטענים חלקיים למכולה מלאה) ו-FCL → LCL (פירוק מכולה מלאה למשלוחים חלקיים). (שא-6, שקף 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מרכז לוגיסטי מקבל משלוחים קטנים מכמה ספקים באותה מדינה, ומאחד אותם למכולה מלאה אחת לפני ההפלגה. איזה מעבר מתואר?",o:["FCL → LCL — פירוק מכולה מלאה למטענים חלקיים","LCL → FCL — איחוד מטענים חלקיים למכולה מלאה","Courier → FCL — מעבר משילוח מהיר למכולה","Drop → Import — מעבר ממשלוח ישיר ליבוא"],c:1,e:"המעבר LCL → FCL שבשקף 13 הוא איחוד (Consolidation) של מטענים חלקיים למכולה מלאה — בהלימה לדגש ״איחוד משלוחים״ במדדי הלוגיסטיקה ולשירות ״Drop Shipments & Consolidations״ בפירמידת מיקור החוץ. המעבר ההפוך, FCL → LCL, הוא פירוק מכולה מלאה למשלוחים חלקיים. (שא-6, שקפים 6, 8, 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי עץ העלויות הלוגיסטיות, לאיזה ענף שייכת עלות ה״הסבות״ (Reworks) של מוצרים במחסן?",o:["שילוח — משלוח ישיר מהספק (Drop)","מחסן — שירותי ערך מוסף (VAS)","הפצה — הפצה ללקוחות","מחסן — אחסון (שטח / נפח)"],c:1,e:"בעץ שבשקף 14 יש שלושה ענפים: שילוח (יבוא, יצוא, משלוח ישיר Drop ושילוח מהיר Courier), מחסן (אחסון — שטח/נפח ופעילויות Transactions; ושירותי ערך מוסף VAS — הסבות Reworks ותיקונים) והפצה (הפצה ללקוחות ומשיכה מספקים). הסבות הן שירות ערך מוסף במחסן. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"איזו מהעלויות הבאות שייכת לענף ״הפצה״ בעץ העלויות הלוגיסטיות?",o:["משיכת סחורה מספקים","משלוח מהיר (Courier)","שכירת שטח אחסון במחסן","יבוא ממדינת המקור ליעד"],c:0,e:"בשקף 14 ענף ההפצה כולל שני סעיפים: הפצה ללקוחות ומשיכה מספקים. שטח האחסון שייך לענף המחסן, ומשלוח מהיר ויבוא שייכים לענף השילוח — שבו כל סוג משלוח מתפצל לעלויות במדינת המקור ובמדינת היעד. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בעץ העלויות הלוגיסטיות, לענפי היבוא, היצוא והמשלוח הישיר יש אותה חלוקת משנה. מהי?",o:["עלויות במדינת המקור ועלויות במדינת היעד","עלויות אוויר ועלויות ים לאורך כל מסלול ההובלה","עלויות מכס ועלויות ביטוח של המטען","עלויות קבועות ועלויות משתנות לכל משלוח ומשלוח"],c:0,e:"בשקף 14 כל אחד מהענפים יבוא (Import), יצוא (Export) ומשלוח ישיר (Drop) מתפצל ל״מדינת מקור״ ול״מדינת יעד״ — העלויות נוצרות בשני קצות המשלוח. שילוח מהיר (Courier) מופיע כענף נפרד ללא הפיצול הזה. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לקוח מחזיר מכשיר תקול, ומקבל מיד מכשיר חלופי מהמלאי, בזמן שהמכשיר שלו נשלח לתיקון. איזה שלב בלוגיסטיקה החוזרת מתואר?",o:["החזרה מתיקון — משלוח למחסן או ישירות ללקוח","קבלת החזרות מהלקוח — קליטה, סריקה ומיון","ניהול מלאי שירות — מלאי חדש בלבד","החלפה ללקוח — Fast Exchange ומשלוח המכשיר לתיקון"],c:3,e:"בשקף 15, אחרי קבלת ההחזרה מהלקוח (קליטה, סריקה/מיון) מגיע שלב ״החלפה ללקוח״: Fast Exchange — מכשיר חלופי מיד — ומשלוח המכשיר התקול לתיקון. בהמשך: ניהול מלאי שירות (חדש וממוחדש), משלוח לתיקון RTV לספק או ליצרן, תיקון, והחזרה מתיקון למחסן או ללקוח. (שא-6, שקף 15)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בלוגיסטיקה החוזרת, לאן נשלחים מוצרים בשלב ״משלוח לתיקון — RTV״?",o:["למחסן המרכזי","ללקוח הסופי","לספק או ליצרן","למרכז ההפצה"],c:2,e:"בשקף 15 שלב ״משלוח לתיקון RTV״ מסומן ״ספק / יצרן״ — המוצר התקול מוחזר למי שיכול לתקן אותו. אחרי התיקון (תיקון מוצר או מיחדוש) מגיעה ״החזרה מתיקון״ — למחסן או ללקוח. RTV מופיע גם בשא-2 כסוג מלאי: מלאי בתהליך תיקון. (שא-6, שקף 15; שא-2, שקף 12)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"במחסן השירות של חברה מוחזקים שני סוגי מלאי: מכשירים חדשים ומכשירים שתוקנו וחודשו. באיזה שלב של הלוגיסטיקה החוזרת מופיעים שני הסוגים האלה יחד?",o:["משלוח לתיקון RTV — משלוח המכשירים התקולים לספק או ליצרן","החזרה מתיקון — משלוח המכשירים המתוקנים למחסן או ללקוח","קבלת החזרות מהלקוח — קליטה, סריקה ומיון של המכשירים","ניהול מלאי שירות — מלאי חדש לצד מלאי ממוחדש (Refurbished)"],c:3,e:"בשקף 15, שלב ״ניהול מלאי שירות״ כולל שני סוגי מלאי: מלאי חדש ומלאי ממוחדש (Refurbished) — מכשירים שתוקנו וחזרו לשמש מלאי שירות. בעץ המלאי של שא-2 מופיע בהתאם ״מלאי מתוקן — Refurbished״ כחלק מהמלאי התפעולי. (שא-6, שקף 15; שא-2, שקף 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה תפקידה של מערכת WMS לפי המצגת?",o:["לנהל את המשא ומתן מול חברות השילוח ולבחור את המסלול הזול","לנהל את קשרי הלקוחות, התלונות, המחירים והמבצעים של הארגון","לנהל אוטומטית את תהליכי העבודה במחסן ולחסוך בשטחי האחסון","לתכנן את דרישות החומר מהזמנות ותחזיות ועד הזמנות הרכש"],c:2,e:"שקף 16: WMS — Warehouse Management System — מנהלת את תהליכי העבודה במחסן בצורה אוטומטית תוך חיסכון בשטחי אחסון, ותומכת בניהול המלאי ובתנועות הנכנסות והיוצאות. ניהול קשרי לקוחות הוא CRM, ותכנון דרישות החומר הוא MRP. (שא-6, שקף 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"איזו מהפעולות הבאות <b>אינה</b> נמנית עם התנועות שמערכת WMS תומכת בהן, לפי המצגת?",o:["העברה בין מחסנים ואיתורי מלאי","קביעת מחיר המכירה לכל פריט","ספירות מלאי תקופתיות והשמדות מלאי","קליטת החזרות מהלקוחות למחסן"],c:1,e:"לפי שקף 16, ה-WMS תומכת בתנועות הנכנסות והיוצאות: הכנת משלוחים, קליטת סחורה מספקים, החזרות מלקוחות והחזרות לספקים, ספירות מלאי, משטוח, העברה בין מחסנים, איתורים והשמדות מלאי. תמחור מכירה אינו פעולת מחסן. (שא-6, שקף 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה תורמים מסופונים וקוראי RFID לעבודת ה-WMS, לפי שקף ה-WMS?",o:["ביטול הצורך בספירות מלאי תקופתיות","הגדלת נפח האחסון הפיזי של המחסן","קיצור זמני ההובלה הימית והאווירית","צמצום טעויות אנוש בתנועות המלאי"],c:3,e:"בשקף 16 מוזכרים המסופונים וה-RFID ככלים שמצמצמים טעויות אנוש — הזנה ידנית מוחלפת בסריקה. הם משפרים את אמינות המלאי (Inventory Accuracy), אך אינם מבטלים את הספירות, אינם מגדילים את נפח המחסן ואינם משפיעים על זמני ההובלה. (שא-6, שקפים 6, 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"על מה מבוססת ״אומנות הלוגיסטיקה״ שבסוף המצגת, ומה המסר שלה?",o:["על מודל ״הצלף העיוור״ של שלמה; הלוגיסטיקה היא הפעילות היחידה שאינה צריכה תחזית","על מודל ״הכדורגל״; מערך הלוגיסטיקה צריך להשתנות בכל שלב במחזור חיי המוצר","על ״אומנות המלחמה״ של סון טסו; המאמץ הלוגיסטי הוא מהמאמצים העיקריים של השרשרת","על ״ספר המטרה״ של גולדרט; ניצול מלא של הקיבולת הוא המאמץ העיקרי של הלוגיסטיקה"],c:2,e:"שקפים 19–21 מבססים את ״אומנות הלוגיסטיקה״ על ״אומנות המלחמה״ של סון טסו — ספר סיני על אסטרטגיה ומלחמה בן 13 פרקים. המסר: המאמץ הלוגיסטי הוא אחד המאמצים העיקריים של שרשרת האספקה, חשוב להבטחת עמידתה ביעדיה, מהווה מרכיב עיקרי בתקציבה, ונדרש שיפור וייעול מתמידים. (שא-6, שקפים 19–21)"}
]);

BANK.push.apply(BANK,[
/* שא 7 — אסטרטגיות שרשרת אספקה — שרשרת אספקה זמישה (שלמה ארליך), 36 שאלות */
/* מהי שרשרת האספקה — רשת, הלקוח כחלק מהשרשרת, מידע וכסף */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי הגדרת שרשרת האספקה במצגת, איזה מההיגדים הבאים <b>אינו</b> נכון?",o:["השרשרת כוללת את כל השלבים בתהליך, מייצור חומרי הגלם ועד האספקה ללקוח","הלקוח הסופי נמצא מחוץ לשרשרת, שכן השרשרת מסתיימת אצל הקמעונאי","השרשרת כוללת לא רק תנועה של חומר אלא גם תנועה של מידע וכסף בין מרכיביה","מובילים, מחסנים וסיטונאים הם חלק ממרכיבי השרשרת החוץ-ארגונית"],c:1,e:"המצגת מדגישה במפורש כי הלקוח מהווה חלק מהשרשרת, ולכן ההיגד שהשרשרת מסתיימת אצל הקמעונאי שגוי. שאר ההיגדים לקוחים ישירות מההגדרה: כל השלבים מחומרי הגלם ועד הלקוח, תנועת חומר, מידע וכסף, ומובילים, מחסנים וסיטונאים כמרכיבים חוץ-ארגוניים. (שא-7, שקף 8)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן ציוד רפואי הפסיק לרכז את כל המשלוחים במחסן מרכזי: חלק מהספקים שולחים כעת ערכות ישירות לבתי החולים, ותהליכי הרכש, הייצור וההפצה מתנהלים במקביל ולא בטור. איזה מושג מהמצגת מתאר את המעבר?",o:["מעבר משרשרת אספקה לרשת אספקה — תהליכים מקבילים ומשלוח ישיר מהספקים ללקוחות","מעבר משרשרת אספקה לשרשרת ביקוש — תכנון על בסיס מידע מהשוק ולא על בסיס מלאי בארגון","מעבר מתהליכי דחיפה לתהליכי משיכה — ייצור והפצה רק לאחר קבלת הזמנת הלקוח","מעבר ממרכז עלות למרכז רווח — מדידת השרשרת לפי תרומתה לרווח ולא לפי עלויותיה"],c:0,e:"המצגת מתארת את המעבר מ״שרשרת אספקה״ ל״רשת אספקה״ באמצעות שני מאפיינים בדיוק: תהליכים מקבילים ומשלוח ישיר מהספקים ללקוחות — כפי שבתרחיש. שרשרת ביקוש עוסקת בתכנון לפי מידע מהשוק, ומשיכה עוסקת בעיתוי הייצור ביחס להזמנה, ולא במבנה הרשת. (שא-7, שקף 8)"},
/* Push/Pull ונקודת הניתוק */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"רשת חנויות רהיטים מייצרת שלדי ספות בדגמים סטנדרטיים לפי תחזית ומחזיקה אותם במחסן; ריפוד הבד בצבע שבחר הלקוח מתבצע רק לאחר שהלקוח מזמין בחנות. היכן עוברת נקודת הניתוק (Push/Pull boundary) בשרשרת זו?",o:["ברכש חומרי הגלם — כל השלבים שאחרי הרכש נחשבים לתהליכי משיכה הנובעים מהביקוש בפועל","במסירה ללקוח — כל השלבים עד המסירה, כולל הריפוד, נחשבים לתהליכי דחיפה לפי תחזית","בקבלת הזמנת הלקוח — ייצור השלדים למלאי עד שלב זה הוא Push, והריפוד לאחריו הוא Pull","בתכנון התחזית — התחזית היא שמושכת את הייצור ולכן כל השרשרת, כולל הריפוד, היא Pull"],c:2,e:"לפי המצגת, נקודת הניתוק בין דחיפה למשיכה היא קבלת הזמנת הלקוח: עד אליה מייצרים לתחזית ולמלאי (Push), ואחריה מבצעים לפי ההזמנה (Pull). ייצור השלדים למלאי הוא Push, והריפוד לפי בחירת הלקוח הוא Pull. תחזית אינה ״מושכת״ ייצור — ייצור לתחזית הוא עצם ההגדרה של דחיפה. (שא-7, שקף 9)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מה מאפיין תהליך Push (דחיפה) בשרשרת האספקה, לפי המצגת?",o:["ייצור המתחיל רק לאחר קבלת הזמנת לקוח, ללא החזקת מלאי של מוצרים גמורים","העברת מידע על הביקוש בפועל מהלקוח אל הספקים לאורך כל השרשרת","משלוח ישיר מהספקים ללקוחות תוך ביטול המחסנים והסיטונאים בשרשרת","ייצור והחזקת מלאי על בסיס תחזית, עוד לפני שהתקבלה הזמנת לקוח"],c:3,e:"תהליך Push הוא ייצור לתחזית ולמלאי — הפעילות מתבצעת לפני שיש הזמנת לקוח, והמלאי נדחף לאורך השרשרת. ייצור שמתחיל רק לאחר הזמנת לקוח הוא ההגדרה של Pull (משיכה), והמסיחים האחרים מתארים זרימת מידע ורשת אספקה, לא את מנגנון הדחיפה. (שא-7, שקף 9)"},
/* חמש מטרות שרשרת האספקה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברת הפצה חישבה כי ההכנסות מלקוחותיה בשנה האחרונה היו 12 מיליון ש״ח, בעוד סך העלויות של כל חוליות השרשרת — רכש, ייצור, אחסון והובלה — הסתכם ב-9 מיליון ש״ח. איזו ממטרות שרשרת האספקה מבטא ההפרש שחושב?",o:["Supply Chain Value — הערך הכולל שהשרשרת יוצרת עבור הלקוח ועבור הארגון","Supply Chain Profitability — ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת","Supply Chain Value Proposition — הצעת הערך שהשרשרת מציעה ללקוחותיה","יצירת ערך מוסף לארגון — תרומת השרשרת לחוסנו התחרותי של הארגון"],c:1,e:"Supply Chain Profitability מוגדרת במצגת בדיוק כך: ההפרש בין ההכנסות מהלקוח לסך העלויות של השרשרת — כאן 12 פחות 9, כלומר 3 מיליון ש״ח. Supply Chain Value הוא הערך שהשרשרת יוצרת (מושג רחב יותר, לא חישוב רווח), והצעת הערך היא מה שמוצע ללקוח, לא תוצאה כספית. (שא-7, שקף 10)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם חמש מטרות שרשרת האספקה כפי שהן מפורטות במצגת?",o:["מעבר מניהול השרשרת כמרכז עלות (Cost Center) לניהולה כמרכז רווח (Profit Center)","ניסוח הצעת הערך של השרשרת — Supply Chain Value Proposition","צמצום מספר הספקים והמפיצים בשרשרת כדי לפשט את ניהולה השוטף","יצירת ערך מוסף לארגון באמצעות פעילות שרשרת האספקה"],c:2,e:"חמש המטרות במצגת הן: יצירת ערך מוסף לארגון, Supply Chain Value, Supply Chain Profitability, Supply Chain Value Proposition ומעבר ממרכז עלות למרכז רווח. צמצום מספר הספקים והמפיצים אינו מופיע ברשימה — הוא לכל היותר החלטה תפעולית, לא מטרה של השרשרת. (שא-7, שקף 10)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מנכ״לית של יצרן מזון החליטה שמערך הלוגיסטיקה יפסיק להימדד רק לפי חיסכון בהוצאות, ויימדד לפי תרומתו להכנסות — למשל באמצעות שירותי משלוח מהיר בתשלום. איזו ממטרות שרשרת האספקה מתבטאת בהחלטה?",o:["מעבר מניהול השרשרת כמרכז עלות (Cost Center) לניהולה כמרכז רווח (Profit Center)","חישוב Supply Chain Profitability — ההפרש בין ההכנסות מהלקוח לעלויות השרשרת","הגדרת Supply Chain Value — כימות הערך שהשרשרת יוצרת עבור לקוחות הארגון","ניסוח Supply Chain Value Proposition — הצעת הערך של השרשרת לשוק היעד"],c:0,e:"המטרה החמישית במצגת היא מעבר ממרכז עלות למרכז רווח: השרשרת נמדדת לפי תרומתה להכנסות ולרווח ולא רק לפי הוצאותיה — בדיוק השינוי במדידה שבתרחיש. Supply Chain Profitability הוא חישוב של הפרש בין הכנסות לעלויות, ולא שינוי בתפיסת הניהול של המערך. (שא-7, שקף 10)"},
/* מרכיבי האסטרטגיה והחלטות אסטרטגיות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית ציוד ספורט שוקלת אם להמשיך לייצר את מסגרות האופניים במפעלה או להעביר את הייצור לקבלן חיצוני ולהשאיר בבית רק את התכנון והשיווק. לאיזו החלטה אסטרטגית בשרשרת האספקה שייכת הסוגיה?",o:["הקצאת מוצרים לאחסון — קביעה איזה מוצר יאוחסן בכל אחד מהמחסנים","BCP — תוכנית המשכיות עסקית למקרה של השבתת אתר הייצור המרכזי או של ספק קריטי","שיטות שילוח והפצה — בחירת המודלים ומסלולי ההפצה ללקוחות","Make or Buy — הבחירה בין ייצור עצמי (In-house) לבין מיקור חוץ (Outsourcing)"],c:3,e:"השאלה אם לייצר בעצמך או לרכוש מקבלן היא בדיוק החלטת Make or Buy — In-house מול Outsourcing — הנמנית עם ההחלטות האסטרטגיות בשרשרת. BCP עוסק בהמשכיות עסקית בעת משבר, והקצאת מוצרים למחסנים ושיטות ההפצה עוסקות בשלבים שלאחר הייצור. (שא-7, שקף 11)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לאחר שמפעל יחיד של ספק קריטי הושבת בשריפה, חברה מיפתה אתרי ייצור ומחסנים חלופיים ותכננה מראש כיצד תמשיך לספק ללקוחותיה במקרה של השבתה נוספת. איזה מרכיב בהחלטות האסטרטגיות של השרשרת בא לידי ביטוי?",o:["R&R — הגדרת תחומי האחריות של כל חוליה וכל גורם בשרשרת","BCP — תוכנית המשכיות עסקית כחלק מהחלטות המיקום של יצרנים, ספקים ומחסנים","KPI — קביעת מדדי ביצוע להזמנות, למלאי ולהובלה לאורך השרשרת ובכל אחת מחוליותיה","Sourcing — הגדרת עיסוקי הליבה והעברת שאר הפעילויות למיקור חוץ אצל ספקים מומחים"],c:1,e:"במצגת, החלטות המיקום (יצרנים, ספקים, מחסנים) כוללות BCP — תוכנית המשכיות עסקית, שמטרתה להבטיח המשך אספקה גם כשאתר מושבת, כמו בתרחיש. R&R עוסק בחלוקת אחריות, KPI במדידה, ו-Sourcing בהגדרת הליבה ומיקור חוץ — אף אחד מהם אינו תכנון להתמודדות עם השבתה. (שא-7, שקף 11)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> נמנה עם מרכיבי אסטרטגיית שרשרת האספקה כפי שהם מפורטים במצגת, אלא שייך לאסטרטגיה ארגונית אחרת?",o:["הגדרת התפיסה האסטרטגית של השרשרת — יעילות מול זמישות — כנגזרת מהאסטרטגיה הארגונית","קביעת מדיניות מלאי נפרדת לחומרי גלם, מלאי בתהליך, תוצרת גמורה ומלאי שירות","Segmentation של השווקים והלקוחות ו-Positioning של המוצרים בכל פלח שוק","בחירת מערכת המידע שתתמוך בשרשרת ובחירת שיטות השילוח וההפצה"],c:2,e:"Segmentation ו-Positioning מופיעים במצגת כמרכיבי אסטרטגיית השיווק (יחד עם המחרה וקידום מכירות), ולא כמרכיב של אסטרטגיית שרשרת האספקה. התפיסה האסטרטגית, מדיניות המלאי לסוגיו, מערכת המידע ושיטות השילוח וההפצה מופיעים כולם ברשימת מרכיבי אסטרטגיית השרשרת. (שא-7, שקפים 11–14)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מנהל תפעול מגדיר כללים שונים לכל סוג מלאי: רמת מלאי חומרי הגלם, היקף המלאי בתהליך, כמות התוצרת הגמורה במחסנים והיקף מלאי חלקי החילוף לשירות. איזה מרכיב באסטרטגיית שרשרת האספקה בא לידי ביטוי?",o:["מלאי — הגדרת מדיניות מלאי נפרדת לכל אחד מסוגי המלאי בשרשרת","הובלה — קביעת מודלים ומסלולי הפצה לאורך שרשרת האספקה ועד הלקוח הסופי","Sourcing — הגדרת עיסוקי הליבה של הארגון והעברת פעילויות למיקור חוץ","KPI — קביעת מדדי ביצוע להזמנות, למלאי ולהובלה בשרשרת"],c:0,e:"המצגת מונה במרכיב המלאי ארבעה סוגים — חומרי גלם, מלאי בתהליך, תוצרת גמורה ומלאי שירות — ודורשת מדיניות מלאי לכל אחד מהם, בדיוק כפי שהמנהל עושה. KPI עוסק במדידת ביצועים ולא בקביעת כללי ניהול, ו-Sourcing והובלה עוסקים בליבה ובהפצה. (שא-7, שקף 12)"},
/* זמישות — הגדרה ומרכיבים */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"כיצד מגדירה המצגת את המושג ״זמישות״ (Agility)?",o:["זמינות + זולות + יעילות — יכולת לספק את המוצר במחיר הנמוך ביותר בשוק","זריזות + דיוק + אמינות — יכולת לעמוד בתחזית ובלוח הזמנים שנקבע מראש","גמישות + ריכוזיות + סטנדרטיזציה — יכולת לייצר מגוון רחב במפעל אחד","זמינות + זריזות + גמישות — יכולת התאמה מהירה לנסיבות משתנות"],c:3,e:"המצגת מפרקת את המילה ״זמישות״ לשלושת מרכיביה: זמינות, זריזות וגמישות, ומגדירה אותה כיכולת התאמה מהירה לנסיבות משתנות ולצעדי המתחרים. זולות ויעילות שייכות לעולם ה-Lean, ואמינות ודיוק בתחזית אינם חלק מההגדרה. (שא-7, שקף 15)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית משקאות זיהתה בתוך שבועיים שמתחרה השיקה טעם חדש שזוכה להצלחה, שינתה את תוכנית הייצור, הוסיפה קו טעמים והגיעה למדפים לפני שהמתחרה ביססה את מעמדה. איזו יכולת, כפי שהוגדרה במצגת, הפגינה החברה?",o:["Lean — יכולת לייצר ביעילות מרבית תוך צמצום כל בזבוז ומלאי עודף בתהליך הייצור","Agility — יכולת להגיב מהר לנסיבות משתנות ולצעדים שנוקטות חברות מתחרות","JIT — יכולת לספק את המוצר בדיוק בזמן הנדרש ללא החזקת מלאי ביניים לאורך השרשרת","BCP — יכולת להמשיך לפעול ולספק ללקוחות גם לאחר משבר או השבתה של אתר ייצור"],c:1,e:"המצגת מגדירה Agility כיכולת של ארגון להגיב מהר לנסיבות המשתנות ולצעדים שנוקטות חברות מתחרות — ולעיתים אף כתנאי להישרדותו. התגובה המהירה להשקת המתחרה היא בדיוק זו. Lean עוסק ביעילות ובצמצום בזבוז, ו-BCP בהמשכיות לאחר משבר, לא בתגובה תחרותית. (שא-7, שקף 15)"},
/* אסטרטגיה ארגונית ← אסטרטגיית שרשרת */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן רכיבים לתעשיית הרכב מתחרה בעיקר על Lead Time קצר ועל Time to Market מהיר של דגמים חדשים. לפי המצגת, איזו אסטרטגיה ארגונית מנחה את החברה, ואיזו אסטרטגיית שרשרת נגזרת ממנה?",o:["אסטרטגיית עלות; ממנה נגזרת שרשרת יעילה המדגישה נצילות משאבים גבוהה","אסטרטגיית איכות; ממנה נגזרת שרשרת המדגישה תהליכי בדיקה ואמינות","אסטרטגיית זמן; ממנה נגזרת שרשרת תגובתית המדגישה אפקטיביות","אסטרטגיית גמישות; ממנה נגזרת שרשרת המדגישה מגוון מוצרים ו-MOQ נמוך"],c:2,e:"במצגת, Lead Time ו-Time to Market הם המרכיבים של אסטרטגיית ה״זמן״ הארגונית, וממנה נגזרת שרשרת תגובתית/אפקטיבית. אסטרטגיית גמישות עוסקת במגוון מוצרים וב-MOQ, ואסטרטגיית עלות — בחומרי גלם, עבודה ותקורה — מובילה לשרשרת יעילה, לא לזו שבתרחיש. (שא-7, שקף 17)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי המצגת, מהו הרצף שבו אסטרטגיית שרשרת האספקה נגזרת ומתורגמת לתוצאות?",o:["אסטרטגיה ארגונית ← אסטרטגיית שרשרת (עלות/יעילות מול תגובתיות/אפקטיביות) ← יכולות ← ביצועים","ביצועים ← יכולות ← אסטרטגיית שרשרת ← אסטרטגיה ארגונית, שכן התוצאות בשטח מכתיבות את האסטרטגיה","אסטרטגיית שרשרת ← אסטרטגיה ארגונית ← ביצועים ← יכולות, שכן השרשרת היא ליבת הפעילות של הארגון","יכולות ← אסטרטגיה ארגונית ← אסטרטגיית שרשרת ← ביצועים, שכן היכולות הקיימות קובעות את כיוון הארגון"],c:0,e:"המצגת מציגה את אסטרטגיית השרשרת כנגזרת מהאסטרטגיה הארגונית (איכות, זמן, גמישות, עלות): הבחירה בין עלות/יעילות לתגובתיות/אפקטיביות מגדירה את היכולות הנדרשות, ואלה מניבות את הביצועים. הרצפים ההפוכים הופכים את הסיבה והתוצאה. (שא-7, שקף 17)"},
/* התאמה אסטרטגית / החזית האסטרטגית */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברה משווקת מלח שולחני — מוצר בסיסי בעל ביקוש יציב וידוע לאורך כל השנה. לפי מודל ״ההתאמה האסטרטגית״, איזו שרשרת אספקה מתאימה לה?",o:["שרשרת תגובתית — כדי להבטיח שהמוצר לעולם לא יחסר על המדף בחנויות הרשת","שרשרת זמישה — כדי להגיב במהירות לכל שינוי קטן בהעדפות הצרכנים בשוק","שרשרת Hedge and deploy — החזקת מלאי גדול כדי לגדר את אי-הוודאות בביקוש","שרשרת יעילה — לביקוש ידוע ויציב מתאימה שרשרת המדגישה עלות נמוכה"],c:3,e:"במודל ההתאמה האסטרטגית, ביקוש ידוע ויציב ממוקם בקצה הנמוך של ציר אי-הוודאות, ותחום ההתאמה (האלכסון) מצמיד לו שרשרת יעילה שמדגישה עלות נמוכה. שרשרת תגובתית או זמישה נושאת עלויות תגובתיות שאינן נדרשות כשאין אי-ודאות בביקוש. (שא-7, שקפים 18–19)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"סטארט-אפ משיק מכשיר אלקטרוני חדשני שאין לו נתוני עבר על הביקוש, והתחזיות נעות בטווח רחב מאוד. איזה שילוב של אי-ודאות ביקוש ותגובתיות שרשרת נמצא, במקרה זה, בתחום ההתאמה האסטרטגית?",o:["אי-ודאות ביקוש גבוהה יחד עם שרשרת יעילה","אי-ודאות ביקוש גבוהה יחד עם שרשרת תגובתית","אי-ודאות ביקוש נמוכה יחד עם שרשרת תגובתית","אי-ודאות ביקוש נמוכה יחד עם שרשרת יעילה"],c:1,e:"מוצר חדש ללא היסטוריה ועם תחזית רחבה ממוקם גבוה בציר אי-ודאות הביקוש, ותחום ההתאמה (האלכסון) דורש לו שרשרת תגובתית. שילוב של אי-ודאות גבוהה עם שרשרת יעילה נמצא מחוץ לאלכסון — השרשרת לא תוכל להגיב לסטיות מהתחזית. (שא-7, שקף 19)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית נייר טואלט — מוצר בעל ביקוש יציב ותחזית מדויקת — בנתה שרשרת עם קיבולת ייצור גמישה, מלאי ביטחון גדול וספקים מהירים ויקרים. כיצד יאופיין מצב זה לפי מודל ההתאמה האסטרטגית?",o:["התאמה מלאה: מוצר בסיסי מחייב תגובתיות גבוהה כדי למנוע חוסרים על המדף בכל מחיר ובכל עונה של השנה","חוסר התאמה: השרשרת יעילה מדי ואינה מסוגלת להגיב לשינויים בביקוש למוצר","חוסר התאמה: השרשרת נמצאת מחוץ לאלכסון ונושאת עלויות תגובתיות שהביקוש היציב אינו מצדיק","התאמה חלקית: ביקוש יציב מחייב שרשרת תגובתית, אך מלאי הביטחון הגדול מיותר"],c:2,e:"ביקוש יציב וצפוי דורש שרשרת יעילה; קיבולת גמישה, מלאי ביטחון וספקים יקרים הם מאפייני שרשרת תגובתית, ולכן החברה נמצאת מחוץ לאלכסון ההתאמה ומשלמת על תגובתיות שאינה נחוצה. המסיח ״יעילה מדי״ הפוך למציאות בתרחיש — השרשרת תגובתית מדי, לא יעילה מדי. (שא-7, שקף 19)"},
/* טבלת רמות אי-הוודאות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מוצר מסוים מאופיין באי-דיוק בתחזית של כ-10%, בהיקף חוסרים של 1–2% ובסטיית עונתיות אפסית. לפי טבלת רמות אי-הוודאות במצגת, כיצד יסווג המוצר ומהי רמת הרווחיות הצפויה בקבוצה שלו?",o:["ביקוש ואספקה ידועים וצפויים — אי-ודאות נמוכה ורווחיות נמוכה","ביקוש ואספקה לא צפויים — אי-ודאות גבוהה ורווחיות גבוהה","ביקוש לא ידוע ואספקה ידועה — אי-ודאות בינונית ורווחיות בינונית","ביקוש ואספקה ידועים וצפויים — אי-ודאות נמוכה ורווחיות גבוהה"],c:0,e:"הערכים בתרחיש — אי-דיוק בתחזית כ-10%, חוסרים 1–2%, עונתיות 0% — הם בדיוק העמודה של ביקוש ואספקה ידועים וצפויים, שבה אי-הוודאות נמוכה והרווחיות נמוכה. המסיח האחרון מסווג נכון אך משייך לקבוצה רווחיות גבוהה, שבטבלה מאפיינת דווקא את המוצרים באי-ודאות גבוהה. (שא-7, שקף 20)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי טבלת רמות אי-הוודאות במצגת, אילו ערכים מאפיינים מוצרים שהביקוש והאספקה שלהם אינם צפויים (אי-ודאות גבוהה)?",o:["אי-דיוק בתחזית כ-10%, היקף חוסרים 1–2%, סטיית עונתיות 0%","אי-דיוק בתחזית 10–25%, היקף חוסרים 40–100%, סטיית עונתיות 1–2% בלבד","אי-דיוק בתחזית 1–2%, היקף חוסרים 0%, סטיית עונתיות 40–100%","אי-דיוק בתחזית 40–100%, היקף חוסרים 10–40%, סטיית עונתיות 10–25%"],c:3,e:"בעמודת אי-הוודאות הגבוהה בטבלה: אי-דיוק בתחזית 40–100%, היקף חוסרים 10–40% וסטיית עונתיות 10–25%, לצד רווחיות גבוהה. הערכים 10%, 1–2% ו-0% שייכים לעמודת אי-הוודאות הנמוכה, והמסיחים האחרים מערבבים את הטווחים בין השורות. (שא-7, שקף 20)"},
/* Who needs Agile — 80/20 */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ביצרנית כלי בית, 20% מהפריטים מייצרים כ-80% מהביקוש, ואילו 80% מהפריטים הנותרים מייצרים רק כ-20% ממנו. לפי שקף ״Who needs Agile Supply Chain?״, כיצד יש לנהל את הקבוצה הגדולה של הפריטים בעלי הביקוש הנמוך?",o:["בגישת Lean: Make to forecast, עדיפות נמוכה בלוח הייצור, ניהול מלאי מרכזי וחיפוש יתרונות לגודל","בגישת Agile: Make to order, עדיפות גבוהה בלוח הייצור ושימוש ב-Quick Response ו-Continuous Replenishment","בגישת Lean: ייצור למלאי בכמויות גדולות כדי לנצל יתרונות לגודל ולהוזיל את העלות ליחידה של כל פריט ופריט בקבוצה","בגישת Agile: Make to forecast עם מלאי ביטחון גדול, כדי להבטיח זמינות מיידית של כל פריט בקבוצה"],c:1,e:"לפי השקף, 80% מהמוצרים שמייצרים רק 20% מהביקוש מנוהלים בגישת Agile: Make to order, עדיפות גבוהה בלוח הייצור, Quick Response ו-Continuous Replenishment. גישת Lean — Make to forecast, עדיפות נמוכה, מלאי מרכזי ויתרונות לגודל — מיועדת דווקא ל-20% המוצרים שמייצרים את רוב הביקוש. (שא-7, שקף 21)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מה משמעות העיקרון ״Forecast for capacity, execute to demand״ המופיע בהקשר של שרשרת Agile?",o:["התחזית קובעת את כמויות הייצור, ואילו הקיבולת מותאמת בדיעבד לביקוש שהתממש בפועל","יש לייצר לפי התחזית עד מלוא הקיבולת, ולמכור את העודפים בהנחה בזמני שפל","התחזית משמשת לתכנון הקיבולת בלבד, ואילו הייצור בפועל מתבצע לפי הביקוש הממשי של הלקוחות","יש להזמין מהספקים לפי הקיבולת המרבית, ולבצע רק את ההזמנות שהתחזית צפתה"],c:2,e:"בשרשרת Agile התחזית אינה מכתיבה מה לייצר אלא רק כמה קיבולת להכין (Forecast for capacity); הייצור עצמו מתבצע לפי הביקוש הממשי (execute to demand). המסיח הראשון הופך את היוצרות — הוא מתאר ייצור לתחזית, שהוא מאפיין של Lean. (שא-7, שקף 21)"},
/* מטריצת ביקוש × זמן אספקה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"מוצר בעל ביקוש צפוי ויציב, שזמן האספקה שלו מהספק ארוך ונמדד בחודשים. לאיזו משבצת במטריצת מאפייני הביקוש × זמן האספקה הוא שייך?",o:["Plan and execute (Lean) — תכנון לפי תחזית וביצוע התוכנית","JIT — אספקה בדיוק בזמן ללא החזקת מלאי","Hedge and deploy — גידור אי-הוודאות באמצעות החזקת מלאי גדול","React and execute (Agile) — תגובה מהירה לביקוש בפועל בזמן אמת"],c:0,e:"במטריצה, ביקוש צפוי בשילוב זמן אספקה ארוך מוביל ל-Plan and execute — גישת Lean שבה מתכננים לפי תחזית ומבצעים. JIT מתאים לביקוש צפוי עם זמן אספקה קצר, ואילו Hedge and deploy ו-Agile מיועדים לביקוש שאינו צפוי. (שא-7, שקף 22)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יבואן צעצועים לעונת החגים מזמין מהמזרח הרחוק בזמן אספקה של ארבעה חודשים, והביקוש לכל דגם אינו ניתן לחיזוי. איזו אסטרטגיה מציעה מטריצת הביקוש × זמן האספקה למקרה זה?",o:["React and execute (Agile) — תגובה לביקוש בפועל בזמן אמת","JIT — אספקה בדיוק בזמן על פי ההזמנות שמתקבלות","Plan and execute (Lean) — תכנון וביצוע לפי התחזית","Hedge and deploy — גידור אי-הוודאות באמצעות החזקת מלאי מראש"],c:3,e:"ביקוש לא צפוי בשילוב זמן אספקה ארוך הוא המשבצת של Hedge and deploy / Hold inventory: כשאי אפשר להגיב מהר, מגדרים את אי-הוודאות באמצעות מלאי. React and execute (Agile) דורש זמן אספקה קצר שמאפשר תגובה, מה שאינו קיים בארבעה חודשי הובלה. (שא-7, שקף 22)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי מטריצת מאפייני הביקוש × זמן האספקה, מה מבדיל בין המשבצת של JIT לבין המשבצת של Agile (React and execute)?",o:["שתיהן בביקוש צפוי, אך JIT מתאימה לזמן אספקה קצר ו-Agile לזמן אספקה ארוך","שתיהן בזמן אספקה קצר, אך JIT מתאימה לביקוש צפוי ו-Agile לביקוש לא צפוי","שתיהן בביקוש לא צפוי, אך JIT מתאימה לזמן אספקה ארוך ו-Agile לזמן אספקה קצר","שתיהן בזמן אספקה ארוך, אך JIT מתאימה לביקוש לא צפוי ו-Agile לביקוש צפוי"],c:1,e:"שתי המשבצות נמצאות בשורת זמן האספקה הקצר: JIT בעמודת הביקוש הצפוי, ו-React and execute (Agile) בעמודת הביקוש הלא צפוי. זמן אספקה ארוך מוביל ל-Plan and execute (ביקוש צפוי) או ל-Hedge and deploy (ביקוש לא צפוי), ולא לאחת משתי אלה. (שא-7, שקף 22)"},
/* מאפייני שרשרת הביקוש הזמישה */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"רשת קמעונאית משדרת לספקיה מדי יום את נתוני המכירות בפועל מהקופות, והספקים מתכננים את הייצור על פי נתונים אלה ולא על פי רמות המלאי במחסני הרשת. איזה מאפיין של שרשרת הביקוש הזמישה בא לידי ביטוי?",o:["Process integration — שיתוף פעולה בין ספקים ללקוחות בפיתוח מוצרים חדשים","Market sensitive — היכולת לחוש את דרישות השוק המשתנות ולהגיב להן","Virtual — שרשרת המבוססת על מידע מהשוק ולא על בסיס המלאי בארגון","Network based — רשת של שותפים המחוברים On Line באמצעות EDI"],c:2,e:"המאפיין Virtual מוגדר במצגת כשרשרת המבוססת על מידע מהשוק ולא על בסיס מלאי בארגון — בדיוק ההחלפה שבתרחיש: נתוני מכירה במקום רמות מלאי. Market sensitive עוסק ביכולת לחוש ולהגיב לדרישות השוק, אך הדגש בתרחיש הוא על בסיס התכנון (מידע במקום מלאי). (שא-7, שקף 24)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרן רכיבים ולקוחו, יצרן מכשירים, מפתחים יחד את הדור הבא של המוצר, מתאמים תהליכי עבודה משותפים ומשתפים זה את זה בתוכניות הייצור. איזה מאפיין של שרשרת הביקוש הזמישה מתואר?",o:["Process integration — אינטגרציה של תהליכים בין ספקים ללקוחות ושיתוף פעולה בפיתוח מוצרים","Market sensitive — היכולת לחוש ולהגיב לדרישות השוק ולשינויים בהעדפות הלקוחות בשווקים השונים","Virtual — שרשרת המבוססת על מידע מהשוק ולא על בסיס המלאי הקיים בארגון, תוך תכנון לפי נתוני המכירות","Network based — רשת שותפים המחוברים On Line ופועלים על פי ביקוש אמיתי של הלקוחות, באמצעות EDI"],c:0,e:"Process integration מוגדר במצגת כאינטגרציה של תהליכים בין הספקים ללקוחות, כולל שיתוף פעולה בפיתוח מוצרים — בדיוק הפיתוח המשותף ותיאום התהליכים שבתרחיש. Network based עוסק בחיבור מקוון של רשת שותפים, ולא בפיתוח משותף. (שא-7, שקף 24)"},
/* Lean מול Agile */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"לפי המצגת, מה מבדיל בין שרשרת Lean לבין שרשרת Agile מבחינת הדגש, כיוון המיקוד וסוג השרשרת?",o:["Lean — אפקטיביות ותגובתיות, מיקוד החוצה בלקוח, Demand Chain; Agile — יעילות ועלות, מיקוד פנימה בארגון, Supply Chain","Lean — יעילות ועלות, מיקוד החוצה בלקוח, Demand Chain; Agile — אפקטיביות ותגובתיות, מיקוד פנימה בארגון, Supply Chain","Lean — אפקטיביות ועלות, מיקוד פנימה בארגון, Demand Chain; Agile — יעילות ותגובתיות, מיקוד החוצה בלקוח, Supply Chain","Lean — יעילות ועלות, מיקוד פנימה בארגון, Supply Chain; Agile — אפקטיביות ותגובתיות, מיקוד החוצה בלקוח, Demand Chain"],c:3,e:"בשקף Lean vs. Agile: Lean מדגיש יעילות ועלות, ממוקד פנימה בארגון ומייצג Supply Chain; Agile מדגיש אפקטיביות ותגובתיות, ממוקד החוצה בלקוח ומייצג Demand Chain. המסיחים מחליפים בין הדגשים, בין כיווני המיקוד או בין סוגי השרשרת. (שא-7, שקף 25)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית ריהוט מאפשרת ללקוחותיה להזמין כל פריט במידות ובגימור אישיים; כל הזמנה מיוצרת כיחידה בודדת לאחר קבלתה ונמסרת במועד שביקש הלקוח. כיצד תסווג השרשרת לפי שקף ״מה עושים עכשיו״?",o:["שרשרת ״רזה״ (Lean) — Push, יעילות אריזה ומשלוחים ואספקה ממלאי זמין","שרשרת ״זמישה״ (Agile) — Batch of One, Pull ומענה לביקוש בזמן המבוקש","שרשרת ״רזה״ (Lean) — Batch of One כאמצעי לצמצום המלאי ולהוזלת האחסון","שרשרת ״זמישה״ (Agile) — Push על בסיס תחזית ואספקה מיידית ממלאי זמין"],c:1,e:"ייצור של יחידה בודדת לפי הזמנה (Batch of One), התחלת הייצור רק לאחר ההזמנה (Pull) ומסירה במועד שביקש הלקוח הם שלושת מאפייני השרשרת ה״זמישה״ בשקף. שרשרת ״רזה״ מאופיינת ב-Push, ביעילות אריזה ומשלוחים ובאספקה ממלאי זמין; Batch of One אינו כלי Lean. (שא-7, שקף 26)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בחברה אחת מודדים את הצלחת השרשרת לפי עלות ליחידה ונצילות המשאבים, ובחברה שנייה — לפי שיעור ההזמנות שסופקו בזמן ובכמות שביקש הלקוח. לפי ההבחנה בין Lean ל-Agile, מה ניתן לומר על שתי החברות?",o:["הראשונה מודדת אפקטיביות ברוח Agile, והשנייה מודדת יעילות ברוח Lean","שתיהן מודדות יעילות, שכן עמידה בזמנים ועלות ליחידה הם מדדי Lean קלאסיים","הראשונה מודדת יעילות ברוח Lean, והשנייה מודדת אפקטיביות ותגובתיות ברוח Agile","שתיהן מודדות אפקטיביות, שכן שני המדדים נגזרים מדרישות הלקוח הסופי"],c:2,e:"עלות ליחידה ונצילות משאבים הם מדדי יעילות — הדגש של Lean, הממוקד פנימה בארגון. עמידה בזמן ובכמות שביקש הלקוח היא מדד אפקטיביות ותגובתיות — הדגש של Agile, הממוקד החוצה בלקוח. עמידה בזמנים אינה מדד יעילות, ועלות ליחידה אינה נגזרת מדרישות הלקוח. (שא-7, שקף 25)"},
/* טבלת ההשוואה — שמונה שורות */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"יצרנית מחשבים ניידים מתכננת את מוצריה כך שניתן להרכיבם ממודולים מתחלפים (זיכרון, מסך, סוללה) ולהתאימם להזמנת כל לקוח. לאיזו אסטרטגיה שייכת ההחלטה, ובאיזו שורה בטבלת ההשוואה היא מופיעה?",o:["תגובתיות/אפקטיביות — אסטרטגיית תיכון המוצר: תיכון מודולרי למתן אפשרות התאמה","עלות/יעילות — אסטרטגיית תיכון המוצר: תיכון המוצר בעלות המינימלית האפשרית לייצור","תגובתיות/אפקטיביות — אסטרטגיית ייצור: קיבולת ייצור גמישה המותאמת לביקוש המשתנה","עלות/יעילות — אסטרטגיית ייצור: נצילות גבוהה של משאבי הייצור והמכונות במפעל"],c:0,e:"בשורת אסטרטגיית תיכון המוצר בטבלה, השרשרת התגובתית/אפקטיבית מתכננת מוצר מודולרי כדי לאפשר התאמה, ואילו השרשרת היעילה מתכננת בעלות מינימלית. מודולים מתחלפים הם תיכון מוצר, לא קיבולת ייצור — ולכן שורת אסטרטגיית הייצור אינה רלוונטית. (שא-7, שקף 28)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"חברה בוחרת ספקים לפי קריטריון עיקרי אחד — המחיר הנמוך ביותר לרכיב, תוך הסתפקות באיכות בסיסית; במקביל היא מחזיקה מלאי מינימלי ומפיצה במסלול הזול ביותר. איזו אסטרטגיה מתוארת, ומה היה צפוי בשרשרת ההפוכה?",o:["אסטרטגיית תגובתיות/אפקטיביות; בשרשרת יעילה היו נבחרים ספקים יקרים ואיכותיים ומוחזק מלאי ביטחון גדול","אסטרטגיית עלות/יעילות; בשרשרת תגובתית היו נבחרים ספקים זולים עוד יותר ומוחזק מלאי אפס","אסטרטגיית תגובתיות/אפקטיביות; בשרשרת יעילה הייתה מוחזקת קיבולת ייצור גמישה ומלאי ביטחון","אסטרטגיית עלות/יעילות; בשרשרת תגובתית היו נבחרים ספקים זמישים באיכות גבוהה ומוחזק מלאי ביטחון"],c:3,e:"ספקים לפי עלות ואיכות נמוכה, מלאי מינימלי והפצה בעלות נמוכה הם שלוש שורות בעמודת העלות/יעילות בטבלה. בעמודה התגובתית/אפקטיבית מולן: ספקים זמישים באיכות גבוהה, מלאי ביטחון והפצה מהירה וזמישה. המסיחים משייכים את התיאור לאסטרטגיה הלא נכונה או מתארים שרשרת הפוכה שאינה קיימת בטבלה. (שא-7, שקף 28)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בטבלת ההשוואה בין אסטרטגיית עלות/יעילות לאסטרטגיית תגובתיות/אפקטיביות, איזה מהצמדים הבאים <b>אינו</b> תואם את המצגת?",o:["אסטרטגיית זמני אספקה: צמצום בעלות מיטבית בשרשרת יעילה מול צמצום בכל מחיר בשרשרת תגובתית","אסטרטגיית המחרה: רווחיות גבוהה בשרשרת יעילה מול רווחיות נמוכה בשרשרת תגובתית","אסטרטגיית מלאי: מלאי מינימלי בשרשרת יעילה מול מלאי ביטחון בשרשרת תגובתית","אסטרטגיית שילוח והפצה: עלות נמוכה בשרשרת יעילה מול הפצה מהירה וזמישה בשרשרת תגובתית"],c:1,e:"בשורת אסטרטגיית ההמחרה בטבלה, השרשרת היעילה פועלת ברווחיות נמוכה והשרשרת התגובתית ברווחיות גבוהה — הצמד במסיח הפוך. שלוש השורות האחרות (זמני אספקה, מלאי, שילוח/הפצה) מובאות כפי שהן בטבלה. (שא-7, שקף 28)"},
/* מקרה Cardo */
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"בשלב מסוים בציר השינוי של Cardo, רוב הספקים הקריטיים עדיין בסין אך ספקים שוליים כבר באירופה, הרכש עבר לספק (Turn Key), הייצור עדיין BTO, המסירה FOB הונגריה עם 6 ימי הובלה יבשתית, והמרכזים הלוגיסטיים במיקור חוץ. לאיזו שנה בציר מתאים התיאור?",o:["2015 — נקודת המוצא, כאשר החברה עצמה רכשה את ה-BOM והייצור בוצע בקבלנות משנה בסין","2020 — השלב המתקדם, לאחר המעבר לספקים מקומיים (Localization) ול-Build to Stock","2017 — שלב הביניים, לאחר העברת הרכש לספק ולפני המעבר ל-SKU אחד ול-Build to Stock","שלב ביניים בין 2017 ל-2020, לאחר המעבר ל-Build to Stock אך לפני ה-Localization"],c:2,e:"התיאור תואם את עמודת 2017: רוב הספקים הקריטיים בסין וספקים שוליים באירופה, רכש Turn Key על ידי הספק, BTO, FOB הונגריה, 6 ימי הובלה יבשתית ומרכזים לוגיסטיים במיקור חוץ. ב-2015 החברה רכשה את ה-BOM והמסירה הייתה FOB הונג קונג; ב-2020 כבר עברו ל-Localization, ל-SKU אחד ול-Build to Stock. (שא-7, שקפים 36, 39)"},
{t:"אסטרטגיות ושרשרת אספקה זמישה",s:"שלמה",q:"ב-2015 מסרה Cardo למפיצים בתנאי FOB הונג קונג עם כ-6 שבועות הובלה ימית לארה״ב, ומפעל הקבלן הושבת מדי שנה בראש השנה הסיני. איזה שינוי בציר 2017–2020 נועד לקצר את זמן ההובלה ולהפחית את התלות בסין?",o:["מעבר לספקים מקומיים (Localization) ומסירה FOB הונגריה עם כ-6 ימי הובלה יבשתית","החזרת רכש רכיבי ה-BOM לידי החברה והרחבת הייצור בקבלנות משנה בסין","פתיחת מרכזים לוגיסטיים נוספים בבעלות עצמית באירופה ובארה״ב לקיצור המשלוחים","הגדלת מספר המק״טים ל-200 כדי להתאים כל מוצר למפיץ ולמדינה ולקצר את ההפצה"],c:0,e:"בציר השינוי, המסירה עברה מ-FOB הונג קונג עם 6 שבועות הובלה ימית ל-FOB הונגריה עם 6 ימי הובלה יבשתית, ובמקביל עברו לספקים מקומיים (Localization) ולרכש Turn Key על ידי הספק — צעדים שקיצרו את זמן האספקה והקטינו את התלות בסין. המרכזים הלוגיסטיים עברו דווקא למיקור חוץ, והמק״טים צומצמו ולא הוגדלו. (שא-7, שקפים 31, 36, 39)"},
