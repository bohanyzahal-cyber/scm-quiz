{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"לפי המבנה התפעולי שהוצג, על מה אחראית האחזקה בארגון?",o:["על כשירות המערכות — שיהיו מוכנות לעבודה","על העברת החומרים מהספקים לליבת הייצור ומשם ללקוחות","על המרת החומרים למוצרים ולשירותים שנמסרים ללקוח","על הזרמת הכספים מהלקוחות אל ההנהלה ואל הספקים"],c:0,e:"שקף 3: הלקוח מניע את המערכת בהזרמת כספים; ההנהלה מקבלת משאבים מהספקים ומעבירה לליבת הייצור; הייצור מבצע המרה; הלוגיסטיקה אחראית להעביר את החומרים; האחזקה — אחראית על כשירות המערכות. (מצגת 7, שקף 3)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"באוניברסיטה, מה נחשב ״ציוד קבוע״ בתשתיות הייצור הפיזיות?",o:["הידראוליקה ומערכת המיזוג","מחשב, מקרן, שולחנות וכיסאות","מרקרים ודפים (חומר מתכלה)","הכיתות והמבנים עצמם"],c:1,e:"שקף 7: מבנים — הכיתות; מערכות הנדסיות — הידראוליקה, מערכת המיזוג; ציוד קבוע — מחשב, מקרן, שולחנות וכיסאות. מרקרים ודפים הם מלאי — חומר מתכלה שמומר לידע (שקף 5). (מצגת 7, שקפים 4–7)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מה ההבדל בין אמינות <bdi dir='ltr'>(R)</bdi> לזמינות <bdi dir='ltr'>(A)</bdi> כמדדי אחזקה?",o:["אין הבדל מהותי — שני המונחים מתארים את אחוז הזמן שבו הציוד תקין ופועל","אמינות — הזמן הממוצע לתיקון תקלה; זמינות — הזמן הממוצע בין תקלות, בשעות עבודה","אמינות — הסיכוי שהציוד יהיה מוכן לשימוש; זמינות — הסיכוי שהציוד יסיים פעולה של <bdi dir='ltr'>t</bdi> שעות","אמינות — הסיכוי שהציוד יסיים פעולה של <bdi dir='ltr'>t</bdi> שעות; זמינות — הסיכוי שהציוד יהיה מוכן לשימוש"],c:3,e:"שקף 9: אמינות <bdi dir='ltr'>R</bdi> — ״מהו הסיכוי שציוד יסיים פעולה בת <bdi dir='ltr'>t</bdi> שעות״; זמינות <bdi dir='ltr'>A</bdi> — ״מהו הסיכוי שציוד יהיה מוכן לשימוש״, למשל כמה מתוך 100 משאיות יהיו זמינות לעבודה, או אחוז הזמן שמשאית זמינה. (מצגת 7, שקף 9)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מהי עלות מחזור חיים <bdi dir='ltr'>(LCC)</bdi>?",o:["סך עלויות האחזקה השנתיות של המערכת, בלי עלות הרכישה ובלי עלות הגריטה","העלות הממוצעת לשעת פעולה של המערכת בשנה הראשונה להפעלתה בארגון","סך העלויות של הצטיידות, תפעול, אחזקה והוצאה משירות לאורך כל חיי המערכת","מחיר הרכישה של המערכת בתוספת עלות ההתקנה וההדרכה הראשונית של הצוות"],c:2,e:"שקף 10: <bdi dir='ltr'>LCC</bdi> — ״סך כל העלויות של הצטיידות, תפעול, אחזקה והוצאה משירות של מערכת או תשתית לאורך מחזור החיים״. ישנם קשרי גומלין בין המרכיבים: עלויות פיתוח וייצור נמוכות ← עלויות אחזקה ותפעול גבוהות (״הזול הוא יקר״, שקף 11). (מצגת 7, שקפים 10–11)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מה פירוש העיקרון ״הזול הוא יקר״ בהקשר של עלות מחזור חיים?",o:["ציוד יקר תמיד חוסך בעלויות התפעול, ולכן עדיף לרכוש אותו בכל מצב","ציוד זול תמיד עדיף, כי עלויות האחזקה אינן תלויות כלל במחיר הרכישה","עלות הגריטה של ציוד זול גבוהה ממחיר הרכישה שלו","חיסכון בפיתוח ובייצור עלול להתבטא בעלויות תפעול ואחזקה גבוהות"],c:3,e:"שקפים 10–11: יש קשרי גומלין בין מרכיבי העלות. בהשוואת עלות מצטברת לאורך השלבים (פיתוח, ייצור, תפעול ואחזקה, הוצאה מהשימוש), מערכת שזולה ברכישה עלולה להיות יקרה יותר בסך מחזור החיים. לכן: לרכוש חכם, לתחזק חכם ולדעת מתי להחליף (שקף 13). (מצגת 7, שקפים 10–13)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"לפי פילוח עלות מחזור החיים של מטוס קרב שהוצג, מה חלקן של עלויות התפעול והאחזקה (15 שנה) לעומת ההשקעה?",o:["כ-47% תפעול ואחזקה, לעומת כ-53% השקעה","כ-20% תפעול ואחזקה, לעומת כ-80% השקעה","כ-80% תפעול ואחזקה, לעומת כ-20% השקעה","כ-53% תפעול ואחזקה, לעומת כ-47% השקעה"],c:3,e:"שקף 12: השקעה 47% (פיתוח 9%, ייצור מטוס 24%, ציוד נלווה ותוכנה 12% ועוד); תפעול ואחזקה ל-15 שנה 53%. יותר ממחצית העלות מגיעה אחרי הרכישה. (מצגת 7, שקף 12)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מהם שני ״מצבי החיים״ של ציוד בדוגמת חברת האוטובוסים?",o:["בשעות העבודה ומחוץ להן — לפי משמרות הנהגים","בבעלות ובחכירה — לפי עלות מחזור החיים של כל אוטובוס וגיל הצי כולו","חדש ומשומש — הציוד עובר ממצב למצב בכל טיפול מונע שמבוצע בו במוסך","זמין ופעיל <bdi dir='ltr'>(MTBF)</bdi>, ומצב אחזקה <bdi dir='ltr'>(MTTR)</bdi> — מונעת, שבר והמתנה לחלפים"],c:3,e:"שקף 14: האתגר — זמינות מקסימלית של אוטובוסים במינימום עלות. שני מצבי חיים: הציוד זמין ופעיל <bdi dir='ltr'>(Mean Time Between Failures)</bdi>, ומצב אחזקה <bdi dir='ltr'>(Mean Time To Repair)</bdi>: אחזקה מונעת, אחזקת שבר, המתנה לחלפים ובזבוזים. (מצגת 7, שקפים 14, 16)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מהי ״מטרת העל״ של האחזקה, לפי המצגת?",o:["הקטנת עלויות האחזקה","הארכת משך חיי הציוד","הגעה לזמינות של 100%","מניעת כל תקלה אפשרית"],c:0,e:"שקף 19 — מטרות האחזקה: הפקת תועלת מקסימלית מהציוד באמצעות כשירותו וזמינותו; הארכת משך חיי הציוד; שיפור הזמינות (הקטנת הסיכוי לתקלה); מניעת השבתות בלתי צפויות; והקטנת עלויות אחזקה — ״מטרת על״. (מצגת 7, שקף 19)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"באילו מקרים נהוגה בדרך כלל אחזקת שבר (מתקנת)?",o:["כשהתקלה עלולה לגרום לסיכון בטיחותי חמור או לנזק כספי ניכר לארגון","כש-<bdi dir='ltr'>MTBF</bdi> גבוה, הנזק מתקלה זניח, ההפעלה השוטפת יקרה והציוד זול","כשהיצרן מחייב טיפולים תקופתיים לפי הוראות היצרן והאחריות","כשיש מערכת חיישנים שמתריעה לפני שהתקלה מתרחשת בפועל"],c:1,e:"שקף 21: אחזקת שבר (״כיבוי שרפות״) נהוגה כאשר הזמן בין התקלות <bdi dir='ltr'>(MTBF)</bdi> גבוה; הנזק עקב תקלה אפסי; מחיר הפעלת ציוד בשוטף יקר יחסית; מחיר הציוד נמוך וניתן להחזיק מלאי רזרבי. סיכון בטיחותי והוראות יצרן הם מקרים לאחזקה מונעת; התרעת חיישנים — אחזקה חזויה. (מצגת 7, שקפים 20–24)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מה מאפיין אחזקה מונעת (מתוכננת)?",o:["״כיבוי שרפות״ — מתקנים רק כשמשהו מתקלקל, ולכן אין עלויות אחזקה שוטפת","טיפול רק אחרי התרעה ממערכת מעקב מתקדמת שמאבחנת את מצב הציוד בפועל","החלפת הציוד כולו בכל שנה, בלי קשר למצבו, כדי למנוע תקלות","״הקדמת רפואה למכה״ — טיפול מתוכנן לפני התקלה, לפי ניתוח סטטיסטי"],c:3,e:"שקף 22: אחזקה מונעת — הפעולות מבוצעות בטרם נוצרת תקלה, באופן מתוכנן, כדי להקטין את הסיכוי לתקלה (״הקדמת רפואה למכה״); ההחלטה ותדירות הביצוע מבוססות על ניתוח סטטיסטי של אורך החיים. חשובה במערכות חיוניות/בטיחותיות, כשהטיפול מחויב על פי היצרן, וכשעלותו נמוכה ביחס לנזק (שקף 23). (מצגת 7, שקפים 22–23)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מה מאפיין אחזקה חזויה <bdi dir='ltr'>(Predictive)</bdi>?",o:["טיפולים בתדירות קבועה מראש, לפי לוח זמנים שנתי שנקבע על ידי היצרן","תיקון רק אחרי שהציוד התקלקל, בלי טיפולים שוטפים","פעולות אחרי התרעה ממערכת מעקב שמאבחנת את מצב הציוד בפועל","החלפת רכיבים לפי ותק, בלי קשר למצבם בפועל"],c:2,e:"שקף 24: פעולות המבוצעות לאחר קבלת התרעה ממערכת מעקב מדויקת המאבחנת את מצב הציוד בפועל; שימוש בטכנולוגיה מתקדמת ויקרה (מעקב תנודות, תרמוגרפיה ועוד); שיטה הלומדת ומזהה את הסביבה שבה מתרחשות התקלות ומתריעה. (מצגת 7, שקף 24)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"לפי המצגת, מדוע אין ״אחזקה מקסימלית״ אלא ״אחזקה אופטימלית״?",o:["כי המונחים זהים — אחזקה אופטימלית היא פשוט אחזקה מקסימלית בתדירות הגבוהה ביותר האפשרית","כי אחזקה מקסימלית משפרת תמיד את הרווח, אך אין מספיק טכנאים כדי לבצע אותה בפועל","כי אחזקה מקסימלית אסורה על פי תקני הבטיחות, ולכן יש לבצע רק את המינימום שהיצרן מחייב","כי יש נקודות מבט שונות: סף טכנולוגי, פעילות סדירה של הקו, ומינימום עלות או מקסימום רווח לבעלים"],c:3,e:"שקף 26: מבחינה טכנולוגית — הסף הטכנולוגי; מבחינת קו הייצור — מקסימום פעילות סדירה; מבחינת הבעלים — מינימום עלויות / מקסימום רווח. מעבר לנקודה מסוימת, שיפור ברמת האיכות עולה יותר ממה שהוא מכניס. (מצגת 7, שקף 26)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"מה קורה לעלויות כשמעלים את רמת האחזקה, לפי גרף עלויות האחזקה?",o:["ההשקעה באחזקה עולה, הנזק משבר יורד, ולסך העלות יש מינימום","עלות הנזק מתקלות עולה, ועלויות ההשקעה באחזקה יורדות עם רמת האחזקה","כל העלויות יורדות — ככל שמשקיעים יותר באחזקה, סך העלות קטן בלי גבול","סך העלות מגיע למינימום תמיד בדיוק בנקודת החיתוך של שתי הפונקציות"],c:0,e:"שקפים 27–28: עלייה ברמת האחזקה מעלה את עלויות ההשקעה במניעת שבר ומורידה את עלות הנזק מתקלות. בדוגמה בשקף החיתוך הוא גם המינימום, ״אבל זה לא הכרחי״; מעבר למינימום, השיפור בעלויות השבר לא מכסה את עלויות ההשקעה. (מצגת 7, שקפים 27–28)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"לפי מודל ״הקרחון״, איזו מהעלויות הבאות היא עלות אחזקה נסתרת?",o:["מלאי ביניים גבוה לאבטחת המשכיות הייצור","עלות חומרי גלם שנפגמו בייצור מוצרים פגומים","עלות הטיפול בתקלה עצמה","שכר הטכנאי שמתקן את התקלה"],c:0,e:"שקף 29: בשלבי הבנייה של מערכת אחזקה, רוב העלויות נסתרות — למשל מלאי ביניים גבוה לאבטחת המשכיות הייצור (<bdi dir='ltr'>JIT</bdi> אפשרי רק כשהאיכות גבוהה), ועלויות פיגורים ופיצויים ללקוחות בגלל השבתה. העלויות הנראות: עלות חומרי גלם למוצרים פגומים, עלות הטיפול בתקלה. (מצגת 7, שקף 29)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"איזו מהעלויות הבאות היא עלות אחזקה ״יזומה״ (להבדיל מ״כפויה״)?",o:["חומרי גלם ומוצרים שהתקלקלו בגלל התקלה","ביצוע תיקון אחרי תקלת שבר","רכישת מערכת לאחזקה חזויה וביצועה","השבתת המפעל בזמן ביצוע אחזקת שבר"],c:2,e:"שקפים 30–31: עלויות יזומות — ניתוח סטטיסטי לקביעת תדירות אחזקה מונעת והאחזקה המונעת עצמה; רכישת מערכת לאחזקה חזויה וביצועה. עלויות כפויות — השבתת המפעל בזמן אחזקת שבר, ביצוע אחזקת השבר, חומרי גלם ומוצרים שהתקלקלו. מטרת הסיווג: להגדיל את היזום ולהקטין את הכפוי. (מצגת 7, שקפים 30–31)"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"לציוד <bdi dir='ltr'>MTBF</bdi> של 180 שעות ו-<bdi dir='ltr'>MTTR</bdi> של 20 שעות. מהי הזמינות שלו?",o:["0.90","0.11","0.89","9.00"],c:0,e:"<bdi dir='ltr'>A = MTBF / (MTBF + MTTR) = 180 / (180 + 20) = 0.90</bdi> — הציוד זמין 90% מהזמן.<br>0.11 — <bdi dir='ltr'>MTTR/MTBF</bdi>; 0.89 — <bdi dir='ltr'>1 − 20/180</bdi>; 9.00 — <bdi dir='ltr'>MTBF/MTTR</bdi>. (מצגת 7, שקף 16)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"כל מכשיר בבית חולים מוכן לשימוש 200 מתוך 250 ימי עבודה. כמה מכשירים צריך להחזיק כדי שבכל רגע יהיו לפחות 60 מכשירים זמינים?",o:["75","48","300","72"],c:0,e:"<bdi dir='ltr'>A = 200 / 250 = 0.8</bdi> ← <bdi dir='ltr'>X = 60 / 0.8 = 75</bdi> מכשירים (75 · 0.8 = 60 זמינים בממוצע).<br>48 — הכפלה ב-<bdi dir='ltr'>A</bdi> במקום חלוקה; 72 — תוספת 20% ״על העין״. בשקף 15: <bdi dir='ltr'>A = 180/240 = 0.75</bdi>, <bdi dir='ltr'>120 / 0.75 = 160</bdi>. (מצגת 7, שקף 15)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"בארגון שמבצע אחזקת שבר בלבד מתרחשות 2 תקלות בחודש. לכל תקלה: זיהוי שעה אחת (ללא טכנאי) ותיקון 5 שעות; עלות שעת השבתה 2,000 ₪, שכר טכנאי 200 ₪ לשעה, וחומרים 1,000 ₪ לתקלה. מהי עלות אחזקת השבר השנתית?",o:["288,000 ₪","336,000 ₪","340,800 ₪","168,000 ₪"],c:1,e:"לתקלה: השבתה <bdi dir='ltr'>(1 + 5) · 2,000 = 12,000</bdi>; טכנאי <bdi dir='ltr'>5 · 200 = 1,000</bdi>; חומרים 1,000 ← <bdi dir='ltr'>14,000</bdi> ₪.<br><bdi dir='ltr'>2 · 12 = 24</bdi> תקלות בשנה ← <bdi dir='ltr'>14,000 · 24 = 336,000</bdi> ₪.<br>ההשבתה כוללת גם את זמן הזיהוי (288,000 אם שוכחים אותו); הטכנאי משולם רק על התיקון (340,800 אם מחייבים גם על הזיהוי). (מצגת 7, שקפים 32–33)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"בארגון שבו תקלת שבר עולה 14,000 ₪ ויש 24 תקלות בשנה, מוצעת אחזקה מונעת: טיפול אחת לחודש, 2 שעות (נדרש טכנאי ב-200 ₪ לשעה, השבתה 2,000 ₪ לשעה), חומרים 300 ₪ לטיפול. בעקבותיה מספר התקלות יורד ב-50%. מהי עלות האחזקה השנתית הכוללת?",o:["392,400 ₪","176,400 ₪","224,400 ₪","56,400 ₪"],c:2,e:"טיפול מונע: <bdi dir='ltr'>2·2,000 + 2·200 + 300 = 4,700</bdi> ₪ ← שנתי <bdi dir='ltr'>4,700 · 12 = 56,400</bdi>.<br>תקלות: <bdi dir='ltr'>24 · 50% = 12</bdi> ← <bdi dir='ltr'>12 · 14,000 = 168,000</bdi>.<br>סה״כ <bdi dir='ltr'>56,400 + 168,000 = 224,400</bdi> ₪ (חיסכון של 33% לעומת 336,000). גם הטיפול המונע משבית את הייצור — יש לכלול את עלות ההשבתה (176,400 אם שוכחים). (מצגת 7, שקפים 34–35)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"בארגון מסוים, באחזקת שבר בלבד — 24 תקלות בשנה, 6 שעות השבתה לתקלה. עם אחזקה מונעת — 12 טיפולים של 2 שעות, ו-12 תקלות בשנה. כמה שעות השבתה בשנה יהיו עם האחזקה המונעת?",o:["144","96","72","168"],c:1,e:"טיפולים מונעים: <bdi dir='ltr'>12 · 2 = 24</bdi> שעות; תקלות: <bdi dir='ltr'>12 · 6 = 72</bdi> שעות ← סה״כ <bdi dir='ltr'>96</bdi> שעות, לעומת <bdi dir='ltr'>24 · 6 = 144</bdi> — שיפור של 33%. 72 — שכחת שעות הטיפולים המונעים. (מצגת 7, שקף 36: 102 מול 144, שיפור 29%)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"הצעה לאחזקה חזויה: מכשיר חיישנים ב-150,000 ₪ (פחת ל-10 שנים), אחזקת המכשיר 800 ₪ לחודש, המכשיר מתריע 8 פעמים בשנה ובכל התרעה מבצעים טיפול מונע (4,700 ₪), ותקלת שבר (14,000 ₪) מתרחשת אחת לרבעון. מהי עלות האחזקה השנתית?",o:["253,200 ₪","118,200 ₪","109,400 ₪","108,600 ₪"],c:1,e:"פחת: <bdi dir='ltr'>150,000 / 10 = 15,000</bdi>; אחזקת מכשיר: <bdi dir='ltr'>800 · 12 = 9,600</bdi>; טיפולים: <bdi dir='ltr'>8 · 4,700 = 37,600</bdi>; תקלות: <bdi dir='ltr'>4 · 14,000 = 56,000</bdi>.<br>סה״כ <bdi dir='ltr'>118,200</bdi> ₪. את מחיר המכשיר מפרסים לפי הפחת — לא כל הסכום בשנה אחת (253,200). (כמו שקפים 37–38: 126,200 ₪.) (מצגת 7, שקפים 37–39)",k:"calc"},
{t:"ניהול אחזקה ועלויות",s:"ניצן",q:"בדוגמת המצגת: אחזקת שבר בלבד — 171,600 ₪ ו-144 שעות השבתה בשנה; אחזקה חזויה — 126,200 ₪ ו-78 שעות. מהו אחוז השיפור בשעות ההשבתה?",o:["54.17%","26.46%","45.83%","84.62%"],c:2,e:"<bdi dir='ltr'>(144 − 78) / 144 = 66 / 144 = 45.83%</bdi> (בטבלה המסכמת: 46%).<br>26.46% — שיפור העלות <bdi dir='ltr'>(171,600 − 126,200)/171,600</bdi>; 54.17% — היחס 78/144; 84.62% — חלוקה בערך החדש במקום בערך הקיים. (מצגת 7, שקף 39)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"אמינות",s:"ניצן",q:"מהו המשתנה המקרי שנבדק בתחום האמינות?",o:["עלות התיקון של כל תקלה","מספר הרכיבים במערכת","מספר התקלות בכל שנה","הזמן העובר בין תקלות"],c:3,e:"שקף 2: אמינות היא מרכיב חשוב של איכות, והיא בוחנת את ביצועי המוצר לאורך זמן. המשתנה המקרי הנבדק הוא הזמן העובר בין תקלות; המטרה — להבין את דפוסי הכשל כדי לתכנן טוב יותר מערכות אחזקה. (מצגת 8, שקף 2)"},
{t:"אמינות",s:"ניצן",q:"מתי החלו להכיר באמינות כתחום נפרד מבקרת האיכות, ובעקבות מה?",o:["בשנות התשעים, עם כניסת המחשבים האישיים לארגונים","בשנות השמונים, עם התפשטות שיטת <bdi dir='ltr'>JIT</bdi> בתעשייה היפנית","בשנות החמישים, עקב בעיות אמינות ברכיבי מערכות צבאיות","בשנות העשרים, עקב תאונות בקווי ייצור של מכוניות"],c:2,e:"שקף 2: ״בשנות החמישים של המאה העשרים, החלו להכיר באמינות כתחום נפרד מן הזרם העיקרי של בקרת איכות, עקב בעיות אמינות ברכיבי מערכות צבאיות״. גם ממשלת ארה״ב דרשה מערכות נשק בדרגת אמינות מוגדרת כשעלויות התחזוקה הפכו לבלתי אפשריות (שקף 3). (מצגת 8, שקפים 2–3)"},
{t:"אמינות",s:"ניצן",q:"איזה מהבאים הוא סיכון של אמינות נמוכה מבחינת הצרכן (ולא מבחינת היצרן)?",o:["עלויות פיצויים על תוצאות של תכנון לקוי","בטיחות — כשל ציוד עלול לגרום לאובדן חיי אדם","עלויות שירות ואחריות שהיצרן נושא בהן","תחרות — מוצר לא אמין אינו זוכה לנאמנות ונעלם מהשוק"],c:1,e:"שקפים 3–4 (היצרן): תחרות (למשל שנות אחריות), דרישות לקוח, עלויות שירות ואחריות, עלויות פיצויים. שקף 5 (הצרכן): בטיחות (תאונות מכשלים מכניים), אי-נוחות (עיכובים בהמראות, כשל בתקשורת), עלויות. (מצגת 8, שקפים 3–5)"},
{t:"אמינות",s:"ניצן",q:"מה ההגדרה של פונקציית הכשל <bdi dir='ltr'>F(t)</bdi> ושל פונקציית האמינות <bdi dir='ltr'>R(t)</bdi>?",o:["<bdi dir='ltr'>F(t)</bdi> — צפיפות הכשל ברגע <bdi dir='ltr'>t</bdi>; <bdi dir='ltr'>R(t) = F(t) / t</bdi> — שיעור הכשל הממוצע עד <bdi dir='ltr'>t</bdi>","<bdi dir='ltr'>F(t)</bdi> — ההסתברות שהפריט לא ישרוד עד <bdi dir='ltr'>t</bdi>; <bdi dir='ltr'>R(t) = 1 − F(t)</bdi> — ההסתברות שישרוד עד <bdi dir='ltr'>t</bdi>","<bdi dir='ltr'>F(t)</bdi> — ההסתברות שהפריט ישרוד עד <bdi dir='ltr'>t</bdi>; <bdi dir='ltr'>R(t) = 1 − F(t)</bdi> — ההסתברות שלא ישרוד","<bdi dir='ltr'>F(t)</bdi> — מספר התקלות ליחידת זמן; <bdi dir='ltr'>R(t)</bdi> — הזמן הממוצע בין תקלות <bdi dir='ltr'>(MTBF)</bdi>"],c:1,e:"שקפים 8–9: <bdi dir='ltr'>T</bdi> — משתנה מקרי של אורך החיים; <bdi dir='ltr'>F(t) = P(T ≤ t)</bdi> — פונקציית הכשל (ההסתברות שהפריט לא ישרוד עד <bdi dir='ltr'>t</bdi>); <bdi dir='ltr'>R(t) = 1 − F(t) = P(T ≥ t)</bdi> — פונקציית ההישרדות. (מצגת 8, שקפים 8–9)"},
{t:"אמינות",s:"ניצן",q:"מה הקשר בין קצב (מופע) התקלות <bdi dir='ltr'>λ</bdi> ל-<bdi dir='ltr'>MTBF</bdi>, ומה משמעותו לאמינות?",o:["<bdi dir='ltr'>MTBF = 1 − λ</bdi>; שני המדדים בלתי תלויים, ואין להם קשר לאמינות","<bdi dir='ltr'>MTBF = 1/λ</bdi>; ככל ש-<bdi dir='ltr'>MTBF</bdi> גדול יותר, תדירות התקלות נמוכה והאמינות גבוהה","<bdi dir='ltr'>MTBF = λ</bdi>; ככל ש-<bdi dir='ltr'>MTBF</bdi> גדול יותר, תדירות התקלות גבוהה והאמינות נמוכה","<bdi dir='ltr'>MTBF = 1/λ</bdi>; ככל ש-<bdi dir='ltr'>MTBF</bdi> גדול יותר, האמינות נמוכה יותר, כי יש יותר זמן לתקלה"],c:1,e:"שקף 10: <bdi dir='ltr'>λ</bdi> — מספר תקלות ליחידת זמן; קשר הפוך: <bdi dir='ltr'>MTBF = 1/λ</bdi>. ״ככל שערך זה [<bdi dir='ltr'>MTBF</bdi>] גדול יותר האמינות גבוהה יותר — כיוון שתדירות התקלות יורדת״. (מצגת 8, שקף 10)"},
{t:"אמינות",s:"ניצן",q:"מה קורה לאמינות של רכיב ככל שמשך המשימה ארוך יותר?",o:["היא יורדת רק אחרי שעוברים את ה-<bdi dir='ltr'>MTBF</bdi> של הרכיב","היא קבועה, כי ה-<bdi dir='ltr'>MTBF</bdi> של הרכיב אינו משתנה","היא יורדת — ההסתברות לסיים את המשימה קטנה","היא עולה, כי הרכיב ״מתחמם״ ומתייצב עם הזמן"],c:2,e:"<bdi dir='ltr'>R(t) = e^(−t/MTBF)</bdi> יורדת עם <bdi dir='ltr'>t</bdi>. בדוגמת המנוע <bdi dir='ltr'>(MTBF = 200)</bdi>: <bdi dir='ltr'>R(10) = 0.951, R(20) = 0.905, R(50) = 0.788</bdi> — ״ככל שמשך המשימה ארוך יותר, כך האמינות יורדת״. (מצגת 8, שקף 12)"},
{t:"אמינות",s:"ניצן",q:"מה מאפיין מערכת טורית מבחינת אמינות?",o:["המערכת פועלת רק אם כל הרכיבים פועלים (״וגם״) — ולכן האמינות נמוכה מזו של הרכיב החלש","רכיב גיבוי נכנס לפעולה רק כשהראשי מושבת — ולכן האמינות היא סכום של הסתברויות","המערכת פועלת רק אם כל הרכיבים פועלים — ולכן האמינות היא ממוצע אמינויות הרכיבים","מספיק שרכיב אחד פועל (״או״) — ולכן האמינות גבוהה מזו של הרכיב הטוב ביותר במערכת"],c:0,e:"שקפים 13, 16: ההסתברות שהרכב יסיים משימה תלויה בכל הרכיבים בקשר של ״וגם״ — חיתוך, כלומר מכפלה. ״עיקרון חשוב מאוד הוא שהאמינות הכללית נמוכה מהערך הנמוך ביותר — צוואר הבקבוק, החוליה החלשה״. (מצגת 8, שקפים 13–16)"},
{t:"אמינות",s:"ניצן",q:"מה מאפיין מערכת מקבילית מבחינת אמינות?",o:["כל הרכיבים חייבים לפעול, ולכן הוספת רכיב מורידה את אמינות המערכת","הרכיב הנוסף פועל רק אחרי שהראשי מושבת, ולכן אין לו השפעה על האמינות","מספיק שרכיב אחד פועל, ולכן הוספת רכיב — גם פחות איכותי — מעלה את האמינות","האמינות שווה לאמינות הרכיב הטוב ביותר, ולכן אין טעם להוסיף רכיב חלש"],c:2,e:"שקף 17: ״כאן הוספת הרכיב הנוסף גורמת לעלייה באמינות כי מדובר במקרה של או/או ולא גם וגם... לעיתים גם אם מוסיפים רכיב פחות איכותי לזה הקיים, האמינות עולה באופן משמעותי״ — כמו מנוע נוסף במטוס. <bdi dir='ltr'>R = 1 − Π(1 − Ri)</bdi>. (מצגת 8, שקפים 17–20)"},
{t:"אמינות",s:"ניצן",q:"מה ההבדל בין חיבור מקבילי ״רגיל״ לחיבור <bdi dir='ltr'>Stand-By (S.B)</bdi>?",o:["ב-<bdi dir='ltr'>S.B</bdi> הרכיב המקבילי מתחיל לעבוד רק כשהרכיב הראשי מושבת","ב-<bdi dir='ltr'>S.B</bdi> מחליפים רכיב רק בטיפול מונע מתוכנן מראש","ב-<bdi dir='ltr'>S.B</bdi> הרכיבים מחוברים בטור, ולכן האמינות היא מכפלת אמינויותיהם","ב-<bdi dir='ltr'>S.B</bdi> כל הרכיבים פועלים יחד כל הזמן, בדיוק כמו בחיבור מקבילי רגיל"],c:0,e:"שקף 21: ״במקרה זה הרכיב המקבילי מתחיל לעבוד רק כאשר הרכיב הראשי מושבת״ (כמו גנרטור גיבוי). <bdi dir='ltr'>R_SB = Σ (λt)^i · e^(−λt) / i!</bdi>, <bdi dir='ltr'>i = 0</bdi> … <bdi dir='ltr'>n−1</bdi>. לרכיבים זהים, <bdi dir='ltr'>S.B</bdi> אמין יותר ממקביל פעיל — הגיבוי לא ״מתבלה״ בזמן ההמתנה. (מצגת 8, שקפים 21–23)"},
{t:"אמינות",s:"ניצן",q:"ברכב נתונות אמינויות לנסיעה של 10 שעות: מנוע 0.951, גיר 0.955, מערכת חשמל 0.905, משאבת מים 0.961, צמיגים 0.951. היכן כדאי להשקיע בשיפור האמינות?",o:["בכל הרכיבים באותה מידה, כי כולם מחוברים בטור","במשאבת המים — הרכיב האמין ביותר ברכב, כדי לשמר את יתרונו","במערכת החשמל — החוליה החלשה (צוואר הבקבוק)","במנוע — הרכיב היקר והמרכזי ביותר ברכב כולו"],c:2,e:"אמינות הרכב: <bdi dir='ltr'>0.951 · 0.955 · 0.905 · 0.961 · 0.951 = 0.751</bdi> — נמוכה מהרכיב החלש ביותר (0.905). שיפור החוליה החלשה משפר את המערכת יותר מכל השקעה אחרת — הקשר ל״צוואר בקבוק״, סוגיה מרכזית בתעשייה וניהול. (מצגת 8, שקפים 14–16)"},
{t:"אמינות",s:"ניצן",q:"ל-<bdi dir='ltr'>MTBF</bdi> של רכיב 250 שעות. מהי ההסתברות שיפעל 50 שעות ברציפות בלי תקלה?",o:["0.181","0.007","0.800","0.819"],c:3,e:"<bdi dir='ltr'>R(50) = e^(−50/250) = e^(−0.2) = 0.819</bdi>.<br>0.800 — קירוב ליניארי שגוי <bdi dir='ltr'>(1 − t/MTBF)</bdi>; 0.181 — ההסתברות לכשל <bdi dir='ltr'>F(t)</bdi>; 0.007 — היפוך השבר. (מצגת 8, שקפים 11–12)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"מהי ההסתברות שרכיב יפעל בלי תקלה לאורך זמן השווה ל-<bdi dir='ltr'>MTBF</bdi> שלו?",o:["0.368","0.500","0.135","0.632"],c:0,e:"<bdi dir='ltr'>R(MTBF) = e^(−MTBF/MTBF) = e^(−1) = 0.368</bdi> — רק כ-37%! ה-<bdi dir='ltr'>MTBF</bdi> הוא ממוצע, ורוב הרכיבים נכשלים לפניו. בשקף 12: ״מהי ההסתברות שהמנוע יגיע ל-<bdi dir='ltr'>MTBF</bdi> שלו? <bdi dir='ltr'>e^(−200/200) = 0.37</bdi>״. (מצגת 8, שקף 12)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"שלושה רכיבים מחוברים בטור, עם אמינויות 0.95, 0.90 ו-0.98. מהי אמינות המערכת?",o:["0.8379","0.9999","0.9433","0.9000"],c:0,e:"<bdi dir='ltr'>R = 0.95 · 0.90 · 0.98 = 0.8379</bdi> — נמוכה מהרכיב החלש (0.90).<br>0.9000 — הרכיב החלש; 0.9433 — ממוצע; 0.9999 — נוסחת מקביל. (מצגת 8, שקפים 13–15)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"שלושה רכיבים בטור עם <bdi dir='ltr'>MTBF</bdi> של 200, 400 ו-500 שעות. מהי אמינות המערכת למשימה של 20 שעות?",o:["0.9390","0.9048","0.8208","0.8270"],c:3,e:"<bdi dir='ltr'>R = e^(−20/200) · e^(−20/400) · e^(−20/500) = 0.9048 · 0.9512 · 0.9608 = 0.8270</bdi> (או <bdi dir='ltr'>e^(−20·(0.005 + 0.0025 + 0.002)) = e^(−0.19)</bdi>).<br>0.8208 — קירוב ליניארי; 0.9390 — ממוצע; 0.9048 — הרכיב החלש בלבד. (מצגת 8, שקפים 14–15)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"שני רכיבים מחוברים במקביל, עם אמינויות 0.9 ו-0.8. מהי אמינות המערכת?",o:["0.90","0.98","0.85","0.72"],c:1,e:"<bdi dir='ltr'>R = 1 − (1 − 0.9)(1 − 0.8) = 1 − 0.1 · 0.2 = 0.98</bdi> — גבוהה מהרכיב הטוב (0.9).<br>0.72 — נוסחת טור; 0.85 — ממוצע. (מצגת 8, שקפים 17–19)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"למטוס שני מנועים במקביל, עם <bdi dir='ltr'>MTBF</bdi> של 100 ו-80 שעות. מהי אמינות מערכת ההנעה לטיסה של 10 שעות?",o:["0.7985","0.9048","0.8937","0.9888"],c:3,e:"<bdi dir='ltr'>R1 = e^(−10/100) = 0.9048</bdi>, <bdi dir='ltr'>R2 = e^(−10/80) = 0.8825</bdi>.<br><bdi dir='ltr'>R = 1 − (1 − 0.9048)(1 − 0.8825) = 1 − 0.0952 · 0.1175 = 0.9888</bdi>.<br>0.7985 — נוסחת טור (שני המנועים נדרשים). (מצגת 8, שקפים 18–19. שימו לב: בשקף 19 יצא 0.994, אבל <bdi dir='ltr'>1 − 0.058·0.077 = 0.9955</bdi>.)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"אמינות מערכת למשימה של 20 שעות היא 0.8. מהו ה-<bdi dir='ltr'>MTBF</bdi> של המערכת, לפי הנוסחה שבמצגת?",o:["89.63","100.00","16.00","25.00"],c:0,e:"<bdi dir='ltr'>MTBF = t / ln(1/R) = 20 / ln(1/0.8) = 20 / 0.2231 = 89.63</bdi> שעות.<br>זו הנוסחה ההפוכה ל-<bdi dir='ltr'>R = e^(−t/MTBF)</bdi>. בשקף 16: <bdi dir='ltr'>10 / ln(1/0.751) = 35</bdi> שעות לרכב כולו. (מצגת 8, שקפים 16, 19–20, 22)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"שני רכיבים זהים בחיבור <bdi dir='ltr'>Stand-By</bdi>; האמינות של כל אחד למשימה היא 0.8. מהי אמינות המערכת?",o:["0.9600","0.8000","0.6400","0.9785"],c:3,e:"<bdi dir='ltr'>λt = ln(1/0.8) = 0.2231</bdi> (כי <bdi dir='ltr'>e^(−λt) = 0.8</bdi>), ו-<bdi dir='ltr'>n = 2</bdi> ← <bdi dir='ltr'>i = 0, 1</bdi>:<br><bdi dir='ltr'>R_SB = e^(−λt)·(1 + λt) = 0.8 · 1.2231 = 0.9785</bdi>.<br>במקביל פעיל: <bdi dir='ltr'>1 − 0.2² = 0.96</bdi> — ה-<bdi dir='ltr'>S.B</bdi> אמין יותר. 0.64 — נוסחת טור. (מצגת 8, שקפים 21–23)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"ארבעה רכיבים זהים בחיבור <bdi dir='ltr'>Stand-By</bdi>, האמינות של כל אחד ל-100 שעות היא 0.7 <bdi dir='ltr'>(λt = 0.357)</bdi>. מהי אמינות המערכת?",o:["0.2401","0.9995","0.9919","0.7000"],c:1,e:"<bdi dir='ltr'>R_SB = e^(−λt)·(1 + λt + (λt)²/2! + (λt)³/3!) = 0.7 · (1 + 0.357 + 0.0636 + 0.0076) = 0.9995</bdi>.<br>במקביל פעיל: <bdi dir='ltr'>1 − 0.3⁴ = 0.9919</bdi> — וזו התשובה לשאלה בשקף 23: <bdi dir='ltr'>S.B</bdi> אמין יותר. (בשקף 23 כתוב 0.9999 — סכום של איברים מעוגלים; בחישוב מדויק 0.9995.) (מצגת 8, שקפים 21–23)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"רכיב <bdi dir='ltr'>A</bdi> (אמינות 0.95) מחובר בטור לזוג רכיבים מקביליים <bdi dir='ltr'>B</bdi> ו-<bdi dir='ltr'>C</bdi> (אמינות 0.8 כל אחד). מהי אמינות המערכת?",o:["0.960","0.608","0.912","0.998"],c:2,e:"קודם מצמצמים את הזוג המקבילי: <bdi dir='ltr'>R_BC = 1 − 0.2 · 0.2 = 0.96</bdi>; אחר כך בטור עם <bdi dir='ltr'>A</bdi>: <bdi dir='ltr'>R = 0.95 · 0.96 = 0.912</bdi>.<br>0.608 — הכל בטור; 0.960 — רק הזוג; 0.998 — הכל במקביל. כך פותרים גם את ״המערכת המשולבת״ בשיעורי הבית (שקף 24). (מצגת 8, שקפים 13–24)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"הצבא האמריקאי רכש 1,000 קבלים זהים ורשם את הכשלים (110 קבלים שרדו יותר מ-10 שנים):<br><table><tr><th>שנים</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><th>כשלים</th><td>220</td><td>158</td><td>121</td><td>96</td><td>80</td><td>68</td><td>47</td><td>40</td><td>35</td><td>25</td></tr><tr><th>מצטבר %</th><td>22</td><td>37.8</td><td>49.9</td><td>59.5</td><td>67.5</td><td>74.3</td><td>79</td><td>83</td><td>86.5</td><td>89</td></tr></table>מהי ההסתברות שקבל שנבחר אקראית יחיה יותר מחמש שנים?",o:["32.5%","67.5%","8.0%","40.5%"],c:0,e:"השיעור המצטבר הוא אומדן של <bdi dir='ltr'>F(t)</bdi>. <bdi dir='ltr'>P(T > 5) = R(5) = 1 − F(5) = 1 − 0.675 = 0.325</bdi>.<br>67.5% — <bdi dir='ltr'>F(5)</bdi>, ההסתברות לכשל עד 5 שנים; 40.5% — <bdi dir='ltr'>1 − F(4)</bdi>; 8% — הכשלים בשנה החמישית בלבד. (מצגת 8, שקפים 6–7)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"בנתוני 1,000 הקבלים (מצטבר כשלים: 5 שנים — 67.5%, 6 שנים — 74.3%), מה האחוז מבין הקבלים שנכשלו בתוך שש השנים הראשונות, שחיו לפחות חמש שנים?",o:["6.80%","74.30%","90.85%","9.15%"],c:3,e:"זו הסתברות מותנית: מבין 743 שנכשלו עד שנה 6, רק 68 נכשלו בשנה השישית (כלומר חיו 5 שנים לפחות):<br><bdi dir='ltr'>(0.743 − 0.675) / 0.743 = 0.068 / 0.743 = 9.15%</bdi>.<br>6.80% — מתוך כל 1,000 הקבלים ולא מתוך אלה שנכשלו. (מצגת 8, שקף 7, סעיף 3)",k:"calc"},
{t:"אמינות",s:"ניצן",q:"בנתוני 1,000 הקבלים (מצטבר כשלים: 8 שנים — 83%, 9 שנים — 86.5%), מה האחוז שיחיו לפחות שמונה שנים וייכשלו בשנה התשיעית?",o:["13.5%","3.5%","86.5%","17.0%"],c:1,e:"<bdi dir='ltr'>F(9) − F(8) = 0.865 − 0.830 = 0.035 = 3.5%</bdi> — 35 קבלים מתוך 1,000.<br>13.5% — שרדו יותר מ-9 שנים; 17% — שרדו יותר מ-8 שנים. (מצגת 8, שקף 7, סעיף 4)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"מדוע קיימת תדירות אופטימלית לביצוע אחזקה מונעת (במודל מינימום זמן השבתה)?",o:["מעט טיפולים מגדילים את אירועי השבר, והרבה טיפולים יוצרים השבתה בגלל הטיפולים עצמם","כי יותר טיפולים תמיד מקטינים את ההשבתה, ולכן התדירות המרבית היא האופטימלית","כי כל טיפול מונע מבטל לגמרי את אירועי השבר עד הטיפול הבא, ולכן מספיק טיפול אחד","כי אירועי השבר אינם תלויים במספר הטיפולים, ולכן כל תדירות נותנת אותה השבתה"],c:0,e:"מצגת 9, שקף 2: ביצוע תיקוני שבר וטיפולים מונעים יוצרים השבתה. כשמבצעים מעט מדי טיפולים מונעים — תדירות אירועי השבר עולה; כשמבצעים יותר מדי — נוצרת השבתה בגין הטיפולים. האופטימום מאזן בין השניים. (מצגת 9, שקף 2)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"במודל זמן ההשבתה, מה מייצגים <bdi dir='ltr'>1/Ф</bdi> ו-<bdi dir='ltr'>1/μ</bdi>?",o:["<bdi dir='ltr'>1/Ф</bdi> — הזמן בין שתי תקלות <bdi dir='ltr'>(MTBF)</bdi>; <bdi dir='ltr'>1/μ</bdi> — זמינות הציוד","<bdi dir='ltr'>1/Ф</bdi> — משך טיפול מונע אחד; <bdi dir='ltr'>1/μ</bdi> — משך תיקון שבר אחד","<bdi dir='ltr'>1/Ф</bdi> — מספר הטיפולים המונעים בחודש; <bdi dir='ltr'>1/μ</bdi> — מספר התקלות בחודש","<bdi dir='ltr'>1/Ф</bdi> — משך תיקון שבר אחד; <bdi dir='ltr'>1/μ</bdi> — משך טיפול מונע אחד"],c:1,e:"<bdi dir='ltr'>Ф</bdi> — קצב טיפולים מונעים אפשרי (כמה טיפולים אפשר לבצע ביחידת זמן), ולכן <bdi dir='ltr'>1/Ф</bdi> — זמן ביצוע אחזקה מונעת אחת. <bdi dir='ltr'>μ</bdi> — קצב התיקון האפשרי של תקלות שבר, ולכן <bdi dir='ltr'>1/μ</bdi> — זמן ביצוע טיפול שבר אחד. (מצגת 9, שקפים 4–5)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"איזה צמד נוסחאות לזמני ההשבתה נכון במודל?",o:["<bdi dir='ltr'>DTR = n/μ</bdi> ; <bdi dir='ltr'>DTI = λ(n)/Ф</bdi>","<bdi dir='ltr'>DTR = λ(n)·μ</bdi> ; <bdi dir='ltr'>DTI = n·Ф</bdi>","<bdi dir='ltr'>DTR = μ/λ(n)</bdi> ; <bdi dir='ltr'>DTI = Ф/n</bdi>","<bdi dir='ltr'>DTR = λ(n)/μ</bdi> ; <bdi dir='ltr'>DTI = n/Ф</bdi>"],c:3,e:"זמן השבתה בגין שבר = מספר אירועי השבר כפול משך תיקון: <bdi dir='ltr'>DTR = λ(n) · 1/μ</bdi>; בגין טיפולים מונעים = מספר הטיפולים כפול משך טיפול: <bdi dir='ltr'>DTI = n · 1/Ф</bdi>. <bdi dir='ltr'>TDT = λ(n)/μ + n/Ф</bdi>. (מצגת 9, שקפים 3–5)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"מהו תנאי האופטימום (מינימום <bdi dir='ltr'>TDT</bdi>) שמתקבל מגזירת פונקציית זמן ההשבתה לפי <bdi dir='ltr'>n</bdi>?",o:["<bdi dir='ltr'>λ(n) = μ/Ф</bdi>","<bdi dir='ltr'>dλ(n)/dn = −μ/Ф</bdi>","<bdi dir='ltr'>dλ(n)/dn = 0</bdi>","<bdi dir='ltr'>dλ(n)/dn = −Ф/μ</bdi>"],c:1,e:"גוזרים את <bdi dir='ltr'>TDT = λ(n)/μ + n/Ф</bdi> לפי <bdi dir='ltr'>n</bdi> ומשווים לאפס: <bdi dir='ltr'>(1/μ)·dλ/dn + 1/Ф = 0</bdi> ← <bdi dir='ltr'>dλ/dn = −μ/Ф</bdi>. ״כל פונקציית אירועי שבר שנגזור ונשווה לערך הימני — יתקיים הפתרון האופטימלי״. (מצגת 9, שקף 6)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"בפונקציית אירועי השבר <bdi dir='ltr'>λ(n) = f·e^(−n)</bdi>, מה מייצג <bdi dir='ltr'>f</bdi>?",o:["את משך התיקון של תקלת שבר אחת, בשעות","את קצב הטיפולים המונעים האפשרי בחודש","את מספר אירועי השבר כשלא מבצעים טיפולים מונעים כלל","את מספר הטיפולים המונעים האופטימלי שיש לבצע בכל חודש"],c:2,e:"כש-<bdi dir='ltr'>n = 0</bdi> מתקבל <bdi dir='ltr'>λ(0) = f·e⁰ = f</bdi> — ״<bdi dir='ltr'>f</bdi> הוא מספר אירועי השבר שמתרחשים כאשר אין כלל טיפולים מונעים״. במצגת 9, דוגמה 2: ״בחודש שבו נמנעו מלבצע טיפולים מונעים התרחשו 4 אירועי שבר״ ← <bdi dir='ltr'>f = 4</bdi>. (מצגת 9, שקפים 7, 11)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"מה ההבדל בין <bdi dir='ltr'>λ(n)</bdi> ל-<bdi dir='ltr'>μ</bdi>, ובין <bdi dir='ltr'>n</bdi> ל-<bdi dir='ltr'>Ф</bdi>?",o:["<bdi dir='ltr'>λ(n)</bdi> ו-<bdi dir='ltr'>n</bdi> הם מה שקורה בפועל (תקלות וטיפולים); <bdi dir='ltr'>μ</bdi> ו-<bdi dir='ltr'>Ф</bdi> הם הקצב האפשרי","אין הבדל — אלה שני סימונים שונים לאותם גדלים, במצגות 9 ו-10","<bdi dir='ltr'>λ(n)</bdi> ו-<bdi dir='ltr'>μ</bdi> הם עלויות בשקלים; <bdi dir='ltr'>n</bdi> ו-<bdi dir='ltr'>Ф</bdi> הם זמנים בשעות עבודה","<bdi dir='ltr'>λ(n)</bdi> ו-<bdi dir='ltr'>n</bdi> הם הקצב האפשרי; <bdi dir='ltr'>μ</bdi> ו-<bdi dir='ltr'>Ф</bdi> הם מה שקורה בפועל (תקלות וטיפולים)"],c:0,e:"<bdi dir='ltr'>λ(n)</bdi> — מספר אירועי השבר בפועל ליחידת זמן (תלוי ב-<bdi dir='ltr'>n</bdi>); <bdi dir='ltr'>μ</bdi> — כמה תיקונים אפשר לבצע ליחידת זמן (1 חלקי משך תיקון). <bdi dir='ltr'>n</bdi> — מספר הטיפולים המונעים שמחליטים לבצע (משתנה ההחלטה); <bdi dir='ltr'>Ф</bdi> — כמה טיפולים אפשר לבצע ליחידת זמן. זו ״ההבהרה״ בשקף 4 של מצגת 10. (מצגות 9–10)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"במודל מקסימום הרווח, מהו <bdi dir='ltr'>P</bdi>?",o:["הרווח בפועל אחרי ניכוי הפסדי הייצור ועלויות האחזקה","עלות ממוצעת של ביקורת (טיפול מונע) ליחידת זמן","ההסתברות להשלים את החודש בלי תקלת שבר","הרווח בתנאים אידיאליים, בלי השבתה כלל (תפוקה מלאה)"],c:3,e:"מצגת 10, שקף 3: <bdi dir='ltr'>P</bdi> — ״הרווח שהארגון משיג בתנאים אידיאליים כשאין כלל זמן השבתה — הארגון עובד בתפוקה מלאה״. הרווח בפועל: <bdi dir='ltr'>PR = P − PLi − PLr − IC − IR</bdi> (הפסדי ייצור בגלל ביקורות ובגלל תיקונים, ועלויות הביקורות והתיקונים). (מצגת 10, שקפים 3–5)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"במודל מקסימום הרווח, מה מייצג האיבר <bdi dir='ltr'>P·n/Ф</bdi>?",o:["הפסד הייצור בגלל תקלות השבר שלא נמנעו על ידי הטיפולים","עלות החומרים והחלפים שנצרכים בכל אחד מהטיפולים המונעים","הפסד הייצור בגלל הזמן שבו המערכת מושבתת לטיפולים מונעים","עלות כוח האדם בתיקון תקלות השבר"],c:2,e:"<bdi dir='ltr'>n/Ф</bdi> הוא חלק הזמן שבו המערכת מושבתת לביקורות (<bdi dir='ltr'>n</bdi> טיפולים כפול משך טיפול <bdi dir='ltr'>1/Ф</bdi>), ובזמן הזה ״מפסידים״ את הרווח <bdi dir='ltr'>P</bdi>: <bdi dir='ltr'>PLi = P·n/Ф</bdi>. עלות ביצוע הביקורות עצמן היא <bdi dir='ltr'>IC = Ci·n/Ф</bdi>; ההפסד בגלל תיקונים — <bdi dir='ltr'>PLr = P·λ(n)/μ</bdi>. (מצגת 10, שקפים 5–6)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"מה יקרה ל-<bdi dir='ltr'>n*</bdi> (מינימום השבתה) אם זמן תיקון תקלת שבר יתקצר?",o:["<bdi dir='ltr'>n*</bdi> יקטן — כשתיקון מהיר, התקלות ״זולות״ יותר בזמן השבתה","<bdi dir='ltr'>n*</bdi> לא ישתנה — הוא תלוי רק במספר התקלות <bdi dir='ltr'>f</bdi>","<bdi dir='ltr'>n*</bdi> יגדל — כשתיקון מהיר, כדאי לבצע יותר טיפולים מונעים","<bdi dir='ltr'>n*</bdi> יתאפס — כבר לא יהיה צורך בטיפולים מונעים כלל"],c:0,e:"תיקון מהיר ← <bdi dir='ltr'>μ</bdi> גדל ← <bdi dir='ltr'>n* = ln(f·Ф/μ)</bdi> קטן. הסבר לוגיסטי: כל תקלה משביתה פחות זמן, ולכן פחות משתלם ״לשלם״ השבתה על טיפולים מונעים. באופן דומה: <bdi dir='ltr'>n*</bdi> גדל כש-<bdi dir='ltr'>f</bdi> גדל (יותר תקלות בלי טיפול) או כש-<bdi dir='ltr'>Ф</bdi> גדל (טיפול מונע מהיר). (מצגת 9, שקף 10 — ניתוח רגישות)"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"משך טיפול מונע 3 שעות, משך תיקון תקלת שבר 12 שעות, ובחודש 200 שעות עבודה. מהם קצב הטיפולים המונעים האפשרי <bdi dir='ltr'>Ф</bdi> וקצב התיקונים האפשרי <bdi dir='ltr'>μ</bdi> לחודש?",o:["<bdi dir='ltr'>Ф = 0.015</bdi> ; <bdi dir='ltr'>μ = 0.06</bdi>","<bdi dir='ltr'>Ф = 3</bdi> ; <bdi dir='ltr'>μ = 12</bdi>","<bdi dir='ltr'>Ф = 66.67</bdi> ; <bdi dir='ltr'>μ = 16.67</bdi>","<bdi dir='ltr'>Ф = 16.67</bdi> ; <bdi dir='ltr'>μ = 66.67</bdi>"],c:2,e:"<bdi dir='ltr'>Ф = 200 / 3 = 66.67</bdi> טיפולים מונעים אפשריים בחודש; <bdi dir='ltr'>μ = 200 / 12 = 16.67</bdi> תיקונים אפשריים בחודש. 3 ו-12 הם המשכים (<bdi dir='ltr'>1/Ф</bdi> ו-<bdi dir='ltr'>1/μ</bdi> בשעות), לא הקצבים. (מצגת 9, שקפים 11–12: 67 ו-16.7)",k:"calc"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"משך טיפול מונע 4 שעות, משך תיקון שבר 10 שעות, 200 שעות עבודה בחודש, ובחודש בלי טיפולים מונעים מתרחשות 5 תקלות. מהו מספר הטיפולים המונעים האופטימלי בחודש (מינימום השבתה)?",o:["12.50","2.53","0.69","0.92"],c:1,e:"<bdi dir='ltr'>Ф = 200/4 = 50</bdi>, <bdi dir='ltr'>μ = 200/10 = 20</bdi>, <bdi dir='ltr'>f = 5</bdi>.<br><bdi dir='ltr'>n* = ln(f·Ф/μ) = ln(5·50/20) = ln(12.5) = 2.53</bdi>.<br>0.69 — היפוך <bdi dir='ltr'>Ф</bdi> ו-<bdi dir='ltr'>μ</bdi>; 12.50 — בלי <bdi dir='ltr'>ln</bdi>; 0.92 — שכחת <bdi dir='ltr'>f</bdi>. (מצגת 9, שקפים 9–12)",k:"calc"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"נתון קצב ביקורות (טיפולים מונעים) אפשרי של 300 בחודש, קצב טיפולי שבר אפשרי של 30 בחודש, ו-<bdi dir='ltr'>f = 3</bdi>. מהו <bdi dir='ltr'>n*</bdi>?",o:["3.40","30.00","2.30","4.61"],c:0,e:"<bdi dir='ltr'>n* = ln(f·Ф/μ) = ln(3·300/30) = ln(30) = 3.40</bdi>.<br>שימו לב: בשקף 10 של מצגת 9 מופיעה התוצאה 4.6 — זו טעות חישוב: 4.6 הוא <bdi dir='ltr'>ln(100)</bdi>, ולא מתאים לנתוני הדוגמה. 2.30 — שכחת <bdi dir='ltr'>f</bdi> <bdi dir='ltr'>(ln 10)</bdi>; 30 — בלי <bdi dir='ltr'>ln</bdi>. (מצגת 9, שקפים 9–10)",k:"calc"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"משך תיקון שבר 12 שעות, משך טיפול מונע 3 שעות, 200 שעות עבודה בחודש, ובחודש בלי טיפולים מונעים התרחשו 4 תקלות <bdi dir='ltr'>(n* = 2.77)</bdi>. מהו זמן ההשבתה הכולל בחודש (בשעות) בנקודה האופטימלית?",o:["8.32","48.00","3.00","11.32"],c:3,e:"<bdi dir='ltr'>n* = ln(4·66.67/16.67) = ln(16) = 2.77</bdi>; <bdi dir='ltr'>λ(n*) = 4·e^(−2.77) = 0.25</bdi> תקלות בחודש.<br>השבתה בגין שבר: <bdi dir='ltr'>0.25 · 12 = 3</bdi> שעות; בגין טיפולים: <bdi dir='ltr'>2.77 · 3 = 8.32</bdi> שעות ← <bdi dir='ltr'>TDT = 11.32</bdi> שעות בחודש, לעומת <bdi dir='ltr'>4 · 12 = 48</bdi> שעות בלי טיפולים מונעים. (מצגת 9, שקפים 11–13)",k:"calc"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"מודל מקסימום רווח: <bdi dir='ltr'>P = 5,000</bdi> $ לחודש, <bdi dir='ltr'>f = 3</bdi>, קצב טיפולים מונעים אפשרי <bdi dir='ltr'>Ф = 80</bdi> בחודש, קצב תיקונים אפשרי <bdi dir='ltr'>μ = 20</bdi> בחודש, <bdi dir='ltr'>Ci = 1,000 $</bdi>, <bdi dir='ltr'>Cr = 5,000 $</bdi>. מהו <bdi dir='ltr'>n*</bdi>?",o:["2.48","3.00","1.97","20.00"],c:1,e:"<bdi dir='ltr'>n* = ln(f·Ф·(P + Cr) / (μ·(P + Ci))) = ln(3·80·10,000 / (20·6,000)) = ln(20) = 3.00</bdi>.<br>2.48 — נוסחת מינימום ההשבתה, בלי העלויות <bdi dir='ltr'>(ln 12)</bdi>; 1.97 — <bdi dir='ltr'>Ci</bdi> ו-<bdi dir='ltr'>Cr</bdi> הפוכים; 20.00 — בלי <bdi dir='ltr'>ln</bdi>. כשעלות התיקון <bdi dir='ltr'>Cr</bdi> גבוהה, כדאי לבצע יותר טיפולים מונעים. (מצגת 10, שקפים 8–12)",k:"calc"},
{t:"תדירות אחזקה מונעת",s:"ניצן",q:"בדוגמה ממצגת 10: <bdi dir='ltr'>P = 10,000</bdi> $, <bdi dir='ltr'>f = 2, Ф = 100, μ = 25</bdi>, <bdi dir='ltr'>Ci = 75 $</bdi>, <bdi dir='ltr'>Cr = 400 $</bdi>, ו-<bdi dir='ltr'>n* = 2.11</bdi>. מהו הרווח בנקודה האופטימלית?",o:["8,955.30 $","9,168.00 $","9,686.55 $","9,692.01 $"],c:2,e:"<bdi dir='ltr'>λ(n*) = 2·e^(−2.11) = 0.242</bdi>.<br><bdi dir='ltr'>PR = 10,000 − 10,000·2.11/100 − 10,000·0.242/25 − 75·2.11/100 − 400·0.242/25</bdi><br><bdi dir='ltr'>= 10,000 − 211.12 − 96.88 − 1.58 − 3.88 ≈ 9,686.55</bdi> $ (בשקף: 9,686).<br>9,692.01 — בלי עלויות הביקורת והתיקון; 9,168.00 — בלי טיפולים מונעים כלל <bdi dir='ltr'>(n = 0)</bdi> — כלומר האחזקה המונעת מוסיפה כ-519 $ בחודש. (מצגת 10, שקפים 11–12)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"נקודת איזון וחלופות",s:"ניצן",q:"באילו שני מקרים משתמשים במודל שיווי המשקל הכלכלי, לפי המצגת?",o:["קביעת מלאי ביטחון לפריט, וקביעת נקודת ההזמנה שלו במחסן המרכזי","קביעת תדירות אחזקה מונעת, וחישוב הזמינות של הציוד","חיזוי ביקוש עונתי, וחישוב מקדמי העונתיות של כל אחת מהעונות","נקודת איזון בין הכנסות להוצאות, ושיווי משקל בין חלופות השקעה"],c:3,e:"שקף 2: (1) נקודת איזון בין הכנסות והוצאות — מטפלים בפריט בודד; (2) שיווי משקל כלכלי בין השקעות שונות — ניתוח כדאיות. (מצגת 11, שקף 2)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"מהי נוסחת נקודת האיזון, בסימוני המצגת (<bdi dir='ltr'>F</bdi> — עלות קבועה, <bdi dir='ltr'>V</bdi> — עלות משתנה ליחידה, <bdi dir='ltr'>P</bdi> — מחיר)?",o:["<bdi dir='ltr'>Q* = P / (F − V)</bdi>","<bdi dir='ltr'>Q* = (F + V) / P</bdi>","<bdi dir='ltr'>Q* = F / (P + V)</bdi>","<bdi dir='ltr'>Q* = F / (P − V)</bdi>"],c:3,e:"בנקודת האיזון ההכנסות שוות להוצאות: <bdi dir='ltr'>P·Q = F + V·Q</bdi> ← <bdi dir='ltr'>Q·(P − V) = F</bdi> ← <bdi dir='ltr'>Q* = F / (P − V)</bdi>. <bdi dir='ltr'>P − V</bdi> הוא ״התרומה״ של כל יחידה לכיסוי העלות הקבועה. (מצגת 11, שקף 4)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"בדוגמת ״חטיף הזיתים״, הביקוש בפועל (3,800) גדול מנקודת האיזון (3,502). מה המשמעות?",o:["הביקוש משמאל לנקודת האיזון — באזור ההפסד","הביקוש בנקודת האיזון — בלי רווח ובלי הפסד","אי אפשר לדעת בלי לחשב את מקדם האחזקה","הביקוש מימין לנקודת האיזון — באזור הרווח"],c:3,e:"שקפים 8–10: <bdi dir='ltr'>Q* = 21,642 / (7 − 0.82) = 3,502</bdi>; הביקוש 3,800 ״מימין לנקודת האיזון, כלומר באזור הרווח״: <bdi dir='ltr'>Π(3,800) = 7·3,800 − 21,642 − 0.82·3,800 = 1,842 > 0</bdi>. (מצגת 11, שקפים 8–10)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"בניתוח הרגישות של ״חטיף הזיתים״, איזה שינוי הפך את הרווח להפסד, ומה המסקנה?",o:["אף שינוי לא יצר הפסד — המוצר נשאר רווחי בכל אחד מהתרחישים שנבדקו","עלייה של 5% בעלות הקבועה — יש להיזהר מהגדלת הוצאות קבועות; הורדת המחיר עדיין השאירה רווח","ירידה של 7% במחיר — יש להיזהר בהורדת מחירים; התייקרות קטנה בעלויות עדיין השאירה רווח","התייקרות חומרי הגלם ושכר העבודה — יש להחליף ספקים; שאר השינויים עדיין השאירו רווח"],c:2,e:"שקף 24: מצב קיים — רווח 1,842 <bdi dir='ltr'>(Q* = 3,502)</bdi>; מחיר −7% — הפסד 20 <bdi dir='ltr'>(Q* = 3,803)</bdi>; עלות קבועה +5% — רווח 760 <bdi dir='ltr'>(Q* = 3,677)</bdi>; התייקרות העלות המשתנה — רווח 1,648 <bdi dir='ltr'>(Q* = 3,531)</bdi>. ״הורדת מחיר המכירה אפילו במעט יוצרת הפסד, ולכן יש להיזהר עם הורדת מחירים״. (מצגת 11, שקפים 11–24)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"כיצד חושבה העלות הקבועה <bdi dir='ltr'>(F)</bdi> של ״חטיף הזיתים״ בדוגמה?",o:["בחלוקה שווה של כל ההוצאות הקבועות בין מוצרי המאפייה","לפי חלקו של המוצר במספר היחידות הכולל שהמאפייה מייצרת בשנה","לפי חלקו של המוצר בסך ההכנסות (2%) מתוך סך ההוצאות הקבועות","לפי שכר העבודה ליחידה כפול הביקוש השנתי למוצר"],c:2,e:"שקפים 6–7: ״שיעור ההכנסות מפריט חטיף זיתים מסך ההכנסות — 2%״, ולכן <bdi dir='ltr'>F = 0.02 · 1,082,120 = 21,642</bdi> ₪ (ארנונה, שכירות, חשמל, משכורות ופרסום). (מצגת 11, שקפים 6–7)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"שתי חלופות לרכישת מכונה: א׳ — השקעה גבוהה ועלות ייצור ליחידה נמוכה; ב׳ — השקעה נמוכה ועלות ייצור ליחידה גבוהה. מתי נעדיף את א׳?",o:["רק כשהביקוש השנתי (ולא הכולל) גדול מכמות שיווי המשקל","כשהכמות הנדרשת לאורך כל הפרויקט קטנה מכמות שיווי המשקל","תמיד — עלות ייצור נמוכה ליחידה עדיפה בכל כמות שהיא","כשהכמות הנדרשת לאורך כל הפרויקט גדולה מכמות שיווי המשקל"],c:3,e:"שקפים 25–27: מעל כמות שיווי המשקל, החיסכון בעלות המשתנה מכסה את ההשקעה הנוספת. בדוגמה: <bdi dir='ltr'>Q* = 150,000 / 7 = 21,429</bdi>, ולאורך 5 שנים נדרשות <bdi dir='ltr'>5 · 5,000 = 25,000</bdi> יחידות ← חלופה א׳. משווים לכמות הכוללת של הפרויקט, לא לשנה אחת. (מצגת 11, שקפים 25–27)"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"עלות קבועה שנתית למוצר 30,000 ₪, מחיר מכירה 12 ₪ ליחידה, ועלות משתנה 4.5 ₪ ליחידה. מהי נקודת האיזון?",o:["6,667","4,000","1,818","2,500"],c:1,e:"<bdi dir='ltr'>Q* = F / (P − V) = 30,000 / (12 − 4.5) = 30,000 / 7.5 = 4,000</bdi> יחידות.<br>2,500 — בלי העלות המשתנה; 6,667 — חלוקה ב-<bdi dir='ltr'>V</bdi>; 1,818 — חיבור <bdi dir='ltr'>P + V</bdi>. (מצגת 11, שקפים 4, 8)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"עלות קבועה 30,000 ₪, מחיר 12 ₪, עלות משתנה 4.5 ₪ ליחידה, והביקוש 4,500 יחידות. מהו הרווח?",o:["6,000 ₪","33,750 ₪","3,750 ₪","24,000 ₪"],c:2,e:"<bdi dir='ltr'>Π = 12·4,500 − 30,000 − 4.5·4,500 = 54,000 − 30,000 − 20,250 = 3,750</bdi> ₪.<br>בדיקה: 500 יחידות מעל נקודת האיזון (4,000), וכל אחת תורמת <bdi dir='ltr'>12 − 4.5 = 7.5</bdi> ← <bdi dir='ltr'>500 · 7.5 = 3,750</bdi>. 24,000 — בלי העלות המשתנה; 33,750 — בלי העלות הקבועה. (מצגת 11, שקף 10)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"סך ההוצאות הקבועות של מפעל 900,000 ₪ בשנה, והמוצר תורם 3% מסך ההכנסות. מחיר המוצר 10 ₪ ועלותו המשתנה 1 ₪ ליחידה. מהי נקודת האיזון של המוצר?",o:["3,000","27,000","2,700","100,000"],c:0,e:"עלות קבועה מיוחסת לפי חלק ההכנסות: <bdi dir='ltr'>F = 0.03 · 900,000 = 27,000</bdi> ← <bdi dir='ltr'>Q* = 27,000 / (10 − 1) = 3,000</bdi> יחידות.<br>100,000 — ייחוס כל ההוצאות הקבועות למוצר; 2,700 — בלי העלות המשתנה. (מצגת 11, שקפים 6–8)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"עלות קבועה 30,000 ₪, עלות משתנה 4.5 ₪ ליחידה, ביקוש 4,500 יחידות. המחיר יורד ב-10% — מ-12 ₪ ל-10.8 ₪. מהו הרווח החדש?",o:["רווח של 3,375 ₪","הפסד של 1,650 ₪","הפסד של 5,400 ₪","רווח של 1,650 ₪"],c:1,e:"<bdi dir='ltr'>Π = 10.8·4,500 − 30,000 − 4.5·4,500 = 48,600 − 50,250 = −1,650</bdi> ₪ — הפסד.<br>נקודת האיזון עולה ל-<bdi dir='ltr'>30,000 / (10.8 − 4.5) = 4,762</bdi>, מעל הביקוש. ירידה של 10% במחיר ״אוכלת״ 5,400 ₪ מההכנסות — יותר מכל הרווח (3,750). כמו בשקף 24: הורדת מחיר קטנה הופכת רווח להפסד. (מצגת 11, שקפים 11–15, 24)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"עלות חומרי הגלם למוצר 3 ₪ ליחידה ועלות שכר העבודה 1.5 ₪ ליחידה. חומרי הגלם התייקרו ב-10% ושכר העבודה ב-4%. מהי העלות המשתנה החדשה ליחידה?",o:["4.86 ₪","4.80 ₪","4.82 ₪","5.13 ₪"],c:0,e:"<bdi dir='ltr'>V = 3·1.10 + 1.5·1.04 = 3.30 + 1.56 = 4.86</bdi> ₪.<br>כל רכיב מתייקר באחוז שלו (כמו שקף 20: <bdi dir='ltr'>0.32·1.08 + 0.5·1.05 = 0.871</bdi>). 5.13 — חיבור האחוזים (14%) על כל העלות; 4.82 — ממוצע האחוזים (7%). (מצגת 11, שקף 20)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"חלופה א׳: מכונה ב-800,000 ₪ ועלות ייצור 20 ₪ ליחידה. חלופה ב׳: מכונה ב-500,000 ₪ ועלות ייצור 30 ₪ ליחידה. מהי כמות שיווי המשקל בין החלופות?",o:["15,000","30,000","10,000","26,000"],c:1,e:"<bdi dir='ltr'>800,000 + 20·Q = 500,000 + 30·Q</bdi> ← <bdi dir='ltr'>300,000 = 10·Q</bdi> ← <bdi dir='ltr'>Q* = 30,000</bdi> יחידות.<br>(בשקף 26: <bdi dir='ltr'>600,000 + 25·Q = 450,000 + 32·Q</bdi> ← <bdi dir='ltr'>Q* = 150,000/7 = 21,429</bdi>.) (מצגת 11, שקפים 25–26)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"חלופה א׳: 800,000 ₪ ו-20 ₪ ליחידה; חלופה ב׳: 500,000 ₪ ו-30 ₪ ליחידה (שיווי משקל ב-30,000 יחידות). הפרויקט נמשך 4 שנים, עם ביקוש של 6,000 יחידות בשנה. איזו חלופה תיבחר?",o:["חלופה ב׳ — הכמות הנדרשת (24,000) קטנה מכמות שיווי המשקל","חלופה א׳ — הכמות הנדרשת (24,000) גדולה מכמות שיווי המשקל","חלופה א׳ — עלות הייצור שלה ליחידה נמוכה, ולכן היא עדיפה תמיד","חלופה ב׳ — ההשקעה שלה נמוכה, ולכן היא עדיפה בכל כמות"],c:0,e:"סך הכמות בפרויקט: <bdi dir='ltr'>4 · 6,000 = 24,000</bdi> < 30,000 ← משמאל לשיווי המשקל, שם החלופה עם ההשקעה הנמוכה זולה יותר.<br>בדיקה: <bdi dir='ltr'>A = 800,000 + 20·24,000 = 1,280,000</bdi>; <bdi dir='ltr'>B = 500,000 + 30·24,000 = 1,220,000</bdi>. (בשקף 27 המצב הפוך: 25,000 > 21,429 ← חלופה א׳.) (מצגת 11, שקפים 25–27)",k:"calc"},
{t:"נקודת איזון וחלופות",s:"ניצן",q:"בפרויקט של 24,000 יחידות — חלופה א׳ (800,000 ₪ ו-20 ₪ ליחידה) מול חלופה ב׳ (500,000 ₪ ו-30 ₪ ליחידה) — בכמה זולה החלופה הזולה יותר?",o:["240,000 ₪","300,000 ₪","60,000 ₪","15,000 ₪"],c:2,e:"<bdi dir='ltr'>A = 800,000 + 20·24,000 = 1,280,000</bdi>; <bdi dir='ltr'>B = 500,000 + 30·24,000 = 1,220,000</bdi> ← חלופה ב׳ זולה ב-<bdi dir='ltr'>60,000</bdi> ₪.<br>300,000 — רק הפרש ההשקעות; 240,000 — רק הפרש העלויות המשתנות; שניהם יחד: <bdi dir='ltr'>300,000 − 240,000 = 60,000</bdi>. (מצגת 11, שקפים 25–27)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בהרצאה (21.7) הבחין המרצה בין מודלים סיבתיים לבין מודלים של סדרות זמן. מהו מודל סיבתי?",o:["מודל של שני משתנים — אחד הוא הסיבה לשני (משקעים ← מטריות)","מודל שחוזה את התקופה הבאה לפי מה שהיה בתקופה האחרונה, בלי חישוב נוסף","מודל שבו מומחים משפיעים זה על זה בסבבים עד שמגיעים להסכמה על התחזית","מודל שבו המשתנה המסביר הוא תמיד מספר התקופה, ומחפשים את המגמה לאורך הזמן"],c:0,e:"מודל סיבתי: ״שני משתנים שמהווים סיבה ותוצאה״ — ככל שיורד יותר גשם נמכרות יותר מטריות; ככל שיש יותר דקות שידור של המונדיאל נמכרות יותר בירות. במודל של סדרת זמן המשתנה המסביר הוא הזמן (מספר התקופה), כמו בדוגמת הגיוס. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בדוגמת המטריות, על איזה ציר מציבים את כמות המשקעים, ומדוע?",o:["על ציר <bdi dir='ltr'>X</bdi> — זה המשתנה המסביר; המכירות הן המוסבר <bdi dir='ltr'>(Y)</bdi>","אין חשיבות לציר — החלפת הצירים לא משנה את קו הרגרסיה","על ציר <bdi dir='ltr'>Y</bdi> — המשקעים הם התוצאה שאותה רוצים לחזות בעזרת המכירות","על ציר <bdi dir='ltr'>X</bdi> — כי בכל רגרסיה ציר <bdi dir='ltr'>X</bdi> הוא תמיד ציר הזמן"],c:0,e:"״זה תמיד יהיה בציר ה-<bdi dir='ltr'>X</bdi>, כי ציר ה-<bdi dir='ltr'>X</bdi> הוא ציר המשתנה המסביר... ציר ה-<bdi dir='ltr'>Y</bdi> זה המשתנה התלוי שהוא מוסבר״. החלפת הצירים דווקא משנה את הקו — רגרסיה של <bdi dir='ltr'>X</bdi> על <bdi dir='ltr'>Y</bdi> אינה רגרסיה של <bdi dir='ltr'>Y</bdi> על <bdi dir='ltr'>X</bdi>. בחיזוי מציבים את מה שרוצים לחזות על <bdi dir='ltr'>Y</bdi>. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"מדוע, לפי ההרצאה, הצלחה של סטודנט בתואר אינה ניתנת לחיזוי טוב ברגרסיה על ציוני הבגרות בלבד?",o:["כי אין שום קשר בין ציוני הבגרות לבין ההצלחה בלימודים באוניברסיטה","כי ציוני בגרות הם נתון איכותי שאי אפשר להציב ברגרסיה","כי ההצלחה מוסברת בכמה משתנים — ולכן נדרשת רגרסיה רבת משתנים","כי רגרסיה ליניארית מתאימה רק לנתונים שנאספו לאורך זמן"],c:2,e:"״בפועל, המשתנים שמסבירים הצלחה של סטודנט הם לא רק ציוני בגרות... יש עוד דברים אחרים — היכולת שלו להתמיד... לכן יש מושג שנקרא רגרסיה רבת משתנים״. המרצה גם הזהיר: כל טענה על קשר ״צריך להוכיח כמותית, במספרים״. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"מה מייצג השיפוע <bdi dir='ltr'>b</bdi> במשוואת הקו <bdi dir='ltr'>Y = bX + a</bdi>, ומדוע הוא חשוב לתכנון לפי ההרצאה?",o:["את נקודת החיתוך עם ציר <bdi dir='ltr'>Y</bdi> — הביקוש כשאין מגמה, ולכן הוא קובע את מלאי הביטחון","את קצב הגידול — שיפוע תלול מחייב היערכות גדולה יותר","את הביקוש הממוצע בכל התקופות — ולכן משמש לתכנון הקיבולת לטווח הארוך","את מקדם המתאם — ככל שהוא קרוב ל-1, התחזית מדויקת יותר ואין צורך בהיערכות"],c:1,e:"״ה-<bdi dir='ltr'>B</bdi> זה השיפוע... קצב הגידול של הפונקציה; ה-<bdi dir='ltr'>A</bdi> זה נקודת החיתוך עם ציר ה-<bdi dir='ltr'>Y</bdi>״. ״השיפוע הוא חשוב מאוד לחיזוי״: אם הגרף עולה מהר — אולי צריך לפתוח חנות נוספת; אם השיפוע קטן — עושים שעות נוספות ופותרים את הבעיה. בדוגמה <bdi dir='ltr'>Y = 4X + 20</bdi>: חותך 20 ועלייה של 4 בכל תקופה. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"לפי ההרצאה, מבין אינסוף הקווים שאפשר להעביר בין הנקודות, מהו הקו ״הטוב ביותר״ — קו הרגרסיה?",o:["הקו שעובר דרך הנקודה הראשונה ודרך הנקודה האחרונה בסדרת הנתונים","הקו המקביל לציר <bdi dir='ltr'>X</bdi>, שעובר בגובה הממוצע של כל הנקודות","הקו שעובר בדיוק דרך המספר הגדול ביותר של נקודות","הקו שמביא למינימום את סכום ריבועי המרחקים בין הנקודות לקו"],c:3,e:"״אפשר להעביר אינסוף קווים... אבל יש אחד שהוא הכי טוב מכולם — הרגרסיה... הוא מקיים מינימום סכום ריבועי המרחקים בין הנקודות לקו״. את החישוב לא עושים בניסוי וטעייה — הנוסחאות מובנות במחשבון (<bdi dir='ltr'>A, B</bdi> ו-<bdi dir='ltr'>R</bdi>). (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"מה אמר המרצה על תחזיות סובייקטיביות — ״תחושות בטן״ ואינטואיציה?",o:["שהן מתאימות רק למכולת השכונתית, ולא לארגונים גדולים עם נתוני עבר","שהן עדיפות תמיד על מודלים מתמטיים, ולכן המחשבון מיותר בחיזוי","שהן אינן אמינות, ולכן בארגון רציני יש להסתמך רק על מודלים מתמטיים","שהן חשובות כשהן של מי שחי את הענף, ושהן הולכות יחד עם הכמותיות"],c:3,e:"״אני מחזיק מאוד מאוד בתחזיות... הסובייקטיביות, תחושות בטן ואינטואיציות — לא של מישהו שנראה לו, אלא של מישהו שחי את הענף״, במיוחד אנשי מכירות הקרובים ללקוח (למשל מי שמחובר לקבלנים יודע כמה בלוקים יימכרו). ״האובייקטיבים והסובייקטיבים בדרך כלל הולכים ביחד — גם וגם״. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"מה כינה המרצה ״תחזיות מיליון הדולר״?",o:["תחזיות שמחושבות בתוכנה יקרה במיוחד, ולכן הן המדויקות ביותר בארגון","תחזיות לטווח ארוך מאוד (כעשר שנים) — זיהוי מגמות שמאפשר להשקיע בזמן בתחום הנכון","תחזיות לטווח קצר לפעילות השוטפת, שחוסכות מיליוני דולרים בעלויות המלאי והייצור","תחזיות לטווח בינוני למשפחות מוצרים, כמו כמה אייפונים יימכרו בעוד שלוש שנים"],c:1,e:"טווח קצר — הפעילות השוטפת (מלאי, ייצור, שיבוץ עבודה); טווח בינוני — מוצרים כוללניים/משפחות (״אייפון״, לא ״אייפון 17״); טווח ארוך מאוד — ״תחזיות מיליון הדולר: מי שיגיד לי מה יהיה בעוד עשר שנים — יכול להיות מיליארדר״. בזה עוסקים עתידנים שמזהים מגמות. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"לפי ההרצאה, מהם שלושת שלבי העבודה עם המחשבון כדי למצוא את קו הרגרסיה?",o:["כניסה למוד הרגרסיה ← הקלדת <bdi dir='ltr'>Y</bdi> בלבד ← קבלת התחזית לתקופה הבאה","הקלדת הנתונים ← חישוב ממוצע וסטיית תקן ← קבלת <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>","מוד רגרסיה ← הקלדת הנתונים (<bdi dir='ltr'>X</bdi> מסביר, <bdi dir='ltr'>Y</bdi> מוסבר) ← קבלת <bdi dir='ltr'>A, B</bdi> ו-<bdi dir='ltr'>R</bdi>","חישוב <bdi dir='ltr'>Σx</bdi> ו-<bdi dir='ltr'>Σy</bdi> ביד ← הקלדתם במחשבון ← קבלת <bdi dir='ltr'>A</bdi> בלבד"],c:2,e:"״כדי לעבוד עם מחשבון צריך שלושה חלקים: כניסה למוד המתאים (<bdi dir='ltr'>STAT</bdi>, ‎<bdi dir='ltr'>A+BX</bdi>), הקלדת נתונים, וקבלת תוצאות״: <bdi dir='ltr'>A</bdi> — החותך, <bdi dir='ltr'>B</bdi> — השיפוע, <bdi dir='ltr'>R</bdi> — מקדם המתאם. בהקלדה: <bdi dir='ltr'>X</bdi> הוא המשתנה המסביר ו-<bdi dir='ltr'>Y</bdi> המוסבר — לא להחליף. (הרצאה 21.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"המרצה סיפר שבמבחנים הוא נותן סדרת ביקוש שבה, באחת השנים, הביקוש ירד ב-40% בגלל מלחמה. מה צריך לעשות לפני החיזוי?",o:["לעבור לגישה הנאיבית, כי אחרי מלחמה אי אפשר לחזות","להשאיר את הנתון כמו שהוא — הוא חלק מהמציאות של הסדרה","להשמיט את כל השנים שלפני המלחמה, כי הן כבר לא רלוונטיות","לנרמל את הנתון החריג, ולא להכניס אותו לחיזוי כמו שהוא"],c:3,e:"״במבחנים אני נותן את זה... מוצר היה ירידה של 40% — זה בגלל מלחמה. אז הסטודנט צריך מה לעשות? הוא נרמל את זה״. אותו עיקרון בטעות הקלדה: בכיתה הופיע אפס באמצע סדרה של כ-1,200 — ״מה דעתכם על הנתון? טעות בהקלדה״, ומורידים אותו. צריך להסתכל על המספרים ועל הגרף לפני שמחשבים. (הרצאה 28.7)"},

/* ---------- גיליון הדפסה ---------- */
/* נבנה אל תוך #print, שמוסתר במסך ומוצג רק בהדפסה. כך אין צורך
   בחלון חדש (שחוסמי חלונות קופצים עוצרים) והעיצוב נשאר בקובץ אחד.
   הטקסטים נכנסים כ-HTML כי שאלות החישוב מכילות טבלאות נתונים. */
function printSheet(withAnswers){
  var arr=filterBank();
  if(!arr.length){alert("לא נבחרו שאלות להדפסה.");return;}
  var box=document.getElementById("print");
  box.className = withAnswers ? "" : "cols";   /* בלי תשובות — צפוף יותר, שתי עמודות */
  var h='<div class="prhead"><h2>בוחן תרגול — ניהול שרשרת ההספקה</h2><div>'+
        arr.length+" שאלות · "+(SCOPE[sel.src]?SCOPE[sel.src].name:sel.src)+
        " · "+(withAnswers?"עם תשובות והסברים":"ללא תשובות")+"</div></div>";
  arr.forEach(function(q,i){
    h+='<div class="pq"><div class="pt"><span class="iso">'+q.t+'</span>'+(isCalc(q)?' · 🧮 חישוב':'')+'</div>'+
       '<div><span class="pn">'+(i+1)+'.</span> '+q.q+'</div>';
    q.o.forEach(function(o,k){ h+='<div class="po">'+LET[k]+". "+o+"</div>"; });
    if(withAnswers)
      h+='<div class="po pa">✔ '+LET[q.c]+". "+q.o[q.c]+'</div>'+
         '<div class="po pe">'+q.e+"</div>";
    h+="</div>";
  });
  box.innerHTML=h;
  window.print();
}

     אינו מייצג, והמאגר אינו מאוזן בין הנושאים. */
  if(sel.pcount&&quiz.length>sel.pcount)
    quiz=shuffle(balancedPick(quiz,sel.pcount));
  idx=0;score=0;wrong=[];ansMap=[];
  pRender();
}
function pRender(){
  if(idx>=quiz.length)return pResults();
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  function statsHtml(done){
    var seen=idx+(done?1:0);
    return "<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
      "<span>נכונות: <b>"+score+"</b></span>"+
      "<span>שגויות: <b>"+wrong.length+"</b></span>"+
      "<span class='spacer'></span><span>הצלחה: <b>"+(seen?Math.round(score/seen*100)+"%":"—")+"</b></span>";
  }
  st.innerHTML=statsHtml(false);
  c.appendChild(st);
  c.appendChild(bar(idx/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  answered=false;
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){
      if(answered)return;
      answered=true;
      var all=box.querySelectorAll(".opt");
      for(var k=0;k<all.length;k++)all[k].className="opt locked";
      all[q.c].className="opt correct locked";
      if(i===q.c){score++;}
      else{all[i].className="opt wrong locked";wrong.push(q);}
      st.innerHTML=statsHtml(true);
      var ex=E("div",{"class":"expl"});
      ex.innerHTML='<span class="tag">'+(i===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+q.e;
      c.insertBefore(ex,navRow);
      nextBtn.disabled=false;nextBtn.className="btn btn-pri";
    };
    box.appendChild(b);
  });
  c.appendChild(box);

  var navRow=E("div",{"class":"nav"});
  var nextBtn=E("button",{"class":"btn"},idx===quiz.length-1?"סיום וצפייה בציון":"השאלה הבאה ←");
  nextBtn.disabled=true;
  nextBtn.onclick=function(){idx++;pRender();};
  var skip=E("button",{"class":"btn"},"דילוג");
  skip.onclick=function(){idx++;pRender();};
  navRow.appendChild(nextBtn);navRow.appendChild(skip);
  c.appendChild(navRow);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function pResults(){
  results(score,quiz.length,wrong,practiceStart,function(){
    quiz=wrong.slice();if(sel.shuffle)shuffle(quiz);
    idx=0;score=0;wrong=[];pRender();
  },null);
}

/* ---------- exam mode ---------- */
/* דגימה מאוזנת בין נושאים: המאגר אינו מאוזן (יש נושאים עם יותר שאלות
   מאחרים, לפי כמה חומר יש עליהם), ולכן דגימה אקראית פשוטה תיתן מבחן
   שרובו שניים-שלושה נושאים. כאן לוקחים לסירוגין מכל נושא בתורו. */
function balancedPick(arr,n){
  var byTopic={},order=[];
  arr.forEach(function(q){ if(!byTopic[q.t]){byTopic[q.t]=[];order.push(q.t);} byTopic[q.t].push(q); });
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=byTopic[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;      /* מוצו כל הנושאים */
    i++;
  }
  return out;
}
function examStart(){
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)
    quiz=sel.balanced?shuffle(balancedPick(quiz,sel.count)):quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו למעבר"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  results(sc,quiz.length,wr.map(function(x){return x.q;}),examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+x.q.e+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={};
    wr.forEach(function(q){byTopic[q.t]=(byTopic[q.t]||0)+1;});
    var ul=E("div",{"class":"toolbar"});
    Object.keys(byTopic).forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},"<span class=\"iso\">"+t+"</span> — "+byTopic[t]+" שגיאות"));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

setup();
})();
</script>
