{t:"מיקור ורכש",s:"שלמה",q:"הנהלת חברה חוששת שתהליך התכנון האסטרטגי שלה ייתקע בגיליונות אלקטרוניים ובשיפורים תוספתיים קטנים, במקום לעצב אסטרטגיית אוקיינוס כחול. איזה מארבעת העקרונות המנחים נועד להתמודד עם חשש זה, ועם איזה סיכון הוא מתמודד?",o:["להתמקד בתמונה הגדולה ולא במספרים — סיכוני תכנון","לשרטט מחדש את גבולות השוק באמצעות ששת הנתיבים — סיכוני חיפוש","לחרוג מהביקוש הקיים ולפנות ללא-לקוחות — סיכוני היקף","לבנות את הרצף האסטרטגי הנכון — סיכוני מודל עסקי"],c:0,e:"העיקרון השני — להתמקד בתמונה הגדולה ולא במספרים — מגדיר תהליך תכנון אסטרטגי שיתקדם מעבר לשיפורים תוספתיים, והוא מתמודד עם סיכוני התכנון. שרטוט מחדש של גבולות השוק (ששת הנתיבים) מתמודד עם סיכוני חיפוש, חריגה מהביקוש הקיים עם סיכוני היקף, ובניית הרצף האסטרטגי עם סיכוני המודל העסקי. (שא-3, שקף 20)"},
{t:"מיקור ורכש",s:"שלמה",q:"מנכ״ל טוען בדיון אסטרטגי: ׳עלינו להחליט — או שאנו מתבדלים באיכות ובשירות, או שאנו מתחרים במחיר; אי אפשר את שניהם׳. כיצד ניתן לאפיין גישה זו על פי ההשוואה במצגת, ומה מציעה אסטרטגיית האוקיינוס הכחול במקומה?",o:["זו גישת אוקיינוס כחול, המתאימה את כל הפעילויות לבידול; האוקיינוס האדום מציע להתמקד בעלות נמוכה בלבד","זו חדשנות ערך, שכן היא מכריחה את החברה לבחור בערך ללקוח; האוקיינוס הכחול מציע לוותר על הבידול","זו גישת אוקיינוס כחול, שכן היא מבטלת גורמים מקובלים; האוקיינוס האדום מציע לשמר את כל הגורמים","זו פשרת ערך–עלות של האוקיינוס האדום; האוקיינוס הכחול שובר אותה וחותר לבידול ועלות נמוכה יחד"],c:3,e:"הבחירה בין בידול לבין עלות נמוכה היא ׳פשרת ערך–עלות׳ של אסטרטגיה מבוססת-תחרות באוקיינוס האדום, שבה מתאימים את הפעילויות לבידול או לעלות נמוכה. אסטרטגיית האוקיינוס הכחול שוברת את הפשרה ומתאימה את כל מערכת הפעילויות להשגת בידול וגם עלות נמוכה בעת ובעונה אחת. (שא-3, שקפים 18–19)"},
/* אתגרי הרכש / KPI */
{t:"מיקור ורכש",s:"שלמה",q:"מנהלת רכש חדשה בונה לוח מדדים ליחידה ומבקשת לשקף בו את שני האתגרים העיקריים של הרכש בשרשרת האספקה, כפי שהוצגו במצגת. איזה צמד עליה להציב במרכז הלוח?",o:["דיוק התחזית <bdi dir='ltr'>(Forecast Accuracy)</bdi> ורמת כיסוי המלאי <bdi dir='ltr'>(Inventory Coverage)</bdi>","איכות הספק <bdi dir='ltr'>(Vendor Quality)</bdi> וזמן האספקה <bdi dir='ltr'>(Lead Time)</bdi>","הורדת עלויות <bdi dir='ltr'>(Cost Reduction)</bdi> וזמינות חומר <bdi dir='ltr'>(Material Availability)</bdi>","מספר הספקים (# <bdi dir='ltr'>of vendors</bdi>) והוצאות השינוע <bdi dir='ltr'>(Freight)</bdi>"],c:2,e:"המצגת מגדירה שני אתגרים עיקריים לרכש: <bdi dir='ltr'>Cost Reduction</bdi> — הורדת עלויות, ו-<bdi dir='ltr'>Material Availability</bdi> — זמינות חומר. דיוק תחזית וכיסוי מלאי שייכים לניהול החומר; מספר הספקים והשינוע הם מדדי משנה <bdi dir='ltr'>(Supporting KPI)</bdi> בעץ המדדים, התומכים בהורדת העלויות ובעלות התפעולית, ולא האתגרים עצמם. (שא-3, שקפים 4–5)"}
]);

BANK.push.apply(BANK,[
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי שקף ״עיסוקי הליבה של הארגון״, מהי השאלה המרכזית שעומדת בפני ארגון שעיסוקו פיתוח ומכירות?",o:["בחינת מיקור חוץ <bdi dir='ltr'>(Outsource)</bdi> של הפעילות התפעולית","האם לספק שירותים תפעוליים גם לארגונים אחרים","האם להקים מפעל עצמי כדי לשלוט בכל שלבי הייצור","האם לעבור לייצור למלאי במקום ייצור לפי הזמנה"],c:0,e:"בעץ ״סוג הארגון?״ בשקף, ארגון פיתוח/מכירות מוביל ל״בחינת <bdi dir='ltr'>Outsource</bdi>״. ארגון תפעולי מתפצל לשני סוגים: ארגון שירותים, שהשאלה שלו היא ״אספקת שירותים לאחרים?״, וארגון יצרני, שהשאלה שלו היא <bdi dir='ltr'>In house</bdi> או <bdi dir='ltr'>Outsource</bdi>. (שא-4, שקף 8)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"ארגון תפעולי שעיסוקו מתן שירותים — למשל מערך אחזקה של צי רכב — שואל את עצמו מה הצעד הבא בעיסוקי הליבה שלו. מה מציע עץ ״סוג הארגון״?",o:["לבחון אספקת שירותים לארגונים אחרים","לבחון פיצול למרכזי רווח נפרדים","לבחון מעבר לייצור עצמי מלא","לבחון מיקור חוץ של כל פעילותו התפעולית"],c:0,e:"בעץ שבשקף, ארגון תפעולי מתפצל ל״יצרני״ (<bdi dir='ltr'>In house / Outsource</bdi>?) ול״שירותים״, וענף השירותים מוביל לשאלה ״אספקת שירותים לאחרים?״ — כלומר ניצול היכולת התפעולית למתן שירות גם לגורמים חיצוניים. בחינת <bdi dir='ltr'>Outsource</bdi> מופיעה בענף הפיתוח/מכירות. (שא-4, שקף 8)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה של <bdi dir='ltr'>yes</bdi> שהוצג בכיתה, כיצד תוארה התפתחות שרשרת האספקה של החברה לאורך השנים?",o:["<bdi dir='ltr'>In house</bdi> ➔ <bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>In house</bdi>","<bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>In house</bdi>","<bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>In house</bdi> ➔ <bdi dir='ltr'>Outsource</bdi>","<bdi dir='ltr'>In house</bdi> ➔ <bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>Outsource</bdi>"],c:2,e:"שקף ״למה קמה <bdi dir='ltr'>yes</bdi>?״ מתאר את שרשרת האספקה של החברה כמהלך של <bdi dir='ltr'>Outsource</bdi> ➔ <bdi dir='ltr'>In house</bdi> ➔ <bdi dir='ltr'>Outsource</bdi>, ושואל אם החברה עמדה במטרה שלשמה קמה ואם יש לה עתיד. בשלב <bdi dir='ltr'>I</bdi> התמקדה בליבה (שיווק, מרכז שידורים), ובשלב <bdi dir='ltr'>II</bdi> הקימה חטיבת לקוחות (מכירות, התקנות ושירות לקוחות). (שא-4, שקף 10)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה <bdi dir='ltr'>ECI</bdi>–<bdi dir='ltr'>Flex</bdi> (״<bdi dir='ltr'>The</bdi> $<bdi dir='ltr'>1B outsourcing</bdi>״), איזה מהשינויים הבאים מתאר נכון את מערך התפעול של <bdi dir='ltr'>ECI</bdi> אחרי 2008, לעומת לפני 2007?",o:["מ-4 אתרי ייצור עצמיים ל-8 אתרים, ומחברה פרטית לחברה ציבורית בבורסה","מ-1,000 עובדי תפעול ל-70, ומ-4 אתרי ייצור עצמיים ל-2 שותפים עסקיים","מ-1,000 עובדי תפעול ל-700, ומ-4 אתרי ייצור עצמיים ל-4 שותפים עסקיים","מ-70 עובדי תפעול ל-1,000, ומ-2 שותפים עסקיים ל-4 אתרי ייצור עצמיים"],c:1,e:"לפני 2007 <bdi dir='ltr'>ECI</bdi> הייתה חברה ציבורית עם עסק חזק ותפעול <bdi dir='ltr'>In-House</bdi>: 4 אתרי ייצור עצמיים ומעט קבלני משנה, ו-1,000 עובדי תפעול. אחרי 2008 הייתה חברה פרטית עם עסק חלש, והתפעול עבר למיקור חוץ: 4 ← 2 שותפים עסקיים ו-70 עובדי תפעול בלבד. (שא-4, שקף 14)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה הייתה עמדתו של שלמה ארליך לגבי השאלה אם מיקור החוץ של <bdi dir='ltr'>ECI</bdi> ל-<bdi dir='ltr'>Flex</bdi> היה רעיון טוב?",o:["זה היה נכון רק מבחינה כספית, אך לדעתו פגע באיכות המוצרים עד כדי אובדן לקוחות מרכזיים","זה היה מהלך נכון לכל חברה בענף, ולכן כל יצרני התקשורת בישראל העבירו אז את הייצור לחו״ל","זה היה כישלון ברור, כי <bdi dir='ltr'>ECI</bdi> איבדה את השליטה בידע התפעולי ונאלצה לחזור לייצור עצמי מלא","אין תשובה אמיתית — תלוי את מי שואלים; לדעתו האישית זה היה מהלך נכון שאולי הציל את <bdi dir='ltr'>ECI</bdi>"],c:3,e:"בשקף הסיכום של המקרה נאמר: ״<bdi dir='ltr'>No real answer</bdi> — <bdi dir='ltr'>depends who you ask</bdi>…״, ושלמה מוסיף: ״<bdi dir='ltr'>I personally think it was the right move that may have saved ECI</bdi>״. המקרה מוצג כדילמה, לא ככישלון וגם לא כמתכון גורף לכל הענף. (שא-4, שקף 15)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"סמנכ״ל הכספים של חברת אלקטרוניקה מבקש שהוצאות הייצור ישתנו בהתאם להיקף המכירות, במקום לשלם קבוע על מפעל ועובדים גם בחודשים חלשים. איזה שיקול בעד <bdi dir='ltr'>Turn Key</bdi> מתאים לבקשתו?",o:["שמירה על הקניין הרוחני <bdi dir='ltr'>(IP)</bdi> בבית","מעבר מעלויות קבועות לעלויות משתנות","שליטה מלאה בכלל הפעילות התפעולית","הגדלת המלאי כדי לשפר את זמינות הייצור"],c:1,e:"בין השיקולים בעד <bdi dir='ltr'>Turn Key</bdi> בשקף 17: תמיכה באסטרטגיה, השפעה על הדוחות הכספיים, עמידה ביעדי השרשרת, מיקוד בליבה והעברה למומחים, <bdi dir='ltr'>Risk Sharing, TCO</bdi>, מעבר מעלויות קבועות למשתנות והורדת מלאי. שמירת <bdi dir='ltr'>IP</bdi> ושליטה בפעילות הם דווקא יתרונות הייצור העצמי <bdi dir='ltr'>(Make)</bdi>, ומיקור חוץ מוריד מלאי ולא מגדיל אותו. (שא-4, שקפים 17, 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"איזה מהבאים <b>אינו</b> שיקול בעד <bdi dir='ltr'>Turn Key</bdi> — מיקור חוץ מלא — לפי המצגת?",o:["מיקוד בליבה והעברה למומחים בתחום","שיתוף הסיכונים עם השותף <bdi dir='ltr'>(Risk Sharing)</bdi>","הורדת המלאי והעלות הכוללת <bdi dir='ltr'>(TCO)</bdi>","שמירה על הקניין הרוחני של הארגון"],c:3,e:"שיקולי <bdi dir='ltr'>Turn Key</bdi> בשקף 17 כוללים <bdi dir='ltr'>Risk Sharing</bdi>, מיקוד בפעילות הארגון והעברה למומחים, <bdi dir='ltr'>TCO</bdi>, מעבר מעלויות קבועות למשתנות והורדת מלאי. שמירת הקניין הרוחני <bdi dir='ltr'>(IP)</bdi> מופיעה בשקף 19 כיתרון של ייצור עצמי <bdi dir='ltr'>(Make)</bdi> — היא שיקול נגד מיקור חוץ, לא בעדו. (שא-4, שקפים 17, 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברת רחפנים פיתחה אלגוריתם ייחודי לניווט, ומנהלת התפעול חוששת שהעברת הייצור לקבלן חיצוני תחשוף אותו למתחרים. לאיזה צד בשיקולי <bdi dir='ltr'>Make or Buy</bdi> מתאים החשש?",o:["<bdi dir='ltr'>Make</bdi> — הורדת המלאי והעברתו לידי השותף","<bdi dir='ltr'>Buy</bdi> — רכישת ידע מהמומחים בתחום הייצור","<bdi dir='ltr'>Buy</bdi> — החלפת עלויות קבועות בעלויות משתנות","<bdi dir='ltr'>Make</bdi> — שמירה על ה-<bdi dir='ltr'>IP</bdi> ושליטה בכלל הפעילות"],c:3,e:"לפי שקף 19, יתרונות הייצור העצמי <bdi dir='ltr'>(Make)</bdi> הם שליטה בהוצאות העצמיות, שמירה על <bdi dir='ltr'>IP</bdi> ושליטה בכלל הפעילות; יתרונות הרכישה <bdi dir='ltr'>(Buy)</bdi> הם החלפת עלויות קבועות במשתנות ו״רכישת ידע״ מהמומחים. חשש מחשיפת קניין רוחני הוא נימוק מובהק בעד <bdi dir='ltr'>Make</bdi>. הורדת מלאי היא יתרון של מיקור חוץ, לא של ייצור עצמי. (שא-4, שקף 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"יצרן ציוד רפואי קטן שוקל להעביר את הרכבת המעגלים האלקטרוניים ליצרן קבלן גדול ומנוסה, כי אין לו מומחיות בטכנולוגיות ההרכבה החדשות. איזה יתרון של <bdi dir='ltr'>Buy</bdi> מנצל היצרן?",o:["שליטה בהוצאות העצמיות של המפעל","שמירה על הקניין הרוחני שבמוצר","שליטה מלאה בכל שלבי הייצור","״רכישת ידע״ מהמומחים בתחום"],c:3,e:"בשקף 19, בצד הרכישה <bdi dir='ltr'>(Buy)</bdi> מופיעים החלפת עלויות קבועות במשתנות ו״רכישת ידע״ מהמומחים בתחום — בדיוק הנימוק בתרחיש. שליטה בהוצאות, שמירת <bdi dir='ltr'>IP</bdi> ושליטה בכלל הפעילות הם יתרונות הייצור העצמי <bdi dir='ltr'>(Make)</bdi>. (שא-4, שקף 19)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי פירמידת ״רמות מיקור חוץ״ במצגת, מהו הסדר הנכון מבסיס הפירמידה ועד פסגתה?",o:["<bdi dir='ltr'>Subcontracting</bdi> → <bdi dir='ltr'>All In-house</bdi> → <bdi dir='ltr'>Full Turn Key</bdi> → <bdi dir='ltr'>Outsource</bdi> → <bdi dir='ltr'>JDM</bdi> → <bdi dir='ltr'>DMS</bdi> → <bdi dir='ltr'>ODM</bdi>","<bdi dir='ltr'>All In-house</bdi> → <bdi dir='ltr'>Subcontracting</bdi> → <bdi dir='ltr'>DMS</bdi> → <bdi dir='ltr'>Outsource</bdi> → <bdi dir='ltr'>JDM</bdi> → <bdi dir='ltr'>Full Turn Key</bdi> → <bdi dir='ltr'>ODM</bdi>","<bdi dir='ltr'>All In-house</bdi> → <bdi dir='ltr'>Subcontracting</bdi> → <bdi dir='ltr'>Outsource</bdi> → <bdi dir='ltr'>Full Turn Key</bdi> → <bdi dir='ltr'>DMS</bdi> → <bdi dir='ltr'>JDM</bdi> → <bdi dir='ltr'>ODM</bdi>","<bdi dir='ltr'>All In-house</bdi> → <bdi dir='ltr'>Outsource</bdi> → <bdi dir='ltr'>Subcontracting</bdi> → <bdi dir='ltr'>DMS</bdi> → <bdi dir='ltr'>Full Turn Key</bdi> → <bdi dir='ltr'>ODM</bdi> → <bdi dir='ltr'>JDM</bdi>"],c:2,e:"בפירמידה שבשקף 20, מלמטה למעלה: <bdi dir='ltr'>All In-house, Subcontracting, Outsource, Full Turn Key, DMS (Design</bdi> & <bdi dir='ltr'>Mfg. Services), JDM (Join Development</bdi>) ו-<bdi dir='ltr'>ODM (Origin Design)</bdi> בפסגה. ככל שעולים, הספק לוקח אחריות רחבה יותר — מקבלנות משנה בלבד, דרך אחריות מלאה על הייצור, ועד תכנון המוצר עצמו. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברה מעבירה לספק חיצוני שלבים בודדים בתהליך — למשל ציפוי והרכבה של חלקים — בעוד שכל שאר הייצור, הרכש והתכנון נשארים אצלה. באיזו רמה של מיקור חוץ מדובר?",o:["<bdi dir='ltr'>JDM</bdi> — פיתוח משותף עם הספק","<bdi dir='ltr'>Full Turn Key</bdi> — מיקור חוץ מלא","<bdi dir='ltr'>Outsource</bdi> — העברת הייצור כולו","<bdi dir='ltr'>Subcontracting</bdi> — קבלנות משנה"],c:3,e:"בפירמידה שבשקף 20, <bdi dir='ltr'>Subcontracting</bdi> היא הרמה הראשונה מעל <bdi dir='ltr'>All In-house</bdi>: הספק מבצע פעולות מסוימות בלבד, והארגון מחזיק בשאר. <bdi dir='ltr'>Outsource</bdi> ו-<bdi dir='ltr'>Full Turn Key</bdi> מעבירים לספק את הייצור ואת האחריות עליו, ו-<bdi dir='ltr'>JDM</bdi> כבר כולל פיתוח משותף של המוצר. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"חברת מותג צרכני קונה מספק מוצר שהספק עצמו תכנן ומייצר, ומוסיפה לו רק את המותג שלה. איזו רמה בפירמידת מיקור החוץ מתארת זאת?",o:["<bdi dir='ltr'>DMS</bdi> — שירותי תכנון וייצור, באמצע הפירמידה","<bdi dir='ltr'>Full Turn Key</bdi> — ייצור מלא לפי תכנון החברה","<bdi dir='ltr'>ODM</bdi> — <bdi dir='ltr'>Origin Design</bdi>, בפסגת הפירמידה","<bdi dir='ltr'>JDM</bdi> — פיתוח משותף של החברה ושל הספק"],c:2,e:"בפסגת הפירמידה נמצא <bdi dir='ltr'>ODM (Origin Design)</bdi>: הספק הוא שמתכנן את המוצר ומייצר אותו, והחברה מוכרת אותו תחת המותג שלה. ב-<bdi dir='ltr'>JDM</bdi> התכנון משותף, ב-<bdi dir='ltr'>DMS</bdi> הספק נותן שירותי תכנון וייצור, וב-<bdi dir='ltr'>Full Turn Key</bdi> הספק אחראי לייצור המלא אך לא לתכנון המוצר. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה מבטאים החצים ״<bdi dir='ltr'>EMS</bdi>״ ו-״<bdi dir='ltr'>ODM</bdi>״ המסומנים לצד פירמידת רמות מיקור החוץ?",o:["<bdi dir='ltr'>EMS</bdi> ו-<bdi dir='ltr'>ODM</bdi> הם מדדי ביצוע שבאמצעותם מעריכים כל רמה בפירמידה","ספקי <bdi dir='ltr'>EMS</bdi> יורדים לקבלנות משנה, וספקי <bdi dir='ltr'>ODM</bdi> עולים למיקור חוץ מלא ומקיף","ספקי <bdi dir='ltr'>EMS</bdi> מטפסים לשירותי תכנון, וספקי <bdi dir='ltr'>ODM</bdi> יורדים אל שירותי הייצור","<bdi dir='ltr'>EMS</bdi> ו-<bdi dir='ltr'>ODM</bdi> הן שתי רמות נוספות, בבסיס הפירמידה ובאמצעה בהתאמה"],c:2,e:"בשקף 20 מופיעה הכותרת ״מגמות״ עם שני חצים: חץ <bdi dir='ltr'>EMS</bdi> העולה כלפי מעלה וחץ <bdi dir='ltr'>ODM</bdi> היורד כלפי מטה. המשמעות: יצרני שירותי ייצור <bdi dir='ltr'>(EMS)</bdi> מרחיבים את היצע השירותים שלהם כלפי תכנון, ויצרני <bdi dir='ltr'>ODM</bdi> מרחיבים כלפי שירותי ייצור — שני הצדדים מתכנסים לאמצע הפירמידה. הם אינם רמות נוספות. (שא-4, שקף 20)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בין הדגשים למיקור חוץ מלא, שלמה ממליץ ״<bdi dir='ltr'>Always have a 2nd Source</bdi>״. באיזה שם הוא מכנה את המודל?",o:["מודל הפינה בחדר העגול <bdi dir='ltr'>(Corner in a Rounded Room)</bdi>","מודל המראה האחורית <bdi dir='ltr'>(Back Mirror Model)</bdi>","מודל הטיפוס למגדל <bdi dir='ltr'>(Climb to the Higher Point)</bdi>","מודל המטקות ולא הטניס <bdi dir='ltr'>(Play MATKOT not Tennis)</bdi>"],c:1,e:"בשקף 21: ״<bdi dir='ltr'>Always have a 2nd Source (Back Mirror Model)</bdi>״ — כמו מראה אחורית, צריך תמיד לראות חלופה. ״פינה בחדר עגול״ מתאר אחריות <bdi dir='ltr'>End-to-End</bdi>, ״מטקות ולא טניס״ מתאר שותפות עסקית (״שני צוותים — חברה אחת״), ו״לטפס לנקודה הגבוהה במגדל״ מתאר את נקודת המבט של ההנהלה הבכירה. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי דגשי מיקור החוץ המלא, מה הופך ל״מאמץ העיקרי ולמוקד המתח בארגון״ אחרי המעבר ל-<bdi dir='ltr'>Full Outsourcing</bdi>?",o:["ניהול המחסנים והשילוח <bdi dir='ltr'>(Warehousing)</bdi>","ניהול כוח האדם בקו הייצור <bdi dir='ltr'>(Workforce)</bdi>","ניהול החוסרים <bdi dir='ltr'>(Shortages Management)</bdi>","ניהול תחזוקת המכונות במפעל <bdi dir='ltr'>(Maintenance)</bdi>"],c:2,e:"בשקף 21: ״<bdi dir='ltr'>Shortages Management</bdi> — <bdi dir='ltr'>Main effort and tension in organization</bdi>!״. כשהייצור אצל השותף, הארגון אינו מנהל עוד עובדי ייצור ומכונות — והמאמץ עובר לוודא שהחומר זמין ושהחוסרים מטופלים. באותו שקף מופיעים גם רכש <bdi dir='ltr'>BOM</bdi> מלא, <bdi dir='ltr'>Aging</bdi> ותמחיר ברמת מוצר. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"שלמה מתאר מיקור חוץ מלא כ״פינה בחדר עגול״ <bdi dir='ltr'>(A Corner in Rounded Room)</bdi>. איזה עיקרון מבטא הדימוי?",o:["ראייה מלמעלה — לטפס לנקודה הגבוהה במגדל ולראות הכול","גיבוי תמידי — לשמור תמיד על מקור אספקה שני לכל פריט קריטי","אחריות מלאה מקצה לקצה <bdi dir='ltr'>(End 2 End)</bdi> — אין פינה שבה אפשר להסתתר","שיתוף פעולה עסקי — שני צוותים שמשחקים יחד כחברה אחת מול הלקוח"],c:2,e:"בשקף 21, ״<bdi dir='ltr'>Full Outsourcing</bdi> — <bdi dir='ltr'>End 2 End Responsibility (A Corner in Rounded Room)</bdi>״: בחדר עגול אין פינות — השותף אחראי על כל התהליך ואין שלב שנופל ״בין הכיסאות״. שיתוף הפעולה (״מטקות ולא טניס״), המקור השני (״המראה האחורית״) והמבט מלמעלה הם דגשים אחרים באותו שקף. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי דגשי מיקור החוץ המלא, איך משתנה בסיס הרכש אצל השותף?",o:["מרכש לפי תחזית <bdi dir='ltr'>(Purchase to Forecast)</bdi> לאספקה מלאה של הזמנות הלקוח","מרכש שמבצע השותף לרכש שחוזר אל הארגון עצמו ברמת כל רכיב ורכיב","מרכש של פריטים בודדים לרכש של חומרי גלם בלבד, בלי רכיבים מורכבים","מרכש לפי הזמנות לקוח לרכש לפי תחזית שנתית קבועה ומוסכמת מראש"],c:0,e:"בשקף 21: ״<bdi dir='ltr'>Purchase to Forecast</bdi> ➔ <bdi dir='ltr'>Full Customer Order Delivery</bdi>״ — השותף אינו קונה רק לפי תחזית, אלא אחראי לאספקה מלאה של הזמנות הלקוחות, ולצד זה מבצע רכש של ה-<bdi dir='ltr'>BOM</bdi> המלא <bdi dir='ltr'>(Full BOM Purchasing)</bdi>. הכיוון ההפוך סותר את רעיון האחריות מקצה לקצה. (שא-4, שקף 21)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מה מתאר המעבר ״מרשת אספקה מקומית לרשת אספקה גלוקאלית״ <bdi dir='ltr'>(GloCal)</bdi> במצגת?",o:["מרשת של כמה אתרים — לריכוז כל הייצור באתר אחד גדול, כדי לנצל יתרונות לגודל בשוק הגלובלי","מאתר ארגון יחיד מול ספקים ולקוחות — לרשת של כמה אתרים, ספקים ולקוחות; <bdi dir='ltr'>Think Global, Act Local</bdi>","משיווק גלובלי — לשיווק מקומי בלבד, כדי לצמצם את עלויות ההפצה וההובלה הבין-לאומית","מרכש מקומי בלבד — לרכש מספק גלובלי יחיד, כדי להוזיל את המחיר באמצעות כמויות גדולות"],c:1,e:"בשקף 22 מוצג ״לפני״: אתר ארגון אחד בין ספק ללקוח; ו״אחרי״: כמה אתרי ארגון, ספקים ולקוחות המחוברים ברשת — ״<bdi dir='ltr'>GloCal</bdi> — <bdi dir='ltr'>Think Global, Act Local</bdi>!״: חשיבה גלובלית ופעולה מקומית קרוב לשווקים. ריכוז הייצור באתר אחד הוא הכיוון ההפוך. (שא-4, שקף 22)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"כיצד מגדירה המצגת ייצור רזה <bdi dir='ltr'>(Lean Production)</bdi>?",o:["מתודולוגיה להחזקת מלאי ביטחון גבוה, כדי למנוע כל עצירה בקו הייצור","מתודולוגיה לצמצום הבזבוז לאורך תהליך הייצור, תוך התמקדות בערך ללקוח","מתודולוגיה להגדלת מנות הייצור, כדי לנצל עד תום את קיבולת המפעל","מתודולוגיה לצמצום מספר העובדים, כדי להוריד את עלויות השכר במפעל"],c:1,e:"לפי שקף 24, ייצור רזה הוא מתודולוגיית ניהול ייצור שמטרתה צמצום הבזבוז לאורך תהליך הייצור תוך התמקדות בערך ללקוח <bdi dir='ltr'>(Customer Value)</bdi>, בתהליך מתמשך של ייעול זרימת המידע והחומר. צמצום הבזבוז מגדיל את האיכות ומקטין את זמן הייצור ואת ההוצאות. (שא-4, שקף 24)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתחנת הרכבה, כל מגש חלקים מגיע עם כרטיס. כשהמגש מתרוקן, הכרטיס נשלח לתחנה הקודמת כאות לייצר מנה חדשה בגודל קבוע. באיזה כלי של ייצור רזה מדובר?",o:["<bdi dir='ltr'>Work cells</bdi> — תאי עבודה שמרכזים מספר תחנות יחד","<bdi dir='ltr'>Poka Yoke</bdi> — מנגנון שמונע טעויות וחלקים פגומים","<bdi dir='ltr'>Kanban</bdi> — כרטיס המגדיר מנת ייצור לחידוש המלאי","<bdi dir='ltr'>Visual Management</bdi> — לוח בקרה חזותי בקו הייצור"],c:2,e:"<bdi dir='ltr'>Kanban</bdi> (״פתק״) הוא כלי להגדרת מנות ייצור לחידוש המלאי: הכרטיס הוא האות שמושך ייצור מהתחנה הקודמת לפי הצריכה בפועל — יישום של <bdi dir='ltr'>Pull</bdi>. בשקף טויוטה הוא מופיע כ״<bdi dir='ltr'>Kanban</bdi> — תזמון ביקוש, <bdi dir='ltr'>Pull Systems</bdi>״. (שא-4, שקפים 25, 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מפעל התקין בקו ההרכבה התקן שבו חלק אינו נכנס למקומו אם הוא הפוך או פגום, כך שלא ניתן להמשיך בהרכבה. איזה עיקרון מיושם?",o:["<bdi dir='ltr'>Takt Time</bdi> — איזון קווי הייצור לפי קצב קבוע","<bdi dir='ltr'>Heijunka</bdi> — איזון האספקות מול הביקוש בקו הייצור","<bdi dir='ltr'>One Piece Flow</bdi> — ייצור בנפחים קטנים של יחידה אחת","<bdi dir='ltr'>Poka Yoke</bdi> — שאיפה לאפס פגמים ופתרון בעיות במקור"],c:3,e:"בשקף 25: שאיפה לאפס פגמים, גילוי ופתרון בעיות בנקודת המקור — <bdi dir='ltr'>Poka Yoke</bdi>, מנגנון שמונע טעות מלכתחילה. <bdi dir='ltr'>One Piece Flow</bdi> עוסק בגודל המנות, ו-<bdi dir='ltr'>Heijunka</bdi> ו-<bdi dir='ltr'>Takt Time</bdi> עוסקים באיזון הייצור והאספקות — לא במניעת פגמים. (שא-4, שקף 25)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"קו ייצור עבר מייצור במנות של 500 יחידות לתהליך שבו כל יחידה עוברת מתחנה לתחנה מיד עם סיום הטיפול בה. איזה עיקרון של ייצור רזה מיושם?",o:["<bdi dir='ltr'>Work cells</bdi> — ריכוז התחנות לתא עבודה אחד במפעל","<bdi dir='ltr'>One Piece Flow</bdi> — נפחי ייצור קטנים בלי להקריב יעילות","<bdi dir='ltr'>Just In Time</bdi> — איזון שטף האספקה מול שטף הייצור","<bdi dir='ltr'>Kanban</bdi> — כרטיסים המגדירים מנה קבועה לחידוש המלאי"],c:1,e:"<bdi dir='ltr'>One Piece Flow</bdi> בשקף 25: ייצור בנפחים קטנים יותר — עד יחידה בודדת — מבלי להקריב יעילות. היחידה זורמת בין התחנות בלי להמתין להשלמת מנה גדולה, וכך מצטמצמים מלאי בתהליך וזמני המתנה. (שא-4, שקף 25)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי המצגת, מהו ״בזבוז״ <bdi dir='ltr'>(Muda)</bdi>?",o:["פעולה או הוצאה שהלקוח אינו מוכן לשלם עבורה","כל עלות שחורגת מהתקציב השנתי של המפעל","כל פעולה שמתבצעת על ידי ספק חיצוני לארגון","כל מוצר שנמכר ללקוח במחיר נמוך מעלותו"],c:0,e:"שקף 26 מגדיר בזבוז כפעולה או הוצאה שהלקוח אינו מוכן לשלם עבורה. זו נקודת המבט של הלקוח: פעילות שאינה מוסיפה ערך בעיניו היא בזבוז, גם אם היא מתוקצבת ומבוצעת בתוך הארגון. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בקו הרכבה, עובדים עומדים בחיבוק ידיים כעשרים דקות בכל משמרת עד שמגיעים חלקים מהתחנה הקודמת. איזה סוג בזבוז מתואר?",o:["המתנה","תנועות מיותרות","מלאי לא נדרש","עיבוד עודף"],c:0,e:"עובדים ומכונות שממתינים לחלקים, לאישורים או למידע — זה בזבוז ״המתנה״, השני ברשימה בשקף 26. תנועות מיותרות הן תזוזות של העובד עצמו, מלאי לא נדרש הוא חומר שמצטבר בלי צורך, ועיבוד עודף הוא ביצוע תהליכים מיותרים. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מפעל ממשיך לייצר גם כשאין הזמנות, ״כדי שהמכונות לא יעמדו״, והמוצרים הגמורים נערמים במחסן. איזה סוג בזבוז הוא הבעיה העיקרית כאן?",o:["תוצרת פגומה — איכות","ייצור עודף — כמות","המתנה — עיכוב","תעבורה — הובלה"],c:1,e:"ייצור מעבר למה שהלקוח דורש הוא בזבוז ״ייצור עודף — כמות״ (מספר 6 בשקף 26). הוא גם גורם בזבוזים נוספים כמו מלאי לא נדרש, ולכן נחשב לאחד המסוכנים. הייצור הרזה פועל לפי <bdi dir='ltr'>Pull</bdi> — לפי דרישת הלקוח ולא לפי הקיבולת האפשרית. (שא-4, שקפים 25–26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"טופס אישור עובר חמש חתימות של מנהלים, אף שרק שתיים מהן משנות משהו בהחלטה. לאיזה סוג בזבוז מתאים התיאור?",o:["תנועות מיותרות — תזוזת עובדים","ייצור עודף — כמות גדולה מדי","מלאי לא נדרש — טפסים ממתינים","עיבוד עודף — תהליכים מיותרים"],c:3,e:"ביצוע שלבים שאינם מוסיפים ערך — כמו חתימות שאינן משנות את ההחלטה — הוא ״עיבוד עודף — תהליכים מיותרים״ (מספר 7 בשקף 26). הבזבוז אינו בכמות שמיוצרת או בתנועת העובד, אלא בעצם קיומם של שלבים שהלקוח לא ישלם עליהם. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במפעל, מלגזה מעבירה משטחים בין שלושה מחסני ביניים לפני שהם מגיעים לקו הייצור, אף שאפשר היה להביאם ישירות. איזה סוג בזבוז מתואר?",o:["תעבורה","עיבוד עודף","תוצרת פגומה","המתנה"],c:0,e:"שינוע מיותר של חומרים בין מקומות הוא בזבוז ״תעבורה״ (מספר 4 בשקף 26). הוא שונה מ״תנועות מיותרות״, שעניינן תנועות של העובד עצמו בתחנת העבודה (למשל חיפוש כלים או הושטת יד רחוקה). (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתמונה שבשקף הבזבוזים כתוב ״<bdi dir='ltr'>Eight Wastes</bdi>״, אך הרשימה בשקף מונה שבעה. איזה בזבוז מופיע בתמונה ואינו ברשימה?",o:["מלאי לא נדרש שמצטבר במחסנים ובקו הייצור <bdi dir='ltr'>(Inventory)</bdi>","אי-ניצול של כישורי העובדים <bdi dir='ltr'>(Under-utilized People)</bdi>","שינוע מיותר בין מחסנים <bdi dir='ltr'>(Transportation)</bdi>","המתנה של עובדים ומכונות לחלקים ולמידע <bdi dir='ltr'>(Waiting)</bdi>"],c:1,e:"שבעת הבזבוזים ברשימה בשקף 26: תוצרת פגומה, המתנה, מלאי לא נדרש, תעבורה, תנועות מיותרות, ייצור עודף ועיבוד עודף. בתמונה ״<bdi dir='ltr'>Eight Wastes</bdi>״ מופיע בזבוז שמיני — <bdi dir='ltr'>Under-utilized People</bdi>, אי-ניצול של הכישורים והרעיונות של העובדים. (שא-4, שקף 26)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מנהל מפעל מתכנן אירוע קייזן. באיזה שלב עליו לבחור את התהליך לשיפור, להגדיר את גבולותיו ואת המדדים, ולבחור משתתפים — עובדים, ספקים ולקוחות קצה?",o:["בשלב אימוץ השיפור וסגירת התהליך","בשלב סיכום האירוע <bdi dir='ltr'>(Post-Kaizen)</bdi>","בשלב ההתארגנות לאירוע <bdi dir='ltr'>(Pre-Kaizen)</bdi>","בשלב האירוע עצמו <bdi dir='ltr'>(Kaizen Event)</bdi>"],c:2,e:"לפי שקף 27, בשלב ההתארגנות <bdi dir='ltr'>(Pre-Kaizen)</bdi> בוחרים את התהליך לשיפור, מגדירים את המצב הקיים ואת גבולות התהליך, קובעים מדדים ויעדים, בוחרים מנהל ומשתתפים (עובדים, ספקים ולקוחות קצה) ומנתחים את התהליך. באירוע עצמו ממפים, מאתרים בזבוזים ומחליטים. (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"צוות קייזן סיים את האירוע והחליט על שינויים. חודשיים אחר כך הוא משווה את ביצועי התהליך החדש לתהליך הקודם לפי המדדים שנקבעו, ומחליט אם לאמץ את השיפורים. באיזה שלב מדובר?",o:["<bdi dir='ltr'>PDCA</bdi> — שלב התכנון <bdi dir='ltr'>(Plan)</bdi>","<bdi dir='ltr'>Kaizen Event</bdi> — האירוע עצמו","<bdi dir='ltr'>Pre-Kaizen</bdi> — התארגנות לאירוע","<bdi dir='ltr'>Post-Kaizen</bdi> — סיכום האירוע"],c:3,e:"בשלב <bdi dir='ltr'>Post-Kaizen</bdi> (סיכום האירוע) עוקבים אחר המשימות הפתוחות, מדריכים את הצוותים, בוחנים את אפקטיביות התהליך החדש בהשוואה לקודם לפי המדדים שנקבעו, ומחליטים אם לאמץ את השיפורים ולסגור את התהליך. (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"איזו פעולה מתבצעת <b>במהלך</b> אירוע הקייזן עצמו <bdi dir='ltr'>(Kaizen Event)</bdi>, ולא לפניו או אחריו?",o:["בחירת התהליך לשיפור והגדרת גבולותיו","מעקב אחר המשימות הפתוחות אחרי האירוע","הדרכת כל הצוותים בתהליך החדש שאומץ","מיפוי חזותי של המצב הקיים ואיתור הבזבוזים"],c:3,e:"באירוע עצמו (שקף 27): מיפוי חזותי של התהליך במצב הקיים, איתור בזבוזים והצעת רעיונות, חלוקה לצוותים, דיון בחלופות והחלטה, תכנון הביצוע, מדידת התוצאות ותיעוד חזותי של התהליך המשופר. בחירת התהליך היא בהתארגנות <bdi dir='ltr'>(Pre-Kaizen)</bdi>, והדרכה ומעקב הם בסיכום <bdi dir='ltr'>(Post-Kaizen)</bdi>. (שא-4, שקף 27)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בתחנת עבודה מוציאים את כל הכלים והחומרים, משאירים רק את הפריטים החיוניים לעבודה, ואת השאר מאחסנים במקום אחר או זורקים. איזה שלב של <bdi dir='ltr'>5S</bdi> זה?",o:["<bdi dir='ltr'>Sort (Seiri)</bdi> — מיון","<bdi dir='ltr'>Standardize (Seiketsu)</bdi> — תקינה","<bdi dir='ltr'>Shine (Seiso)</bdi> — ניקיון","<bdi dir='ltr'>Straighten (Seiton)</bdi> — סידור"],c:0,e:"לפי שקף 28, <bdi dir='ltr'>Sort (Seiri)</bdi> הוא מיון הכלים, החומרים והמסמכים באזור העבודה ושמירה רק על הפריטים החיוניים — כל השאר מאוחסנים או נזרקים. <bdi dir='ltr'>Straighten</bdi> הוא סידור שיטתי של מה שנשאר לגישה קלה, ו-<bdi dir='ltr'>Shine</bdi> הוא שמירה על אזור עבודה נקי. (שא-4, שקף 28)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במחסן כלי עבודה סימנו על הקיר צללית לכל כלי, כך שכל כלי מוחזר למקום קבוע ומוצא בתוך שניות. איזה שלב של <bdi dir='ltr'>5S</bdi> מיושם?",o:["<bdi dir='ltr'>Straighten (Seiton)</bdi> — סידור שיטתי","<bdi dir='ltr'>Shine (Seiso)</bdi> — ניקיון האזור","<bdi dir='ltr'>Sort (Seiri)</bdi> — מיון וזריקה","<bdi dir='ltr'>Sustain (Shitsuke)</bdi> — שימור הרגל"],c:0,e:"<bdi dir='ltr'>Straighten (Seiton)</bdi> בשקף 28: אזור עבודה מאורגן — ציוד וחומרים מסודרים באופן שיטתי כדי לאפשר את הגישה הקלה והיעילה ביותר. מיון <bdi dir='ltr'>(Sort)</bdi> קודם לו ומחליט מה להשאיר, ושימור <bdi dir='ltr'>(Sustain)</bdi> דואג שהסדר יישמר לאורך זמן. (שא-4, שקף 28)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"בשקף ״יישום ייצור רזה בטויוטה״, מה מתאר המושג <bdi dir='ltr'>Jidoka</bdi>?",o:["תזמון ביקוש","איזון אספקות מול הביקוש","אוטומציה חכמה","איזון קווי ייצור"],c:2,e:"בשקף 29: <bdi dir='ltr'>JIT</bdi> — <bdi dir='ltr'>Just In Time Production</bdi>; <bdi dir='ltr'>Kanban</bdi> — תזמון ביקוש <bdi dir='ltr'>(Pull Systems)</bdi>; איזון קווי ייצור — <bdi dir='ltr'>Takt Time</bdi>; איזון אספקות מול הביקוש — <bdi dir='ltr'>Heijunka</bdi>; זיהוי תקלות, עצירת הקו ופתרון בעיות השורש; אוטומציה חכמה — <bdi dir='ltr'>Jidoka</bdi>; שיפור מתמיד — <bdi dir='ltr'>Kaizen</bdi>; ויישום <bdi dir='ltr'>5S</bdi> בסביבת העבודה. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"לפי שקף טויוטה, איזה מושג מתאר את <b>איזון האספקות מול הביקוש</b>?",o:["<bdi dir='ltr'>Takt Time</bdi>","<bdi dir='ltr'>Heijunka</bdi>","<bdi dir='ltr'>Kaizen</bdi>","<bdi dir='ltr'>Jidoka</bdi>"],c:1,e:"בשקף 29 מוצגים זה לצד זה ״איזון קווי ייצור — <bdi dir='ltr'>Takt Time</bdi>״ ו״איזון אספקות מול הביקוש — <bdi dir='ltr'>Heijunka</bdi>״. <bdi dir='ltr'>Jidoka</bdi> היא אוטומציה חכמה, ו-<bdi dir='ltr'>Kaizen</bdi> הוא שיפור מתמיד. בבית ה-<bdi dir='ltr'>TPS</bdi> שבתמונה, איזון העומסים <bdi dir='ltr'>(Load Leveling)</bdi> מופיע כבסיס הבית. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"מהי המטרה של מערכת הייצור של טויוטה <bdi dir='ltr'>(TPS)</bdi>, כפי שהיא מנוסחת בשקף?",o:["שיפור יעילות תוך צמצום הבזבוז","הגדלת נפחי הייצור והמלאי","הורדת מחיר המכירה ללקוח","ייצור כל רכיב במפעל עצמי"],c:0,e:"בשקף 29: ״המטרה — שיפור יעילות תוך צמצום הבזבוז״. לשם כך משמשים העקרונות — <bdi dir='ltr'>JIT, Kanban</bdi>, איזון קווים ואספקות, <bdi dir='ltr'>Jidoka, Kaizen, 5S</bdi>, הבטחת איכות ושיתוף עובדים, מנהלים וספקים. (שא-4, שקף 29)"},
{t:"ייצור, מיקור חוץ וייצור רזה",s:"שלמה",q:"במקרה <bdi dir='ltr'>Timbuk2</bdi> שהוצג בכיתה, מה אפיין את החברה ואת המוצר האיקוני שלה?",o:["אופניים מותאמים אישית, שמיוצרים בקבלנות משנה ונמכרים בחנויות האופניים","תיקים סטנדרטיים בכמויות גדולות, שמיוצרים בסין ונמכרים ממלאי מרכזי","ציוד רכיבה מקצועי, שמיוצר בהונג קונג ונמסר למפיצים בתנאי <bdi dir='ltr'>FOB</bdi>","תיקי שליח בהתאמה אישית שמיוצרים בסן פרנסיסקו, עם דגש על <bdi dir='ltr'>Just-in-Time</bdi>"],c:3,e:"לפי שקף 32, <bdi dir='ltr'>Timbuk2</bdi> נוסדה ב-1989 במוסך בסן פרנסיסקו על ידי שליח אופניים, ומייצרת מאז ב-<bdi dir='ltr'>Mission District</bdi>. מייסדה היה ״אובססיבי ל-<bdi dir='ltr'>Just-in-Time</bdi>״, החברה הביאה התאמה אישית להמונים והשיקה את הקסטומייזר המקוון הראשון ב-1999 — ותיק השליח המותאם אישית, שמיוצר בסן פרנסיסקו, הוא הלב שלה. (שא-4, שקפים 31–32)"}
]);

BANK.push.apply(BANK,[
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מספנה בונה ספינה לפי חוזה עם לקוח יחיד, וכל הרכש — ממנועים ועד מערכות ניווט — מתחיל רק אחרי חתימת ההזמנה. לפי שקף ״מקומו של ניהול ההזמנות״, מהו סוג הארגון והיכן ממוקמת ההזמנה?",o:["ייצור למלאי — ההזמנה לאחר השלמת הייצור","פרויקט — ההזמנה לאחר הרכש ולפני המסירה","ייצור להזמנה — ההזמנה לפני שלב הייצור בלבד","פרויקט — ההזמנה בתחילת התהליך, עוד לפני הרכש"],c:3,e:"בטבלה בשקף 7: בארגון פרויקטים <bdi dir='ltr'>(Project)</bdi> ההצטיידות היא לפרויקט/להזמנה, וההזמנה בתחילת התהליך — לפני הרכש. בייצור להזמנה <bdi dir='ltr'>(Build to Order)</bdi> ההצטיידות לתחזית והייצור להזמנה, וההזמנה לפני הייצור; בייצור למלאי <bdi dir='ltr'>(Build to Stock)</bdi> ההצטיידות והייצור לתחזית, וההזמנה לאחר הייצור. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"יצרן מחשבים מחזיק מלאי רכיבים לפי תחזית, ומרכיב כל מחשב רק אחרי שהלקוח בחר את התצורה באתר. היכן ממוקמת ההזמנה בתהליך, לפי המצגת?",o:["לאחר המסירה — ייצור לפי התחזית בלבד <bdi dir='ltr'>(Forecast)</bdi>","לפני הרכש — ארגון המנוהל כפרויקט <bdi dir='ltr'>(Project)</bdi>","לאחר הייצור — ייצור למלאי <bdi dir='ltr'>(Build to Stock)</bdi>","לפני הייצור — ייצור להזמנה <bdi dir='ltr'>(Build to Order)</bdi>"],c:3,e:"בייצור להזמנה <bdi dir='ltr'>(Build to Order)</bdi> ההצטיידות היא לתחזית — כמו מלאי הרכיבים — והייצור עצמו להזמנה, ולכן ההזמנה ממוקמת לפני הייצור. בפרויקט ההזמנה קודמת גם לרכש, ובייצור למלאי היא מגיעה אחרי שהמוצר כבר יוצר. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"יצרן משקאות קלים מייצר לפי תחזית ומחזיק מלאי במרכזי ההפצה, ורשתות השיווק מזמינות מהמלאי הקיים. איך מוגדרים ההצטיידות, הייצור ומיקום ההזמנה?",o:["הצטיידות לתחזית, ייצור לתחזית; ההזמנה לאחר הייצור","הצטיידות להזמנה, ייצור לתחזית; ההזמנה לפני הייצור","הצטיידות לתחזית, ייצור להזמנה; ההזמנה לפני הייצור","הצטיידות להזמנה, ייצור להזמנה; ההזמנה לפני הרכש"],c:0,e:"זהו ייצור למלאי <bdi dir='ltr'>(Build to Stock)</bdi>: גם ההצטיידות וגם הייצור מבוססים על תחזית, והזמנת הלקוח מגיעה לאחר הייצור ומסופקת מהמלאי. השילוב של הצטיידות לתחזית עם ייצור להזמנה הוא <bdi dir='ltr'>Build to Order</bdi>, והצטיידות להזמנה מאפיינת ארגון פרויקטים. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מהי ההגדרה של <bdi dir='ltr'>Order Management</bdi> כפי שהיא מופיעה במצגת?",o:["התהליך של תכנון הייצור לפי תחזית, פיצוץ ה-<bdi dir='ltr'>BOM</bdi> והוצאת פקודות עבודה לרצפת הייצור","התהליך של הוצאת הזמנות רכש לספקים, מעקב אחריהן ותשלום לספקים לאחר קבלת הסחורה","התהליך של קביעת מחירי המכירה והמבצעים ללקוחות, ובקרת שולי הרווח של כל הזמנה","התהליך של קבלה, ארגון, מעקב ומילוי של הזמנות הלקוחות למוצרי החברה או לשירותיה"],c:3,e:"שקף 7 מגדיר: ״<bdi dir='ltr'>The process of taking, organizing, tracking and satisfying customer</bdi>'<bdi dir='ltr'>s orders for a company products or services</bdi>״, ובנוסף ארגון תהליך מילוי ההזמנות <bdi dir='ltr'>(Order Fulfillment)</bdi> בחברה יצרנית. הזמנות רכש לספקים הן תפקיד הרכש, ופקודות עבודה הן תוצר של ה-<bdi dir='ltr'>MRP</bdi>. (שא-5, שקף 7)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה מגדירה המצגת כ-<bdi dir='ltr'>Order Fulfilment</bdi>?",o:["מילוי יעדי המכירות השנתיים שנקבעו לאנשי המכירות בארגון","השלמת הזמנות רכש פתוחות מול הספקים הקבועים של הארגון","מילוי מחסני הארגון במלאי מספק לקראת עונת השיא של השנה","רצף הצעדים בטיפול בהזמנת לקוח עד לשביעות רצונו"],c:3,e:"שקף 10: ״<bdi dir='ltr'>Order Fulfilment</bdi> — <bdi dir='ltr'>Sequence of steps involved in processing a customer order to the satisfaction of the customer</bdi>״ — כל שלבי הטיפול בהזמנה, מקבלתה ועד שהלקוח מרוצה. זה אינו מילוי מחסנים ואינו עמידה ביעדי מכירות. (שא-5, שקף 10)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי המצגת, לפי מה נבנה המבנה של יחידת ניהול ההזמנות?",o:["לפי שלבי הייצור — ייצור רכיבים מול הרכבה סופית ובדיקות במפעל","לפי חלוקת הספקים — ספקים מקומיים מול ספקים מחו״ל ומול ספקים גלובליים","לפי סוגי המלאי — חומרי גלם, מלאי בתהליך ותוצרת גמורה","לפי חלוקת הלקוחות — גיאוגרפית, לפי סוגי מוצרים או סוגי שירות"],c:3,e:"בשקף 10: ״מבנה היחידה על פי חלוקת הלקוחות — גיאוגרפי, סוגי מוצר / שירות...״. זה עקבי עם העיקרון של שלמה מהמבוא: מבנה פנים היחידה הארגונית נבנה לפי מבנה לקוחותיה. (שא-5, שקף 10; שא-1, שקף 8)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה תפקידם של אנשי ניהול ההזמנות כלפי הארגון, לפי שקף ״<bdi dir='ltr'>Order Management</bdi> — <bdi dir='ltr'>Order Fulfilment</bdi>״?",o:["לייצג את הלקוחות כלפי השרשרת ולספק תחזית הכנסות וסיכוני אספקה","לנהל את המחסנים ולקבוע היכן יאוחסן כל פריט במרכז הלוגיסטי","לתכנן את קיבולת המפעל ולקבוע את סדר העבודה בכל אחת מהתחנות בקו הייצור","לנהל את המשא ומתן עם הספקים ולקבוע את מחירי הרכש של הרכיבים והחומרים"],c:0,e:"השקף קובע שאנשי ניהול ההזמנות מייצגים את לקוחות הארגון / המכירות כלפי שרשרת האספקה ולהפך, והם אחראים לספק לארגון את תחזית ההכנסות ואת סיכוני האספקות. משא ומתן עם ספקים הוא תפקיד הרכש, ותכנון קיבולת שייך לייצור. (שא-5, שקף 10)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי טבלת מדדי ה-<bdi dir='ltr'>Order Management</bdi>, כיצד נמדד <bdi dir='ltr'>Lead Time</bdi>?",o:["משך הזמן מקבלת ההזמנה ועד אספקת הפריט האחרון, מול ה-<bdi dir='ltr'>SLA</bdi>","משך הזמן מהוצאת הזמנת הרכש ועד קבלת החומר מהספק במחסן הראשי","משך הזמן ממשלוח ההזמנה ללקוח ועד קבלת התשלום המלא ממנו","משך הזמן מתחילת הייצור ועד סיום הבדיקה של המוצר האחרון בהזמנה"],c:0,e:"בשקף 9, <bdi dir='ltr'>Lead Time</bdi> נמדד מול בסיס השוואה של <bdi dir='ltr'>SLA</bdi>, והביצוע בפועל הוא משך הזמן מקבלת ההזמנה ועד אספקת הפריט האחרון — עם תחזית או בלי תחזית. הוא מודד את הזמן שהלקוח ממתין, ולא את זמן הרכש מהספק או את זמן הגבייה. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מחלקת הזמנות שלחה החודש 40 הזמנות. 34 מהן יצאו עד מועד ההתחייבות הראשון, ו-6 יצאו מאוחר יותר. מה ה-<bdi dir='ltr'>OTD</bdi> של המחלקה, והאם היא עומדת ביעד המופיע במצגת?",o:["85% — מתחת ליעד של 90% מההזמנות","85% — מעל היעד של 80% מההזמנות","94% — מעל היעד של 90% מההזמנות","15% — מתחת ליעד של 10% איחורים"],c:0,e:"<bdi dir='ltr'>OTD (On Time Delivery)</bdi> משווה את מועד המשלוח בפועל להתחייבות הראשונה או ל-<bdi dir='ltr'>SLA</bdi>: 34 מתוך 40 הזמנות יצאו בזמן, כלומר 34/40 = 85%. בהערות לשקף מופיעה הגדרת יעד של 90% מההזמנות — ולכן המחלקה מתחת ליעד. 15% הוא שיעור האיחורים ולא ה-<bdi dir='ltr'>OTD</bdi>. (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"הזמנה אחת כוללת 5 שורות (פריטים שונים). 4 שורות נשלחו במועד, ושורה אחת נשלחה באיחור של שבוע. מה ה-<bdi dir='ltr'>OTD</bdi> של הזמנה זו, אם מודדים לפי ההזמנה כולה ואם מודדים לפי שורה?",o:["לפי ההזמנה כולה — 80%; לפי שורה — 0% (שורה אחת איחרה)","לפי ההזמנה כולה — 80%; לפי שורה — 80%, שכן שני המדדים זהים תמיד","לפי ההזמנה כולה — 0% (ההזמנה לא הושלמה בזמן); לפי שורה — 80% (4 מתוך 5)","לפי ההזמנה כולה — 100% (רוב השורות נשלחו); לפי שורה — 80%"],c:2,e:"בשקף 9, <bdi dir='ltr'>OTD</bdi> יכול להימדד על ההזמנה כולה או על כל שורה בהזמנה. לפי ההזמנה כולה, ההזמנה נחשבת בזמן רק אם כל השורות יצאו בזמן — כאן לא, ולכן 0%. לפי שורות, 4 מתוך 5 שורות יצאו בזמן = 80%. ההבדל הזה הוא שמוביל לשאלה אם לפצל הזמנות <bdi dir='ltr'>(Split Order)</bdi>. (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בהערות למדד ה-<bdi dir='ltr'>OTD</bdi> מופיעה ״בחינת פיצול הזמנות <bdi dir='ltr'>(Split Order)</bdi>״. מה ההיגיון בבחינה זו?",o:["כדי לעמוד ביעד <bdi dir='ltr'>OTD</bdi>, כדאי לפצל כל הזמנה גדולה לכמה הזמנות קטנות מראש ובאופן קבוע","כדי להגדיל את ה-<bdi dir='ltr'>Lead Time</bdi>, כדאי לדחות את המשלוח עד שהמלאי כולו זמין","כששורה אחת מעכבת הזמנה שלמה, ייתכן שכדאי לשלוח את השורות הזמינות מיד","כדי להקטין את מספר המשלוחים, כדאי לאחד כמה הזמנות של לקוחות שונים"],c:2,e:"כשמודדים <bdi dir='ltr'>OTD</bdi> לפי ההזמנה כולה, שורה חסרה אחת מכשילה את כל ההזמנה. פיצול ההזמנה — שליחת השורות הזמינות בזמן וההשלמה בהמשך — עשוי לשפר את השירות ללקוח, אך מגדיל את מספר המשלוחים ועלותם, ולכן יש לבחון אותו. איחוד הזמנות של לקוחות שונים הוא נושא לוגיסטי אחר. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מתוך 50 הזמנות בחודש, 5 איחרו: באיחורים של 2, 3, 4, 5 ו-6 ימים. מהו ״מספר ימי האיחור״ הממוצע לפי ההגדרה במצגת?",o:["20 ימים — סך ימי האיחור בכל ההזמנות המאחרות","4 ימים — ממוצע על ההזמנות המאחרות בלבד","0.4 ימים — ממוצע ימי האיחור על כל 50 ההזמנות","5 ימים — מספר ההזמנות שאיחרו בחודש"],c:1,e:"בשקף 9, ״מספר ימי איחור״ משווה את מועד המשלוח בפועל למועד ההתחייבות, וההערה מדגישה: ״הזמנות מאחרות בלבד״. לכן (2+3+4+5+6)/5 = 20/5 = 4 ימים. חלוקה בכל 50 ההזמנות מטשטשת את חומרת האיחורים, ו-5 הוא ״מספר ההזמנות המאחרות״ — מדד נפרד <bdi dir='ltr'>(Counter)</bdi>. (שא-5, שקף 9)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה ההבדל בין המדד ״מספר הזמנות מאחרות״ לבין המדד ״מספר ימי איחור״ בטבלת המדדים?",o:["הראשון נמדד רק על הזמנות שלמות; השני נמדד רק על שורות בודדות בתוך ההזמנות הפתוחות של הלקוח","הראשון הוא מונה <bdi dir='ltr'>(Counter)</bdi> של הזמנות; השני מודד את משך האיחור בהזמנות המאחרות בלבד","הראשון נמדד מול ה-<bdi dir='ltr'>SLA</bdi>; השני נמדד מול התחזית שהכין אגף המכירות בתחילת השנה עבור כל לקוח","שניהם מודדים אותו דבר, אלא שהראשון מבוטא באחוזים והשני מבוטא בימי עבודה מלאים בחודש"],c:1,e:"בשקף 9 שני המדדים משווים את מועד ההתחייבות לאספקה למועד המשלוח בפועל. ״מספר הזמנות מאחרות״ מסומן בהערות כ״מונה — <bdi dir='ltr'>Counter</bdi>״ — כמה הזמנות איחרו; ״מספר ימי איחור״ מסומן ״הזמנות מאחרות בלבד״ — בכמה זמן הן איחרו. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה פירוש הראשי תיבות <bdi dir='ltr'>SLA</bdi>, המופיע כבסיס ההשוואה של רוב מדדי ניהול ההזמנות?",o:["<bdi dir='ltr'>Sales Level Assessment</bdi> — הערכת רמת המכירות","<bdi dir='ltr'>Supply Lead Allocation</bdi> — הקצאת זמן אספקה","<bdi dir='ltr'>Stock Level Adjustment</bdi> — התאמת רמת המלאי","<bdi dir='ltr'>Service Level Agreement</bdi> — הסכם רמת שירות"],c:3,e:"בתחתית שקף 9 מודגש: ״<bdi dir='ltr'>SLA</bdi> — <bdi dir='ltr'>Service Level Agreement</bdi>״ — ההסכם עם הלקוח על רמת השירות, למשל זמן אספקה מוסכם. הוא בסיס ההשוואה ל-<bdi dir='ltr'>Lead Time</bdi>, ל-<bdi dir='ltr'>OTD</bdi> ולמועד ההתחייבות. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מה בודק המדד <bdi dir='ltr'>Commitment date</bdi> בטבלת מדדי ניהול ההזמנות?",o:["את מספר ההתחייבויות שנדחו, מול יעד של 90%","את מועד קבלת ההזמנה, מול מועד תחילת הייצור בפועל","את מועד ההתחייבות הראשון שניתן ללקוח, מול ה-<bdi dir='ltr'>SLA</bdi> המוסכם","את מועד המשלוח בפועל, מול מועד ההתחייבות"],c:2,e:"בשקף 9, ל-<bdi dir='ltr'>Commitment date</bdi> בסיס ההשוואה הוא ה-<bdi dir='ltr'>SLA</bdi>, והביצוע בפועל הוא ״מועד התחייבות ראשון״ — האם המועד שהובטח ללקוח עומד ברמת השירות המוסכמת. השוואת מועד המשלוח בפועל למועד ההתחייבות היא דווקא המדדים של הזמנות מאחרות וימי איחור. (שא-5, שקף 9)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בתחנת ייצור ממתינות שלוש הזמנות: א׳ דורשת 6 שעות עבודה, ב׳ — 2 שעות, ג׳ — 4 שעות. לפי כלל <bdi dir='ltr'>SPT</bdi>, מה סדר הטיפול?",o:["א׳ ← ב׳ ← ג׳","ב׳ ← ג׳ ← א׳","א׳ ← ג׳ ← ב׳","ג׳ ← ב׳ ← א׳"],c:1,e:"<bdi dir='ltr'>SPT</bdi> — <bdi dir='ltr'>Shortest Process Time</bdi> — מטפל קודם בהזמנה שמשך הזמן הנדרש לה הקצר ביותר: ב׳ (2 שעות), אחריה ג׳ (4) ולבסוף א׳ (6). הסדר ההפוך מתחיל דווקא בהזמנה הארוכה ביותר, והסדר א׳-ב׳-ג׳ הוא סדר ההגעה <bdi dir='ltr'>(FIFO)</bdi>, לא <bdi dir='ltr'>SPT</bdi>. (שא-5, שקף 11)",k:"calc"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"שלוש הזמנות ממתינות לייצור: הזמנה <bdi dir='ltr'>X</bdi> — מועד יעד 20 בחודש; הזמנה <bdi dir='ltr'>Y</bdi> — מועד יעד 12 בחודש; הזמנה <bdi dir='ltr'>Z</bdi> — מועד יעד 15 בחודש. לפי כלל <bdi dir='ltr'>EDD</bdi>, באיזו הזמנה יטפלו ראשונה?",o:["בהזמנה שזמן העבודה הנדרש עליה הקצר ביותר","בהזמנה <bdi dir='ltr'>X</bdi> — היא הגיעה ראשונה לתחנה","בהזמנה <bdi dir='ltr'>Y</bdi> — מועד היעד שלה (ה-12 בחודש) המוקדם ביותר","בהזמנה <bdi dir='ltr'>Z</bdi> — מועד היעד שלה באמצע"],c:2,e:"<bdi dir='ltr'>EDD</bdi> — <bdi dir='ltr'>Earliest Due Date</bdi> — מתעדף לפי תאריך היעד: קודם ההזמנה שמועד היעד שלה המוקדם ביותר (<bdi dir='ltr'>Y</bdi>, ה-12 בחודש), אחריה <bdi dir='ltr'>Z</bdi> ואחר כך <bdi dir='ltr'>X</bdi>. טיפול לפי סדר הגעה הוא <bdi dir='ltr'>FIFO</bdi>, וטיפול לפי זמן העבודה הקצר הוא <bdi dir='ltr'>SPT</bdi>. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"מחסן חלקי חילוף מטפל בבקשות לפי הסדר שבו הגיעו, בלי קשר לדחיפותן או לגודלן. איזה כלל קדימות מופעל?",o:["לפי שווי ההזמנה או רווחיותה","<bdi dir='ltr'>SPT</bdi> — לפי משך הזמן הנדרש","<bdi dir='ltr'>FIFO</bdi> — לפי מועד הגעת ההזמנה","<bdi dir='ltr'>EDD</bdi> — לפי מועד היעד המוקדם"],c:2,e:"בשקף 11, <bdi dir='ltr'>FIFO</bdi> מתואר כקדימות ״לפי מועד הגעת ההזמנה״ (ובשקף מופיעה גם שאלה: או לפי תחזית?). <bdi dir='ltr'>SPT</bdi> מתעדף לפי משך הזמן הנדרש, <bdi dir='ltr'>EDD</bdi> לפי תאריך היעד, ושאר הקדימויות לפי זמינות החומר, שווי ההזמנה או חשיבות הלקוח. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"במפעל חסר רכיב, והמלאי שהגיע מספיק רק לחלק מההזמנות. מנהלת ההזמנות מקצה אותו קודם להזמנות שבזכותו ייסגרו במלואן. איזו קדימות היא מפעילה?",o:["שווי ההזמנה — קדימות להזמנות הרווחיות ביותר","זמינות החומר — קדימות לסגירת הזמנות מלאות","חשיבות הלקוח — קדימות ללקוחות האסטרטגיים","<bdi dir='ltr'>EDD</bdi> — קדימות להזמנה שמועד היעד שלה מוקדם"],c:1,e:"בין כללי הקדימות בשקף 11 מופיע: ״זמינות החומר — קדימות לסגירת הזמנות מלאות״ — הקצאת החומר המוגבל כך שהזמנות שלמות ייסגרו, במקום לפזר אותו על הזמנות רבות שיישארו חלקיות. שווי ההזמנה, <bdi dir='ltr'>EDD</bdi> וחשיבות הלקוח הם כללי קדימות אחרים באותו שקף. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"איזה מהבאים <b>אינו</b> מופיע בשקף ״ניהול קדימות ההזמנות — <bdi dir='ltr'>Allocation / Priority</bdi>״?",o:["קדימות להזמנה שהזמן שחלף מאז משלוחה הקודם ארוך ביותר","קדימות לפי שווי ההזמנה או לפי רווחיותה עבור הארגון כולו","קדימות לפי משך הזמן הנדרש לטיפול בכל הזמנה ומשלוח <bdi dir='ltr'>(SPT)</bdi>","קדימות לפי חשיבות הלקוח שהזמין את המוצרים"],c:0,e:"שקף 11 מונה: <bdi dir='ltr'>SPT</bdi> (משך הזמן הנדרש), <bdi dir='ltr'>EDD</bdi> (תאריך היעד), <bdi dir='ltr'>FIFO</bdi> (מועד הגעת ההזמנה), זמינות החומר (קדימות לסגירת הזמנות מלאות), שווי ההזמנה / רווחיות, וחשיבות הלקוח. קדימות לפי הזמן שחלף מהמשלוח הקודם אינה ברשימה. (שא-5, שקף 11)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"לפי שקף ״<bdi dir='ltr'>On line</bdi> — <bdi dir='ltr'>Order Management</bdi>״, מדוע מערך ניהול ההזמנות קריטי לחברה שמוכרת באינטרנט?",o:["כי באינטרנט הלקוח מזמין ישירות מהספק, ולכן הארגון אחראי רק לגבייה ולא לאספקה עצמה","כי ניהול ההזמנות הוא פעילות ליבה — הקשר של הארגון עם הלקוח, ומכירות <bdi dir='ltr'>On Line</bdi> מבוססות עליו","כי מכירה באינטרנט מבטלת את הצורך במלאי, ולכן ההזמנות הן המדד היחיד שנותר לארגון לנהל ולמדוד","כי מכירות באינטרנט אינן כפופות ל-<bdi dir='ltr'>SLA</bdi>, ולכן יש צורך במערך שיקבע לכל לקוח מועד אספקה נפרד משלו"],c:1,e:"בשקף 12: ״ניהול ההזמנות הינה פעילות ליבה של שרשרת האספקה — הקשר של הארגון עם הלקוח!״, ומערכות המכירה באינטרנט <bdi dir='ltr'>(On Line Sales)</bdi> מבוססות על מערך ניהול ההזמנות: קישור הלקוחות לספקים, קליטת הזמנות ומעקב אחר ביצוען, התחשבנות עם הלקוחות והספקים ושירות לקוחות לאחר מכירה. (שא-5, שקף 12)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בתרשים תהליכי הליבה של תפעול בהייטק <bdi dir='ltr'>(High-Tech Operations Core processes)</bdi>, איזה רצף מופיע בשורת ה-<bdi dir='ltr'>Delivery</bdi>?",o:["<bdi dir='ltr'>Order Mng., Sourcing, Pilot, Production, Repair, Logistics</bdi>","<bdi dir='ltr'>Material Mng., Purchasing, Order Mng., Production, Logistics</bdi>","<bdi dir='ltr'>Service Inventory, Reverse Logistics, Repair, Order Mng</bdi>.","<bdi dir='ltr'>Sourcing, Purchasing, Pilot, Development, Production, Logistics</bdi>"],c:1,e:"בשקף 4 שלוש שורות: <bdi dir='ltr'>Development</bdi> — <bdi dir='ltr'>Sourcing, Purchasing, Pilot</bdi>; <bdi dir='ltr'>Delivery</bdi> — <bdi dir='ltr'>Material Mng., Purchasing, Order Mng., Production, Logistics</bdi> (ו-<bdi dir='ltr'>Order Mng</bdi>. מודגש בעיגול); <bdi dir='ltr'>Service</bdi> — <bdi dir='ltr'>Service Inventory, Reverse Logistics, Repair</bdi>. שורת ה-<bdi dir='ltr'>Delivery</bdi> היא בדיוק חמשת הבלוקים של שרשרת האספקה הפנים-ארגונית. (שא-5, שקף 4)"},
{t:"ניהול הזמנות לקוח",s:"שלמה",q:"בעץ ה-<bdi dir='ltr'>KPI</bdi> של ניהול ההזמנות, לאיזה ענף שייכים המדדים <bdi dir='ltr'>Delayed orders</bdi> ו-<bdi dir='ltr'>Lost Orders</bdi>?",o:["<bdi dir='ltr'>Operational Cost</bdi>","<bdi dir='ltr'>Forecast Accuracy</bdi>","<bdi dir='ltr'>Revenue Shortages</bdi>","<bdi dir='ltr'>On Time Delivery</bdi>"],c:2,e:"בעץ ה-<bdi dir='ltr'>KPI</bdi>, הענף <bdi dir='ltr'>Revenue Shortages</bdi> — הכנסות שנפגעו בגלל חוסרים — כולל את <bdi dir='ltr'>Delayed orders</bdi> ואת <bdi dir='ltr'>Lost Orders</bdi>. ענף <bdi dir='ltr'>On Time Delivery</bdi> כולל את <bdi dir='ltr'>Average day Delay</bdi> ואת <bdi dir='ltr'>Number of delays</bdi>, ו-<bdi dir='ltr'>Forecast Accuracy</bdi> כולל <bdi dir='ltr'>Coverage, Undershoot</bdi> ו-<bdi dir='ltr'>Overshoot</bdi>. (שא-5, שקף 8)"}
]);

BANK.push.apply(BANK,[
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי טבלת מדדי הלוגיסטיקה, כיצד נמדדת ״עלות כלל המערכת הלוגיסטית״?",o:["כמספר המשלוחים הכולל שיצאו מהמחסן בחודש","כסך העלות השנתית של כל השילוח הימי והאווירי יחד","כיחס בין נפח האחסון המנוצל לנפח המשולם","כיחס בין העלויות הלוגיסטיות לבין המכירות או ה-<bdi dir='ltr'>COGS</bdi>"],c:3,e:"בשקף 6, המדד הכולל ״עלות כלל המערכת הלוגיסטית״ נמדד כיחס בין העלויות הלוגיסטיות למכירות או ל-<bdi dir='ltr'>COGS</bdi> — כך אפשר להשוות בין תקופות ובין היקפי פעילות. מספר המשלוחים הוא מדד שילוח, ונצילות נפח אחסון היא מדד מחסן. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מנהל לוגיסטיקה מציע להנהלה להעביר את רוב המשלוחים הדחופים מאוויר לים. איזה מדד שילוח רלוונטי להחלטה, ומה הדגש לגביו במצגת?",o:["אמינות המלאי — חוסרים ועודפים ברמה התפעולית וברמה הפיננסית של המחסן בפועל","תנועות המלאי — היקף התנועות הכולל במחסן, <bdi dir='ltr'>Transactions</bdi>","יחס המשלוחים — מהיר : ים : אוויר; עלות משלוח אווירי כחמש מונים מימי","נצילות נפח האחסון — נפח מנוצל מתוך הנפח הקיים או המשולם במחסן המרכזי"],c:2,e:"במדדי השילוח בשקף 6 מופיע ״יחס משלוחים: שילוח מהיר : ים : אוויר״, ולצדו הדגש ״יחס עלות משלוח ים : אוויר 5:1״ — משלוח אווירי יקר פי כחמישה. לכן העברת משלוחים מאוויר לים חוסכת, אך מאריכה את זמן האספקה. נצילות נפח, אמינות מלאי ותנועות מלאי הם מדדי מחסן. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"משלוח של כריות קלות ונפחיות מחויב לפי נפחו ולא לפי משקלו בפועל. באיזה מדד לוגיסטי עוסק הנושא, ומה המושג שבשקף?",o:["יעילות משלוח — <bdi dir='ltr'>Chargeable Weight</bdi>, יחס בין המשקל למשקל הנפחי","יחס משלוחים — שילוח מהיר מול ים ואוויר בכל תקופה","אמינות המלאי — <bdi dir='ltr'>Inventory Accuracy</bdi>, יחס חוסרים ועודפים במחסן הראשי","תנועות מלאי — <bdi dir='ltr'>Transactions</bdi>, היקף הקליטות והניפוקים במחסן לאורך החודש"],c:0,e:"בשקף 6, ״יעילות משלוח״ נמדדת כיחס בין המשקל למשקל הנפחי, והדגש הוא <bdi dir='ltr'>Chargeable Weight</bdi> — נפח : משקל. מטען נפחי וקל מחויב לפי נפחו, ולכן אריזה יעילה חוסכת בעלות השילוח. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה הדגש שמופיע במצגת לצד המדד ״מספר משלוחים כולל״?",o:["שילוח ישיר","שילוח מהיר","איחוד משלוחים","פיצול משלוחים"],c:2,e:"בטבלת מדדי הלוגיסטיקה, לצד ״מספר משלוחים כולל״ מופיע הדגש ״איחוד משלוחים״ — צמצום מספר המשלוחים על ידי איחודם מוזיל את עלות השילוח. בדומה, בשקף <bdi dir='ltr'>LCL/FCL</bdi> מוצג המעבר <bdi dir='ltr'>LCL</bdi> → <bdi dir='ltr'>FCL</bdi>, איחוד מטענים חלקיים למכולה מלאה. (שא-6, שקפים 6, 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בספירת מלאי נמצאו במחסן פערים בין הכמויות הרשומות במערכת לכמויות בפועל — חוסרים בחלק מהפריטים ועודפים באחרים. איזה מדד מחסן מתאר זאת?",o:["יעילות המשלוח — <bdi dir='ltr'>Chargeable Weight</bdi>","נצילות נפח האחסון — נפח מנוצל","אמינות המלאי — <bdi dir='ltr'>Inventory Accuracy</bdi>","תנועות המלאי — <bdi dir='ltr'>Transactions</bdi>"],c:2,e:"בשקף 6, ״אמינות המלאי״ נמדדת לפי החוסרים והעודפים — ברמה התפעולית ובערך הפיננסי — ומכונה <bdi dir='ltr'>Inventory Accuracy</bdi>. נצילות נפח האחסון מודדת נפח מנוצל מתוך הקיים או המשולם, ותנועות המלאי מודדות את היקף הפעילות. (שא-6, שקף 6)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מעל טבלת מדדי הלוגיסטיקה מופיעה השאלה ״<bdi dir='ltr'>Logistics</bdi> — <bdi dir='ltr'>Cost Center or Profit center</bdi>?״, ומתחתיה ״<bdi dir='ltr'>Logistics Cost Allocation</bdi> — <bdi dir='ltr'>Project / Order / Department</bdi>״. מה מבטאים שני הכיתובים?",o:["הלוגיסטיקה היא תמיד מרכז עלות, ולכן אין טעם להקצות את עלויותיה לגורמים שונים בארגון","אפשר לנהל את הלוגיסטיקה גם כמרכז רווח, ולהקצות את עלותה לפרויקט, להזמנה או למחלקה","הלוגיסטיקה היא תמיד מרכז רווח, ולכן היא גובה מכל מחלקה מחיר שוק מלא על כל שירות","הלוגיסטיקה נמדדת רק לפי מספר המשלוחים, ולכן אין צורך להקצות את עלויותיה לפי פרויקט"],c:1,e:"שקף 6 שואל אם הלוגיסטיקה היא מרכז עלות או מרכז רווח — בהלימה למטרה של שרשרת האספקה לעבור ממרכז עלות למרכז רווח — ומדגיש הקצאה של העלויות הלוגיסטיות לפרויקט, להזמנה או למחלקה, כדי שכל גורם יידע כמה הלוגיסטיקה שלו עולה. (שא-6, שקף 6; שא-7, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המצגת, מהי לוגיסטיקה?",o:["ניהול זרימת החומר מהספק ללקוח","ניהול ההזמנות המתקבלות מהלקוחות","ניהול מלאי חומרי הגלם במפעל ובמחסנים","ניהול משא ומתן עם ספקי ההובלה והשילוח"],c:0,e:"שקף 7 מגדיר לוגיסטיקה כ״ניהול זרימת החומר מהספק ללקוח״, ומפרט את התהליך: שינוע נכנס (יבוא), אחסון (קליטה למלאי, ניהול המלאי, מלאי חומרי גלם), העברה לייצור (מלאי בתהליך, ניפוק לייצור), אחסון תוצרת גמורה (ליקוט, אריזה), והפצה (משלוח ללקוח, יצוא). (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מהו הסדר הנכון של שלבי התהליך הלוגיסטי שבמצגת?",o:["העברה לייצור ← שינוע נכנס ← אחסון תוצ״ג ← אחסון ← הפצה ← לקוח","שינוע נכנס ← אחסון ← העברה לייצור ← אחסון תוצ״ג ← הפצה ← לקוח","אחסון ← שינוע נכנס ← הפצה ← העברה לייצור ← אחסון תוצ״ג ← לקוח","שינוע נכנס ← העברה לייצור ← אחסון ← הפצה ← אחסון תוצ״ג ← לקוח"],c:1,e:"בשקף 7 החומר זורם כך: שינוע נכנס (יבוא) ← אחסון (קליטה למלאי וניהול מלאי חומרי גלם) ← העברה לייצור (מלאי בתהליך, ניפוק) ← אחסון תוצרת גמורה (ליקוט ואריזה) ← הפצה (משלוח ללקוח, יצוא) ← לקוח. (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"עובד במחסן אוסף פריטים ממדפים שונים לפי הזמנת לקוח ומכין אותם לאריזה. באיזה שלב של התהליך הלוגיסטי הוא נמצא?",o:["אחסון תוצרת גמורה — ליקוט ואריזה","אחסון — קליטה למלאי וניהול המלאי","שינוע נכנס — קבלת סחורה מיבוא","העברה לייצור — ניפוק חומר לייצור"],c:0,e:"בשקף 7, שלב האחסון של התוצרת הגמורה כולל ליקוט ואריזה, ואחריו מגיעה ההפצה (משלוח ללקוח). ניפוק לייצור שייך להעברה לייצור, וקליטה למלאי שייכת לאחסון חומרי הגלם שבתחילת התהליך. (שא-6, שקף 7)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המצגת, מה מתאר המונח <bdi dir='ltr'>3PL</bdi>?",o:["<bdi dir='ltr'>Cargo Owners</bdi> — בעלי המטען שמבצעים את הכול בעצמם","<bdi dir='ltr'>Full Turn Key</bdi> — ניהול שרשרת האספקה כולה","<bdi dir='ltr'>Subcontracting</bdi> — קבלנות משנה של הובלה בלבד","<bdi dir='ltr'>Outsourcing</bdi> — מיקור חוץ לספק שירותים לוגיסטיים חיצוני"],c:3,e:"בשקף 9: <bdi dir='ltr'>2PL = Subcontracting</bdi> (מובילים — <bdi dir='ltr'>Transportation), 3PL = Outsourcing</bdi> (ספקי שירותים לוגיסטיים — <bdi dir='ltr'>Logistics), 4PL = Full Turn Key</bdi> (ספקים מובילים ויועצים — ניהול שרשרת האספקה). <bdi dir='ltr'>1PL</bdi> הם בעלי המטען עצמם — יצרנים וקמעונאים. (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"חברה מעבירה לגורם חיצוני את ניהול שרשרת האספקה הלוגיסטית כולה — כולל תיאום בין כמה ספקי שירות, תכנון הרשת וייעוץ. לאיזו רמת שירות לוגיסטי זה מתאים?",o:["<bdi dir='ltr'>1PL</bdi> — <bdi dir='ltr'>Cargo Owners</bdi>","<bdi dir='ltr'>2PL</bdi> — <bdi dir='ltr'>Subcontracting</bdi>","<bdi dir='ltr'>3PL</bdi> — <bdi dir='ltr'>Outsourcing</bdi>","<bdi dir='ltr'>4PL</bdi> — <bdi dir='ltr'>Full Turn Key</bdi>"],c:3,e:"<bdi dir='ltr'>4PL</bdi> בשקף 9 הם <bdi dir='ltr'>Lead Logistics Providers</bdi> & <bdi dir='ltr'>Consultants</bdi>, שמספקים <bdi dir='ltr'>Supply Chain Management</bdi>, ובהשוואה של שלמה: <bdi dir='ltr'>4PL = Full Turn Key. 3PL</bdi> הוא מיקור חוץ של השירות הלוגיסטי עצמו, <bdi dir='ltr'>2PL</bdi> הוא קבלנות משנה של הובלה, ו-<bdi dir='ltr'>1PL</bdi> הם בעלי המטען. (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"יצרן שוכר חברת הובלות שמעבירה משאיות מהמפעל ללקוחות, בעוד שהאחסון, התכנון וניהול המלאי נשארים אצלו. לאיזו רמה זה מתאים?",o:["<bdi dir='ltr'>4PL</bdi> — <bdi dir='ltr'>Full Turn Key</bdi> של שרשרת האספקה","<bdi dir='ltr'>1PL</bdi> — ביצוע ההובלה בכוחות עצמיים בלבד","<bdi dir='ltr'>3PL</bdi> — <bdi dir='ltr'>Outsourcing</bdi> של כל השירות הלוגיסטי","<bdi dir='ltr'>2PL</bdi> — <bdi dir='ltr'>Subcontracting</bdi> של שירותי ההובלה"],c:3,e:"<bdi dir='ltr'>2PL</bdi> בשקף 9 הם המובילים <bdi dir='ltr'>(Carriers)</bdi>, שמספקים הובלה <bdi dir='ltr'>(Transportation)</bdi> — ובהשוואה של שלמה <bdi dir='ltr'>2PL = Subcontracting</bdi>. כשרק ההובלה עוברת לגורם חיצוני, זו קבלנות משנה ולא מיקור חוץ לוגיסטי מלא <bdi dir='ltr'>(3PL)</bdi> או ניהול השרשרת כולה <bdi dir='ltr'>(4PL)</bdi>. (שא-6, שקף 9)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי פירמידת ״<bdi dir='ltr'>Logistics Outsourcing levels</bdi> & <bdi dir='ltr'>trends</bdi>״, מה מבטא החץ ״<bdi dir='ltr'>From Pure Logistics to APL</bdi> — <bdi dir='ltr'>All Party Logistics</bdi>״?",o:["ספקי הלוגיסטיקה מרחיבים שירותים — משילוח בסיסי ועד רכש, תכנון חומר ומימון","חברות ההובלה הופכות ליצרניות בעצמן ומייצרות את המוצרים שהן מובילות ללקוחות","ספקי הלוגיסטיקה מצמצמים את שירותיהם ומתמקדים בשילוח ובהובלה הבין-לאומית","הארגונים מחזירים את הלוגיסטיקה לתוכם ומבטלים בהדרגה את מיקור החוץ הלוגיסטי"],c:0,e:"בשקף 8 הפירמידה עולה מ-<bdi dir='ltr'>All In-house</bdi>, דרך <bdi dir='ltr'>Shipments</bdi> & <bdi dir='ltr'>Forwarding, Drop Shipments</bdi> & <bdi dir='ltr'>Consolidations, Global Hubs, Value Added Services, Service/Reverse Logistics</bdi> & <bdi dir='ltr'>Repair, Supply Chain Services, Inventory Management</bdi> ו-<bdi dir='ltr'>Purchasing</bdi>, ועד <bdi dir='ltr'>Material Planning</bdi> ו-<bdi dir='ltr'>Financing</bdi> (מימון חומרי גלם ותוצרת גמורה). החץ מתאר מעבר מ״לוגיסטיקה טהורה״ לספק שנותן את כל השירותים. (שא-6, שקף 8)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי המלל שבשקף ״<bdi dir='ltr'>Logistics Outsourcing levels</bdi> & <bdi dir='ltr'>trends</bdi>״, איזו מגמה מתרחשת בין יצרני ה-<bdi dir='ltr'>EMS</bdi> לבין ספקי הלוגיסטיקה?",o:["ספקי הלוגיסטיקה נעים לייצור אלקטרוני, ויצרני <bdi dir='ltr'>EMS</bdi> מוותרים על שירותי הייצור שלהם","יצרני <bdi dir='ltr'>EMS</bdi> וספקי הלוגיסטיקה מתאחדים לחברה אחת, בכל מדינה שבה הם פועלים","יצרני <bdi dir='ltr'>EMS</bdi> נעים לשירותים לוגיסטיים, וספקי הלוגיסטיקה מציעים שירותי שרשרת אספקה מלאים","יצרני <bdi dir='ltr'>EMS</bdi> מוציאים את הלוגיסטיקה לספקים, וספקי הלוגיסטיקה חוזרים לשילוח בלבד"],c:2,e:"בשקף 8 כתוב: ״<bdi dir='ltr'>EMSs are moving toward Logistics Services While Logistics vendors [are] offering Supply Chain Services</bdi>״ — שני סוגי הספקים מרחיבים את היצע השירותים שלהם זה לעבר זה. באותה רוח, בשא-4 מסומנות מגמות <bdi dir='ltr'>EMS</bdi> ו-<bdi dir='ltr'>ODM</bdi> בפירמידת מיקור החוץ. (שא-6, שקף 8; שא-4, שקף 20)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי שקף ״התפתחות המרכזים הלוגיסטיים״, מה מוסיף מרכז לוגיסטי <bdi dir='ltr'>(Logistics Center)</bdi> על מחסן רגיל?",o:["משלוחים ישירים ללקוחות","שירותי ערך מוסף <bdi dir='ltr'>(VAS)</bdi>","ניהול מלא של הזמנות","אחסון וניהול מלאי"],c:1,e:"בשקף 10 המרכזים מוצגים כמעגלים מתרחבים: מחסן <bdi dir='ltr'>(Warehouse)</bdi> — אחסון וניהול מלאי; מרכז לוגיסטי — מוסיף שירותי ערך מוסף <bdi dir='ltr'>(VAS)</bdi>; מרכז הפצה <bdi dir='ltr'>(DC)</bdi> — מוסיף משלוחים ללקוחות; מרכז הזמשה <bdi dir='ltr'>(FC)</bdi> — מוסיף ניהול הזמנות. (שא-6, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"חברת סחר מקוון מחפשת מתקן שיקלוט את הזמנות הלקוחות באתר, ילקט ויארוז אותן, ישלח אותן ללקוחות ויאחסן את המלאי. איזה סוג מרכז מתאים לה?",o:["מרכז הפצה — <bdi dir='ltr'>Distribution Center (DC)</bdi>","מרכז הזמשה — <bdi dir='ltr'>Fulfilment Center (FC)</bdi>","מרכז לוגיסטי — <bdi dir='ltr'>Logistics Center</bdi>","מחסן — <bdi dir='ltr'>Warehouse</bdi>, לאחסון בלבד"],c:1,e:"מרכז הזמשה <bdi dir='ltr'>(FC)</bdi> הוא הרמה הרחבה ביותר בשקף 10: הוא כולל את כל יכולות המרכזים שמתחתיו — אחסון, ניהול מלאי, שירותי ערך מוסף ומשלוחים ללקוחות — ומוסיף עליהם ניהול הזמנות. מרכז הפצה <bdi dir='ltr'>(DC)</bdi> שולח ללקוחות, אך אינו מנהל את ההזמנות עצמן. (שא-6, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה מגדירים תנאי ה-<bdi dir='ltr'>IncoTerms</bdi> המוצגים בפרק הלוגיסטיקה?",o:["את גודל המכולות ואת המשקל המרבי המותר בהן","את המכסים ומסי היבוא שחלים על כל סוג של סחורה בנמל היעד שבו היא נפרקת","את חלוקת האחריות, העלויות והסיכון בין המוכר לקונה במשלוח","את זמני ההובלה המרביים המותרים בין נמלי המוצא לנמלי היעד בעולם"],c:2,e:"<bdi dir='ltr'>IncoTerms</bdi> (שקפים 11–12) הם תנאי הסחר הבין-לאומיים, המגדירים עד איזו נקודה המוכר אחראי לסחורה ולעלויותיה, וממנה עוברים האחריות והסיכון לקונה. בשא-3 הם מופיעים כאחד הפרמטרים המשפיעים על המחיר, ובמקרה <bdi dir='ltr'>Cardo</bdi> המסירה היא בתנאי <bdi dir='ltr'>FOB</bdi> — מסירה על האונייה. (שא-6, שקף 11; שא-3, שקף 10)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"יבואן קטן שולח בכל חודש כמה משטחים בלבד מהמזרח הרחוק, ומטענו חולק מכולה עם מטענים של יבואנים אחרים. באיזו שיטת משלוח מדובר?",o:["<bdi dir='ltr'>LCL</bdi> — <bdi dir='ltr'>Less Than Container Load</bdi>","<bdi dir='ltr'>FCL</bdi> — <bdi dir='ltr'>Full Container Load</bdi> (מכולה מלאה)","<bdi dir='ltr'>Drop</bdi> — משלוח ישיר מהספק אל הלקוח","<bdi dir='ltr'>Courier</bdi> — שילוח מהיר של חבילות קטנות"],c:0,e:"<bdi dir='ltr'>LCL (Less Than Container Load)</bdi> הוא מטען שאינו ממלא מכולה, ולכן חולק אותה עם מטענים אחרים; <bdi dir='ltr'>FCL (Full Container Load)</bdi> הוא מכולה מלאה של שולח אחד. בשקף 13 מופיעים גם המעברים <bdi dir='ltr'>LCL</bdi> → <bdi dir='ltr'>FCL</bdi> (איחוד מטענים חלקיים למכולה מלאה) ו-<bdi dir='ltr'>FCL</bdi> → <bdi dir='ltr'>LCL</bdi> (פירוק מכולה מלאה למשלוחים חלקיים). (שא-6, שקף 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מרכז לוגיסטי מקבל משלוחים קטנים מכמה ספקים באותה מדינה, ומאחד אותם למכולה מלאה אחת לפני ההפלגה. איזה מעבר מתואר?",o:["<bdi dir='ltr'>FCL</bdi> → <bdi dir='ltr'>LCL</bdi> — פירוק מכולה מלאה למטענים חלקיים","<bdi dir='ltr'>LCL</bdi> → <bdi dir='ltr'>FCL</bdi> — איחוד מטענים חלקיים למכולה מלאה","<bdi dir='ltr'>Courier</bdi> → <bdi dir='ltr'>FCL</bdi> — מעבר משילוח מהיר למכולה","<bdi dir='ltr'>Drop</bdi> → <bdi dir='ltr'>Import</bdi> — מעבר ממשלוח ישיר ליבוא"],c:1,e:"המעבר <bdi dir='ltr'>LCL</bdi> → <bdi dir='ltr'>FCL</bdi> שבשקף 13 הוא איחוד <bdi dir='ltr'>(Consolidation)</bdi> של מטענים חלקיים למכולה מלאה — בהלימה לדגש ״איחוד משלוחים״ במדדי הלוגיסטיקה ולשירות ״<bdi dir='ltr'>Drop Shipments</bdi> & <bdi dir='ltr'>Consolidations</bdi>״ בפירמידת מיקור החוץ. המעבר ההפוך, <bdi dir='ltr'>FCL</bdi> → <bdi dir='ltr'>LCL</bdi>, הוא פירוק מכולה מלאה למשלוחים חלקיים. (שא-6, שקפים 6, 8, 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לפי עץ העלויות הלוגיסטיות, לאיזה ענף שייכת עלות ה״הסבות״ <bdi dir='ltr'>(Reworks)</bdi> של מוצרים במחסן?",o:["שילוח — משלוח ישיר מהספק <bdi dir='ltr'>(Drop)</bdi>","מחסן — שירותי ערך מוסף <bdi dir='ltr'>(VAS)</bdi>","הפצה — הפצה ללקוחות","מחסן — אחסון (שטח / נפח)"],c:1,e:"בעץ שבשקף 14 יש שלושה ענפים: שילוח (יבוא, יצוא, משלוח ישיר <bdi dir='ltr'>Drop</bdi> ושילוח מהיר <bdi dir='ltr'>Courier</bdi>), מחסן (אחסון — שטח/נפח ופעילויות <bdi dir='ltr'>Transactions</bdi>; ושירותי ערך מוסף <bdi dir='ltr'>VAS</bdi> — הסבות <bdi dir='ltr'>Reworks</bdi> ותיקונים) והפצה (הפצה ללקוחות ומשיכה מספקים). הסבות הן שירות ערך מוסף במחסן. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"איזו מהעלויות הבאות שייכת לענף ״הפצה״ בעץ העלויות הלוגיסטיות?",o:["משיכת סחורה מספקים","משלוח מהיר <bdi dir='ltr'>(Courier)</bdi>","שכירת שטח אחסון במחסן","יבוא ממדינת המקור ליעד"],c:0,e:"בשקף 14 ענף ההפצה כולל שני סעיפים: הפצה ללקוחות ומשיכה מספקים. שטח האחסון שייך לענף המחסן, ומשלוח מהיר ויבוא שייכים לענף השילוח — שבו כל סוג משלוח מתפצל לעלויות במדינת המקור ובמדינת היעד. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בעץ העלויות הלוגיסטיות, לענפי היבוא, היצוא והמשלוח הישיר יש אותה חלוקת משנה. מהי?",o:["עלויות במדינת המקור ועלויות במדינת היעד","עלויות אוויר ועלויות ים לאורך כל מסלול ההובלה","עלויות מכס ועלויות ביטוח של המטען","עלויות קבועות ועלויות משתנות לכל משלוח ומשלוח"],c:0,e:"בשקף 14 כל אחד מהענפים יבוא <bdi dir='ltr'>(Import)</bdi>, יצוא <bdi dir='ltr'>(Export)</bdi> ומשלוח ישיר <bdi dir='ltr'>(Drop)</bdi> מתפצל ל״מדינת מקור״ ול״מדינת יעד״ — העלויות נוצרות בשני קצות המשלוח. שילוח מהיר <bdi dir='ltr'>(Courier)</bdi> מופיע כענף נפרד ללא הפיצול הזה. (שא-6, שקף 14)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"לקוח מחזיר מכשיר תקול, ומקבל מיד מכשיר חלופי מהמלאי, בזמן שהמכשיר שלו נשלח לתיקון. איזה שלב בלוגיסטיקה החוזרת מתואר?",o:["החזרה מתיקון — משלוח למחסן או ישירות ללקוח","קבלת החזרות מהלקוח — קליטה, סריקה ומיון","ניהול מלאי שירות — מלאי חדש בלבד","החלפה ללקוח — <bdi dir='ltr'>Fast Exchange</bdi> ומשלוח המכשיר לתיקון"],c:3,e:"בשקף 15, אחרי קבלת ההחזרה מהלקוח (קליטה, סריקה/מיון) מגיע שלב ״החלפה ללקוח״: <bdi dir='ltr'>Fast Exchange</bdi> — מכשיר חלופי מיד — ומשלוח המכשיר התקול לתיקון. בהמשך: ניהול מלאי שירות (חדש וממוחדש), משלוח לתיקון <bdi dir='ltr'>RTV</bdi> לספק או ליצרן, תיקון, והחזרה מתיקון למחסן או ללקוח. (שא-6, שקף 15)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"בלוגיסטיקה החוזרת, לאן נשלחים מוצרים בשלב ״משלוח לתיקון — <bdi dir='ltr'>RTV</bdi>״?",o:["למחסן המרכזי","ללקוח הסופי","לספק או ליצרן","למרכז ההפצה"],c:2,e:"בשקף 15 שלב ״משלוח לתיקון <bdi dir='ltr'>RTV</bdi>״ מסומן ״ספק / יצרן״ — המוצר התקול מוחזר למי שיכול לתקן אותו. אחרי התיקון (תיקון מוצר או מיחדוש) מגיעה ״החזרה מתיקון״ — למחסן או ללקוח. <bdi dir='ltr'>RTV</bdi> מופיע גם בשא-2 כסוג מלאי: מלאי בתהליך תיקון. (שא-6, שקף 15; שא-2, שקף 12)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"במחסן השירות של חברה מוחזקים שני סוגי מלאי: מכשירים חדשים ומכשירים שתוקנו וחודשו. באיזה שלב של הלוגיסטיקה החוזרת מופיעים שני הסוגים האלה יחד?",o:["משלוח לתיקון <bdi dir='ltr'>RTV</bdi> — משלוח המכשירים התקולים לספק או ליצרן","החזרה מתיקון — משלוח המכשירים המתוקנים למחסן או ללקוח","קבלת החזרות מהלקוח — קליטה, סריקה ומיון של המכשירים","ניהול מלאי שירות — מלאי חדש לצד מלאי ממוחדש <bdi dir='ltr'>(Refurbished)</bdi>"],c:3,e:"בשקף 15, שלב ״ניהול מלאי שירות״ כולל שני סוגי מלאי: מלאי חדש ומלאי ממוחדש <bdi dir='ltr'>(Refurbished)</bdi> — מכשירים שתוקנו וחזרו לשמש מלאי שירות. בעץ המלאי של שא-2 מופיע בהתאם ״מלאי מתוקן — <bdi dir='ltr'>Refurbished</bdi>״ כחלק מהמלאי התפעולי. (שא-6, שקף 15; שא-2, שקף 13)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה תפקידה של מערכת <bdi dir='ltr'>WMS</bdi> לפי המצגת?",o:["לנהל את המשא ומתן מול חברות השילוח ולבחור את המסלול הזול","לנהל את קשרי הלקוחות, התלונות, המחירים והמבצעים של הארגון","לנהל אוטומטית את תהליכי העבודה במחסן ולחסוך בשטחי האחסון","לתכנן את דרישות החומר מהזמנות ותחזיות ועד הזמנות הרכש"],c:2,e:"שקף 16: <bdi dir='ltr'>WMS</bdi> — <bdi dir='ltr'>Warehouse Management System</bdi> — מנהלת את תהליכי העבודה במחסן בצורה אוטומטית תוך חיסכון בשטחי אחסון, ותומכת בניהול המלאי ובתנועות הנכנסות והיוצאות. ניהול קשרי לקוחות הוא <bdi dir='ltr'>CRM</bdi>, ותכנון דרישות החומר הוא <bdi dir='ltr'>MRP</bdi>. (שא-6, שקף 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"איזו מהפעולות הבאות <b>אינה</b> נמנית עם התנועות שמערכת <bdi dir='ltr'>WMS</bdi> תומכת בהן, לפי המצגת?",o:["העברה בין מחסנים ואיתורי מלאי","קביעת מחיר המכירה לכל פריט","ספירות מלאי תקופתיות והשמדות מלאי","קליטת החזרות מהלקוחות למחסן"],c:1,e:"לפי שקף 16, ה-<bdi dir='ltr'>WMS</bdi> תומכת בתנועות הנכנסות והיוצאות: הכנת משלוחים, קליטת סחורה מספקים, החזרות מלקוחות והחזרות לספקים, ספירות מלאי, משטוח, העברה בין מחסנים, איתורים והשמדות מלאי. תמחור מכירה אינו פעולת מחסן. (שא-6, שקף 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"מה תורמים מסופונים וקוראי <bdi dir='ltr'>RFID</bdi> לעבודת ה-<bdi dir='ltr'>WMS</bdi>, לפי שקף ה-<bdi dir='ltr'>WMS</bdi>?",o:["ביטול הצורך בספירות מלאי תקופתיות","הגדלת נפח האחסון הפיזי של המחסן","קיצור זמני ההובלה הימית והאווירית","צמצום טעויות אנוש בתנועות המלאי"],c:3,e:"בשקף 16 מוזכרים המסופונים וה-<bdi dir='ltr'>RFID</bdi> ככלים שמצמצמים טעויות אנוש — הזנה ידנית מוחלפת בסריקה. הם משפרים את אמינות המלאי <bdi dir='ltr'>(Inventory Accuracy)</bdi>, אך אינם מבטלים את הספירות, אינם מגדילים את נפח המחסן ואינם משפיעים על זמני ההובלה. (שא-6, שקפים 6, 16)"},
{t:"ניהול לוגיסטיקה",s:"שלמה",q:"על מה מבוססת ״אומנות הלוגיסטיקה״ שבסוף המצגת, ומה המסר שלה?",o:["על מודל ״הצלף העיוור״ של שלמה; הלוגיסטיקה היא הפעילות היחידה שאינה צריכה תחזית","על מודל ״הכדורגל״; מערך הלוגיסטיקה צריך להשתנות בכל שלב במחזור חיי המוצר","על ״אומנות המלחמה״ של סון טסו; המאמץ הלוגיסטי הוא מהמאמצים העיקריים של השרשרת","על ״ספר המטרה״ של גולדרט; ניצול מלא של הקיבולת הוא המאמץ העיקרי של הלוגיסטיקה"],c:2,e:"שקפים 19–21 מבססים את ״אומנות הלוגיסטיקה״ על ״אומנות המלחמה״ של סון טסו — ספר סיני על אסטרטגיה ומלחמה בן 13 פרקים. המסר: המאמץ הלוגיסטי הוא אחד המאמצים העיקריים של שרשרת האספקה, חשוב להבטחת עמידתה ביעדיה, מהווה מרכיב עיקרי בתקציבה, ונדרש שיפור וייעול מתמידים. (שא-6, שקפים 19–21)"}
]);
