/* ===== חיזוי — שיטות ומדדים (ניצן, מצגת 2 + הרצאות 28.7, 4.8, 11.8) — שאלות מושגיות ===== */
/* --- הגדרה וחשיבות --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"כיצד מגדירה המצגת את פעולת החיזוי?",o:["קביעת יעדי המכירות שהארגון מתחייב לעמוד בהם בתקופה הבאה","תיעוד מסודר של התנהגות התופעה בעבר לצורך הפקת דוחות ניהוליים","ניסיון לנבא התנהגות של תופעות בעתיד — קצת יותר טוב מניחוש פראי","חישוב מדויק וודאי של הביקוש העתידי באמצעות מודל מתמטי מוסכם"],c:2,e:"המצגת מגדירה חיזוי כפעולה שמנסה לנבא התנהגות של תופעות בעתיד — היכולת לדעת היום מה יקרה בעתיד, ״משהו קצת יותר טוב מניחוש פראי״. חיזוי אינו ידיעה ודאית ואינו תיעוד של העבר, וקביעת יעדים היא החלטה ניהולית ולא ניבוי. (מצגת 2, שקף 2)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"יצרן רהיטים מחליט לוותר על חיזוי ביקוש ולהזמין חומרי גלם רק לאחר שמתקבלות הזמנות בפועל. על איזו תועלת מרכזית של החיזוי, לפי המצגת, הוא מוותר?",o:["הכנה מראש של התשתית הדרושה לאספקת הביקוש — תוכנית ייצור, חומרי גלם וקיבולת","ידיעה ודאית מראש של כמות ההזמנות שתתקבל, המאפשרת לבטל לחלוטין את החזקת המלאי","קביעת המחיר שהלקוח ישלם על פי העלות בפועל של ההזמנה שכבר התקבלה במערכת","חיסכון בעלויות הפרסום, מפני שהזמנות בפועל אינן דורשות פעילות שיווקית כלשהי"],c:0,e:"שקף 3 מסביר שחיזוי הצרכים העתידיים מאפשר הכנה מראש של התשתית הדרושה לאספקת הביקוש: בניית תוכנית ייצור, הזמנת חומרי גלם, תכנון קיבולת הייצור, מדיניות פרסום ומחירים ותכנון שיווקי. תחזית אינה מבטיחה ידיעה ודאית ואינה מבטלת את הצורך במלאי — היא רק מאפשרת להיערך. (מצגת 2, שקף 3)"},
/* --- אופקי תכנון --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהלת סניף של רשת מזון צריכה לשבץ עובדים למשמרות ולקבוע כמויות מלאי לפריטים ספציפיים לשבועות הקרובים. איזה סוג תחזית משרת אותה, לפי המצגת?",o:["תחזית לטווח בינוני — עד שלוש שנים, לקבוצות דגמים, לצורכי תקצוב","תחזית לטווח קצר — עד שלושה חודשים, למוצרים בודדים ומסוימים","תחזית לטווח ארוך — מעל שלוש שנים, למוצרים בפיתוח ולהקצאת אתרים","תחזית לטווח בינוני — עד שלושה חודשים, למוצרים כוללניים בלבד"],c:1,e:"התחזית לטווח הקצר (עד שלושה חודשים) עוסקת במוצרים בודדים ומסוימים, ומטרתה זימון עבודה, מטלות עובדים וניהול מלאי — בדיוק הצרכים שבתרחיש. הטווח הבינוני (עד 3 שנים) משרת תכנון שיווק, ייצור ותקצוב ברמת מוצרים כוללניים, והארוך (מעל 3 שנים) — מוצרים חדשים והקצאת אתרים. (מצגת 2, שקף 4)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"הנהלת חברה דנה בהקמת מפעל חדש ובפיתוח קו מוצרים שיושק בעוד ארבע שנים. איזה אופק תחזית נדרש, ומה מאפיין אותו?",o:["טווח קצר — מוצרים מסוימים, לצורך זימון עבודה וניהול מלאי","טווח בינוני — מוצרים כוללניים בכמה דגמים, לצורך תכנון שיווק, ייצור ותקצוב","טווח בינוני — מוצרים בפיתוח, לצורך תקצוב והקצאת אתרים","טווח ארוך — מוצרים בפיתוח, לצורך תכנון מוצרים חדשים והקצאת אתרים"],c:3,e:"אופק של מעל שלוש שנים הוא תחזית לטווח ארוך: היא עוסקת במוצרים לטווח ארוך ובפיתוח, ומטרתה תכנון מוצרים חדשים והקצאת אתרים — כמו הקמת מפעל. הטווח הבינוני מוגבל לשלוש שנים ועוסק במוצרים כוללניים לצורכי תכנון שיווק, ייצור ותקצוב, ולא בהחלטות על אתרים. (מצגת 2, שקף 4)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"כיצד משתנה רמת הפירוט של המוצרים בתחזית ככל שאופק התכנון מתארך?",o:["ממוצרים בודדים ומסוימים בטווח הקצר, למוצרים כוללניים בבינוני ולמוצרי פיתוח בארוך","הפירוט נשאר זהה בכל האופקים, ורק שיטת החישוב משתנה מאיכותית לכמותית ככל שהטווח מתארך","ממוצרים כוללניים בטווח הקצר למוצרים בודדים ומסוימים בטווח הארוך, כדי לדייק בתכנון האתרים","בטווח הקצר מתכננים מוצרים חדשים בלבד, ובטווח הארוך עוברים לניהול המלאי של פריטים קיימים"],c:0,e:"שקף 4 מדרג את המוצרים לפי האופק: בטווח הקצר מוצרים בודדים ומסוימים, בטווח הבינוני מוצרים כוללניים (כמה דגמים או סוגים), ובטווח הארוך מוצרים לטווח ארוך ופיתוח. הכיוון ההפוך — פירוט גובר ככל שמתרחקים — סותר את המצגת, שכן לפי עקרונות היסוד התחזיות מדויקות יותר דווקא לטווח הקצר. (מצגת 2, שקפים 4, 31)"},
/* --- סובייקטיבי מול אובייקטיבי --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברת סטארט-אפ עומדת להשיק מוצר חדש לחלוטין, שאין לו נתוני מכירות היסטוריים. איזו גישת חיזוי עדיפה במצב זה, ומדוע?",o:["אובייקטיבית — מודל מתמטי אינו תלוי בנתוני עבר ולכן מתאים דווקא למוצר חדש","אובייקטיבית — רגרסיה ליניארית על נתוני מוצרים דומים מבטיחה תחזית מדויקת","סובייקטיבית — מתבססת על הערכות, אינטואיציה וניסיון, ועדיפה כשאין מידע על העבר","סובייקטיבית — היא מדויקת יותר מכל מודל כמותי גם כשקיים מידע היסטורי מלא"],c:2,e:"לפי שקף 5, השיטות הסובייקטיביות (האיכותיות) מתבססות על הערכות ומשלבות אינטואיציה וניסיון של מקבלי ההחלטות, והן עדיפות כאשר אין מידע על העבר. השיטות האובייקטיביות מבוססות על מודלים מתמטיים ומיושמות דווקא כשהמצב יציב וקיים מידע היסטורי — שאינו קיים למוצר חדש. (מצגת 2, שקף 5)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"באילו תנאים, לפי המצגת, ראוי ליישם שיטות חיזוי אובייקטיביות (כמותיות)?",o:["כאשר מקבלי ההחלטות בעלי ניסיון רב ואינטואיציה מפותחת בתחום המוצר","כאשר המצב יציב וקיים מידע היסטורי שעליו ניתן להריץ מודל מתמטי","כאשר המוצר חדש ואין נתוני עבר, ולכן נדרש מודל שאינו תלוי בנתונים","כאשר השוק משתנה במהירות ונדרשת הערכה מהירה של קבוצת מנהלים בכירים"],c:1,e:"שיטות אובייקטיביות מתבססות על מודלים מתמטיים ומיושמות כאשר המצב יציב וקיים מידע היסטורי. ניסיון ואינטואיציה של מקבלי ההחלטות הם הבסיס לשיטות הסובייקטיביות, וכשאין נתוני עבר או כשנדרשת הערכת מנהלים מהירה — פונים לשיטות איכותיות ולא למודל כמותי. (מצגת 2, שקף 5)"},
/* --- חמש השיטות האיכותיות --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בעל מכולת קובע שהתחזית לחודש יוני שווה בדיוק למכירות שנרשמו במאי. באיזו שיטה הוא נוקט, ומה נאמר עליה במצגת?",o:["ממוצע נע פשוט עם <bdi dir='ltr'>n=2</bdi> — שיטה כמותית שחסרונה הוא פיגור אחרי המגמה הכללית","דעות סגל ניהולי — הערכה מהירה של מנהל בכיר יחיד, החשופה לחיסרון של חשיבה קבוצתית","החלקה מעריכית עם <bdi dir='ltr'>α=0</bdi> — כל המשקל ניתן לתחזית הקודמת ולא למכירות האחרונות","הגישה הנאיבית — התחזית זהה לביצועי התקופה שחלפה, ולעיתים יעילה גם כלכלית"],c:3,e:"הגישה הנאיבית מניחה שתחזית התקופה הקרובה זהה לביצועי התקופה שחלפה — הדוגמה במצגת היא בדיוק 48 במאי ולכן 48 ביוני — והמצגת מציינת שלעיתים היא יעילה גם בהיבט הכלכלי. היא מסווגת בין השיטות האיכותיות; ממוצע נע עם <bdi dir='ltr'>n=2</bdi> היה ממצע את אפריל ומאי, ולא נשען על מאי בלבד. (מצגת 2, שקפים 6–7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנכ״ל מכנס חמישה סמנכ״לים לישיבה קצרה שבה הם מעריכים יחד את הביקוש לשנה הבאה, תוך שילוב ניסיונם עם נתונים סטטיסטיים. מהו החיסרון העיקרי של שיטה זו לפי המצגת?",o:["חשיבה קבוצתית — הקבוצה נוטה להתכנס לדעה אחת ומאבדת הערכות עצמאיות","איטיות — תהליך נשנה של סבבי שאלונים שנמשך זמן רב עד להשגת הסכמה","הטיה אופטימית — המנהלים מתוגמלים בבונוסים על עמידה ביעדי המכירות שהעריכו","פער בין ההצהרות לבין ההתנהגות בפועל של המשתתפים בהערכת הביקוש"],c:0,e:"זוהי שיטת דעות הסגל הניהולי: קבוצה קטנה של מנהלים בכירים מעריכה ביקושים בעבודת צוות, משלבת ניסיון ניהולי עם מודלים סטטיסטיים והיא יחסית מהירה — אך חסרונה הוא ״חשיבה קבוצתית״. איטיות אינה חיסרון שלה (היא מהירה), והטיית הבונוסים מיוחסת במצגת לחוות דעת אנשי המכירות. (מצגת 2, שקף 8)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"ארגון חושש שהערכת ביקוש בישיבת הנהלה תיפגע מ״חשיבה קבוצתית״, ומעוניין בתהליך מובנה שבו המומחים אינם משפיעים זה על זה ישירות. איזו שיטה איכותית מתאימה?",o:["חוות דעת אנשי מכירות — כל איש מכירות מגיש תחזית עצמאית לאזורו","סקר שווקים של לקוחות — שואלים את הלקוחות ישירות על תוכניות הרכש","שיטת דלפי — תהליך קבוצתי נשנה-אינטראקטיבי שמצמצם חשיבה קבוצתית","הגישה הנאיבית — מסתמכים על ביצועי התקופה שחלפה ללא דיון קבוצתי"],c:2,e:"שיטת דלפי היא תהליך קבוצתי נשנה-אינטראקטיבי עם שלושה סוגי משתתפים (מקבלי החלטות-מומחים, סגל ניהולי ומשיבים), והמצגת מציינת במפורש שהיא מצמצמת ״חשיבה קבוצתית״. חוות דעת אנשי מכירות וסקר לקוחות אינם פותרים את בעיית ההשפעה ההדדית בין מומחים, והגישה הנאיבית כלל אינה תהליך הערכה. (מצגת 2, שקף 9)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מי הם שלושת סוגי המשתתפים בשיטת דלפי, לפי המצגת?",o:["אנשי מכירות, לקוחות מרכזיים ואנליסטים סטטיסטיים","מקבלי החלטות (מומחים), סגל ניהולי ומשיבים","מנהלים בכירים, מנהלי ביניים ועובדי הייצור","מומחים חיצוניים, ספקים עיקריים ומשיבים מהציבור"],c:1,e:"בשיטת דלפי משתתפים שלושה סוגים: מקבלי החלטות (המומחים), סגל ניהולי ומשיבים, בתהליך נשנה-אינטראקטיבי. אנשי מכירות ולקוחות שייכים לשיטות איכותיות אחרות (חוות דעת אנשי מכירות וסקר שווקים), ולא להרכב המשתתפים של דלפי. (מצגת 2, שקף 9)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהל שיווק אוסף מכל איש מכירות תחזית לאזורו ומשלב אותן לתחזית ארצית. אנשי המכירות מתוגמלים בבונוסים על עמידה ביעדים. מה היתרון ומה הסיכון בשיטה זו, לפי המצגת?",o:["יתרון: תהליך מהיר יחסית לשאר השיטות; סיכון: חשיבה קבוצתית בין אנשי המכירות באותו אזור","יתרון: מצמצם חשיבה קבוצתית; סיכון: פער בין מה שהלקוחות אומרים למה שיעשו בפועל","יתרון: מבוסס על מודל סטטיסטי; סיכון: התחזית מפגרת אחרי המגמה הכללית של השוק","יתרון: איש המכירות מכיר את הלקוח; סיכון: נטייה לתחזית אופטימית והטיה מהבונוסים"],c:3,e:"בחוות דעת אנשי מכירות כל איש מכירות מציג את תחזיתו והתחזיות משולבות ברמה אזורית ולאומית; היתרון הוא שאיש המכירות מכיר את הלקוח, והחסרונות הם נטייה לתחזית אופטימית והטיה כתוצאה מבונוסים. חשיבה קבוצתית היא חיסרון של דעות הסגל הניהולי, והפער בין אמירה למעשה מאפיין סקר לקוחות. (מצגת 2, שקף 10)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"רשת חנויות פונה ללקוחותיה העסקיים ושואלת אותם מה בכוונתם לרכוש בשנה הבאה, ובונה על כך תחזית. מהי המגבלה העיקרית של שיטה זו לפי המצגת?",o:["פער בין מה שהלקוחות אומרים לבין מה שיעשו בפועל","הלקוחות נוטים לדווח תחזית אופטימית בגלל תמריצים","התהליך איטי ומחייב סבבי שאלונים חוזרים למומחים","השיטה אינה מנצלת את היכרות איש המכירות עם הלקוח"],c:0,e:"סקר שווקים של לקוחות שואל את הלקוח על תוכניות הרכש העתידיות שלו, והמצגת מציינת כמגבלה את הפער בין מה שהלקוחות אומרים לבין מה שיעשו בפועל. הטיה אופטימית בגלל תמריצים מיוחסת לאנשי המכירות, וסבבי שאלונים חוזרים מאפיינים את שיטת דלפי. (מצגת 2, שקף 11)"},
/* --- מרכיבי סדרה עתית --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מכירות תנורי חימום מגיעות לשיא בחודשי החורף ולשפל בקיץ, ומכירות מזגנים מתנהגות הפוך — בכל שנה מחדש. איזה מרכיב של הסדרה העתית מתואר כאן?",o:["מגמה — שינוי עקבי לאורך זמן בכיוון קבוע","עונתיות — דפוס החוזר על עצמו במחזור קבוע של שנה","תנועות אקראיות — תנודות ללא דפוס שניתן לחזות","מחזוריות — גלים ארוכים שאינם קשורים ללוח השנה"],c:1,e:"דפוס שחוזר על עצמו בתוך כל שנה — שיא בחורף ושפל בקיץ (או להפך) — הוא עונתיות, והמצגת מדגימה זאת בדיוק בגרף תנורי חימום מול מזגנים לפי חודשים <bdi dir='ltr'>(m max, m min)</bdi>. מגמה היא שינוי עקבי בכיוון אחד לאורך זמן, ותנועות אקראיות הן תנודות ללא דפוס. (מצגת 2, שקפים 13, 18)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"נתוני גיוס החרדים לצה״ל בדוגמת הכיתה עלו בעקביות משנה לשנה (1282 ב-2013 ועד 3070 ב-2019). איזה מרכיב של הסדרה העתית בולט בנתונים, ומה משמעותו לבחירת השיטה?",o:["עונתיות — ולכן יש להשתמש במודל עונתיות עם <bdi dir='ltr'>m max</bdi> ו-<bdi dir='ltr'>m min</bdi>","תנועות אקראיות — ולכן שום שיטה כמותית לא תיתן תחזית סבירה","מגמה — ולכן הרגרסיה הליניארית צפויה להתאים יותר מממוצע נע","מחזוריות — ולכן יש להעדיף ממוצע נע פשוט עם <bdi dir='ltr'>n</bdi> גדול ככל האפשר"],c:2,e:"עלייה עקבית משנה לשנה היא מגמה. בהרצאה הודגש שכאשר יש מגמה, הרגרסיה הליניארית היא המתאימה ביותר, ואילו הממוצע הנע מפגר אחרי המגמה הכללית — ואכן בדוגמת הכיתה הרגרסיה השיגה את המדדים הנמוכים ביותר. עונתיות היא דפוס חוזר בתוך שנה, ואינה מה שנצפה כאן. (מצגת 2, שקפים 13, 19, 21, 34)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מכירות הגלידה של יצרן עולות משנה לשנה, ובתוך כל שנה יש שיא בקיץ ושפל בחורף. איזו צורת תנועה מהמצגת מתארת את הסדרה?",o:["מחזוריות בלבד — גלים חוזרים באורך משתנה שאינם תלויים בעונה","עונתיות בלבד — הדפוס השנתי החוזר מסביר את כל התנועה בנתונים","מגמה בלבד — העלייה הרב-שנתית מסבירה את כל התנועה","מגמה משולבת עונתיות — עלייה כללית עם דפוס עונתי חוזר"],c:3,e:"שקף 13 מציג בין מרכיבי הסדרה העתית גם ״מגמה משולבת עונתיות״ — סדרה שיש בה גם עלייה (או ירידה) כללית לאורך השנים וגם דפוס עונתי החוזר בתוך כל שנה, בדיוק כמו מכירות הגלידה בתרחיש. עונתיות בלבד לא הייתה מסבירה את העלייה הרב-שנתית, ומגמה בלבד לא הייתה מסבירה את שיאי הקיץ. (מצגת 2, שקף 13)"},
/* --- רגרסיה ליניארית ומקדם המתאם --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מהו קו הרגרסיה הליניארית, לפי ההגדרה במצגת?",o:["הקו הישר שיוצר את השגיאה המצטברת הקטנה ביותר ביחס לנקודות התצפית","הקו הישר העובר דרך הנקודה הראשונה והנקודה האחרונה בסדרת הנתונים","הקו הישר המחבר את ערך המקסימום ואת ערך המינימום של המשתנה התלוי","הקו הישר שמספר הנקודות שמעליו שווה למספר הנקודות שמתחתיו בסדרה"],c:0,e:"המצגת מגדירה את קו הרגרסיה כקו שיוצר את השגיאה המצטברת הקטנה ביותר: לכל נקודה יש סטייה (שגיאה) מהקו, והקו נבחר כך שסך השגיאות מינימלי. משוואתו <bdi dir='ltr'>Y=a+bX</bdi>, כאשר <bdi dir='ltr'>X</bdi> הוא המשתנה הבלתי תלוי ו-<bdi dir='ltr'>Y</bdi> התלוי. חיבור נקודות קצה או קיצון אינו מבטיח שגיאה מינימלית. (מצגת 2, שקף 14)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בבדיקת הקשר בין מחיר מוצר לבין הביקוש לו התקבל מקדם מתאם <bdi dir='ltr'>R=−0.95</bdi>. מה משמעות התוצאה?",o:["קשר ליניארי חלש — הערך רחוק מ-1 ולכן רגרסיה ליניארית אינה מתאימה לנתונים","טעות חישוב — מקדם המתאם אינו יכול לקבל ערכים שליליים","קשר ליניארי חזק ושלילי — כשהמחיר עולה, הביקוש יורד כמעט בקו ישר","קשר ליניארי חזק וחיובי — הסימן השלילי מציין רק את כיוון ציר הזמן"],c:2,e:"מקדם המתאם <bdi dir='ltr'>R</bdi> מבטא את עוצמת הקשר הליניארי ואת כיוונו, בתחום −1 עד 1: <bdi dir='ltr'>R</bdi> קרוב ל-−1 הוא קשר ליניארי חזק ושלילי (כש-<bdi dir='ltr'>X</bdi> עולה, <bdi dir='ltr'>Y</bdi> יורד), <bdi dir='ltr'>R</bdi> קרוב ל-1 חזק וחיובי, ו-<bdi dir='ltr'>R</bdi> קרוב ל-0 חלש. הסימן השלילי הוא כיוון הקשר ולא שגיאה, והעוצמה נמדדת לפי הקרבה ל-1 או ל-−1. (מצגת 2, שקף 15)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"צוות שמכין את מטלת החיזוי חישב באקסל את מקדם המתאם <bdi dir='ltr'>(CORREL)</bdi> וקיבל <bdi dir='ltr'>R=0.16</bdi>. מה המסקנה הנכונה, לפי מה שנאמר בהרצאה?",o:["הרגרסיה תהיה השיטה הטובה ביותר בכל מקרה, שכן <bdi dir='ltr'>R</bdi> חיובי מעיד על מגמת עלייה","הקשר הליניארי חלש, ולא בטוח שהרגרסיה תנצח — יש להשוות בעזרת <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>","יש להעלות את <bdi dir='ltr'>R</bdi> בריבוע כדי לקבל את עוצמת הקשר האמיתית לפני ההחלטה","יש לפסול את הנתונים — <bdi dir='ltr'>R</bdi> נמוך מ-0.5 מעיד שהסדרה אינה ניתנת לחיזוי כלל"],c:1,e:"בהרצאה, כשהתקבל <bdi dir='ltr'>R=0.16</bdi>, אמר ניצן שזהו מקדם מתאם נמוך — ככל ש-<bdi dir='ltr'>R</bdi> קרוב ל-1 או ל-−1 הקשר הליניארי חזק, וכאן הוא יחסית חלש, ״זה אומר שהרגרסיה לא כזאת מי יודע מה״. במקרה כזה לא בטוח שהרגרסיה עדיפה על הממוצעים הנעים, ולכן משווים את השיטות לפי <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>. הודגש שעובדים עם <bdi dir='ltr'>R</bdi> ולא עם <bdi dir='ltr'>R</bdi> בריבוע. (הרצאה 4.8)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בהכנת רגרסיה ליניארית לחיזוי ביקוש על פי שש שנות מכירה (2021–2026), מה מציבים כמשתנה הבלתי תלוי <bdi dir='ltr'>X</bdi>, לפי ההנחיה בהרצאה?",o:["את השנים עצמן (2021, 2022, ...), כי הן מייצגות את ציר הזמן האמיתי","את נתוני הביקוש, כי הביקוש הוא הגורם שמסביר את השנה שבה נמכר","את התחזיות של הממוצע הנע, כדי לשפר אותן באמצעות התאמת קו ישר","את מספרי התקופות הסידוריים 1, 2, ..., 6 — ואת הביקושים כמשתנה <bdi dir='ltr'>Y</bdi>"],c:3,e:"בהרצאה הוסבר שבחיזוי עוסקים במשתנה התלוי בזמן, ולכן ציר <bdi dir='ltr'>X</bdi> הוא התקופות במספור סידורי 1..<bdi dir='ltr'>n</bdi> (״התקופות זה ציר ה-<bdi dir='ltr'>X</bdi>״), והביקושים הם <bdi dir='ltr'>Y</bdi>. כך גם בדוגמת גיוס החרדים במצגת: מס״ד 1–7 לשנים 2013–2019, והחיזוי ל-2020 נעשה בהצבת <bdi dir='ltr'>X=8</bdi>. באקסל: <bdi dir='ltr'>a</bdi> מ-<bdi dir='ltr'>INTERCEPT, b</bdi> מ-<bdi dir='ltr'>SLOPE, R</bdi> מ-<bdi dir='ltr'>CORREL</bdi>. (הרצאה 4.8; מצגת 2, שקף 19)"},
/* --- ממוצע נע פשוט ומשוקלל --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"הביקוש החודשי לסוכר במאפייה נע סביב ממוצע קבוע, ללא מגמת עלייה או ירידה וללא דפוס עונתי. איזו שיטה כמותית מתאימה, לפי המצגת, ומדוע?",o:["ממוצע נע פשוט — יעיל כשהביקוש יציב ללא מגמה או עונתיות ונע קרוב לממוצע","רגרסיה ליניארית — קו ישר הוא היחיד שמסוגל לתאר ביקוש שנע סביב ממוצע קבוע","מודל עונתיות — משתמשים בו כברירת מחדל בכל סדרה חודשית, גם ללא דפוס עונתי מובהק","ממוצע נע משוקלל — הוא היחיד שמבטל לחלוטין את השפעת המגמה על התחזית"],c:0,e:"שקף 21 קובע שממוצע נע פשוט יעיל כאשר הביקוש יציב ללא מגמה או עונתיות, ונכון להשתמש בו כשהמכירות נעות קרוב לממוצע — בדיוק התרחיש. בהרצאה הודגש שכשהנתונים די קבועים, לא בטוח שהרגרסיה תהיה טובה יותר מהממוצע הנע. מודל עונתיות דורש דפוס עונתי, שאינו קיים כאן. (מצגת 2, שקף 21; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברה חוזה ביקוש למוצר שמכירותיו עולות בהתמדה מדי שנה באמצעות ממוצע נע פשוט, ומגלה שהתחזית נמוכה מהביקוש בפועל כמעט בכל תקופה. מה ההסבר לפי המצגת?",o:["המשקולות שנבחרו לתקופות הישנות היו גבוהות מדי ביחס לתקופה האחרונה","הממוצע הנע מפגר אחרי המגמה הכללית — הוא ממצע תקופות קודמות ונמוכות יותר","מספר התקופות <bdi dir='ltr'>n</bdi> שנבחר קטן מדי, ולכן הממוצע רגיש מדי לתנודות אקראיות","מקדם ההחלקה <bdi dir='ltr'>α</bdi> שנבחר קרוב מדי לאפס, ולכן התחזית מגיבה לאט למכירות האחרונות"],c:1,e:"חסרונו של הממוצע הנע הפשוט, לפי שקף 21, הוא שהוא מפגר אחרי המגמה הכללית: כשהביקוש עולה, ממוצע התקופות הקודמות תמיד נמוך מהערך הבא. בהרצאה הודגש שבמקרה של מגמה הרגרסיה הליניארית מתאימה יותר. משקולות שייכות לממוצע המשוקלל ו-<bdi dir='ltr'>α</bdi> להחלקה מעריכית, ואינן רלוונטיות לממוצע הפשוט. (מצגת 2, שקף 21; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מה מבדיל את שיטת הממוצע הנע המשוקלל מהממוצע הנע הפשוט, לפי המצגת?",o:["המשוקלל משתמש במספר תקופות גדול יותר, ולכן מחליק טוב יותר את התנודות","המשוקלל מוסיף לממוצע את התחזית הקודמת ומשקלל אותה עם המכירות האחרונות בלבד","המשוקלל נותן משקל יחסי שונה לכל תקופה — גבוה יותר לתקופה הדומה לזו החזויה","המשוקלל מתאים רק לסדרות עונתיות, ואילו הפשוט מתאים לסדרות עם מגמה"],c:2,e:"שקף 24 מציג את הממוצע הנע המשוקלל כהתאמה של הממוצע הנע שתבטא טוב יותר את שינויי הביקוש: ניתן משקל יחסי שונה לכל תקופה, ולתקופה בעלת מאפיינים דומים לתקופה החזויה ניתן משקל גבוה. שקלול התחזית הקודמת עם המכירות האחרונות הוא עקרון ההחלקה המעריכית, לא של הממוצע המשוקלל. (מצגת 2, שקף 24)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בהרצאה הוצגה דרך לקביעת המשקולות בממוצע נע משוקלל. איזה תיאור תואם את מה שנאמר?",o:["המשקולות חייבות להסתכם ל-1 בדיוק (למשל 0.6 ו-0.4), אחרת התחזית יוצאת מוטה כלפי מעלה","לתקופה הרחוקה ביותר ניתן משקל 1, ובכל תקופה קדימה מוסיפים 10% עד לתקופה האחרונה","כל התקופות מקבלות משקל שווה של 1, ורק התקופה החזויה עצמה מקבלת משקל כפול","לתקופה האחרונה משקל 1, אחורה מפחיתים 10% (או 15%), ומחלקים בסכום המשקולות"],c:3,e:"ניצן הדגים: לתקופה האחרונה נותנים משקל 1 ובכל תקופה אחורה מורידים 10% (0.9, 0.8...) או 15% (0.85, 0.7...) — ההפחתה נתונה לבחירה. הוא הדגיש שסכום המשקולות לא חייב להיות 100%: מכפילים כל ביקוש במשקלו ומחלקים בסכום המשקולות, כמו ממוצע בגרות משוקלל לפי יחידות. את התוצאות הציג בשתי ספרות אחרי הנקודה. (הרצאה 28.7; הרצאה 11.8)"},
/* --- החלקה מעריכית --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בנוסחת ההחלקה המעריכית <bdi dir='ltr'>F(t+1)=α·X(t)+(1−α)·F(t)</bdi>, מה מייצגים <bdi dir='ltr'>α</bdi> ו-(1−<bdi dir='ltr'>α</bdi>)?",o:["<bdi dir='ltr'>α</bdi> — המשקל למכירות האחרונות (ההווה); (1−<bdi dir='ltr'>α</bdi>) — המשקל לתחזית של התקופה הקודמת","<bdi dir='ltr'>α</bdi> — המשקל לתחזית של התקופה הקודמת; (1−<bdi dir='ltr'>α</bdi>) — המשקל לממוצע כל המכירות ההיסטוריות","<bdi dir='ltr'>α</bdi> — שיעור המגמה השנתי; (1−<bdi dir='ltr'>α</bdi>) — שיעור העונתיות שנותר לאחר ניכוי המגמה","<bdi dir='ltr'>α</bdi> — מספר התקופות בממוצע; (1−<bdi dir='ltr'>α</bdi>) — שיעור ההפחתה במשקל בכל תקופה אחורה"],c:0,e:"לפי שקפים 27–28, ההחלקה המעריכית משקללת את המכירות האחרונות (ההווה) ואת התחזית של התקופה הקודמת: המשקל למכירות האחרונות הוא <bdi dir='ltr'>α</bdi> והמשקל לתחזית הקודמת הוא המשלים (1−<bdi dir='ltr'>α</bdi>), כאשר <bdi dir='ltr'>0 &lt; α &lt; 1</bdi>. יתרונותיה: חישובים פשוטים ושיטה רגישה. <bdi dir='ltr'>α</bdi> אינו מספר תקופות ואינו קשור למגמה או לעונתיות. (מצגת 2, שקפים 27–28)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"צוות שמכין את מטלת החיזוי מגלה שבקובץ המטלה מופיעה גם שיטת ההחלקה המעריכית. מה הנחה ניצן בהרצאה?",o:["לחשב אותה עם <bdi dir='ltr'>α=0.5</bdi> כברירת מחדל, מכיוון שהיא השיטה הרגישה ביותר","לדלג עליה — היא לא נלמדה בקורס, ויש להסתפק בחמש השיטות שנלמדו","לחשב אותה במקום הממוצע הנע המשוקלל, כי חישוביה פשוטים יותר","לחשב אותה רק אם <bdi dir='ltr'>R</bdi> של הרגרסיה נמוך מ-0.5 ואין שיטה אחרת מתאימה"],c:1,e:"בהרצאה 11.8 אמר ניצן: ״יש שם שיטה שלא למדנו — החלקה מעריכית — לא צריך״, ובהרצאה 28.7: ״יש פה החלקה מעריכית, לדלג על זה, זה לא בחומר״. המטלה כוללת חמש שיטות בלבד: רגרסיה ליניארית, ממוצע נע פשוט <bdi dir='ltr'>n=2</bdi> ו-<bdi dir='ltr'>n=3</bdi>, וממוצע נע משוקלל <bdi dir='ltr'>n=2</bdi> ו-<bdi dir='ltr'>n=3</bdi>, והשוואה ביניהן. (הרצאה 11.8; הרצאה 28.7)"},
/* --- מדדי דיוק ובחירת מודל --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מה ההבדל בין המדדים <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi> להשוואת מודלי חיזוי?",o:["<bdi dir='ltr'>MAD</bdi> הוא ממוצע הסטיות היחסיות באחוזים; <bdi dir='ltr'>MSE</bdi> הוא ממוצע הסטיות בערך מוחלט","<bdi dir='ltr'>MAD</bdi> מחושב רק על התקופה העתידית; <bdi dir='ltr'>MSE</bdi> מחושב על כל תקופות העבר","<bdi dir='ltr'>MAD</bdi> הוא ממוצע הסטיות בערך מוחלט; <bdi dir='ltr'>MSE</bdi> הוא ממוצע ריבועי הסטיות","<bdi dir='ltr'>MAD</bdi> מודד את כיוון הסטייה (חיובית או שלילית); <bdi dir='ltr'>MSE</bdi> מודד את גודלה בלבד"],c:2,e:"לפי שקף 32: <bdi dir='ltr'>MAD = Σ</bdi>|<bdi dir='ltr'>Xt−Ft</bdi>|/<bdi dir='ltr'>n</bdi> — ממוצע הסטיות בערך מוחלט; <bdi dir='ltr'>MSE = Σ(Xt−Ft)²/n</bdi> — ממוצע ריבועי הסטיות; כאשר <bdi dir='ltr'>Ft</bdi> התחזית, <bdi dir='ltr'>Xt</bdi> הערך בפועל ו-<bdi dir='ltr'>n</bdi> מספר התקופות. ממוצע הסטיות היחסי באחוזים הוא <bdi dir='ltr'>MRD (MAPE)</bdi>, שממנו נאמר בהרצאה להתעלם. שני המדדים מחושבים על תקופות העבר שיש להן תחזית. (מצגת 2, שקף 32)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"בטבלת ההשוואה של דוגמת הכיתה התקבל לרגרסיה <bdi dir='ltr'>MAD=62.06</bdi> ולממוצע הנע הפשוט (<bdi dir='ltr'>n=2) MAD=481.40</bdi>. מה המסקנה לפי כלל הבחירה במצגת?",o:["יש לבחור בממוצע הנע — ערך <bdi dir='ltr'>MAD</bdi> גבוה מעיד שהמודל 'תופס' יותר מהתנודות","אי אפשר להכריע — יש לחשב את הממוצע של שני המדדים ולבחור את הקרוב אליו","יש לבחור בממוצע הנע — <bdi dir='ltr'>MAD</bdi> נמדד ביחידות שונות לכל מודל ולכן הפער אינו מעיד","יש לבחור ברגרסיה — המודל הנבחר הוא זה שמביא את קריטריון ההשוואה למינימום"],c:3,e:"שלב 6 בשקף 33: המודל הנבחר יהיה זה שיביא למינימום את הקריטריון הנבחר — ערך סטייה נמוך פירושו תחזית קרובה יותר לביקוש בפועל. בדוגמת הכיתה השיטה בעלת המדדים הנמוכים ביותר הייתה הרגרסיה, ולכן התחזית ל-2020 נלקחה ממנה (3436). <bdi dir='ltr'>MAD</bdi> גבוה מעיד על סטיות גדולות, לא על ״תפיסת תנודות״. (מצגת 2, שקפים 33–34; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מהו הסדר הנכון של השלבים לבחירת מודל חיזוי מתאים, לפי המצגת?",o:["הרצה על כמה מודלים ← חישוב השגיאה בכל מודל ← בחירת קריטריון ← חישוב ערכו לכל מודל ← בחירת הממזער","בחירת המודל המקובל בענף ← הרצת הנתונים עליו ← חישוב השגיאה ← אימוץ המודל אם השגיאה קטנה מ-10% מהביקוש","בחירת קריטריון ← בחירת המודל שהמרצה ממליץ עליו ← הרצת הנתונים עליו ← חישוב השגיאה לצורך דיווח בלבד","חישוב השגיאה לכל מודל ← בחירת המודל עם השגיאה הקטנה ← הרצת הנתונים עליו ← חישוב הקריטריון"],c:0,e:"שקף 33 מונה שישה שלבים: הרצת נתוני המכירות על מספר מודלים; חישוב השגיאה בכל מודל; בחירת קריטריון להשוואה; אפיון אוכלוסיית הסטיות המשותפת לכל המודלים; מציאת הערכים לכל מודל לפי הקריטריון; ובחירת המודל שמביא את הקריטריון למינימום. אין ״מודל מקובל״ מראש — ריבוי השיטות נובע מכך שאין שיטה דומיננטית. (מצגת 2, שקפים 29, 33)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"בקובץ המטלה, לצד <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>, מופיע גם המדד <bdi dir='ltr'>MAPE</bdi> (ממוצע הסטיות היחסי באחוזים, <bdi dir='ltr'>MRD</bdi> במצגת). כיצד הנחה ניצן להתייחס אליו?",o:["לחשב אותו ולהכריע לפיו כשיש סתירה בין <bdi dir='ltr'>MAD</bdi> ל-<bdi dir='ltr'>MSE</bdi>","לחשב אותו במקום <bdi dir='ltr'>MSE</bdi>, מפני שאחוזים נוחים יותר להשוואה","להתעלם ממנו — בקורס למדו ומשתמשים רק ב-<bdi dir='ltr'>MAD</bdi> וב-<bdi dir='ltr'>MSE</bdi>","לחשב אותו רק עבור הרגרסיה, שבה הסטיות היחסיות קטנות"],c:2,e:"בהרצאה 11.8 אמר ניצן: ״יש פה גם <bdi dir='ltr'>MAPE</bdi>, אז תתעלמו מה-<bdi dir='ltr'>MAPE</bdi> — למדנו רק <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>״, ובהרצאה 28.7: ״אתם פטורים בקורס הזה מ-<bdi dir='ltr'>MRD</bdi>״. את ההשוואה בין חמש השיטות עורכים לפי <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi> בלבד, ואין למדד היחסי תפקיד בהכרעה. (הרצאה 11.8; הרצאה 28.7)"},
{t:"חיזוי — שיטות ומדדים",s:"הקלטות",q:"במטלה מחשבים תחזית <bdi dir='ltr'>(Ft)</bdi> לא רק לתקופה העתידית אלא גם לתקופות העבר שכבר ידוע בהן הביקוש בפועל. מדוע?",o:["כדי למדוד את הסטיות מהביקוש בפועל ולחשב <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi> להשוואה בין השיטות","כדי להחליף את נתוני הביקוש בפועל בערכים חלקים יותר לפני חישוב הרגרסיה","כדי לוודא שהתחזית זהה לביקוש בפועל — אם אינה זהה, המודל שגוי ויש להחליפו","כדי להשלים את התקופות הראשונות שאין להן תחזית בממוצע הנע, כך שהטבלה תהיה מלאה"],c:0,e:"ניצן הסביר שהפערים בין הביקוש לתחזית בתקופות העבר הם שמאפשרים למצוא את הסטייה של כל שיטה, ומהן מחשבים את <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi> כדי לבחור את השיטה הטובה ביותר. הודגש שתחזית ובפועל ״אף פעם לא דומים״ — פער אינו סימן לשגיאה. בממוצע נע מוחקים את <bdi dir='ltr'>n</bdi> התקופות הראשונות (אין להן תחזית), והסטיות מחושבות רק היכן שיש תחזית. (הרצאה 28.7; הרצאה 4.8)"},
/* --- בקרת התחזית ועקרונות יסוד --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"חברה בחרה מודל חיזוי לפני שנה על סמך <bdi dir='ltr'>MAD</bdi> מינימלי. בחודשים האחרונים, לאחר שמתחרה השיק טכנולוגיה חדשה, השגיאות הולכות וגדלות. מה נדרש לפי עקרונות בקרת התחזית במצגת?",o:["להמשיך עם המודל כפי שהוא — הוא נבחר כדין לפי הקריטריון, ושינוי מודל פוגע בעקביות","לבחון מחדש את התאמת המודל ולעדכנו — תהליך החיזוי אינו מסתיים בבחירת השיטה","להגדיל את מספר התקופות <bdi dir='ltr'>n</bdi> בממוצע הנע כדי להחליק את השפעת המתחרה החדש","לעבור לשיטה איכותית בלבד — מודלים כמותיים אינם רלוונטיים אחרי שינוי טכנולוגי"],c:1,e:"שקף 30 קובע שתהליך החיזוי אינו מסתיים עם בחירת שיטת החיזוי אלא מחייב בחינה מתמדת של המודל ועדכונו; בעיות הדיוק נובעות מהתאמת המודל למוצר ומהשפעות חיצוניות — ושקף 31 מונה במפורש ״הופעת טכנולוגיות חדשות״ בין ההשפעות. הימנעות מעדכון מנוגדת לעקרון הבקרה; מעבר גורף לשיטה איכותית אינו נדרש. (מצגת 2, שקפים 30–31)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"מנהל מציג להנהלה תחזית מכירות לשנה הבאה כמספר יחיד — 12,000 יחידות — ללא כל התייחסות לטווח הסטייה האפשרי. איזה עיקרון יסוד בבניית תחזית הופר?",o:["תחזיות מדויקות יותר לטווח הקצר, ולכן אין להציג תחזית שנתית","יש לבחון את שיטת התחזית לפני שמאמצים אותה סופית","יש להריץ את הנתונים על מספר מודלים ולבחור את הממזער את הקריטריון","התחזית חייבת לכלול הערכה ביחס לגודל השגיאה האפשרית"],c:3,e:"בין עקרונות היסוד בשקף 31: התחזית חייבת לכלול הערכה ביחס לגודל השגיאה האפשרית — הצגת מספר יחיד בלי טווח סטייה מפרה עיקרון זה. העיקרון על דיוק הטווח הקצר אינו אוסר תחזית שנתית, ובחינת השיטה לפני אימוץ עוסקת בשלב בחירת המודל ולא באופן הצגת התוצאה. (מצגת 2, שקף 31)"},
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"לפי המצגת, משני אילו מקורות נובעות בעיות הדיוק בתחזית?",o:["בחירת קריטריון השוואה שגוי, ומספר תקופות <bdi dir='ltr'>n</bdi> קטן מדי בממוצע הנע הפשוט או המשוקלל","אורך אופק התכנון שנבחר, ורמת הפירוט של המוצרים שנכללו בתחזית ביחס לאופק","אי-התאמת המודל למוצר, והשפעות חיצוניות (שנצפו ושלא נצפו) המטעות את הנתונים","שגיאות חישוב של העובדים במחשבון או באקסל, ואיסוף נתונים ממספר שנים גדול מדי"],c:2,e:"שקף 30 קובע שלמרות כל חיזוי קיימת בעיית דיוק, הנובעת משני מקורות: (1) האם המודל שהשתמשנו בו מתאים למוצר; (2) השפעות חיצוניות שנצפו וכאלה שלא נצפו שיכולות להטעות את הנתונים (משתנה חדש, מזג אוויר, טעם צרכנים, טכנולוגיה). קריטריון ההשוואה ו-<bdi dir='ltr'>n</bdi> הם החלטות בבחירת המודל, לא מקורות הדיוק שהמצגת מונה. (מצגת 2, שקפים 30–31)"},
/* --- מספר השנים לאיסוף נתונים --- */
{t:"חיזוי — שיטות ומדדים",s:"ניצן",q:"צוות אחד חוזה ביקוש לדגם סמארטפון וצוות אחר חוזה ביקוש לגבינת קוטג'. כמה תקופות עבר כדאי לכל צוות לאסוף, לפי המצגת?",o:["לשניהם אותו מספר — לפחות עשר שנים אחורה, כדי שהרגרסיה תצא מובהקת","לסמארטפון טווח קצר של נתונים, לקוטג' טווח ארוך — לפי רלוונטיות צריכת המוצר","לסמארטפון טווח ארוך כדי לתפוס את המגמה, לקוטג' טווח קצר כי הביקוש יציב","לשניהם מעט תקופות ככל האפשר, כי נתונים ישנים תמיד מטעים את המודל הכמותי"],c:1,e:"לפי שקף 35, מספר השנים שיש לאסוף נקבע לפי מידת הרלוונטיות של צריכת המוצר באותן תקופות: מוצרים טכנולוגיים כמו אייפון — טווח קצר; מוצרי בסיס כמו רכבת ישראל או גבינת קוטג' — טווח ארוך. בהרצאה: מוצר טכנולוגי שמשתנה מהר — מספר קטן של תקופות, מוצרי אוסם — מספר גדול; למטלה נדרשו לפחות שישה נתוני עבר. (מצגת 2, שקף 35; הרצאה 4.8)"}
]);

{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש החודשי למוצר:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>120</td><td>135</td><td>128</td><td>142</td><td>150</td><td>146</td></tr></table>מהי התחזית לחודש 7 בשיטת ממוצע נע פשוט עם <bdi dir='ltr'>N=2</bdi>?",o:["146.00","127.50","136.83","148.00"],c:3,e:"בממוצע נע עם <bdi dir='ltr'>N=2</bdi> התחזית היא ממוצע שתי התקופות האחרונות: <bdi dir='ltr'>F7 = (X5 + X6) / 2 = (150 + 146) / 2 = 148</bdi>.<br>טעויות נפוצות: ממוצע שלוש תקופות <bdi dir='ltr'>(N=3)</bdi> נותן 146; ממוצע כל התקופות נותן 136.83. (מצגת 2, שקף 22)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"מספר המתגייסים ליחידה בשש השנים האחרונות:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>מתגייסים</th><td>2,280</td><td>2,475</td><td>2,850</td><td>3,070</td><td>2,960</td><td>3,110</td></tr></table>מהי התחזית לשנה 7 בשיטת ממוצע נע פשוט עם <bdi dir='ltr'>N=3</bdi>?",o:["2,960.00","2,790.83","3,046.67","3,035.00"],c:2,e:"בממוצע נע עם <bdi dir='ltr'>N=3</bdi> ממצעים את שלוש השנים האחרונות: <bdi dir='ltr'>F7 = (3070 + 2960 + 3110) / 3 = 9140 / 3 = 3046.67</bdi>.<br>שים לב לא לבלבל עם התחזית לשנה 6, שמשתמשת בשנים 3–5 ויוצאת 2960. (מצגת 2, שקף 23)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש השבועי:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>48</td><td>52</td><td>50</td><td>55</td><td>53</td></tr></table>מחשבים תחזיות בשיטת ממוצע נע פשוט עם <bdi dir='ltr'>N=3</bdi> לכל התקופות האפשריות (כולל תקופות העבר), כדי לחשב <bdi dir='ltr'>MAD</bdi>. על כמה תקופות יחושב ה-<bdi dir='ltr'>MAD</bdi>?",o:["2 תקופות — תקופות 4 ו-5","3 תקופות — תקופות 3, 4 ו-5","5 תקופות — כל התקופות שבטבלה","6 תקופות — כולל התקופה החזויה"],c:0,e:"בממוצע נע עם <bdi dir='ltr'>N=3</bdi> אין תחזית לשלוש התקופות הראשונות (״מוחקים״ אותן), ולכן תחזיות בעבר קיימות רק לתקופות 4 ו-5. הסטיות, ומהן <bdi dir='ltr'>MAD</bdi> ו-<bdi dir='ltr'>MSE</bdi>, מחושבות רק על תקופות שיש להן גם תחזית וגם ביקוש בפועל — כאן <bdi dir='ltr'>n=2</bdi>. התחזית לתקופה 6 אינה נכנסת לחישוב, כי אין לה עדיין ערך בפועל. (מצגת 2, שקפים 23, 32; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>30</td><td>34</td><td>31</td><td>37</td><td>36</td></tr></table>חשבו את ה-<bdi dir='ltr'>MAD</bdi> של שיטת ממוצע נע פשוט עם <bdi dir='ltr'>N=2</bdi> על תקופות העבר שיש להן תחזית.",o:["8.42","2.50","1.50","7.50"],c:1,e:"תחזיות <bdi dir='ltr'>N=2</bdi>: <bdi dir='ltr'>F3 = (30+34)/2 = 32</bdi>, <bdi dir='ltr'>F4 = (34+31)/2 = 32.5</bdi>, <bdi dir='ltr'>F5 = (31+37)/2 = 34</bdi>.<br>סטיות מוחלטות: <bdi dir='ltr'>|31−32| = 1</bdi>, <bdi dir='ltr'>|37−32.5| = 4.5</bdi>, <bdi dir='ltr'>|36−34| = 2</bdi>.<br><bdi dir='ltr'>MAD = (1 + 4.5 + 2) / 3 = 7.5 / 3 = 2.5</bdi> — מחלקים ב-3 (מספר התקופות שיש להן תחזית), לא ב-5. (מצגת 2, שקפים 22, 32)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש החודשי:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>400</td><td>420</td><td>410</td><td>440</td><td>450</td></tr></table>מהי התחזית לחודש 6 בשיטת ממוצע נע משוקלל עם <bdi dir='ltr'>N=2</bdi>, לפי המוסכמה של ניצן: משקל 1 לתקופה האחרונה והפחתה של 10% לכל תקופה אחורה?",o:["846.00","445.00","444.74","445.26"],c:3,e:"המשקולות: לחודש 5 — 1, לחודש 4 — 0.9. <bdi dir='ltr'>F6 = (440×0.9 + 450×1) / (0.9 + 1) = (396 + 450) / 1.9 = 846 / 1.9 = 445.26</bdi>.<br>טעות נפוצה אחת היא לשכוח לחלק בסכום המשקולות (846). טעות אחרת היא להצמיד את המשקל 1 לתקופה הישנה (444.74). (מצגת 2, שקף 25; הרצאה 11.8)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>60</td><td>64</td><td>70</td><td>68</td><td>75</td><td>78</td></tr></table>מהי התחזית לתקופה 7 בשיטת ממוצע נע משוקלל עם <bdi dir='ltr'>N=3</bdi>, כשהמשקולות הן 1 לתקופה האחרונה והפחתה של 10% לכל תקופה אחורה (הפחתה ליניארית, כמו בשקף)?",o:["74.04","74.01","73.67","199.90"],c:0,e:"המשקולות לשלוש התקופות האחרונות: 0.8, 0.9, 1 (סכום 2.7). <bdi dir='ltr'>F7 = (68×0.8 + 75×0.9 + 78×1) / 2.7 = (54.4 + 67.5 + 78) / 2.7 = 199.9 / 2.7 = 74.04</bdi>.<br>ההפחתה ליניארית (1, 0.9, 0.8) ולא כפלית (1, 0.9, 0.81). כך בשקף 26 ובהרצאה: ״0.9, 0.8, 0.7, 0.6״. (מצגת 2, שקף 26; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>ביקוש</th><td>200</td><td>220</td><td>215</td><td>240</td></tr></table>הצוות בחר הפחתה של 15%. מהי התחזית לתקופה 5 בממוצע נע משוקלל עם <bdi dir='ltr'>N=3</bdi> (משקל 1 לתקופה האחרונה)?",o:["225.74","226.18","225.00","576.75"],c:1,e:"עם הפחתה של 15% המשקולות הן 1, 0.85 ו-0.7 (סכום 2.55). <bdi dir='ltr'>F5 = (220×0.7 + 215×0.85 + 240×1) / 2.55 = (154 + 182.75 + 240) / 2.55 = 576.75 / 2.55 = 226.18</bdi>.<br>בהרצאה 11.8: ״כמה זה 1 פחות 15%? 0.85. כמה זה 0.85 פחות 15%? 0.7״. (מצגת 2, שקף 26; הרצאה 11.8)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש ועמודת המשקולות, בדיוק כמו בשקף 26 (משקל 1 לתקופה האחרונה, והפחתה של 0.1 לכל תקופה אחורה):<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>40</td><td>44</td><td>50</td><td>48</td><td>54</td></tr><tr><th>משקל <bdi dir='ltr'>W</bdi><sub><bdi dir='ltr'>t</bdi></sub></th><td>0.60</td><td>0.70</td><td>0.80</td><td>0.90</td><td>1</td></tr></table>מהי התחזית <b>לתקופה 4</b> (תחזית עבר, לצורך חישוב הסטייה) בממוצע נע משוקלל עם <bdi dir='ltr'>N=3</bdi>?",o:["44.67","45.04","94.80","45.14"],c:3,e:"המשקל צמוד לתקופה ולא למיקום בחלון. לכן התחזית לתקופה 4 משתמשת במשקולות של תקופות 1–3: 0.6, 0.7 ו-0.8. <bdi dir='ltr'>F4 = (40×0.6 + 44×0.7 + 50×0.8) / (0.6+0.7+0.8) = (24 + 30.8 + 40) / 2.1 = 94.8 / 2.1 = 45.14</bdi>.<br>כך חושבו בשקף 26 תחזיות העבר, למשל <bdi dir='ltr'>F2016 = (1282×0.4 + 1447×0.5 + 1972×0.6) / 1.5 = 1613</bdi>. שימוש ב-1, 0.9 ו-0.8 לכל חלון נותן 45.04. (מצגת 2, שקפים 25–26)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>10</td><td>14</td><td>15</td><td>19</td><td>22</td></tr></table>נתון: <bdi dir='ltr'>Σx = 15, Σy = 80, Σxy = 269, Σx² = 55</bdi> (<bdi dir='ltr'>X</bdi> = מספר התקופה). מהו שיפוע קו הרגרסיה <bdi dir='ltr'>b</bdi>?",o:["5.48","4.89","2.90","7.30"],c:2,e:"<bdi dir='ltr'>b = (nΣxy − ΣxΣy) / (nΣx² − (Σx)²) = (5×269 − 15×80) / (5×55 − 15²) = (1345 − 1200) / (275 − 225) = 145 / 50 = 2.9</bdi>.<br>הביקוש עולה בממוצע ב-2.9 יחידות בכל תקופה. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"לאותם נתונים <bdi dir='ltr'>(n = 5, Σx = 15, Σy = 80)</bdi> התקבל שיפוע <bdi dir='ltr'>b = 2.9</bdi>. מהו החותך <bdi dir='ltr'>a</bdi>, ומהי התחזית לתקופה 6?",o:["<bdi dir='ltr'>a = 16</bdi>; התחזית לתקופה 6 היא 33.4","<bdi dir='ltr'>a = 7.3</bdi>; התחזית לתקופה 6 היא 24.7","<bdi dir='ltr'>a = 3</bdi>; התחזית לתקופה 6 היא 20.4","<bdi dir='ltr'>a = 7.3</bdi>; התחזית לתקופה 6 היא 21.8"],c:1,e:"<bdi dir='ltr'>ȳ = 80/5 = 16, x̄ = 15/5 = 3</bdi><br><bdi dir='ltr'>a = ȳ − b·x̄ = 16 − 2.9×3 = 7.3</bdi>.<br><bdi dir='ltr'>F6 = a + b×6 = 7.3 + 17.4 = 24.7</bdi>.<br>טעויות נפוצות: להשתמש ב-ȳ במקום <bdi dir='ltr'>a</bdi>, או להציב <bdi dir='ltr'>X=5</bdi> במקום <bdi dir='ltr'>X=6</bdi>. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"ביקוש שנתי למוצר ישן שהולך ויוצא מהשוק:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>ביקוש</th><td>200</td><td>190</td><td>185</td><td>170</td><td>160</td><td>155</td></tr></table>חשבו את קו הרגרסיה (<bdi dir='ltr'>X</bdi> = מספר התקופה) ואת התחזית לתקופה 7.",o:["209.67","275.67","143.67","153.10"],c:2,e:"<bdi dir='ltr'>Σx = 21, Σy = 1060, Σxy = 3,545, Σx² = 91</bdi>.<br><bdi dir='ltr'>b = (6×3,545 − 21×1060) / (6×91 − 21²) = (21,270 − 22,260) / 105 = -9.43</bdi><br><bdi dir='ltr'>a = 1060/6 − (-9.43)×3.5 = 209.67</bdi>.<br><bdi dir='ltr'>F7 = 209.67 + (-9.43)×7 = 143.67</bdi> — השיפוע שלילי, כי הביקוש יורד. (מצגת 2, שקפים 14, 20)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"לנתוני הביקוש <bdi dir='ltr'>10, 14, 15, 19, 22</bdi> (תקופות 1–5) נתון גם <bdi dir='ltr'>Σy² = 1366</bdi>. מהו מקדם המתאם <bdi dir='ltr'>R</bdi>, ומה משמעותו?",o:["<bdi dir='ltr'>R ≈ 2.9</bdi> — הקשר חזק מאוד, כי <bdi dir='ltr'>R</bdi> גדול מ-1","<bdi dir='ltr'>R ≈ 0.98</bdi> — זהו <bdi dir='ltr'>R²</bdi>, והקשר חלש","<bdi dir='ltr'>R ≈ 0.99</bdi> — קשר ליניארי חזק וחיובי","<bdi dir='ltr'>R ≈ −0.99</bdi> — קשר ליניארי חזק ושלילי"],c:2,e:"<bdi dir='ltr'>R = (nΣxy − ΣxΣy) / √[(nΣx² − (Σx)²)(nΣy² − (Σy)²)] = 145 / √(50 × (5×1366 − 80²)) = 145 / √(50×430) = 145 / 146.63 ≈ 0.99</bdi>.<br><bdi dir='ltr'>R</bdi> קרוב ל-1, ולכן הקשר הליניארי חזק וחיובי. ערכי <bdi dir='ltr'>R</bdi> נעים בין −1 ל-1, ובקורס עובדים עם <bdi dir='ltr'>R</bdi> ולא עם <bdi dir='ltr'>R²</bdi> (הרצאה 4.8). (מצגת 2, שקף 15)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"בדוגמת הכיתה (גיוס חרדים 2013–2019, <bdi dir='ltr'>X = 1..7</bdi>) התקבל קו הרגרסיה <bdi dir='ltr'>Y = 957.57 + 309.75X</bdi>. מהי התחזית לשנת 2020, ומה משמעות השיפוע?",o:["626,653 — הגיוס גדל בכ-958 מתגייסים בשנה","3,435.57 — הגיוס גדל בכ-310 מתגייסים בשנה","3,125.82 — הגיוס גדל בכ-310 מתגייסים בשנה","3,435.57 — הגיוס גדל בכ-958 מתגייסים בשנה"],c:1,e:"לשנת 2020 מציבים <bdi dir='ltr'>X=8</bdi> (ולא את השנה עצמה): <bdi dir='ltr'>F = 957.57 + 309.75×8 = 3435.57</bdi> — בשקף ״3436״. השיפוע <bdi dir='ltr'>b=309.75</bdi> הוא הגידול השנתי הממוצע, ו-<bdi dir='ltr'>a=957.57</bdi> הוא נקודת החיתוך. הצבת <bdi dir='ltr'>X=7</bdi> נותנת את תחזית 2019 (3125.82), והצבת 2020 במקום 8 נותנת מספר חסר משמעות. (מצגת 2, שקפים 19–20, 34)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"להלן הביקוש בפועל והתחזית של שיטה מסוימת:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>בפועל <bdi dir='ltr'>X</bdi><sub><bdi dir='ltr'>t</bdi></sub></th><td>100</td><td>110</td><td>105</td><td>115</td></tr><tr><th>תחזית <bdi dir='ltr'>F</bdi><sub><bdi dir='ltr'>t</bdi></sub></th><td>104</td><td>106</td><td>108</td><td>110</td></tr></table>מהו ה-<bdi dir='ltr'>MAD</bdi>, ומהו ה-<bdi dir='ltr'>MSE</bdi>?",o:["<bdi dir='ltr'>MAD = 16</bdi>; <bdi dir='ltr'>MSE = 66</bdi>","<bdi dir='ltr'>MAD = 4</bdi>; <bdi dir='ltr'>MSE = 16</bdi>","<bdi dir='ltr'>MAD = 4</bdi>; <bdi dir='ltr'>MSE = 16.50</bdi>","<bdi dir='ltr'>MAD = 0.50</bdi>; <bdi dir='ltr'>MSE = 16.50</bdi>"],c:2,e:"סטיות מוחלטות: 4, 4, 3, 5; ריבועיהן: 16, 16, 9, 25.<br><bdi dir='ltr'>MAD = (4+4+3+5)/4 = 16/4 = 4</bdi><br><bdi dir='ltr'>MSE = (16+16+9+25)/4 = 66/4 = 16.5</bdi>.<br>בלי ערך מוחלט הסטיות מתקזזות (0.5), וריבוע ה-<bdi dir='ltr'>MAD</bdi> אינו ה-<bdi dir='ltr'>MSE</bdi>. (מצגת 2, שקף 32)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"שתי שיטות חיזוי נבחנו על אותן ארבע תקופות:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>בפועל</th><td>50</td><td>54</td><td>52</td><td>58</td></tr><tr><th>שיטה א׳</th><td>51</td><td>52</td><td>55</td><td>56</td></tr><tr><th>שיטה ב׳</th><td>49</td><td>55</td><td>52</td><td>53</td></tr></table>איזו שיטה עדיפה לפי <bdi dir='ltr'>MAD</bdi>, ואיזו לפי <bdi dir='ltr'>MSE</bdi>?",o:["לפי <bdi dir='ltr'>MAD</bdi> — שיטה א׳ (2 מול 1.75); לפי <bdi dir='ltr'>MSE</bdi> — שיטה ב׳ (6.75 מול 4.5)","שיטה ב׳ עדיפה בשני המדדים (<bdi dir='ltr'>MAD</bdi> של 1.75 מול 2, ו-<bdi dir='ltr'>MSE</bdi> של 4.5 מול 6.75)","שיטה א׳ עדיפה בשני המדדים (<bdi dir='ltr'>MAD</bdi> של 2 מול 1.75, ו-<bdi dir='ltr'>MSE</bdi> של 4.5 מול 6.75)","לפי <bdi dir='ltr'>MAD</bdi> — שיטה ב׳ (1.75 מול 2); לפי <bdi dir='ltr'>MSE</bdi> — שיטה א׳ (4.50 מול 6.75)"],c:3,e:"שיטה א׳: סטיות 1, 2, 3, 2 — <bdi dir='ltr'>MAD = 8/4 = 2</bdi>, <bdi dir='ltr'>MSE = (1+4+9+4)/4 = 4.5</bdi>.<br>שיטה ב׳: סטיות 1, 1, 0, 5 — <bdi dir='ltr'>MAD = 7/4 = 1.75</bdi>, <bdi dir='ltr'>MSE = (1+1+0+25)/4 = 6.75</bdi>.<br>ה-<bdi dir='ltr'>MSE</bdi> מעניש סטייה גדולה אחת (5) יותר מה-<bdi dir='ltr'>MAD</bdi>, ולכן השיטות מתחלפות. בוחרים קריטריון אחד מראש ומאמצים את השיטה שממזערת אותו. (מצגת 2, שקפים 32–33)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"טבלת ההשוואה של חמש שיטות על אותם נתונים:<br><table><tr><th>שיטה</th><th><bdi dir='ltr'>MAD</bdi></th><th><bdi dir='ltr'>MSE</bdi></th></tr><tr><td>רגרסיה</td><td>18.4</td><td>512</td></tr><tr><td>ממוצע נע <bdi dir='ltr'>N=2</bdi></td><td>15.2</td><td>401</td></tr><tr><td>ממוצע נע <bdi dir='ltr'>N=3</bdi></td><td>21.7</td><td>655</td></tr><tr><td>משוקלל <bdi dir='ltr'>N=2</bdi></td><td>14.8</td><td>389</td></tr><tr><td>משוקלל <bdi dir='ltr'>N=3</bdi></td><td>19.9</td><td>590</td></tr></table>באיזו שיטה יש לבחור לפי כלל הבחירה במצגת?",o:["רגרסיה — השיטה המתאימה תמיד לנתונים שיש בהם מגמה עולה","ממוצע נע משוקלל <bdi dir='ltr'>N=2</bdi> — הנמוך ביותר גם ב-<bdi dir='ltr'>MAD</bdi> וגם ב-<bdi dir='ltr'>MSE</bdi>","ממוצע נע <bdi dir='ltr'>N=3</bdi> — הגבוה ביותר בשני המדדים, ולכן השמרני ביותר","ממוצע נע <bdi dir='ltr'>N=2</bdi> — השני בדירוג בשני המדדים, ולכן היציב ביותר"],c:1,e:"לפי שקף 33, המודל הנבחר הוא זה שמביא את הקריטריון (<bdi dir='ltr'>MAD</bdi> או <bdi dir='ltr'>MSE</bdi>) למינימום. כאן הממוצע המשוקלל עם <bdi dir='ltr'>N=2</bdi> נמוך ביותר בשניהם (14.8 ו-389), ולכן ההכרעה ברורה. הרגרסיה אינה עדיפה ״תמיד״: בהרצאה נאמר שלא בטוח שהיא טובה יותר מהממוצע הנע, ולכן משווים. (מצגת 2, שקפים 33–34; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"נתוני הביקוש:<br><table><tr><th>תקופה</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>ביקוש</th><td>80</td><td>86</td><td>83</td><td>90</td><td>88</td></tr></table>חשבו את ה-<bdi dir='ltr'>MSE</bdi> של שיטת ממוצע נע פשוט עם <bdi dir='ltr'>N=2</bdi>.",o:["32.50","10.83","2.33","6.50"],c:1,e:"תחזיות: <bdi dir='ltr'>F3 = (80+86)/2 = 83</bdi>, <bdi dir='ltr'>F4 = (86+83)/2 = 84.5</bdi>, <bdi dir='ltr'>F5 = (83+90)/2 = 86.5</bdi>.<br>סטיות: <bdi dir='ltr'>|83−83| = 0</bdi>, <bdi dir='ltr'>|90−84.5| = 5.5</bdi>, <bdi dir='ltr'>|88−86.5| = 1.5</bdi>.<br><bdi dir='ltr'>MSE = (0² + 5.5² + 1.5²) / 3 = (0 + 30.25 + 2.25) / 3 = 32.5 / 3 = 10.83</bdi>. (מצגת 2, שקפים 22, 32)",k:"calc"},
{t:"חיזוי — חישובים",s:"הקלטות",q:"במטלה משווים חמש שיטות על שש תקופות נתונים <bdi dir='ltr'>(X = 1..6)</bdi>. על כמה תקופות מחושבים ה-<bdi dir='ltr'>MAD</bdi> וה-<bdi dir='ltr'>MSE</bdi> בכל שיטה?",o:["רגרסיה — 6; <bdi dir='ltr'>N=2</bdi> — 4; <bdi dir='ltr'>N=3</bdi> — 3 (גם במשוקללים)","בכל השיטות — 6 תקופות, כדי שההשוואה תהיה הוגנת","רגרסיה — 7; <bdi dir='ltr'>N=2</bdi> — 5; <bdi dir='ltr'>N=3</bdi> — 4 (כולל התקופה החזויה)","רגרסיה — 6; <bdi dir='ltr'>N=2</bdi> — 2; <bdi dir='ltr'>N=3</bdi> — 3 (לפי מספר התקופות בחלון)"],c:0,e:"ברגרסיה יש תחזית לכל התקופות בעבר <bdi dir='ltr'>(in-sample)</bdi>, ולכן <bdi dir='ltr'>n=6</bdi>. בממוצע נע עם <bdi dir='ltr'>N=2</bdi> אין תחזית לשתי התקופות הראשונות, ולכן <bdi dir='ltr'>n=4</bdi>; עם <bdi dir='ltr'>N=3</bdi> — <bdi dir='ltr'>n=3</bdi>. כך גם בממוצעים המשוקללים. בדוגמת הכיתה (7 שנים): הרגרסיה על 7, <bdi dir='ltr'>N=2</bdi> על 5, ו-<bdi dir='ltr'>N=3</bdi> על 4. תקופת החיזוי עצמה לא נכנסת, כי אין לה ערך בפועל. (מצגת 2, שקפים 20–26; הרצאה 28.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"ניצן",q:"הגישה הנאיבית: המכירות בחודשים ינואר–אפריל היו 48, 52, 47, 55. מה התחזית למאי, ומה הייתה התחזית לאפריל?",o:["למאי — 55; לאפריל — 47","למאי — 50.5; לאפריל — 49","למאי — 51; לאפריל — 47","למאי — 55; לאפריל — 55"],c:0,e:"בגישה הנאיבית התחזית לתקופה הבאה שווה לביצוע בתקופה שחלפה: <bdi dir='ltr'>F(מאי) = X(אפריל) = 55</bdi>, ו-<bdi dir='ltr'>F(אפריל) = X(מרץ) = 47</bdi>. ממוצע התקופות (50.5) הוא ממוצע נע, לא הגישה הנאיבית. (מצגת 2, שקף 7)",k:"calc"},
{t:"חיזוי — חישובים",s:"הקלטות",q:"בהרצאה (21.7) נבדק הקשר בין הטמפרטורה השבועית הממוצעת לבין מכירות בגדי ים:<br><table><tr><th>שבוע</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>טמפרטורה <bdi dir='ltr'>(X)</bdi></th><td>22</td><td>28</td><td>30</td><td>40</td><td>26</td></tr><tr><th>בגדי ים <bdi dir='ltr'>(Y)</bdi></th><td>400</td><td>450</td><td>420</td><td>600</td><td>300</td></tr></table>נתון: <bdi dir='ltr'>Σx = 146, Σy = 2,170, Σxy = 65,800, Σx² = 4,444</bdi>. מהו השיפוע <bdi dir='ltr'>b</bdi> של קו הרגרסיה?",o:["40.58","14.81","14.88","13.47"],c:3,e:"זו רגרסיה סיבתית: <bdi dir='ltr'>X</bdi> הוא המשתנה המסביר (הטמפרטורה) ו-<bdi dir='ltr'>Y</bdi> המשתנה המוסבר (המכירות), לא מספר התקופה.<br><bdi dir='ltr'>b = (5·65,800 − 146·2,170) / (5·4,444 − 146²) = (329,000 − 316,820) / (22,220 − 21,316) = 12,180 / 904 = 13.47</bdi>.<br><bdi dir='ltr'>a = 2,170/5 − 13.47·146/5 = 434 − 393.43 = 40.58</bdi> (במחשבון בהרצאה: 40.575…, ונקרא 40.57). 14.81 — <bdi dir='ltr'>Σxy/Σx²</bdi>; 14.88 — בלי <bdi dir='ltr'>n</bdi> בנוסחה; 40.58 — החותך <bdi dir='ltr'>a</bdi> ולא השיפוע. (הרצאה 21.7)",k:"calc"},
{t:"חיזוי — חישובים",s:"הקלטות",q:"בדוגמת ההרצאה (21.7) התקבל קו הרגרסיה בין הטמפרטורה <bdi dir='ltr'>(X)</bdi> לבין מכירות בגדי הים <bdi dir='ltr'>(Y)</bdi>: <bdi dir='ltr'>a = 40.57, b = 13.47, R = 0.83</bdi>. השירות המטאורולוגי צופה לשבוע הבא טמפרטורה ממוצעת של 24 מעלות. כמה בגדי ים לחזות (ולהזמין מהספק)?",o:["363.85","323.28","987.15","434.00"],c:0,e:"<bdi dir='ltr'>Y = a + b·X = 40.57 + 13.47·24 = 40.57 + 323.28 = 363.85</bdi> — כ-364 בגדי ים. במודל סיבתי מציבים את ערך המשתנה המסביר (התחזית לטמפרטורה), לא את מספר התקופה. <bdi dir='ltr'>R = 0.83</bdi> — ״ציון גבוה שמעיד שהרגרסיה טובה לחיזוי״. 323.28 — שכחת <bdi dir='ltr'>a</bdi>; 987.15 — החלפת <bdi dir='ltr'>a</bdi> ו-<bdi dir='ltr'>b</bdi>; 434 — ממוצע המכירות. (הרצאה 21.7)",k:"calc"}
]);

BANK.push.apply(BANK,[
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי מצגת האינטגרציה, מהם שלושת השלבים בהתפתחות שרשרת אספקה אינטגרטיבית, לפי הסדר?",o:["ישויות נפרדות ← שרשרת אספקה אינטגרטיבית ← אינטגרציה פנימית","אינטגרציה פנימית ← ישויות נפרדות ← שרשרת אספקה אינטגרטיבית","אינטגרציה עם ספקים ← אינטגרציה עם לקוחות ← אינטגרציה פנימית","ישויות נפרדות ← אינטגרציה פנימית ← שרשרת אספקה אינטגרטיבית"],c:3,e:"שלב א׳ — ישויות נפרדות: רכש, תפעול והפצה פועלים כל אחד לעצמו. שלב ב׳ — אינטגרציה פנימית: הפונקציות בתוך הארגון מחוברות. שלב ג׳ — שרשרת הספקה אינטגרטיבית: גם הספקים והלקוחות מחוברים לאותה מערכת. (מצגת 1, שקף 5)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"מחקר שהוצג במצגת <bdi dir='ltr'>(Journal of Business Logistics)</bdi> בחן עיכובים ושגיאות במידע בשרשרת האספקה. מה נמצא?",o:["שגיאות במידע מגדילות את רווחי הספקים בכ-10%, כי הם מוכרים יותר מלאי ביטחון לקמעונאים","עיכוב במידע משפיע רק על הספק ולא על הקמעונאי, ושגיאות במידע מצמצמות את רווחיו בכ-50%","שגיאות במידע מצמצמות את רווחי הספקים בכ-10%, ועדכון שעתי מקטין עיכובים","שגיאות במידע פוגעות רק בקמעונאי, ועדכון מידי שעה אינו משפר דבר לעומת עדכון יומי"],c:2,e:"שקף 7: שגיאות במידע מצמצמות את רווחי הספקים בכ-10%; עיכוב במידע משפיע הן על הקמעונאי והן על הספק; ועדכון מערכות המידע מידי שעה מקטין את העיכובים באופן משמעותי יחסית לעדכון ברמה יומית <bdi dir='ltr'>(Angulo, 2004)</bdi>. (מצגת 1, שקף 7)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"מהי הגדרת אפקט שוט השור <bdi dir='ltr'>(Bullwhip Effect)</bdi> לפי מצגת האינטגרציה?",o:["הפער בין הנתונים החזויים לנתונים בפועל קבוע לאורך השרשרת, ולכן אין צורך במלאי ביטחון","התנודות בביקוש הולכות וקטנות ככל שמתקדמים במעלה הזרם, כי הספקים הגדולים מחזיקים יותר מלאי וסופגים אותן","התנודות הנובעות מהפער בין הנתונים החזויים לנתונים בפועל הולכות וגדלות ככל שמתקדמים במעלה הזרם","התנודות הנובעות מהפער בין החזוי לבפועל גדלות ככל שמתקדמים במורד הזרם, לכיוון הלקוח"],c:2,e:"שקף 8 (דינמיקת רשת האספקה): התנודות הנובעות מהפער בין הנתונים החזויים לבין הנתונים בפועל הולכות וגדלות ככל שמתקדמים במעלה הזרם — מהלקוח לכיוון הקמעונאי, המפיץ, היצרן וספק חומרי הגלם. (מצגת 1, שקף 8)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"במצגת מחולקים גורמי הדינמיקה ברשת האספקה לגורמים חיצוניים ולגורמים פנימיים. איזה שיוך נכון?",o:["התארכות זמני אספקה — פנימי; מידע שגוי — חיצוני","שינויים בתמהיל הייצור — פנימי; שינויים הנדסיים — חיצוני","שינויים בתמהיל הייצור — חיצוני; שינויים הנדסיים — פנימי","שינויים בקצב הצריכה — פנימי; סטיות מתחזיות — חיצוני"],c:2,e:"גורמים חיצוניים: שינויים בקצב הצריכה ליחידת זמן, שינויים בתמהיל הייצור, התארכות בזמני אספקה (שביתות, אמינות). גורמים פנימיים: שינויים הנדסיים, מידע שגוי וסטיות מתחזיות. (מצגת 1, שקף 9)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי המצגת, מהי ההכרה העקרונית שעומדת בבסיס פתרון האינטגרציה?",o:["שהתחרות העתידית היא בין פירמות בודדות, ולכן כל ארגון ימקסם את רווחיו לבד","שהתחרות העתידית היא בין שרשראות אספקה, ולא בין פירמות בודדות","שיש לצמצם כל רובד בשרשרת לספק יחיד, כדי לחסוך בעלויות","שהאינטגרציה נחוצה רק בתוך הארגון, ולא מול ספקים ולקוחות"],c:1,e:"הפתרון — אינטגרציה: הגדרת מערכות היחסים מחדש בין הגורמים במעלה ובמורד השרשרת, והכרה שהתחרות העתידית היא בין שרשראות האספקה ולא בין פירמות. (מצגת 1, שקף 10)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"איזה מהבאים אינו חלק מתכולת פתרון האינטגרציה, כפי שהוצגה במצגת?",o:["שיתוף בסיכונים ובסיכויים בין כל מרכיבי השרשרת","שיתוף מידע שוטף בין הארגון לספקים <bdi dir='ltr'>(VMI/CMI)</bdi>","הקמת צוותים רב-תחומיים בין מרכיבי השרשרת","העדפת עבודה בגישת הדחיפה על פני גישת המשיכה"],c:3,e:"בתכולת הפתרון מופיעה עדיפות לעבודה בגישת המשיכה על פני הדחיפה — ההפך מהתשובה. שאר הסעיפים מופיעים: מערכות מידע אינטגרטיביות, שיתוף מידע עם ספקים <bdi dir='ltr'>(VMI/CMI)</bdi>, שיתוף בסיכונים ובסיכויים, מדיניות אחידה, צוותים רב-תחומיים, ומידע בזמן אמת שמאפשר <bdi dir='ltr'>JIT</bdi>. (מצגת 1, שקף 11)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי המצגת, מה מאפשר מידע בזמן אמת בשרשרת אספקה אינטגרטיבית?",o:["מעבר מגישת המשיכה לגישת הדחיפה","עבודה בשיטת <bdi dir='ltr'>JIT</bdi> ותכנון נכון","הגדלת מלאי הביטחון בכל החוליות","ויתור על תחזיות לטווח הקצר"],c:1,e:"שקפים 11–12: מידע בזמן אמת מאפשר עבודה ב-<bdi dir='ltr'>JIT</bdi> ומאפשר תכנון נכון; התוצאה — זרימת חומרים חלקה יותר, ומתאם גבוה בין ביקוש להיצע. (מצגת 1, שקפים 11–12)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי המצגת, מה התוצאה של מתאם גבוה בין ביקוש להיצע, שמושג באמצעות אינטגרציה?",o:["זמינות גבוהה, אך עלויות מלאי גבוהות","זמינות גבוהה, יחד עם חיסכון בעלויות","חיסכון בעלויות, אך ירידה בזמינות","הגדלת תנודות הביקוש במעלה הזרם"],c:1,e:"שקף 12: מתאם גבוה בין ביקוש להיצע — זמינות גבוהה וחיסכון בעלויות. כלומר האינטגרציה מאפשרת לצאת מ״קונפליקט המלאי״ (זמינות מול עלות) ולהשיג את שניהם. (מצגת 1, שקף 12)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי המצגת, מהו הקושי העיקרי ביישום אינטגרציה בשרשרת האספקה, ומה נדרש כדי להתמודד איתו?",o:["קיבעון מחשבתי בקרב השחקנים — נדרש תהליך של ניהול שינויים","חוסר בכוח אדם טכני — נדרשת הגדלת מחלקת הרכש","עלות גבוהה של מערכות מידע — נדרש מימון חיצוני","מחסור בספקים מקומיים — נדרש מעבר לספקים בסין"],c:0,e:"שקף 13 (הקושי העיקרי): התמודדות עם קיבעון מחשבתי בקרב השחקנים; יש צורך בהפעלת תהליך של ניהול השינויים. (מצגת 1, שקף 13)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"בחברת דל <bdi dir='ltr'>(Dell)</bdi> זוהתה בעיה: קצב התיישנות הטכנולוגיה מהיר, בעוד ייצור מחשב אורך חודשיים. מה היה החידוש?",o:["ייצור לפי הזמנה (כמו חליפה) בשיטת <bdi dir='ltr'>JIT</bdi>, עם ספקים קרובים על פני ספקים סיניים","ייצור מלאי גדול מראש לפי תחזית, עם ספקים סיניים זולים על פני ספקים קרובים","מיקור חוץ מלא של הייצור לסין, כדי לקצר את זמן הייצור לחודש אחד","צמצום מגוון הדגמים והגדלת מלאי הרכיבים, כדי למנוע התיישנות"],c:0,e:"שקף 14: החידוש — מוצרים לפי הזמנה (״חליפה״); השיטה — <bdi dir='ltr'>JIT</bdi> ובחירה בספקים קרובים בעדיפות על פני הספקים הסיניים. כך המחשב לא ״מתיישן״ על המדף. (מצגת 1, שקף 14)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"באירוע דל מחשבים, מה הייתה אחת התוצאות הפיננסיות של המעבר לייצור לפי הזמנה?",o:["השגת פערי אשראי חיוביים ותזרים מזומנים חיובי","העלאת מחירי המחשבים בגלל עלות הספקים הקרובים","הגדלת מלאי המוצרים הגמורים כדי לקצר את זמן האספקה","ויתור על בקרת האיכות כדי לקצר את זמן הייצור"],c:0,e:"שקפים 15–16: התוצאה — סיפוק ביקושים בזמן הנכון, שיפור התגובתיות והשגת פערי אשראי חיוביים (הלקוח משלם לפני שהחברה משלמת לספקים). הזרזים יוצרי הערך: מערכות מידע אינטגרטיביות, בקרת איכות מתמדת ותזרים מזומנים חיובי. (מצגת 1, שקפים 15–16)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"לפי המצגת, מהו ״ניהול שרשרת האספקה״?",o:["ניהול המחסנים וההובלות של הארגון בלבד, מרגע קבלת חומרי הגלם ועד משלוח המוצר המוגמר ללקוח הסופי","ניהול מחלקת הרכש של הארגון מול ספקי רובד א׳ בלבד, כולל מכרזים, חוזי מסגרת שנתיים ובקרת חשבוניות","תכנון וניהול הפעילויות של שיתוף פעולה ותיאום בין השותפים בשרשרת: מיקור, רכש, עיבוד ולוגיסטיקה","ניהול קשרי הלקוחות של הארגון <bdi dir='ltr'>(CRM)</bdi>, לצורך הגדלת המכירות ונאמנות הלקוחות לאורך כל מחזור חיי המוצר"],c:2,e:"שקף 3: ניהול שרשרת האספקה — תכנון וניהול של כל הפעילויות הכרוכות בשיתוף הפעולה ובתיאום בין כל השותפים בשרשרת: מיקור, רכש, עיבוד וניהול הלוגיסטיקה. השותפים: שחקנים ראשיים (ספקים, יצרנים, לקוחות) ושחקני משנה (מתווכים, מיקור חוץ). (מצגת 1, שקף 3)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"מי הם ״שחקני המשנה״ בשרשרת האספקה, לפי המצגת?",o:["מתווכים וגורמי מיקור חוץ","ספקי רובד ב׳ בלבד","ספקים, יצרנים ולקוחות סופיים","הלקוחות הסופיים בלבד"],c:0,e:"שקף 3: השותפים בשרשרת הם שחקנים ראשיים — ספקים, יצרנים והלקוחות — ושחקני משנה — מתווכים ומיקור חוץ. (מצגת 1, שקף 3)"},
{t:"אינטגרציה ושוט השור",s:"ניצן",q:"בשרשרת האספקה של דלת מכונית שהוצגה במצגת, איזו חוליה באה מיד אחרי ״חברת הברזל — ייצור משטחי ברזל״?",o:["מפעל הברזל — ייצור מטילי מתכת","סוכנות הרכב — הכנות למסירה","יצרן הרכב — ייצור הרכב","ספק לתעשיית הרכב — יציקת דלת"],c:3,e:"הסדר בשקף 4: מכרה (חפירת עופרת ברזל) ← מפעל הברזל (מטילי מתכת) ← חברת הברזל (משטחי ברזל) ← ספק לתעשיית הרכב (יציקת דלת) ← יצרן הרכב (ייצור) ← סוכנות רכב (התקנות והכנות למסירה) ← לקוח סופי (נהיגה ברכב). (מצגת 1, שקף 4)"}
]);
